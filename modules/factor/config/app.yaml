database:
  type: sqlite
  path: ./data/factor/factor.db
  max_idle_conns: 10
  max_open_conns: 30
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

storage:
  gateway_target: "ip://127.0.0.1:11003"
  gateway_node_id: ""
  key_id: "factor"
  hmac_key_file: ""

eventbus:
  urls:
    - nats://127.0.0.1:4222
  credential_file: ~/.config/moox/eventbus/factor-eventbus.yaml
  fetch_max_wait: 1s

engine:
  python_bin: python3
  worker_path: ./pyworker/worker.py
  factors_dir: ./factors
  workers: 8
  task_timeout_ms: 30000

scheduler:
  event_batch_window_ms: 2000
  queue_capacity: 2048
  max_retry: 1
  view_settle_delay: 300ms
  event_read_retry: 3
  event_read_retry_interval: 500ms
