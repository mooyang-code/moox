# Timeseries consumes DatasetRowsUpserted; cross-section consumes MergePeriodCompleted ViewDataReady.
engine_id: factor-engine-1
database:
  type: sqlite
  path: ./data/factor-engine/runtime.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m
storage:
  gateway_target: ip://127.0.0.1:11003
  # Required: set the actual Storage gateway node ID before starting the engine.
  gateway_node_id: ""
  # Gateway HMAC uses the existing `factor` credential; Storage writes use AppId moox-factor-engine.
  key_id: factor
  hmac_key_file: ""
eventbus:
  urls: [nats://127.0.0.1:4222]
  credential_file: ~/.config/moox/eventbus/factor-engine-eventbus.yaml
  fetch_max_wait: 10s
  execution_timeout: 15m
  stall_threshold: 5m
  max_execution_attempts: 5
engine:
  python_bin: python3
  worker_path: ./pyworker/worker.py
  factors_dir: ./data/factor-engine/artifacts
  python_workers: 32
  view_read_workers: 2
  view_read_timeout_ms: 20000
  task_timeout_ms: 30000
  batch_enabled: true
cache:
  enabled: false
catalog_poll_interval: 30s
catalog_sync_timeout: 10m
definitions:
  - dataset_id: mdataset_binance_kline_1m
    space_id: crypto
    frequency: 1m
    merge_mode: system
    config_snapshot_id: snap-1
    key_contract:
      subject_id: subject_id
      frequency: frequency
      period_time: period_time
      series_tag: series_tag
      period_boundary: close
    sources:
      - dataset_id: dataset_binance_spot_kline_1m
        frequency: 1m
        period_boundary: close
        fields: [open, high, low, close, volume, quote_volume, trade_num]
      - dataset_id: dataset_binance_swap_kline_1m
        frequency: 1m
        period_boundary: close
        fields: [open, high, low, close, volume, quote_volume, trade_num]
