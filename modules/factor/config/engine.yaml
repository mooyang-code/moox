# moox-factor-engine 配置：引擎只做出站连接，相对路径相对于安装根目录（config 的上一级）
engine:
  # 稳定的引擎 ID；为空时取 factor-engine@<主机名>
  id: ""
  heartbeat_interval: 10s

# Storage 与 Factor Manager 共用同一固定 Access 及外部身份。
# key_file 相对本配置文件；其余运行文件相对安装根目录。
gateway_client:
  access_address: access.example.test:11004
  access_id: access@storage
  caller: factor-engine
  key_id: ""
  key_file: ../secrets/access-factor-engine.key

manager:
  timeout: 30s

# 按 UTC 对齐：每 interval 的第 offset 拉取一次目录
catalog_sync:
  interval: 1m
  offset: 45s
  state_file: ./data/engine/catalog.json

# Storage 请求体内的角色签名独立于 Access 身份。
storage:
  auth_secret_file: ./secrets/storage-primary-auth.secret

eventbus:
  urls:
    - tls://127.0.0.1:4222
  credential_file: ./secrets/factor-eventbus.yaml
  fetch_max_wait: 10s

# 表达式执行器：workers 是一次程序执行的并行度（默认 min(4, 核数)）；
# max_memory 是一个计算分块估算峰值内存的上限（默认 4GiB；默认因子 EMA 回看 5 万根，500 多个标的一期约需 1.1GB）。
compute:
  workers: 4
  max_memory: 4GiB

# 本地时序存储（Pebble，数据永不删除）：K 线先同步到这里，实时计算、补算、重算都从本地读，Storage 只补增量和修正。
seriesstore:
  dir: ./data/seriesstore
  block_cache: 512MiB           # Pebble 块缓存，计入进程内存预算

# 内存列式滑动窗口：每个数据源一份，保留任务内最大回看根数。max_memory 是所有窗口常驻内存的上限，
# 新启用的任务会超出时拒绝启用；0 表示不限制。初始化（moox-cli setup）按探测到的内存写入。
window:
  lookback: 50000               # 回看数量 N：任务内因子的回看都不能超过它（默认因子 EMA 最长 49995 根）
  max_memory: 0
  headroom: 0                   # 每个序列数组的余量根数，0 取窗口长度的 1/4（至少 16）

# 进程内存预算：常驻的窗口与块缓存先扣除，计算、重算向它预留；0 表示不限制。初始化按「总内存 × 60%」写入。
memory:
  total_budget: 0

# 与 Storage 的同步：每期只拉增量；follow_interval 是读取行变更日志、应用修正的间隔。
sync:
  workers: 4
  batch_subjects: 100           # 每批标的数，Storage 单次最多 100 个
  follow_interval: 30s

pipeline:
  write_batch_rows: 1000
  period_budget_min: 60s
  period_budget_max: 15m

recalc:
  chunk_periods: 500
  poll_interval: 5s

# 跳过账本与恢复：实时周期里标的本期数据取不到（上游失败、同步失败）、或内存窗口还没载入完成而跳过的结果，
# 账本永久记录，定时只填充重算。本地数据写入时保证连续，窗口里不会再有空洞。
gap:
  ledger_dir: ./data/gap        # 账本目录（按月一个 JSONL，永不自动删除），纳入备份
  sweep_interval: 5m
  settle: 5m                    # 发现后至少等这么久再尝试恢复，给自动补采留时间
  give_up_after: 6h             # 超过它仍补不上：记 gave_up 并告警，交给人工补采与补算
  max_groups_per_sweep: 20      # 每轮最多运行的恢复批数（区间相同的时序分组合并成一批，每批最多 100 个标的）
  max_span: 60                  # 每组一次最多处理的周期数，避免长时间占住任务锁

# 连续水位：每个任务从水位下一期逐期推进，前面有还没补到的周期（零提交、缺失超过阈值）就停住，不跳期。
watermark:
  state_file: ./data/engine/watermarks.json
  max_missing_ratio: 0.1        # 未确认缺失的失败标的 ÷ 期望标的超过它的周期阻塞水位
  task_ratios: {}                # 按任务 ID 覆盖阈值
  poll_interval: 10s            # 阻塞或落后时读回 Storage 继续推进的间隔（保底）
  max_periods: 30               # 一次推进最多处理的周期数

# 可变成员的取参：开算前向 FactorMgr 读取策略最近一次提交的参数，记成这一期的"进行中记录"并落盘后才开始计算，
# 这一期的完成标记写成功后才清掉；FactorMgr 不可达时用本地缓存的最近一次读到的值。
params:
  cache_file: ./data/engine/param_cache.json
  fetch_timeout: 5s             # 读取调用的最长等待（含重试），超时用缓存值
