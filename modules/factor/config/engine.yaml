# moox-factor-engine 配置：引擎只做出站连接，相对路径相对于安装根目录（config 的上一级）
engine:
  # 稳定的引擎 ID；为空时取 factor-engine@<主机名>
  id: ""
  heartbeat_interval: 10s

# Storage 与 Factor Manager 共用同一固定 Access 及外部身份。
# key_file 相对本配置文件；其余运行文件相对安装根目录。
gateway_client:
  access_address: access.example.test:11004
  access_id: access@storage
  caller: factor-engine
  key_id: ""
  key_file: ../secrets/access-factor-engine.key

manager:
  timeout: 30s

# 按 UTC 对齐：每 interval 的第 offset 拉取一次目录
catalog_sync:
  interval: 1m
  offset: 45s
  state_file: ./data/engine/catalog.json

# Storage 请求体内的角色签名独立于 Access 身份。
storage:
  auth_secret_file: ./secrets/storage-primary-auth.secret

eventbus:
  urls:
    - tls://127.0.0.1:4222
  credential_file: ./secrets/factor-eventbus.yaml
  fetch_max_wait: 10s

python:
  bin: ./venv/bin/python
  worker_path: ./pyworker/worker.py
  factors_dir: ./data/engine/factors
  workers: 8
  task_timeout: 30s

pipeline:
  read_batch_subjects: 100
  read_workers: 4
  read_timeout: 60s
  write_batch_rows: 1000
  period_budget_min: 60s
  period_budget_max: 15m

recalc:
  chunk_periods: 500
  poll_interval: 5s
