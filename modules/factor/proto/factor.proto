syntax = "proto3";

package trpc.moox.factor;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/factor/proto/factorgen;factorpb";

message FactorSet {
  string set_id = 1;
  string space_id = 2;
  string source_dataset_id = 3;
  string freq = 4;
  string subject_mode = 5;
  repeated string subjects = 6;
  string result_dataset_id = 7;
  string status = 8;
  string created_at = 9;
  string updated_at = 10;
}

message FactorDef {
  string factor_id = 1;
  string set_id = 2;
  string name = 3;
  string factor_type = 4;
  string source_code = 5;
  string source_hash = 6;
  repeated string input_columns = 7;
  repeated string outputs = 8;
  string params_json = 9;
  int32 lookback_periods = 10;
  bool allow_partial_universe = 11;
  string status = 12;
  string created_at = 13;
  string updated_at = 14;
}

message SetRunSummary {
  string set_id = 1;
  int64 last_period_time = 2;
  string last_status = 3;
  int64 lag_seconds = 4;
}

message FactorSetInfo {
  FactorSet factor_set = 1;
  repeated FactorDef factors = 2;
  SetRunSummary last_run = 3;
}

message RecalcJob {
  string job_id = 1;
  string request_id = 2;
  string set_id = 3;
  repeated string factor_ids = 4;
  repeated string subjects = 5;
  string start_time = 6;
  string end_time = 7;
  string status = 8;
  string progress_time = 9;
  string error = 10;
  string created_at = 11;
  string updated_at = 12;
}

message CreateFactorSetReq { FactorSet factor_set = 1; }
message CreateFactorSetRsp {
  common.RetInfo ret_info = 1;
  FactorSet factor_set = 2;
}

message UpdateFactorSetReq {
  string set_id = 1;
  string subject_mode = 2;
  repeated string subjects = 3;
}
message UpdateFactorSetRsp {
  common.RetInfo ret_info = 1;
  FactorSet factor_set = 2;
}

message SetFactorSetStatusReq {
  string set_id = 1;
  string status = 2;
}
message SetFactorSetStatusRsp {
  common.RetInfo ret_info = 1;
  FactorSet factor_set = 2;
}

message DeleteFactorSetReq {
  string set_id = 1;
  bool purge = 2;
}
message DeleteFactorSetRsp { common.RetInfo ret_info = 1; }

message GetFactorSetReq { string set_id = 1; }
message GetFactorSetRsp {
  common.RetInfo ret_info = 1;
  FactorSet factor_set = 2;
  repeated FactorDef factors = 3;
  SetRunSummary last_run = 4;
}

message ListFactorSetsReq {
  string status = 1;
  common.Page page = 2;
}
message ListFactorSetsRsp {
  common.RetInfo ret_info = 1;
  repeated FactorSetInfo factor_sets = 2;
  common.PageResult page_result = 3;
}

message CreateFactorReq { FactorDef factor = 1; }
message CreateFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message UpdateFactorReq { FactorDef factor = 1; }
message UpdateFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message SetFactorStatusReq {
  string factor_id = 1;
  string status = 2;
}
message SetFactorStatusRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message DeleteFactorReq { string factor_id = 1; }
message DeleteFactorRsp { common.RetInfo ret_info = 1; }

message GetFactorReq { string factor_id = 1; }
message GetFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message ListFactorsReq {
  string set_id = 1;
  string status = 2;
  common.Page page = 3;
}
message ListFactorsRsp {
  common.RetInfo ret_info = 1;
  repeated FactorDef factors = 2;
  common.PageResult page_result = 3;
}

message RecalcFactorsReq {
  string set_id = 1;
  repeated string factor_ids = 2;
  repeated string subjects = 3;
  string start_time = 4;
  string end_time = 5;
  string request_id = 6;
}
message RecalcFactorsRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message GetRecalcJobReq { string job_id = 1; }
message GetRecalcJobRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message CancelRecalcJobReq { string job_id = 1; }
message CancelRecalcJobRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message FactorLaneStatus {
  string set_id = 1;
  int32 queued = 2;
  bool active = 3;
}

message GetStatusReq {}
message GetStatusRsp {
  common.RetInfo ret_info = 1;
  bool consumer_running = 2;
  int32 python_workers = 3;
  int32 python_busy = 4;
  repeated FactorLaneStatus lanes = 5;
  repeated SetRunSummary recent_runs = 6;
}

service FactorMgr {
  rpc CreateFactorSet(CreateFactorSetReq) returns (CreateFactorSetRsp);
  rpc UpdateFactorSet(UpdateFactorSetReq) returns (UpdateFactorSetRsp);
  rpc SetFactorSetStatus(SetFactorSetStatusReq) returns (SetFactorSetStatusRsp);
  rpc DeleteFactorSet(DeleteFactorSetReq) returns (DeleteFactorSetRsp);
  rpc GetFactorSet(GetFactorSetReq) returns (GetFactorSetRsp);
  rpc ListFactorSets(ListFactorSetsReq) returns (ListFactorSetsRsp);
  rpc CreateFactor(CreateFactorReq) returns (CreateFactorRsp);
  rpc UpdateFactor(UpdateFactorReq) returns (UpdateFactorRsp);
  rpc SetFactorStatus(SetFactorStatusReq) returns (SetFactorStatusRsp);
  rpc DeleteFactor(DeleteFactorReq) returns (DeleteFactorRsp);
  rpc GetFactor(GetFactorReq) returns (GetFactorRsp);
  rpc ListFactors(ListFactorsReq) returns (ListFactorsRsp);
  rpc RecalcFactors(RecalcFactorsReq) returns (RecalcFactorsRsp);
  rpc GetRecalcJob(GetRecalcJobReq) returns (GetRecalcJobRsp);
  rpc CancelRecalcJob(CancelRecalcJobReq) returns (CancelRecalcJobRsp);
  rpc GetStatus(GetStatusReq) returns (GetStatusRsp);
}
