syntax = "proto3";

package trpc.moox.factor;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/factor/proto/factorgen;factorpb";

// 时间写法：墙钟时刻（*_at、*_since）是 int64 Unix 毫秒，0 表示没有；数据坐标（data_time 及其上下界、补算区间与进度、水位）
// 是 RFC3339 文本，周期（period_time、TimeRange）是 Unix 秒。

message FactorTask {
  string task_id = 1;
  string space_id = 2;
  string source_dataset_id = 3;
  string freq = 4;
  // name 是任务的展示名，直接用作 Storage 结果数据集的名称（含汉字、不超过 10 个字、空间内唯一）。
  string name = 5;
  string result_dataset_id = 7;
  string status = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  // bound_instance_id 是关联的策略实例：只有声明了 factor_params 的实例启用时关联（独占可变成员的参数提交），一个任务只关联一个实例，
  // 一个实例可以关联多个任务；写入后不能修改；为空表示没有关联（不调参的实例只读任务的列，不关联）。
  string bound_instance_id = 11;
}

// FactorParamDecl 是定义声明的一个可调参数（由编译 spec 派生，只读）。
message FactorParamDecl {
  string name = 1;
  string type = 2; // int 或 float
  double min = 3;
  double max = 4;
  double default_value = 5;
}

// FactorCategory 是因子分类：只是元数据，用于查找与按类展示，不进 definition_hash。
message FactorCategory {
  string category_id = 1;
  string name = 2;
  int32 sort_order = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message FactorDef {
  string factor_id = 1;
  string name = 3;
  // factor_type、input_columns、outputs、lookback_periods 由编译 spec 派生，只读：写请求中忽略。
  string factor_type = 4;
  repeated string input_columns = 7;
  repeated string outputs = 8;
  int32 lookback_periods = 10;
  bool allow_partial_universe = 11;
  int64 created_at = 13;
  int64 updated_at = 14;
  // definition_hash 是完整计算契约的指纹：expr 语义版本、规范程序文本与 allow_partial_universe；
  // 由管理端在读取时派生计算，不持久化。
  string definition_hash = 15;
  // spec 是因子定义文本（YAML：params / let / outputs），spec_hash 是它原文的 sha256。
  string spec = 16;
  string spec_hash = 17;
  string category_id = 18;
  // params 是 spec 声明的可调参数（派生，只读）。
  repeated FactorParamDecl params = 19;
  // udfs 是这份定义引用的自定义算子在本次编译所用的版本与元数据（只读，管理端读取时按启用版本解析）；
  // 随目录快照与补算任务下发，引擎据此编译。
  repeated UdfDef udfs = 20;
}

// UdfDef 是一个自定义算子版本的编译所需信息：manifest 是 wasm 自定义段里的语义元数据（JSON），doc、example 是说明。
message UdfDef {
  string name = 1;
  string hash = 2;
  string manifest = 3;
  string doc = 4;
  string example = 5;
}

message FactorUsage {
  string task_id = 1;
  string status = 2;
  string member_key = 3;
  // params 是成员的固定参数，或可变成员的默认参数。
  map<string, double> params = 4;
}

message FactorInfo {
  FactorDef factor = 1;
  // usages 只含调用方空间的引用；其他空间的引用只给数量，不暴露任务 ID。
  repeated FactorUsage usages = 2;
  // 其他空间引用这个因子的成员数，以及其中启用着的成员数（内部调用看到全量引用，这两个为 0）。
  uint32 other_space_usage_count = 3;
  uint32 other_space_enabled_count = 4;
}

// FactorMember 是定义在因子任务中的运行实例，身份是任务内唯一的成员键（因子 ID 加参数段，规则见 packages/factorname）。
message FactorMember {
  string task_id = 1;
  string factor_id = 2;
  string status = 3;
  FactorDef factor = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  string member_key = 7;
  // output_columns 是成员在结果数据集里的列名（由成员键和输出名推导，只读）。
  repeated string output_columns = 9;
  // params 是成员的固定参数，或可变成员的默认参数（完整参数，加成员时给定，之后不变）。
  map<string, double> params = 11;
  // kind 是成员类型：fixed 或 var。
  string kind = 12;
}

message FactorPeriodState {
  string factor_id = 1;
  string status = 2;
  // failed_subjects 是该成员本期失败的标的。放在周期明细（PeriodDetail）里时只记周期级 failed_subjects 之外多出来的部分，
  // 完整名单 = 周期级 failed_subjects ∪ 这里（还原用 packages/factorname.MemberFailedSubjects）；
  // 放在心跳 TaskRunSummary 里时是完整名单。
  repeated string failed_subjects = 3;
  string spec_hash = 4;
  string definition_hash = 5;
  string member_key = 7;
  // member_kind 是成员类型：fixed 或 var。
  string member_kind = 8;
}

// PeriodDetail 是因子结果数据集一期完成时放进 DatasetPeriodCompleted.detail 的明细（detail_type = moox.factor.PeriodDetail.v1）。
// Storage 与 View 只原样透传，Strategy 按 detail_type 解码后判断每个因子成员这一期是否可用。
// factors 里每个成员的 failed_subjects 只记周期级 failed_subjects 之外多出来的部分，读取方用 packages/factorname.MemberFailedSubjects 还原。
message PeriodDetail {
  string source_dataset_id = 1;
  repeated FactorPeriodState factors = 2;
}

message TaskRunSummary {
  string task_id = 1;
  int64 last_period_time = 2;
  string last_status = 3;
  int64 lag_seconds = 4;
  repeated FactorPeriodState factors = 5;
  repeated string failed_subjects = 6;
  // warming_subjects were left out of the period while their lookback window
  // loads; their results are not formal.
  int32 warming_subjects = 7;
  // completed_at 是引擎写完 last_period_time 这一期的时刻；0 表示未知。
  int64 completed_at = 8;
}

message FactorTaskInfo {
  FactorTask factor_task = 1;
  repeated FactorMember members = 2;
  TaskRunSummary last_run = 3;
}

message RecalcJob {
  string job_id = 1;
  string task_id = 3;
  repeated string members = 4;
  repeated string subjects = 5;
  string start_time = 6;
  string end_time = 7;
  string status = 8;
  string progress_time = 9;
  string error = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  // default_filled 是按默认参数新补的期次：原行不存在、或原行的 __params 里没有这个成员，只能用默认参数算出来，
  // 与当时的实时结果不保证一致。
  repeated MemberRanges default_filled = 14;
}

// TimeRange 是 Unix 秒的闭区间。
message TimeRange {
  int64 start = 1;
  int64 end = 2;
}

message MemberRanges {
  string member_key = 1;
  repeated TimeRange ranges = 2;
}

message CreateFactorTaskReq { FactorTask factor_task = 1; }
message CreateFactorTaskRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
}

message SetFactorTaskStatusReq {
  string task_id = 1;
  string status = 2;
}
message SetFactorTaskStatusRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
}

message DeleteFactorTaskReq {
  string task_id = 1;
  bool purge = 2;
}
message DeleteFactorTaskRsp { common.RetInfo ret_info = 1; }

// DeleteBoundTask 删除策略实例关联的任务（只给策略服务删除实例时用）：核对关联的实例 → 停用任务 → 删除全部成员 →
// 带 purge 删除结果数据集 → 删除任务记录。每一步都幂等，中途失败后重试能接着做完；任务不存在返回成功，
// 任务关联的不是 bound_instance_id（包括还没有关联任何实例）、有补算正在排队或执行时
// 拒绝（INVALID_PARAM），拒绝时什么也不改。
message DeleteBoundTaskReq {
  string task_id = 1;
  string bound_instance_id = 2;
  // check_only 为真时只做删除前的全部检查，不做任何修改：策略服务对实例的每个任务先查一遍，再开始删第一个。
  bool check_only = 3;
}
message DeleteBoundTaskRsp { common.RetInfo ret_info = 1; }

message GetFactorTaskReq { string task_id = 1; }
message GetFactorTaskRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
  repeated FactorMember members = 3;
  TaskRunSummary last_run = 4;
}

message ListFactorTasksReq {
  string status = 1;
  common.Page page = 2;
  // space_id 为可选过滤条件；带 X-Space-Id 请求头时须与请求头一致，未指定则返回调用方空间内的任务。
  string space_id = 3;
}
message ListFactorTasksRsp {
  common.RetInfo ret_info = 1;
  repeated FactorTaskInfo factor_tasks = 2;
  common.PageResult page_result = 3;
}

message CreateFactorReq { FactorDef factor = 1; }
message CreateFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

// ImportFactorCatalog 一次导入一个因子库目录：每个文件是 [{factor_id, name, category_id, category_name, spec,
// allow_partial_universe}] 列表（字段严格校验），factor_id 在全部文件内必须唯一。任一因子已存在或编译失败时整批拒绝，
// 什么都不写；带 category_name 的分类先建立或更新。
message FactorCatalogFile {
  string name = 1;     // 文件名，只用于报错定位
  string content = 2;  // YAML 原文
}
message ImportFactorCatalogReq { repeated FactorCatalogFile files = 1; }
message ImportFactorCatalogRsp {
  common.RetInfo ret_info = 1;
  repeated FactorDef factors = 2;
}

// PurgeResultDataset 删除一个孤立的因子结果数据集（行与元数据），例如重建因子库后遗留的旧结果。
// 只允许因子结果数据集；仍是某个因子任务的结果数据集时拒绝。
message PurgeResultDatasetReq {
  string space_id = 1;
  string dataset_id = 2;
}
message PurgeResultDatasetRsp { common.RetInfo ret_info = 1; }

message UpdateFactorReq { FactorDef factor = 1; }
message UpdateFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message AddTaskMemberReq {
  string task_id = 1;
  string factor_id = 2;
  // kind 是成员类型：fixed（固定参数）或 var（参数由关联的策略逐期提交）；为空按 fixed。
  string kind = 3;
  // params 是固定成员的固定参数，或可变成员的默认参数；没给的参数取定义的默认值。成员键由服务端推导并在响应里返回。
  map<string, double> params = 4;
}
message AddTaskMemberRsp {
  common.RetInfo ret_info = 1;
  FactorMember member = 2;
}

message RemoveTaskMemberReq {
  string task_id = 1;
  string member_key = 2;
}
message RemoveTaskMemberRsp { common.RetInfo ret_info = 1; }

message SetTaskMemberStatusReq {
  string task_id = 1;
  string member_key = 2;
  string status = 3;
}
message SetTaskMemberStatusRsp {
  common.RetInfo ret_info = 1;
  FactorMember member = 2;
}

message DeleteFactorReq { string factor_id = 1; }
message DeleteFactorRsp { common.RetInfo ret_info = 1; }

message GetFactorReq { string factor_id = 1; }
message GetFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
  // usages 只含调用方空间的引用；其他空间的引用只给数量。
  repeated FactorUsage usages = 3;
  uint32 other_space_usage_count = 4;
  uint32 other_space_enabled_count = 5;
}

message ListFactorsReq {
  string task_id = 1;
  string status = 2;
  common.Page page = 3;
  bool include_spec = 4;
}
message ListFactorsRsp {
  common.RetInfo ret_info = 1;
  repeated FactorInfo factors = 2;
  common.PageResult page_result = 3;
}

message RecalcFactorsReq {
  string task_id = 1;
  repeated string members = 2;
  repeated string subjects = 3;
  string start_time = 4;
  string end_time = 5;
  string job_id = 6;
}
message RecalcFactorsRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message ListRecalcJobsReq {
  string task_id = 1;
  repeated string statuses = 2;
  common.Page page = 3;
}
message ListRecalcJobsRsp {
  common.RetInfo ret_info = 1;
  repeated RecalcJob jobs = 2;
  common.PageResult page_result = 3;
}

message GetRecalcJobReq { string job_id = 1; }
message GetRecalcJobRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message CancelRecalcJobReq { string job_id = 1; }
message CancelRecalcJobRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message FactorRunnerStatus {
  string task_id = 1;
  int32 queued = 2;
  bool active = 3;
  // warmup_state is warming while some subjects lack a loaded lookback window
  // (after the engine starts or the set changes); their period results are
  // reported as failed subjects and are not consumed by strategies.
  string warmup_state = 4; // warming | ready
  int32 warm_subjects = 5;
  int32 expected_subjects = 6;
  // paused 表示引擎模块被有意停下（暂停，以及放行前的恢复追赶），任务因此不计算。
  // 管理端据此不再把它的结果数据集当作应当持续产出的数据，Monitor 也就不对暂停的任务做新鲜度检查。
  bool paused = 7;
  // checks 是引擎计算前对任务做的检查（本地窗口、数据覆盖、变更同步、回看数量、自定义算子模块等）：有 FAIL 项的任务不计算，
  // 引擎每 30 秒重查一次，窗口载入完成后立即重查。
  repeated FactorTaskCheck checks = 8;
}

// FactorTaskCheck 是因子任务的一项计算前检查。
message FactorTaskCheck {
  string name = 1;
  // PASS | WARN | FAIL；WARN 不挡计算。
  string status = 2;
  // message 是没通过的原因；remedy 是处理办法（例如要执行的命令）。
  string message = 3;
  string remedy = 4;
}

// EngineInfo describes the compute engine as last seen by moox-factor-mgr.
message EngineInfo {
  string engine_id = 1;
  string boot_id = 2;
  string version = 3;
  bool online = 4;
  int64 last_heartbeat_at = 5;
  string catalog_hash = 6;
  int64 catalog_synced_at = 7;
  bool catalog_in_sync = 8;
}

message GetStatusReq {}
message GetStatusRsp {
  common.RetInfo ret_info = 1;
  bool consumer_running = 2;
  repeated FactorRunnerStatus runners = 5;
  repeated TaskRunSummary recent_runs = 6;
  EngineInfo engine = 7;
  int32 compute_workers = 8;
  // engine_expr_version 是引擎上报的 expr 语义版本，manager_expr_version 是管理端自己的；两者不同时
  // 引擎与管理端算出的 definition_hash 不一致，策略会跳过。
  string engine_expr_version = 9;
  string manager_expr_version = 10;
  // lifecycle 是引擎上报的模块级生命周期状态；没有引擎上报时为空。
  EngineLifecycleStatus lifecycle = 11;
}

// 编译一份 spec，返回派生的元数据与诊断信息；控制台编辑器边写边校验。
message ValidateFactorSpecReq {
  string spec = 1;
  bool allow_partial_universe = 2;
  // factor_id 是这份定义的因子 ID；单输出因子的输出名就是因子 ID，所以要用它推导输出。为空时按草稿处理。
  string factor_id = 3;
  // udf_versions 是请求级的自定义算子版本覆盖（名称 → 版本哈希）：只作用于这次请求，用来校验还没有启用的版本。
  map<string, string> udf_versions = 4;
}
message FactorSpecDiagnostic {
  string path = 1;
  int32 doc_line = 2;
  int32 line = 3;
  int32 column = 4;
  string message = 5;
}
message ValidateFactorSpecRsp {
  common.RetInfo ret_info = 1;
  bool valid = 2;
  FactorSpecDiagnostic diagnostic = 3;
  string factor_type = 4;
  repeated string input_columns = 5;
  repeated string outputs = 6;
  int32 lookback_periods = 7;
  string canonical = 8;
  string definition_hash = 9;
  // params 是 spec 声明的可调参数。
  repeated FactorParamDecl params = 10;
}

// 在指定因子任务的源数据上试算：少量标的、最近若干期。管理端直接读 Storage 计算，不经过引擎。
message PreviewFactorReq {
  string task_id = 1;
  string spec = 2;
  repeated string subjects = 3; // 为空时取源数据集的前几个标的
  int32 periods = 4;            // 输出最近多少期，默认 20，最多 500
  bool allow_partial_universe = 5;
  // params 是试算用的参数快照（默认值加按标的覆盖）；为空时用定义的默认值。
  map<string, ParamValue> params = 6;
  // factor_id 是这份定义的因子 ID（单输出因子的输出名就是因子 ID）；为空时按草稿处理。
  string factor_id = 7;
  // udf_versions 是请求级的自定义算子版本覆盖（名称 → 版本哈希）：用未启用的版本试算。
  map<string, string> udf_versions = 8;
}
message PreviewRow {
  string subject_id = 1;
  string series_tag = 2;
  string data_time = 3;
  repeated double values = 4; // 与 columns 一一对应；null 时为 0，并在 nulls 中标为 true
  repeated bool nulls = 5;
}
message PreviewFactorRsp {
  common.RetInfo ret_info = 1;
  repeated string columns = 2;
  repeated PreviewRow rows = 3;
}

message FactorFunctionArg {
  string name = 1;
  string kind = 2; // number、series、bool、bool_series、window、integer、constant
  double min = 3;
  double max = 4;
  bool optional = 5;
  double default_value = 6;
}
message FactorFunction {
  string name = 1;
  string category = 2; // elementwise、timeseries、cross_section
  string signature = 3;
  string result = 4; // number 或 bool
  repeated FactorFunctionArg args = 5;
  string lookback = 6;
  string doc = 7;
  string example = 8;
}
message ListFactorFunctionsReq {}
message ListFactorFunctionsRsp {
  common.RetInfo ret_info = 1;
  repeated FactorFunction functions = 2;
  string expr_version = 3;
}

message ListFactorCategoriesReq {}
message ListFactorCategoriesRsp {
  common.RetInfo ret_info = 1;
  repeated FactorCategory categories = 2;
}

message UpsertFactorCategoryReq { FactorCategory category = 1; }
message UpsertFactorCategoryRsp {
  common.RetInfo ret_info = 1;
  FactorCategory category = 2;
}

message DeleteFactorCategoryReq { string category_id = 1; }
message DeleteFactorCategoryRsp { common.RetInfo ret_info = 1; }

message SetFactorCategoryReq {
  string factor_id = 1;
  string category_id = 2;
}
message SetFactorCategoryRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

// BindFactorTask 把任务与策略实例关联（独占，只给声明了 factor_params 的实例）：同一个实例重复调用直接成功，换一个实例则拒绝；
// 任务没有可变成员时拒绝；写入后不能修改或清空，只随 DeleteBoundTask 与任务一起删除。
message BindFactorTaskReq {
  string task_id = 1;
  string instance_id = 2;
}
message BindFactorTaskRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
}

// ParamValue 是一个参数一期的取值：默认值加按标的覆盖。
message ParamValue {
  double default_value = 1;
  map<string, double> overrides = 2;
}

// MemberParams 是一个可变成员的一份参数提交：参数名 → 取值（默认值加按标的覆盖）。
message MemberParams {
  string member_key = 1;
  map<string, ParamValue> params = 2;
}

// SubmitFactorParams 由关联的策略实例为可变成员提交参数。period_time 是参数从哪一期起生效的目标期（Unix 秒）：
// 目标期不能倒退；同一目标期下同一个 request_id 重复提交按幂等成功，不同 request_id 拒绝。
// 每次提交都是完整快照，整份替换上一期：这次没带覆盖的标的用默认值。
message SubmitFactorParamsReq {
  string writer = 1;
  string task_id = 2;
  int64 period_time = 3;
  string request_id = 5;
  repeated MemberParams members = 6;
}
message MemberSubmitResult {
  string member_key = 1;
  string result = 2; // accepted、duplicate、rejected
  string reason = 3;
}
message SubmitFactorParamsRsp {
  common.RetInfo ret_info = 1;
  repeated MemberSubmitResult results = 2;
}

// MemberParamState 是可变成员最近一次被接受的提交。
message MemberParamState {
  string member_key = 1;
  map<string, ParamValue> params = 2;
  int64 last_submitted_period = 3;
  string last_request_id = 4;
  int64 last_submitted_at = 5;
}

// GetFactorParams 只读：返回任务里各可变成员最近一次被接受的提交。
message GetFactorParamsReq { string task_id = 1; }
message GetFactorParamsRsp {
  common.RetInfo ret_info = 1;
  repeated MemberParamState members = 2;
}

service FactorMgr {
  rpc CreateFactorTask(CreateFactorTaskReq) returns (CreateFactorTaskRsp);
  rpc SetFactorTaskStatus(SetFactorTaskStatusReq) returns (SetFactorTaskStatusRsp);
  rpc DeleteFactorTask(DeleteFactorTaskReq) returns (DeleteFactorTaskRsp);
  rpc GetFactorTask(GetFactorTaskReq) returns (GetFactorTaskRsp);
  rpc ListFactorTasks(ListFactorTasksReq) returns (ListFactorTasksRsp);
  rpc CreateFactor(CreateFactorReq) returns (CreateFactorRsp);
  rpc ImportFactorCatalog(ImportFactorCatalogReq) returns (ImportFactorCatalogRsp);
  rpc PurgeResultDataset(PurgeResultDatasetReq) returns (PurgeResultDatasetRsp);
  rpc UpdateFactor(UpdateFactorReq) returns (UpdateFactorRsp);
  rpc DeleteFactor(DeleteFactorReq) returns (DeleteFactorRsp);
  rpc GetFactor(GetFactorReq) returns (GetFactorRsp);
  rpc AddTaskMember(AddTaskMemberReq) returns (AddTaskMemberRsp);
  rpc RemoveTaskMember(RemoveTaskMemberReq) returns (RemoveTaskMemberRsp);
  rpc SetTaskMemberStatus(SetTaskMemberStatusReq) returns (SetTaskMemberStatusRsp);
  rpc ListFactors(ListFactorsReq) returns (ListFactorsRsp);
  rpc RecalcFactors(RecalcFactorsReq) returns (RecalcFactorsRsp);
  rpc ListRecalcJobs(ListRecalcJobsReq) returns (ListRecalcJobsRsp);
  rpc GetRecalcJob(GetRecalcJobReq) returns (GetRecalcJobRsp);
  rpc CancelRecalcJob(CancelRecalcJobReq) returns (CancelRecalcJobRsp);
  rpc GetStatus(GetStatusReq) returns (GetStatusRsp);
  rpc ValidateFactorSpec(ValidateFactorSpecReq) returns (ValidateFactorSpecRsp);
  rpc PreviewFactor(PreviewFactorReq) returns (PreviewFactorRsp);
  rpc ListFactorFunctions(ListFactorFunctionsReq) returns (ListFactorFunctionsRsp);
  rpc ListFactorCategories(ListFactorCategoriesReq) returns (ListFactorCategoriesRsp);
  rpc UpsertFactorCategory(UpsertFactorCategoryReq) returns (UpsertFactorCategoryRsp);
  rpc DeleteFactorCategory(DeleteFactorCategoryReq) returns (DeleteFactorCategoryRsp);
  rpc SetFactorCategory(SetFactorCategoryReq) returns (SetFactorCategoryRsp);
  rpc BindFactorTask(BindFactorTaskReq) returns (BindFactorTaskRsp);
  rpc DeleteBoundTask(DeleteBoundTaskReq) returns (DeleteBoundTaskRsp);
  rpc SubmitFactorParams(SubmitFactorParamsReq) returns (SubmitFactorParamsRsp);
  rpc GetFactorParams(GetFactorParamsReq) returns (GetFactorParamsRsp);
  // 自定义算子（wasm UDF）：发布一个版本（未启用）、查看、切换启用版本。
  rpc PublishUdf(PublishUdfReq) returns (PublishUdfRsp);
  rpc ListUdfs(ListUdfsReq) returns (ListUdfsRsp);
  rpc GetUdf(GetUdfReq) returns (GetUdfRsp);
  rpc ActivateUdf(ActivateUdfReq) returns (ActivateUdfRsp);
}

// ---- 自定义算子（wasm UDF）

message PublishUdfReq {
  // package 是 .udfpkg（tar：module.wasm、manifest.json、fixtures/、report.json），整包不超过 2 MiB。
  bytes package = 1;
}
message PublishUdfRsp {
  common.RetInfo ret_info = 1;
  string name = 2;
  string hash = 3;
  // created 为假表示这个版本已经存在（只更新了说明与示例）。
  bool created = 4;
  // report 是服务端一致性测试报告（JSON）。
  string report = 5;
}

message UdfVersionInfo {
  string hash = 1;
  string name = 2;
  // manifest 是包内 manifest.json（语义元数据加说明、示例、来源）。
  string manifest = 3;
  string source_ref = 4;
  string sdk_version = 5;
  string toolchain = 6;
  string report = 7;
  int64 created_at = 8;
  bool active = 9;
}
message UdfInfo {
  string name = 1;
  string active_hash = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
  repeated UdfVersionInfo versions = 5;
  // referenced_by 是引用这个名称的因子定义 ID。
  repeated string referenced_by = 6;
  // modules 是引擎上报的各版本模块状态。
  repeated UdfModuleStatus modules = 7;
}
message ListUdfsReq {}
message ListUdfsRsp {
  common.RetInfo ret_info = 1;
  repeated UdfInfo udfs = 2;
}
message GetUdfReq {
  string name = 1;
}
message GetUdfRsp {
  common.RetInfo ret_info = 1;
  UdfInfo udf = 2;
}

message ActivateUdfReq {
  string name = 1;
  string hash = 2;
  // dry_run 只返回影响清单与各前提的检查结果，不修改任何东西。
  bool dry_run = 3;
}
message UdfImpact {
  string factor_id = 1;
  string old_definition_hash = 2;
  string new_definition_hash = 3;
  int32 old_lookback = 4;
  int32 new_lookback = 5;
  repeated string input_columns = 6;
  // members 是引用这个定义的成员（任务/成员键）。
  repeated string members = 7;
  // error 非空表示用新版本重新编译或成员校验失败。
  string error = 8;
}
message UdfPrerequisite {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}
message ActivateUdfRsp {
  common.RetInfo ret_info = 1;
  string name = 2;
  string old_hash = 3;
  string new_hash = 4;
  bool dry_run = 5;
  // applied 为真表示已经切换。
  bool applied = 6;
  repeated UdfImpact impacts = 7;
  repeated string tasks = 8;
  // instances 是受影响任务关联的策略实例：只有声明了 factor_params 的实例会关联任务，只读任务的实例不在其中。
  repeated string instances = 9;
  repeated UdfPrerequisite prerequisites = 10;
  repeated string notes = 11;
}

// UdfModuleStatus 是引擎上报的一个自定义算子模块（版本）的状态。
message UdfModuleStatus {
  string hash = 1;
  string name = 2;
  // state：ready 已拉取并编译、fetching 拉取中、fetch_failed 拉取失败、compile_failed 编译失败。
  string state = 3;
  string error = 4;
}

// FactorEngine is the internal contract between moox-factor-mgr and the
// outbound-only moox-factor-engine; only the factor-engine caller may use it.
message EngineIdentity {
  string engine_id = 1;
  string boot_id = 2;
  string version = 3;
}

message EngineMember {
  string member_key = 1;
  FactorDef factor = 2;
  // kind 是成员类型：fixed 或 var。
  string kind = 3;
  // params 是成员的固定参数，或可变成员的默认参数。
  map<string, double> params = 4;
}

message EngineTask {
  FactorTask factor_task = 1;
  repeated EngineMember members = 2;
  bool result_ready = 3;
  // source_seeding 为真表示源数据集正在首次接入的历史补齐：任务照常预载，但不计算、不出结果。
  bool source_seeding = 4;
}

message SyncEngineCatalogReq {
  EngineIdentity engine = 1;
  string known_hash = 2;
}
message SyncEngineCatalogRsp {
  common.RetInfo ret_info = 1;
  string catalog_hash = 2;
  bool not_modified = 3;
  repeated EngineTask tasks = 4;
  // existing_task_ids 是管理端库中当前存在的全部因子任务 ID（含停用与待创建任务），
  // 引擎据此区分“停用”与“已删除”，并清理已删除任务的本地水位、跳过账本与参数缓存。
  repeated string existing_task_ids = 5;
}

message EngineRuntimeStatus {
  bool consumer_running = 1;
  repeated FactorRunnerStatus runners = 4;
  repeated TaskRunSummary recent_runs = 5;
  string catalog_hash = 6;
  int64 catalog_synced_at = 7;
  int32 compute_workers = 8;
  string expr_version = 9;
  // watermarks 是各任务的连续水位：已连续算完到哪一期、已知的最新一期、是否阻塞在还没补到的周期上。
  repeated TaskWatermarkStatus watermarks = 10;
  // udf_modules 是引擎当前目录引用的各自定义算子模块的状态。
  repeated UdfModuleStatus udf_modules = 12;
  // lifecycle 是模块级生命周期状态：factor-mgr 把它代报给 Monitor。
  EngineLifecycleStatus lifecycle = 11;
  // ready 与 not_ready_reason 是引擎自己 /readyz 用的同一个就绪判断：引擎不经 packages/report 上报，由 factor-mgr 代报给 Monitor。
  bool ready = 13;
  string not_ready_reason = 14;
}

// EngineLifecycleStatus 是引擎模块自身的生命周期状态。
message EngineLifecycleStatus {
  // stage 是模块自身阶段（running、paused、resuming 等）。
  string stage = 1;
  // paused_since 是本次暂停开始的时刻，未暂停为 0。
  int64 paused_since = 2;
  // catchup_blocked 是恢复追赶的前置条件尚未满足的原因，满足或不在恢复追赶中为空。
  string catchup_blocked = 5;
  // pause_kind（manual、system）与 pause_reason 是本次暂停的类型与原因，未暂停为空。
  string pause_kind = 6;
  string pause_reason = 7;
  // catchup 是恢复追赶的进度（恢复追赶中才有）。
  common.CatchupProgress catchup = 8;
}

message TaskWatermarkStatus {
  string task_id = 1;
  string committed_through = 2;
  string target = 3;
  // blocked_since 非 0 表示水位阻塞（阻塞开始的时刻）：blocked_period 是卡住的那一期，blocked_reason 是原因（no_rows、missing_over_threshold、no_universe、compute_failed）。
  int64 blocked_since = 4;
  string blocked_period = 5;
  string blocked_reason = 6;
}

message EngineHeartbeatReq {
  EngineIdentity engine = 1;
  EngineRuntimeStatus status = 2;
}
message EngineHeartbeatRsp {
  common.RetInfo ret_info = 1;
  int64 lease_ttl_seconds = 2;
}

message PullRecalcJobReq { EngineIdentity engine = 1; }
message PullRecalcJobRsp {
  common.RetInfo ret_info = 1;
  bool found = 2;
  RecalcJob job = 3;
  EngineTask task = 5;
}

message ReportRecalcProgressReq {
  EngineIdentity engine = 1;
  string job_id = 2;
  string progress_time = 4;
  string status = 5;
  string error = 6;
  // default_filled 是引擎到目前为止累计的按默认参数新补的期次；为空表示这次没有变化，非空时整体替换。
  repeated MemberRanges default_filled = 7;
}
message ReportRecalcProgressRsp {
  common.RetInfo ret_info = 1;
  string job_status = 2;
}

// GetTaskParams 由引擎在开算一期前读取任务各可变成员最近一次被接受的提交（只读；只有持有租约的引擎能读）。
message GetTaskParamsReq {
  EngineIdentity engine = 1;
  string task_id = 2;
}
message GetTaskParamsRsp {
  common.RetInfo ret_info = 1;
  repeated MemberParamState members = 2;
}

service FactorEngine {
  rpc SyncEngineCatalog(SyncEngineCatalogReq) returns (SyncEngineCatalogRsp);
  rpc EngineHeartbeat(EngineHeartbeatReq) returns (EngineHeartbeatRsp);
  rpc PullRecalcJob(PullRecalcJobReq) returns (PullRecalcJobRsp);
  rpc ReportRecalcProgress(ReportRecalcProgressReq) returns (ReportRecalcProgressRsp);
  rpc GetTaskParams(GetTaskParamsReq) returns (GetTaskParamsRsp);
  // GetUdfModule 按版本哈希取一个自定义算子模块的 wasm 字节。
  rpc GetUdfModule(GetUdfModuleReq) returns (GetUdfModuleRsp);
}

message GetUdfModuleReq {
  EngineIdentity engine = 1;
  string hash = 2;
}
message GetUdfModuleRsp {
  common.RetInfo ret_info = 1;
  string name = 2;
  bytes wasm = 3;
}

// ---- 因子引擎的入站服务

// EngineControl 是因子引擎自己的 tRPC 服务：只监听因子机本机，由因子机的主机网关转发（因子机只能出站时经 control 中转）。
//   - 回放“因子现算”的三个方法只给策略服务调用：会话开始时从因子机本地存储取快照，之后按时间顺序逐步现算，
//     每期走实时计算路径；回放不写结果、不发周期完成事件、不改连续水位。会话只在引擎内存里，闲置 6 小时清理，
//     引擎重启后会话不存在（NOT_FOUND），要重新建立。
//   - 模块生命周期、任务检查与本地写入只给 moox-cli（lifecycle、system、factor task status --recheck、import --target factor）。
service EngineControl {
  // OpenReplay 建立会话：核对本地数据、按预热区间读快照、预留内存。同一个 replay_id 重复打开时先释放旧会话。
  rpc OpenReplay(OpenReplayReq) returns (OpenReplayRsp);
  // StepReplay 从 period_time 起按顺序算最多 periods 期。单步响应不超过 3 MiB：放不下时只返回前面几期（至少 1 期），
  // 一期就放不下时拒绝，要减少 columns。
  rpc StepReplay(StepReplayReq) returns (StepReplayRsp);
  // CloseReplay 结束会话并释放内存；会话不存在时 closed 为假。
  rpc CloseReplay(CloseReplayReq) returns (CloseReplayRsp);
  // GetLifecycle 读引擎模块的暂停与恢复追赶状态（设计 3.7，请求与响应见 moox_common.proto）。
  rpc GetLifecycle(common.GetLifecycleReq) returns (common.GetLifecycleRsp);
  // ControlLifecycle 暂停、恢复与放行引擎模块。
  rpc ControlLifecycle(common.ControlLifecycleReq) returns (common.ControlLifecycleRsp);
  // CheckTask 立即重查一个因子任务能不能计算（不等每 30 秒一轮），结果同时更新随心跳上报的检查结果。
  rpc CheckTask(CheckTaskReq) returns (CheckTaskRsp);
  // WriteSeries 是本地写入：导入服务用一批行整段替换标的在 [from, to) 内的本地数据。本地存储同一时刻只能由引擎进程打开，
  // 所以写入只能经过引擎；引擎未就绪时也接受写入。
  rpc WriteSeries(WriteSeriesReq) returns (WriteSeriesRsp);
  // GetSeriesFields 返回数据集的字段表（名称、类型、填充规则），导入服务据此解析文件。
  rpc GetSeriesFields(GetSeriesFieldsReq) returns (GetSeriesFieldsRsp);
  // CheckSeriesSubject 判断标的是否在数据集的标签范围内（导入不自动绑定标的）。
  rpc CheckSeriesSubject(CheckSeriesSubjectReq) returns (CheckSeriesSubjectRsp);
  // GetSeriesBounds 返回标的在本地的最早与最新时间。
  rpc GetSeriesBounds(GetSeriesBoundsReq) returns (GetSeriesBoundsRsp);
}

message OpenReplayReq {
  string replay_id = 1;
  string task_id = 2;
  // from、to 是回放区间（RFC3339，左闭右开），按任务频率对齐：决策周期是 data_time 落在其中的每一根 K 线。
  string from = 3;
  string to = 4;
  // extra_periods 是策略额外需要的回看根数（引用上一根的深度，0 或 1；年龄按本地数据里序列的第一根算，与快照长度无关，不用算进来）：
  // 预热起点 = from −（因子最大回看 − 1 + extra_periods）× 周期。
  int32 extra_periods = 5;
  // columns 是每行要返回的列（结果数据集里的列名）：成员的输出列、源数据集的数值列，以及 __params（各成员本期实际用的参数）。
  // 必填，不认识的列名拒绝。
  repeated string columns = 6;
  // allow_short_warmup 允许多数标的的本地数据不够预热区间（因子前段会是空值）；不允许时这种情况拒绝建立会话。
  bool allow_short_warmup = 7;
}

// ReplayFactor 是回放固定下来的一个成员：outputs 是它在结果数据集里的列名。
message ReplayFactor {
  string member_key = 1;
  string factor_id = 2;
  // kind 是成员类型：fixed 或 var。
  string kind = 3;
  string definition_hash = 4;
  repeated string outputs = 5;
}

message ReplayExcluded {
  string subject_id = 1;
  string reason = 2;
}

message OpenReplayRsp {
  common.RetInfo ret_info = 1;
  string replay_id = 2;
  // subjects 是参与回放的标的；excluded 是被排除的标的及原因（本地没有数据、到不了回放的最后一期）。
  repeated string subjects = 3;
  repeated ReplayExcluded excluded = 4;
  // period_times 是各决策周期的 data_time（真实时间的 Unix 秒，升序；有交易时段的市场跳过休市），可回放的区间就是它的首尾。
  repeated int64 period_times = 5;
  int64 step_seconds = 6;
  // warmup_start 是预热起点（RFC3339）。
  string warmup_start = 7;
  // snapshot_bytes 是快照预留的内存（字节）。
  int64 snapshot_bytes = 8;
  repeated ReplayFactor factors = 9;
  // source_fields 是源数据集的数值列，columns 可以引用它们。
  repeated string source_fields = 10;
  // short_warmup 是本地数据起点晚于预热起点的标的数（因子前段为空值），short_samples 是其中的前几个。
  int32 short_warmup = 11;
  repeated string short_samples = 12;
}

message StepReplayReq {
  string replay_id = 1;
  // period_time 是这一步第一期的 data_time（真实时间的 Unix 秒，必须是 OpenReplay 给出的某一期）。
  int64 period_time = 2;
  // periods 是这一步最多算几期，至少 1；到回放区间末尾为止。
  int32 periods = 3;
  // params 是这一步第一期各可变成员的参数（策略在上一期求值后产出）：只存在于会话里，不写成员行。
  // 没给的成员沿用上一期实际用的参数，再没有就用成员自己的参数；这一步后面各期都沿用。
  // 不合法的成员参数被拒绝并沿用上一期；成员键不存在时整步失败。
  repeated MemberParams params = 4;
}

// ReplayParamValues 是一个成员本期实际用的参数：参数名 → 值。
message ReplayParamValues {
  map<string, double> values = 1;
}

// ReplayRow 是一条序列（标的, series_tag）本期的行：只含 OpenReplay 请求的列，没有数据、算不出的列不出现。
// 本期在本地数据里没有这条序列的行时，这一行不出现。
message ReplayRow {
  string subject_id = 1;
  string series_tag = 2;
  map<string, double> values = 3;
  // previous 是同一条序列上一期的同名列。
  map<string, double> previous = 4;
  // params 是这一期各成员实际用的参数（成员键 → 参数）；只在 columns 含 __params 时给。
  map<string, ReplayParamValues> params = 5;
  // age_bars 是本地数据里这条序列截至本期的根数（含本期），策略的年龄检查用。
  int32 age_bars = 6;
}

// ReplayMemberState 是一个成员本期的状态。
message ReplayMemberState {
  // status：complete、degraded（部分标的失败）或 skipped（截面因子整体跳过）。
  string status = 1;
  string factor_id = 2;
  string definition_hash = 3;
  string kind = 4;
  repeated string failed_subjects = 5;
}

message ReplayParamRejection {
  string member_key = 1;
  string reason = 2;
}

// ReplayPeriod 是一期的因子帧。
message ReplayPeriod {
  // period_time 是这一期的 data_time（真实时间的 Unix 秒）。
  int64 period_time = 1;
  repeated ReplayRow rows = 2;
  // states 是各成员本期的状态（成员键 → 状态）。
  map<string, ReplayMemberState> states = 3;
  // applied_params 是这一期实际生效的、由请求带来（或沿用之前请求）的成员参数：策略以它为基础叠加下一期的新参数，
  // 不合法的请求参数不会出现在这里。
  repeated MemberParams applied_params = 4;
  // rejected_params 是被拒绝的成员参数，只出现在一步的第一期。
  repeated ReplayParamRejection rejected_params = 5;
}

message StepReplayRsp {
  common.RetInfo ret_info = 1;
  // periods 是实际算了的期：从请求的 period_time 起连续、按时间升序。少于请求的期数时，从下一期接着请求。
  repeated ReplayPeriod periods = 2;
  // compute_ms 是这一步的计算耗时。
  int64 compute_ms = 3;
}

message CloseReplayReq {
  string replay_id = 1;
}
message CloseReplayRsp {
  common.RetInfo ret_info = 1;
  bool closed = 2;
}

// CheckTaskReq 指定要重查的因子任务。
message CheckTaskReq {
  string task_id = 1;
}

message CheckTaskRsp {
  // 任务不在引擎的目录里（没有启用，或目录还没同步）时 ret_info 是 NOT_FOUND。
  common.RetInfo ret_info = 1;
  // checks 是逐项结果：有 FAIL 项的任务不计算。
  repeated FactorTaskCheck checks = 2;
  // paused 表示引擎模块被有意停下（暂停、恢复追赶），检查通过也暂不计算。
  bool paused = 3;
}

// SeriesColumn 是一列：null 标记与按类型的值，f 用于 double，i 用于 int 与 bool，s 用于其余类型；长度都等于行数。
message SeriesColumn {
  repeated bool null = 1;
  repeated double f = 2;
  repeated int64 i = 3;
  repeated string s = 4;
}

// WriteSeriesReq 是一批要整段替换的行，必须带数据集的全部字段。
message WriteSeriesReq {
  string space_id = 1;
  string dataset_id = 2;
  string freq = 3;
  string subject_id = 4;
  // from、to 是整段替换的区间（RFC3339，左闭右开），行时间与区间都是真实时间。
  string from = 5;
  string to = 6;
  // allow_missing 允许中间缺的周期按字段填充规则写成缺失行；否则缺期时拒绝。
  bool allow_missing = 7;
  // record_pending 把改变的区间记入失效重算待办（带 --recalc 的导入）；reason 是待办的原因，为空时是 import。
  bool record_pending = 8;
  string reason = 9;
  // times 是各行的 UTC 秒；tags 是各行的 series_tag。
  repeated int64 times = 10;
  repeated string tags = 11;
  // cols 按字段名给出每一列。
  map<string, SeriesColumn> cols = 12;
}

message WriteSeriesRsp {
  // 请求不合法、缺周期、字段对不上时 ret_info 是 INVALID_PARAM；读不到数据集字段、写本地存储失败时是 INNER_ERR。
  common.RetInfo ret_info = 1;
  int32 written = 2;
  int32 filled = 3;
  int32 removed = 4;
  // changed_from、changed_to 是本地数据实际改变的区间；earliest、latest 是写入后标的在本地的边界。
  string changed_from = 5;
  string changed_to = 6;
  string earliest = 7;
  string latest = 8;
}

message GetSeriesFieldsReq {
  string space_id = 1;
  string dataset_id = 2;
  string freq = 3;
}

// SeriesField 是数据集的一个字段：type 是 Storage 的字段类型，fill 是缺期时的填充规则（prev、prev_close、zero，空表示留空）。
message SeriesField {
  string name = 1;
  string type = 2;
  string fill = 3;
}

message GetSeriesFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated SeriesField fields = 2;
}

message CheckSeriesSubjectReq {
  string space_id = 1;
  string dataset_id = 2;
  string subject_id = 3;
}

message CheckSeriesSubjectRsp {
  common.RetInfo ret_info = 1;
  bool in_scope = 2;
}

message GetSeriesBoundsReq {
  string space_id = 1;
  string dataset_id = 2;
  string freq = 3;
  string subject_id = 4;
}

message GetSeriesBoundsRsp {
  common.RetInfo ret_info = 1;
