syntax = "proto3";

package trpc.moox.factor;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/factor/proto/factorgen;factorpb";

message FactorTask {
  string task_id = 1;
  string space_id = 2;
  string source_dataset_id = 3;
  string freq = 4;
  string result_dataset_id = 7;
  string status = 8;
  string created_at = 9;
  string updated_at = 10;
  // owner_instance_id 非空时是策略实例的私有任务，该实例是唯一的参数写入方；为空时成员带固定参数。
  string owner_instance_id = 11;
}

// FactorParamDecl 是定义声明的一个可调参数（由编译 spec 派生，只读）。
message FactorParamDecl {
  string name = 1;
  string type = 2; // int 或 float
  double min = 3;
  double max = 4;
  double default_value = 5;
}

// FactorCategory 是因子分类：只是元数据，用于查找与按类展示，不进 definition_hash。
message FactorCategory {
  string category_id = 1;
  string name = 2;
  int32 sort_order = 3;
  string created_at = 4;
  string updated_at = 5;
}

message FactorDef {
  string factor_id = 1;
  string name = 3;
  // factor_type、input_columns、outputs、lookback_periods 由编译 spec 派生，只读：写请求中忽略。
  string factor_type = 4;
  repeated string input_columns = 7;
  repeated string outputs = 8;
  int32 lookback_periods = 10;
  bool allow_partial_universe = 11;
  string created_at = 13;
  string updated_at = 14;
  // definition_hash 是完整计算契约的指纹：expr 语义版本、规范程序文本与 allow_partial_universe；
  // 由管理端在读取时派生计算，不持久化。
  string definition_hash = 15;
  // spec 是因子定义文本（YAML：params / let / outputs），spec_hash 是它原文的 sha256。
  string spec = 16;
  string spec_hash = 17;
  string category_id = 18;
  // params 是 spec 声明的可调参数（派生，只读）。
  repeated FactorParamDecl params = 19;
}

message FactorUsage {
  string task_id = 1;
  string status = 2;
  string member_alias = 3;
  // params 是成员的固定参数（空表示参数由策略实例逐期提交）。
  map<string, double> params = 4;
}

message FactorInfo {
  FactorDef factor = 1;
  repeated FactorUsage usages = 2;
}

// FactorMember 是定义在因子任务中的运行实例，身份是任务内唯一的别名。
message FactorMember {
  string task_id = 1;
  string factor_id = 2;
  string status = 3;
  FactorDef factor = 4;
  string created_at = 5;
  string updated_at = 6;
  string member_alias = 7;
  int32 carry_alert_periods = 8;
  // output_columns、param_columns 是成员在结果数据集里的列名（派生，只读）。
  repeated string output_columns = 9;
  repeated string param_columns = 10;
  // params 是成员的固定参数（完整参数，加成员时给定，之后不变；策略实例专属任务的成员为空，参数逐期提交）。
  map<string, double> params = 11;
}

message FactorPeriodState {
  string factor_id = 1;
  string status = 2;
  repeated string failed_subjects = 3;
  string spec_hash = 4;
  string definition_hash = 5;
  // gap_subjects 是 failed_subjects 中因回看窗口 K 线空洞而失败的标的（子集）。
  repeated string gap_subjects = 6;
  string member_alias = 7;
  // params_source 是这一期冻结参数的来源：requested、carried、carried_offline、default。
  string params_source = 8;
  string params_digest = 9;
}

message TaskRunSummary {
  string task_id = 1;
  int64 last_period_time = 2;
  string last_status = 3;
  int64 lag_seconds = 4;
  repeated FactorPeriodState factors = 5;
  repeated string failed_subjects = 6;
  // warming_subjects were left out of the period while their lookback window
  // loads; their results are not formal.
  int32 warming_subjects = 7;
  // completed_at 是引擎写完 last_period_time 这一期的 Unix 秒；0 表示未知。
  int64 completed_at = 8;
}

message FactorTaskInfo {
  FactorTask factor_task = 1;
  repeated FactorMember members = 2;
  TaskRunSummary last_run = 3;
}

message RecalcJob {
  string job_id = 1;
  string request_id = 2;
  string task_id = 3;
  repeated string members = 4;
  repeated string subjects = 5;
  string start_time = 6;
  string end_time = 7;
  string status = 8;
  string progress_time = 9;
  string error = 10;
  string created_at = 11;
  string updated_at = 12;
  string engine_id = 13;
}

message CreateFactorTaskReq { FactorTask factor_task = 1; }
message CreateFactorTaskRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
}

message SetFactorTaskStatusReq {
  string task_id = 1;
  string status = 2;
}
message SetFactorTaskStatusRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
}

message DeleteFactorTaskReq {
  string task_id = 1;
  bool purge = 2;
}
message DeleteFactorTaskRsp { common.RetInfo ret_info = 1; }

message GetFactorTaskReq { string task_id = 1; }
message GetFactorTaskRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
  repeated FactorMember members = 3;
  TaskRunSummary last_run = 4;
}

message ListFactorTasksReq {
  string status = 1;
  common.Page page = 2;
}
message ListFactorTasksRsp {
  common.RetInfo ret_info = 1;
  repeated FactorTaskInfo factor_tasks = 2;
  common.PageResult page_result = 3;
}

message CreateFactorReq { FactorDef factor = 1; }
message CreateFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message UpdateFactorReq { FactorDef factor = 1; }
message UpdateFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

message AddTaskMemberReq {
  string task_id = 1;
  string factor_id = 2;
  // member_alias 为空时：普通任务按参数生成（全部参数等于默认值时取 factor_id），策略实例专属任务取 factor_id。
  string member_alias = 3;
  // params 是成员的固定参数；没给的参数取定义的默认值。策略实例专属任务不能带固定参数。
  map<string, double> params = 4;
}
message AddTaskMemberRsp {
  common.RetInfo ret_info = 1;
  FactorMember member = 2;
}

message RemoveTaskMemberReq {
  string task_id = 1;
  string member_alias = 2;
}
message RemoveTaskMemberRsp { common.RetInfo ret_info = 1; }

message SetTaskMemberStatusReq {
  string task_id = 1;
  string member_alias = 2;
  string status = 3;
}
message SetTaskMemberStatusRsp {
  common.RetInfo ret_info = 1;
  FactorMember member = 2;
}

message DeleteFactorReq { string factor_id = 1; }
message DeleteFactorRsp { common.RetInfo ret_info = 1; }

message GetFactorReq { string factor_id = 1; }
message GetFactorRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
  repeated FactorUsage usages = 3;
}

message ListFactorsReq {
  string task_id = 1;
  string status = 2;
  common.Page page = 3;
  bool include_spec = 4;
}
message ListFactorsRsp {
  common.RetInfo ret_info = 1;
  repeated FactorInfo factors = 2;
  common.PageResult page_result = 3;
}

message RecalcFactorsReq {
  string task_id = 1;
  repeated string members = 2;
  repeated string subjects = 3;
  string start_time = 4;
  string end_time = 5;
  string request_id = 6;
}
message RecalcFactorsRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message ListRecalcJobsReq {
  string task_id = 1;
  repeated string statuses = 2;
  common.Page page = 3;
}
message ListRecalcJobsRsp {
  common.RetInfo ret_info = 1;
  repeated RecalcJob jobs = 2;
  common.PageResult page_result = 3;
}

message GetRecalcJobReq { string job_id = 1; }
message GetRecalcJobRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message CancelRecalcJobReq { string job_id = 1; }
message CancelRecalcJobRsp {
  common.RetInfo ret_info = 1;
  RecalcJob job = 2;
}

message FactorRunnerStatus {
  string task_id = 1;
  int32 queued = 2;
  bool active = 3;
  // warmup_state is warming while some subjects lack a loaded lookback window
  // (after the engine starts or the set changes); their period results are
  // reported as failed subjects and are not consumed by strategies.
  string warmup_state = 4; // warming | ready
  int32 warm_subjects = 5;
  int32 expected_subjects = 6;
}

// EngineInfo describes the compute engine as last seen by moox-factor-mgr.
message EngineInfo {
  string engine_id = 1;
  string boot_id = 2;
  string version = 3;
  bool online = 4;
  string last_heartbeat_at = 5;
  string catalog_hash = 6;
  string catalog_synced_at = 7;
  bool catalog_in_sync = 8;
}

message GetStatusReq {}
message GetStatusRsp {
  common.RetInfo ret_info = 1;
  bool consumer_running = 2;
  repeated FactorRunnerStatus runners = 5;
  repeated TaskRunSummary recent_runs = 6;
  EngineInfo engine = 7;
  int32 compute_workers = 8;
  // engine_expr_version 是引擎上报的 expr 语义版本，manager_expr_version 是管理端自己的；两者不同时
  // 引擎与管理端算出的 definition_hash 不一致，策略会跳过。
  string engine_expr_version = 9;
  string manager_expr_version = 10;
}

// 编译一份 spec，返回派生的元数据与诊断信息；控制台编辑器边写边校验。
message ValidateFactorSpecReq {
  string spec = 1;
  bool allow_partial_universe = 2;
}
message FactorSpecDiagnostic {
  string path = 1;
  int32 doc_line = 2;
  int32 line = 3;
  int32 column = 4;
  string message = 5;
}
message ValidateFactorSpecRsp {
  common.RetInfo ret_info = 1;
  bool valid = 2;
  FactorSpecDiagnostic diagnostic = 3;
  string factor_type = 4;
  repeated string input_columns = 5;
  repeated string outputs = 6;
  int32 lookback_periods = 7;
  string canonical = 8;
  string definition_hash = 9;
  // params 是 spec 声明的可调参数。
  repeated FactorParamDecl params = 10;
}

// 在指定因子任务的源数据上试算：少量标的、最近若干期。管理端直接读 Storage 计算，不经过引擎。
message PreviewFactorReq {
  string task_id = 1;
  string spec = 2;
  repeated string subjects = 3; // 为空时取源数据集的前几个标的
  int32 periods = 4;            // 输出最近多少期，默认 20，最多 500
  bool allow_partial_universe = 5;
  // params 是试算用的参数快照（默认值加按标的覆盖）；为空时用定义的默认值。
  map<string, ParamValue> params = 6;
}
message PreviewRow {
  string subject_id = 1;
  string series_tag = 2;
  string data_time = 3;
  repeated double values = 4; // 与 columns 一一对应；null 时为 0，并在 nulls 中标为 true
  repeated bool nulls = 5;
}
message PreviewFactorRsp {
  common.RetInfo ret_info = 1;
  repeated string columns = 2;
  repeated PreviewRow rows = 3;
}

message FactorFunctionArg {
  string name = 1;
  string kind = 2; // number、series、bool、bool_series、window、integer、constant
  double min = 3;
  double max = 4;
  bool optional = 5;
  double default_value = 6;
}
message FactorFunction {
  string name = 1;
  string category = 2; // elementwise、timeseries、cross_section
  string signature = 3;
  string result = 4; // number 或 bool
  repeated FactorFunctionArg args = 5;
  string lookback = 6;
  string doc = 7;
  string example = 8;
}
message ListFactorFunctionsReq {}
message ListFactorFunctionsRsp {
  common.RetInfo ret_info = 1;
  repeated FactorFunction functions = 2;
  string expr_version = 3;
}

message ListFactorCategoriesReq {}
message ListFactorCategoriesRsp {
  common.RetInfo ret_info = 1;
  repeated FactorCategory categories = 2;
}

message UpsertFactorCategoryReq { FactorCategory category = 1; }
message UpsertFactorCategoryRsp {
  common.RetInfo ret_info = 1;
  FactorCategory category = 2;
}

message DeleteFactorCategoryReq { string category_id = 1; }
message DeleteFactorCategoryRsp { common.RetInfo ret_info = 1; }

message SetFactorCategoryReq {
  string factor_id = 1;
  string category_id = 2;
}
message SetFactorCategoryRsp {
  common.RetInfo ret_info = 1;
  FactorDef factor = 2;
}

// 策略实例的私有因子任务（因子动态调参执行计划 2.3）：启用实例时建立或对齐，停用时停用，删除实例时释放。
message InstanceTaskMember {
  string member_alias = 1;
  string factor_id = 2;
}

message EnsureInstanceFactorTaskReq {
  string instance_id = 1;
  string space_id = 2;
  string source_dataset_id = 3;
  string freq = 4;
  repeated InstanceTaskMember members = 7;
}
message EnsureInstanceFactorTaskRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
  repeated FactorMember members = 3;
  // view_id 是私有结果数据集的默认 View，实例绑定它读取。
  string view_id = 4;
}

message SetInstanceFactorTaskEnabledReq {
  string instance_id = 1;
  bool enabled = 2;
}
message SetInstanceFactorTaskEnabledRsp {
  common.RetInfo ret_info = 1;
  FactorTask factor_task = 2;
}

message ReleaseInstanceFactorTaskReq { string instance_id = 1; }
message ReleaseInstanceFactorTaskRsp { common.RetInfo ret_info = 1; }

// ParamValue 是一个参数一期的取值：默认值加按标的覆盖。
message ParamValue {
  double default_value = 1;
  map<string, double> overrides = 2;
}

// MemberParams 是一个成员一期的完整参数快照。
message MemberParams {
  string member_alias = 1;
  map<string, ParamValue> params = 2;
}

// SubmitFactorParams 由参数写入方（策略实例）为下一期提交参数快照；截止点是引擎开始冻结那一期，晚到返回 too_late。
// accepted 只表示已接受，某期是否采用以冻结记录为准（GetFactorParams）。
message SubmitFactorParamsReq {
  string writer = 1;
  string task_id = 2;
  int64 period_time = 3;
  int64 based_on_period = 4;
  string request_id = 5;
  repeated MemberParams members = 6;
}
message MemberSubmitResult {
  string member_alias = 1;
  string result = 2; // accepted、too_late、rejected
  string reason = 3;
}
message SubmitFactorParamsRsp {
  common.RetInfo ret_info = 1;
  repeated MemberSubmitResult results = 2;
}

// ParamIntervalInfo 是冻结记录：快照与来源相同的连续期次 [start_period, end_period]（两端都含，Unix 秒）。
message ParamIntervalInfo {
  string member_alias = 1;
  int64 start_period = 2;
  int64 end_period = 3;
  map<string, ParamValue> params = 4;
  string source = 5;
  string snapshot_hash = 6;
}

message ParamRequestInfo {
  int64 seq = 1;
  string request_id = 2;
  string member_alias = 3;
  int64 period_time = 4;
  int64 based_on_period = 5;
  map<string, ParamValue> params = 6;
  string status = 7; // accepted、applied、superseded、not_applied
  string writer = 8;
  string created_at = 9;
}

message GetFactorParamsReq {
  string task_id = 1;
  string member_alias = 2; // 为空时全部成员
  int64 from = 3;
  int64 to = 4;
  bool include_requests = 5;
  int32 limit = 6;
}
message GetFactorParamsRsp {
  common.RetInfo ret_info = 1;
  repeated ParamIntervalInfo intervals = 2;
  repeated ParamRequestInfo requests = 3;
  int64 frozen_through = 4;
}

service FactorMgr {
  rpc CreateFactorTask(CreateFactorTaskReq) returns (CreateFactorTaskRsp);
  rpc SetFactorTaskStatus(SetFactorTaskStatusReq) returns (SetFactorTaskStatusRsp);
  rpc DeleteFactorTask(DeleteFactorTaskReq) returns (DeleteFactorTaskRsp);
  rpc GetFactorTask(GetFactorTaskReq) returns (GetFactorTaskRsp);
  rpc ListFactorTasks(ListFactorTasksReq) returns (ListFactorTasksRsp);
  rpc CreateFactor(CreateFactorReq) returns (CreateFactorRsp);
  rpc UpdateFactor(UpdateFactorReq) returns (UpdateFactorRsp);
  rpc DeleteFactor(DeleteFactorReq) returns (DeleteFactorRsp);
  rpc GetFactor(GetFactorReq) returns (GetFactorRsp);
  rpc AddTaskMember(AddTaskMemberReq) returns (AddTaskMemberRsp);
  rpc RemoveTaskMember(RemoveTaskMemberReq) returns (RemoveTaskMemberRsp);
  rpc SetTaskMemberStatus(SetTaskMemberStatusReq) returns (SetTaskMemberStatusRsp);
  rpc ListFactors(ListFactorsReq) returns (ListFactorsRsp);
  rpc RecalcFactors(RecalcFactorsReq) returns (RecalcFactorsRsp);
  rpc ListRecalcJobs(ListRecalcJobsReq) returns (ListRecalcJobsRsp);
  rpc GetRecalcJob(GetRecalcJobReq) returns (GetRecalcJobRsp);
  rpc CancelRecalcJob(CancelRecalcJobReq) returns (CancelRecalcJobRsp);
  rpc GetStatus(GetStatusReq) returns (GetStatusRsp);
  rpc ValidateFactorSpec(ValidateFactorSpecReq) returns (ValidateFactorSpecRsp);
  rpc PreviewFactor(PreviewFactorReq) returns (PreviewFactorRsp);
  rpc ListFactorFunctions(ListFactorFunctionsReq) returns (ListFactorFunctionsRsp);
  rpc NotifyPeriodsFilled(NotifyPeriodsFilledReq) returns (NotifyPeriodsFilledRsp);
  rpc ListFactorCategories(ListFactorCategoriesReq) returns (ListFactorCategoriesRsp);
  rpc UpsertFactorCategory(UpsertFactorCategoryReq) returns (UpsertFactorCategoryRsp);
  rpc DeleteFactorCategory(DeleteFactorCategoryReq) returns (DeleteFactorCategoryRsp);
  rpc SetFactorCategory(SetFactorCategoryReq) returns (SetFactorCategoryRsp);
  rpc EnsureInstanceFactorTask(EnsureInstanceFactorTaskReq) returns (EnsureInstanceFactorTaskRsp);
  rpc SetInstanceFactorTaskEnabled(SetInstanceFactorTaskEnabledReq) returns (SetInstanceFactorTaskEnabledRsp);
  rpc ReleaseInstanceFactorTask(ReleaseInstanceFactorTaskReq) returns (ReleaseInstanceFactorTaskRsp);
  rpc SubmitFactorParams(SubmitFactorParamsReq) returns (SubmitFactorParamsRsp);
  rpc GetFactorParams(GetFactorParamsReq) returns (GetFactorParamsRsp);
}

// FactorEngine is the internal contract between moox-factor-mgr and the
// outbound-only moox-factor-engine; only the factor-engine caller may use it.
message EngineIdentity {
  string engine_id = 1;
  string boot_id = 2;
  string version = 3;
}

message EngineMember {
  string member_alias = 1;
  FactorDef factor = 2;
  // carry_alert_periods 是连续沿用参数超过多少期告警（0 取默认值）。
  int32 carry_alert_periods = 3;
  // params 是成员的固定参数（空表示参数由策略实例逐期提交）。
  map<string, double> params = 4;
}

message EngineTask {
  FactorTask factor_task = 1;
  repeated EngineMember members = 2;
  bool result_ready = 3;
}

message SyncEngineCatalogReq {
  EngineIdentity engine = 1;
  string known_hash = 2;
}
message SyncEngineCatalogRsp {
  common.RetInfo ret_info = 1;
  string catalog_hash = 2;
  bool not_modified = 3;
  repeated EngineTask tasks = 4;
}

message EngineRuntimeStatus {
  bool consumer_running = 1;
  repeated FactorRunnerStatus runners = 4;
  repeated TaskRunSummary recent_runs = 5;
  string catalog_hash = 6;
  string catalog_synced_at = 7;
  int32 compute_workers = 8;
  string expr_version = 9;
  // watermarks 是各任务的连续水位：已连续算完到哪一期、已知的最新一期、是否阻塞在还没补到的周期上。
  repeated TaskWatermarkStatus watermarks = 10;
  // param_health 是各成员的参数状态；offline_pending 是还没补报给管理端的离线冻结数。
  repeated MemberParamHealth param_health = 11;
  int32 offline_pending = 12;
}

message MemberParamHealth {
  string task_id = 1;
  string member_alias = 2;
  int32 carried_periods = 3;
  int32 alert_after = 4;
  string last_offline_at = 5;
}

message TaskWatermarkStatus {
  string task_id = 1;
  string committed_through = 2;
  string target = 3;
  // blocked_since 非空表示水位阻塞：blocked_period 是卡住的那一期，blocked_reason 是原因（no_rows、missing_over_threshold、no_universe）。
  string blocked_since = 4;
  string blocked_period = 5;
  string blocked_reason = 6;
}

// PeriodsFilled 是补采补齐了一段周期的通知：absent_subjects 是补采确认行情源没有的标的。
message PeriodsFilled {
  string space_id = 1;
  string dataset_id = 2;
  string frequency = 3;
  // [from, to) 是补齐的 K 线开始时间范围（Unix 秒）。
  int64 from = 4;
  int64 to = 5;
  repeated string absent_subjects = 6;
}

// NotifyPeriodsFilled 由 Collector 在补采作业成功后调用；因子管理服务在引擎心跳响应里转交，引擎据此立即推进水位并补算。
message NotifyPeriodsFilledReq {
  repeated PeriodsFilled filled = 1;
}

message NotifyPeriodsFilledRsp {
  common.RetInfo ret_info = 1;
}

message EngineHeartbeatReq {
  EngineIdentity engine = 1;
  EngineRuntimeStatus status = 2;
}
message EngineHeartbeatRsp {
  common.RetInfo ret_info = 1;
  int64 lease_ttl_seconds = 2;
  // filled 是自上次心跳以来收到的补齐通知（只交给持有租约的引擎）。
  repeated PeriodsFilled filled = 3;
}

message PullRecalcJobReq { EngineIdentity engine = 1; }
message PullRecalcJobRsp {
  common.RetInfo ret_info = 1;
  bool found = 2;
  RecalcJob job = 3;
  string lease_token = 4;
  EngineTask task = 5;
}

message ReportRecalcProgressReq {
  EngineIdentity engine = 1;
  string job_id = 2;
  string lease_token = 3;
  string progress_time = 4;
  string status = 5;
  string error = 6;
}
message ReportRecalcProgressRsp {
  common.RetInfo ret_info = 1;
  string job_status = 2;
}

// FreezeFactorParams 在引擎开算一期之前冻结这些任务的参数（因子动态调参执行计划 2.4）：提交与冻结在管理端同一个库里
// 串行化；同一期重复调用返回同一份结果。
message MemberParamFreeze {
  string member_alias = 1;
  map<string, ParamValue> params = 2;
  string source = 3;
  string snapshot_hash = 4;
  string request_id = 5;
}
message TaskParamFreeze {
  string task_id = 1;
  repeated MemberParamFreeze members = 2;
}
message FreezeFactorParamsReq {
  EngineIdentity engine = 1;
  repeated string task_ids = 2;
  int64 period_time = 3;
}
message FreezeFactorParamsRsp {
  common.RetInfo ret_info = 1;
  repeated TaskParamFreeze tasks = 2;
}

// OfflineFreeze 是引擎在管理端不可达时本地按沿用规则冻结的一期。
message OfflineFreeze {
  string task_id = 1;
  string member_alias = 2;
  int64 period_time = 3;
  map<string, ParamValue> params = 4;
  string source = 5;
}
message ReportOfflineFreezesReq {
  EngineIdentity engine = 1;
  repeated OfflineFreeze freezes = 2;
}
message ReportOfflineFreezesRsp {
  common.RetInfo ret_info = 1;
  // conflicts 是管理端已有不同记录的期次（以管理端为准，引擎据此重算）。
  repeated OfflineFreeze conflicts = 2;
}

message ListParamIntervalsReq {
  EngineIdentity engine = 1;
  string task_id = 2;
  int64 from = 3;
  int64 to = 4;
}
message ListParamIntervalsRsp {
  common.RetInfo ret_info = 1;
  repeated ParamIntervalInfo intervals = 2;
}

service FactorEngine {
  rpc SyncEngineCatalog(SyncEngineCatalogReq) returns (SyncEngineCatalogRsp);
  rpc EngineHeartbeat(EngineHeartbeatReq) returns (EngineHeartbeatRsp);
  rpc PullRecalcJob(PullRecalcJobReq) returns (PullRecalcJobRsp);
  rpc ReportRecalcProgress(ReportRecalcProgressReq) returns (ReportRecalcProgressRsp);
  rpc FreezeFactorParams(FreezeFactorParamsReq) returns (FreezeFactorParamsRsp);
  rpc ReportOfflineFreezes(ReportOfflineFreezesReq) returns (ReportOfflineFreezesRsp);
  rpc ListParamIntervals(ListParamIntervalsReq) returns (ListParamIntervalsRsp);
}
