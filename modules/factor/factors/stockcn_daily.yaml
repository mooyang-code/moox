# 因子库（表达式写法）：A 股日线因子，用到日线附加字段（后复权因子 adj_factor、fin_ 开头的财务字段、换手率 turnover_rate、股本与每股股利）。
# 只能用在带这些字段的日线数据集上，字段口径见 docs/模块/采集.md 第 4a、4b 节。
# 格式同 xbx.yaml。分类：动量类（momentum）、基本面类（fundamental）、筹码类（chip）、估值类（valuation）。
- factor_id: mom_adj
  name: 复权涨幅
  category_id: momentum
  category_name: 动量类
  # K 线是不复权价，close * adj_factor 是后复权价；window 是回看的交易日数。
  spec: |
    params:
      window: {type: int, min: 2, max: 250, default: 20}
    let:
      adj_close: close * adj_factor
    output: adj_close / delay(adj_close, window) - 1

- factor_id: roe_ttm
  name: 净资产收益率（滚动十二个月）
  category_id: fundamental
  category_name: 基本面类
  # 金融类公司缺的科目、缺上年数据的滚动值为空时，因子值也为空。
  spec: |
    output: fin_net_profit_parent_ttm / fin_equity_parent

# 筹码类（chip）：用最近 window 个交易日的开高低收与换手率推算持仓成本的分布，算法见 docs/模块/因子.md 第 6 节的“筹码分布”。
# 需要源数据集带换手率 turnover_rate（百分比）。价格先乘 adj_factor 换成后复权价，除权前后的成本才可比；
# 某天没有换手率时按当天没有换手处理（fill_nan），否则缺一天会让之后 window 天全部为空。
- factor_id: chip_profit_ratio
  name: 筹码获利比例
  category_id: chip
  category_name: 筹码类
  # 持仓成本不高于当日收盘价的筹码占比，0～1。
  spec: |
    params:
      window: {type: int, min: 20, max: 500, default: 210}
    let:
      turnover: fill_nan(turnover_rate, 0)
    output: chip_profit(open * adj_factor, high * adj_factor, low * adj_factor, close * adj_factor, turnover, window)

- factor_id: chip_avg_cost
  name: 筹码平均成本
  category_id: chip
  category_name: 筹码类
  # 筹码累计到一半时的价格，除以当日 adj_factor 后可以直接和当日不复权收盘价比（除权日与收盘价同比例跳变）。
  spec: |
    params:
      window: {type: int, min: 20, max: 500, default: 210}
    let:
      turnover: fill_nan(turnover_rate, 0)
    output: chip_cost(open * adj_factor, high * adj_factor, low * adj_factor, close * adj_factor, turnover, window, 0.5) / adj_factor

- factor_id: chip_concentration
  name: 筹码集中度（90%）
  category_id: chip
  category_name: 筹码类
  # 90% 筹码所在价格区间的相对宽度：(高位成本 − 低位成本) / (高位成本 + 低位成本)，越小越集中。
  spec: |
    params:
      window: {type: int, min: 20, max: 500, default: 210}
    let:
      turnover: fill_nan(turnover_rate, 0)
      upper: chip_cost(open * adj_factor, high * adj_factor, low * adj_factor, close * adj_factor, turnover, window, 0.95)
      lower: chip_cost(open * adj_factor, high * adj_factor, low * adj_factor, close * adj_factor, turnover, window, 0.05)
    output: (upper - lower) / (upper + lower)

# 估值类（valuation）：市值 = 当日不复权收盘价 × 股本，估值再除以财务字段（单位都是元）。需要源数据集带
# total_shares、float_shares、dividend_per_share（选股器来源，只有开通以后的值）。
# 股本和每股股利先取最近 20 个交易日里最后一个有值的（ts_last_valid）：某天没采到时沿用前值，连续 20 个交易日没有才为空。
# 亏损股的市盈率、净资产为负的市净率是负数，排序前按需要先过滤。
- factor_id: total_mv
  name: 总市值
  category_id: valuation
  category_name: 估值类
  spec: |
    output: close * ts_last_valid(total_shares, 20)

- factor_id: float_mv
  name: 流通市值
  category_id: valuation
  category_name: 估值类
  spec: |
    output: close * ts_last_valid(float_shares, 20)

- factor_id: pe_ttm
  name: 市盈率（滚动十二个月）
  category_id: valuation
  category_name: 估值类
  # 分母是归母净利润的滚动十二个月值；为 0 或为空时因子值为空。
  spec: |
    output: close * ts_last_valid(total_shares, 20) / fin_net_profit_parent_ttm

- factor_id: pb
  name: 市净率
  category_id: valuation
  category_name: 估值类
  # 分母是最新一期的归母股东权益。
  spec: |
    output: close * ts_last_valid(total_shares, 20) / fin_equity_parent

- factor_id: ps_ttm
  name: 市销率（滚动十二个月）
  category_id: valuation
  category_name: 估值类
  # 分母是营业收入的滚动十二个月值。
  spec: |
    output: close * ts_last_valid(total_shares, 20) / fin_revenue_ttm

- factor_id: dv_ratio
  name: 股息率（%）
  category_id: valuation
  category_name: 估值类
  spec: |
    output: ts_last_valid(dividend_per_share, 20) / close * 100
