# F1 迁移的因子库（表达式写法）：2 个选币因子、3 个过滤因子，语义与 strategy_share 的 alphalib 版本逐值一致。
# 设计见 docs/计划/F1策略迁移/F1策略迁移设计.md 第 2、3 节。全部用新 ID（f1_ 前缀），不改现有的 min_max。
# 默认值取参数下限，不与 FH 参数表里的任何取值重合：参数全为默认值的成员会省略参数段。
# 序列开头的处理与 F1 一致：EMA 从首根递推（ema_partial），rolling 的 min_periods 用 *_partial 还原。
- factor_id: f1_po
  name: Po 双均线距离比
  category_id: trend
  category_name: 趋势类
  # F1 写的是 ewm(com=n) 与 ewm(com=3n)，换成 span：short_span = 2n+1，long_span = 6n+1（表达式引擎的窗口参数不能写运算，所以拆成两个参数）。
  # 长线最多用 5 万根：n ≥ 824 时按 1e-9 容差推导的根数超过回看上限，截断后丢弃的起点权重最大 2.3e-4（n = 1992）；
  # 不足 5 万根（上市不久）时从首根递推，与 F1 一致。
  spec: |
    params:
      short_span: {type: int, min: 3, max: 4000, default: 3}
      long_span: {type: int, min: 7, max: 12000, default: 7}
    let:
      short: ema_partial(close, short_span)
      long: ema_partial(close, long_span, 50000)
    output: (short - long) / (short + long)

- factor_id: f1_mtmstd
  name: 动量均值乘动量波动
  category_id: momentum
  category_name: 动量类
  # F1 的 rolling 用 min_periods=1（均值）与 2（标准差），用 *_partial 还原序列开头的部分窗口。
  spec: |
    params: {n: {type: int, min: 2, max: 2000, default: 2}}
    let:
      r: pct_change(close, n)
    output: ts_mean_partial(r, n, 1) * ts_std_partial(r, n, 2)

- factor_id: f1_wick_max
  name: 上影线占比滚动最大（MaxHightDie）
  category_id: volatility
  category_name: 波动类
  # F1 文件名 MaxHightDie，docstring 写“回撤”，实际是近 n 根里 (high - close) / close 的最大值。
  spec: |
    params: {n: {type: int, min: 1, max: 2016, default: 1}}
    output: ts_max((high - close) / close, n)

- factor_id: f1_upper_shadow
  name: 距 n 根最高价的回落（UpperShadow）
  category_id: volatility
  category_name: 波动类
  spec: |
    params: {n: {type: int, min: 1, max: 2016, default: 1}}
    output: abs(ts_max(high, n) - close) / ts_mean(close, n)

- factor_id: f1_min_max
  name: 区间位置（MinMax，窗口放宽到 2016）
  category_id: momentum
  category_name: 动量类
  # 与现有 min_max 公式相同，窗口上限放宽到 2016；F1 用 min_periods=1，用 *_partial 还原。
  spec: |
    params: {window: {type: int, min: 2, max: 2016, default: 2}}
    let:
      tp: (high + low + close) / 3
      lo: ts_min_partial(tp, window, 1)
    output: (tp - lo) / (ts_max_partial(tp, window, 1) - lo) - 0.5
