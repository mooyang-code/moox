# 因子库（表达式写法）：11 个因子。
# 格式见 docs/计划/因子表达式引擎详细设计.md 9.5：一个文件可以包含多个因子。
- factor_id: Bias
  name: Bias
  spec: |
    params: {window: 20}
    outputs:
      bias_{window}: close / ts_mean(close, window)

- factor_id: BiasQ
  name: Bias 分位
  spec: |
    params: {window: 20}
    outputs:
      bias_q_{window}: ts_rank(close / ts_mean(close, window) - 1, window)

- factor_id: Cci
  name: CCI
  spec: |
    params: {window: 20}
    let:
      tp: (high + low + close) / 3
      m: ts_mean(tp, window)
    outputs:
      cci: (tp - m) / (0.015 * ts_mean(abs(tp - m), window))

- factor_id: MinMax
  name: MinMax
  spec: |
    params: {window: 20}
    let:
      tp: (high + low + close) / 3
      lo: ts_min(tp, window)
    outputs:
      minmax_{window}: (tp - lo) / (ts_max(tp, window) - lo) - 0.5

- factor_id: QuoteVolumeMean
  name: 成交额均值
  spec: |
    params: {window: 20}
    outputs:
      quote_volume_mean_{window}: ts_mean(quote_volume, window)

- factor_id: QuoteVolumeMeanQ
  name: 成交额均值分位
  spec: |
    params: {window: 20}
    outputs:
      quote_volume_mean_q_{window}: ts_rank(ts_mean(quote_volume, window), window)

- factor_id: VolumeMeanQ
  name: 成交量均值分位
  spec: |
    params: {window: 20}
    outputs:
      volume_mean_q_{window}: ts_rank(ts_mean(volume, window), window)

- factor_id: ZfAbsMean
  name: 上涨振幅均值分位
  spec: |
    params: {window: 20}
    let:
      tp: (close + high + low) / 3
      amp: (high - low) / open
    outputs:
      zf_abs_mean_{window}: ts_rank(ts_mean(where(pct_change(tp) > 0, amp, 0), window), window)

- factor_id: ZfMeanQ
  name: 振幅均值分位
  spec: |
    params: {window: 20}
    let:
      amp: (high - low) / open
    outputs:
      zf_mean_q_{window}: ts_rank(ts_mean(amp, window), window)

- factor_id: ZfStd
  name: 带符号振幅标准差
  spec: |
    params: {window: 20}
    let:
      amp: (high - low) / open
    outputs:
      zf_std_{window}: ts_std(where(pct_change(close) > 0, amp, -amp), window)

- factor_id: ZscoreAbsMeanQ
  name: 绝对 Z 分数均值分位
  spec: |
    params: {window: 20}
    let:
      m: ts_mean(close, window)
      s: ts_std(close, window)
    outputs:
      zscore_abs_mean_q_{window}: ts_rank(ts_mean(abs((close - m) / s), window), window)
