# 因子库（表达式写法）：常用技术指标，只用 K 线的开高低收与成交量，所有指标都是时序因子。
# 格式同 xbx.yaml：一个文件可以包含多个因子；窗口是可调参数，策略可在范围内逐期调整，回看按参数上限推导。
# 分类：趋势类（trend）、动量类（momentum）、波动类（volatility）、成交量类（volume）。
# 带指数衰减的指标（EMA、MACD、RSI）按截断到起点权重低于 1e-9 的根数取回看，回看比同窗口的普通均线长。
- factor_id: ma
  name: 简单移动平均（MA）
  category_id: trend
  category_name: 趋势类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_mean(close, window)

- factor_id: ema
  name: 指数移动平均（EMA）
  category_id: trend
  category_name: 趋势类
  # span 是 EMA 的跨度（EMA20 的 20），α = 2/(span+1)，不是滚动窗口。
  # warmup 是预热总根数（含起点那一根）：0 按通常方式由 span 推出，否则用最近 warmup 根递推，例如 span=20、warmup=50000。
  # span 上限 4825 时通常方式的回看为 49995 根（约 34.7 天的 1m）；warmup 上限 50000，因子最大回看 50000 根。
  spec: |
    params:
      span: {type: int, min: 2, max: 4825, default: 20}
      warmup: {type: int, min: 0, max: 50000, default: 0}
    output: ema(close, span, warmup)

- factor_id: macd
  name: 指数平滑异同移动平均（MACD）
  category_id: trend
  category_name: 趋势类
  spec: |
    let:
      line: ema(close, 12) - ema(close, 26)
      signal: ema(line, 9)
    outputs:
      dif: line
      dea: signal
      hist: 2 * (line - signal)

- factor_id: rsi
  name: 相对强弱指数（RSI）
  category_id: momentum
  category_name: 动量类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 14}}
    let:
      d: delta(close, 1)
      gain: where(d > 0, d, 0)
    output: 100 * sma(gain, window, 1) / sma(abs(d), window, 1)

- factor_id: roc
  name: 变动率（ROC）
  category_id: momentum
  category_name: 动量类
  spec: |
    params: {window: {type: int, min: 1, max: 120, default: 12}}
    output: pct_change(close, window)

- factor_id: boll
  name: 布林带（BOLL）
  category_id: volatility
  category_name: 波动类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      mean: ts_mean(close, window)
      band: 2 * ts_std(close, window)
    outputs:
      mid: mean
      up: mean + band
      low: mean - band
      pctb: (close - (mean - band)) / (2 * band)

- factor_id: atr
  name: 平均真实波幅（ATR）
  category_id: volatility
  category_name: 波动类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 14}}
    let:
      tr: max(high - low, max(abs(high - delay(close, 1)), abs(low - delay(close, 1))))
    output: ts_mean(tr, window)

- factor_id: atr_pct
  name: 平均真实波幅占比（ATR%）
  category_id: volatility
  category_name: 波动类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 14}}
    let:
      tr: max(high - low, max(abs(high - delay(close, 1)), abs(low - delay(close, 1))))
    output: ts_mean(tr, window) / close

- factor_id: return_std
  name: 收益率波动
  category_id: volatility
  category_name: 波动类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_std(pct_change(close), window)

- factor_id: vwap
  name: 成交量加权均价（VWAP）
  category_id: volume
  category_name: 成交量类
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_sum(quote_volume, window) / ts_sum(volume, window)
