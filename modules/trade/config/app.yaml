# MooX Trade 服务应用配置
# Trade 模块统一承载账户域与交易域，使用独立 SQLite 库。

database:
  path: ./data/moox_trade.db

admin:
  base_url: "https://106.53.107.122:11001"
  service_auth:
    target_node: ""
    ca_file: ""
    access_key: "moox-service"
    secret_key: ""
    expire_seconds: 60

eventbus:
  enabled: true
  urls: ["nats://127.0.0.1:4222"]
  credential_file: ~/.config/moox/eventbus/trade-eventbus.yaml

runtime:
  # Production order submission is disabled unless explicitly enabled.
  # TESTNET and account synchronization are unaffected.
  live_trading_enabled: false

dns_resolver:
  enabled: false
  domains: []
  lookup_timeout_ms: 1500
  probe_timeout_ms: 500
  probe_port: 443
  cache_ttl_seconds: 300
  max_ips_per_domain: 4
