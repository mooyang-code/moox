# MooX Trade 服务应用配置
# Trade 模块统一承载账户域与交易域，使用独立 SQLite 库。

database:
  type: sqlite
  path: ./data/moox_trade.db
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

# 安全配置（API 凭证加解密）。生产环境请改为强随机 32 字节值。
security:
  encryption_key: "moox-cloud-secret-key-32bytes"

control_gateway:
  base_url: "https://106.53.107.122:11001"
  service_auth:
    version: "moox-auth-v2"
    access_key: "moox-service"
    secret_key: ""
    expire_seconds: 60

sync:
  enabled: true
  sync_balances: true
  sync_positions: true
  sync_orders: true
  sync_trades: true
  window_hours: 24
  page_size: 500
  max_symbols_per_run: 10

log:
  level: info
  output_path: ./log/moox_trade.log
  max_size: 100
  max_backups: 10
  max_age: 30

health:
  addr: ":11210"

eventbus:
  enabled: true
  urls: ["nats://127.0.0.1:4222"]
  stream: MOOX_TRADE
  execution_durable: trade_execution_v1
  rebalance_durable: trade_rebalance_v1
  progress_durable: trade_progress_v1
  reconciliation_durable: trade_reconciliation_v1
