# MooX Trade 服务应用配置
# Trade 模块统一承载账户域与交易域，使用独立 SQLite 库。

database:
  type: sqlite
  path: ./data/moox_trade.db
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

# 安全配置（API 凭证加解密）。生产环境请改为强随机 32 字节值。
security:
  encryption_key: "moox-cloud-secret-key-32bytes"

control_gateway:
  base_url: "http://106.53.107.122:11000"
  service_auth:
    version: "moox-auth-v1"
    access_key: "moox-service"
    secret_key: "moox-service-secret-change-me"
    expire_seconds: 1800

sync:
  enabled: true
  sync_balances: true
  sync_positions: true
  sync_orders: true
  sync_trades: true
  window_hours: 24
  page_size: 500
  max_symbols_per_run: 10

log:
  level: info
  output_path: ./log/moox_trade.log
  max_size: 100
  max_backups: 10
  max_age: 30
