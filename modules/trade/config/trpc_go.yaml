global: #全局配置
  namespace: Production            #环境类型
  env_name: dev                    #环境名称

server:
  filter:
    - recovery
    - validation
    - spacectx
    - prometheus
  timeout: 10000
  admin:
    ip: 127.0.0.1
    port: 11920
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.trade.Health
      ip: 127.0.0.1
      port: 11210
      network: tcp
      protocol: http_no_protocol
      timeout: 10000
      ######## unified Trade console RPC ########
    # ControlLifecycle 暂停要等在途的订单提交结束（最长 30 秒），请求时限要大于它（与服务目录里这个方法的 60 秒一致）
    - name: trpc.moox.trade.TradeConsoleService
      ip: 127.0.0.1
      port: 11200
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 60000

    - name: trpc.moox.trade.metrics.timer
      port: 11210
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000

    - name: trpc.moox.trade.equity.timer
      port: 11211
      network: "*/20 * * * * *"
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12920
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: debug
        writer_config:
          log_path: ./log
          filename: trpc_trade.log
          roll_type: size
          max_age: 7
          max_size: 50
          max_backups: 5
          compress: false
