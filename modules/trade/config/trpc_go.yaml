global: #全局配置
  namespace: Production            #环境类型
  env_name: dev                    #环境名称

server:
  filter:
    - recovery
    - validation
    - masking
    - spacectx
    - prometheus
  timeout: 10000
  admin:
    ip: 127.0.0.1
    port: 11920
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.trade.Health
      ip: 127.0.0.1
      port: 11210
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
      ######## unified Trade console RPC ########
    - name: trpc.moox.trade.TradeConsoleService
      ip: 127.0.0.1
      port: 11200
      network: tcp
      protocol: http
      timeout: 15000

      ######## DNS Resolver RPC ########
    - name: trpc.moox.trade.TradeDNSResolverService.trpc
      ip: 127.0.0.1
      port: 11203
      network: tcp
      protocol: trpc
      timeout: 5000

    - name: trpc.moox.trade.metrics.timer
      port: 11210
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000

    - name: trpc.moox.trade.equity.timer
      port: 11211
      network: "0 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12920
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: debug
        writer_config:
          log_path: ./log
          filename: trpc_trade.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 10
          compress: false
