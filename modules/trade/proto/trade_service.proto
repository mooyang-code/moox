syntax = "proto3";

package trpc.moox.trade;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/trade/proto/tradegen;tradepb";

// Decimal values are encoded as strings. Timestamps are Unix milliseconds.

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_BINANCE = 1;
  EXCHANGE_OKX = 2;
}

enum MarketType {
  MARKET_TYPE_UNSPECIFIED = 0;
  MARKET_TYPE_SPOT = 1;
  MARKET_TYPE_SWAP = 2;
  MARKET_TYPE_STOCK = 3;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_PAPER = 1;
  EXECUTION_MODE_LIVE = 2;
}

enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_STRATEGY = 1;
  CONTROL_MODE_MANUAL = 2;
}

enum AccountEnvironment {
  ACCOUNT_ENVIRONMENT_UNSPECIFIED = 0;
  ACCOUNT_ENVIRONMENT_TESTNET = 1;
  ACCOUNT_ENVIRONMENT_PRODUCTION = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
}

enum FillPolicy {
  FILL_POLICY_UNSPECIFIED = 0;
  FILL_POLICY_GTC = 1;
  FILL_POLICY_IOC = 2;
  FILL_POLICY_FOK = 3;
}

enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0;
  POSITION_SIDE_NET = 1;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

message AssetBalance {
  string asset = 1;
  string available = 2;
  string locked = 3;
  string total = 4;
  // 余额所在的钱包：SPOT、FUTURES、MARGIN、UNIFIED。
  string wallet = 5;
  string borrowed = 6;
}

message TradingAccountSnapshot {
  repeated AssetBalance balances = 1;
  string equity = 2;
  string available_funds = 3;
  string used_margin = 4;
  string maintenance_margin = 5;
  string unrealized_pnl = 6;
  int64 exchange_updated_at = 7;
  // 交易所给出的总权益，只用于展示核对，不参与换算。
  string exchange_equity = 8;
}

message LiveConfig {
  AccountEnvironment environment = 1;
  string credential_secret_id = 2;
}

message PaperConfig {
  string initial_balance = 1;
  string maker_fee_rate = 2;
  string taker_fee_rate = 3;
  string slippage_bps = 4;
}

message TradingAccount {
  string trading_account_id = 1;
  string space_id = 2;
  string name = 3;
  Exchange exchange = 4;
  // 账户已开通的市场，按 SPOT、SWAP、STOCK 的固定顺序排列。
  repeated MarketType markets = 5;
  ExecutionMode execution_mode = 6;
  string settlement_asset = 7;
  string margin_mode = 8;
  map<string, string> leverage_settings = 9;
  string status = 11;
  bool ready = 12;
  int64 last_sync_at = 13;
  int64 last_ready_at = 14;
  string last_error = 15;
  oneof execution_config {
    LiveConfig live = 16;
    PaperConfig paper = 17;
  }
  TradingAccountSnapshot snapshot = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
  // 账户类型，只由交易所检测写入：BINANCE_PORTFOLIO_MARGIN、BINANCE_STANDARD、OKX_UNIFIED；模拟盘和股票为空。
  string account_mode = 21;
  // 最近一次检测的结果（JSON）：权限、持仓模式、检测时间、阻断项。
  string inspection_json = 22;
}

message LogicalAccountMember {
  string trading_account_id = 1;
  bool enabled = 2;
  int32 priority = 3;
}

message LogicalAccount {
  string logical_account_id = 1;
  string space_id = 2;
  string name = 3;
  ExecutionMode execution_mode = 5;
  // 只读：启用成员已开通市场的并集，是这个组合当前可交易的市场。
  repeated MarketType markets = 6;
  string settlement_asset = 7;
  string automation_state = 8;
  string pause_reason = 9;
  repeated LogicalAccountMember members = 10;
  bool ready = 11;
  repeated string readiness_reasons = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  int64 owner_generation = 15;
  // Strategy lifecycle identity of the current owner.
  string owner_instance_id = 16;
  string owner_session_id = 17;
  // Strategy 生命周期调用的比较并交换令牌，只返回给内部调用方。
  string auth_fence = 18;
  ControlMode control_mode = 19;
  // 只读：当前生效的下单设置和资金设置（没写的项已填上默认值）。
  OrderSettings order_settings = 20;
  FundSettings fund_settings = 21;
  // 存的设置读不出来时的说明（此时对应的设置为空）：界面要提示并禁止保存，不能按默认值显示，否则一保存就覆盖了原设置。
  string order_settings_error = 22;
  string fund_settings_error = 23;
}

// 组合账户的下单设置，数值用字符串；写入时的校验见 domain/ordersettings。
message OrderSettings {
  // TARGET_RATIO | POSITION_RATIO | EQUITY_RATIO | ALWAYS，空表示默认 TARGET_RATIO
  string rebalance_threshold_mode = 1;
  string rebalance_threshold_ratio = 2;
  string min_notional_spot = 3;
  string min_notional_swap = 4;
  // 每个标的每个自然小时累计下单金额上限：键是内部标的 ID 或 *，值是金额；没有条目表示不限
  map<string, string> hourly_cap_spot = 5;
  map<string, string> hourly_cap_swap = 6;
  string max_child_notional = 7;
  bool randomize_split = 8;
  // 0 表示用默认批间隔
  int32 batch_interval_seconds = 9;
  // MARKET | PSEUDO_MARKET，空表示默认 PSEUDO_MARKET
  string order_mode = 10;
  string slippage_step = 11;
  string slippage_max = 12;
  int32 max_attempts = 13;
  string resting_ratio = 14;
  // 0 表示挂单保留到下一份目标到达为止
  int32 resting_ttl_seconds = 15;
}

// 组合账户的资金设置，数值用字符串；写入时的校验见 domain/fundsettings。
message FundSettings {
  string reserve_ratio = 1;
  bool bnb_discount = 2;
  string bnb_reserve_amount = 3;
  bool dust_convert_enabled = 4;
  // 0 表示默认 15 天
  int32 dust_convert_interval_days = 5;
  // 稳定币及目标比例：必须含 USDT，比例之和为 1
  map<string, string> stablecoin_margin = 6;
  // 保证金币及配置的固定 U 值
  map<string, string> margin_coins = 7;
  repeated string arbitrage_base_assets = 8;
  // 保证金率监控（只对实盘账户生效）。普通账户：合约钱包权益 ÷ 合约持仓名义不高于 margin_ratio_threshold 时触发，空表示默认 0.5；
  // 统一账户：uniMMR 低于 unified_mmr_threshold 时触发，空表示默认 1.5。触发后暂停组合并按 margin_reduce_ratio（空表示默认 0.1）减仓。
  string margin_ratio_threshold = 9;
  string unified_mmr_threshold = 10;
  string margin_reduce_ratio = 11;
  // 为 true 时不做保证金率监控。
  bool margin_monitor_disabled = 12;
}

message Order {
  string order_id = 1;
  string trading_account_id = 2;
  string client_order_id = 3;
  string exchange_order_id = 4;
  Exchange exchange = 5;
  MarketType market_type = 6;
  string instrument_id = 7;
  string exchange_symbol = 8;
  OrderType order_type = 9;
  FillPolicy fill_policy = 10;
  OrderSide side = 11;
  PositionSide position_side = 12;
  string quantity = 13;
  optional string limit_price = 14;
  string reference_price = 15;
  int64 reference_price_at = 16;
  bool reduce_position_only = 17;
  string owner_type = 18;
  string owner_id = 19;
  string logical_account_id = 20;
  string runner_id = 21;
  string state = 22;
  string filled_quantity = 23;
  string average_price = 24;
  string reserved_asset = 25;
  string reserved_quantity = 26;
  string remaining_reserved_quantity = 27;
  string reject_reason = 28;
  uint64 version = 29;
  int64 submitted_at = 30;
  int64 finished_at = 31;
  int64 created_at = 32;
  int64 updated_at = 33;
  // 伪市价单的第几次尝试，从 0 开始。
  int32 attempt = 34;
}

message Fill {
  string fill_id = 1;
  string exchange_trade_id = 2;
  string order_id = 3;
  string exchange_order_id = 4;
  string trading_account_id = 5;
  Exchange exchange = 6;
  MarketType market_type = 7;
  string instrument_id = 8;
  string exchange_symbol = 9;
  OrderSide side = 10;
  PositionSide position_side = 11;
  string price = 12;
  string quantity = 13;
  string fee = 14;
  string fee_asset = 15;
  string settlement_asset = 16;
  string realized_pnl = 17;
  string role = 18;
  int64 traded_at = 19;
  int64 created_at = 20;
}

message Position {
  // 持仓所属市场；现货和合约的持仓互不抵消。
  MarketType market_type = 16;
  string trading_account_id = 1;
  string instrument_id = 2;
  string exchange_symbol = 3;
  PositionSide position_side = 4;
  string signed_quantity = 5;
  string entry_price = 6;
  string mark_price = 7;
  string leverage = 8;
  string margin_mode = 9;
  string used_margin = 10;
  string liquidation_price = 11;
  string unrealized_pnl = 12;
  string realized_pnl = 13;
  int64 exchange_updated_at = 14;
  int64 updated_at = 15;
}

message InstrumentTarget {
  string instrument_id = 1;
  string quantity = 2;
  // hold 为 true 表示保持当前持仓数量不动，此时 quantity 为空。
  bool hold = 3;
}

message BlockedTarget {
  string instrument_id = 1;
  string quantity = 2;
  string reason = 3;
  // true 表示不是被拦下，而是被单币每小时上限顺延到下一个整点：界面用中性色显示“顺延”，不计入“被拦下”。
  bool deferred = 4;
}

message LogicalAccountTarget {
  string target_id = 1;
  string logical_account_id = 2;
  string runner_id = 3;
  uint64 command_sequence = 4;
  repeated InstrumentTarget targets = 5;
  string status = 6;
  repeated BlockedTarget blocked_targets = 7;
  string last_error = 8;
  int64 accepted_at = 9;
  int64 updated_at = 10;
  string instance_id = 11;
  string session_id = 12;
  string strategy_id = 13;
  int64 bar_end_time = 14;
  int64 effective_at = 15;
  int64 valid_until = 16;
}

message OperatorAction {
  string action_id = 1;
  string logical_account_id = 2;
  string action_type = 3;
  string reason = 4;
  string status = 5;
  string result_json = 6;
  string last_error = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message CreateTradingAccountReq {
  string name = 1;
  Exchange exchange = 2;
  // 要开通的市场：加密货币取 SPOT、SWAP 的子集，股票只有 STOCK。
  repeated MarketType markets = 3;
  string settlement_asset = 4;
  string margin_mode = 5;
  LiveConfig live = 7;
}
message CreateTradingAccountRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message UpdateTradingAccountReq {
  string trading_account_id = 1;
  string name = 2;
  string credential_secret_id = 3;
  string settlement_asset = 4;
  string margin_mode = 5;
  string status = 6;
}
message UpdateTradingAccountRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message GetTradingAccountReq {
  string trading_account_id = 1;
}
message GetTradingAccountRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message ListTradingAccountsReq {
  optional Exchange exchange = 1;
  // 过滤已开通了该市场的账户。
  optional MarketType market_type = 2;
  optional ExecutionMode execution_mode = 3;
  string status = 5;
  common.Page page = 6;
}
message ListTradingAccountsRsp {
  common.RetInfo ret_info = 1;
  repeated TradingAccount accounts = 2;
  common.PageResult page_result = 3;
}

message SetLeverageReq {
  string trading_account_id = 1;
  string instrument_id = 2;
  string leverage = 3;
}
message SetLeverageRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message SyncTradingAccountReq {
  string trading_account_id = 1;
}
message SyncTradingAccountRsp {
  common.RetInfo ret_info = 1;
  int32 fills_ingested = 2;
  int32 orders_updated = 3;
  int32 positions_updated = 4;
  bool account_snapshot_updated = 5;
  int32 unknown_orders_resolved = 6;
  bool ready = 7;
  repeated string warnings = 8;
}

message CreateLogicalAccountReq {
  string name = 1;
  ExecutionMode execution_mode = 2;
  string settlement_asset = 4;
  // Unspecified creates a STRATEGY-controlled account.
  ControlMode control_mode = 5;
}
message CreateLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message GetLogicalAccountReq {
  string logical_account_id = 1;
}
message GetLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ListLogicalAccountsReq {
  common.Page page = 1;
}
message ListLogicalAccountsRsp {
  common.RetInfo ret_info = 1;
  repeated LogicalAccount logical_accounts = 2;
  common.PageResult page_result = 3;
}

message UpdateLogicalAccountReq {
  string logical_account_id = 1;
  string name = 2;
}
message UpdateLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message UpdateLogicalAccountOrderSettingsReq {
  string logical_account_id = 1;
  OrderSettings settings = 2;
}
message UpdateLogicalAccountOrderSettingsRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message UpdateLogicalAccountFundSettingsReq {
  string logical_account_id = 1;
  FundSettings settings = 2;
}
message UpdateLogicalAccountFundSettingsRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message AddLogicalAccountMemberReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
  bool enabled = 3;
  int32 priority = 4;
  bool adopt_existing_exposure = 5;
}
message AddLogicalAccountMemberRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message RemoveLogicalAccountMemberReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
}
message RemoveLogicalAccountMemberRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ClaimLogicalAccountOwnerReq {
  string logical_account_id = 1;
  string instance_id = 3;
  string session_id = 4;
  string expected_auth_fence = 5;
}
message ClaimLogicalAccountOwnerRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ReleaseLogicalAccountOwnerReq {
  string logical_account_id = 1;
  string instance_id = 3;
  string session_id = 4;
  string expected_auth_fence = 5;
}
message ReleaseLogicalAccountOwnerRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message RebindLogicalAccountOwnerReq {
  string logical_account_id = 1;
  string instance_id = 4;
  string session_id = 5;
  string expected_auth_fence = 6;
  string new_instance_id = 7;
  string new_session_id = 8;
}
message RebindLogicalAccountOwnerRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message PauseLogicalAccountReq {
  string logical_account_id = 1;
  string reason = 2;
}
message PauseLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ResumeLogicalAccountReq {
  string logical_account_id = 1;
}
message ResumeLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
  string warning = 3;
}

message FlattenLogicalAccountReq {
  string action_id = 1;
  string logical_account_id = 2;
  string reason = 3;
}
message FlattenLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
}

// 只平组合账户里的一个执行账户；组合账户照样暂停，防止执行器马上把仓位建回来。
message FlattenTradingAccountReq {
  string action_id = 1;
  string trading_account_id = 2;
  string reason = 3;
}
message FlattenTradingAccountRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
}

message PlaceManualOrderReq {
  string action_id = 1;
  string trading_account_id = 2;
  string client_order_id = 3;
  string instrument_id = 4;
  OrderType order_type = 5;
  FillPolicy fill_policy = 6;
  OrderSide side = 7;
  PositionSide position_side = 8;
  string quantity = 9;
  optional string limit_price = 10;
  string reason = 11;
  // Unix milliseconds; zero freezes the server default at first acceptance.
  int64 deadline_at = 12;
  // 订单所在市场。账户开通了多个市场时必填；只开通一个市场时可省略，按它处理。
  MarketType market_type = 13;
}
message PlaceManualOrderRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
  Order order = 3;
}

// Ordinary admission for a MANUAL logical account. It does not pause or cancel
// other orders and returns durable acceptance, not exchange acceptance or a fill.
message SubmitOrderReq {
  string action_id = 1;
  string logical_account_id = 2;
  string trading_account_id = 3;
  string client_order_id = 4;
  string instrument_id = 5;
  OrderType order_type = 6;
  FillPolicy fill_policy = 7;
  OrderSide side = 8;
  PositionSide position_side = 9;
  string quantity = 10;
  optional string limit_price = 11;
  string reason = 12;
  // Unix milliseconds; zero freezes the server default at first acceptance.
  int64 deadline_at = 13;
  // 订单所在市场。账户开通了多个市场时必填；只开通一个市场时可省略，按它处理。
  MarketType market_type = 14;
}
message SubmitOrderRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
  Order order = 3;
}

message CancelOrderReq {
  string action_id = 1;
  string order_id = 2;
  string reason = 3;
}
message CancelOrderRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
  Order order = 3;
}

message GetOperatorActionReq {
  string action_id = 1;
}
message GetOperatorActionRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
}

message GetLogicalAccountTargetReq {
  string logical_account_id = 1;
}
message GetLogicalAccountTargetRsp {
  common.RetInfo ret_info = 1;
  LogicalAccountTarget target = 2;
}

message GetOrderReq {
  string order_id = 1;
}
message GetOrderRsp {
  common.RetInfo ret_info = 1;
  Order order = 2;
}

message ListOrdersReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
  string instrument_id = 3;
  string state = 4;
  bool only_open = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  common.Page page = 8;
  // 按订单来源过滤：TARGET（策略目标）、OPERATOR（人工操作）、EXTERNAL（外部）、SYSTEM（BNB 补买、稳定币调平）；空表示全部。
  string owner_type = 9;
}
message ListOrdersRsp {
  common.RetInfo ret_info = 1;
  repeated Order orders = 2;
  common.PageResult page_result = 3;
}

message ListFillsReq {
  string trading_account_id = 1;
  string order_id = 2;
  string instrument_id = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  common.Page page = 6;
  string logical_account_id = 7;
}
message ListFillsRsp {
  common.RetInfo ret_info = 1;
  repeated Fill fills = 2;
  common.PageResult page_result = 3;
}

message ListPositionsReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
  string instrument_id = 3;
}
message ListPositionsRsp {
  common.RetInfo ret_info = 1;
  repeated Position positions = 2;
}

message CreatePaperSimulationReq {
  string account_name = 1;
  string logical_account_name = 2;
  Exchange exchange = 3;
  // 要开通的市场集合；模拟账户用一个资金池同时撮合开通的各个市场。
  repeated MarketType markets = 4;
  string settlement_asset = 5;
  string margin_mode = 6;
  string initial_balance = 7;
  string maker_fee_rate = 8;
  string taker_fee_rate = 9;
  string slippage_bps = 10;
  // Independent of PAPER/LIVE execution mode; immutable after creation.
  ControlMode control_mode = 11;
  // 加入已有的组合账户：给了编号，就在创建账户的同一个事务里把新账户加成启用成员，
  // 此时 logical_account_name 必须为空。组合必须已暂停、是模拟盘、结算资产一致。
  string logical_account_id = 12;
  // 加入已有组合时的优先级；不填就排在现有成员之后。
  int32 priority = 13;
}

message CreatePaperSimulationRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
  LogicalAccount logical_account = 3;
}

message ClosePaperSimulationReq {
  string trading_account_id = 1;
}

message ClosePaperSimulationRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
  LogicalAccount logical_account = 3;
}

message GetExecutionCapabilitiesReq {
  string trading_account_id = 1;
}

message ExecutionCapabilities {
  bool can_place_order = 1;
  string unavailable_reason = 2;
  repeated OrderType order_types = 3;
  repeated FillPolicy fill_policies = 4;
  bool can_close_paper_simulation = 5;
  // 是否能查询资金流水（币安现货没有统一流水接口）。
  bool ledger = 6;
}

message GetExecutionCapabilitiesRsp {
  common.RetInfo ret_info = 1;
  ExecutionCapabilities capabilities = 2;
}

message ListTradableInstrumentsReq {
  string trading_account_id = 1;
}

// 数量都是基础资产数量，合约已按面值换算。
message TradableInstrument {
  string instrument_id = 1;
  string quantity_step = 2;
  string min_quantity = 3;
  string min_notional = 4;
  string price_tick = 5;
}

message ListTradableInstrumentsRsp {
  common.RetInfo ret_info = 1;
  repeated TradableInstrument instruments = 2;
}

message EquityPoint {
  int64 bucket_time = 1;
  string equity = 2;
  string available_funds = 3;
  string used_margin = 4;
  optional string unrealized_pnl = 5;
  int64 source_time = 6;
}

message QueryEquityCurveReq {
  string trading_account_id = 1;
  string logical_account_id = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

message QueryEquityCurveRsp {
  common.RetInfo ret_info = 1;
  repeated EquityPoint points = 2;
}

message Holding {
  string trading_account_id = 1;
  string instrument_id = 2;
  string exchange_symbol = 3;
  string asset = 4;
  string quantity = 5;
  string average_cost = 6;
  string mark_price = 7;
  string market_value = 8;
  optional string unrealized_pnl = 9;
  int64 source_time = 10;
}

message ListHoldingsReq {
  string trading_account_id = 1;
}

message ListHoldingsRsp {
  common.RetInfo ret_info = 1;
  repeated Holding holdings = 2;
}

service TradeConsoleService {
  rpc CreateTradingAccount(CreateTradingAccountReq) returns (CreateTradingAccountRsp);
  rpc UpdateTradingAccount(UpdateTradingAccountReq) returns (UpdateTradingAccountRsp);
  rpc GetTradingAccount(GetTradingAccountReq) returns (GetTradingAccountRsp);
  rpc ListTradingAccounts(ListTradingAccountsReq) returns (ListTradingAccountsRsp);
  rpc SetLeverage(SetLeverageReq) returns (SetLeverageRsp);
  rpc SyncTradingAccount(SyncTradingAccountReq) returns (SyncTradingAccountRsp);
  rpc CreateLogicalAccount(CreateLogicalAccountReq) returns (CreateLogicalAccountRsp);
  rpc GetLogicalAccount(GetLogicalAccountReq) returns (GetLogicalAccountRsp);
  rpc ListLogicalAccounts(ListLogicalAccountsReq) returns (ListLogicalAccountsRsp);
  rpc UpdateLogicalAccount(UpdateLogicalAccountReq) returns (UpdateLogicalAccountRsp);
  rpc UpdateLogicalAccountOrderSettings(UpdateLogicalAccountOrderSettingsReq) returns (UpdateLogicalAccountOrderSettingsRsp);
  rpc UpdateLogicalAccountFundSettings(UpdateLogicalAccountFundSettingsReq) returns (UpdateLogicalAccountFundSettingsRsp);
  rpc AddLogicalAccountMember(AddLogicalAccountMemberReq) returns (AddLogicalAccountMemberRsp);
  rpc RemoveLogicalAccountMember(RemoveLogicalAccountMemberReq) returns (RemoveLogicalAccountMemberRsp);
  rpc ClaimLogicalAccountOwner(ClaimLogicalAccountOwnerReq) returns (ClaimLogicalAccountOwnerRsp);
  rpc ReleaseLogicalAccountOwner(ReleaseLogicalAccountOwnerReq) returns (ReleaseLogicalAccountOwnerRsp);
  rpc RebindLogicalAccountOwner(RebindLogicalAccountOwnerReq) returns (RebindLogicalAccountOwnerRsp);
  rpc PauseLogicalAccount(PauseLogicalAccountReq) returns (PauseLogicalAccountRsp);
  rpc ResumeLogicalAccount(ResumeLogicalAccountReq) returns (ResumeLogicalAccountRsp);
  rpc FlattenLogicalAccount(FlattenLogicalAccountReq) returns (FlattenLogicalAccountRsp);
  rpc PlaceManualOrder(PlaceManualOrderReq) returns (PlaceManualOrderRsp);
  rpc SubmitOrder(SubmitOrderReq) returns (SubmitOrderRsp);
  rpc CancelOrder(CancelOrderReq) returns (CancelOrderRsp);
  rpc GetOperatorAction(GetOperatorActionReq) returns (GetOperatorActionRsp);
  rpc GetLogicalAccountTarget(GetLogicalAccountTargetReq) returns (GetLogicalAccountTargetRsp);
  rpc GetOrder(GetOrderReq) returns (GetOrderRsp);
  rpc ListOrders(ListOrdersReq) returns (ListOrdersRsp);
  rpc ListFills(ListFillsReq) returns (ListFillsRsp);
  rpc ListPositions(ListPositionsReq) returns (ListPositionsRsp);
  rpc CreatePaperSimulation(CreatePaperSimulationReq) returns (CreatePaperSimulationRsp);
  rpc ClosePaperSimulation(ClosePaperSimulationReq) returns (ClosePaperSimulationRsp);
  rpc GetExecutionCapabilities(GetExecutionCapabilitiesReq) returns (GetExecutionCapabilitiesRsp);
  rpc ListTradableInstruments(ListTradableInstrumentsReq) returns (ListTradableInstrumentsRsp);
  rpc QueryEquityCurve(QueryEquityCurveReq) returns (QueryEquityCurveRsp);
  rpc ListHoldings(ListHoldingsReq) returns (ListHoldingsRsp);
  rpc ListAccountLedger(ListAccountLedgerReq) returns (ListAccountLedgerRsp);
  rpc FlattenTradingAccount(FlattenTradingAccountReq) returns (FlattenTradingAccountRsp);
  rpc BlockInstrument(BlockInstrumentReq) returns (BlockInstrumentRsp);
  rpc UnblockInstrument(UnblockInstrumentReq) returns (UnblockInstrumentRsp);
  rpc ListBlockedInstruments(ListBlockedInstrumentsReq) returns (ListBlockedInstrumentsRsp);
  rpc ListInstrumentHolders(ListInstrumentHoldersReq) returns (ListInstrumentHoldersRsp);
  rpc FlattenInstrument(FlattenInstrumentReq) returns (FlattenInstrumentRsp);
  rpc ReduceLogicalAccount(ReduceLogicalAccountReq) returns (ReduceLogicalAccountRsp);
  rpc SummarizeAccountPnl(SummarizeAccountPnlReq) returns (SummarizeAccountPnlRsp);
  rpc ListOperatorActions(ListOperatorActionsReq) returns (ListOperatorActionsRsp);
}

// 资金流水：手续费、资金费、已实现盈亏、划转等，从交易所即查即用，按时间倒序。
message ListAccountLedgerReq {
  string trading_account_id = 1;
  // 毫秒时间戳；不传时默认近 7 天，最长 90 天。
  int64 start_time = 2;
  int64 end_time = 3;
  // 默认 200，最多 1000。
  int32 limit = 4;
  // 要查流水的市场；账户只有一个市场支持流水时可省略。
  MarketType market_type = 5;
}

message LedgerEntry {
  string id = 1;
  int64 time = 2;
  // TRADE、FEE、REALIZED_PNL、FUNDING_FEE、TRANSFER、LIQUIDATION、INTEREST、OTHER
  string type = 3;
  string exchange_type = 4;
  string asset = 5;
  string amount = 6;
  string exchange_symbol = 7;
  string trade_id = 8;
  string info = 9;
  // 流水所属市场。
  MarketType market_type = 10;
}

message ListAccountLedgerRsp {
  common.RetInfo ret_info = 1;
  repeated LedgerEntry entries = 2;
  // 时间窗内还有更早的记录没取到。
  bool has_more = 3;
}

// ===== 下架名单与下架清仓（交易计划 4.7，供事件中心调用） =====
// 下面的接口都用（交易所、市场、交易所代码）定位标的，由 Trade 换算内部标的 ID。
// 名单的三个接口和 ListInstrumentHolders 是全局的，不分空间，Trade 不检查空间头。

// 写入下架名单。名单标的“只减不增”：还能交易时目标里加仓的部分被截掉、减仓照常，不能交易时整项跳过。
message BlockInstrumentReq {
  Exchange exchange = 1;
  // 只收 MARKET_TYPE_SPOT、MARKET_TYPE_SWAP。
  MarketType market_type = 2;
  string exchange_symbol = 3;
  string reason = 4;
  // 来源事件 ID，只用于审计。
  string event_id = 5;
}
message BlockInstrumentRsp {
  common.RetInfo ret_info = 1;
  // true 表示 Trade 无此标的（用户没开通对应市场的账户）：照常写入名单，不算失败。
  bool instrument_unknown = 2;
  // false 表示标的已经在名单里，没有改动。
  bool created = 3;
}

message UnblockInstrumentReq {
  Exchange exchange = 1;
  MarketType market_type = 2;
  string exchange_symbol = 3;
}
message UnblockInstrumentRsp {
  common.RetInfo ret_info = 1;
  // false 表示标的本来就不在名单里。
  bool removed = 2;
}

message BlockedInstrument {
  Exchange exchange = 1;
  MarketType market_type = 2;
  string exchange_symbol = 3;
  // 写入时能从标的表查到的内部标的 ID 和基础资产，只用于展示和审计，查不到为空。
  string instrument_id = 4;
  string base_asset = 5;
  string reason = 6;
  string source_event_id = 7;
  int64 blocked_at = 8;
}
message ListBlockedInstrumentsReq {}
message ListBlockedInstrumentsRsp {
  common.RetInfo ret_info = 1;
  repeated BlockedInstrument instruments = 2;
}

// 策略持有某个标的的一个执行账户（每个执行账户一行，调用方按空间和组合聚合）。
message InstrumentHolder {
  string space_id = 1;
  string logical_account_id = 2;
  string trading_account_id = 3;
  // 持有数量，保留原精度：现货是余额，永续是带符号的持仓。
  string quantity = 4;
  // 零头：低于交易所最小数量，下不了单，清仓也不会处理。
  bool dust = 5;
  // 模拟盘。
  bool paper = 6;
}
message ListInstrumentHoldersReq {
  Exchange exchange = 1;
  MarketType market_type = 2;
  string exchange_symbol = 3;
  // true 时只返回模拟盘。
  bool paper_only = 4;
}
message ListInstrumentHoldersRsp {
  common.RetInfo ret_info = 1;
  // 没有持有者时是空数组（不会省略）。holders 为空且 instrument_unknown 为 false，表示确认没有策略持有。
  repeated InstrumentHolder holders = 2;
  // true 表示 Trade 无此标的，这时 holders 为空，不算失败。
  bool instrument_unknown = 3;
}

// 在调用时带的空间里，对组合中属于这个交易所的成员发起单标的下架清仓（DELIST_FLATTEN）：不暂停组合，只看这一个标的。
// 同一个 action_id 要求组合、标的、reason 完全一致；已完成的直接返回旧结果；FAILED、PARTIAL 用同一个号再调会重新执行。
message FlattenInstrumentReq {
  string action_id = 1;
  string logical_account_id = 2;
  Exchange exchange = 3;
  MarketType market_type = 4;
  string exchange_symbol = 5;
  string reason = 6;
}
message FlattenInstrumentRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
  // true 表示 Trade 暂时忙（同组合有整组清仓、减仓在跑，或拿不到组合锁），稍后再试，不计入重试次数；此时 ret_info 是 CONFLICT。
  bool busy = 3;
  // true 表示标的已被解除禁止而提前结束，动作记 COMPLETED，不要重试（结果 JSON 顶层也带 unblocked）。
  bool unblocked = 4;
}

// 按比例减仓（REDUCE）：先暂停组合、撤全部订单，再把现货和合约同比例减掉；每个持仓的目标数量发起时写定，重试不会再减一次。
message ReduceLogicalAccountReq {
  string action_id = 1;
  string logical_account_id = 2;
  // 大于 0 小于 1 的比例，例如 0.1。
  string reduce_ratio = 3;
  string reason = 4;
}
message ReduceLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
}

// ===== 收益拆解与人工操作记录 =====

message PnlAmount {
  string asset = 1;
  string amount = 2;
}

// 收益拆解：手续费和已实现盈亏从成交表汇总，资金费从交易所流水即查。
message SummarizeAccountPnlReq {
  string logical_account_id = 1;
  // 只看组合里的一个执行账户。
  string trading_account_id = 2;
  // 毫秒时间戳；不传时默认近 7 天，时间范围最长 90 天。
  int64 start_time = 3;
  int64 end_time = 4;
}
message SummarizeAccountPnlRsp {
  common.RetInfo ret_info = 1;
  // 手续费，按手续费资产分别汇总（不折算），费用为正数。
  repeated PnlAmount fees = 2;
  // 已实现盈亏，按结算资产汇总。
  repeated PnlAmount realized_pnl = 3;
  // 资金费，按结算资产汇总，收到为正、支付为负。
  repeated PnlAmount funding_fees = 4;
  int64 fill_count = 5;
  // 资金费是否取到了：模拟盘、现货账户或交易所不支持流水时为 false，funding_note 说明原因。
  bool funding_available = 6;
  // 资金费流水翻页没取完，或有账户的流水查不了：汇总只是一部分。
  bool funding_truncated = 7;
  string funding_note = 8;
  // 资金费实际统计的起点（毫秒时间戳）。
  int64 funding_from = 9;
}

message ListOperatorActionsReq {
  string logical_account_id = 1;
  // 按动作类型过滤：MANUAL_ORDER、SUBMIT_ORDER、CANCEL_ORDER、FLATTEN、REDUCE、DELIST_FLATTEN；空表示全部。
  string action_type = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  common.Page page = 5;
}
message ListOperatorActionsRsp {
  common.RetInfo ret_info = 1;
  repeated OperatorAction actions = 2;
  common.PageResult page_result = 3;
}
