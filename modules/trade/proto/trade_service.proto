syntax = "proto3";

package trpc.moox.trade;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/trade/proto/tradegen;tradepb";

// Decimal values are encoded as strings. Timestamps are Unix milliseconds.

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_BINANCE = 1;
  EXCHANGE_OKX = 2;
}

enum MarketType {
  MARKET_TYPE_UNSPECIFIED = 0;
  MARKET_TYPE_SPOT = 1;
  MARKET_TYPE_SWAP = 2;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_PAPER = 1;
  EXECUTION_MODE_LIVE = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0;
  POSITION_SIDE_NET = 1;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

message AssetBalance {
  string asset = 1;
  string available = 2;
  string locked = 3;
  string total = 4;
}

message ExchangeAccountSnapshot {
  repeated AssetBalance balances = 1;
  string equity = 2;
  string available_funds = 3;
  string used_margin = 4;
  string maintenance_margin = 5;
  string unrealized_pnl = 6;
  int64 exchange_updated_at = 7;
}

message ExchangeAccount {
  string exchange_account_id = 1;
  string space_id = 2;
  string name = 3;
  Exchange exchange = 4;
  MarketType market_type = 5;
  ExecutionMode execution_mode = 6;
  string credential_secret_id = 7;
  string settlement_asset = 8;
  string margin_mode = 9;
  string status = 10;
  bool paused = 11;
  string pause_reason = 12;
  bool ready = 13;
  map<string, string> leverage_settings = 14;
  ExchangeAccountSnapshot snapshot = 15;
  int64 last_sync_at = 16;
  int64 last_ready_at = 17;
  string last_error = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
}

message Order {
  string order_id = 1;
  string exchange_account_id = 2;
  string client_order_id = 3;
  string exchange_order_id = 4;
  Exchange exchange = 5;
  MarketType market_type = 6;
  string symbol = 7;
  OrderType order_type = 8;
  TimeInForce time_in_force = 9;
  OrderSide side = 10;
  PositionSide position_side = 11;
  string quantity = 12;
  optional string limit_price = 13;
  string reference_price = 14;
  int64 reference_price_at = 15;
  bool reduce_only = 16;
  string source = 17;
  string strategy_execution_id = 18;
  string state = 19;
  string filled_quantity = 20;
  string average_price = 21;
  string reserved_asset = 22;
  string reserved_quantity = 23;
  string remaining_reserved_quantity = 24;
  string reject_reason = 25;
  uint64 version = 26;
  int64 submitted_at = 27;
  int64 finished_at = 28;
  int64 created_at = 29;
  int64 updated_at = 30;
}

message Fill {
  string fill_id = 1;
  string exchange_trade_id = 2;
  string order_id = 3;
  string exchange_order_id = 4;
  string exchange_account_id = 5;
  Exchange exchange = 6;
  MarketType market_type = 7;
  string symbol = 8;
  OrderSide side = 9;
  PositionSide position_side = 10;
  string price = 11;
  string quantity = 12;
  string fee = 13;
  string fee_asset = 14;
  string settlement_asset = 15;
  string realized_pnl = 16;
  string role = 17;
  int64 traded_at = 18;
  int64 created_at = 19;
}

message Position {
  string exchange_account_id = 1;
  string symbol = 2;
  PositionSide position_side = 3;
  string signed_quantity = 4;
  string entry_price = 5;
  string mark_price = 6;
  string leverage = 7;
  string margin_mode = 8;
  string used_margin = 9;
  string liquidation_price = 10;
  string unrealized_pnl = 11;
  string realized_pnl = 12;
  int64 exchange_updated_at = 13;
  int64 updated_at = 14;
}

message TargetPosition {
  string instrument_id = 1;
  string symbol = 2;
  string target_quantity = 3;
}

message TargetExecution {
  string execution_id = 1;
  string event_id = 2;
  string strategy_run_id = 3;
  string execution_binding_id = 4;
  string exchange_account_id = 5;
  uint64 command_sequence = 6;
  int64 not_after = 7;
  string data_revision = 8;
  repeated TargetPosition targets = 9;
  string status = 10;
  string progress = 11;
  string residual_quantity = 12;
  string last_error = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

message CreateAccountReq {
  string name = 1;
  Exchange exchange = 2;
  MarketType market_type = 3;
  ExecutionMode execution_mode = 4;
  string credential_secret_id = 5;
  string settlement_asset = 6;
  string margin_mode = 7;
}
message CreateAccountRsp {
  common.RetInfo ret_info = 1;
  ExchangeAccount account = 2;
}

message UpdateAccountReq {
  string exchange_account_id = 1;
  string name = 2;
  string credential_secret_id = 3;
  string settlement_asset = 4;
  string margin_mode = 5;
  string status = 6;
}
message UpdateAccountRsp {
  common.RetInfo ret_info = 1;
  ExchangeAccount account = 2;
}

message GetAccountReq {
  string exchange_account_id = 1;
}
message GetAccountRsp {
  common.RetInfo ret_info = 1;
  ExchangeAccount account = 2;
}

message ListAccountsReq {
  optional Exchange exchange = 1;
  optional MarketType market_type = 2;
  optional ExecutionMode execution_mode = 3;
  string status = 4;
  common.Page page = 5;
}
message ListAccountsRsp {
  common.RetInfo ret_info = 1;
  repeated ExchangeAccount accounts = 2;
  common.PageResult page_result = 3;
}

message SetLeverageReq {
  string exchange_account_id = 1;
  string symbol = 2;
  string leverage = 3;
}
message SetLeverageRsp {
  common.RetInfo ret_info = 1;
  ExchangeAccount account = 2;
}

message PauseAccountReq {
  string exchange_account_id = 1;
  bool paused = 2;
  string reason = 3;
}
message PauseAccountRsp {
  common.RetInfo ret_info = 1;
  ExchangeAccount account = 2;
}

message SyncAccountReq {
  string exchange_account_id = 1;
}
message SyncAccountRsp {
  common.RetInfo ret_info = 1;
  int32 fills_ingested = 2;
  int32 orders_updated = 3;
  int32 positions_updated = 4;
  bool account_snapshot_updated = 5;
  int32 unknown_orders_resolved = 6;
  bool ready = 7;
  repeated string warnings = 8;
}

message PlaceOrderReq {
  string exchange_account_id = 1;
  string client_order_id = 2;
  string symbol = 3;
  OrderType order_type = 4;
  TimeInForce time_in_force = 5;
  OrderSide side = 6;
  PositionSide position_side = 7;
  string quantity = 8;
  optional string limit_price = 9;
  bool reduce_only = 10;
  string source = 11;
  string strategy_execution_id = 12;
}
message PlaceOrderRsp {
  common.RetInfo ret_info = 1;
  Order order = 2;
}

message CancelOrderReq {
  string order_id = 1;
}
message CancelOrderRsp {
  common.RetInfo ret_info = 1;
  Order order = 2;
}

message CancelAllOrdersReq {
  string exchange_account_id = 1;
  string symbol = 2;
}
message CancelAllOrdersRsp {
  common.RetInfo ret_info = 1;
  int32 canceled_count = 2;
}

message SubmitTargetReq {
  string event_id = 1;
  string execution_id = 2;
  string strategy_run_id = 3;
  string execution_binding_id = 4;
  string exchange_account_id = 5;
  uint64 command_sequence = 6;
  int64 not_after = 7;
  string data_revision = 8;
  repeated TargetPosition targets = 9;
}
message SubmitTargetRsp {
  common.RetInfo ret_info = 1;
  TargetExecution execution = 2;
}

message GetExecutionReq {
  string execution_id = 1;
}
message GetExecutionRsp {
  common.RetInfo ret_info = 1;
  TargetExecution execution = 2;
}

message ListExecutionsReq {
  string exchange_account_id = 1;
  string execution_binding_id = 2;
  string status = 3;
  common.Page page = 4;
}
message ListExecutionsRsp {
  common.RetInfo ret_info = 1;
  repeated TargetExecution executions = 2;
  common.PageResult page_result = 3;
}

message GetOrderReq {
  string order_id = 1;
}
message GetOrderRsp {
  common.RetInfo ret_info = 1;
  Order order = 2;
}

message ListOrdersReq {
  string exchange_account_id = 1;
  string symbol = 2;
  string state = 3;
  bool only_open = 4;
  int64 start_time = 5;
  int64 end_time = 6;
  common.Page page = 7;
}
message ListOrdersRsp {
  common.RetInfo ret_info = 1;
  repeated Order orders = 2;
  common.PageResult page_result = 3;
}

message ListFillsReq {
  string exchange_account_id = 1;
  string order_id = 2;
  string symbol = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  common.Page page = 6;
}
message ListFillsRsp {
  common.RetInfo ret_info = 1;
  repeated Fill fills = 2;
  common.PageResult page_result = 3;
}

message ListPositionsReq {
  string exchange_account_id = 1;
  string symbol = 2;
}
message ListPositionsRsp {
  common.RetInfo ret_info = 1;
  repeated Position positions = 2;
}

service ExchangeAccountService {
  rpc CreateAccount(CreateAccountReq) returns (CreateAccountRsp);
  rpc UpdateAccount(UpdateAccountReq) returns (UpdateAccountRsp);
  rpc GetAccount(GetAccountReq) returns (GetAccountRsp);
  rpc ListAccounts(ListAccountsReq) returns (ListAccountsRsp);
  rpc SetLeverage(SetLeverageReq) returns (SetLeverageRsp);
  rpc PauseAccount(PauseAccountReq) returns (PauseAccountRsp);
  rpc SyncAccount(SyncAccountReq) returns (SyncAccountRsp);
}

service TradeExecutionService {
  rpc PlaceOrder(PlaceOrderReq) returns (PlaceOrderRsp);
  rpc CancelOrder(CancelOrderReq) returns (CancelOrderRsp);
  rpc CancelAllOrders(CancelAllOrdersReq) returns (CancelAllOrdersRsp);
  rpc SubmitTarget(SubmitTargetReq) returns (SubmitTargetRsp);
  rpc GetExecution(GetExecutionReq) returns (GetExecutionRsp);
  rpc ListExecutions(ListExecutionsReq) returns (ListExecutionsRsp);
  rpc GetOrder(GetOrderReq) returns (GetOrderRsp);
  rpc ListOrders(ListOrdersReq) returns (ListOrdersRsp);
  rpc ListFills(ListFillsReq) returns (ListFillsRsp);
  rpc ListPositions(ListPositionsReq) returns (ListPositionsRsp);
}
