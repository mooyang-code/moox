syntax = "proto3";

package trpc.moox.trade;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/trade/proto/tradegen;tradepb";

// Decimal values are encoded as strings. Timestamps are Unix milliseconds.

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_BINANCE = 1;
  EXCHANGE_OKX = 2;
}

enum MarketType {
  MARKET_TYPE_UNSPECIFIED = 0;
  MARKET_TYPE_SPOT = 1;
  MARKET_TYPE_SWAP = 2;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_PAPER = 1;
  EXECUTION_MODE_LIVE = 2;
}

enum AccountEnvironment {
  ACCOUNT_ENVIRONMENT_UNSPECIFIED = 0;
  ACCOUNT_ENVIRONMENT_TESTNET = 1;
  ACCOUNT_ENVIRONMENT_PRODUCTION = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
}

enum FillPolicy {
  FILL_POLICY_UNSPECIFIED = 0;
  FILL_POLICY_GTC = 1;
  FILL_POLICY_IOC = 2;
  FILL_POLICY_FOK = 3;
}

enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0;
  POSITION_SIDE_NET = 1;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

message AssetBalance {
  string asset = 1;
  string available = 2;
  string locked = 3;
  string total = 4;
}

message TradingAccountSnapshot {
  repeated AssetBalance balances = 1;
  string equity = 2;
  string available_funds = 3;
  string used_margin = 4;
  string maintenance_margin = 5;
  string unrealized_pnl = 6;
  int64 exchange_updated_at = 7;
}

message LiveConfig {
  AccountEnvironment environment = 1;
  string credential_secret_id = 2;
}

message PaperConfig {
  string initial_balance = 1;
  string maker_fee_rate = 2;
  string taker_fee_rate = 3;
  string slippage_bps = 4;
}

message TradingAccount {
  string trading_account_id = 1;
  string space_id = 2;
  string name = 3;
  Exchange exchange = 4;
  MarketType market_type = 5;
  ExecutionMode execution_mode = 6;
  string settlement_asset = 7;
  string margin_mode = 8;
  map<string, string> leverage_settings = 9;
  repeated string sync_symbols = 10;
  string status = 11;
  bool ready = 12;
  int64 last_sync_at = 13;
  int64 last_ready_at = 14;
  string last_error = 15;
  oneof execution_config {
    LiveConfig live = 16;
    PaperConfig paper = 17;
  }
  TradingAccountSnapshot snapshot = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
}

message LogicalAccountMember {
  string trading_account_id = 1;
  bool enabled = 2;
  int32 priority = 3;
}

message LogicalAccount {
  string logical_account_id = 1;
  string space_id = 2;
  string name = 3;
  string owner_runner_id = 4;
  ExecutionMode execution_mode = 5;
  MarketType market_type = 6;
  string settlement_asset = 7;
  string automation_state = 8;
  string pause_reason = 9;
  repeated LogicalAccountMember members = 10;
  bool ready = 11;
  repeated string readiness_reasons = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  int64 owner_generation = 15;
  // New strategy lifecycle identity. The legacy owner_runner_id and
  // owner_generation fields remain only for source compatibility.
  string owner_instance_id = 16;
  string owner_session_id = 17;
  // Opaque compare-and-set token used by Strategy lifecycle calls. It is
  // returned to trusted internal callers only; target events use the numeric
  // owner_generation fence instead.
  string auth_fence = 18;
}

message Order {
  string order_id = 1;
  string trading_account_id = 2;
  string client_order_id = 3;
  string exchange_order_id = 4;
  Exchange exchange = 5;
  MarketType market_type = 6;
  string instrument_id = 7;
  string exchange_symbol = 8;
  OrderType order_type = 9;
  FillPolicy fill_policy = 10;
  OrderSide side = 11;
  PositionSide position_side = 12;
  string quantity = 13;
  optional string limit_price = 14;
  string reference_price = 15;
  int64 reference_price_at = 16;
  bool reduce_position_only = 17;
  string owner_type = 18;
  string owner_id = 19;
  string logical_account_id = 20;
  string runner_id = 21;
  string state = 22;
  string filled_quantity = 23;
  string average_price = 24;
  string reserved_asset = 25;
  string reserved_quantity = 26;
  string remaining_reserved_quantity = 27;
  string reject_reason = 28;
  uint64 version = 29;
  int64 submitted_at = 30;
  int64 finished_at = 31;
  int64 created_at = 32;
  int64 updated_at = 33;
}

message Fill {
  string fill_id = 1;
  string exchange_trade_id = 2;
  string order_id = 3;
  string exchange_order_id = 4;
  string trading_account_id = 5;
  Exchange exchange = 6;
  MarketType market_type = 7;
  string instrument_id = 8;
  string exchange_symbol = 9;
  OrderSide side = 10;
  PositionSide position_side = 11;
  string price = 12;
  string quantity = 13;
  string fee = 14;
  string fee_asset = 15;
  string settlement_asset = 16;
  string realized_pnl = 17;
  string role = 18;
  int64 traded_at = 19;
  int64 created_at = 20;
}

message Position {
  string trading_account_id = 1;
  string instrument_id = 2;
  string exchange_symbol = 3;
  PositionSide position_side = 4;
  string signed_quantity = 5;
  string entry_price = 6;
  string mark_price = 7;
  string leverage = 8;
  string margin_mode = 9;
  string used_margin = 10;
  string liquidation_price = 11;
  string unrealized_pnl = 12;
  string realized_pnl = 13;
  int64 exchange_updated_at = 14;
  int64 updated_at = 15;
}

message InstrumentTarget {
  string instrument_id = 1;
  string quantity = 2;
}

message BlockedTarget {
  string instrument_id = 1;
  string quantity = 2;
  string reason = 3;
}

message LogicalAccountTarget {
  string target_id = 1;
  string logical_account_id = 2;
  string runner_id = 3;
  uint64 command_sequence = 4;
  repeated InstrumentTarget targets = 5;
  string status = 6;
  repeated BlockedTarget blocked_targets = 7;
  string last_error = 8;
  int64 accepted_at = 9;
  int64 updated_at = 10;
  string instance_id = 11;
  string session_id = 12;
  string strategy_id = 13;
  int64 bar_end_time = 14;
  int64 effective_at = 15;
  int64 valid_until = 16;
}

message OperatorAction {
  string action_id = 1;
  string logical_account_id = 2;
  string action_type = 3;
  string reason = 4;
  string status = 5;
  string result_json = 6;
  string last_error = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message CreateTradingAccountReq {
  string name = 1;
  Exchange exchange = 2;
  MarketType market_type = 3;
  string settlement_asset = 4;
  string margin_mode = 5;
  repeated string sync_symbols = 6;
  LiveConfig live = 7;
}
message CreateTradingAccountRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message UpdateTradingAccountReq {
  string trading_account_id = 1;
  string name = 2;
  string credential_secret_id = 3;
  string settlement_asset = 4;
  string margin_mode = 5;
  string status = 6;
  repeated string sync_symbols = 7;
}
message UpdateTradingAccountRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message GetTradingAccountReq {
  string trading_account_id = 1;
}
message GetTradingAccountRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message ListTradingAccountsReq {
  optional Exchange exchange = 1;
  optional MarketType market_type = 2;
  optional ExecutionMode execution_mode = 3;
  string status = 5;
  common.Page page = 6;
}
message ListTradingAccountsRsp {
  common.RetInfo ret_info = 1;
  repeated TradingAccount accounts = 2;
  common.PageResult page_result = 3;
}

message SetLeverageReq {
  string trading_account_id = 1;
  string instrument_id = 2;
  string leverage = 3;
}
message SetLeverageRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
}

message SyncTradingAccountReq {
  string trading_account_id = 1;
}
message SyncTradingAccountRsp {
  common.RetInfo ret_info = 1;
  int32 fills_ingested = 2;
  int32 orders_updated = 3;
  int32 positions_updated = 4;
  bool account_snapshot_updated = 5;
  int32 unknown_orders_resolved = 6;
  bool ready = 7;
  repeated string warnings = 8;
}

message CreateLogicalAccountReq {
  string name = 1;
  ExecutionMode execution_mode = 2;
  MarketType market_type = 3;
  string settlement_asset = 4;
}
message CreateLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message GetLogicalAccountReq {
  string logical_account_id = 1;
}
message GetLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ListLogicalAccountsReq {
  common.Page page = 1;
}
message ListLogicalAccountsRsp {
  common.RetInfo ret_info = 1;
  repeated LogicalAccount logical_accounts = 2;
  common.PageResult page_result = 3;
}

message UpdateLogicalAccountReq {
  string logical_account_id = 1;
  string name = 2;
}
message UpdateLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message AddLogicalAccountMemberReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
  bool enabled = 3;
  int32 priority = 4;
  bool adopt_existing_exposure = 5;
}
message AddLogicalAccountMemberRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message RemoveLogicalAccountMemberReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
}
message RemoveLogicalAccountMemberRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ClaimLogicalAccountOwnerReq {
  string logical_account_id = 1;
  string runner_id = 2;
  string instance_id = 3;
  string session_id = 4;
  string expected_auth_fence = 5;
}
message ClaimLogicalAccountOwnerRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ReleaseLogicalAccountOwnerReq {
  string logical_account_id = 1;
  string runner_id = 2;
  string instance_id = 3;
  string session_id = 4;
  string expected_auth_fence = 5;
}
message ReleaseLogicalAccountOwnerRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message RebindLogicalAccountOwnerReq {
  string logical_account_id = 1;
  string runner_id = 2;
  string rebind_key = 3;
  string instance_id = 4;
  string session_id = 5;
  string expected_auth_fence = 6;
  string new_instance_id = 7;
  string new_session_id = 8;
}
message RebindLogicalAccountOwnerRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message PauseLogicalAccountReq {
  string logical_account_id = 1;
  string reason = 2;
}
message PauseLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
}

message ResumeLogicalAccountReq {
  string logical_account_id = 1;
}
message ResumeLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  LogicalAccount logical_account = 2;
  string warning = 3;
}

message FlattenLogicalAccountReq {
  string action_id = 1;
  string logical_account_id = 2;
  string reason = 3;
}
message FlattenLogicalAccountRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
}

message PlaceManualOrderReq {
  string action_id = 1;
  string trading_account_id = 2;
  string client_order_id = 3;
  string instrument_id = 4;
  OrderType order_type = 5;
  FillPolicy fill_policy = 6;
  OrderSide side = 7;
  PositionSide position_side = 8;
  string quantity = 9;
  optional string limit_price = 10;
  string reason = 11;
}
message PlaceManualOrderRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
  Order order = 3;
}

message CancelOrderReq {
  string action_id = 1;
  string order_id = 2;
  string reason = 3;
}
message CancelOrderRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
  Order order = 3;
}

message GetOperatorActionReq {
  string action_id = 1;
}
message GetOperatorActionRsp {
  common.RetInfo ret_info = 1;
  OperatorAction action = 2;
}

message GetLogicalAccountTargetReq {
  string logical_account_id = 1;
}
message GetLogicalAccountTargetRsp {
  common.RetInfo ret_info = 1;
  LogicalAccountTarget target = 2;
}

message GetOrderReq {
  string order_id = 1;
}
message GetOrderRsp {
  common.RetInfo ret_info = 1;
  Order order = 2;
}

message ListOrdersReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
  string instrument_id = 3;
  string state = 4;
  bool only_open = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  common.Page page = 8;
}
message ListOrdersRsp {
  common.RetInfo ret_info = 1;
  repeated Order orders = 2;
  common.PageResult page_result = 3;
}

message ListFillsReq {
  string trading_account_id = 1;
  string order_id = 2;
  string instrument_id = 3;
  int64 start_time = 4;
  int64 end_time = 5;
  common.Page page = 6;
}
message ListFillsRsp {
  common.RetInfo ret_info = 1;
  repeated Fill fills = 2;
  common.PageResult page_result = 3;
}

message ListPositionsReq {
  string logical_account_id = 1;
  string trading_account_id = 2;
  string instrument_id = 3;
}
message ListPositionsRsp {
  common.RetInfo ret_info = 1;
  repeated Position positions = 2;
}

message ResolveDomainsReq {
  repeated string domains = 1;
  uint32 max_ips_per_domain = 2;
}

message ResolvedIP {
  string ip = 1;
  uint32 tcp_connect_latency_ms = 2;
}

message DomainResolution {
  string domain = 1;
  repeated ResolvedIP ips = 2;
}

message ResolveDomainsRsp {
  common.RetInfo ret_info = 1;
  repeated DomainResolution resolutions = 2;
  repeated string unresolved_domains = 3;
}

message CreatePaperSimulationReq {
  string account_name = 1;
  string logical_account_name = 2;
  Exchange exchange = 3;
  MarketType market_type = 4;
  string settlement_asset = 5;
  string margin_mode = 6;
  string initial_balance = 7;
  string maker_fee_rate = 8;
  string taker_fee_rate = 9;
  string slippage_bps = 10;
}

message CreatePaperSimulationRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
  LogicalAccount logical_account = 3;
}

message ClosePaperSimulationReq {
  string trading_account_id = 1;
}

message ClosePaperSimulationRsp {
  common.RetInfo ret_info = 1;
  TradingAccount account = 2;
  LogicalAccount logical_account = 3;
}

message GetExecutionCapabilitiesReq {
  string trading_account_id = 1;
}

message ExecutionCapabilities {
  bool can_place_order = 1;
  string unavailable_reason = 2;
  repeated OrderType order_types = 3;
  repeated FillPolicy fill_policies = 4;
  bool can_close_paper_simulation = 5;
}

message GetExecutionCapabilitiesRsp {
  common.RetInfo ret_info = 1;
  ExecutionCapabilities capabilities = 2;
}

message EquityPoint {
  int64 bucket_time = 1;
  string equity = 2;
  string available_funds = 3;
  string used_margin = 4;
  optional string unrealized_pnl = 5;
  int64 source_time = 6;
}

message QueryEquityCurveReq {
  string trading_account_id = 1;
  string logical_account_id = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

message QueryEquityCurveRsp {
  common.RetInfo ret_info = 1;
  repeated EquityPoint points = 2;
}

message Holding {
  string trading_account_id = 1;
  string instrument_id = 2;
  string exchange_symbol = 3;
  string asset = 4;
  string quantity = 5;
  string average_cost = 6;
  string mark_price = 7;
  string market_value = 8;
  optional string unrealized_pnl = 9;
  int64 source_time = 10;
}

message ListHoldingsReq {
  string trading_account_id = 1;
}

message ListHoldingsRsp {
  common.RetInfo ret_info = 1;
  repeated Holding holdings = 2;
}

service TradeDNSResolverService {
  rpc ResolveDomains(ResolveDomainsReq) returns (ResolveDomainsRsp);
}

service TradeConsoleService {
  rpc CreateTradingAccount(CreateTradingAccountReq) returns (CreateTradingAccountRsp);
  rpc UpdateTradingAccount(UpdateTradingAccountReq) returns (UpdateTradingAccountRsp);
  rpc GetTradingAccount(GetTradingAccountReq) returns (GetTradingAccountRsp);
  rpc ListTradingAccounts(ListTradingAccountsReq) returns (ListTradingAccountsRsp);
  rpc SetLeverage(SetLeverageReq) returns (SetLeverageRsp);
  rpc SyncTradingAccount(SyncTradingAccountReq) returns (SyncTradingAccountRsp);
  rpc CreateLogicalAccount(CreateLogicalAccountReq) returns (CreateLogicalAccountRsp);
  rpc GetLogicalAccount(GetLogicalAccountReq) returns (GetLogicalAccountRsp);
  rpc ListLogicalAccounts(ListLogicalAccountsReq) returns (ListLogicalAccountsRsp);
  rpc UpdateLogicalAccount(UpdateLogicalAccountReq) returns (UpdateLogicalAccountRsp);
  rpc AddLogicalAccountMember(AddLogicalAccountMemberReq) returns (AddLogicalAccountMemberRsp);
  rpc RemoveLogicalAccountMember(RemoveLogicalAccountMemberReq) returns (RemoveLogicalAccountMemberRsp);
  rpc ClaimLogicalAccountOwner(ClaimLogicalAccountOwnerReq) returns (ClaimLogicalAccountOwnerRsp);
  rpc ReleaseLogicalAccountOwner(ReleaseLogicalAccountOwnerReq) returns (ReleaseLogicalAccountOwnerRsp);
  rpc RebindLogicalAccountOwner(RebindLogicalAccountOwnerReq) returns (RebindLogicalAccountOwnerRsp);
  rpc PauseLogicalAccount(PauseLogicalAccountReq) returns (PauseLogicalAccountRsp);
  rpc ResumeLogicalAccount(ResumeLogicalAccountReq) returns (ResumeLogicalAccountRsp);
  rpc FlattenLogicalAccount(FlattenLogicalAccountReq) returns (FlattenLogicalAccountRsp);
  rpc PlaceManualOrder(PlaceManualOrderReq) returns (PlaceManualOrderRsp);
  rpc CancelOrder(CancelOrderReq) returns (CancelOrderRsp);
  rpc GetOperatorAction(GetOperatorActionReq) returns (GetOperatorActionRsp);
  rpc GetLogicalAccountTarget(GetLogicalAccountTargetReq) returns (GetLogicalAccountTargetRsp);
  rpc GetOrder(GetOrderReq) returns (GetOrderRsp);
  rpc ListOrders(ListOrdersReq) returns (ListOrdersRsp);
  rpc ListFills(ListFillsReq) returns (ListFillsRsp);
  rpc ListPositions(ListPositionsReq) returns (ListPositionsRsp);
  rpc CreatePaperSimulation(CreatePaperSimulationReq) returns (CreatePaperSimulationRsp);
  rpc ClosePaperSimulation(ClosePaperSimulationReq) returns (ClosePaperSimulationRsp);
  rpc GetExecutionCapabilities(GetExecutionCapabilitiesReq) returns (GetExecutionCapabilitiesRsp);
  rpc QueryEquityCurve(QueryEquityCurveReq) returns (QueryEquityCurveRsp);
  rpc ListHoldings(ListHoldingsReq) returns (ListHoldingsRsp);
}
