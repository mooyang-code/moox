syntax = "proto3";

package trpc.moox.egress;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/egressproxy/proto/egressgen;egresspb";

service Proxy {
  rpc Do(DoReq) returns (DoRsp);
}

message DoReq {
  string method = 1;
  string host = 2;
  string path = 3;
  string query = 4;
  map<string, string> headers = 5;
  bytes body = 6;
  int32 timeout_ms = 7;
}

message DoRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  int32 status = 2;
  map<string, string> headers = 3;
  // 最多 32 MiB；HTTP 错误状态仍是代理成功响应。传输压缩由 tRPC 帧层统一完成。
  bytes body = 4;
}
