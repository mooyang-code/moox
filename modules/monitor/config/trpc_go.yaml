global:
  namespace: Development
  env_name: dev

server:
  filter:
    - requestmetrics
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 11950
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.monitor.MonitorMgr
      port: 11410
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.monitor.Health
      ip: 127.0.0.1
      port: 11409
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.monitor.metrics.timer
      port: 11415
      network: "*/30 * * * * *?params="
      protocol: timer
      timeout: 10000

client:
  filter:
    - requestmetrics

plugins:
  log:
    default:
      - writer: console
        level: info
