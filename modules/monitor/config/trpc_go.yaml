global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 11950
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.monitor.MonitorMgr
      ip: 127.0.0.1
      port: 11410
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.monitor.Health
      ip: 127.0.0.1
      port: 11409
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.monitor.metrics.timer
      port: 11415
      network: "*/30 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 10000
    - name: trpc.moox.monitor.placement.timer
      port: 11416
      network: "0 * * * * *"
      protocol: timer
      timeout: 30000
    - name: trpc.moox.monitor.data_cleanup.timer
      port: 11500
      network: "0 0 */6 * * *?startAtOnce=1"
      protocol: timer
      timeout: 120000
    - name: trpc.moox.monitor.check_schedule.timer
      port: 11501
      network: "*/30 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 30000
    - name: trpc.moox.monitor.host_silence.timer
      port: 11503
      network: "*/30 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 30000
plugins:
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12950
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转，单个文件 10MB、保留 5 份、最多 7 天；标准输出/错误主要是崩溃信息和数据库（GORM）日志，由 moox-runtime 启动前按大小轮转，持续报错时仍可能增长。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
