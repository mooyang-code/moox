# MooX Monitor service configuration.

database:
  type: sqlite
  path: ./data/monitor/monitor.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

health:
  addr: ":11409"

health_auth:
  version: "moox-health-v1"

instance:
  instance_id: ""

scheduler:
  result_retention_days: 14
  max_concurrency: 16

sysdeploy:
  enabled: true
  target: "ip://127.0.0.1:11109"
  service_auth:
    key_id: ""
    secret_key: ""
    target_node: ""
    ca_file: ""

alert:
  send_timeout_seconds: 10

metrics:
  enabled: true
  eventbus_url: nats://127.0.0.1:4222
  eventbus_credential_file: ~/.config/moox/eventbus/monitor-metrics-consumer.yaml
  host_eventbus_credential_file: ~/.config/moox/eventbus/monitor-eventbus.yaml
  pipeline_config_path: ../config/monitor-pipelines.yaml
  stream: MOOX_METRICS
  topic: moox.metrics.reported.v1.>
  consumer: monitor_metrics_ingest_v1
  fetch_batch_size: 64
  fetch_max_wait: 1s
  ack_wait: 60s
  max_ack_pending: 256
  no_data_intervals: 2
  storage:
    gateway_target: ip://127.0.0.1:11003
    gateway_node_id: ""
    key_id: monitor
    hmac_key_file: ""
    space_id: moox_system
    dataset_id: moox_service_metrics
    frequency: 30s
    metadata_validation_interval: 30s
    write_batch_size: 1000
  host_storage:
    enabled: true
    gateway_target: ip://127.0.0.1:11003
    gateway_node_id: ""
    key_id: monitor
    hmac_key_file: ""
    space_id: moox_system
    frequency: 1m
    write_timeout: 5s
    read_limit: 500
    metadata_refresh_interval: 1m
    rule_refresh_interval: 30s
    resource_dataset_id: host_resource_v1
    filesystem_dataset_id: host_fs_v1
    disk_dataset_id: host_disk_v1
    network_dataset_id: host_net_v1
