# MooX Monitor service configuration.

database:
  type: sqlite
  path: ./data/monitor/monitor.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

health:
  addr: ":11409"

health_auth:
  version: "moox-health-v1"

instance:
  instance_id: ""

scheduler:
  result_retention_days: 14
  max_concurrency: 16

sysdeploy:
  enabled: true
  target: "ip://127.0.0.1:11109"
  service_auth:
    key_id: ""
    secret_key: ""
    target_node: ""
    ca_file: ""

alert:
  send_timeout_seconds: 10

observability:
  enabled: true
  eventbus_urls:
    - nats://127.0.0.1:4222
  credential_file: ~/.config/moox/eventbus/monitor-observability.yaml
  balance_difference_threshold: 0.05

market_canary:
  enabled: true
  freshness: 3m
  return_threshold: 0.05
  settle_delay: 5s
  post_close_delay: 1m
  calendar_warning_lead: 336h
  closed_bar_count: 3
  closed_bar_min_coverage: 0.99
  subjects:
    - space_id: crypto
      dataset_id: binance_spot_kline_1m
      # Keep the canary bound to a subject that is present in the active spot
      # symbol catalog. BTC-USDT is a perpetual-only subject in this setup;
      # probing it made the service page report a false "insufficient_closed_bars".
      symbol: OPG-USDT
      frequency: 1m
      series_tag: venue:binance
    - space_id: stock_cn
      dataset_id: stock_cn_kline
      symbol: 600000.XSHG
      frequency: 1m
      series_tag: ""
      market_id: stock_cn
      calendar_path: ../collector/config/markets/stock_cn/calendar.yaml
      eligible_kline_providers: [sina, tencent, eastmoney]

market_health:
  timer_coordination_stale_after: 15m
  timer_coordination_pending_grace: 5m
  low_capacity_headroom: 2
  feed_failure_rate_window: 5m
  feed_failure_rate_threshold: 0.2
  instrument_snapshot_max_age: 36h
  instrument_minimum_count: 4000
  instrument_required_exchanges: [XSHG, XSHE, XBSE]

metrics:
  enabled: true
  dataset_health_policy_path: ../../examples/setup/default/dataset-health-policy.yaml
  no_data_intervals: 2
  storage:
    gateway_target: ip://127.0.0.1:11003
    gateway_node_id: ""
    key_id: monitor
    hmac_key_file: ""
    space_id: moox_system
    dataset_id: moox_service_metrics
    frequency: 30s
    metadata_validation_interval: 30s
    write_batch_size: 1000
  host_storage:
    enabled: true
    gateway_target: ip://127.0.0.1:11003
    gateway_node_id: ""
    key_id: monitor
    hmac_key_file: ""
    space_id: moox_system
    frequency: 1m
    write_timeout: 5s
    read_limit: 500
    metadata_refresh_interval: 1m
    rule_refresh_interval: 30s
    resource_dataset_id: host_resource_v1
    filesystem_dataset_id: host_fs_v1
    disk_dataset_id: host_disk_v1
    network_dataset_id: host_net_v1
