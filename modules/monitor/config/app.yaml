# MooX Monitor service configuration.

database:
  type: sqlite
  path: ./data/monitor/monitor.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

health:
  addr: ":11409"

instance:
  instance_id: ""
  base_url: "http://127.0.0.1:11409"

scheduler:
  reload_interval_seconds: 30
  result_retention_days: 14
  max_concurrency: 16

sysdeploy:
  enabled: true
  target: "ip://127.0.0.1:11109"
  sync_interval_seconds: 60
  service_auth:
    version: "moox-auth-v1"
    access_key: "moox-service"
    secret_key: "moox-service-secret-change-me"
    expire_seconds: 1800

peer:
  enabled: true
  pull_interval_seconds: 10
  timeout_seconds: 5
  token: "moox-monitor-peer-token-change-me"
  peers: []

alert:
  send_timeout_seconds: 10

metrics:
  enabled: true
  eventbus_url: nats://127.0.0.1:4222
  eventbus_credential_file: ""
  stream: MOOX_METRICS
  topic: moox.metrics.snapshot.reported.v1
  consumer: monitor_metrics_ingest_v1
  fetch_batch_size: 64
  fetch_max_wait: 1s
  ack_wait: 60s
  max_ack_pending: 256
  no_data_intervals: 2
  storage:
    access_target: ip://127.0.0.1:20102
    metadata_target: ip://127.0.0.1:20100
    space_id: moox_system
    dataset_id: moox_service_metrics
    frequency: 30s
    metadata_validation_interval: 30s
    write_batch_size: 1000
  host_storage:
    enabled: true
    access_target: ip://127.0.0.1:20102
    metadata_target: ip://127.0.0.1:20100
    space_id: moox_system
    frequency: 1m
    retention: 72h
    write_timeout: 5s
    read_limit: 500
    metadata_refresh_interval: 1m
    rule_refresh_interval: 30s
    resource_dataset_id: host_resource_v1
    filesystem_dataset_id: host_fs_v1
    disk_dataset_id: host_disk_v1
    network_dataset_id: host_net_v1
