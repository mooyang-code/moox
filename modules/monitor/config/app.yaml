gateway_client:
  caller: monitor
  # 本机的主机签名私钥，这台主机上的组件共用。
  key_file: ../../secrets/host.key
  # 以下三项由部署渲染：本机主机 ID、本机网关地址与 MooX CA 根证书（相对本文件所在目录）。
  host_id: ""
  local_address: 127.0.0.1:11002
  ca_file: ../../secrets/moox-ca.crt

# MooX Monitor service configuration.

database:
  type: sqlite
  path: ./data/monitor/monitor.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

instance:
  instance_id: ""

scheduler:
  alert_event_retention_days: 14

deployment:
  # 从 Admin 同步部署拓扑（每台主机应该有哪些组件）；组件健康只看各组件的上报。
  enabled: true

observability:
  enabled: true
  deliver_policy: all
  eventbus_urls:
    - nats://127.0.0.1:4222
  credential_file: ~/.config/moox/eventbus/monitor-observability.yaml

market_canary:
  enabled: true
  freshness: 3m
  return_threshold: 0.05
  settle_delay: 5s
  post_close_delay: 1m
  calendar_warning_lead: 336h
  closed_bar_count: 3
  closed_bar_min_coverage: 0.99
  subjects:
    - space_id: crypto
      # Result Dataset of the Binance spot 1m collection task (dataset_<task_id>).
      dataset_id: dataset_dasftksvjhj2jom4vhd0
      # Use a liquid, currently listed spot subject.
      symbol: BTC-USDT
      frequency: 1m
      series_tag: venue:binance|market:spot|source:spot_http

kline_freshness:
  evaluation_interval: 30s
  inventory_refresh_interval: 1m
  inventory_page_size: 100
  inventory_max_entries: 1000
  max_subjects_per_alert: 20

metrics:
  enabled: true
  no_data_intervals: 2
  # 每小时、每天最多新建的指标序列数，超出的新序列被丢弃并告警；负数表示不限。
  max_new_series_per_hour: 2000
  max_new_series_per_day: 10000
  dataset_health:
    defaults:
      run_missed_intervals: 2
      success_missed_intervals: 3
      # 应收的最新一根 K 线收线后允许迟到多久：分钟级（短于 1 小时的周期）与小时级（1h、4h）；日线及以上允许迟到 1 个周期
      minute_lateness: 10s
      hour_lateness: 20s
    overrides: []
