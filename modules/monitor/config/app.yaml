# MooX Monitor service configuration.

database:
  type: sqlite
  path: ./data/monitor/monitor.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

health:
  addr: ":11409"

instance:
  instance_id: ""
  base_url: "http://127.0.0.1:11409"

scheduler:
  reload_interval_seconds: 30
  result_retention_days: 14
  max_concurrency: 16

sysdeploy:
  enabled: true
  target: "ip://127.0.0.1:11109"
  sync_interval_seconds: 60
  service_auth:
    version: "moox-auth-v1"
    access_key: "moox-service"
    secret_key: "moox-service-secret-change-me"
    expire_seconds: 1800

peer:
  enabled: true
  pull_interval_seconds: 10
  timeout_seconds: 5
  token: "moox-monitor-peer-token-change-me"
  peers: []

alert:
  send_timeout_seconds: 10
