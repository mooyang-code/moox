gateway_client:
  caller: monitor
  key_id: ""
  key_file: ../../secrets/caller-monitor.key

# MooX Monitor service configuration.

database:
  type: sqlite
  path: ./data/monitor/monitor.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

health:
  addr: ":11409"

health_auth:
  version: "moox-health-v1"

instance:
  instance_id: ""

scheduler:
  result_retention_days: 14

deployment:
  # 从 Admin 同步部署拓扑（每台主机应该有哪些组件）；组件健康只看各组件的上报。
  enabled: true

alert:
  send_timeout_seconds: 10

observability:
  enabled: true
  deliver_policy: all
  eventbus_urls:
    - nats://127.0.0.1:4222
  credential_file: ~/.config/moox/eventbus/monitor-observability.yaml
  balance_difference_threshold: 0.05

market_canary:
  enabled: true
  freshness: 3m
  return_threshold: 0.05
  settle_delay: 5s
  post_close_delay: 1m
  calendar_warning_lead: 336h
  closed_bar_count: 3
  closed_bar_min_coverage: 0.99
  subjects:
    - space_id: crypto
      # Result Dataset of the Binance spot 1m collection task (dataset_<task_id>).
      dataset_id: dataset_dasftksvjhj2jom4vhd0
      # Use a liquid, currently listed spot subject.
      symbol: BTC-USDT
      frequency: 1m
      series_tag: venue:binance|market:spot|source:spot_http

market_health:
  timer_coordination_stale_after: 15m
  timer_coordination_pending_grace: 5m

kline_freshness:
  enabled: true
  evaluation_interval: 30s
  inventory_refresh_interval: 1m
  inventory_page_size: 100
  inventory_max_entries: 1000
  max_subjects_per_alert: 20

metrics:
  enabled: true
  dataset_health_policy_path: ../../config/setup/dataset-health-policy.yaml
  no_data_intervals: 2
  # 每小时、每天最多新建的指标序列数，超出的新序列被丢弃并告警；负数表示不限。
  max_new_series_per_hour: 2000
  max_new_series_per_day: 10000
