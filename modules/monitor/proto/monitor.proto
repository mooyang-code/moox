syntax = "proto3";

package trpc.moox.monitor;

import "moox_common.proto";
import "host_metric.proto";

option go_package = "github.com/mooyang-code/moox/modules/monitor/proto/monitorgen;monitorpb";

enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_OK = 1;
  ALERT_STATUS_FIRING = 2;
  ALERT_STATUS_RESOLVED = 3;
}

enum AlertEventType {
  ALERT_EVENT_TYPE_UNSPECIFIED = 0;
  ALERT_EVENT_TYPE_TRIGGERED = 1;
  ALERT_EVENT_TYPE_REMINDER = 2;
  ALERT_EVENT_TYPE_RESOLVED = 3;
}

message AlertEvent {
  string event_id = 1;
  string space_id = 2;
  string rule_id = 3;
  string check_id = 4;
  AlertEventType event_type = 5;
  AlertStatus status = 6;
  string message = 8;
  string payload_json = 9;
  string created_at = 10;
}

// Health overview v2: identities are explicit; status has six canonical values.
message HealthObject {
  string type = 1;
  string host_id = 2;
  string component_id = 3;
  string dataset_id = 4;
  string freq = 5;
  string agent_id = 6;
  string kind = 7;
  string space_id = 8;
  string producer = 9;
}
// severity：critical 表示服务不可用或数据中断，warning 表示资源吃紧、指标上报中断等需要关注的风险。
message HealthAlert {
  string id = 1;
  string severity = 2;
  HealthObject object = 3;
  string title = 4;
  string reason = 5;
  string raw_error = 6;
  string triggered_at = 7;
  string last_checked_at = 8;
  // 最近一次检查已经通过，正在等待连续成功确认恢复。
  bool recovering = 9;
  // 数据集告警对应的数据集事实（水位、最近成功、允许落后）。
  HealthDataset dataset = 10;
}
message HealthSignal {
  string status = 1;
  string reason = 2;
  string raw_error = 3;
  string checked_at = 4;
}
message HealthReporter {
  string instance_id = 1;
  string boot_id = 2;
  string version = 3;
  string status = 4;
  string last_reported_at = 5;
}
message HealthComponent {
  string host_id = 1;
  string component_id = 2;
  string name = 3;
  string status = 4;
  string reason = 5;
  HealthSignal probe = 6;
  HealthSignal reporter = 7;
  repeated HealthReporter instances = 8;
  string status_since = 9;
  string probe_url = 10;
  repeated HealthSignal recent_probes = 11;
  // 模块自己的生命周期状态（设计 6.1）；模块没有生命周期接口时为空。
  HealthLifecycle lifecycle = 12;
}
// HealthLifecycle 是模块上报的生命周期状态：模块自身与它管理的对象（因子任务、策略实例）。
message HealthLifecycle {
  // 汇总阶段：uninitialized | not_ready | ready | warming | running | paused | resuming | resetting | reset_failed | fault。
  string stage = 1;
  // 阶段对应的颜色：gray | red | blue | yellow | green | orange | cyan | purple。
  string color = 2;
  // 有对象自动暂停、故障或未就绪，而另一些对象在跑（手动、系统暂停是用户意图，不算降级）。
  bool degraded = 3;
  string reason = 4;
  // 模块自身的阶段。
  string self_stage = 5;
  // 各阶段的对象数。
  map<string, int32> counts = 6;
  // 需要关注的对象（暂停、故障、未就绪）。
  repeated HealthLifecycleObject attention = 7;
  // 重启后自动回到原阶段的对象数。
  int32 recovered = 8;
  // 模块自身的暂停详情（模块暂停或恢复追赶中）。
  HealthPause pause = 9;
  // 控制意图：system_pause | post_reset | 空。
  string hold = 10;
  // 暂停的对象（含模块自身）按类型计数：manual | system | auto。
  map<string, int32> pause_kinds = 11;
  // 模块自身的恢复追赶进度（模块恢复追赶中）。
  HealthCatchup catchup = 12;
}
// HealthPause 是暂停详情：类型、原因、操作者、开始时间。
message HealthPause {
  // manual | system | auto。
  string kind = 1;
  string reason = 2;
  string by = 3;
  string since = 4;
}
// HealthCatchup 是恢复追赶进度：暂停期间缺失的数据补采、增量进入，追平后才放行。
message HealthCatchup {
  string since = 1;
  int64 done = 2;
  int64 total = 3;
  bool caught_up = 4;
  // 被谁阻塞（例如上游模块尚未追平）。
  string blocked_by = 5;
  // 暂停区间里确认无法补采的周期数。
  int32 unfillable = 6;
  string message = 7;
}
message HealthLifecycleObject {
  string kind = 1;
  string id = 2;
  string stage = 3;
  string color = 4;
  string reason = 5;
  // 失败的检查项（名称：原因；处理办法）。
  repeated string failed_checks = 6;
  // 暂停详情（暂停与恢复追赶阶段）；恢复追赶进度。
  HealthPause pause = 7;
  HealthCatchup catchup = 8;
  // 考虑模块自身状态后的有效阶段。
  string effective = 9;
}
// HealthSystem 是系统状态：健康面（由各模块状态推导）与运行阶段（只由用户命令推进）两个维度。
message HealthSystem {
  // 健康面：healthy（没有模块未就绪或故障）| attention。
  string health = 1;
  // 运行阶段：uninitialized | ready | warming | running | paused | partially_paused | resuming | resetting；全部在跑时是 running。
  string phase = 2;
  // 首页圆点的颜色：红（健康面异常）> 紫（重置中）> 青（恢复追赶）> 橙（降级或暂停）> 黄（预热）> 蓝（就绪）> 绿（运行）> 灰。
  string color = 3;
  // 运行中但有部分对象自动暂停、故障：首页显示「运行中 · 降级」；手动、系统暂停不算降级。
  bool degraded = 4;
  // 受影响的模块与原因，形如「因子引擎：crypto/spot_1m 变更日志断档」。
  repeated string issues = 5;
  // 有模块重启后自动回到原阶段。
  bool auto_recovered = 6;
  int32 module_count = 7;
  // 暂停的模块与对象按类型计数：manual | system | auto。
  map<string, int32> pause_kinds = 8;
  // 最早的暂停时间（RFC3339）。
  string paused_since = 9;
  // 恢复追赶中的模块数与其中已追平（待放行）的模块数。
  int32 resuming_modules = 10;
  int32 caught_up_modules = 11;
  // 恢复追赶的进度文字，形如「strategy 被 factor-engine 阻塞」「collector 补采 6/10」。
  repeated string catchup_notes = 12;
}
message HealthDataset {
  string producer = 1;
  string space_id = 2;
  string dataset_id = 3;
  string freq = 4;
  string status = 5;
  string reason = 6;
  string raw_error = 7;
  string input_watermark_at = 8;
  string output_watermark_at = 9;
  string last_success_at = 10;
  string last_run_at = 11;
  string last_reported_at = 12;
  // 生产者随期望清单上报的展示名称（例如策略实例名）；为空时由页面按 Storage 名称或数据集 ID 展示。
  string display_name = 13;
  // 最新一根 K 线：output_watermark_at 是它的 data_time（开盘时间），latest_bar_close_at 是按市场交易日历算出的收线时间，
  // arrived_at 是生产者写完它的时刻。延迟 = 到达 − 收线，到达那一刻定值；生产者没上报到达时间时 delay_known 为 false。
  string latest_bar_close_at = 14;
  string arrived_at = 15;
  int64 delay_seconds = 16;
  bool delay_known = 17;
  // 此刻应已收线却还没到的根数；waiting_since 是其中最早一根的收线时间（应到时间），overdue_seconds 是它已晚多久
  // （当前时间 − 应到时间，持续增长）。
  int32 waiting_bars = 18;
  string waiting_since = 19;
  int64 overdue_seconds = 20;
  // 允许迟到的秒数：生产者的上报确认应到的那根超过它仍未到时判为过期并告警（生产者每 30 秒上报一次，最多晚一次上报才判定）；
  // 已到的根延迟超过它只标为迟到，不影响当前状态。
  int64 lateness_limit_seconds = 21;
  // 无法按交易日历判断的原因，例如“日历未覆盖”“周期对齐未确认”；为空表示已按日历判断。
  string clock_issue = 22;
  // 预期 K 线：按市场交易日历此刻应已收线的最新一根。expected_bar_at 是它的 data_time（开盘时间，与 output_watermark_at 同一口径，
  // 两者相同即已到），expected_bar_close_at 是收线时间；无法按交易日历判断时为空。
  string expected_bar_at = 23;
  string expected_bar_close_at = 24;
  // 应到的那根已由生产者的上报确认迟到：上报那一刻它已晚超过允许迟到仍没有，数据集据此判为过期并告警。
  bool late_confirmed = 25;
  // 市场时区（IANA 名称）：加密货币 UTC，A 股 Asia/Shanghai；没有交易日历的系统数据为 UTC。页面按它显示 K 线时间并标注时区。
  string timezone = 26;
}
message HealthPipelineStage {
  string id = 1;
  string name = 2;
  string status = 3;
  repeated HealthDataset datasets = 4;
}
message HealthBusinessCheck {
  string check_id = 1;
  string kind = 2;
  string module = 3;
  string space_id = 4;
  string status = 5;
  string reason = 6;
  string raw_error = 7;
  string checked_at = 8;
  // 检查名称，与推送标题一致。
  string name = 9;
}
message HealthGatewaySignal {
  string kind = 1;
  HealthSignal signal = 2;
  // Persisted first observation of the current desired/applied mismatch.
  string pending_since = 3;
  string expected_hash = 4;
  string applied_hash = 5;
}
message HealthHost {
  string host_id = 1;
  string agent_id = 2;
  string hostname = 3;
  string address = 4;
  string status = 5;
  string reason = 6;
  double cpu_percent = 7;
  double memory_percent = 8;
  double disk_percent = 9;
  bool metrics_available = 10;
  bool cpu_available = 11;
  string last_reported_at = 12;
  repeated HealthGatewaySignal gateway_signals = 13;
  bool memory_available = 14;
  bool disk_available = 15;
  // 告警阈值（百分比）；0 表示没有对应的告警规则。
  double cpu_threshold = 16;
  double memory_threshold = 17;
  double disk_threshold = 18;
  // 资源总量：CPU 逻辑核数、内存总量与已用量；磁盘取使用率最高的那个文件系统（与 disk_percent 同一个）。
  uint32 cpu_cores = 19;
  uint64 memory_total_bytes = 20;
  uint64 memory_used_bytes = 21;
  uint64 disk_total_bytes = 22;
  uint64 disk_used_bytes = 23;
  string disk_mountpoint = 24;
}
message HealthCounts {
  int32 healthy_count = 1;
  int32 attention_count = 2;
  int32 unknown_count = 3;
  int32 disabled_count = 4;
  int32 unchecked_count = 5;
}
message HealthSummary {
  int32 alert_count = 1;
  int32 healthy_count = 2;
  int32 attention_count = 3;
  int32 unknown_count = 4;
  int32 unregistered_count = 5;
  HealthCounts components = 6;
}
message HealthOverview {
  string generated_at = 1;
  bool topology_known = 2;
  HealthSummary summary = 3;
  repeated HealthAlert alerts = 4;
  repeated HealthComponent components = 5;
  repeated HealthPipelineStage pipeline = 6;
  repeated HealthBusinessCheck business_checks = 7;
  repeated HealthHost hosts = 8;
  repeated HealthComponent unregistered = 9;
  // 概览对所有登录用户可见，只带渠道数量和平台；完整 Webhook URL 只由仅管理员可调的 ListNotificationChannels 返回。
  NotificationSummary notification = 10;
  // 最近 incident_window_hours 小时内的告警经过（触发到恢复为一条），按触发时间倒序。
  repeated AlertIncident incidents = 11;
  int32 incident_window_hours = 12;
  // 系统状态：由各模块上报的生命周期状态汇总；没有任何模块上报时为空。
  HealthSystem system = 13;
}
message AlertIncident {
  string id = 1;
  string severity = 2;
  HealthObject object = 3;
  string title = 4;
  string reason = 5;
  // 触发时间早于窗口且找不到触发记录时为空。
  string triggered_at = 6;
  // 为空表示尚未收到恢复记录。
  string resolved_at = 7;
  // 告警是否仍在进行；检查被停用或删除时告警直接撤销，没有恢复记录，active 为 false。
  bool active = 8;
  int32 reminder_count = 9;
  bool notify_failed = 10;
}
message GetHealthOverviewReq { string space_id = 1; }
message GetHealthOverviewRsp { common.RetInfo ret_info = 1; HealthOverview overview = 2; }

// NotificationSummary 是告警推送的概况：配置了几个渠道、各是什么平台（按添加顺序，可重复）。
message NotificationSummary {
  int32 channel_count = 1;
  repeated string channel_types = 2;
}
// NotificationChannel 是一个告警推送渠道（企业微信或飞书群机器人）。告警发给全部渠道。
// Webhook URL 本身就是推送凭据，控制台只允许全局管理员列出渠道。
message NotificationChannel {
  string channel_id = 1;
  string channel_type = 2;
  string webhook_url = 3;
  string created_at = 4;
}
message ListNotificationChannelsReq {}
message ListNotificationChannelsRsp { common.RetInfo ret_info = 1; repeated NotificationChannel channels = 2; }
message AddNotificationChannelReq { string channel_type = 1; string webhook_url = 2; }
message AddNotificationChannelRsp { common.RetInfo ret_info = 1; NotificationChannel channel = 2; }
message DeleteNotificationChannelReq { string channel_id = 1; }
message DeleteNotificationChannelRsp { common.RetInfo ret_info = 1; }

// GetHostPolicyReq 由每台主机的 HostAgent 定期调用，拉取主机策略并缓存到 <部署根>/run/host-policy.json，
// 供主机守护（moox-runtime watch）与证书巡检直接推送告警。只允许调用方 host-agent。
message GetHostPolicyReq {}
// HostPolicyChannel 是一个告警渠道；Webhook URL 本身就是推送凭据。
message HostPolicyChannel {
  string channel_type = 1;
  string webhook_url = 2;
}
// HostWatchdogPolicy 是主机守护参数，空值表示各主机使用守护自己的默认值；时长用 Go 的写法，例如 "10m"。
message HostWatchdogPolicy {
  bool disabled = 1;
  string merge_window = 2;
  int32 crash_loop_failures = 3;
  string crash_loop_window = 4;
  string crash_loop_retry = 5;
  string crash_loop_slow = 6;
  string stable_after = 7;
  string not_ready_alert = 8;
}
message GetHostPolicyRsp {
  common.RetInfo ret_info = 1;
  repeated HostPolicyChannel channels = 2;
  HostWatchdogPolicy watchdog = 3;
}

message HostAgentInfo {
  string agent_id = 1;
  string hostname = 2;
  string boot_id = 3;
  string last_seen_at = 4;
  bool archived = 5;
  trpc.moox.hostagent.HostSnapshot snapshot = 6;
  bool reachable = 7;
  int64 stale_seconds = 8;
  string host_id = 9;
}
message ListHostAgentsReq {}
message ListHostAgentsRsp { common.RetInfo ret_info = 1; repeated HostAgentInfo agents = 2; bool storage_available = 3; bool data_gap = 4; }
message HostMetricHistoryPoint {
  string agent_id = 1;
  string observed_at = 2;
  trpc.moox.hostagent.HostSnapshot snapshot = 3;
}
message QueryHostMetricHistoryReq { string agent_id = 1; string start_at = 2; string end_at = 3; uint32 limit = 4; }
message QueryHostMetricHistoryRsp { common.RetInfo ret_info = 1; repeated HostMetricHistoryPoint points = 2; bool storage_available = 3; bool data_gap = 4; }

// 数据链路逐根到达历史：一条链路（源数据集 + 周期）某一天每个环节每一根 K 线的到达延迟。
message QueryPipelineArrivalHistoryReq {
  string space_id = 1;
  // 链路的源数据集（入库的数据集）与周期。
  string dataset_id = 2;
  string freq = 3;
  // YYYY-MM-DD，按市场时区（加密货币 UTC，A 股 Asia/Shanghai）的自然日；为空取市场时区的今天。
  string day = 4;
  // 因子任务 ID：给了就查它的结果数据集；没给且源数据集上只有一个任务，就查这个任务；有多个任务时只返回任务列表和源数据集这一段。
  string task_id = 5;
}
// ArrivalTask 是源数据集上的一个因子任务（任务 ID 由结果数据集 ID 反解，名称就是结果数据集的名称）。
message ArrivalTask {
  string task_id = 1;
  string name = 2;
  string result_dataset_id = 3;
}
message ArrivalHistoryPoint {
  // 收线时间（UTC，RFC3339）。
  string close_at = 1;
  // 到达 − 收线（秒），在到达那一刻定值。
  int64 delay_seconds = 2;
  // 和上一份快照里的水位之间跳过的根数：补数据时一批写完，中间几根不单独记录；0 表示连续。
  int32 skipped_bars = 3;
}
message ArrivalHistorySeries {
  // 环节：storage（入库）、view（视图）、factor（因子）、factor_view（因子视图）、strategy（策略计算，按同空间同周期列出）。
  string stage = 1;
  string producer = 2;
  // 数据集 ID；View 为 view_id，primary_dataset_id 是它服务的数据集。
  string dataset_id = 3;
  string primary_dataset_id = 4;
  int64 lateness_limit_seconds = 5;
  repeated ArrivalHistoryPoint points = 6;
}
message QueryPipelineArrivalHistoryRsp {
  common.RetInfo ret_info = 1;
  // 市场时区（IANA 名称），day 按它切分。
  string timezone = 2;
  string day = 3;
  // 这一天的起止（UTC，RFC3339，左闭右开），时间点按收线时间落在其中。
  string start_at = 4;
  string end_at = 5;
  repeated ArrivalHistorySeries series = 6;
  // 记录只保留 7 天：这一天的开头早于保留期时为 true，曲线可能不完整。
  bool retention_truncated = 7;
  // 记录超过一次查询的上限，曲线只含这一天前面的部分。
  bool truncated = 8;
  // 这个源数据集 + 周期上的全部因子任务，由页面选择任务后再查。
  repeated ArrivalTask tasks = 9;
}

message DoctorExpectedComponent {
  string component_id = 1;
  string service_name = 2;
  string node_id = 3;
  bool expected = 4;
  string deployment_status = 5;
  string transport = 6;
  string functional_observability = 7;
  string health_url = 8;
}
message DoctorObservation {
  string kind = 1;
  string component_id = 2;
  string service_name = 3;
  string instance_id = 4;
  string node_id = 5;
  string boot_id = 6;
  string status = 7;
  string observed_at = 8;
  string summary = 9;
  string details_json = 10;
  bool stale = 11;
  bool conflict = 12;
  double value = 13;
  int64 age_seconds = 14;
  int32 interval_seconds = 15;
}
message DoctorWatermark {
  string module = 1;
  string stage = 2;
  string health_check_id = 3;
  string observed_at = 4;
  double value = 5;
  string status = 6;
}
message DoctorDiskForecast {
  string node_id = 1;
  string agent_id = 2;
  string mountpoint = 3;
  string status = 4;
  double growth_bytes_per_day = 5;
  double remaining_days = 6;
  uint32 valid_intervals = 7;
  string summary = 8;
}
message GetDoctorContextReq {
  string node_id = 1;
  repeated string component_ids = 2;
  repeated string health_check_ids = 3;
}
message GetDoctorContextRsp {
  common.RetInfo ret_info = 1;
  string generated_at = 2;
  string manifest_checksum = 3;
  repeated DoctorExpectedComponent expected_components = 4;
  repeated DoctorObservation health_observations = 5;
  repeated DoctorObservation reporter_observations = 6;
  repeated DoctorObservation module_observations = 7;
  repeated DoctorWatermark watermarks = 8;
  repeated HostAgentInfo host_resources = 9;
  repeated DoctorDiskForecast disk_forecasts = 10;
  repeated AlertEvent active_alerts = 11;
  repeated DoctorObservation missing_observations = 12;
}

// AlertMuteState 是告警屏蔽的当前状态。屏蔽只停推送：探测、入库、告警评估与记录照常，到期自动恢复。
message AlertMuteState {
  bool muted = 1;
  // since 与 expires_at 为 RFC3339 UTC；未屏蔽时为空。
  string since = 2;
  string expires_at = 3;
  string reason = 4;
  string by = 5;
}
// MuteAlertsReq 屏蔽告警推送一段时间，用于初始数据导入等会让数据链路告警暂时失真的操作。
message MuteAlertsReq {
  // duration_seconds 取 1～86400（最长 24 小时，防止忘记恢复）。
  uint32 duration_seconds = 1;
  string reason = 2;
}
message MuteAlertsRsp {
  common.RetInfo ret_info = 1;
  AlertMuteState state = 2;
}
// UnmuteAlertsReq 提前结束屏蔽；结束时补发一条汇总（仍未恢复的告警，以及屏蔽期间触发后又恢复的）。
message UnmuteAlertsReq {}
message UnmuteAlertsRsp {
  common.RetInfo ret_info = 1;
  AlertMuteState state = 2;
}
message GetAlertMuteReq {}
message GetAlertMuteRsp {
  common.RetInfo ret_info = 1;
  AlertMuteState state = 2;
}

service MonitorMgr {
  rpc GetHealthOverview(GetHealthOverviewReq) returns (GetHealthOverviewRsp);
  rpc ListNotificationChannels(ListNotificationChannelsReq) returns (ListNotificationChannelsRsp);
