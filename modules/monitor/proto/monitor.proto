syntax = "proto3";

package trpc.moox.monitor;

import "moox_common.proto";
import "host_metric.proto";

option go_package = "github.com/mooyang-code/moox/modules/monitor/proto/monitorgen;monitorpb";

enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_OK = 1;
  ALERT_STATUS_FIRING = 2;
  ALERT_STATUS_RESOLVED = 3;
}

enum AlertEventType {
  ALERT_EVENT_TYPE_UNSPECIFIED = 0;
  ALERT_EVENT_TYPE_TRIGGERED = 1;
  ALERT_EVENT_TYPE_REMINDER = 2;
  ALERT_EVENT_TYPE_RESOLVED = 3;
}

message AlertEvent {
  string event_id = 1;
  string space_id = 2;
  string rule_id = 3;
  string check_id = 4;
  AlertEventType event_type = 5;
  AlertStatus status = 6;
  string message = 8;
  string payload_json = 9;
  string created_at = 10;
}

// 健康概览 v2：后端给出结构化数据和中文摘要，保留原始错误；状态统一为 healthy、degraded、down、unknown、
// disabled、unchecked（不探测）六种。

// HealthSummary 是概览计数：告警数，以及组件、主机、业务检查、数据集中需关注（降级或故障）、正常、未知的数量。
message HealthSummary {
  int32 alerts = 1;
  int32 attention = 2;
  int32 healthy = 3;
  int32 unknown = 4;
}

// HealthTarget 是告警对象：kind 为 component、dataset、host 或 business。
message HealthTarget {
  string kind = 1;
  string host_id = 2;
  string component_id = 3;
  string space_id = 4;
  string dataset_id = 5;
  string frequency = 6;
}

message HealthAlert {
  string id = 1;
  // critical 或 warning。
  string severity = 2;
  HealthTarget target = 3;
  string title = 4;
  // reason 是中文原因，raw_error 是原始错误。
  string reason = 5;
  string raw_error = 6;
  string triggered_at = 7;
  string last_checked_at = 8;
  // 告警所属的数据链路阶段，不属于数据链路时为空。
  string stage = 9;
}

// HealthProbe 是一次健康探测的结果。
message HealthProbe {
  string status = 1;
  string url = 2;
  string checked_at = 3;
  string raw_error = 4;
}

// HealthReporter 是组件的运行指标上报：status 为 healthy、stale、never_reported；只做健康探测的组件为空。
message HealthReporter {
  string status = 1;
  string instance_id = 2;
  string version = 3;
  string last_seen_at = 4;
}

// HealthComponent 是部署在一台主机上的一个组件。
message HealthComponent {
  string host_id = 1;
  string component_id = 2;
  string name = 3;
  string status = 4;
  string reason = 5;
  // probe 是最近一次探测，history 是最近几次探测（新的在前）。
  HealthProbe probe = 6;
  repeated HealthProbe history = 7;
  HealthReporter reporter = 8;
  // 当前状态的开始时间。
  string status_since = 9;
}

message HealthPipelineDataset {
  string space_id = 1;
  string dataset_id = 2;
  string frequency = 3;
  string producer = 4;
  string status = 5;
  string watermark_at = 6;
  int64 lag_seconds = 7;
  string last_success_at = 8;
  string reason = 9;
  string raw_error = 10;
}

// HealthPipelineStage 是数据链路的一个阶段：stage 为 collect、storage、factor、trade。
message HealthPipelineStage {
  string stage = 1;
  string name = 2;
  string status = 3;
  repeated HealthPipelineDataset datasets = 4;
}

// HealthBusinessCheck 是一项业务检查：kind 为 market_fetch（行情采集协调）、canary（行情探针）、data_delivery（数据投递）
// 或 balance（账户余额同步）；name 是中文名称。
message HealthBusinessCheck {
  string kind = 1;
  string module = 2;
  string space_id = 3;
  string status = 4;
  string reason = 5;
  string raw_error = 6;
  string checked_at = 7;
  string name = 8;
  // 所属的数据链路阶段，不属于数据链路时为空。
  string stage = 9;
}

// HealthHost 是一台主机的摘要：主机网关状态与主机采集器上报的资源占用；agent_id 是主机采集器 ID，用于跳转到主机监控。
message HealthHost {
  string host_id = 1;
  string status = 2;
  string reason = 3;
  string gateway_state = 4;
  double cpu_percent = 5;
  double memory_percent = 6;
  double disk_percent = 7;
  string last_seen_at = 8;
  string agent_id = 9;
}

// HealthUnregistered 是在上报运行指标、但没有登记部署的进程。
message HealthUnregistered {
  string host_id = 1;
  string component_id = 2;
  string instance_id = 3;
  string version = 4;
  string last_seen_at = 5;
}

message HealthNotification {
  string channel_type = 1;
  bool configured = 2;
  string webhook_masked = 3;
}

message HealthOverview {
  string generated_at = 1;
  HealthSummary summary = 2;
  repeated HealthAlert alerts = 3;
  repeated HealthComponent components = 4;
  repeated HealthPipelineStage pipeline = 5;
  repeated HealthBusinessCheck business_checks = 6;
  repeated HealthHost hosts = 7;
  repeated HealthUnregistered unregistered = 8;
  HealthNotification notification = 9;
  // 数据来源暂时不可用等需要提示的情况。
  repeated string warnings = 10;
}
message GetHealthOverviewReq { string space_id = 1; }
message GetHealthOverviewRsp { common.RetInfo ret_info = 1; HealthOverview overview = 2; }

message NotificationChannelSetting {
  string channel_type = 1;
  bool configured = 2;
  string masked_url = 3;
  string updated_at = 4;
}
message GetNotificationChannelReq {}
message GetNotificationChannelRsp { common.RetInfo ret_info = 1; NotificationChannelSetting channel = 2; }
message UpdateNotificationChannelReq { string channel_type = 1; string webhook_url = 2; }
message UpdateNotificationChannelRsp { common.RetInfo ret_info = 1; NotificationChannelSetting channel = 2; }

message HostAgentInfo {
  string agent_id = 1;
  string hostname = 2;
  string boot_id = 3;
  string last_seen_at = 4;
  bool archived = 5;
  trpc.moox.hostagent.HostSnapshot snapshot = 6;
  bool reachable = 7;
  int64 stale_seconds = 8;
  // 主机 ID（MOOX_NODE_ID）；Monitor 重启后收到下一次快照之前为空。
  string host_id = 9;
}
message ListHostAgentsReq {}
message ListHostAgentsRsp { common.RetInfo ret_info = 1; repeated HostAgentInfo agents = 2; bool storage_available = 3; bool data_gap = 4; }
message HostMetricHistoryPoint {
  string agent_id = 1;
  string observed_at = 2;
  trpc.moox.hostagent.HostSnapshot snapshot = 3;
}
message QueryHostMetricHistoryReq { string agent_id = 1; string start_at = 2; string end_at = 3; uint32 limit = 4; }
message QueryHostMetricHistoryRsp { common.RetInfo ret_info = 1; repeated HostMetricHistoryPoint points = 2; bool storage_available = 3; bool data_gap = 4; }

message DoctorExpectedComponent {
  string component_id = 1;
  string service_name = 2;
  string node_id = 3;
  bool expected = 4;
  string deployment_status = 5;
  string transport = 6;
  string functional_observability = 7;
  string health_url = 8;
}
message DoctorObservation {
  string kind = 1;
  string component_id = 2;
  string service_name = 3;
  string instance_id = 4;
  string node_id = 5;
  string boot_id = 6;
  string status = 7;
  string observed_at = 8;
  string summary = 9;
  string details_json = 10;
  bool stale = 11;
  bool conflict = 12;
  double value = 13;
  int64 age_seconds = 14;
  int32 interval_seconds = 15;
}
message DoctorWatermark {
  string module = 1;
  string stage = 2;
  string health_check_id = 3;
  string observed_at = 4;
  double value = 5;
  string status = 6;
}
message DoctorDiskForecast {
  string node_id = 1;
  string agent_id = 2;
  string mountpoint = 3;
  string status = 4;
  double growth_bytes_per_day = 5;
  double remaining_days = 6;
  uint32 valid_intervals = 7;
  string summary = 8;
}
message GetDoctorContextReq {
  string node_id = 1;
  repeated string component_ids = 2;
  repeated string health_check_ids = 3;
}
message GetDoctorContextRsp {
  common.RetInfo ret_info = 1;
  string generated_at = 2;
  string manifest_checksum = 3;
  repeated DoctorExpectedComponent expected_components = 4;
  repeated DoctorObservation health_observations = 5;
  repeated DoctorObservation reporter_observations = 6;
  repeated DoctorObservation module_observations = 7;
  repeated DoctorWatermark watermarks = 8;
  repeated HostAgentInfo host_resources = 9;
  repeated DoctorDiskForecast disk_forecasts = 10;
  repeated AlertEvent active_alerts = 11;
  repeated DoctorObservation missing_observations = 12;
}

service MonitorMgr {
  rpc GetHealthOverview(GetHealthOverviewReq) returns (GetHealthOverviewRsp);
  rpc GetNotificationChannel(GetNotificationChannelReq) returns (GetNotificationChannelRsp);
  rpc UpdateNotificationChannel(UpdateNotificationChannelReq) returns (UpdateNotificationChannelRsp);
  rpc ListHostAgents(ListHostAgentsReq) returns (ListHostAgentsRsp);
  rpc QueryHostMetricHistory(QueryHostMetricHistoryReq) returns (QueryHostMetricHistoryRsp);
  rpc GetDoctorContext(GetDoctorContextReq) returns (GetDoctorContextRsp);
}
