# 网关服务配置 - 合并了认证服务配置
# 配置文件包含：网关服务、认证服务、限流配置

# 缓存配置（认证服务使用BadgerDB）
cache:
  data_dir: "./data/badger"   # BadgerDB数据存储目录

# JWT配置（认证服务使用）
jwt:
  # JWT 密钥。生产环境请直接修改为强随机值（>=32 字节）。
  # 以下为开发占位符，请勿用于生产；更换密钥后已签发的 token 将失效，需重新登录。
  secret_key: "dev-only-change-me"
  access_expired: "24h"       # 访问令牌过期时间

# 安全配置（认证服务使用）
security:
  salt_expired: "5m"          # 登录盐值过期时间
  max_login_attempt: 5        # 最大登录尝试次数
  lock_duration: "15m"        # 账户锁定时间

# 网关服务配置
gateway:
  # 是否开启调试模式
  debug: true

  # 后台服务对外接口签名鉴权配置
  # 请求路径: /api/service/{service}/{method}
  # 生产环境请直接修改 access_key / secret_key 为强随机值，并同步更新 SCF/cli 端。
  service_auth:
    enabled: true
    version: "moox-auth-v1"
    access_key: "moox-service"
    # 签名密钥。以下为开发占位符，请勿用于生产。
    secret_key: "moox-service-secret-change-me"
    max_expire_seconds: 1800
    clock_skew_seconds: 300

  # 不需要鉴权的接口列表
  no_auth_methods:
    - "/api/admin/health"
    - "/api/admin/auth/Register"
    - "/api/admin/auth/GetLoginSalt"
    - "/api/admin/auth/Login"
    # SSH 直连端点由 rawhandler 内部校验 session_id，网关 authorize 放行
    - "/api/admin/ssh/WsConnect"
    - "/api/admin/ssh/SftpDownload"
    - "/api/admin/ssh/SftpUpload"
  # 网关不在本地 YAML 中维护服务地址。
  # /api/admin/* 与 /api/service/* 的转发目标统一来自 t_service_deployments。
  # 缺失 active 部署记录时请求会直接失败，避免 gateway.yaml 与系统服务部署表出现双来源。

# CORS 跨域配置（生产环境请配置具体前端域名，避免使用 *）
cors:
  allowed_origins:
    - "*"

# 限流配置
rate_limit:
  # 默认限流配置
  default_qps: 2000      # 默认QPS限制
  default_burst: 5000    # 默认突发流量

  # 按接口配置限流
  method_limits:
    "/api/admin/auth/Login":
      qps: 1
      burst: 2
    "/api/admin/auth/Register":
      qps: 1
      burst: 1
    "/api/admin/auth/GetLoginSalt":
      qps: 2
      burst: 5
    "/api/admin/auth/GetUserInfo":
      qps: 2
      burst: 5

# 配置说明:
# 时间格式支持: ns, us, ms, s, m, h
# 例如: "30s" (30秒), "5m" (5分钟), "2h" (2小时), "24h" (24小时)
#
# 数据库说明:
# admin 当前只使用 SQLite，数据库路径由 app.yaml 的 database.path 配置。
# gateway.yaml 只保留网关、认证缓存、JWT、后台服务签名、CORS 与限流配置。
#
# 缓存目录:
# 确保应用有权限在指定目录创建和写入文件
# 数据库文件和缓存目录会自动创建
#
# 安全建议:
# 1. JWT密钥请使用强随机字符串，至少32字符
# 2. 生产环境建议缩短访问令牌过期时间
# 3. 根据业务需求调整登录尝试次数和锁定时间
#
# 快速开始:
# 1. 修改JWT密钥
# 2. 确保 ./data 目录有写入权限
# 3. 启动服务即可使用
