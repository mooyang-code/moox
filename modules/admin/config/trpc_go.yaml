global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - prometheus
  # 各 RPC 服务的默认时限上限，与网关路由允许的最长超时（960 秒）一致。
  # 浏览器入口（9527）不在这里：它由 Admin 自己用标准库监听，接口时限由控制台处理器按服务目录控制。
  timeout: 960000
  admin:
    ip: 127.0.0.1
    port: 11900
    read_timeout: 3000
    write_timeout: 960000
  service:
    - name: trpc.moox.admin.Health
      ip: 127.0.0.1
      port: 11010
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.ops.SecretMgr
      ip: 127.0.0.1
      port: 11108
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.ops.SysDeploy
      ip: 127.0.0.1
      port: 11109
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.admin.Setup
      ip: 127.0.0.1
      port: 11110
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.admin.ActivityLog
      ip: 127.0.0.1
      port: 11113
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.admin.GatewayControl
      ip: 127.0.0.1
      port: 11112
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 5000
    - name: trpc.moox.admin.metrics.timer
      port: 11305
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000
    - name: trpc.moox.admin.certificates.timer
      port: 11307
      network: "0 0 0 * * *"
      protocol: timer
      timeout: 30000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12900
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转：单个文件 50MB、保留 5 份、最多 7 天。标准输出与标准错误（崩溃信息、数据库日志）交给 journald。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 50
          max_backups: 5
          compress: false
