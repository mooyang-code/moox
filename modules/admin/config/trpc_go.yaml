global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - masking
    - opentelemetry
    - prometheus
  # Admin BFF 的总时限与网关路由允许的最长超时（960 秒）一致；
  # 归档分区副本下载不另设整体超时，受 Console 服务的时限约束。
  timeout: 960000
  admin:
    ip: 127.0.0.1
    port: 11900
    read_timeout: 3000
    write_timeout: 960000
  service:
    - name: trpc.moox.admin.Console
      ip: 127.0.0.1
      port: 11000
      network: tcp
      protocol: http_no_protocol
      # 归档分区副本下载经 Console 流式转发，请求时限不低于路由超时。
      timeout: 960000
    - name: trpc.moox.admin.Health
      ip: 127.0.0.1
      port: 11010
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.infra.Auth
      ip: 127.0.0.1
      port: 11100
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.ops.Ssh
      ip: 127.0.0.1
      port: 11106
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.admin.SpaceMgr
      ip: 127.0.0.1
      port: 11107
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.ops.SecretMgr
      ip: 127.0.0.1
      port: 11108
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.ops.SysDeploy
      ip: 127.0.0.1
      port: 11109
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.admin.Setup
      ip: 127.0.0.1
      port: 11110
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.admin.ActivityLog
      ip: 127.0.0.1
      port: 11113
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.admin.GatewayControl
      ip: 127.0.0.1
      port: 11112
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 5000
    - name: trpc.moox.admin.metrics.timer
      port: 11305
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000
    - name: trpc.moox.admin.auth_cache_cleanup.timer
      port: 11306
      network: "0 */5 * * * *"
      protocol: timer
      timeout: 60000
    - name: trpc.moox.admin.certificates.timer
      port: 11307
      network: "0 0 0 * * *"
      protocol: timer
      timeout: 30000

client:
  filter:
    - opentelemetry

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12900
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转，单个文件 10MB、保留 5 份、最多 7 天；标准输出/错误主要是崩溃信息和数据库（GORM）日志，由 moox-runtime 启动前按大小轮转，持续报错时仍可能增长。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
