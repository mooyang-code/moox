syntax = "proto3";

package trpc.moox.ops;

import "moox_common.proto";
import "directory.proto";
import "gatewaycontrol.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// SysDeploy 管理规范主机和组件部署。
message DeploymentHost {
  string host_id = 1;
  string address = 2;
  string private_address = 3;
  string region = 4;
  string status = 5;
  string description = 6;
  string created_at = 7;
  string updated_at = 8;
  // direct 或 outbound（只能出站，经 control 网关反向连接中转）。
  string reachability = 9;
}

message ComponentDeployment {
  string host_id = 1;
  string component_id = 2;
  string status = 3;
  string created_at = 4;
  string updated_at = 5;
}

message HostGatewayRuntimeStatus {
  string instance_id = 1;
  string version = 2;
  string expected_hash = 3;
  string applied_hash = 4;
  int64 route_count = 5;
  string last_seen_at = 6;
  string last_error = 7;
  string previous_instance_id = 8;
  string replaced_at = 9;
  string conflict_instance_id = 10;
  string conflict_seen_at = 11;
  // control 网关上报的各出站主机反向连接会话。
  repeated trpc.moox.admin.RelaySessionStatus relay_sessions = 12;
}

message GetCatalogReq {}
message GetCatalogRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  // Exact embedded shared catalog bytes, including Doctor metadata.
  string catalog_yaml = 2;
  string sha256 = 3;
  // Authoritative protected host; browsers must not infer it from its name.
  string control_host_id = 4;
}

// ListHostsReq/Rsp already belong to Ssh in this protobuf package.
message ListDeploymentHostsReq {
  string host_id = 1;
  string status = 2;
  trpc.moox.common.Page page = 3;
}
message ListDeploymentHostsRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  repeated DeploymentHost hosts = 2;
  trpc.moox.common.PageResult page_result = 3;
}

message ListDeploymentsReq {
  string host_id = 1;
  string component_id = 2;
  string status = 3;
  trpc.moox.common.Page page = 4;
}
message ListDeploymentsRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  repeated ComponentDeployment deployments = 2;
  trpc.moox.common.PageResult page_result = 3;
}

message GetHostRoutesReq {
  string host_id = 1;
}
message GetHostRoutesRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  string host_id = 2;
  // Definition hash excludes keys; the final snapshot hash is in gateway_status.
  string definition_hash = 3;
  repeated trpc.moox.admin.HostGatewayRoute routes = 4;
  HostGatewayRuntimeStatus gateway_status = 5;
  uint32 snapshot_schema_version = 6;
  // Time this response's desired snapshot was actually compiled, not a
  // gateway application time or a persisted configuration revision time.
  string compiled_at = 7;
}

message GetDirectoryReq {}
message GetDirectoryRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  trpc.moox.hostgateway.ServiceDirectory directory = 2;
}

message SetHostStatusReq {
  string host_id = 1;
  string status = 2;
}
message SetHostStatusRsp {
  trpc.moox.common.RetInfo ret_info = 1;
}
message SetDeploymentStatusReq {
  string host_id = 1;
  string component_id = 2;
  string status = 3;
}
message SetDeploymentStatusRsp {
  trpc.moox.common.RetInfo ret_info = 1;
}

message SyncHostDeploymentsReq {
  string host_id = 1;
  string address = 2;
  string private_address = 3;
  string region = 4;
  string description = 5;
  // Complete business component list. Host-scope components are automatic.
  repeated string component_ids = 6;
  // 空或 direct 表示可直达，outbound 表示只能出站。
  string reachability = 7;
}
message SyncHostDeploymentsRsp {
  trpc.moox.common.RetInfo ret_info = 1;
}

message DeleteDeploymentHostReq {
  string host_id = 1;
}
message DeleteDeploymentHostRsp {
  trpc.moox.common.RetInfo ret_info = 1;
}

// EventBus 维护：由 Admin 持管理员令牌代为执行，调用方不需要在本机放管理员凭据文件。
// 只允许 Storage View 的流、消费者和数据事件主题（服务端另有白名单校验）。
message EventBusConsumerState {
  string durable = 1;
  bool exists = 2;
  // 多主题过滤；旧式单主题过滤放在 filter_subject。
  repeated string filter_subjects = 3;
  string filter_subject = 4;
}
message InspectEventBusReq {
  string stream = 1;
  repeated string durables = 2;
}
message InspectEventBusRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  repeated EventBusConsumerState consumers = 2;
}
message DeleteEventBusConsumersReq {
  string stream = 1;
  repeated string durables = 2;
}
message DeleteEventBusConsumersRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  // 实际删除的消费者；本来就不存在的不计入。
  repeated string deleted = 2;
  // 是否已向 EventBus 发出过删除请求。为 false 表示失败发生在发出之前（参数不合规、连不上 EventBus），EventBus 上没有任何改动；
  // 为 true 时即使出错，也可能已经改动，调用方不能当作“什么都没发生”。
  bool attempted = 3;
}
message PurgeEventBusSubjectsReq {
  string stream = 1;
  repeated string subjects = 2;
}
message PurgeEventBusSubjectsRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  // 是否已向 EventBus 发出过清除请求，含义同 DeleteEventBusConsumersRsp.attempted。
  bool attempted = 2;
}

service SysDeploy {
  rpc GetCatalog(GetCatalogReq) returns (GetCatalogRsp);
  rpc ListHosts(ListDeploymentHostsReq) returns (ListDeploymentHostsRsp);
  rpc ListDeployments(ListDeploymentsReq) returns (ListDeploymentsRsp);
  rpc GetHostRoutes(GetHostRoutesReq) returns (GetHostRoutesRsp);
  rpc GetDirectory(GetDirectoryReq) returns (GetDirectoryRsp);
  rpc SetHostStatus(SetHostStatusReq) returns (SetHostStatusRsp);
  rpc SetDeploymentStatus(SetDeploymentStatusReq) returns (SetDeploymentStatusRsp);
  rpc SyncHostDeployments(SyncHostDeploymentsReq) returns (SyncHostDeploymentsRsp);
  rpc DeleteHost(DeleteDeploymentHostReq) returns (DeleteDeploymentHostRsp);
  rpc InspectEventBus(InspectEventBusReq) returns (InspectEventBusRsp);
  rpc DeleteEventBusConsumers(DeleteEventBusConsumersReq) returns (DeleteEventBusConsumersRsp);
  rpc PurgeEventBusSubjects(PurgeEventBusSubjectsReq) returns (PurgeEventBusSubjectsRsp);
}
