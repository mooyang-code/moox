syntax = "proto3";

package trpc.moox.ops;

import "moox_common.proto";
import "gatewaycontrol.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// SysDeploy 管理规范主机和组件部署。
message DeploymentHost {
  string host_id = 1;
  string address = 2;
  string private_address = 3;
  string region = 4;
  string status = 5;
  string description = 6;
  int64 created_at = 7;  // Unix 毫秒
  int64 updated_at = 8;  // Unix 毫秒
  // direct 或 outbound（只能出站，经 control 网关反向连接中转）。
  string reachability = 9;
  // 控制台展示用的中文名，如“控制机”。
  string label = 10;
  // 控制台终端使用的 SSH 端口与用户；端口为 0 表示控制台不能 SSH 到这台主机。凭据与指纹不外传。
  int32 ssh_port = 11;
  string ssh_user = 12;
  // 这台主机的网关是否开外部入口（11004）。
  bool external_entry = 13;
}

message ComponentDeployment {
  string host_id = 1;
  string component_id = 2;
  string status = 3;
  int64 created_at = 4;  // Unix 毫秒
  int64 updated_at = 5;  // Unix 毫秒
}

// 网关最近一次拉取快照时 Admin 记下的状态：期望快照、网关已应用的快照、拉取时间。网关是否在运行看 Monitor 的组件上报。
message HostGatewayRuntimeStatus {
  string expected_hash = 1;
  string applied_hash = 2;
  int64 last_seen_at = 3;  // Unix 毫秒，没拉取过为 0
  // control 网关带来的各出站主机反向连接会话。
  repeated trpc.moox.admin.RelaySessionStatus relay_sessions = 4;
}

message GetCatalogReq {}
message GetCatalogRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  // Exact embedded shared catalog bytes, including Doctor metadata.
  string catalog_yaml = 2;
  string sha256 = 3;
  // Authoritative protected host; browsers must not infer it from its name.
  string control_host_id = 4;
}

// ListHostsReq/Rsp already belong to Ssh in this protobuf package.
message ListDeploymentHostsReq {
  string host_id = 1;
  string status = 2;
  trpc.moox.common.Page page = 3;
}
message ListDeploymentHostsRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  repeated DeploymentHost hosts = 2;
  trpc.moox.common.PageResult page_result = 3;
}

message ListDeploymentsReq {
  string host_id = 1;
  string component_id = 2;
  string status = 3;
  trpc.moox.common.Page page = 4;
}
message ListDeploymentsRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  repeated ComponentDeployment deployments = 2;
  trpc.moox.common.PageResult page_result = 3;
}

// 一条路由是一个方法和能调它的调用方：Admin 按登记的部署与服务目录算出来给人看，网关自己也这样算，不随快照下发。
message HostGatewayRoute {
  string component_id = 1;
  string service_path = 2;
  string method = 3;
  string address = 4;
  int64 timeout_ms = 5;
  int64 max_body_bytes = 6;
  repeated string callers = 7;
  bool read_only = 8;
}

message GetHostRoutesReq {
  string host_id = 1;
}
message GetHostRoutesRsp {
  trpc.moox.common.RetInfo ret_info = 1;
  string host_id = 2;
  repeated HostGatewayRoute routes = 3;
  // expected_hash 是当前登记内容对应的快照哈希，全部主机相同。
  HostGatewayRuntimeStatus gateway_status = 4;
  uint32 snapshot_schema_version = 5;
  // 这次响应实际计算的时刻（Unix 毫秒），不是网关应用快照的时间。
  int64 compiled_at = 6;
}

// SyncTopologyHost 是 moox.toml 里一台主机的完整声明，含启停状态。
message SyncTopologyHost {
  string host_id = 1;
  string address = 2;
  string private_address = 3;
  string region = 4;
  string description = 5;
  // Complete business component list. Host-scope components are automatic.
  repeated string component_ids = 6;
  // 空或 direct 表示可直达，outbound 表示只能出站。
  string reachability = 7;
  string label = 8;
  // SSH 登录信息：ssh_port 为 0 表示控制台不能 SSH（同时清除已存的凭据）。
  // ssh_auth_type 为 password 或 private_key，ssh_secret 是对应的密码或私钥；ssh_passphrase 是私钥口令。
  int32 ssh_port = 9;
  string ssh_user = 10;
  string ssh_auth_type = 11;
  string ssh_secret = 12;
  string ssh_passphrase = 13;
  // 这台主机的网关是否开外部入口（11004）；只能出站的主机不能开。
  bool external_entry = 14;
  // [hosts.<ID>].enabled；停用的主机只剩 host-gateway 能签名。
  bool enabled = 15;
  // component_ids 里记为停用的组件（[deployments_disabled]）。
  repeated string disabled_component_ids = 16;
}

// SyncTopologyReq 是 moox.toml 的整份主机与部署声明：Admin 按它覆盖登记，多出的主机与部署删除，
// 签名公钥与 SSH 指纹保留。setup deploy、setup install 部署每台主机前都发一次。
message SyncTopologyReq {
  repeated SyncTopologyHost hosts = 1;
}
message SyncTopologyRsp {
  trpc.moox.common.RetInfo ret_info = 1;
}

service SysDeploy {
  rpc GetCatalog(GetCatalogReq) returns (GetCatalogRsp);
  rpc ListHosts(ListDeploymentHostsReq) returns (ListDeploymentHostsRsp);
  rpc ListDeployments(ListDeploymentsReq) returns (ListDeploymentsRsp);
  rpc GetHostRoutes(GetHostRoutesReq) returns (GetHostRoutesRsp);
  rpc SyncTopology(SyncTopologyReq) returns (SyncTopologyRsp);
}
