syntax = "proto3";

package trpc.moox.admin;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

message AcquireCollectorPublishLeaseReq {
  string space_id = 1;
  string holder_id = 2;
  int64 expected_fencing_token = 3;
}

message CollectorPublishLeaseRsp {
  common.RetInfo ret_info = 1;
  string space_id = 2;
  string lease_id = 3;
  int64 fencing_token = 4;
  string expires_at = 5;
}

message RenewCollectorPublishLeaseReq {
  string space_id = 1;
  string lease_id = 2;
  int64 fencing_token = 3;
}

message ReleaseCollectorPublishLeaseReq {
  string space_id = 1;
  string lease_id = 2;
  int64 fencing_token = 3;
}

message ReleaseCollectorPublishLeaseRsp {
  common.RetInfo ret_info = 1;
  bool released = 2;
}

message ValidateCollectorPublishLeaseReq {
  string space_id = 1;
  string lease_id = 2;
  int64 fencing_token = 3;
}

message ValidateCollectorPublishLeaseRsp {
  common.RetInfo ret_info = 1;
  bool valid = 2;
  int64 current_fencing_token = 3;
  string expires_at = 4;
}

message BeginCollectorPublishOperationReq {
  string space_id = 1;
  string lease_id = 2;
  int64 fencing_token = 3;
  string operation_id = 4;
}

message CollectorPublishOperationReq {
  string space_id = 1;
  int64 fencing_token = 2;
  string operation_id = 3;
}

message CollectorPublishOperationRsp {
  common.RetInfo ret_info = 1;
  bool active = 2;
  string expires_at = 3;
}

service CollectorPublishLease {
  rpc AcquireCollectorPublishLease(AcquireCollectorPublishLeaseReq) returns (CollectorPublishLeaseRsp);
  rpc RenewCollectorPublishLease(RenewCollectorPublishLeaseReq) returns (CollectorPublishLeaseRsp);
  rpc ReleaseCollectorPublishLease(ReleaseCollectorPublishLeaseReq) returns (ReleaseCollectorPublishLeaseRsp);
  rpc ValidateCollectorPublishLease(ValidateCollectorPublishLeaseReq) returns (ValidateCollectorPublishLeaseRsp);
  rpc BeginCollectorPublishOperation(BeginCollectorPublishOperationReq) returns (CollectorPublishOperationRsp);
  rpc RenewCollectorPublishOperation(CollectorPublishOperationReq) returns (CollectorPublishOperationRsp);
  rpc EndCollectorPublishOperation(CollectorPublishOperationReq) returns (CollectorPublishOperationRsp);
}
