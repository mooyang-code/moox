syntax = "proto3";

package trpc.moox.ops;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// SecretMgr 秘钥管理服务。
// 统一管理系统中 admin 本地秘钥（SSH、交易所、数据库、系统令牌等），
// 敏感字段 c_secret_value 在 DAO 层 AES 加解密，RPC 层返回时脱敏。
// 由主机网关转发原生 tRPC；控制台通过生成的 handler 在 Admin 进程内调用。

// ========== 秘钥管理 ==========

// Secret 秘钥信息（列表/详情返回时，secret_value 始终脱敏）。
message Secret {
  int32 id = 1;
  string secret_id = 2;        // 唯一标识
  string name = 3;              // 名称
  string description = 4;       // 描述
  string category = 5;          // 分类: ssh/exchange/database/jwt/other
  string provider = 6;          // 提供方
  string secret_type = 7;       // 类型: api_key/password/token/certificate/ssh_key/other
  string key_id = 8;            // 公开标识，不脱敏
  string secret_value = 9;      // 脱敏值（如 AKID****8j9k），创建/更新时传明文
  string extra_config = 10;     // 额外配置 (JSON)
  string status = 11;           // active / inactive
  string last_used_at = 12;     // 最后使用时间
  string last_used_by = 13;     // 最后使用方
  string creator = 14;          // 创建人
  string create_time = 15;      // 创建时间
  string modify_time = 16;      // 修改时间
}

message ListSecretsReq {
  string keyword = 1;           // 按名称/描述搜索
  string category = 2;          // 按分类筛选
  string provider = 3;          // 按提供方筛选
  string status = 4;            // 按状态筛选
  int32 offset = 5;
  int32 limit = 6;
}

message ListSecretsRsp {
  common.RetInfo ret_info = 1;
  repeated Secret secrets = 2;
  int64 total = 3;
}

message GetSecretReq {
  string secret_id = 1;
}

message GetSecretRsp {
  common.RetInfo ret_info = 1;
  Secret secret = 2;
}

// GetSecretValue 仅供后台服务通过 /api/service/secret/GetSecretValue 调用，
// 返回明文 secret_value。管理台 /api/admin 路径不得调用此接口。
message GetSecretValueReq {
  string secret_id = 1;
}

// SecretMaterial is deliberately distinct from Secret so the masking filter
// cannot redact the service-auth-only plaintext response.
message SecretMaterial {
  string secret_id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string provider = 5;
  string secret_type = 6;
  string key_id = 7;
  string secret_value = 8;
  string extra_config = 9;
  string status = 10;
}

message GetSecretValueRsp {
  common.RetInfo ret_info = 1;
  SecretMaterial secret = 2;
}

message CreateSecretReq {
  Secret secret = 1;
}

message CreateSecretRsp {
  common.RetInfo ret_info = 1;
  string secret_id = 2;
}

message UpdateSecretReq {
  string secret_id = 1;
  string name = 2;
  string description = 3;
  string key_id = 4;
  string secret_value = 5;      // 为空表示不修改秘钥值
  string extra_config = 6;
  string category = 7;
  string provider = 8;
  string secret_type = 9;
}

message UpdateSecretRsp {
  common.RetInfo ret_info = 1;
}

message DeleteSecretReq {
  string secret_id = 1;
}

message DeleteSecretRsp {
  common.RetInfo ret_info = 1;
}

message ToggleSecretStatusReq {
  string secret_id = 1;
  string status = 2;            // active / inactive
}

message ToggleSecretStatusRsp {
  common.RetInfo ret_info = 1;
}

// ========== 迁移（导出 / 导入） ==========

// ExportSecretsReq 把全部秘钥（含明文，不含系统秘钥与配置备份）用导出口令加密成一个迁移包，供另一套环境导入。
// 明文只在 Admin 进程内出现：口令经 PBKDF2-SHA256 派生 AES-256-GCM 密钥，响应里只有密文。仅全局管理员可调用。
message ExportSecretsReq {
  string passphrase = 1;        // 导出口令，至少 12 个字符；导入时需要同一口令
}

message ExportSecretsRsp {
  common.RetInfo ret_info = 1;
  string bundle = 2;            // 迁移包（JSON 文本），由控制台保存为文件
  int32 count = 3;              // 导出的秘钥数
}

// ImportSecretsReq 用导出口令解开迁移包，按 secret_id 导入（保留原 secret_id，引用它的配置迁移后仍然有效）。仅全局管理员可调用。
message ImportSecretsReq {
  string bundle = 1;
  string passphrase = 2;
  bool overwrite = 3;           // 同一 secret_id 已存在时：true 用迁移包里的内容覆盖，false 跳过
}

message ImportSecretsRsp {
  common.RetInfo ret_info = 1;
  int32 created = 2;
  int32 updated = 3;
  repeated string skipped = 4;  // 已存在而跳过的秘钥名称
  repeated string failed = 5;   // 导入失败的秘钥及原因（“名称：原因”）
}

// ========== Services ==========

service SecretMgr {
  rpc ListSecrets(ListSecretsReq) returns (ListSecretsRsp);
  rpc GetSecret(GetSecretReq) returns (GetSecretRsp);
  rpc GetSecretValue(GetSecretValueReq) returns (GetSecretValueRsp);
  rpc CreateSecret(CreateSecretReq) returns (CreateSecretRsp);
  rpc UpdateSecret(UpdateSecretReq) returns (UpdateSecretRsp);
  rpc DeleteSecret(DeleteSecretReq) returns (DeleteSecretRsp);
  rpc ToggleSecretStatus(ToggleSecretStatusReq) returns (ToggleSecretStatusRsp);
  rpc ExportSecrets(ExportSecretsReq) returns (ExportSecretsRsp);
  rpc ImportSecrets(ImportSecretsReq) returns (ImportSecretsRsp);
}
