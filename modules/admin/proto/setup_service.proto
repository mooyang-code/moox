syntax = "proto3";

package trpc.moox.admin;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

message SetupAdmin {
  string username = 1;
  string password = 2;
}

message SetupTencentCloud {
  string secret_id = 1;
  string secret_key = 2;
}

message SetupHost {
  string name = 1;
  string address = 2;
  int32 port = 3;
  string username = 4;
  string password = 5;
}

message SetupSpace {
  string space_id = 1;
  string name = 2;
  string description = 3;
  string owner = 4;
  string market = 5;
  string timezone = 6;
  string status = 7;
  string attributes_json = 8;
}

message ApplySetupReq {
  SetupAdmin admin = 1;
  SetupTencentCloud tencent_cloud = 2;
  SetupHost control_host = 3;
  repeated SetupHost other_hosts = 4;
  repeated SetupSpace spaces = 5;
}

message ApplySetupRsp {
  common.RetInfo ret_info = 1;
  string action = 2;
  int32 users = 3;
  int32 secrets = 4;
  int32 hosts = 5;
  int32 spaces = 6;
  int32 spaces_created = 7;
  int32 spaces_unchanged = 8;
}

message GetSetupStatusReq {
  SetupAdmin admin = 1;
  SetupTencentCloud tencent_cloud = 2;
  SetupHost control_host = 3;
  repeated SetupHost other_hosts = 4;
  repeated SetupSpace spaces = 5;
}

message GetSetupStatusRsp {
  common.RetInfo ret_info = 1;
  string state = 2;
  int32 users = 3;
  int32 secrets = 4;
  int32 hosts = 5;
  int32 missing = 6;
  int32 conflicts = 7;
  int32 spaces = 8;
}

// 配置备份：CLI 用管理员密码派生的密钥加密整份 moox.toml 后上传，服务端只保存密文信封（解不开），
// 入库时再用管理后台主密钥加密一层。换电脑时登录管理台取回，在本机用管理员密码解开。
message PutConfigBackupReq {
  string envelope = 1;  // 以 "MOOX-CONFIG-BACKUP v1" 开头的密文信封
}

message PutConfigBackupRsp {
  common.RetInfo ret_info = 1;
  int64 updated_at = 2;  // Unix 秒
}

message GetConfigBackupReq {}

message GetConfigBackupRsp {
  common.RetInfo ret_info = 1;
  string envelope = 2;
  int64 updated_at = 3;  // Unix 秒
}

service Setup {
  rpc ApplySetup(ApplySetupReq) returns (ApplySetupRsp);
  rpc GetSetupStatus(GetSetupStatusReq) returns (GetSetupStatusRsp);
  rpc PutConfigBackup(PutConfigBackupReq) returns (PutConfigBackupRsp);
  rpc GetConfigBackup(GetConfigBackupReq) returns (GetConfigBackupRsp);
}
