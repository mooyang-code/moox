syntax = "proto3";

package trpc.moox.infra;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// Infra 域只有认证（Auth）。
// 由主机网关转发原生 tRPC；控制台通过生成的 handler 在 Admin 进程内调用。
//
// 响应设计参考 storage/access：每个响应首字段 common.RetInfo（code/msg），
// code=SUCCESS(0) 表示成功，非 0 均为错误码；网关直接返回 PB JSON 不加工。
//
// 浏览器会话由控制台的 HTTP 层管理：Login 成功后下发 HttpOnly Cookie，之后每个请求按 Cookie 查会话，
// 把 user_id、username、会话 ID 写进 ctx metadata。Login 是唯一不需要会话的接口。

// ========== 认证（Auth）==========

// UserInfo 用户信息。系统只有一个超级用户，登录即拥有全部权限，没有角色与状态。
message UserInfo {
  string user_id = 1;
  string username = 2;
  int64 created_at = 3;     // 创建时刻（Unix 毫秒）
  int64 last_login_at = 4;  // 最后登录时刻（Unix 毫秒），没登录过为 0
  string last_login_ip = 5;
}

// ========== 登录 ==========

// LoginReq 的密码是明文，靠 HTTPS 保护；来源 IP 与浏览器标识由控制台的 HTTP 层取，不在请求体里。
message LoginReq {
  string username = 1;
  string password = 2;
}

// LoginRsp 不带会话 ID：会话只在 HttpOnly Cookie 里，页面脚本读不到。
message LoginRsp {
  common.RetInfo ret_info = 1;
  UserInfo user_info = 2;
  int64 expires_at = 3;  // 会话过期时刻（Unix 毫秒）
}

message LogoutReq {}
message LogoutRsp {
  common.RetInfo ret_info = 1;
}

// ========== 用户信息 ==========

message GetUserInfoReq {}

message GetUserInfoRsp {
  common.RetInfo ret_info = 1;
  UserInfo user_info = 2;
}

// ========== Services ==========

service Auth {
  // 用户登录
  rpc Login(LoginReq) returns (LoginRsp);
  // 退出登录，删除当前会话
  rpc Logout(LogoutReq) returns (LogoutRsp);
  // 获取用户信息
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoRsp);
}
