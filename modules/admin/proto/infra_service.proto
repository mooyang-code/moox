syntax = "proto3";

package trpc.moox.infra;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// Infra 域合并认证（Auth）与 DNS 代理（Dns）。
// 纯 RPC 服务，由统一 HTTP 转发层（/api/admin/auth/{method}）调度。
//
// 响应设计参考 storage/access：每个响应首字段 common.RetInfo（code/msg），
// code=SUCCESS(0) 表示成功，非 0 均为错误码；网关直接返回 PB JSON 不加工。
//
// 未鉴权接口（auth 的 GetLoginSalt/Login）由网关 no_auth_methods 配置放行；
// 其余接口由网关 authorize filter 校验 JWT 并将 user_id/username/role 注入 ctx metadata。

// ========== 认证（Auth）==========

// UserStatus 用户状态。
enum UserStatus {
  USER_STATUS_INACTIVE = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_BANNED = 3;
}

// UserRole 用户角色。
enum UserRole {
  USER_ROLE_GUEST = 0;
  USER_ROLE_USER = 1;
  USER_ROLE_ADMIN = 2;
  USER_ROLE_SUPER_ADMIN = 3;
}

// UserInfo 用户信息。
message UserInfo {
  string user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string avatar = 6;
  UserStatus status = 7;
  UserRole role = 8;
  int64 created_at = 9;     // 创建时间戳
  int64 last_login_at = 10; // 最后登录时间戳
  string last_login_ip = 11;
}

// ========== 登录盐值 ==========

message GetLoginSaltReq {
  string username = 1;  // 用户名/邮箱/手机号
}

message GetLoginSaltRsp {
  common.RetInfo ret_info = 1;
  string salt = 2;       // 随机盐值
  int64 timestamp = 3;   // 服务器时间戳
  int64 expires_in = 4;  // 盐值过期时间（秒）
}

// ========== 登录 ==========

message LoginReq {
  string username = 1;
  string password_hash = 2;  // 密码哈希值
  string salt = 3;           // 从 GetLoginSalt 获取的盐值
  int64 timestamp = 4;       // 从 GetLoginSalt 获取的时间戳
  string device_id = 5;
  string user_agent = 6;
  string client_ip = 7;
}

message LoginRsp {
  common.RetInfo ret_info = 1;
  string access_token = 2;  // 访问令牌
  int64 expires_in = 3;     // 过期时间（秒）
  UserInfo user_info = 4;
  string session_id = 5;
  string request_signing_key = 6;
  int64 expires_at = 7;
}

message LogoutReq {}
message LogoutRsp {
  common.RetInfo ret_info = 1;
}

message IssueRawSessionTicketReq {
  string operation = 1;
  string session_id = 2;
}
message IssueRawSessionTicketRsp {
  common.RetInfo ret_info = 1;
  string ticket = 2;
  int64 expires_at = 3;
}

// ========== 用户信息 ==========

message GetUserInfoReq {
  string user_id = 1;
}

message GetUserInfoRsp {
  common.RetInfo ret_info = 1;
  UserInfo user_info = 2;
}

message UpdateUserInfoReq {
  string nick = 1;    // 昵称
  string email = 2;
  string avatar = 3;  // 头像URL
}

message UpdateUserInfoRsp {
  common.RetInfo ret_info = 1;
  UserInfo user_info = 2;
}

// ========== Services ==========

service Auth {
  // 获取登录盐值
  rpc GetLoginSalt(GetLoginSaltReq) returns (GetLoginSaltRsp);
  // 用户登录
  rpc Login(LoginReq) returns (LoginRsp);
  rpc Logout(LogoutReq) returns (LogoutRsp);
  rpc IssueRawSessionTicket(IssueRawSessionTicketReq) returns (IssueRawSessionTicketRsp);
  // 获取用户信息
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoRsp);
  // 更新用户信息
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoRsp);
}
