syntax = "proto3";

package trpc.moox.admin;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// 全部主机拿到同一份快照：登记的主机（连同签名公钥）、部署、不属于主机的身份的公钥。快照里没有秘密，也没有路由：
// 各网关按内嵌的服务目录自己算本机路由、谁能调、出站主机的中转许可。
message HostGatewaySnapshot {
  uint32 schema_version = 1;
  string hash = 2;
  repeated SnapshotHost hosts = 3;
  repeated SnapshotDeployment deployments = 4;
  repeated SnapshotIdentity identities = 5;
}

message SnapshotHost {
  string host_id = 1;
  string address = 2;
  string private_address = 3;
  // direct / outbound
  string reachability = 4;
  bool enabled = 5;
  // 这台主机的网关是否开外部入口（11004）。别的网关只认它带来源头（X-Moox-Origin-Caller）转过来的请求。
  bool external_entry = 6;
  // ed25519 公钥，32 字节；还没签发过身份包的主机为空，它的请求在各网关上验不过。
  bytes sign_public_key = 7;
}

message SnapshotDeployment {
  string host_id = 1;
  string component_id = 2;
  bool enabled = 3;
}

// 不属于主机的身份：moox-cli、scf-collector。
message SnapshotIdentity {
  string identity = 1;
  // ed25519 公钥，32 字节。
  bytes sign_public_key = 2;
}

// 网关每次刷新（约 5 秒）调一次，兼作心跳：Admin 每次都记下期望快照、这台网关已应用的快照（current_hash）与时间。
message PullSnapshotReq {
  string host_id = 1;
  // 网关当前已应用的快照哈希；还没有快照时为空。
  string current_hash = 2;
  // 只有 control 网关带上：各出站主机的反向连接会话。
  repeated RelaySessionStatus relay_sessions = 3;
}

message PullSnapshotRsp {
  common.RetInfo ret_info = 1;
  bool changed = 2;
  HostGatewaySnapshot snapshot = 3;
}

// control 网关上一台出站主机的反向连接会话状态。
message RelaySessionStatus {
  string host_id = 1;
  bool online = 2;
  string instance_id = 3;
  // Unix 毫秒，离线时为 0。
  int64 connected_at = 4;
  int64 reconnects = 5;
  int32 streams = 6;
}

// 只有各主机的网关能调：控制机网关验过签名后转给本机的 Admin，并把验过的签名主机 ID 放在 x-moox-verified-host
// 元数据头里（控制机网关自己直连时也带上）；服务要求请求里的 host_id 与它一致。
service GatewayControl {
  rpc PullSnapshot(PullSnapshotReq) returns (PullSnapshotRsp);
}
