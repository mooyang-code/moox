syntax = "proto3";

package trpc.moox.admin;

import "moox_common.proto";
import "directory.proto";

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

// One route represents exactly one method and its permitted callers.
message HostGatewayRoute {
  string component_id = 1;
  string service_path = 2;
  string method = 3;
  string address = 4;
  int64 timeout_ms = 5;
  int64 max_body_bytes = 6;
  repeated string callers = 7;
  bool read_only = 8;
}

// 一把校验公钥，快照里没有秘密。host_id 非空是主机密钥：这台主机上的组件共用，callers 是部署在这台主机上、
// 可以用它签名的调用方；host_id 为空是不属于主机的身份（moox-cli 等），identity 是身份名。
message GatewayVerificationKey {
  string host_id = 1;
  string identity = 2;
  // ed25519 公钥，32 字节。
  bytes public_key = 3;
  repeated string callers = 4;
}

// 一台出站主机允许经 control 中转连接的端口与调用方，只出现在 control 的快照里。
message HostGatewayRelayPort {
  int32 port = 1;
  repeated string callers = 2;
}

message HostGatewayRelay {
  string host_id = 1;
  repeated HostGatewayRelayPort ports = 2;
}

message HostGatewaySnapshot {
  uint32 schema_version = 1;
  string host_id = 2;
  string hash = 3;
  bool disabled = 4;
  repeated HostGatewayRoute routes = 5;
  trpc.moox.hostgateway.ServiceDirectory directory = 6;
  repeated GatewayVerificationKey verification_keys = 7;
  repeated HostGatewayRelay relays = 8;
}

message PullSnapshotReq {
  string host_id = 1;
  string current_hash = 2;
}

message PullSnapshotRsp {
  common.RetInfo ret_info = 1;
  bool changed = 2;
  HostGatewaySnapshot snapshot = 3;
}

// control 网关上一台出站主机的反向连接会话状态。
message RelaySessionStatus {
  string host_id = 1;
  bool online = 2;
  string instance_id = 3;
  // RFC3339，离线时为空。
  string connected_at = 4;
  int64 reconnects = 5;
  int32 streams = 6;
}

message ReportStatusReq {
  string host_id = 1;
  string instance_id = 2;
  string version = 3;
  string applied_hash = 4;
  string error = 5;
  int32 route_count = 6;
  // 只有 control 网关上报。
  repeated RelaySessionStatus relay_sessions = 7;
}

message ReportStatusRsp {
  common.RetInfo ret_info = 1;
}

// 只有各主机的网关能调：控制机网关验过签名后转给本机的 Admin，并把验过的签名主机 ID 放在 x-moox-verified-host
// 元数据头里（控制机网关自己直连时也带上）；服务要求请求里的 host_id 与它一致。
service GatewayControl {
  rpc PullSnapshot(PullSnapshotReq) returns (PullSnapshotRsp);
  rpc ReportStatus(ReportStatusReq) returns (ReportStatusRsp);
}
