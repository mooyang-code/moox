syntax = "proto3";

package trpc.moox.admin;

option go_package = "github.com/mooyang-code/moox/modules/admin/proto/admingen;adminpb";

import "moox_common.proto";

// ========== 工作空间管理（SpaceMgr）==========
// 对应 internal/service/space 的 t_spaces / t_space_members 表，
// 由本进程 SpaceMgr 实现，经统一网关透传 /api/admin/space/{method}。

message Space {
  int64 id = 1;
  string space_id = 2;
  string name = 3;
  string description = 4;
  string owner = 5;
  string market = 6;
  string timezone = 7;
  string status = 8;
  string attributes = 9;
  string created_at = 10;
  string updated_at = 11;
}

message SpaceMember {
  int64 id = 1;
  string space_id = 2;
  string user_id = 3;
  string role = 4;
  string status = 5;
  string attributes = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateSpaceReq {
  Space space = 1;
}
message CreateSpaceRsp {
  common.RetInfo ret_info = 1;
  Space space = 2;
}
message UpdateSpaceReq {
  Space space = 1;
}
message UpdateSpaceRsp {
  common.RetInfo ret_info = 1;
  Space space = 2;
}
message DeleteSpaceReq {
  string space_id = 1;
}
message DeleteSpaceRsp {
  common.RetInfo ret_info = 1;
}
message ListSpacesReq {
  string owner = 1;
  string status = 2;
  common.Page page = 3;
}
message ListSpacesRsp {
  common.RetInfo ret_info = 1;
  repeated Space spaces = 2;
  common.PageResult page_result = 3;
}
message ListSpaceMembersReq {
  string space_id = 1;
  common.Page page = 2;
}
message ListSpaceMembersRsp {
  common.RetInfo ret_info = 1;
  repeated SpaceMember members = 2;
  common.PageResult page_result = 3;
}

// ========== Services ==========

service SpaceMgr {
  rpc CreateSpace(CreateSpaceReq) returns (CreateSpaceRsp);
  rpc UpdateSpace(UpdateSpaceReq) returns (UpdateSpaceRsp);
  rpc DeleteSpace(DeleteSpaceReq) returns (DeleteSpaceRsp);
  rpc ListSpaces(ListSpacesReq) returns (ListSpacesRsp);
  rpc ListSpaceMembers(ListSpaceMembersReq) returns (ListSpaceMembersRsp);
}
