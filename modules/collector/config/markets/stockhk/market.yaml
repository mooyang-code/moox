# 港股的市场参数，只有 Collector 读，编进二进制（见 config/markets/embed.go）。
# 交易时段、时区、交易日历登记在 packages/barclock，不在这里重复。
market_id: stockhk
# 成交额的计价币种：K 线行的 amount_unit 写它的小写，标的属性 currency 写原值。
currency: HKD
# 结果数据集的允许迟到时间默认值（秒），任务没写时用它。
allowed_lateness_seconds: 90
# 固定的序列标签；不写表示按数据源生成。
series_tag: default
# 实时批次不限标的数（每函数标的数由采集计划按容量校验）。
realtime_batch_no_cap: true
# 云函数出口探测：只取出口公网 IP（与 A 股共用南京出口，不绑定数据源）。
egress_probe: public_ip
# 标的同步（指数成分）的请求直连。
subject_egress: direct
# 不写 subject_sync：港股没有全市场标的同步，标的由指数成分的标签同步创建。
# 收市后多久把当天整天强制重取一遍（分钟）；不写就不重取。
# 16:00 这根在 16:10 前才并入收市竞价的成交，16:00:05 取到的是连续交易时段的值，所以收市 15 分钟后整天重取一次；
# 半日市按当天实际的收市时刻（12:00）算。
refetch_after_close_minutes: 15
# 采集计划的默认参数，moox.toml 的 [scf_plan] 里同名项优先。
scf_plan:
  # 固定每函数 25 只标的（恒指 95 只共 4 个函数）。不按负载估算函数个数（不写 auto_size），
  # 也不做出口 IP 去重（不写 egress_balance）：95 只标的用不上这两样。
  symbols_per_function: 25
  default_ingest: pull
  default_executor: scf
  # 收盘后固定等 5 秒再取数（not_before_ms），与 route.yaml 的结算延迟 5 秒一致，生成计划时校验前者不小于后者。
  # 2026-11-12 实测普通边界最晚 0.5 秒定稿，取样有空档时看到的上限是 5.8 秒；截止时间是收盘后 90 秒，等 5 秒没有影响。
  fetch: {request_timeout_ms: 3000, storage_timeout_ms: 2000, not_before_ms: 5000}
