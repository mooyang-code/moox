market_id: stockhk
# 这份路由管的品种：港股股票的 K 线来源按下面的候选链分配。
instrument_type: equity
# 结算延迟（毫秒）：实时采集只写“收盘时刻 + 结算延迟”已经过去的 K 线。
# 2026-11-12 南京实测：刚收盘那根在边界后最晚 0.5 秒还在变；断连多、取样有空档的三个边界最晚看到 5.8 秒，之后 60 秒内不再变。
# 采集计划的 not_before_ms（market.yaml 的 scf_plan，可被部署配置覆盖）不能小于它，生成计划时会校验。
settle_delay_ms: 5000
# 不写 instrument_providers：港股没有全市场标的同步，标的由指数成分的标签同步创建（成分来源是腾讯，不归路由管）。
# 按频率分开的 K 线候选链。路由 ID 按频率生成：stockhk_equity_kline_<频率>。
klines:
  # 5m：只有东方财富一个主源，没有备源（2026-11-12 实测其他源要么没有开高低收，要么延迟 15 分钟以上）。
  # 不复权；时间标签是收盘时刻，每天 66 根（首根 09:35、末根 16:00，上午最后一根 12:00、下午第一根 13:05）；
  # 成交量单位是股，成交额单位是港元；回看约 23 个交易日。失败最多重试 3 次，之后等补采。
  - frequency: 5m
    providers:
      - {id: eastmoney, source_id: stockhk_http, weight: 1, role: primary}
