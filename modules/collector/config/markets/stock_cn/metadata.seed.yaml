spaces:
  - space_id: stock_cn
    name: 中国股票
    description: 中国股票内置行情空间
    owner: collector
    status: active
    attributes:
      scope: builtin
      owner_module: collector
      managed_by: moox-cli
      register_metadata: "true"
      runtime_enabled: "false"
data_sources:
  - space_id: stock_cn
    data_source_id: internal
    name: 内部统一
    kind: internal
    market: CN
    timezone: Asia/Shanghai
    status: active
  - space_id: stock_cn
    data_source_id: sina
    name: 新浪行情
    kind: vendor_api
    market: CN
    timezone: Asia/Shanghai
    status: active
    attributes:
      provider_id: sina
  - space_id: stock_cn
    data_source_id: eastmoney
    name: 东方财富
    kind: vendor_api
    market: CN
    timezone: Asia/Shanghai
    status: active
    attributes:
      provider_id: eastmoney
  - {space_id: stock_cn, data_source_id: ifeng, name: 凤凰行情, kind: vendor_api, market: CN, timezone: Asia/Shanghai, status: active, attributes: {provider_id: ifeng}}
