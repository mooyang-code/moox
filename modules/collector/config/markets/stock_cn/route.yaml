market_id: stock_cn
route_id: stock_cn_kline_1m_v1
frequency: 1m
# Release-time value. Change only with a new SCF publish and runtime canary.
timer_function_count: 170
measured_safe_group_size: 40
stagger:
  start_second: 5
  window_seconds: 35
  max_starts_per_second: 6
providers:
  # Complete instrument snapshots are fetched concurrently and merged by
  # canonical SubjectID. A failed source does not block healthy sources;
  # the merged set still must pass the complete snapshot gate. The current
  # complete-list candidates are Sina and EastMoney; Tencent remains Kline-only
  # until it has a verified full-market InstrumentFetcher, and Baidu stays
  # outside the candidate chain because its live response is not stable.
  - id: sina
    weight: 1
    kline: active
    instrument: active
  - id: eastmoney
    weight: 1
    kline: active
    instrument: active
  - id: tencent
    weight: 1
    kline: active
    instrument: disabled
  - id: baidu
    weight: 1
    kline: shadow
    instrument: disabled
history:
  mode: live_only
  backfill_enabled: false
  # Current public feeds expose only a bounded latest page. Longer history
  # requires a cursor-paginated provider before this value is increased.
  max_lookback: 1d
