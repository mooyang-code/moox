# 美股的市场参数，只有 Collector 读，编进二进制（见 config/markets/embed.go）。
# 交易时段、时区、交易日历登记在 packages/barclock，不在这里重复。
market_id: stockus
# 成交额的计价币种：K 线行的 amount_unit 写它的小写，标的属性 currency 写原值。
currency: USD
# K 线任务的默认采集方式：scf 是云函数定时拉取，补采也走云函数。
ingest: scf
# 结果数据集的允许迟到时间默认值（秒），任务没写时用它。
allowed_lateness_seconds: 90
# 固定的序列标签；不写表示按数据源生成。
series_tag: default
# 实时批次不限标的数（每函数标的数由采集计划按容量校验）。
realtime_batch_no_cap: true
# 标的同步（指数成分）的请求直连。
subject_egress: direct
# 不写 subject_sync：美股没有全市场标的同步，标的由指数成分的标签同步创建。
# 云函数出口探测：只取出口公网 IP（与 A 股、港股共用南京出口，不绑定数据源）。
egress_probe: public_ip
# 收市后多久把当天整天强制重取一遍（分钟）；不写就不重取。重取补上实时那一期失败或缺的根。
# CNBC 的 1M 收完几秒就是终值，重取不改变已经写对的根；收盘竞价不进任何一根（见 sources/stockus/cnbc）。
# 20 分钟是换源前按东方财富 16:16 才并入收盘竞价定的，CNBC 不依赖它，没有再调。半日市按当天实际收市时刻 13:00 加 20 分钟。
refetch_after_close_minutes: 20
# 交易状态检测：开盘前查一次腾讯美股快照第 40 个字段（S 停牌，D 退市）。2026-11-24 实测纳斯达克上市的暂停股标 S，
# AMEX 上市的暂停股腾讯不标（照旧按缺数处理）。
trading_status:
  - {market_type: equity, source: tencent, cron: "5 9 * * 1-5", timezone: America/New_York}
# 采集计划的默认参数，moox.toml 的 [scf_plan] 里同名项优先。
scf_plan:
  # 固定每函数 50 只标的（标普 500 共 503 只、11 个函数）。美股只有 CNBC 一个数据源，每只每期一个请求，
  # 函数内并发 16（等于 CNBC 限速的 max_concurrent），南京实测 50 只 3～5 秒取完。不按负载估算函数个数（不写 auto_size），
  # 也不做出口 IP 去重（不写 egress_balance）。
  symbols_per_function: 50
  # 收盘后固定等 5 秒再取数（not_before_ms），与 route.yaml 的结算延迟 5 秒一致，生成计划时校验前者不小于后者。
  # 2026-11-24 本机实测 CNBC 1M（纽约 10:35、10:45、10:55 三个边界、各 30 只）：边界后 2 秒取，最后一分钟那根 90/90 都已在，
  # 89/90 与 60 秒后完全相同（NVDA 10:44 那根 12～60 秒之间收盘价改了 0.01、量少了 659 股）；
  # 云函数到 CNBC 的单次耗时还要 1～3 秒，留余量取 5 秒。截止时间是收盘后 90 秒，多等没有代价。
  fetch: {request_timeout_ms: 3000, storage_timeout_ms: 2000, not_before_ms: 5000}
