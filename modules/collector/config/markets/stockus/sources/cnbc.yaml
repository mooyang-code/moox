provider:
  id: cnbc
  market: stockus
  # 美股唯一的 K 线来源：CNBC 网页自用的 1M 接口，本地合成 5m（见 internal/sources/stockus/cnbc）。只取 K 线。
  enabled_feeds: [kline]
  hosts: [ts-api.cnbc.com]
  kline:
    # 能力声明：一只标的一个交易日 78 根 5m。历史补齐跨交易日合并的分块（至多 1000 根）在源内按 31 天一次取完。
    max_bars_per_request: 78
  rate_limit:
    scope: egress_ip
    # 2026-11-23 实测：本机、控制机并发 64、约 6000 次请求没有一次失败；南京云函数 11 个函数同时取标普 500，
    # 单次 p90 约 1.4～1.8 秒，零星超时。每函数 50 只、并发 16，3～5 秒取完；超时靠重试兜底。
    requests_per_second: 50
    burst: 20
    max_concurrent: 16
    cooldown: 1s
    # request_timeout 管整次取数（一个标的的一次 FetchKlines），云函数定时采集用不到它（本地执行端不设进程环境，会直接用这里的 15 秒；线上美股是云函数）：定时函数按计划的 fetch.request_timeout_ms
    # （market.yaml 的 scf_plan，3 秒，取一根 5m 的一次 5 分钟请求）设进程环境，覆盖这里。没有这项环境的补采函数用这里的值：
    # 历史补齐的一块是一次约 20 天的请求，2026-11-25 从控制机实测单次 2.7～6.2 秒。原先 3 秒时补齐的尝试大多超时
    # （南京补采函数 9 秒 = 3 次 × 3 秒放弃，没有一次 429、403）。15 秒 × 3 次在补采函数 60 秒的执行预算内。
    request_timeout: 15s
