market_id: stockus
# 这份路由管的品种：美股股票的 K 线来源按下面的候选链分配。
instrument_type: equity
# 结算延迟（毫秒）：实时采集只写“收盘时刻 + 结算延迟”已经过去的 K 线。
# CNBC 的 1M 收完几秒就是终值：2026-11-24 本机实测三个边界、各 30 只，边界后 2 秒最后一分钟都已在（见 market.yaml 的 scf_plan）。
# 采集计划的 not_before_ms（market.yaml 的 scf_plan，可被部署配置覆盖）不能小于它，生成计划时会校验。
settle_delay_ms: 5000
# 不写 instrument_providers：美股没有全市场标的同步，标的由指数成分的标签同步创建。
# 按频率分开的 K 线候选链。路由 ID 按频率生成：stockus_equity_kline_<频率>。
klines:
  # 5m：只有 CNBC 一个源，没有备源（2026-11-24 用户拍板美股不用东方财富：南京出口取东方财富美股被成片断开）。
  # 取 1M 本地合成，不复权；时间标签是开始时刻（纽约时间），直接当行键；冬令时、夏令时每天都是 78 根，半日市 42 根。
  # 成交量单位是股，约为全市场的八成；没有成交额，按 成交量 × 均价 估算；收盘那根不含收盘竞价。
  # 1M 回看按 300 天声明（实测约 11 个月前仍有）。失败最多重试 3 次，之后等补采。
  - frequency: 5m
    providers:
      - {id: cnbc, source_id: stockus_cnbc_http, weight: 1, role: primary}
