# MooX Collector control-plane service configuration.

# Collector 调用 Storage、CloudNode、出口代理等组件统一经 gatewayclient（本机主机网关 + 服务目录）。
gateway_client:
  mode: local
  caller: collector
  key_file: ../secrets/caller-collector.key
  ca_file: ../certs/moox-ca.crt
  cache_dir: ./data/gatewayclient

database:
  type: sqlite
  path: ./data/moox_collector.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

cloudnode:
  # 本地开发默认值；生产部署应通过 t_service_deployments / SysDeploy active 部署信息解析依赖服务。
  address: 127.0.0.1:11401
  service_path: trpc.moox.cloudnode.CloudNodeMgr

storage:
  result_data_node_id: storage-node-0

period_readiness:
  grace: 2m
  report_interval: 5s
  item_retention: 60
  parent_retention: 168h

collector_retention:
  maintenance_interval: 1m
  # 每分钟整点由 K 线调度占用唯一的 SQLite 连接；清理从第 35 秒开始，并在下一个整点前结束。
  maintenance_offset: 35s
  maintenance_timeout: 20s
  max_rows_per_pass: 50000
  execution_detail_retention: 6h
  scheduled_run_summary_retention: 720h
  terminal_retry_retention: 168h
  period_snapshot_retention: 720h

kline_resample:
  # Disabled by default; enable explicitly for a deployment after target
  # Dataset/View and a small subject canary have been verified.
  enabled: false
  scan_timeout: 30s
  worker_concurrency: 2
  max_claims_per_tick: 100
  worker_subject_batch_size: 50
  worker_job_timeout: 30s
  worker_poll_interval: 5s
  worker_max_source_keys_per_claim: 20000
  stale_running_after: 2m
  default_settle_delay: 10s
  repair_lookback_buckets: 3

health:
  addr: ":11412"

# Collector resolves these hosts before dispatching a short-lived SCF task.
# Binance is enabled by default; add other provider hosts here as needed.
dns:
  domains:
    - data-api.binance.vision
    - api-gcp.binance.com
    - api.binance.com
    - fapi.binance.com
  refresh_interval: 5m
  resolve_timeout: 5s
  # nameservers: ["119.29.29.29", "1.1.1.1"]

# 出口代理部署在香港，经主机网关调用；部署时由 CLI 按 moox.toml 渲染。
egress_proxy:
  # 走出口代理的 HTTP 域名，支持 "*." 前缀；为空时所有请求直连。
  domains: []
  dns:
    # 由出口代理解析的域名，结果写入 SCF 的 DNS 快照；为空时只用上面的本机解析。
    domains: []
    refresh_interval: 5m
    request_timeout: 3s
    cache_ttl: 5m

# 标的同步：标签同步每分钟第 30 秒检查一次，按各标签在管理台设置的计划同步自动标签的成员；
# 属性同步每分钟第 45 秒检查一次，执行本分钟内到点的任务（计划带时区，与主机时区无关）。
subject_sync:
  fetch_timeout: 2m
  attributes:
    - space_id: stockcn
      sources: [eastmoney]
      instrument_type: equity
      cron: "10 8 * * *"
      timezone: Asia/Shanghai
    - space_id: crypto
      sources: [binance]
      instrument_type: spot
      cron: "10 8 * * *"
      timezone: Asia/Shanghai
