global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 11942
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.collector.CollectMgr
      ip: 127.0.0.1
      port: 11402
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 320000
    - name: trpc.moox.collector.StreamCollector
      ip: 127.0.0.1
      port: 11422
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 10000
    - name: trpc.moox.collector.Health
      ip: 127.0.0.1
      port: 11412
      network: tcp
      protocol: http_no_protocol
      # 健康检查端口同时承载生命周期接口：暂停要等在途补采分块结束、SCF 定时器停用确认（最长 5 分钟），请求时限要大于它
      timeout: 330000
    - name: trpc.moox.collector.metrics.timer
      port: 11412
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 25000
    - name: trpc.moox.collector.kline_resample.timer
      port: 11415
      network: "0 * * * * *"
      protocol: timer
      timeout: 10000
    - name: trpc.moox.collector.dns.timer
      port: 11414
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000
    - name: trpc.moox.collector.subject_tags.timer
      port: 11416
      network: "30 * * * * *"
      protocol: timer
      timeout: 600000
    - name: trpc.moox.collector.subject_attributes.timer
      port: 11417
      network: "45 * * * * *"
      protocol: timer
      timeout: 600000
plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12942
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转，单个文件 10MB、保留 5 份、最多 7 天；标准输出/错误主要是崩溃信息和数据库（GORM）日志，由 moox-runtime 启动前按大小轮转，持续报错时仍可能增长。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
