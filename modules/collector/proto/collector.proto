syntax = "proto3";

package trpc.moox.collector;

import "moox_common.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/mooyang-code/moox/modules/collector/proto/collectorgen;collectorpb";

// CollectMgr 管理采集任务、任务实例和任务结果。
// 纯 RPC 服务，由统一 HTTP 转发层调度：
//   - /api/admin/collectmgr/{method}（JWT，面向前端）
//
// 响应设计参考 storage/access：每个响应首字段 common.RetInfo（code/msg），
// code=SUCCESS(0) 表示成功，非 0 均为错误码；网关直接返回 PB JSON 不加工。
//
// space_id 由请求参数显式传入；服务端按 space_id 做租户隔离。

enum TaskInstanceStatus {
  TASK_INSTANCE_STATUS_UNSPECIFIED = 0;
  TASK_INSTANCE_STATUS_PENDING = 1;
  TASK_INSTANCE_STATUS_SUCCESS = 2;
  TASK_INSTANCE_STATUS_FAILED = 3;
}

// CollectionTask 是用户可见的采集任务。
message CollectionTask {
  string space_id = 1;
  string task_id = 2;
  string task_name = 3;
  string description = 4;
  string data_type = 5;
  string provider = 6;
  google.protobuf.Struct collect_params = 7;
  optional bool enabled = 8;
  string creator = 9;
  string create_time = 10;    // RFC3339
  string modify_time = 11;    // RFC3339
  string market_type = 12;
  string prepare_state = 13;  // pending/waiting_view/ready/error
  string last_error = 14;
  TaskResult result = 15;
}

// TaskResult 是采集任务唯一结果的用户可读摘要。
message TaskResult {
  string result_name = 1;
  string view_id = 2;
  string status = 3;
  string last_data_time = 4;
  string data_kind = 5;
  string coverage_start = 6;
  string coverage_end = 7;
}

// ResultConfig 是结果存储的高级配置，不允许指定既有结果。
message ResultConfig {
  string data_node_id = 1;
  string keep_duration = 2;
  string description = 3;
}

message GetTaskListReq {
  string space_id = 1;
  string data_type = 2;
  string provider = 3;
  optional bool enabled = 4;
  string task_id = 5;
  common.Page page = 6;
  string market_type = 7;
}

message GetTaskListRsp {
  common.RetInfo ret_info = 1;
  repeated CollectionTask tasks = 2;
  common.PageResult page = 3;
}

message GetTaskDetailReq {
  string space_id = 1;
  string task_id = 2;
}

message GetTaskDetailRsp {
  common.RetInfo ret_info = 1;
  CollectionTask task = 2;
}

message CreateTaskReq {
  CollectionTask task = 1;
  ResultConfig result_config = 2;
}

message CreateTaskRsp {
  common.RetInfo ret_info = 1;
  string task_id = 2;
}

message UpdateTaskReq {
  string space_id = 1;
  string task_id = 2;
  CollectionTask task = 3;
  ResultConfig result_config = 4;
}

message UpdateTaskRsp {
  common.RetInfo ret_info = 1;
  CollectionTask task = 2;
}

message DisableTaskReq {
  string space_id = 1;
  string task_id = 2;
}

message DisableTaskRsp {
  common.RetInfo ret_info = 1;
}

message DeleteTaskReq {
  string space_id = 1;
  string task_id = 2;
  bool delete_result_data = 3;
}

message DeleteTaskRsp {
  common.RetInfo ret_info = 1;
}

// TaskInstance 任务实例。
message TaskInstance {
  string space_id = 1;
  string task_id = 2;
  string instance_id = 3;
  string provider = 4;
  string market_type = 5;
  string data_type = 6;
  string dataset_id = 7;
  string subject_id = 8;
  string frequency = 9;
  google.protobuf.Struct task_params = 11;
  TaskInstanceStatus last_exec_status = 13;
  string last_exec_time = 14;  // RFC3339，可为空
  google.protobuf.Struct result = 15;
  bool is_deleted = 16;
  string create_time = 17;     // RFC3339
  string modify_time = 18;     // RFC3339
  string function_name = 19;   // 当前绑定的 SCF 函数名
  string source_id = 20;       // 当前绑定的 Provider 来源
}

// TaskInstanceFilter 任务实例筛选条件。
message TaskInstanceFilter {
  string space_id = 1;
  string task_id = 2;
  string instance_id = 3;
  string provider = 4;
  string market_type = 5;
  string data_type = 6;
  string dataset_id = 7;
  string subject_id = 8;
  string frequency = 9;
  TaskInstanceStatus last_exec_status = 11;
  bool include_deleted = 13;
  common.Page page = 14;
  string function_name = 15; // 当前绑定的 SCF 函数名
  string source_id = 16;     // 当前绑定的 Provider 来源
}

message GetTaskInstanceListReq {
  TaskInstanceFilter filter = 1;
}

message GetTaskInstanceListRsp {
  common.RetInfo ret_info = 1;
  repeated TaskInstance instances = 2;
  common.PageResult page = 3;
}

// ReportInstanceStatusReq 上报任务状态请求。
// DataTypeConfig 数据类型配置。
message DataTypeConfig {
  int32 id = 1;
  string data_type = 2;
  string type_name = 3;
  string type_desc = 4;
  google.protobuf.Struct data_source_options = 5;
  int32 sort_order = 6;
  int32 version = 7;
  string create_time = 8;          // RFC3339
  string modify_time = 9;          // RFC3339
}

// DataTypeFieldConfig 字段配置。
message DataTypeFieldConfig {
  int32 id = 1;
  string data_type = 2;
  string field_key = 3;
  string field_name = 4;
  string field_type = 5;
  bool is_required = 6;
  google.protobuf.Value default_value = 7;
  google.protobuf.Struct field_options = 8;
  google.protobuf.Struct data_source_options = 9;
  int32 sort_order = 10;
  string create_time = 11;         // RFC3339
  string modify_time = 12;         // RFC3339
}

// DataTypeConfigDetail 数据类型配置详情（含字段）。
message DataTypeConfigDetail {
  DataTypeConfig config = 1;
  repeated DataTypeFieldConfig fields = 2;
}

message GetDataTypeConfigsReq {}

message GetDataTypeConfigsRsp {
  common.RetInfo ret_info = 1;
  repeated DataTypeConfig configs = 2;
}

message GetDataTypeConfigWithFieldsReq {
  string data_type = 1;
}

message GetDataTypeConfigWithFieldsRsp {
  common.RetInfo ret_info = 1;
  DataTypeConfigDetail detail = 2;
}

message StartKlineResampleBackfillReq {
  string space_id = 1;
  string task_id = 2;
  string request_id = 3;
  string start = 4;
  string end = 5;
}

message StartKlineResampleBackfillRsp {
  common.RetInfo ret_info = 1;
}

message CancelKlineResampleBackfillReq {
  string space_id = 1;
  string task_id = 2;
  string request_id = 3;
}

message CancelKlineResampleBackfillRsp {
  common.RetInfo ret_info = 1;
}

message GetKlineResampleBackfillReq {
  string space_id = 1;
  string task_id = 2;
  string request_id = 3;
}

message GetKlineResampleBackfillRsp {
  common.RetInfo ret_info = 1;
  string request_id = 2;
  string start = 3;
  string end = 4;
  string next_bucket = 5;
  string state = 6;
  uint64 participants = 7;
  uint64 running = 8;
  uint64 waiting_source = 9;
  uint64 syncing = 10;
  uint64 complete = 11;
  uint64 failed = 12;
  repeated string errors = 13;
  uint64 canceled = 14;
}

service CollectMgr {
  // ----- 采集任务 -----
  rpc GetTaskList(GetTaskListReq) returns (GetTaskListRsp);
  rpc GetTaskDetail(GetTaskDetailReq) returns (GetTaskDetailRsp);
  rpc CreateTask(CreateTaskReq) returns (CreateTaskRsp);
  rpc UpdateTask(UpdateTaskReq) returns (UpdateTaskRsp);
  rpc DisableTask(DisableTaskReq) returns (DisableTaskRsp);
  rpc DeleteTask(DeleteTaskReq) returns (DeleteTaskRsp);

  // ----- 任务实例 -----
  rpc GetTaskInstanceList(GetTaskInstanceListReq) returns (GetTaskInstanceListRsp);

  // ----- 数据类型配置 -----
  rpc GetDataTypeConfigs(GetDataTypeConfigsReq) returns (GetDataTypeConfigsRsp);
  rpc GetDataTypeConfigWithFields(GetDataTypeConfigWithFieldsReq) returns (GetDataTypeConfigWithFieldsRsp);
  rpc StartKlineResampleBackfill(StartKlineResampleBackfillReq) returns (StartKlineResampleBackfillRsp);
  rpc CancelKlineResampleBackfill(CancelKlineResampleBackfillReq) returns (CancelKlineResampleBackfillRsp);
  rpc GetKlineResampleBackfill(GetKlineResampleBackfillReq) returns (GetKlineResampleBackfillRsp);
}
