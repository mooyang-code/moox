syntax = "proto3";

package trpc.moox.collector;

import "moox_common.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/mooyang-code/moox/modules/collector/proto/collectorgen;collectorpb";

// CollectMgr 管理采集任务、采集计划、K 线检查与补采。
// 纯 RPC 服务，由统一 HTTP 转发层调度：
//   - /api/admin/collectmgr/{method}（JWT，面向前端）
//
// 响应设计参考 storage/access：每个响应首字段 common.RetInfo（code/msg），
// code=SUCCESS(0) 表示成功，非 0 均为错误码；网关直接返回 PB JSON 不加工。
//
// space_id 由请求参数显式传入；服务端按 space_id 做租户隔离。

// CollectionTask 是用户可见的采集任务。
message CollectionTask {
  string space_id = 1;
  string task_id = 2;
  string task_name = 3;
  string description = 4;
  string data_type = 5;
  repeated string tag_ids = 6;
  google.protobuf.Struct collect_params = 7;
  optional bool enabled = 8;
  string creator = 9;
  string create_time = 10;    // RFC3339
  string modify_time = 11;    // RFC3339
  string definition_hash = 12;
  string prepare_state = 13;  // pending/waiting_view/ready/error
  string last_error = 14;
  TaskResult result = 15;
}

// TaskResult 是采集任务唯一结果的用户可读摘要。
message TaskResult {
  string result_name = 1;
  string view_id = 2;
  string status = 3;
  string last_data_time = 4;
  string data_kind = 5;
  string coverage_start = 6;
  string coverage_end = 7;
}

// ResultConfig 是结果存储的高级配置，不允许指定既有结果。
message ResultConfig {
  string data_node_id = 1;
  string description = 3;
}

message GetTaskListReq {
  string space_id = 1;
  string data_type = 2;
  optional bool enabled = 4;
  string task_id = 5;
  common.Page page = 6;
}

message GetTaskListRsp {
  common.RetInfo ret_info = 1;
  repeated CollectionTask tasks = 2;
  common.PageResult page = 3;
}

message GetTaskDetailReq {
  string space_id = 1;
  string task_id = 2;
}

message GetTaskDetailRsp {
  common.RetInfo ret_info = 1;
  CollectionTask task = 2;
}

// TaskResultInventoryEntry is one task-owned K-line result in an authoritative
// inventory snapshot. Deleted tasks are represented by their absence from a
// newer complete snapshot; disabled tasks remain present with enabled=false.
message TaskResultInventoryEntry {
  string space_id = 1;
  string task_id = 2;
  string dataset_id = 3;
  string view_id = 4;
  string frequency = 5;
  string market_id = 6;
  string calendar_id = 7;
  string timezone = 8;
  repeated string sessions = 9;
  string latest_completed_period = 10; // RFC3339; complete or degraded
  string latest_completed_status = 11;
  string view_last_data_time = 12; // RFC3339 when Storage provides one
  string observed_at = 13; // RFC3339 metadata observation time
  bool enabled = 14;
  bool ownership_verified = 15;
  string result_status = 16; // ready/pending/error
  // Canary candidate fields are populated only when the current task series
  // set is proven to contain exactly one row and both result identities are
  // owned by this task. Otherwise availability stays false and these fields
  // remain empty/default.
  bool canary_candidate_available = 17;
  string subject_id = 18;
  string provider_symbol = 19;
  string provider = 20;
  string source_id = 21;
  string market_type = 22;
  string series_tag = 23;
  uint32 series_index = 24;
  string series_hash = 25;
  uint32 expected_count = 26;
  repeated string output_fields = 27;
  // allowed_lateness_seconds 是该结果数据集周期的允许迟到时间；Monitor 据此判断新鲜度。
  int32 allowed_lateness_seconds = 28;
}

message GetTaskResultInventoryReq {
  common.Page page = 1;
  // Empty on page one creates a snapshot. Subsequent pages must echo the
  // returned ID so a concurrent task change cannot silently mix snapshots.
  string snapshot_id = 2;
  // Inventory snapshots and page tokens are scoped to this Space. Admin
  // Gateway also checks this field against the authenticated X-Space-Id.
  string space_id = 3;
}

message GetTaskResultInventoryRsp {
  common.RetInfo ret_info = 1;
  repeated TaskResultInventoryEntry entries = 2;
  common.PageResult page = 3;
  string snapshot_id = 4;
  string observed_at = 5;
}

message CreateTaskReq {
  CollectionTask task = 1;
  ResultConfig result_config = 2;
}

message CreateTaskRsp {
  common.RetInfo ret_info = 1;
  string task_id = 2;
}

message UpdateTaskReq {
  string space_id = 1;
  string task_id = 2;
  CollectionTask task = 3;
  ResultConfig result_config = 4;
}

message UpdateTaskRsp {
  common.RetInfo ret_info = 1;
  CollectionTask task = 2;
}

message DisableTaskReq {
  string space_id = 1;
  string task_id = 2;
}

message DisableTaskRsp {
  common.RetInfo ret_info = 1;
}

message DeleteTaskReq {
  string space_id = 1;
  string task_id = 2;
  bool delete_result_data = 3;
}

message DeleteTaskRsp {
  common.RetInfo ret_info = 1;
}

// DataTypeConfig 数据类型配置。
message DataTypeConfig {
  int32 id = 1;
  string data_type = 2;
  string type_name = 3;
  string type_desc = 4;
  google.protobuf.Struct data_source_options = 5;
  int32 sort_order = 6;
  int32 version = 7;
  string create_time = 8;          // RFC3339
  string modify_time = 9;          // RFC3339
}

// DataTypeFieldConfig 字段配置。
message DataTypeFieldConfig {
  int32 id = 1;
  string data_type = 2;
  string field_key = 3;
  string field_name = 4;
  string field_type = 5;
  bool is_required = 6;
  google.protobuf.Value default_value = 7;
  google.protobuf.Struct field_options = 8;
  google.protobuf.Struct data_source_options = 9;
  int32 sort_order = 10;
  string create_time = 11;         // RFC3339
  string modify_time = 12;         // RFC3339
}

// DataTypeConfigDetail 数据类型配置详情（含字段）。
message DataTypeConfigDetail {
  DataTypeConfig config = 1;
  repeated DataTypeFieldConfig fields = 2;
}

message GetDataTypeConfigsReq {}

message GetDataTypeConfigsRsp {
  common.RetInfo ret_info = 1;
  repeated DataTypeConfig configs = 2;
}

message GetDataTypeConfigWithFieldsReq {
  string data_type = 1;
}

message GetDataTypeConfigWithFieldsRsp {
  common.RetInfo ret_info = 1;
  DataTypeConfigDetail detail = 2;
}

message StartKlineResampleBackfillReq {
  string space_id = 1;
  string task_id = 2;
  string request_id = 3;
  string start = 4;
  string end = 5;
}

message StartKlineResampleBackfillRsp {
  common.RetInfo ret_info = 1;
}

message CancelKlineResampleBackfillReq {
  string space_id = 1;
  string task_id = 2;
  string request_id = 3;
}

message CancelKlineResampleBackfillRsp {
  common.RetInfo ret_info = 1;
}

message GetKlineResampleBackfillReq {
  string space_id = 1;
  string task_id = 2;
  string request_id = 3;
}

message GetKlineResampleBackfillRsp {
  common.RetInfo ret_info = 1;
  string request_id = 2;
  string start = 3;
  string end = 4;
  string next_bucket = 5;
  string state = 6;
  uint64 participants = 7;
  uint64 running = 8;
  uint64 waiting_source = 9;
  uint64 syncing = 10;
  uint64 complete = 11;
  uint64 failed = 12;
  repeated string errors = 13;
  uint64 canceled = 14;
}

message SyncSubjectsReq {
  // 为空表示所有空间。
  string space_id = 1;
  // 为空表示所选空间内的所有标签；指定时必须同时指定 space_id。
  string tag_id = 2;
  // 同时刷新标的属性（忽略各任务的 cron 窗口）。
  bool include_attributes = 3;
}

message SubjectTagSyncResult {
  string space_id = 1;
  string tag_id = 2;
  // success / failed / skipped（非自动同步的标签）。
  string status = 3;
  uint32 subjects = 4;
  // failed / skipped 时的原因。
  string message = 5;
}

message SubjectAttributeSyncResult {
  string space_id = 1;
  string status = 2;
  string message = 3;
}

message SyncSubjectsRsp {
  common.RetInfo ret_info = 1;
  repeated SubjectTagSyncResult tags = 2;
  repeated SubjectAttributeSyncResult attributes = 3;
}

// ===== K 线完整性检查与补采 =====

message CheckKlineReq {
  string space_id = 1;
  string dataset_id = 2;
  string subject_id = 3;
  // from 含、to 不含，RFC3339。
  string from = 4;
  string to = 5;
  // deep 为 true 时额外校验每根 K 线的字段齐全。
  bool deep = 6;
}

message KlineGap {
  string dataset_id = 1;
  string frequency = 2;
  string subject_id = 3;
  string from = 4;
  // to 是缺失区间的右开端点。
  string to = 5;
  int32 missing = 6;
}

message CheckKlineRsp {
  common.RetInfo ret_info = 1;
  repeated KlineGap gaps = 2;
  int32 expected = 3;
  int32 missing = 4;
  bool truncated = 5;
  // absent 是已扣除的、确认行情源没有的根数，不计入 missing。
  int32 absent = 6;
}

message SubmitKlineBackfillReq {
  string space_id = 1;
  string dataset_id = 2;
  string subject_id = 3;
  string from = 4;
  string to = 5;
  // force 为 true 时不检查缺口，范围内应有的 K 线全部重拉。
  bool force = 6;
}

message SubmitKlineBackfillRsp {
  common.RetInfo ret_info = 1;
  // job_id 为空表示范围内没有缺口。
  string job_id = 2;
  int32 chunks = 3;
}

message KlineBackfillChunk {
  string dataset_id = 1;
  string frequency = 2;
  string subject_id = 3;
  string from = 4;
  string to = 5;
  string status = 6;
  int32 attempts = 7;
  string last_error = 8;
  int32 rows = 9;
  // dataset_name 是数据集的展示名（所属采集任务名），任务已删除时为空。
  string dataset_name = 10;
}

message KlineBackfillJob {
  string job_id = 1;
  string space_id = 2;
  // source 取值 manual、auto；kind 取值 gap（按缺口）、force（整段重拉）、history（确认历史缺口）。
  string source = 3;
  string kind = 4;
  // dataset_id、frequency、subject_id 为空表示全部。
  string dataset_id = 5;
  string frequency = 6;
  string subject_id = 7;
  string from = 8;
  string to = 9;
  string status = 10;
  string last_error = 11;
  string created_at = 12;
  string updated_at = 13;
  int32 pending = 14;
  int32 running = 15;
  int32 succeeded = 16;
  int32 failed = 17;
  int32 canceled = 18;
  // dataset_name 是数据集的展示名（所属采集任务名），不限数据集或任务已删除时为空。
  string dataset_name = 19;
}

message GetKlineBackfillReq {
  string job_id = 1;
  string space_id = 2;
}

message GetKlineBackfillRsp {
  common.RetInfo ret_info = 1;
  KlineBackfillJob job = 2;
  // failed_chunks 至多 50 个。
  repeated KlineBackfillChunk failed_chunks = 3;
}

message ListKlineBackfillsReq {
  string space_id = 1;
  common.Page page = 2;
  // source 为空表示全部来源；attention 只返回未结束或有失败的作业；dataset_id 包含不限数据集的作业。
  string source = 3;
  bool attention = 4;
  string dataset_id = 5;
}

message ListKlineBackfillsRsp {
  common.RetInfo ret_info = 1;
  repeated KlineBackfillJob items = 2;
  common.PageResult page = 3;
}

message CancelKlineBackfillReq {
  string job_id = 1;
  string space_id = 2;
}

message CancelKlineBackfillRsp {
  common.RetInfo ret_info = 1;
}

// RetryKlineBackfill 把已失败作业的失败分块退回待执行（尝试次数清零），作业改回等待中。
message RetryKlineBackfillReq {
  string job_id = 1;
  string space_id = 2;
}

message RetryKlineBackfillRsp {
  common.RetInfo ret_info = 1;
  int32 chunks = 2;
}

// ConfirmHistoryGaps 按最近一次历史扫描记下的缺口建立补采作业；补完后行情源没有的部分自动确认，不再报告。
message ConfirmHistoryGapsReq {
  string space_id = 1;
  string dataset_id = 2;
  string frequency = 3;
}

message ConfirmHistoryGapsRsp {
  common.RetInfo ret_info = 1;
  // job_id 为空表示没有待确认的历史缺口。
  string job_id = 2;
  int32 chunks = 3;
}

// ClearSourceAbsences 清掉一个数据集已确认的“行情源缺失”，并让历史缺口扫描重新进行。
message ClearSourceAbsencesReq {
  string space_id = 1;
  string dataset_id = 2;
  string frequency = 3;
}

message ClearSourceAbsencesRsp {
  common.RetInfo ret_info = 1;
  // cleared 是清掉的缺失区间数。
  int64 cleared = 2;
}

// ===== 运行状态 =====

message GetCollectorStatusReq {
  string space_id = 1;
}

message FetchPlanSummary {
  int64 id = 1;
  string status = 2;
  string last_error = 3;
  string created_at = 4;
  string updated_at = 5;
}

// CollectorDatasetStatus 是一个正在采集的数据集（某个频率）的健康度。
message CollectorDatasetStatus {
  string dataset_id = 1;
  string frequency = 2;
  int32 subject_count = 3;
  int32 function_count = 4;
  // effective_from 是最早一次采集计划生效的周期；inspected_until 是自动巡检已查到的时间（不含），没有巡检过为空。
  string effective_from = 5;
  string inspected_until = 6;
  // inspect_lag_seconds 是自动巡检超出预期的秒数：水位之后的下一根 K 线进入巡检范围后仍未被检查的时长。
  // 它衡量的是“自动补漏是否跟上”，不是数据本身的延迟；正常在 0 到几分钟之间。
  int64 inspect_lag_seconds = 7;
  // gap_bars_24h、gap_subjects_24h 是 24 小时内自动补采发现的实时缺口（实时采集漏掉的 K 线）。
  int32 gap_bars_24h = 8;
  int32 gap_subjects_24h = 9;
  int32 failed_chunks_24h = 10;
  // history_* 是最近一次历史缺口扫描的结果（扣除已确认缺失）；没有扫描过时 history_scanned_at 为空。
  string history_scanned_at = 11;
  int32 history_gap_bars = 12;
  int32 history_gap_subjects = 13;
  string history_error = 14;
  // absent_bars 是已确认行情源没有的根数，不影响健康等级。
  int32 absent_bars = 15;
  // level 取值 ok、warn、error。
  string level = 16;
  repeated string reasons = 17;
  // dataset_name 是数据集的展示名（所属采集任务名），任务已删除时为空。
  string dataset_name = 18;
}

// CollectorFunctionDataset 是函数在一个数据集上负责的标的（取当前生效的那份快照）。
message CollectorFunctionDataset {
  // dataset 是“数据集|频率”。
  string dataset = 1;
  repeated string subjects = 2;
  // effective_from 是这份快照的生效周期（RFC3339）。
  string effective_from = 3;
}

message CollectorFunctionStatus {
  string name = 1;
  string region = 2;
  string market = 3;
  string cron = 4;
  int32 subject_count = 5;
  // datasets 是该函数服务的“数据集|频率”。
  repeated string datasets = 6;
  // state 取值 applied（已生效）、pending（正在下发）、retiring（退役中）。
  string state = 7;
  // dataset_subjects 是每个数据集上本函数负责的标的，供详情查看。
  repeated CollectorFunctionDataset dataset_subjects = 8;
}

message GetCollectorStatusRsp {
  common.RetInfo ret_info = 1;
  // level 是空间总体健康等级（ok、warn、error），reasons 是计划层面与各数据集的问题。
  string level = 2;
  repeated string reasons = 3;
  // open 是未生效的计划，没有则为空；applied 是最近一份已生效的计划。
  FetchPlanSummary open = 4;
  FetchPlanSummary applied = 5;
  // datasets 异常排前；functions 下发中的排前。
  repeated CollectorDatasetStatus datasets = 6;
  repeated CollectorFunctionStatus functions = 7;
  int32 active_backfills = 8;
  int32 failed_backfills_24h = 9;
  string generated_at = 10;
  // stream 是该空间 collector-stream 实例的状态（心跳、连接、最近周期），没有实例时为空。
  StreamWorkerStatus stream = 11;
  // ingest_modes 是各数据集的采集方式与执行端。
  repeated IngestMode ingest_modes = 12;
}

// ReregisterFetchPlan 在 Storage 数据被清空后让采集计划重新生效：把最近一份已生效计划里各数据集标记为
// “快照未登记”，下一轮对账会生成新计划、重新登记序列快照并选新的生效周期；同时清掉该空间的补采作业、
// 自动补采水位与历史扫描记录。此后数据集的时间线（检查、自动补采与历史扫描的范围）从新的生效周期开始，
// 清库前的计划段不再参与。
message ReregisterFetchPlanReq {
  string space_id = 1;
}

// SetFetchPlanPaused 暂停或恢复空间的采集：暂停时 Collector 停用该空间全部 SCF 函数的定时器，并停止采集计划对账、
// 补采推进与自动补采扫描；暂停状态保存在 Collector 库里，重启后保持。相同取值重复调用不改变状态，只返回当前状态，
// 可用来轮询 timers_disabled。停用定时器只保证不再触发新的采集调用，已经触发、仍在执行的调用不在其内，
// 调用方还需要再等过 SCF 函数的执行超时。
message SetFetchPlanPausedReq {
  string space_id = 1;
  bool paused = 2;
}

message SetFetchPlanPausedRsp {
  common.RetInfo ret_info = 1;
  bool paused = 2;
  // timers_disabled 表示云端已确认该空间全部函数的定时器已停用（未暂停时恒为 false）。
  bool timers_disabled = 3;
}

message ReregisterFetchPlanRsp {
  common.RetInfo ret_info = 1;
  // datasets 是被标记为需要重新登记快照的“数据集|频率”。
  repeated string datasets = 2;
  // backfill_jobs 是被清掉的补采作业数。
  int32 backfill_jobs = 3;
}

// ===== 采集方式（按数据集）与 WS 推送采集 =====

// IngestMode 是一个数据集的采集方式：stream（WS 推送）或 pull（定时拉取）；executor 是拉取与补采的执行端（scf 或 local）。
message IngestMode {
  string space_id = 1;
  string dataset_id = 2;
  string mode = 3;
  string executor = 4;
  string updated_at = 5;
  // effective_periods 是正在交接的数据集按频率选定的生效周期 P（RFC3339，K 线开始时间），没有交接时为空。
  map<string, string> effective_periods = 6;
}

message GetIngestModeReq {
  string space_id = 1;
  // dataset_id 为空表示该空间全部数据集。
  string dataset_id = 2;
}

message GetIngestModeRsp {
  common.RetInfo ret_info = 1;
  repeated IngestMode modes = 2;
  StreamWorkerStatus stream = 3;
}

// SetIngestMode 按数据集切换采集方式：dataset_id 为空表示 space_id 的全部数据集。切到 stream 要求 collector-stream 在线；
// force 用于旧执行端失联的极端故障：不等旧执行端确认，已打开的计划也不再等失联端确认。
message SetIngestModeReq {
  string space_id = 1;
  string dataset_id = 2;
  string mode = 3;
  // executor 为空时：stream 保持原执行端（补采用），pull 默认 scf。
  string executor = 4;
  bool force = 5;
}

message SetIngestModeRsp {
  common.RetInfo ret_info = 1;
  repeated IngestMode modes = 2;
  StreamWorkerStatus stream = 3;
  // plan_id 是本次切换生成的采集计划（交接），0 表示没有需要交接的数据集。
  int64 plan_id = 4;
}

// StreamConnStatus 是 collector-stream 一条 WS 连接的状态。
message StreamConnStatus {
  string market = 1;
  string frequency = 2;
  int32 streams = 3;
  string last_message_at = 4;
  int64 reconnects = 5;
  bool subscribed = 6;
  string endpoint = 7;
}

// StreamPeriodStat 是一个（数据集, 周期）的接收与提交统计；时间都是相对收盘的毫秒数。
message StreamPeriodStat {
  string market = 1;
  string dataset_id = 2;
  string frequency = 3;
  // period 是 K 线开始时间（Unix 秒）。
  int64 period = 4;
  int32 expected = 5;
  int32 arrived = 6;
  // missing 是截止时仍缺的标的数（疑似下架的标的另计在 suspected 里）。
  int32 missing = 7;
  int32 late_after_commit = 8;
  int64 last_arrival_ms = 9;
  int64 commit_done_ms = 10;
  int64 commit_ms = 11;
  bool committed = 12;
  string error = 13;
  int32 suspected = 14;
}

message StreamWorkerStatus {
  string instance_id = 1;
  bool online = 2;
  string heartbeat_at = 3;
  int64 applied_plan_id = 4;
  string applied_stage = 5;
  repeated StreamConnStatus conns = 6;
  repeated StreamPeriodStat recent = 7;
  // clock_offset_ms 是实例时钟减 Collector 时钟的估计值。
  int64 clock_offset_ms = 8;
  string version = 9;
}

message StreamHeartbeatReq {
  string space_id = 1;
  string instance_id = 2;
  // applied_plan_id 与 applied_stage 是实例已应用的计划记录与阶段（transition、final）。
  int64 applied_plan_id = 3;
  string applied_stage = 4;
  repeated StreamConnStatus conns = 5;
  int64 sent_at_ms = 6;
  string version = 7;
}

message StreamHeartbeatRsp {
  common.RetInfo ret_info = 1;
  // plan_id 与 stage 是 Collector 当前要求推送与本地执行端应用的计划版本。
  int64 plan_id = 2;
  string stage = 3;
  int64 server_time_ms = 4;
}

// StreamPlanItem 是计划内容里分给推送或本地执行端的一项（一个市场），plan_json 是 marketfetch.Plan 的 JSON。
message StreamPlanItem {
  string name = 1;
  string executor = 2;
  string market = 3;
  string plan_json = 4;
}

message PullStreamPlanReq {
  string space_id = 1;
  // market 为空表示该空间全部市场。
  string market = 2;
}

message PullStreamPlanRsp {
  common.RetInfo ret_info = 1;
  int64 plan_id = 2;
  string stage = 3;
  repeated StreamPlanItem items = 4;
  // commit_reserve_ms 是周期闸门的提交预留：最晚开始提交 = 收盘 + 截止 − 预留。
  int32 commit_reserve_ms = 5;
}

// StreamSuspect 是推送侧疑似下架的标的。
message StreamSuspect {
  string market = 1;
  string subject_id = 2;
  string reason = 3;
}

message ReportStreamPeriodsReq {
  string space_id = 1;
  string instance_id = 2;
  repeated StreamPeriodStat periods = 3;
  repeated StreamSuspect suspects = 4;
}

message ReportStreamPeriodsRsp {
  common.RetInfo ret_info = 1;
}

// InvokeMarketFetchReq 的 event 是与 SCF 函数相同的事件 JSON；响应是同样的 model.Response JSON。
message InvokeMarketFetchReq {
  string space_id = 1;
  bytes event = 2;
}

message InvokeMarketFetchRsp {
  common.RetInfo ret_info = 1;
  bytes response = 2;
}

// StreamCollector 是 collector-stream 与 Collector 之间的计划同步与统计上报。
service StreamCollector {
  rpc StreamHeartbeat(StreamHeartbeatReq) returns (StreamHeartbeatRsp);
  rpc PullStreamPlan(PullStreamPlanReq) returns (PullStreamPlanRsp);
  rpc ReportStreamPeriods(ReportStreamPeriodsReq) returns (ReportStreamPeriodsRsp);
}

// MarketFetchExecutor 是拉取与补采的本地执行端（挂在 collector-stream 进程里），处理代码与 SCF 函数相同。
service MarketFetchExecutor {
  rpc Invoke(InvokeMarketFetchReq) returns (InvokeMarketFetchRsp);
}

service CollectMgr {
  // ----- 采集任务 -----
  rpc GetTaskList(GetTaskListReq) returns (GetTaskListRsp);
  rpc GetTaskDetail(GetTaskDetailReq) returns (GetTaskDetailRsp);
  rpc GetTaskResultInventory(GetTaskResultInventoryReq) returns (GetTaskResultInventoryRsp);
  rpc CreateTask(CreateTaskReq) returns (CreateTaskRsp);
  rpc UpdateTask(UpdateTaskReq) returns (UpdateTaskRsp);
  rpc DisableTask(DisableTaskReq) returns (DisableTaskRsp);
  rpc DeleteTask(DeleteTaskReq) returns (DeleteTaskRsp);

  // ----- 数据类型配置 -----
  rpc GetDataTypeConfigs(GetDataTypeConfigsReq) returns (GetDataTypeConfigsRsp);
  rpc GetDataTypeConfigWithFields(GetDataTypeConfigWithFieldsReq) returns (GetDataTypeConfigWithFieldsRsp);
  rpc StartKlineResampleBackfill(StartKlineResampleBackfillReq) returns (StartKlineResampleBackfillRsp);
  rpc CancelKlineResampleBackfill(CancelKlineResampleBackfillReq) returns (CancelKlineResampleBackfillRsp);
  rpc GetKlineResampleBackfill(GetKlineResampleBackfillReq) returns (GetKlineResampleBackfillRsp);
  // 立即同步币安/东财的标的标签成员（及可选的标的属性），不等整点定时任务。
  rpc SyncSubjects(SyncSubjectsReq) returns (SyncSubjectsRsp);

  // ----- K 线完整性检查与补采 -----
  rpc CheckKline(CheckKlineReq) returns (CheckKlineRsp);
  rpc SubmitKlineBackfill(SubmitKlineBackfillReq) returns (SubmitKlineBackfillRsp);
  rpc GetKlineBackfill(GetKlineBackfillReq) returns (GetKlineBackfillRsp);
  rpc ListKlineBackfills(ListKlineBackfillsReq) returns (ListKlineBackfillsRsp);
  rpc CancelKlineBackfill(CancelKlineBackfillReq) returns (CancelKlineBackfillRsp);
  rpc RetryKlineBackfill(RetryKlineBackfillReq) returns (RetryKlineBackfillRsp);
  rpc ConfirmHistoryGaps(ConfirmHistoryGapsReq) returns (ConfirmHistoryGapsRsp);
  rpc ClearSourceAbsences(ClearSourceAbsencesReq) returns (ClearSourceAbsencesRsp);

  // ----- 运行状态与采集计划 -----
  rpc GetCollectorStatus(GetCollectorStatusReq) returns (GetCollectorStatusRsp);
  rpc ReregisterFetchPlan(ReregisterFetchPlanReq) returns (ReregisterFetchPlanRsp);
  rpc SetFetchPlanPaused(SetFetchPlanPausedReq) returns (SetFetchPlanPausedRsp);
  rpc GetIngestMode(GetIngestModeReq) returns (GetIngestModeRsp);
  rpc SetIngestMode(SetIngestModeReq) returns (SetIngestModeRsp);
}
