# Binance source configuration used by collector runtime.
# Strictly decoded Binance source configuration.
app:
  id: "binance"
  name: "加密交易所"
  description: "加密现货/永续合约 K 线与标的采集"
  type: "market"

api:
  spot_base_urls:
    - "https://api.binance.com"
    - "https://api-gcp.binance.com"
    - "https://data-api.binance.vision"
  swap_base_urls:
    - "https://fapi.binance.com"

# WS 推送（collector-stream）：现货 kline、合约连续合约 K 线（只在 /market 路由）。
stream:
  spot_endpoints:
    - "wss://stream.binance.com:9443/stream"
    - "wss://stream.binance.com:443/stream"
  swap_endpoints:
    - "wss://fstream.binance.com/market/stream"
  streams_per_conn: 1000
  streams_per_message: 100
  messages_per_second: 5
  max_conn_age_hours: 24

storage:
  bindings:
    spot:
      data_source_id: "binance"
      subject_type: "crypto_pair"
      subject_market: "spot"
      auth_info:
        app_id: "moox-collector"
        app_key: "binance-spot-collector"
    swap:
      data_source_id: "binance"
      subject_type: "crypto_pair"
      subject_market: "swap"
      auth_info:
        app_id: "moox-collector"
        app_key: "binance-swap-collector"
