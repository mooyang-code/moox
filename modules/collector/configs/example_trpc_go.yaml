global: #全局配置
  namespace: Production            #环境类型，分正式production和非正式development两种类型
  env_name: dev                    #环境名称，非正式环境下多环境的名称

server:
  timeout: 5000
  service:
    - name: trpc.moox.collector.schedule.timer
      port: 11403
      network: "20 */1 * * * *?scheduler=collectorSchedule"
      protocol: timer
      timeout: 60000

plugins:
  log:
    default:
      - writer: console
        level: info
