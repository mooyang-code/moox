# Binance source configuration used by the unified market_data runtime.
app:
  id: "binance"
  name: "币安交易所"
  description: "币安现货/合约 K 线与标的采集"
  type: "market"

api:
  base_url: "https://data-api.binance.vision"
  spot_base_url: "https://data-api.binance.vision"
  swap_base_url: "https://fapi.binance.com"

storage:
  bindings:
    spot:
      data_source_id: "binance"
      subject_type: "crypto_pair"
      subject_market: "spot"
      auth_info:
        app_id: "moox-collector"
        app_key: "binance-spot-collector"
    swap:
      data_source_id: "binance"
      subject_type: "crypto_pair"
      subject_market: "swap"
      auth_info:
        app_id: "moox-collector"
        app_key: "binance-swap-collector"
