# Binance source configuration used by the unified market_data runtime.
app:
  id: "binance"
  name: "加密交易所"
  description: "加密现货/永续合约 K 线与标的采集"
  type: "market"

api:
  base_url: "https://api.binance.com"
  # 现货只配 3 个出口各不相同的官方端点，按顺序故障转移（2026-10-20 在香港实测都可用）：
  #   api.binance.com        CloudFront 边缘节点（香港就近，建连约 2ms，首字节约 110ms）
  #   api-gcp.binance.com    Google Cloud 负载均衡（香港就近，同量级）
  #   data-api.binance.vision AWS 东京直连（仅公开行情，首字节约 250ms）
  # api1～api4 与 data-api 同为 AWS 东京直连，不算独立出口，已去掉。
  # 合约只有 fapi.binance.com 一个可用端点：fapi1～fapi4（以及任意 fapiN）只是重定向到 www.binance.com 的通配域名，不提供 API。
  spot_base_urls:
    - "https://api.binance.com"
    - "https://api-gcp.binance.com"
    - "https://data-api.binance.vision"
  swap_base_urls:
    - "https://fapi.binance.com"

storage:
  bindings:
    spot:
      data_source_id: "binance"
      subject_type: "crypto_pair"
      subject_market: "spot"
      auth_info:
        app_id: "moox-collector"
        app_key: ""
    swap:
      data_source_id: "binance"
      subject_type: "crypto_pair"
      subject_market: "swap"
      auth_info:
        app_id: "moox-collector"
        app_key: ""
