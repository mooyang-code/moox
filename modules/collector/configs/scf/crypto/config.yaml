# Crypto-space SCF runtime configuration. This directory is packaged only for
# the crypto collector fleet; other spaces must provide their own sibling tree.
system:
  name: "moox-collector-crypto"
  version: "v0.0.3"
  environment: "Production"
  timezone: "UTC"
  storage_rpc:
    gateway_target: "ip://127.0.0.1:11003"
    gateway_node_id: ""
    key_id: "collector"
    hmac_key_file: ""
  service_auth:
    target_node: ""
    ca_file: ""
    access_key: "moox-service"
    secret_key: ""
    expire_seconds: 60

event_bus:
  type: "memory"
  buffer_size: 10000
  workers: 10
  config:
    redis:
      addr: "localhost:6379"
      db: 0

dnsproxy:
  dns_servers:
    - "8.8.8.8"
    - "1.1.1.1"
    - "localhost"
  dns_timeout: 5
  concurrent_limit: 10
  scheduled_domains:
    - "api.binance.com"
    - "fapi.binance.com"
  probe_configs:
    - domain: "api.binance.com"
      probe_type: "https"
      probe_api:
        path: "/api/v3/time"
        method: "GET"
        timeout: 3
        expected_status: 200
    - domain: "fapi.binance.com"
      probe_type: "https"
      probe_api:
        path: "/fapi/v1/ping"
        method: "GET"
        timeout: 3
        expected_status: 200

sources:
  market:
    - name: "binance"
      enabled: true
      config: "configs/sources/market/binance.yaml"
