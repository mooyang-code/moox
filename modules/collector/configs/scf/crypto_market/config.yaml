system:
  name: "moox-collector-crypto-market"
  version: "v0.0.4"
  environment: "Production"
  timezone: "UTC"
  storage_rpc:
    gateway_target: "ip://127.0.0.1:11003"
    gateway_node_id: ""
    key_id: "collector"
    hmac_key_file: ""
  service_auth:
    target_node: ""
    ca_file: ""
    access_key: "moox-service"
    secret_key: ""
    expire_seconds: 60
sources:
  market:
    - name: "binance"
      enabled: true
      config: "configs/sources/market/binance.yaml"
