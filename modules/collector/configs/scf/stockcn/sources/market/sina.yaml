provider:
  id: sina
  market: stockcn
  enabled_feeds: [kline, instrument]
  hosts: [quotes.sina.cn, vip.stock.finance.sina.com.cn]
  kline:
    max_bars_per_request: 1023
    volume_unit: shares
    amount_unit: CNY
  rate_limit:
    scope: egress_ip
    # 2026-11-06 南京实测单个出口 IP 512 并发突发、每秒 640 次持续（各 3840 次）都是 100% 成功，没有触顶；
    # 每个函数每源最多约 20 只，按“整批同时放出”设置，远低于实测。
    requests_per_second: 50
    burst: 20
    max_concurrent: 16
    cooldown: 1s
    request_timeout: 5s
