provider:
  id: sina
  market: stockcn
  enabled_feeds: [kline, instrument]
  hosts: [quotes.sina.cn, vip.stock.finance.sina.com.cn]
  kline:
    max_bars_per_request: 1023
    volume_unit: shares
    amount_unit: CNY
  rate_limit:
    scope: egress_ip
    # 2026-11-06 南京实测单个出口 IP 64 并发突发、每秒 80 次持续都没有触顶；每个函数每源只有约 10 只，不用再串行排队。
    requests_per_second: 20
    burst: 10
    max_concurrent: 8
    cooldown: 1s
    request_timeout: 5s
