provider:
  id: eastmoney
  market: stockcn
  enabled_feeds: [kline, instrument]
  hosts: [push2.eastmoney.com, push2his.eastmoney.com]
  kline:
    endpoint: /api/qt/stock/kline/get
    max_bars_per_request: 1205
    volume_unit: shares
    amount_unit: CNY
  rate_limit:
    scope: egress_ip
    requests_per_second: 5
    burst: 2
    max_concurrent: 1
    cooldown: 1s
    request_timeout: 5s
