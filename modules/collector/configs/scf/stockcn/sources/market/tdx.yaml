provider:
  id: tdx
  market: stockcn
  enabled_feeds: [kline]
  hosts: [shtdx.gtjas.com]
  kline:
    max_bars_per_request: 800
    volume_unit: shares
    amount_unit: CNY
  rate_limit:
    scope: egress_ip
    # 2026-11-06 南京实测单个出口 IP：256 并发突发仍 100% 成功，512 并发出现约 5% 超时/断连；每秒 160～640 次持续有 0.1～1.4% 超时。
    # 15 个函数同时起跑最坏占 15 × 8 = 120 个连接，留在 256 以内；每个函数每源约 10 只，一次放出。
    requests_per_second: 30
    burst: 10
    max_concurrent: 8
    cooldown: 1s
    request_timeout: 5s
