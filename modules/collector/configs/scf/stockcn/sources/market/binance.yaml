# A 股云函数代码包里的数据源配置。文件名和路径是固定的（函数按 sources/market/binance.yaml 读取，名字是历史沿用），
# A 股的行情源、路由、限速都编在函数二进制里（config/markets/stockcn/），这里只有出口探测用的币安端点。
app:
  id: "binance"
  name: "加密交易所"
  description: "出口探测用的币安端点"
  type: "market"

api:
  spot_base_urls:
    - "https://data-api.binance.vision"
  swap_base_urls:
    - "https://fapi.binance.com"
