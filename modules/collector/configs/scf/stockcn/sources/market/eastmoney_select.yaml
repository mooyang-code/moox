provider:
  id: eastmoney_select
  market: stockcn
  # 只提供日线的附加字段（股本、每股股利、是否 ST），不取 K 线、不进路由配置。每只股票一次请求，只有当前这一天的值。
  enabled_feeds: []
  hosts: [data.eastmoney.com]
  rate_limit:
    scope: egress_ip
    # 2026-11-12 国内实测：单次 0.24 秒；八个函数共用一个出口、并发 64 时 640 次全部成功，没有限频，最慢 6.5 秒。
    requests_per_second: 50
    burst: 20
    max_concurrent: 16
    cooldown: 1s
    request_timeout: 10s
