syntax = "proto3";

package trpc.moox.strategy;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/strategy/proto/strategygen;strategypb";

// 时刻字段（*_at、bar_end_time、valid_until、回放的起止与进度、first_bar_end、last_bar_end）都是 int64 Unix 毫秒，0 表示没有。

// Strategy 是一份策略定义：DSL 文本及其内容哈希。
message Strategy {
  string strategy_id = 1;
  string name = 2;
  string dsl_yaml = 3;
  string dsl_hash = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

// StrategyInstance 把定义绑定到一个空间、一个或多个因子任务（按市场及可选的附加来源、参考市场登记）和可选的组合账户。
// 因子任务在创建时写定、不能修改；一个任务可被多个实例引用，只有声明了 factor_params 的实例在首次启用时才与主帧任务独占关联（直到随实例删除）；
// 读取的 View 是任务结果数据集的默认 View，由任务 ID 推导。
message StrategyInstance {
  string instance_id = 1;
  string strategy_id = 2;
  string space_id = 3;
  // 市场（spot | swap | equity）→ 因子任务 ID；市场必须与任务源数据集的市场一致，且恰好是策略市场模式需要的那些市场。
  map<string, string> factor_tasks = 4;
  string logical_account_id = 5;
  bool enabled = 6;
  string session_id = 7;
  // 启用时固化的解析结果（只读）：bar、日历、市场类型、是否策略池（pool）、每列所属成员的 member_key 与契约哈希
  string resolved_json = 8;
  string health = 9;                     // ok | degraded
  int64 created_at = 10;
  int64 updated_at = 11;
  // 实例引用的、已在 Factor 里不存在的因子任务（只对停用实例检查，读不到 Factor 时留空）：可能是上次删除实例没做完，
  // 也可能是任务被另外删掉。删除实例即可清理。
  repeated string missing_factor_tasks = 12;
  // 确认实盘的时刻；0 表示试运行（挂了账户的实例启用后目标只发影子、不下单）。没挂账户的实例启用时写入；停用、修改实例都清空。
  int64 confirmed_at = 13;
  // 关联策略定义的名称（由 t_strategy_defs 带出）。
  string strategy_name = 14;
}

// InstrumentWeight 是一个标的的目标权重。
message InstrumentWeight {
  string instrument_id = 1;
  string target_weight = 2;
  string market = 3;                     // spot | swap | equity；同一个标的的现货、永续各是一个目标
}

// StrategyResult 是一个处理过的周期：ok 带目标，skipped 带原因。
message StrategyResult {
  string result_id = 1;
  string instance_id = 2;
  string session_id = 3;
  int64 bar_end_time = 4;
  int64 valid_until = 5;
  string status = 6;                     // ok | skipped
  string skip_reason = 7;
  string dsl_hash = 8;
  repeated InstrumentWeight targets = 9;
  string summary_json = 10;              // |U|、各规则 |E|、|G|、|A|、|M|、各阶段数量、gross、net、换手、现金
  string input_json = 11;                // dataset_id、bar_start、事件 ID、各因子 definition_hash
  string publish_status = 12;            // none | pending | sent | cancelled
  int64 created_at = 13;
  // 这一期算出的下一期可变成员参数（JSON：成员键 → 参数名 → {default, overrides}）；没有可变成员时为空。
  string next_params_json = 14;
  int64 params_delivered_at = 15;        // 被因子侧接受的时刻；0 表示还没送达
  string params_error = 16;              // 被因子侧明确拒绝的原因（不再重试）
}

// StrategyResultItem 是一条规则下一个标的的解释。
message StrategyResultItem {
  string rule_id = 1;
  string instrument_id = 2;
  string stage = 3;                      // aged_out | missing | filtered | scored | idle | weighted | dropped
  string score = 4;
  int32 rank = 5;
  string weight = 6;
  string reason = 7;
  string market = 8;                     // 入选的权重取它进入的市场，其余取所选行所在的市场（spot | swap | equity）
  string scale = 9;                      // 乘在输出权重上的仓位系数（weight 已乘过）；规则没写 scale 时为空
}

// ReplayTask 是研究回放在一个市场读取的因子任务及其结果数据集。
message ReplayTask {
  string factor_task_id = 1;
  string dataset_id = 2;                 // 因子任务的结果数据集
}

// Replay 是一次基于 View 的研究回放任务。
message Replay {
  string replay_id = 1;
  string strategy_id = 2;
  string dsl_yaml = 3;
  string space_id = 4;
  int64 start_time = 6;
  int64 end_time = 7;
  string status = 9;                     // queued | running | succeeded | failed | cancelled
  int64 progress_time = 10;
  string metrics_json = 11;              // 累计收益、年化、最大回撤、平均换手、平均持仓数、跳过周期数、局限性标注
  string error = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  string dsl_hash = 15;                  // 被回放的 DSL 版本
  string instance_id = 16;               // 从实例发起时的来源实例
  string session_id = 17;                // 从实例发起时固化 DSL 的会话
  string calendar = 18;                  // 回放所用的日历（crypto_24x7 | cn_stock）；cn_stock 的区间按上海日期解释
  map<string, ReplayTask> tasks = 20;    // 市场（spot | swap | equity）→ 读取的因子任务与结果 View
  double spot_fee_bps = 21;              // 现货与股票的单边手续费
  double swap_fee_bps = 22;              // 永续的单边手续费
  string funding_column = 23;            // 永续持仓结算资金费用的列（本根累计的资金费率）；空串表示不计
  double slippage_bps = 24;              // 滑点（基点）：成交价在收盘价上按方向加减这个比例
  string input = 25;                     // 主帧的输入来源：view（读结果 View）| compute（因子现算：经主机网关调因子引擎按因子机本地 K 线现算）
}

// ReplayBar 是回放中一个周期的记录。
message ReplayBar {
  int64 bar_end_time = 1;
  string status = 2;
  repeated InstrumentWeight targets = 3;
  string positions_json = 4;             // 理论持仓账本：数量、估值、现金、估值是否陈旧
  string summary_json = 5;
  double bar_return = 6;
  double equity = 7;
  double turnover = 8;
  double fee = 9;
  int32 holdings = 10;                   // 持仓数（含冻结）
  int32 frozen = 11;                     // 缺价冻结的持仓数
  string skip_reason = 12;
  int32 unfilled = 13;                   // 目标未达成的标的数
  int32 liquidated = 14;                 // 本期清算的标的数
  double spot_value = 15;                // 期末现货类持仓的市值之和
  double swap_value = 16;                // 期末永续持仓的净名义价值（多头为正，空头为负）
  string params_json = 17;               // 这一期因子实际生效的、由回放逐期提交的可变成员参数（成员键 → 参数名 → {default, overrides}）；只有因子现算的调参策略有内容，其余为 {}；brief 时为 {}
}

message CreateStrategyReq { Strategy strategy = 1; }
message CreateStrategyRsp { common.RetInfo ret_info = 1; Strategy strategy = 2; }
message UpdateStrategyReq { string strategy_id = 1; string dsl_yaml = 2; }
message UpdateStrategyRsp { common.RetInfo ret_info = 1; Strategy strategy = 2; }
message GetStrategyReq { string strategy_id = 1; }
message GetStrategyRsp {
  common.RetInfo ret_info = 1;
  Strategy strategy = 2;
  StrategyTaskRequirement requirement = 3;  // 按定义的 DSL 推出的、建实例要绑定的因子任务
}

// 策略定义建实例时要绑定的因子任务，由 DSL 推出（管理台据此列出要选的任务，不自己解析 DSL）。
message StrategyTaskRequirement {
  bool pool = 1;                                   // 是策略池：主帧市场取各成员所需市场的并集
  // 已确定主帧市场：DSL 写了 market，或策略池的成员能推出市场。为 false 时只绑一个主帧任务，市场由所选任务决定
  // （股票策略不写 market），附加来源的任务键按所选任务的市场拼出（来源名:市场）
  bool market_declared = 2;
  repeated string task_keys = 3;                   // 要绑定的任务键（市场确定时才有）：主帧市场（现货在前），参考市场，附加来源的 来源名:市场
  repeated StrategySourceRequirement sources = 4;  // 附加来源（声明顺序）
  repeated string problems = 5;                    // 据此建不了实例的问题（中文），例如策略池成员不存在、股票成员与现货永续成员混放
  repeated string reference_markets = 6;           // 参考市场（market.reference）：也在 task_keys 里，只用于年龄判定，不是主帧市场
  bool tuned = 7;                                  // 策略声明了 factor_params（动态调参）
  string pool_allocation_method = 8;               // 策略池的分配方式：fixed | rotation | drift，非池为空
  string pool_drift_start = 9;                     // 策略池为 drift 时的 allocation.start 或 allocation.initial.at，其余为空
}

message StrategySourceRequirement {
  string name = 1;
  string bar = 2;
}
message ListStrategiesReq { common.Page page = 1; }
message ListStrategiesRsp { common.RetInfo ret_info = 1; repeated Strategy strategies = 2; common.PageResult page_result = 3; }
message DeleteStrategyReq { string strategy_id = 1; }
message DeleteStrategyRsp { common.RetInfo ret_info = 1; }

message ValidateStrategyReq {
  string dsl_yaml = 1;
  map<string, string> factor_tasks = 2;  // 可选，市场（spot | swap | equity）→ 因子任务 ID；给出时做列解析并在最新周期试算（读全部绑定的 View）
}
message ValidateStrategyRsp {
  common.RetInfo ret_info = 1;
  repeated string diagnostics = 2;
  string resolved_json = 3;
  StrategyResult trial = 4;              // 试算结果，不落库
  repeated StrategyResultItem trial_items = 5;
  StrategyTaskRequirement requirement = 6;  // DSL 能解析时给出：建实例要绑定的因子任务
}

message CreateStrategyInstanceReq { StrategyInstance instance = 1; }
message CreateStrategyInstanceRsp { common.RetInfo ret_info = 1; StrategyInstance instance = 2; }
message UpdateStrategyInstanceReq { StrategyInstance instance = 1; }
message UpdateStrategyInstanceRsp { common.RetInfo ret_info = 1; StrategyInstance instance = 2; }
message GetStrategyInstanceReq { string instance_id = 1; }
message GetStrategyInstanceRsp { common.RetInfo ret_info = 1; StrategyInstance instance = 2; }
message ListStrategyInstancesReq { common.Page page = 1; string strategy_id = 2; string space_id = 3; optional bool enabled = 4; }
message ListStrategyInstancesRsp { common.RetInfo ret_info = 1; repeated StrategyInstance instances = 2; common.PageResult page_result = 3; }
message SetStrategyInstanceEnabledReq { string instance_id = 1; bool enabled = 2; }
message SetStrategyInstanceEnabledRsp { common.RetInfo ret_info = 1; StrategyInstance instance = 2; }
// ConfirmStrategyInstanceReq 把挂了组合账户、正在试运行的实例确认为实盘：下一期起目标交给 Trade 下单。
// 实例没启用、没挂账户、策略池预热没完成时拒绝；已确认的再确认一次返回成功。
// session_id 可选：给了就必须是实例当前的会话（页面传它看过影子目标的那次启用，确认不会落到之后新启用的会话上）。
message ConfirmStrategyInstanceReq { string instance_id = 1; string session_id = 2; }
message ConfirmStrategyInstanceRsp { common.RetInfo ret_info = 1; StrategyInstance instance = 2; }
// DeleteStrategyInstanceReq 删除已停用、没有会话的实例，连同绑定到它的因子任务和任务的结果数据集（不可恢复）；
// 没绑定到它的任务保留不动。有回放或补算在进行时拒绝；实例不存在返回成功。
// 中途失败（例如超时）后再删一次即可接着做完。Trade 里的历史不删。
message DeleteStrategyInstanceReq { string instance_id = 1; }
message DeleteStrategyInstanceRsp {
  common.RetInfo ret_info = 1;
  // 失败时有意义：为真表示删除已经开始（可能已删了一部分），再删一次即可接着做完；为假表示什么都还没删。
  bool incomplete = 2;
}

message ListStrategyResultsReq { common.Page page = 1; string instance_id = 2; string session_id = 3; }
message ListStrategyResultsRsp { common.RetInfo ret_info = 1; repeated StrategyResult results = 2; common.PageResult page_result = 3; }
message GetStrategyResultReq { string result_id = 1; }
message GetStrategyResultRsp {
  common.RetInfo ret_info = 1;
  StrategyResult result = 2;
  repeated StrategyResultItem items = 3;
  string dsl_yaml = 4;                   // 该结果所属会话固化的 DSL 版本
  string resolved_json = 5;              // 该结果所属会话固化的绑定解析
}
message ListStrategyTargetsReq { string instance_id = 1; }
message ListStrategyTargetsRsp {
  common.RetInfo ret_info = 1;
  repeated InstrumentWeight targets = 2;
  string session_id = 3;
  int64 bar_end_time = 4;
  int64 valid_until = 5;
  string result_id = 6;
}

message StartReplayReq {
  string strategy_id = 1;                // strategy_id、dsl_yaml、instance_id 三选一：定义当前的 DSL、给定文本或实例当前会话固化的 DSL
  string dsl_yaml = 2;
  int64 start_time = 4;
  int64 end_time = 5;
  string instance_id = 7;
  map<string, string> factor_tasks = 8;  // 市场（spot | swap | equity）→ 回放读取的因子任务；市场要与任务的源数据集一致，策略要用到的市场都要给出
  double spot_fee_bps = 9;               // 现货与股票的单边手续费（基点）
  double swap_fee_bps = 10;              // 永续的单边手续费（基点）
  string funding_column = 11;            // 可选：永续持仓按 View 里的这一列（本根累计的资金费率，例如 funding_rate）结算资金费；策略池不能写，改写池 DSL 的 fees.funding_column
  double slippage_bps = 12;              // 可选：滑点（基点，0～200）；成交价在收盘价上按方向加减这个比例，买入上浮、卖出下浮
  string input = 13;                     // 可选：主帧的输入来源，view（默认，读结果 View）| compute（因子现算）；声明了 factor_params 的策略必须用 compute；compute 不支持策略池、绑了两个主帧任务的实例与股票市场
}
message StartReplayRsp { common.RetInfo ret_info = 1; Replay replay = 2; int32 bar_count = 3; int64 first_bar_end = 4; int64 last_bar_end = 5; }
message GetReplayReq { string replay_id = 1; }
message GetReplayRsp { common.RetInfo ret_info = 1; Replay replay = 2; }
message ListReplaysReq { common.Page page = 1; }
message ListReplaysRsp { common.RetInfo ret_info = 1; repeated Replay replays = 2; common.PageResult page_result = 3; }
message ListReplayBarsReq { string replay_id = 1; common.Page page = 2; bool brief = 3; }  // brief 只返回曲线与摘要字段，不含目标、持仓与摘要 JSON
message ListReplayBarsRsp { common.RetInfo ret_info = 1; repeated ReplayBar bars = 2; common.PageResult page_result = 3; }
message CancelReplayReq { string replay_id = 1; }
message CancelReplayRsp { common.RetInfo ret_info = 1; Replay replay = 2; }

// DisplayHidden 是实例外显设置里隐藏的内容（默认全部展示）：按因子分类、成员键与列名勾选隐藏。
// 只影响控制台展示与默认导出，不影响 View 的列和策略能读到的数据。
message DisplayHidden {
  repeated string categories = 1;
  repeated string members = 2;
  repeated string columns = 3;
}
message GetStrategyDisplaySettingsReq { string instance_id = 1; }
message GetStrategyDisplaySettingsRsp { common.RetInfo ret_info = 1; DisplayHidden hidden = 2; }
message SetStrategyDisplaySettingsReq { string instance_id = 1; DisplayHidden hidden = 2; }
message SetStrategyDisplaySettingsRsp { common.RetInfo ret_info = 1; DisplayHidden hidden = 2; }

service StrategyMgr {
  rpc CreateStrategy(CreateStrategyReq) returns (CreateStrategyRsp);
  rpc UpdateStrategy(UpdateStrategyReq) returns (UpdateStrategyRsp);
  rpc GetStrategy(GetStrategyReq) returns (GetStrategyRsp);
  rpc ListStrategies(ListStrategiesReq) returns (ListStrategiesRsp);
  rpc DeleteStrategy(DeleteStrategyReq) returns (DeleteStrategyRsp);
  rpc ValidateStrategy(ValidateStrategyReq) returns (ValidateStrategyRsp);
  rpc CreateStrategyInstance(CreateStrategyInstanceReq) returns (CreateStrategyInstanceRsp);
  rpc UpdateStrategyInstance(UpdateStrategyInstanceReq) returns (UpdateStrategyInstanceRsp);
  rpc GetStrategyInstance(GetStrategyInstanceReq) returns (GetStrategyInstanceRsp);
  rpc ListStrategyInstances(ListStrategyInstancesReq) returns (ListStrategyInstancesRsp);
  rpc SetStrategyInstanceEnabled(SetStrategyInstanceEnabledReq) returns (SetStrategyInstanceEnabledRsp);
  rpc ConfirmStrategyInstance(ConfirmStrategyInstanceReq) returns (ConfirmStrategyInstanceRsp);
  rpc DeleteStrategyInstance(DeleteStrategyInstanceReq) returns (DeleteStrategyInstanceRsp);
  rpc ListStrategyResults(ListStrategyResultsReq) returns (ListStrategyResultsRsp);
  rpc GetStrategyResult(GetStrategyResultReq) returns (GetStrategyResultRsp);
  rpc ListStrategyTargets(ListStrategyTargetsReq) returns (ListStrategyTargetsRsp);
  rpc StartReplay(StartReplayReq) returns (StartReplayRsp);
  rpc GetReplay(GetReplayReq) returns (GetReplayRsp);
  rpc ListReplays(ListReplaysReq) returns (ListReplaysRsp);
  rpc ListReplayBars(ListReplayBarsReq) returns (ListReplayBarsRsp);
  rpc CancelReplay(CancelReplayReq) returns (CancelReplayRsp);
  rpc GetStrategyDisplaySettings(GetStrategyDisplaySettingsReq) returns (GetStrategyDisplaySettingsRsp);
  rpc SetStrategyDisplaySettings(SetStrategyDisplaySettingsReq) returns (SetStrategyDisplaySettingsRsp);
  // GetLifecycle 读策略模块的暂停与恢复追赶状态（设计 3.7，请求与响应见 moox_common.proto）。
  rpc GetLifecycle(common.GetLifecycleReq) returns (common.GetLifecycleRsp);
  // ControlLifecycle 暂停、恢复与放行策略模块：暂停要等在途的求值结束、已落库的目标发布完（最长 30 秒）。
  rpc ControlLifecycle(common.ControlLifecycleReq) returns (common.ControlLifecycleRsp);
}
