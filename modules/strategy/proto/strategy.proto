syntax = "proto3";

package trpc.moox.strategy;

import "moox_common.proto";
option go_package = "github.com/mooyang-code/moox/modules/strategy/proto/strategygen;strategypb";

message TargetWeight { string instrument_id = 1; string target_weight = 2; }
message StrategyDef { string strategy_id = 1; string version = 2; string api_version = 3; string manifest_yaml = 4; string source_code = 5; string source_hash = 6; int32 state_schema_version = 7; string status = 8; }
message StrategyBinding { string binding_id = 1; string strategy_id = 2; string strategy_version = 3; string space_id = 4; string view_id = 5; string freq = 6; string params_json = 7; string group_id = 8; string capital_weight = 9; string status = 10; }
message StrategyState { string binding_id = 1; int64 revision = 2; string state_json = 3; string last_run_id = 4; }
message StrategyRun { string run_id = 1; string binding_id = 2; string trigger_bar_time = 3; string data_revision = 4; string action = 5; string status = 6; string output_json = 7; }
message CreateStrategyReq { StrategyDef strategy = 1; }
message CreateStrategyRsp { common.RetInfo ret_info = 1; StrategyDef strategy = 2; }
message RunOnceReq { string binding_id = 1; string trigger_bar_time = 2; bool commit = 3; }
message RunOnceRsp { common.RetInfo ret_info = 1; StrategyRun run = 2; }
message GetEngineStatusReq {}
message GetEngineStatusRsp { common.RetInfo ret_info = 1; int32 workers = 2; int32 ready_workers = 3; }
service StrategyMgr { rpc CreateStrategy(CreateStrategyReq) returns (CreateStrategyRsp); rpc RunOnce(RunOnceReq) returns (RunOnceRsp); rpc GetEngineStatus(GetEngineStatusReq) returns (GetEngineStatusRsp); }
