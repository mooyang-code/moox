global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - spacectx
    - prometheus
  timeout: 30000
  service:
    # ControlLifecycle 暂停要等在途的求值结束、已落库的目标发布完（最长 30 秒），请求时限要大于它（与服务目录里这个方法的 60 秒一致）
    - name: trpc.moox.strategy.StrategyMgr
      ip: 127.0.0.1
      port: 11430
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 60000
    - name: trpc.moox.strategy.Health
      ip: 127.0.0.1
      port: 11431
      network: tcp
      protocol: http_no_protocol
      timeout: 10000
    - name: trpc.moox.strategy.metrics.timer
      port: 11432
      network: "*/30 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 10000

plugins:
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12930
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转：单个文件 50MB、保留 5 份、最多 7 天。标准输出与标准错误（崩溃信息、数据库日志）交给 journald。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 50
          max_backups: 5
          compress: false
