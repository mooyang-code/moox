global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - spacectx
    - prometheus
  timeout: 30000
  service:
    - name: trpc.moox.strategy.StrategyMgr
      ip: 127.0.0.1
      port: 11430
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.strategy.Health
      ip: 127.0.0.1
      port: 11431
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.strategy.metrics.timer
      port: 11432
      network: "*/30 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 10000

plugins:
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12930
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转，单个文件 10MB、保留 5 份、最多 7 天；标准输出/错误主要是崩溃信息和数据库（GORM）日志，由 moox-runtime 启动前按大小轮转，持续报错时仍可能增长。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
