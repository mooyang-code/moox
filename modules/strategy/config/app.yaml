database: ./data/strategy.sqlite
trade:
  gateway_url: ""
  target_node: ""
  ca_file: ""
  timeout: 3s
instance_id: strategy-1
eventbus:
  urls:
    - nats://127.0.0.1:4222
  credential_file: ~/.config/moox/eventbus/strategy-eventbus.yaml
  relay_interval: 1s
  relay_batch_size: 100
  reconnect_interval: 1s
  connect_timeout: 3s
  consumer_name: strategy_view_factor_ready_v1
factor:
  target: ip://127.0.0.1:11003
  target_node: factor
  app_id: strategy
  timeout: 5s
storage:
  target: ip://127.0.0.1:11003
  target_node: storage-gateway
  app_id: strategy
  # AppKey/ViewAppKey are derived from the deployment's Storage auth secrets.
  app_key: ""
  view_app_key: ""
  timeout: 5s
