# MooX CloudNode service configuration.

database:
  type: sqlite
  path: ./data/moox_cloudnode.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

queue:
  backend: jetstream

jetstream:
  enabled: true
  urls:
    - nats://127.0.0.1:4222
  credential_file: ~/.config/moox/eventbus/cloudnode-eventbus.yaml
  max_deliver: 3
  max_ack_pending: 32

job_item:
  active_kv_bucket: MOOX_CLOUDNODE_JOB_ACTIVE
  active_ttl_hours: 48
  history_dir: ../data/cloudnode/jobs
  history_retention_days: 2

tencent_scf:
  default_region: ap-guangzhou
  default_namespace: default
  default_runtime: Go1

health:
  addr: ":11411"
