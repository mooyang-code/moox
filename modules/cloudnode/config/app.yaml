# MooX CloudNode service configuration.

database:
  type: sqlite
  path: ./data/moox_cloudnode.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

queue:
  backend: jetstream

jetstream:
  enabled: true
  urls:
    - nats://127.0.0.1:4222
  nats_url: nats://127.0.0.1:4222
  subject_prefix: moox.cloudnode
  exec_stream: MOOX_CLOUDNODE_EXEC
  ack_wait_millis: 120000
  max_deliver: 3
  fetch_max_wait_ms: 500

job_item:
  default_limit: 10
  max_limit: 100
  recover_after_millis: 600000
  default_max_attempts: 3
  active_kv_bucket: MOOX_CLOUDNODE_JOB_ACTIVE
  active_ttl_hours: 48
  history_dir: ../data/cloudnode/jobs
  history_retention_days: 2

tencent_scf:
  default_region: ap-guangzhou
  default_namespace: default
  default_runtime: Go1

health:
  addr: ":11411"
