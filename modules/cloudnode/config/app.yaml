# MooX CloudNode service configuration.

gateway_client:
  caller: cloudnode
  key_id: ""
  key_file: ../../secrets/caller-cloudnode.key

database:
  type: sqlite
  path: ./data/moox_cloudnode.db
  max_idle_conns: 1
  max_open_conns: 1
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

node_batch:
  batch_size: 3
  poll_interval: 500ms

tencent_scf:
  default_region: ap-guangzhou
  default_namespace: default
  default_runtime: Go1

health:
  addr: ":11411"

# 日志服务（CLS）自动开通与下发：创建或更新 SCF 采集函数时，幂等开通 CLS（服务、日志集、主题、采集日志字段索引），
# 并把上报所需的环境变量补进函数环境；开通失败只记日志，不影响函数创建。函数环境里已声明 MOOX_CLS_ENABLED 的保持不动。
cls:
  enabled: true
  region: ap-guangzhou
  api_endpoint: cls.tencentcloudapi.com
  ingest_endpoint: ap-guangzhou.cls.tencentcs.com
  logset_name: moox
  topic_name: moox-application
  retention_days: 2
  partitions: 1
  timeout_ms: 3000
  # 函数上报日志使用的专用凭证（建议是只有该主题写入权限的 CAM 子账号密钥）；两项必须同时配置，密钥放在 0600 的文件里。
  # 不配置时退回使用云账号的管理密钥（能工作，但函数环境泄露会扩大到云资源控制面），CloudNode 会记一次告警。
  # writer_secret_id: ""
  # writer_secret_key_file: ../../secrets/cls-writer.key
