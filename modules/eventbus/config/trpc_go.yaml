global:
  namespace: Development
  env_name: dev

server:
  filter:
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 11960
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.eventbus.EventBusMgr
      port: 11420
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.eventbus.Health
      port: 11419
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.eventbus.metrics.timer
      port: 11421
      network: "*/30 * * * * *?params="
      protocol: timer
      timeout: 10000
plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12970
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: console
        level: info
