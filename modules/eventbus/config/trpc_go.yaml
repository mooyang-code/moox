global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 11960
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.eventbus.EventBusMgr
      ip: 127.0.0.1
      port: 11420
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.eventbus.Health
      ip: 127.0.0.1
      port: 11419
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.eventbus.metrics.timer
      port: 11421
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000
plugins:
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12970
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转，单个文件 10MB、保留 5 份、最多 7 天；标准输出/错误主要是崩溃信息和数据库（GORM）日志，由 moox-runtime 启动前按大小轮转，持续报错时仍可能增长。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
