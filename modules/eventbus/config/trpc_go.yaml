global:
  namespace: Development
  env_name: dev

server:
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 11960
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.eventbus.EventBusMgr
      port: 11420
      network: tcp
      protocol: http
      timeout: 30000
plugins:
  log:
    default:
      - writer: console
        level: info
