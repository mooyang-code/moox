# MooX EventBus 只负责单机 NATS JetStream 运行时和基础拓扑。
broker:
  host: 127.0.0.1
  port: 4222
  client_advertise: ""
  server_name: eventbus-dev-1
  store_dir: ./data/eventbus/jetstream
  startup_timeout: 10s
  max_payload_bytes: 8388608
  cluster:
    enabled: false
    name: MOOX_EVENTBUS
    host: 127.0.0.1
    port: 6222
    routes: []
  auth:
    enabled: false
    username: ""
    password: ""
    users_file: ""
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

internal_client:
  credential_file: ""
  tls_ca_file: ""

health:
  addr: "127.0.0.1:11419"

streams:
  - name: MOOX_STORAGE
    subjects: ["moox.storage.dataset.rows.upserted.v2.>"]
    retention: limits
    discard: old
    storage: file
    replicas: 1
    max_age: 72h
    duplicates: 2m
    max_bytes: 1073741824
  - name: MOOX_OBSERVABILITY
    subjects: ["moox.observability.>"]
    retention: limits
    discard: old
    storage: file
    replicas: 1
    max_age: 24h
    duplicates: 2m
    max_bytes: 268435456
  - name: MOOX_CLOUDNODE_EXEC
    subjects: ["moox.cloudnode.job.execution.requested.v1.>"]
    retention: work_queue
    discard: old
    storage: file
    replicas: 1
    max_age: 72h
    duplicates: 2m
    max_bytes: 268435456
  - name: MOOX_TRADE
    subjects: ["moox.trade.target.requested.v1.>"]
    retention: work_queue
    discard: old
    storage: file
    replicas: 1
    max_age: 168h
    duplicates: 2m
    max_bytes: 268435456

kv:
  - bucket: MOOX_CLOUDNODE_JOB_ACTIVE
    max_age: 48h
    history: 1
    storage: file
    replicas: 1
