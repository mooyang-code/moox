# MooX EventBus owns the single embedded NATS JetStream runtime.
broker:
  host: 127.0.0.1
  port: 4222
  client_advertise: ""
  server_name: eventbus-dev-1
  store_dir: ./data/eventbus/jetstream
  startup_timeout: 10s
  max_payload_bytes: 8388608
  cluster:
    enabled: false
    name: MOOX_EVENTBUS
    host: 127.0.0.1
    port: 6222
    routes: []
  auth:
    enabled: false
    username: ""
    password: ""
    users_file: ""
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

internal_client:
  credential_file: ""
  tls_ca_file: ""

health:
  addr: "127.0.0.1:11419"

streams:
  - name: MOOX_STORAGE
    subjects: ["moox.storage.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 72h
    max_bytes: 2147483648
  - name: MOOX_METRICS
    subjects: ["moox.metrics.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 24h
    max_bytes: 536870912
  - name: MOOX_CLOUDNODE_EXEC
    subjects: ["moox.cloudnode.exec.v1.>"]
    retention: work_queue
    storage: file
    replicas: 1
    max_age: 72h
    max_bytes: 536870912
  - name: MOOX_DLQ
    subjects: ["moox.dlq.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 720h
    max_bytes: 268435456
  - name: MOOX_TRADE
    subjects: ["moox.trade.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 168h
    max_bytes: 536870912
  - name: MOOX_STRATEGY
    subjects: ["moox.strategy.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 168h
    max_bytes: 536870912

topics:
  - {topic: moox.storage.time_series.rows_updated.v1, stream: MOOX_STORAGE, kind: 1, payload_content_type: "application/x-protobuf; message=trpc.moox.storage.TimeSeriesRowsUpdated", payload_version: 1, enabled: true}
  - {topic: moox.storage.record.rows_updated.v1, stream: MOOX_STORAGE, kind: 1, payload_content_type: "application/x-protobuf; message=trpc.moox.storage.RecordRowsUpdated", payload_version: 1, enabled: true}
  - {topic: moox.metrics.host.reported.v1, stream: MOOX_METRICS, kind: 3, payload_content_type: "application/x-protobuf; message=trpc.moox.hostagent.HostMetric", payload_version: 1, enabled: true}
  - {topic: moox.dlq.message.rejected.v1, stream: MOOX_DLQ, kind: 1, payload_content_type: "application/x-protobuf; message=trpc.moox.message.RejectedMessage", payload_version: 1, enabled: true}
  - {topic: moox.trade.order.intent_created.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.order.acknowledged.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.order.submit_unknown.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.order.state_changed.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.fill.received.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.execution.slice_ready.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.reconciliation.requested.v1, stream: MOOX_TRADE, kind: 2, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.rebalance.requested.v1, stream: MOOX_TRADE, kind: 2, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.trade.rebalance.completed.v1, stream: MOOX_TRADE, kind: 1, payload_content_type: "application/x-protobuf; message=google.protobuf.BytesValue", payload_version: 1, enabled: true}
  - {topic: moox.strategy.action.accepted.v1, stream: MOOX_STRATEGY, kind: 1, payload_content_type: "application/json", payload_version: 1, enabled: true}
  - {topic: moox.strategy.group_target.ready.v1, stream: MOOX_STRATEGY, kind: 1, payload_content_type: "application/json", payload_version: 1, enabled: true}
  - {topic: moox.strategy.execution.requested.v1, stream: MOOX_STRATEGY, kind: 1, payload_content_type: "application/json", payload_version: 1, enabled: true}

topic_families:
  - pattern: moox.cloudnode.exec.v1.jobitem.s.*.pkg.*.type.*
    stream: MOOX_CLOUDNODE_EXEC
    kind: 2
    payload_content_type: "application/x-protobuf; message=trpc.moox.cloudnode.JobItem"
    payload_version: 1
    enabled: true

consumers:
  - stream: MOOX_TRADE
    durable: trade_execution_v1
    filter_subject: moox.trade.execution.slice_ready.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_reconciliation_v1
    filter_subject: moox.trade.reconciliation.requested.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 64
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_rebalance_v1
    filter_subject: moox.trade.rebalance.requested.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 64
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_progress_v1
    filter_subject: moox.trade.fill.received.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 64
    max_deliver: -1
  - stream: MOOX_METRICS
    durable: monitor_hostmetrics_ingest_v1
    filter_subject: moox.metrics.host.reported.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: 3
  - stream: MOOX_STORAGE
    durable: storage_view_builder_time_series_rows_updated_v1
    filter_subject: moox.storage.time_series.rows_updated.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 120s
    max_ack_pending: 128
    max_deliver: -1
  - stream: MOOX_STORAGE
    durable: storage_view_builder_record_rows_updated_v1
    filter_subject: moox.storage.record.rows_updated.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 120s
    max_ack_pending: 128
    max_deliver: -1
  - stream: MOOX_STORAGE
    durable: factor_calc
    filter_subject: moox.storage.time_series.rows_updated.v1
    ack_policy: explicit
    deliver_policy: new
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 1000
    max_deliver: 5
  - stream: MOOX_STORAGE
    durable: moox_archive_kline_v1
    filter_subject: moox.storage.time_series.rows_updated.v1
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 5m
    max_ack_pending: 256
    max_deliver: -1

consumer_templates:
  - stream: MOOX_CLOUDNODE_EXEC
    durable_prefix: cn_exec_
    filter_pattern: moox.cloudnode.exec.v1.jobitem.s.*.pkg.*.type.*
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1

kv:
  - bucket: MOOX_CLOUDNODE_JOB_ACTIVE
    max_age: 48h
    history: 1
    storage: file
    replicas: 1
