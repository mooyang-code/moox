# MooX EventBus owns the single embedded NATS JetStream runtime.
broker:
  host: 127.0.0.1
  port: 4222
  client_advertise: ""
  server_name: eventbus-dev-1
  store_dir: ./data/eventbus/jetstream
  startup_timeout: 10s
  max_payload_bytes: 8388608
  cluster:
    enabled: false
    name: MOOX_EVENTBUS
    host: 127.0.0.1
    port: 6222
    routes: []
  auth:
    enabled: false
    username: ""
    password: ""
    users_file: ""
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

internal_client:
  credential_file: ""
  tls_ca_file: ""

health:
  addr: "127.0.0.1:11419"

streams:
  - name: MOOX_MARKET
    subjects: ["moox.market.>"]
    retention: limits
    discard: new
    storage: file
    replicas: 1
    max_age: 168h
    duplicates: 2m
    max_bytes: 2147483648
  - name: MOOX_STORAGE
    subjects: ["moox.storage.dataset.rows.upserted.v1.>"]
    retention: limits
    discard: new
    storage: file
    replicas: 1
    max_age: 72h
    duplicates: 2m
    max_bytes: 2147483648
  - name: MOOX_METRICS
    subjects: ["moox.metrics.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 24h
    duplicates: 2m
    max_bytes: 536870912
  - name: MOOX_CLOUDNODE_EXEC
    subjects: ["moox.cloudnode.>"]
    retention: work_queue
    storage: file
    replicas: 1
    max_age: 72h
    duplicates: 2m
    max_bytes: 536870912
  - name: MOOX_DLQ
    subjects: ["moox.dlq.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 720h
    duplicates: 2m
    max_bytes: 268435456
  - name: MOOX_TRADE
    subjects: ["moox.trading.>", "moox.trade.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 168h
    duplicates: 2m
    max_bytes: 536870912
  - name: MOOX_STRATEGY
    subjects: ["moox.strategy.>"]
    retention: limits
    storage: file
    replicas: 1
    max_age: 168h
    duplicates: 2m
    max_bytes: 536870912

consumers:
  - stream: MOOX_MARKET
    durable: streamcalc_kline_v1
    filter_subject: moox.market.tick.received.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1
  - stream: MOOX_MARKET
    durable: storage_primary_kline_v1
    filter_subject: moox.market.kline.closed.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_execution_v1
    filter_subject: moox.trade.execution.slice.ready.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_reconciliation_v1
    filter_subject: moox.trade.reconciliation.requested.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 64
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_rebalance_v1
    filter_subject: moox.trade.rebalance.requested.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 64
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_progress_v1
    filter_subject: moox.trade.fill.received.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 64
    max_deliver: -1
  - stream: MOOX_TRADE
    durable: trade_trading_signal_v1
    filter_subject: moox.trading.signal.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1
  - stream: MOOX_METRICS
    durable: monitor_hostmetrics_ingest_v1
    filter_subject: moox.metrics.host.reported.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: 3
  - stream: MOOX_METRICS
    durable: monitor_metrics_ingest_v1
    filter_subject: moox.metrics.snapshot.reported.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: 3
  - stream: MOOX_STORAGE
    durable: storage_view
    filter_subject: moox.storage.dataset.rows.upserted.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 120s
    max_ack_pending: 8
    max_deliver: -1
  - stream: MOOX_STORAGE
    durable: factor_calc
    filter_subject: moox.storage.dataset.rows.upserted.v1.>
    ack_policy: explicit
    deliver_policy: new
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 1000
    max_deliver: 5
  - stream: MOOX_STORAGE
    durable: moox_archive_kline_v1
    filter_subject: moox.storage.dataset.rows.upserted.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 5m
    max_ack_pending: 256
    max_deliver: -1

consumer_templates:
  - stream: MOOX_CLOUDNODE_EXEC
    durable_prefix: cn_exec_
    filter_pattern: moox.cloudnode.job.execution.requested.v1.>
    ack_policy: explicit
    deliver_policy: all
    replay_policy: instant
    ack_wait: 60s
    max_ack_pending: 256
    max_deliver: -1

kv:
  - bucket: MOOX_CLOUDNODE_JOB_ACTIVE
    max_age: 48h
    history: 1
    storage: file
    replicas: 1
