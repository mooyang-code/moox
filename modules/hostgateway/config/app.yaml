host:
  id: storage
server:
  remote_addr: 0.0.0.0:11003
  local_addr: 127.0.0.1:11002
  health_addr: 127.0.0.1:11012
tls:
  cert_file: ../../secrets/host.crt
  key_file: ../../secrets/host.tls.key
  ca_file: ../../secrets/moox-ca.crt
control:
  host_id: control
  target: 192.0.2.1:11003
  # 本机的主机签名私钥：网关以 host-gateway 的身份用它签名取快照。
  key_file: ../../secrets/host.key
store:
  path: ../../data/host-gateway
