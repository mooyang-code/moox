global:
  namespace: Development
  env_name: test

server:
  filter:
    - validation
    - prometheus
  timeout: 30000
  admin:
    ip: 127.0.0.1
    port: 20003
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20213
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.storage.ViewIndex
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view_index.metrics.timer
      port: 20304
      network: "*/30 * * * * *?params="
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation

plugins:
  prometheus:
    ip: 127.0.0.1
    port: 12961
    path: /metrics
    enablepush: false
  auth:
    validation:
      enable_error_log: true
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
