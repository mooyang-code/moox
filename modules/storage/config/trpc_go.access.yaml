global:
  namespace: Development
  env_name: test

server:
  filter:
    - validation
    - cors
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 20000
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      port: 20210
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.storage.Access.trpc
      port: 20102
      network: tcp
      protocol: trpc
    - name: trpc.moox.storage.AccessScan.trpc
      port: 20105
      network: tcp
      protocol: trpc
      timeout: 120000
    - name: trpc.moox.storage.PrimaryStore
      port: 20101
      network: tcp
      protocol: trpc
    - name: trpc.moox.storage.Metadata.trpc
      port: 20100
      network: tcp
      protocol: trpc
    - name: trpc.moox.storage.Access.http
      port: 20201
      network: tcp
      protocol: http
    - name: trpc.moox.storage.Metadata.http
      port: 20200
      network: tcp
      protocol: http
    - name: trpc.moox.storage.access.metrics.timer
      port: 20303
      network: "*/30 * * * * *?params="
      protocol: timer
      timeout: 10000

plugins:
  prometheus:
    ip: 127.0.0.1
    port: 12960
    path: /metrics
    enablepush: false
  auth:
    cors:
      apply_to_all_path:
        - insecure_allow_all
    validation:
      enable_error_log: true
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
