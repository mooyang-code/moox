global:
  namespace: Production
  env_name: storage-access

server:
  filter: []
  timeout: 30000
  admin:
    ip: 127.0.0.1
    port: 20004
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Access
      ip: 0.0.0.0
      port: 11004
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 11014
      network: tcp
      protocol: http_no_protocol
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12964
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
