global: #全局配置
  namespace: Development            #环境类型，分正式production和非正式development两种类型
  env_name: test                    #环境名称，非正式环境下多环境的名称

server:
  filter:
    - recovery
    - validation
    - prometheus
  timeout: 5000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20210
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.storage.PrimaryStore.trpc
      ip: 127.0.0.1
      port: 20102
      network: tcp
      protocol: trpc
      transport: go-net
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 35000 # WaitViewApplied 最多等 30 秒
    - name: trpc.moox.storage.Metadata.trpc
      ip: 127.0.0.1
      port: 20100
      network: tcp
      protocol: trpc
      transport: go-net
    - name: trpc.moox.storage.primary.metrics.timer
      port: 20303
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 60000

client:
  filter:
    - validation
  service:
    - name: trpc.moox.storage.PrimaryStore
      target: ip://127.0.0.1:20102
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 3000
    - name: trpc.moox.storage.DataView
      target: ip://127.0.0.1:20103
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12960
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file                              #本地文件日志
        level: info                                #本地文件滚动日志的级别
        writer_config:                            #本地文件输出具体配置
          log_path: ./logs                        #本地文件日志路径
          filename: trpc.log                      #本地文件日志文件名
          roll_type: size                         #文件滚动类型,size为按大小滚动
          max_age: 7                              #最大日志保留天数
          max_size: 50                            #本地文件滚动日志的大小 单位 MB
          max_backups: 5                         #最大日志文件数
          compress:  false                        #日志文件是否压缩
