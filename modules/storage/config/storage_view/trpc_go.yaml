global:
  namespace: Development
  env_name: test

server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.DataView.http
      ip: 127.0.0.1
      port: 20202
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view.timer
      port: 20300
      network: "*/30 * * * * *?scheduler=viewReconcileSchedule&startAtOnce=1"
      protocol: timer
      timeout: 900000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation
    - opentelemetry
  service:
    - name: trpc.moox.storage.PrimaryStore
      target: ip://127.0.0.1:20201
      network: tcp
      protocol: http
      timeout: 3000
    - name: trpc.moox.storage.Metadata
      target: ip://127.0.0.1:20200
      network: tcp
      protocol: http
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false

storage:
  root: ./var/storage
  roles:
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  primary:
    service_name: trpc.moox.storage.DataNode
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
  view:
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    max_workers: 2
    maintenance:
      enabled: true
      owner_id: ""
      lease_ttl: 90s
      run_budget: 20s
      page_size: 500
      max_entries: 200000
      target_entries: 150000
      max_physical_bytes: 536870912
      min_free_disk_bytes: 1073741824
      min_ready_entries: 1000
      overlap_window: 30m
      allowed_lag: 2m
      remove_grace: 60s
      time_series:
        default_keep_duration: 7d
        keep_by_freq:
          1m: 24h
          1h: 90d
          1d: 730d
      record:
        keep_duration: 30d
  health:
    addr: ":20211"
