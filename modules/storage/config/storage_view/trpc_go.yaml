gateway_client:
  caller: storage-view
  key_id: "" # Admin 分配，部署时填入。
  key_file: ../../secrets/caller-storage-view.key
global:
  namespace: Development
  env_name: test

server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  # History backfills may temporarily contend with PrimaryStore reads. Keep
  # the request alive long enough for a bounded Pebble batch to complete.
  timeout: 60000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 30000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      # Gathering bounded View metrics can read tens of thousands of series;
      # keep the 30-second cadence while allowing one report to complete.
      timeout: 60000
    - name: trpc.moox.storage.view.cleanup.timer
      port: 20308
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 20000

client:
  filter:
    - validation
    - opentelemetry
  service:
    - name: trpc.moox.storage.PrimaryStore
      target: ip://127.0.0.1:20102
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 30000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false

storage:
  root: ./var/storage
  # Dataset retention and View limits rendered by moox-cli from moox.toml.
  policy_file: config/storage-policy.json
  roles:
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  primary:
    service_name: trpc.moox.storage.DataNode
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
  view:
    batch_size: 500
    # View 只有一种消费方式：每个数据集一个动态消费者（view_<数据集哈希>），共用这组全局并发参数。
    # 默认都是 1：同一数据集内按顺序处理，避免同一行的两次更新先后颠倒；导入历史时追平不够快再调大。
    fetch_batch: 1
    max_workers: 1
    max_ack_pending: 1
    ack_wait_ms: 120000
    # 重建时按页读取主库历史并串行请求，避免大修复对 Storage 形成突发压力。
    backfill_page_size: 2000
    backfill_request_interval: 100ms
    # 定时删除最旧数据（每分钟第 10 秒触发、偶数分钟执行）：每个序列只保留最新的 bars 根，每批最多删除这么多行最旧数据。
    delete_oldest_batch_size: 2000
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  health:
    addr: ":20211"
