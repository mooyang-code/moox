global:
  namespace: Development
  env_name: test

server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  # History backfills may temporarily contend with PrimaryStore reads. Keep
  # the request alive long enough for a bounded Pebble batch to complete.
  timeout: 60000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 30000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.DataView.http
      ip: 127.0.0.1
      port: 20202
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation
    - opentelemetry
  service:
    - name: trpc.moox.storage.PrimaryStore
      target: ip://127.0.0.1:20201
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.Metadata
      target: ip://127.0.0.1:20200
      network: tcp
      protocol: http
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false

storage:
  root: ./var/storage
  roles:
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  primary:
    service_name: trpc.moox.storage.DataNode
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
    # Partition-specific ACK budgets live under view.consumer_partitions.
    # This field is retained for the primary/legacy config loader only.
    max_ack_pending: 256
  view:
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 256
    max_workers: 8
    ordering: dataset
    consumer_partitions:
      - id: kline
        durable: storage_view_kline_v2
        routes:
          - space_id: crypto_market
            dataset_ids: [binance_spot_kline_1m]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: system_metrics
        durable: storage_view_metrics_v2
        routes:
          - space_id: moox_system
            dataset_ids: [moox_service_metrics]
        fetch_batch: 2
        max_workers: 1
        max_ack_pending: 8
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: other
        durable: storage_view_other_v2
        routes:
          - space_id: crypto_market
            dataset_ids: ["*"]
          - space_id: moox_system
            dataset_ids: [host_disk_v1, host_fs_v1, host_net_v1, host_resource_v1]
          - space_id: stock_cn
            dataset_ids: [financial_statement_metric, financial_summary, index_kline, stock_kline]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
    rebuild_check_interval: 1m
    rebuild_lookback: 24h
    rebuild_lookback_periods:
      1m: 1000
      1h: 1000
      1d: 1000
      default: 1000
    max_view_file_bytes: 1073741824
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  health:
    addr: ":20211"
