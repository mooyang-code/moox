global:
  namespace: Development
  env_name: test

server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.DataView.http
      ip: 127.0.0.1
      port: 20202
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation
    - opentelemetry
  service:
    - name: trpc.moox.storage.PrimaryStore
      target: ip://127.0.0.1:20201
      network: tcp
      protocol: http
      timeout: 3000
    - name: trpc.moox.storage.Metadata
      target: ip://127.0.0.1:20200
      network: tcp
      protocol: http
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false

storage:
  root: ./var/storage
  roles:
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  primary:
    service_name: trpc.moox.storage.DataNode
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
    # Keep enough deliveries in flight for different Dataset lanes to make
    # progress while the dispatcher still serializes each Dataset lane.
    max_ack_pending: 256
  view:
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 256
    max_workers: 8
    ordering: dataset
    rebuild_check_interval: 1m
    max_view_file_bytes: 1073741824
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  health:
    addr: ":20211"
