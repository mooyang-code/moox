global:
  namespace: Development
  env_name: test

server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  # History backfills may temporarily contend with PrimaryStore reads. Keep
  # the request alive long enough for a bounded Pebble batch to complete.
  timeout: 60000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 30000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.DataView.http
      ip: 127.0.0.1
      port: 20202
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000
    - name: trpc.moox.storage.view.cleanup.timer
      port: 20308
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 20000

client:
  filter:
    - validation
    - opentelemetry
  service:
    - name: trpc.moox.storage.PrimaryStore
      target: ip://127.0.0.1:20201
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.Metadata
      target: ip://127.0.0.1:20200
      network: tcp
      protocol: http
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false

storage:
  root: ./var/storage
  roles:
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  primary:
    service_name: trpc.moox.storage.DataNode
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
    # Partition-specific ACK budgets live under view.consumer_partitions.
    # This field is retained for the primary/legacy config loader only.
    max_ack_pending: 256
  view:
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 256
    max_workers: 8
    ordering: dataset
    consumer_partitions:
      - id: kline
        durable: storage_view_kline
        routes:
          - space_id: crypto
            dataset_ids: [dataset_binance_spot_kline_1m]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: system_metrics
        durable: storage_view_metrics
        routes:
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_service_metrics]
        # System metrics are emitted every 30 seconds and can accumulate a
        # sizeable durable backlog after a Storage View restart. Keep the
        # dataset/subject ordering guarantee while allowing independent
        # service subjects to drain in parallel.
        fetch_batch: 16
        max_workers: 4
        max_ack_pending: 64
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: factor
        durable: storage_view_factor
        routes:
          - space_id: crypto
            dataset_ids: [dataset_crypto_spot_kline_1m_factor]
        # Factor results are emitted once per factor/subject/period. Keep a
        # deeper fetch window and more worker capacity than Kline so a brief
        # Storage View restart can drain the durable backlog faster than the
        # one-minute producer rate. Rows are still ordered per Dataset; the
        # consumer coalesces contiguous rows before one index transaction.
        fetch_batch: 16
        max_workers: 8
        max_ack_pending: 128
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: misc
        durable: storage_view_misc
        routes:
          - space_id: crypto
            dataset_ids: ["*"]
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_host_disk, dataset_mooxsys_host_filesystem, dataset_mooxsys_host_network, dataset_mooxsys_host_resource]
          - space_id: stockcn
            dataset_ids: [dataset_stockcn_financial_statement_metric, dataset_stockcn_financial_summary, dataset_stockcn_bond_kline, dataset_stockcn_index_kline, dataset_stockcn_instruments, dataset_stockcn_equity_kline]
          - space_id: stockhk
            dataset_ids: [dataset_stockhk_equity_kline]
          - space_id: stockus
            dataset_ids: [dataset_stockus_equity_kline]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
    maintenance_check_interval: 1m
    maintenance_policy_file: config/maintenance.json
    rebuild_lookback: 24h
    rebuild_lookback_periods:
      1m: 1000
      1h: 1000
      1d: 1000
      default: 1000
    max_view_file_bytes: 1073741824
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  health:
    addr: ":20211"
