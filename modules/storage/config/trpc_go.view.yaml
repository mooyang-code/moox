global:
  namespace: Development
  env_name: test

server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  timeout: 5000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 127.0.0.1
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.DataView.http
      ip: 127.0.0.1
      port: 20202
      network: tcp
      protocol: http
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view.timer
      port: 20300
      network: "*/30 * * * * *?scheduler=viewBuilderSchedule&startAtOnce=1"
      protocol: timer
      timeout: 900000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 10000

client:
  filter:
    - validation
    - opentelemetry
  service:
    - name: trpc.moox.storage.Access
      target: ip://127.0.0.1:20201
      network: tcp
      protocol: http
      timeout: 3000
    - name: trpc.moox.storage.AccessScan
      target: ip://127.0.0.1:20105
      network: tcp
      protocol: trpc
      timeout: 120000
    - name: trpc.moox.storage.Metadata
      target: ip://127.0.0.1:20200
      network: tcp
      protocol: http
      timeout: 3000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
