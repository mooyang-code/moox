storage:
  root: ./var/storage
  roles:
    - primary
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
    max_ack_pending: 8
  primary:
    service_name: ""
    node_id: storage-node-0
    outbox:
      flush_batch_size: 100
      flush_max_bytes: 1048576
      flush_interval_ms: 200
      max_rows: 100000
      max_bytes: 268435456
      max_age_hours: 24
      backoff_base_ms: 200
      backoff_max_ms: 30000
  view:
    maintenance_policy_file: config/maintenance.json
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 1
    max_workers: 1
    ordering: dataset
    consumer_partitions:
      - id: kline
        durable: storage_view_kline_v2
        routes:
          - space_id: crypto_market
            dataset_ids: [binance_spot_kline_1m]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: system_metrics
        durable: storage_view_metrics_v2
        routes:
          - space_id: moox_system
            dataset_ids: [moox_service_metrics]
        fetch_batch: 2
        max_workers: 1
        max_ack_pending: 8
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: other
        durable: storage_view_other_v2
        routes:
          - space_id: crypto_market
            dataset_ids: ["*"]
          - space_id: moox_system
            dataset_ids: [host_disk_v1, host_fs_v1, host_net_v1, host_resource_v1]
          - space_id: stock_cn
            dataset_ids: [financial_statement_metric, financial_summary, index_kline, stock_kline]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
    maintenance_check_interval: 1m
    # Time-series Views use the completed-bar targets below. Keep this global
    # duration only as a compatibility fallback for legacy Views without freq.
    rebuild_lookback: 24h
    rebuild_lookback_periods:
      1m: 1000
      1h: 1000
      1d: 1000
      default: 1000
    max_view_file_bytes: 1073741824
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  maintenance:
    host_metrics_cleanup:
      enabled: true
      dataset_ids: [host_resource_v1, host_fs_v1, host_disk_v1, host_net_v1]
      max_age: 48h
      batch_size: 1000
      max_batches_per_run: 10
  health:
    addr: ":20210"
