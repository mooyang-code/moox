storage:
  root: ./var/storage
  roles:
    - primary
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  eventbus:
    type: jetstream
    urls:
      - nats://127.0.0.1:4222
    nats_url: nats://127.0.0.1:4222
    credential_file: ~/.config/moox/storage/eventbus.yaml
    stream_name: MOOX_STORAGE
    subject_prefix: moox.storage.fields_changed.v1
    consumer_name: storage_view
    max_age_hours: 24
    max_msgs: 500000
    max_bytes: 268435456
    max_in_flight: 1
    max_ack_pending: 1
    ack_wait_ms: 120000
    max_deliver: -1
  primary:
    service_name: ""
    node_id: storage-node-0
    outbox:
      flush_batch_size: 100
      flush_max_bytes: 1048576
      flush_interval_ms: 200
      max_rows: 100000
      max_bytes: 268435456
      max_age_hours: 24
      backoff_base_ms: 200
      backoff_max_ms: 30000
  view:
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    max_workers: 2
    maintenance:
      enabled: true
      owner_id: ""
      lease_ttl: 90s
      run_budget: 20s
      page_size: 500
      max_entries: 200000
      target_entries: 150000
      max_physical_bytes: 536870912
      min_free_disk_bytes: 1073741824
      min_ready_entries: 1000
      overlap_window: 30m
      allowed_lag: 2m
      remove_grace: 60s
      time_series:
        default_keep_duration: 7d
        keep_by_freq:
          1m: 24h
          1h: 90d
          1d: 730d
      record:
        keep_duration: 30d
  maintenance:
    host_metrics_cleanup:
      enabled: true
      dataset_ids: [host_resource_v1, host_fs_v1, host_disk_v1, host_net_v1]
      max_age: 48h
      batch_size: 1000
      max_batches_per_run: 10
  health:
    addr: ":20210"
