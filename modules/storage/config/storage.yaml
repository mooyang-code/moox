gateway_client:
  caller: storage-view
  key_id: "" # Admin 分配，部署时填入。
  key_file: ../../secrets/caller-storage-view.key
storage:
  root: ./var/storage
  # Dataset retention and View limits rendered by moox-cli from moox.toml.
  policy_file: ../config/storage-policy.json
  roles:
    - primary
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
    max_ack_pending: 8
  primary:
    service_name: ""
    node_id: storage-node-0
    outbox:
      flush_batch_size: 100
      flush_max_bytes: 1048576
      flush_interval_ms: 200
      max_rows: 100000
      max_bytes: 268435456
      max_age_hours: 24
      backoff_base_ms: 200
      backoff_max_ms: 30000
  view:
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 1
    max_workers: 1
    ordering: dataset
    consumer_partitions:
      - id: system_metrics
        durable: storage_view_metrics
        routes:
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_service_metrics]
        # System metrics are emitted every 30 seconds and can accumulate a
        # sizeable durable backlog after a Storage View restart. Keep the
        # dataset/subject ordering guarantee while allowing independent
        # service subjects to drain in parallel.
        fetch_batch: 16
        max_workers: 4
        max_ack_pending: 64
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: factor
        durable: storage_view_factor
        # Factor result Datasets are bound dynamically, one durable per result;
        # this partition has no static routes and only supplies the template.
        # Keep JetStream delivery serialized across process restarts: while a
        # result-row event is unacked, the following FactorPeriodComputed
        # marker must not be delivered to the View consumer.
        fetch_batch: 1
        max_workers: 1
        max_ack_pending: 1
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: misc
        durable: storage_view_misc
        routes:
          - space_id: crypto
            dataset_ids: ["*"]
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_host_disk, dataset_mooxsys_host_filesystem, dataset_mooxsys_host_network, dataset_mooxsys_host_resource]
          - space_id: stockcn
            dataset_ids: ["*"]
          - space_id: stockhk
            dataset_ids: ["*"]
          - space_id: stockus
            dataset_ids: ["*"]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
    # Keep history pages and Primary requests serialized during a View rebuild
    # so a large repair does not burst against Storage.
    backfill_page_size: 2000
    backfill_request_interval: 100ms
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  health:
    addr: ":20210"
