storage:
  root: ./var/storage
  roles:
    - primary
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
  eventbus:
    credential_file: ~/.config/moox/eventbus/storage-eventbus.yaml
    max_ack_pending: 8
  primary:
    service_name: ""
    node_id: storage-node-0
    outbox:
      flush_batch_size: 100
      flush_max_bytes: 1048576
      flush_interval_ms: 200
      max_rows: 100000
      max_bytes: 268435456
      max_age_hours: 24
      backoff_base_ms: 200
      backoff_max_ms: 30000
  view:
    maintenance_policy_file: config/maintenance.json
    storage_rpc:
      gateway_target: ip://127.0.0.1:11003
      gateway_node_id: ""
      key_id: storage-view
      hmac_key_file: ""
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 1
    max_workers: 1
    ordering: dataset
    consumer_partitions:
      - id: kline
        durable: storage_view_kline
        routes:
          - space_id: crypto
            dataset_ids: [dataset_binance_spot_kline_1m]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: system_metrics
        durable: storage_view_metrics
        routes:
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_service_metrics]
        # System metrics are emitted every 30 seconds and can accumulate a
        # sizeable durable backlog after a Storage View restart. Keep the
        # dataset/subject ordering guarantee while allowing independent
        # service subjects to drain in parallel.
        fetch_batch: 16
        max_workers: 4
        max_ack_pending: 64
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: factor
        durable: storage_view_factor
        routes:
          - space_id: crypto
            dataset_ids: [dataset_crypto_spot_kline_1m_factor]
        # Factor results are emitted once per factor/subject/period. Keep a
        # deeper fetch window and more worker capacity than Kline so a brief
        # Storage View restart can drain the durable backlog faster than the
        # one-minute producer rate. Rows are still ordered per Dataset; the
        # consumer coalesces contiguous rows before one index transaction.
        fetch_batch: 16
        max_workers: 8
        max_ack_pending: 128
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: misc
        durable: storage_view_misc
        routes:
          - space_id: crypto
            dataset_ids: ["*"]
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_host_disk, dataset_mooxsys_host_filesystem, dataset_mooxsys_host_network, dataset_mooxsys_host_resource]
          - space_id: stockcn
            dataset_ids: [dataset_stockcn_financial_statement_metric, dataset_stockcn_financial_summary, dataset_stockcn_bond_kline, dataset_stockcn_index_kline, dataset_stockcn_instruments, dataset_stockcn_equity_kline]
          - space_id: stockhk
            dataset_ids: [dataset_stockhk_equity_kline]
          - space_id: stockus
            dataset_ids: [dataset_stockus_equity_kline]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
    maintenance_check_interval: 1m
    # Time-series Views use the completed-bar targets below. Keep this global
    # duration only as a compatibility fallback for legacy Views without freq.
    rebuild_lookback: 24h
    rebuild_lookback_periods:
      1m: 1000
      1h: 1000
      1d: 1000
      default: 1000
    max_view_file_bytes: 1073741824
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  maintenance:
    host_metrics_cleanup:
      enabled: true
      dataset_ids: [dataset_mooxsys_host_resource, dataset_mooxsys_host_filesystem, dataset_mooxsys_host_disk, dataset_mooxsys_host_network]
      max_age: 48h
      batch_size: 1000
      max_batches_per_run: 10
  health:
    addr: ":20210"
