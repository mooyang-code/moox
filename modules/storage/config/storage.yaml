storage:
  root: ./var/storage
  roles:
    - access
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    duckdb_path: ./var/storage/duckdb/views.duckdb
    bleve_path: ./var/storage/bleve
    parquet_path: ./var/storage/archive
  primary:
    service_name: ""
  eventbus:
    type: memory
    nats_url: nats://127.0.0.1:4222
    stream_name: MOOX_STORAGE
    subject_prefix: moox.storage
    consumer_name: storage_view
    max_age_hours: 24
    max_msgs: 500000
    max_bytes: 268435456
    max_in_flight: 128
    ack_wait_ms: 120000
    max_deliver: 10
    embedded:
      enabled: false
  view:
    metadata_service_name: trpc.moox.storage.Metadata
    access_service_name: trpc.moox.storage.Access
    batch_size: 500
    batch_wait_ms: 200
    max_workers: 2
    rotation:
      enabled: true
      max_entries: 200000
      min_ready_entries: 50000
      overlap_window: 30m
      default_backfill_window: 1d
      allowed_lag: 2m
      remove_grace_ms: 60000
      time_series:
        freq_backfill_window:
          1m: 6h
          1h: 30d
          1d: 730d
      record:
        default_version_window: 30d
        max_backfill_entries: 200000
  health:
    addr: ":20210"
