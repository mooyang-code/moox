storage:
  root: ./var/storage
  roles:
    - access
    - view
  metadata:
    path: ./var/storage/metadata/storage_metadata.db
  devices:
    pebble_path: ./var/storage/pebble
    view_index_root: ./var/storage/view-indexes
    parquet_path: ./var/storage/archive
  eventbus:
    type: jetstream
    urls:
      - nats://127.0.0.1:4222
    nats_url: nats://127.0.0.1:4222
    credential_file: ""
    stream_name: MOOX_STORAGE
    subject_prefix: moox.storage
    consumer_name: storage_view
    max_age_hours: 24
    max_msgs: 500000
    max_bytes: 268435456
    max_in_flight: 128
    ack_wait_ms: 120000
    max_deliver: -1
  primary:
    service_name: ""
    outbox:
      flush_batch_size: 100
      flush_max_bytes: 1048576
      flush_interval_ms: 200
      max_rows: 100000
      max_bytes: 268435456
      max_age_hours: 24
      backoff_base_ms: 200
      backoff_max_ms: 30000
  view:
    metadata_service_name: trpc.moox.storage.Metadata
    access_service_name: trpc.moox.storage.Access
    access_scan_service_name: trpc.moox.storage.AccessScan
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    max_workers: 2
    maintenance:
      enabled: true
      owner_id: ""
      lease_ttl: 90s
      run_budget: 20s
      page_size: 500
      max_entries: 200000
      target_entries: 150000
      max_physical_bytes: 536870912
      min_free_disk_bytes: 1073741824
      min_ready_entries: 1000
      overlap_window: 30m
      allowed_lag: 2m
      remove_grace: 60s
      time_series:
        default_retention_window: 7d
        retention_by_freq:
          1m: 24h
          1h: 90d
          1d: 730d
      record:
        retention_window: 30d
      host_dataset_ids: [host_resource_v1, host_fs_v1, host_disk_v1, host_net_v1]
      host_retention: 72h
      host_interval: 1h
  health:
    addr: ":20210"
