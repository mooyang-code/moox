syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";

// TimeSeriesRowKey identifies one time-series row. An empty series_tag is the
// default series for the subject, frequency, and timestamp.
message TimeSeriesRowKey {
  string subject_id = 1;
  string freq = 2;
  string data_time = 3;
  string series_tag = 4;
}

// RecordRowKey identifies one immutable record version.
message RecordRowKey {
  string record_id = 1;
  string version = 2;
}

// RowKey is the only key accepted by DataNode field operations.
message RowKey {
  string space_id = 1;
  string dataset_id = 2;
  oneof kind {
    TimeSeriesRowKey time_series = 3;
    RecordRowKey record = 4;
  }
}

// FieldValue is a typed value owned by a Dataset Field.
message FieldValue {
  string field_id = 1;
  TypedValue value = 2;
}

// RowFieldUpsert is a partial row update. Omitted fields are left unchanged.
message RowFieldUpsert {
  RowKey key = 1;
  repeated FieldValue fields = 2;
  map<string, TypedValue> attributes = 3;
}

message RowFieldValues {
	RowKey key = 1;
	repeated FieldValue fields = 2;
	map<string, TypedValue> attributes = 3;
}

// RowsUpserted is the Storage module's local write result model. The public
// EventBus contract is packages/storagepb.DatasetRowsUpserted.
message RowsUpserted {
  string space_id = 1;
  string dataset_id = 2;
  repeated RowFieldUpsert rows = 3;
}

// Query key views are retained as read-only query contracts. DataNode writes
// use RowKey above and never accept these request wrappers.
message TimeSeriesKey {
  string space_id = 1;
  string dataset_id = 2;
  string subject_id = 3;
  string freq = 4;
  string data_time = 5;
  string series_tag = 6;
}

message TimeSeriesSelector {
  string space_id = 1;
  string dataset_id = 2;
  string subject_id = 3;
  string freq = 4;
  optional string series_tag = 5;
}

message RecordKey {
  string space_id = 1;
  string dataset_id = 2;
  string record_id = 3;
  string version = 4;
}

message TimeSeriesRow {
  TimeSeriesKey key = 1;
  repeated FieldValue fields = 2;
  map<string, string> attributes = 3;
}

message RecordRow {
  RecordKey key = 1;
  repeated FieldValue fields = 2;
  map<string, string> attributes = 3;
}

// Range and version queries use row-shaped read contracts. Point reads use
// PrimaryStore.ReadFields; all writes use RowFieldUpsert.
message ReadTimeSeriesRowsReq {
  common.AuthInfo auth_info = 1;
  repeated TimeSeriesSelector selectors = 2;
  TimeRange time_range = 3;
  SortOrder order = 4;
  repeated string column_names = 5;
  common.Page page = 6;
  string space_id = 7;
  string dataset_id = 8;
  // keys are exact PrimaryStore point reads. Range reads use selectors.
  repeated TimeSeriesKey keys = 9;
}

message ReadTimeSeriesRowsRsp {
  common.RetInfo ret_info = 1;
  repeated TimeSeriesRow rows = 2;
  common.PageResult page_result = 3;
  string served_indexed_from = 4;
  string served_indexed_to = 5;
  bool complete = 6;
}

message ReadRecordRowsReq {
  common.AuthInfo auth_info = 1;
  repeated RecordKey keys = 2;
  VersionRange version_range = 3;
  SortOrder order = 4;
  repeated string column_names = 5;
  common.Page page = 6;
  string space_id = 7;
  string dataset_id = 8;
}

message ReadRecordRowsRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRow rows = 2;
  common.PageResult page_result = 3;
}
