syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";

// TimeSeriesRowKey identifies one time-series row. Dimensions are ordinary
// fields and never participate in row identity.
message TimeSeriesRowKey {
  string subject_id = 1;
  string freq = 2;
  string data_time = 3;
}

// RecordRowKey identifies one immutable record version.
message RecordRowKey {
  string record_id = 1;
  string version = 2;
}

// RowKey is the only key accepted by DataNode field operations.
message RowKey {
  string space_id = 1;
  string dataset_id = 2;
  oneof kind {
    TimeSeriesRowKey time_series = 3;
    RecordRowKey record = 4;
  }
}

// FieldValue is a typed value owned by a Dataset Field.
message FieldValue {
  string field_id = 1;
  TypedValue value = 2;
}

// RowFieldUpsert is a partial row update. Omitted fields are left unchanged.
message RowFieldUpsert {
  RowKey key = 1;
  repeated FieldValue fields = 2;
  map<string, TypedValue> attributes = 3;
}

message RowFieldValues {
  RowKey key = 1;
  repeated FieldValue fields = 2;
  map<string, TypedValue> attributes = 3;
}

// Query key views are retained as read-only query contracts. DataNode writes
// use RowKey above and never accept these request wrappers.
message TimeSeriesKey {
  string space_id = 1;
  string dataset_id = 2;
  string subject_id = 3;
  string freq = 4;
  string data_time = 5;
  // Deprecated compatibility field; Dimensions are not part of RowKey.
  map<string, string> dimensions = 6;
}

message RecordKey {
  string space_id = 1;
  string dataset_id = 2;
  string record_id = 3;
  string version = 4;
}

message TimeSeriesRow {
  TimeSeriesKey key = 1;
  repeated FieldValue fields = 2;
  // Deprecated compatibility projection for downstream archive/factor code.
  repeated ColumnValue columns = 3;
  map<string, string> attributes = 4;
}

message RecordRow {
  RecordKey key = 1;
  repeated FieldValue fields = 2;
  repeated ColumnValue columns = 3;
  map<string, string> attributes = 4;
}

// The read wrappers are retained only so independently deployed Archive/Factor
// clients can migrate to PrimaryStore field reads. New writes use
// RowFieldUpsert and never use these messages.
message ReadTimeSeriesRowsReq {
  common.AuthInfo auth_info = 1;
  repeated TimeSeriesKey keys = 2;
  TimeRange time_range = 3;
  SortOrder order = 4;
  repeated string column_names = 5;
  common.Page page = 6;
}

message ReadTimeSeriesRowsRsp {
  common.RetInfo ret_info = 1;
  repeated TimeSeriesRow rows = 2;
  common.PageResult page_result = 3;
}

message MergeTimeSeriesRowsReq {
  common.AuthInfo auth_info = 1;
  repeated TimeSeriesRow rows = 2;
}

message MergeTimeSeriesRowsRsp {
  common.RetInfo ret_info = 1;
  repeated string written_keys = 2;
}

message MergeRecordRowsReq {
  common.AuthInfo auth_info = 1;
  repeated RecordRow rows = 2;
}

message MergeRecordRowsRsp {
  common.RetInfo ret_info = 1;
  repeated RecordKey keys = 2;
}

message ReadRecordRowsReq {
  common.AuthInfo auth_info = 1;
  repeated RecordKey keys = 2;
  VersionRange version_range = 3;
  SortOrder order = 4;
  repeated string column_names = 5;
  common.Page page = 6;
}

message ReadRecordRowsRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRow rows = 2;
  common.PageResult page_result = 3;
}
