syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/gen;storagepb";

import "moox_common.proto";
import "common.proto";

// TimeSeriesKey 表示时序数据行的业务主键。
// 时序数据必须是固定 subject_id + 固定 freq 下，按 data_time 连续演进的数据。
// 服务端内部将其归一为 PrimaryStoreKey(key=subject_id|freq|dimhash, version=data_time)。
message TimeSeriesKey {
  // space_id 是使用空间 ID。
  string space_id = 1;
  // dataset_id 是事实数据集 ID。
  string dataset_id = 2;
  // subject_id 是固定数据对象 ID，例如交易标的。
  string subject_id = 3;
  // freq 是固定时序频率，例如 1m、1h、1d。
  string freq = 4;
  // dimensions 是参与同一事实序列定位的低基数业务维度。
  map<string, string> dimensions = 5;
  // data_time 是本行版本时间，必须为 RFC3339/RFC3339Nano。
  // 范围读取时可为空，实际版本集合由 time_range 表达。
  string data_time = 6;
}

// TimeSeriesRow 表示一行时序事实数据。
message TimeSeriesRow {
  // key 是时序业务主键。
  TimeSeriesKey key = 1;
  // columns 是本次写入携带的列值。
  // 再次写入同一 key + data_time 时，只更新本次携带的列；未携带的旧列保留。
  repeated ColumnValue columns = 2;
  // attributes 是附加属性，更新时按 key 覆盖。
  map<string, string> attributes = 3;
}

// RecordKey 表示记录数据行的业务主键。修订号由服务端分配，不属于调用方身份。
message RecordKey {
  // space_id 是使用空间 ID。
  string space_id = 1;
  // dataset_id 是事实数据集 ID。
  string dataset_id = 2;
  // record_id 是记录唯一 ID，例如 news_id、profile_id、ranking_id。
  string record_id = 3;
  reserved 4;
  reserved "version";
}

// RecordRow 表示一行记录事实数据。
message RecordRow {
  // key 是记录业务主键。
  RecordKey key = 1;
  // columns 是本次写入携带的列值。
  // 再次写入同一 key + version 时，只更新本次携带的列；未携带的旧列保留。
  repeated ColumnValue columns = 2;
  // attributes 是附加属性，更新时按 key 覆盖。
  map<string, string> attributes = 3;
  // revision 是服务端分配的不可变记录版本。
  uint64 revision = 4;
  // updated_at 是服务端提交时间。
  string updated_at = 5;
  // commit_seq 是 PrimaryStore 的单调提交序号。
  uint64 commit_seq = 6;
}

// RecordMutation 表示对一个逻辑 Record 的补丁写入。
message RecordMutation {
  RecordKey key = 1;
  repeated ColumnValue columns = 2;
  map<string, string> attributes = 3;
  optional uint64 expected_revision = 4;
}

// UpsertRecordRowsReq 表示使用服务端 revision 写入 Record。
message UpsertRecordRowsReq {
  common.AuthInfo auth_info = 1;
  repeated RecordMutation mutations = 2;
  string request_id = 3;
}

// UpsertRecordRowsRsp 返回已经提交的完整 Record 行。
message UpsertRecordRowsRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRow rows = 2;
}

// RecordRowsCommittedEvent 表示 PrimaryStore 已经原子提交的完整 Record 行。
message RecordRowsCommittedEvent {
  string event_id = 1;
  string source_id = 2;
  uint64 commit_seq = 3;
  string committed_at = 4;
  repeated RecordRow rows = 5;
}

// WriteTimeSeriesRowsReq 表示写入时序事实数据行。
message WriteTimeSeriesRowsReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // rows 是待写入的时序数据行。
  repeated TimeSeriesRow rows = 2;
}

// WriteTimeSeriesRowsRsp 表示时序事实数据写入结果。
message WriteTimeSeriesRowsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
}

// ReadTimeSeriesRowsReq 表示读取时序事实数据。
message ReadTimeSeriesRowsReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // keys 是查询 key；范围读时 key.data_time 可为空，实际版本集合由 time_range 表达。
  repeated TimeSeriesKey keys = 2;
  // time_range 是闭区间时间范围；精确读时 start_time=end_time。
  TimeRange time_range = 3;
  // order 表示按 data_time 返回的顺序，默认升序。
  SortOrder order = 4;
  // column_names 是要返回的列名；为空时返回整行。
  repeated string column_names = 5;
  // page 是分页参数。
  common.Page page = 6;
}

// ReadTimeSeriesRowsRsp 表示时序事实数据读取结果。
message ReadTimeSeriesRowsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // rows 是读取到的时序数据行。
  repeated TimeSeriesRow rows = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// ReadRecordRowsReq 表示读取记录事实数据。
message ReadRecordRowsReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // keys 是查询 key；范围读时 record_id 可为空。
  repeated RecordKey keys = 2;
  reserved 3;
  reserved "version_range";
  // order 表示按 version 返回的顺序，默认升序。
  SortOrder order = 4;
  // column_names 是要返回的列名；为空时返回整行。
  repeated string column_names = 5;
  // page 是分页参数。
  common.Page page = 6;
  RecordReadMode mode = 7;
  RevisionRange revision_range = 8;
}

// ReadRecordRowsRsp 表示记录事实数据读取结果。
message ReadRecordRowsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // rows 是读取到的记录数据行。
  repeated RecordRow rows = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// ScanTimeSeriesRowsReq 是 ViewBuilder 使用的内部游标扫描请求。
// 它始终按 Dataset 扫描并且不会触发公开 Read 接口的全量保护逻辑。
message ScanTimeSeriesRowsReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string dataset_id = 3;
  TimeRange time_range = 4;
  repeated string column_names = 5;
  common.Page page = 6;
}

message ScanTimeSeriesRowsRsp {
  common.RetInfo ret_info = 1;
  repeated TimeSeriesRow rows = 2;
  common.PageResult page_result = 3;
}

// ScanRecordRowsReq 是 ViewBuilder 使用的内部游标扫描请求。
message ScanRecordRowsReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string dataset_id = 3;
  VersionRange version_range = 4;
  repeated string column_names = 5;
  common.Page page = 6;
}

message ScanRecordRowsRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRow rows = 2;
  common.PageResult page_result = 3;
}

message RecordAccessScope {
  string space_id = 1;
  repeated string dataset_ids = 2;
}

message OpenRecordAccessSnapshotReq {
  common.AuthInfo auth_info = 1;
  RecordAccessScope scope = 2;
  RecordReadMode mode = 3;
  TimeRange updated_time_range = 4;
}

message OpenRecordAccessSnapshotRsp {
  common.RetInfo ret_info = 1;
  string snapshot_id = 2;
  string source_id = 3;
  uint64 snapshot_commit_seq = 4;
}

message ReadRecordAccessSnapshotReq {
  common.AuthInfo auth_info = 1;
  string snapshot_id = 2;
  string dataset_id = 3;
  repeated string record_ids = 4;
}

message ReadRecordAccessSnapshotRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRow rows = 2;
}

message ScanRecordAccessSnapshotReq {
  common.AuthInfo auth_info = 1;
  string snapshot_id = 2;
  string dataset_id = 3;
  common.Page page = 4;
}

message ScanRecordAccessSnapshotRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRow rows = 2;
  common.PageResult page_result = 3;
}

message RenewRecordAccessSnapshotReq {
  common.AuthInfo auth_info = 1;
  string snapshot_id = 2;
}

message RenewRecordAccessSnapshotRsp {
  common.RetInfo ret_info = 1;
}

message CloseRecordAccessSnapshotReq {
  common.AuthInfo auth_info = 1;
  string snapshot_id = 2;
}

message CloseRecordAccessSnapshotRsp {
  common.RetInfo ret_info = 1;
}

message RecordAccessWatermarkReq {
  common.AuthInfo auth_info = 1;
  RecordAccessScope scope = 2;
}

message RecordAccessWatermarkRsp {
  common.RetInfo ret_info = 1;
  string source_id = 2;
  uint64 commit_seq = 3;
}

message ScanRecordAccessJournalReq {
  common.AuthInfo auth_info = 1;
  RecordAccessScope scope = 2;
  uint64 after_commit_seq = 3;
  uint64 through_commit_seq = 4;
  common.Page page = 5;
}

message ScanRecordAccessJournalRsp {
  common.RetInfo ret_info = 1;
  repeated RecordRowsCommittedEvent events = 2;
  uint64 scanned_through_commit_seq = 3;
  common.PageResult page_result = 4;
}

// Access 是用户侧事实数据读写入口。
service Access {
  // WriteTimeSeriesRows 写入固定 subject + freq 下按 data_time 演进的时序事实数据。
  rpc WriteTimeSeriesRows(WriteTimeSeriesRowsReq) returns (WriteTimeSeriesRowsRsp);
  // ReadTimeSeriesRows 按时序业务 key 与闭区间时间范围读取事实数据。
  rpc ReadTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
  // ReadRecordRows 按记录 ID 读取当前或历史修订。
  rpc ReadRecordRows(ReadRecordRowsReq) returns (ReadRecordRowsRsp);
  rpc UpsertRecordRows(UpsertRecordRowsReq) returns (UpsertRecordRowsRsp);
}

// AccessScan 是只提供给 ViewBuilder 的内部游标扫描服务。
// 它只配置在 tRPC 入口，不暴露到 Access 的 HTTP 公共接口。
service AccessScan {
  // ScanTimeSeriesRows 为 ViewBuilder 提供有界游标扫描。
  rpc ScanTimeSeriesRows(ScanTimeSeriesRowsReq) returns (ScanTimeSeriesRowsRsp);
  // ScanRecordRows 为 ViewBuilder 提供有界游标扫描。
  rpc ScanRecordRows(ScanRecordRowsReq) returns (ScanRecordRowsRsp);
  rpc OpenRecordAccessSnapshot(OpenRecordAccessSnapshotReq) returns (OpenRecordAccessSnapshotRsp);
  rpc ReadRecordAccessSnapshot(ReadRecordAccessSnapshotReq) returns (ReadRecordAccessSnapshotRsp);
  rpc ScanRecordAccessSnapshot(ScanRecordAccessSnapshotReq) returns (ScanRecordAccessSnapshotRsp);
  rpc RenewRecordAccessSnapshot(RenewRecordAccessSnapshotReq) returns (RenewRecordAccessSnapshotRsp);
  rpc CloseRecordAccessSnapshot(CloseRecordAccessSnapshotReq) returns (CloseRecordAccessSnapshotRsp);
  rpc RecordAccessWatermark(RecordAccessWatermarkReq) returns (RecordAccessWatermarkRsp);
  rpc ScanRecordAccessJournal(ScanRecordAccessJournalReq) returns (ScanRecordAccessJournalRsp);
}
