syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "rows.proto";
import "moox_common.proto";
import "common.proto";

// ResultColumn 表示 View 查询结果返回的一列。
message ResultColumn {
  // column_name 是返回给调用方的列名。
  string column_name = 1;
  // value_type 是列值的逻辑类型。
  FieldValueType value_type = 2;
  // origin_type 是列来源类型。
  ColumnOriginType origin_type = 3;
  // dataset_id 是列所属的事实数据集 ID；系统列或表达式列可为空。
  string dataset_id = 4;
  // origin_id 是来源 ID，例如 DatasetColumn、表达式或系统列名。
  string origin_id = 5;
}

// QueryTimeSeriesRowsReq 表示查询时序 View 数据。
// 该接口查询 DuckDB 中当前 active View 索引。
// View 索引是可重建的近期派生结果，不是完整事实存储。
// 完整历史以 PrimaryStore KV/Pebble 为准。
// CountTimeSeriesViewRowsReq 按标的统计 active View 索引里时间范围内的行数（同一时间点多个 series_tag 只计一次）。
message CountTimeSeriesViewRowsReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
  // selectors 需要 subject_id 与 freq；time_range 是左闭右开时间范围。
  repeated TimeSeriesSelector selectors = 4;
  TimeRange time_range = 5;
}

message QueryTimeSeriesRowsReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space_id 是 View 所属空间 ID。
  string space_id = 2;
  // view_id 是已登记的查询入口。
  string view_id = 3;
  // selectors 是时序范围查询条件；series_tag 未设置时匹配该 scope 下的全部序列。
  repeated TimeSeriesSelector selectors = 4;
  // time_range 是左闭右开时间范围。
  TimeRange time_range = 5;
  // column_names 是要返回的列名；为空时返回 View 默认列。
  repeated string column_names = 6;
  // filter 是结构化过滤条件。
  FilterSpec filter = 7;
  // sorts 是排序条件列表。
  repeated SortSpec sorts = 8;
  // page 是分页参数。
  common.Page page = 9;
  // limit 是预览/TopN 模式的返回上限。大于 0 时忽略 page offset，最多返回 limit 行。
  uint32 limit = 10;
  // total_mode 控制是否计算精确总数。
  common.TotalMode total_mode = 11;
  // pin 钉住多页读取使用的索引版本：与当前活动索引不一致（行被写入、修正或删除）表示索引已变化，
  // 调用方必须从头重读，不能混用两个版本的页。
  IndexVersion pin = 12;
}

// IndexVersion 标识一版活动索引。
message IndexVersion {
  string index_id = 1;
  uint64 revision = 2;
}

// QueryTimeSeriesRowsRsp 表示时序 View 数据查询结果。
message QueryTimeSeriesRowsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // columns 是返回列定义。
  repeated ResultColumn columns = 2;
  // rows 是读取到的时序数据行。
  repeated TimeSeriesRow rows = 3;
  // page_result 是分页结果。
  common.PageResult page_result = 4;
  // min_data_time、max_data_time 是回答本次查询的索引中最早、最晚一行的 data_time，两端都包含，是真实存在的行键。
  string min_data_time = 5;
  string max_data_time = 6;
  // complete 表示请求区间是否完全落在 [min_data_time, max_data_time] 内。
  bool complete = 7;
  // index 是回答本次查询的活动索引版本。
  IndexVersion index = 8;
  // retained_rows_per_series 是活动索引每个 (标的, 周期, 序列标签) 至少保留的最近行数，0 表示未知。
  // 取活动索引建立时使用的保留行数与当前配置中较小的一个：调大配置要等重建成功后才变大，调小立即生效。
  // 调用方用它与 min_data_time 一起判断活跃序列可回溯的深度。
  uint64 retained_rows_per_series = 9;
}

// SearchRecordRowsReq 表示搜索记录 View 数据。
// 该接口搜索 Bleve 中当前 active View 索引。
// View 索引是可重建的近期派生结果，不是完整事实存储。
// 完整历史以 PrimaryStore KV/Pebble 为准。
message SearchRecordRowsReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space_id 是 View 所属空间 ID。
  string space_id = 2;
  // view_id 是已登记的搜索入口。
  string view_id = 3;
  // keys 是记录查询 key；范围读时 key.version 可为空，实际版本集合由 version_range 表达。
  repeated RecordKey keys = 4;
  // text_query 是可选全文检索文本；为空时只按结构化条件搜索。
  string text_query = 5;
  // version_range 是可选版本范围。
  VersionRange version_range = 6;
  // filter 是结构化字段过滤，与 text_query 取 AND。
  FilterSpec filter = 7;
  // sorts 是排序条件列表。
  repeated SortSpec sorts = 8;
  // column_names 是要返回的列名；为空时返回 View 默认列。
  repeated string column_names = 9;
  // page 是分页参数。
  common.Page page = 10;
}

// SearchRecordRowsRsp 表示记录 View 数据搜索结果。
message SearchRecordRowsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // columns 是返回列定义。
  repeated ResultColumn columns = 2;
  // rows 是匹配的记录事实数据行。
  repeated RecordRow rows = 3;
  // page_result 是分页结果。
  common.PageResult page_result = 4;
  string min_data_time = 5;
  string max_data_time = 6;
  bool complete = 7;
}

// DataView 是用户侧 View 查询服务。
// View 索引是可从 PrimaryStore 重建的有界派生结果，不是完整事实存储；
// 完整历史以 PrimaryStore KV/Pebble 为准。索引生命周期统一由 view
// 角色调度驱动（首次建索引、原地加列、定时删除最旧数据、清理已删除 View 的索引）。
service DataView {
  // QueryTimeSeriesRows 查询 DuckDB 中当前 active View 索引。
  // View 索引是可重建的近期派生结果，不是完整事实存储。
  // 完整历史以 PrimaryStore KV/Pebble 为准。
  rpc QueryTimeSeriesRows(QueryTimeSeriesRowsReq) returns (QueryTimeSeriesRowsRsp);
  // CountTimeSeriesRows 按标的统计 active View 索引里的行数，只回传计数，供完整性检查先比对根数。
  rpc CountTimeSeriesRows(CountTimeSeriesViewRowsReq) returns (CountTimeSeriesRowsRsp);
  // SearchRecordRows 搜索 Bleve 中当前 active View 索引。
  // View 索引是可重建的近期派生结果，不是完整事实存储。
  // 完整历史以 PrimaryStore KV/Pebble 为准。
  rpc SearchRecordRows(SearchRecordRowsReq) returns (SearchRecordRowsRsp);
}
