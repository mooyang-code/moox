syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "rows.proto";
import "dataset_markers.proto";

message CommitInputReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string commit_id = 3;
  repeated string required_fields = 4;
  RowFieldUpsert row = 5;
}

message CommitInputRsp {
  common.RetInfo ret_info = 1;
  WriteReceipt receipt = 2;
}

message PatchFactorReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string commit_id = 3;
  string binding_version = 4;
  repeated string owned_fields = 5;
  RowFieldUpsert row = 6;
}

message PatchFactorRsp {
  common.RetInfo ret_info = 1;
  WriteReceipt receipt = 2;
}

message LookupWriteReceiptReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string commit_id = 3;
}

message LookupWriteReceiptRsp {
  common.RetInfo ret_info = 1;
  WriteReceipt receipt = 2;
}

message UpsertFieldsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  repeated RowFieldUpsert rows = 3;
  string source_event_id = 4;
  string write_source = 5;
}

message UpsertFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
}

message ReadFieldsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string dataset_id = 3;
  repeated RowKey keys = 4;
  repeated string field_ids = 5;
  repeated string attribute_keys = 6;
}

message ReadFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowFieldValues rows = 2;
  repeated RowKey existing_keys = 3;
}

message GetNodeStateReq {
  string node_id = 1;
  common.AuthInfo auth_info = 2;
}

message GetNodeStateRsp {
  common.RetInfo ret_info = 1;
  string node_id = 2;
  string status = 3;
}

message CleanupExpiredBucketsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string dataset_id = 3;
  string before_bucket_start = 4;
  string space_id = 5;
}

message CleanupExpiredBucketsRsp {
  common.RetInfo ret_info = 1;
  uint64 deleted_buckets = 2;
}

message AppendCollectorPeriodCompletedReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  CollectorPeriodCompletedMarker marker = 4;
}

message AppendCollectorPeriodCompletedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message AppendMergePeriodCompletedReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  MergePeriodCompletedMarker marker = 4;
}

message AppendMergePeriodCompletedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message AppendFactorPeriodComputedReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  FactorPeriodComputedMarker marker = 4;
}

message AppendFactorPeriodComputedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message AppendDatasetSyncPointMarkerReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  DatasetSyncPointMarker sync_point = 4;
}

message AppendDatasetSyncPointMarkerRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message GetFactorPeriodComputedMarkerReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  string dataset_id = 4;
  string trigger_event_id = 5;
  int64 period_time = 6;
}

message GetFactorPeriodComputedMarkerRsp {
  common.RetInfo ret_info = 1;
  bool found = 2;
  string event_id = 3;
  FactorPeriodComputedMarker marker = 4;
}

// DataNodeRuntime is the storage RPC surface; DataNode names the metadata entity.
service DataNodeRuntime {
  // UpsertFields applies partial updates; omitted fields and attributes are retained.
  rpc UpsertFields(UpsertFieldsReq) returns (UpsertFieldsRsp);
  rpc CommitInput(CommitInputReq) returns (CommitInputRsp);
  rpc PatchFactor(PatchFactorReq) returns (PatchFactorRsp);
  rpc LookupWriteReceipt(LookupWriteReceiptReq) returns (LookupWriteReceiptRsp);
	rpc ReadFields(ReadFieldsReq) returns (ReadFieldsRsp);
	rpc GetNodeState(GetNodeStateReq) returns (GetNodeStateRsp);
	rpc CleanupExpiredBuckets(CleanupExpiredBucketsReq) returns (CleanupExpiredBucketsRsp);
}

// DataNodeMarkerRuntime is kept separate from the legacy DataNodeRuntime
// surface so existing DataNode clients remain source compatible while marker
// writes gain an explicit, narrow internal API.
service DataNodeMarkerRuntime {
  rpc AppendCollectorPeriodCompleted(AppendCollectorPeriodCompletedReq) returns (AppendCollectorPeriodCompletedRsp);
  rpc AppendMergePeriodCompleted(AppendMergePeriodCompletedReq) returns (AppendMergePeriodCompletedRsp);
  rpc AppendFactorPeriodComputed(AppendFactorPeriodComputedReq) returns (AppendFactorPeriodComputedRsp);
  rpc AppendDatasetSyncPointMarker(AppendDatasetSyncPointMarkerReq) returns (AppendDatasetSyncPointMarkerRsp);
  rpc GetFactorPeriodComputedMarker(GetFactorPeriodComputedMarkerReq) returns (GetFactorPeriodComputedMarkerRsp);
}

// DataNodeHistoryRuntime is an internal range-scan surface used only when a
// View is initialized from Primary history. It is kept separate from the
// point-read/write service so existing runtime fakes and callers remain
// narrow, while the View can rebuild after its physical indexes are removed.
service DataNodeHistoryRuntime {
	 rpc ReadTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
}
