syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "rows.proto";
import "dataset_markers.proto";


message DatasetPeriodSeries {
  uint32 series_index = 1;
  string subject_id = 2;
  string series_tag = 3;
}

message DatasetPeriodExpectation {
  string space_id = 1;
  string dataset_id = 2;
  string frequency = 3;
  int64 period_time = 4;
  string series_hash = 5;
  uint32 expected_count = 6;
  int64 deadline_at = 7;
  repeated DatasetPeriodSeries series_snapshot = 8;
  string reservation_id = 9;
}

message EnsureDatasetPeriodReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  DatasetPeriodExpectation expectation = 3;
}

message EnsureDatasetPeriodRsp {
  common.RetInfo ret_info = 1;
  string status = 2;
  int64 deadline_at = 3;
}

message GetDatasetPeriodStatusReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  // 只需周期键（space_id、dataset_id、frequency、period_time）；series_hash 为空时按周期键查询，
  // 周期不存在返回 found=false 而不是错误。带 series_hash 的旧形态仍按旧语义校验身份。
  DatasetPeriodExpectation expectation = 3;
  // 为 true 时返回成功数与缺失序号。
  bool include_progress = 4;
}

message GetDatasetPeriodStatusRsp {
  common.RetInfo ret_info = 1;
  string status = 2;
  string series_hash = 3;
  uint32 expected_count = 4;
  int64 deadline_at = 5;
  bool found = 6;
  uint32 successful_count = 7;
  // 期望集合减去成功位图；未触发的序列同样缺失。
  repeated uint32 missing_series_indexes = 8;
}

// SeriesSnapshotEntry 是快照中一条序列的完整身份，Storage 用它重算 series_hash。
message SeriesSnapshotEntry {
  string provider = 1;
  string source_id = 2;
  string market_type = 3;
  string subject_id = 4;
  string series_tag = 5;
}

message RegisterSeriesSnapshotReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  string dataset_id = 4;
  string frequency = 5;
  repeated SeriesSnapshotEntry series = 6;
  // 生效周期 P：K 线开始时间（Unix 秒）。
  int64 effective_from = 7;
}

message RegisterSeriesSnapshotRsp {
  common.RetInfo ret_info = 1;
  string series_hash = 2;
  uint32 expected_count = 3;
  bool already_registered = 4;
}

message TimeSeriesBatchRow {
  uint32 series_index = 1;
  RowFieldUpsert row = 2;
}

message CommitTimeSeriesBatchReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  DatasetPeriodExpectation expectation = 3;
  repeated TimeSeriesBatchRow items = 4;
  string source_event_id = 5;
  string write_source = 6;
  // 周期不存在时，按生效表与已登记快照自动建立周期所用的允许迟到时间；由 Primary 从数据集属性带入。
  int64 allowed_lateness_seconds = 7;
}

message CommitTimeSeriesBatchRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
  string period_status = 3;
  repeated uint32 accepted_series_indexes = 4;
}

message RecordDatasetPeriodFailuresReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  DatasetPeriodExpectation expectation = 3;
  repeated uint32 series_indexes = 4;
}

message RecordDatasetPeriodFailuresRsp {
  common.RetInfo ret_info = 1;
  string period_status = 2;
  repeated DatasetPeriodFailureResult results = 3;
}

enum PeriodFailureDisposition {
  PERIOD_FAILURE_DISPOSITION_UNSPECIFIED = 0;
  PERIOD_FAILURE_DISPOSITION_RECORDED = 1;
  PERIOD_FAILURE_DISPOSITION_ALREADY_SUCCEEDED = 2;
  PERIOD_FAILURE_DISPOSITION_MISSED_DEADLINE = 3;
}

message DatasetPeriodFailureResult {
  uint32 series_index = 1;
  PeriodFailureDisposition disposition = 2;
}

message WriteFactorRowsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  string dataset_id = 4;
  string commit_id = 5;
  repeated RowFieldUpsert rows = 6;
}

message WriteFactorRowsRsp {
  common.RetInfo ret_info = 1;
  uint64 rows_written = 2;
}

message UpsertFieldsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  repeated RowFieldUpsert rows = 3;
  string source_event_id = 4;
  string write_source = 5;
}

message UpsertFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
}

message ReadFieldsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string dataset_id = 3;
  repeated RowKey keys = 4;
  repeated string field_ids = 5;
  repeated string attribute_keys = 6;
}

message ReadFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowFieldValues rows = 2;
  repeated RowKey existing_keys = 3;
}

message GetNodeStateReq {
  string node_id = 1;
  common.AuthInfo auth_info = 2;
}

message GetNodeStateRsp {
  common.RetInfo ret_info = 1;
  string node_id = 2;
  string status = 3;
}

message CleanupExpiredBucketsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string dataset_id = 3;
  string before_bucket_start = 4;
  string space_id = 5;
}

message CleanupExpiredBucketsRsp {
  common.RetInfo ret_info = 1;
  // deleted_ranges is the number of key ranges the cleanup deleted.
  uint64 deleted_ranges = 2;
}

message DeleteDatasetRowsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  string dataset_id = 4;
}

message DeleteDatasetRowsRsp {
  common.RetInfo ret_info = 1;
  uint64 deleted_ranges = 2;
}

message RestoreDatasetRowsReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  string dataset_id = 4;
}

message RestoreDatasetRowsRsp {
  common.RetInfo ret_info = 1;
}

message AppendCollectorPeriodCompletedReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  CollectorPeriodCompletedMarker marker = 4;
}

message AppendCollectorPeriodCompletedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message AppendFactorPeriodComputedReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  FactorPeriodComputedMarker marker = 4;
}

message AppendFactorPeriodComputedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message AppendDatasetSyncPointMarkerReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  DatasetSyncPointMarker sync_point = 4;
}

message AppendDatasetSyncPointMarkerRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message GetFactorPeriodComputedMarkerReq {
  common.AuthInfo auth_info = 1;
  string node_id = 2;
  string space_id = 3;
  string dataset_id = 4;
  string trigger_event_id = 5;
  int64 period_time = 6;
}

message GetFactorPeriodComputedMarkerRsp {
  common.RetInfo ret_info = 1;
  bool found = 2;
  string event_id = 3;
  FactorPeriodComputedMarker marker = 4;
}

// DataNodeRuntime is the storage RPC surface; DataNode names the metadata entity.
service DataNodeRuntime {
  // UpsertFields applies partial updates; omitted fields and attributes are retained.
  rpc UpsertFields(UpsertFieldsReq) returns (UpsertFieldsRsp);
  rpc WriteFactorRows(WriteFactorRowsReq) returns (WriteFactorRowsRsp);
	rpc ReadFields(ReadFieldsReq) returns (ReadFieldsRsp);
	rpc GetNodeState(GetNodeStateReq) returns (GetNodeStateRsp);
	rpc CleanupExpiredBuckets(CleanupExpiredBucketsReq) returns (CleanupExpiredBucketsRsp);
}


// DataNodePeriodRuntime owns Dataset-local collection progress. It is separate
// from the general row RPC so existing DataNodeRuntime clients remain narrow.
service DataNodePeriodRuntime {
  rpc RegisterSeriesSnapshot(RegisterSeriesSnapshotReq) returns (RegisterSeriesSnapshotRsp);
  rpc EnsureDatasetPeriod(EnsureDatasetPeriodReq) returns (EnsureDatasetPeriodRsp);
  rpc GetDatasetPeriodStatus(GetDatasetPeriodStatusReq) returns (GetDatasetPeriodStatusRsp);
  rpc CommitTimeSeriesBatch(CommitTimeSeriesBatchReq) returns (CommitTimeSeriesBatchRsp);
  rpc RecordDatasetPeriodFailures(RecordDatasetPeriodFailuresReq) returns (RecordDatasetPeriodFailuresRsp);
}

// DataNodeDatasetAdminRuntime is a narrow destructive surface used by
// PrimaryStore after a caller has passed dataset/task ownership checks.
service DataNodeDatasetAdminRuntime {
  rpc DeleteDatasetRows(DeleteDatasetRowsReq) returns (DeleteDatasetRowsRsp);
  rpc RestoreDatasetRows(RestoreDatasetRowsReq) returns (RestoreDatasetRowsRsp);
}

// DataNodeMarkerRuntime is kept separate from the legacy DataNodeRuntime
// surface so existing DataNode clients remain source compatible while marker
// writes gain an explicit, narrow internal API.
service DataNodeMarkerRuntime {
  rpc AppendCollectorPeriodCompleted(AppendCollectorPeriodCompletedReq) returns (AppendCollectorPeriodCompletedRsp);
  rpc AppendFactorPeriodComputed(AppendFactorPeriodComputedReq) returns (AppendFactorPeriodComputedRsp);
  rpc AppendDatasetSyncPointMarker(AppendDatasetSyncPointMarkerReq) returns (AppendDatasetSyncPointMarkerRsp);
  rpc GetFactorPeriodComputedMarker(GetFactorPeriodComputedMarkerReq) returns (GetFactorPeriodComputedMarkerRsp);
}

// DataNodeHistoryRuntime is an internal range-scan surface used only when a
// View is initialized from Primary history. It is kept separate from the
// point-read/write service so existing runtime fakes and callers remain
// narrow, while the View can rebuild after its physical indexes are removed.
service DataNodeHistoryRuntime {
	 rpc ReadTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
	 rpc ListHistorySubjects(ListHistorySubjectsReq) returns (ListHistorySubjectsRsp);
}
