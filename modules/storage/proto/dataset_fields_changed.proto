syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "rows.proto";

// RowsUpserted is retained as the row payload schema while the outer
// event contract lives in packages/events.EventMessage.
message RowsUpserted {
  string space_id = 1;
  string dataset_id = 2;
  repeated RowFieldUpsert rows = 3;
}
