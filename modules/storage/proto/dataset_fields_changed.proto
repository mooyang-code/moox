syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "rows.proto";

// DatasetFieldsChanged is the durable field-upsert event. Ordering and
// delivery are provided by the transport; no source sequence is embedded.
message DatasetFieldsChanged {
  string space_id = 1;
  string dataset_id = 2;
  repeated RowFieldUpsert rows = 3;
}
