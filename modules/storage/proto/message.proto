syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/gen;storagepb";

import "access.proto";

// TimeSeriesRowsUpdated 表示一次时序主存写入成功后的更新流水。
// 派生消费者应使用 rows 直接物化，不应再按 key 回读 PrimaryStore。
message TimeSeriesRowsUpdated {
  // message_id 是本条写入流水的消息 ID。
  string message_id = 1;
  // written_at 是主存写入成功时间（RFC3339Nano）。
  string written_at = 2;
  // space_id / dataset_id 便于路由到关联 View（可与 rows[].key 一致，避免解析每行）。
  string space_id = 3;
  string dataset_id = 4;
  // rows 是本批写入涉及的时序行（可跨多 subject）。
  repeated TimeSeriesRow rows = 5;
  // attributes 是附加属性。
  map<string, string> attributes = 6;
}

// RecordRowsUpdated 表示一次记录主存写入成功后的更新流水。
message RecordRowsUpdated {
  // message_id 是本条写入流水的消息 ID。
  string message_id = 1;
  // written_at 是主存写入成功时间（RFC3339Nano）。
  string written_at = 2;
  // space_id / dataset_id 便于路由到关联 View（可与 rows[].key 一致，避免解析每行）。
  string space_id = 3;
  string dataset_id = 4;
  // rows 是本批写入涉及的记录行。
  repeated RecordRow rows = 5;
  // attributes 是附加属性。
  map<string, string> attributes = 6;
}
