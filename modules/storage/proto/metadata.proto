// ListDevicesReq 表示列出设备的请求。
message ListDevicesReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // engine 是可选存储引擎过滤条件。
  string engine = 2;
  // page 是分页参数。
  common.Page page = 3;
}

// ListDevicesRsp 表示列出设备的响应。
message ListDevicesRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // devices 是设备列表。
  repeated Device devices = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

message UpsertViewPeriodDatasetStateReq {
  common.AuthInfo auth_info = 1;
  ViewPeriodDatasetState state = 2;
}

message UpsertViewPeriodDatasetStateRsp {
  common.RetInfo ret_info = 1;
  ViewPeriodDatasetState state = 2;
}

message ListViewPeriodDatasetStatesReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
  string frequency = 4;
  int64 period_time = 5;
}

message ListViewPeriodDatasetStatesRsp {
  common.RetInfo ret_info = 1;
  repeated ViewPeriodDatasetState states = 2;
}

message RecordViewSyncPointReq {
  common.AuthInfo auth_info = 1;
  ViewSyncPoint sync_point = 2;
}

message RecordViewSyncPointRsp {
  common.RetInfo ret_info = 1;
  ViewSyncPoint sync_point = 2;
}

// CompleteViewInitialBuildReq 在首次建索引（含回填）完成后提交活动索引与已建列。
message CompleteViewInitialBuildReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
  string index_id = 4;
  repeated ViewColumn columns = 5;
  string view_schema_hash = 6;
}

message CompleteViewInitialBuildRsp {
  common.RetInfo ret_info = 1;
  View view = 2;
}

// CommitViewSchemaExtensionReq 在索引原地追加列之后提交新的已建列。
message CommitViewSchemaExtensionReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
  string active_index_id = 4;
  uint64 expected_view_revision = 5;
  string expected_schema_hash = 6;
  repeated ViewColumn columns = 7;
  string view_schema_hash = 8;
}

message CommitViewSchemaExtensionRsp {
  common.RetInfo ret_info = 1;
  View view = 2;
}

// Metadata 管理量化存储系统的核心元数据。
service Metadata {
  // 创建使用空间。
  rpc CreateSpace(CreateSpaceReq) returns (CreateSpaceRsp);
  // 更新使用空间。
  rpc UpdateSpace(UpdateSpaceReq) returns (UpdateSpaceRsp);
  // 删除使用空间及其级联元数据。
  rpc DeleteSpace(DeleteSpaceReq) returns (DeleteSpaceRsp);
  // 按 ID 获取使用空间。
  rpc GetSpace(GetSpaceReq) returns (GetSpaceRsp);
  // 列出使用空间。
  rpc ListSpaces(ListSpacesReq) returns (ListSpacesRsp);

  // 创建查询视图。
  rpc CreateView(CreateViewReq) returns (CreateViewRsp);
  // 更新查询视图。
  rpc UpdateView(UpdateViewReq) returns (UpdateViewRsp);
  // 物理删除查询视图及其依赖行。
  rpc DeleteView(DeleteViewReq) returns (DeleteViewRsp);
  // 按 ID 获取查询视图。
  rpc GetView(GetViewReq) returns (GetViewRsp);
  // 列出查询视图。
  rpc ListViews(ListViewsReq) returns (ListViewsRsp);
  // 创建或更新视图列。
  rpc UpsertViewColumn(UpsertViewColumnReq) returns (UpsertViewColumnRsp);
  // 列出视图列。
  rpc ListViewColumns(ListViewColumnsReq) returns (ListViewColumnsRsp);
  // 首次建索引完成：写入活动索引与已建列，View 从此可读。
  rpc CompleteViewInitialBuild(CompleteViewInitialBuildReq) returns (CompleteViewInitialBuildRsp);
  // 索引原地追加列之后，提交新的已建列。
  rpc CommitViewSchemaExtension(CommitViewSchemaExtensionReq) returns (CommitViewSchemaExtensionRsp);
  rpc UpsertViewPeriodDatasetState(UpsertViewPeriodDatasetStateReq) returns (UpsertViewPeriodDatasetStateRsp);
  rpc ListViewPeriodDatasetStates(ListViewPeriodDatasetStatesReq) returns (ListViewPeriodDatasetStatesRsp);
  rpc RecordViewSyncPoint(RecordViewSyncPointReq) returns (RecordViewSyncPointRsp);

  // 创建数据来源。
  rpc CreateDataSource(CreateDataSourceReq) returns (CreateDataSourceRsp);
  // 更新数据来源。
  rpc UpdateDataSource(UpdateDataSourceReq) returns (UpdateDataSourceRsp);
  // 删除数据来源。
  rpc DeleteDataSource(DeleteDataSourceReq) returns (DeleteDataSourceRsp);
  // 按 ID 获取数据来源。
  rpc GetDataSource(GetDataSourceReq) returns (GetDataSourceRsp);
  // 列出数据来源。
  rpc ListDataSources(ListDataSourcesReq) returns (ListDataSourcesRsp);

  // 创建或更新数据对象。
  rpc UpsertSubject(UpsertSubjectReq) returns (UpsertSubjectRsp);
  // 按 ID 获取数据对象。
  rpc GetSubject(GetSubjectReq) returns (GetSubjectRsp);
  // 列出数据对象。
  rpc ListSubjects(ListSubjectsReq) returns (ListSubjectsRsp);
  rpc UpsertTag(UpsertTagReq) returns (UpsertTagRsp);
  rpc GetTag(GetTagReq) returns (GetTagRsp);
  rpc ListTags(ListTagsReq) returns (ListTagsRsp);
  rpc DeleteTag(DeleteTagReq) returns (DeleteTagRsp);
  rpc ListTagMembers(ListTagMembersReq) returns (ListTagMembersRsp);
  rpc AddTagMembers(TagMembersReq) returns (TagMembersRsp);
  rpc RemoveTagMembers(TagMembersReq) returns (TagMembersRsp);
  rpc SetTagMemberStatus(SetTagMemberStatusReq) returns (TagMembersRsp);
  rpc ApplyTagSnapshot(ApplyTagSnapshotReq) returns (ApplyTagSnapshotRsp);
  rpc UpdateSubjectAttributes(UpdateSubjectAttributesReq) returns (UpdateSubjectAttributesRsp);
  rpc ResolveSubjects(ResolveSubjectsReq) returns (ResolveSubjectsRsp);

  // 创建数据集。
  rpc CreateDataset(CreateDatasetReq) returns (CreateDatasetRsp);
  // 更新数据集。
  rpc UpdateDataset(UpdateDatasetReq) returns (UpdateDatasetRsp);
  // 删除数据集。
  rpc DeleteDataset(DeleteDatasetReq) returns (DeleteDatasetRsp);
  // 按 ID 获取数据集。
  rpc GetDataset(GetDatasetReq) returns (GetDatasetRsp);
  // 列出数据集。
  rpc ListDatasets(ListDatasetsReq) returns (ListDatasetsRsp);
  // 仅限离线运维：暂停写入并完成数据迁移后，更换 disabled Dataset 的 DataNode 绑定。
  rpc RebindDatasetDataNode(RebindDatasetDataNodeReq) returns (RebindDatasetDataNodeRsp);
  // 只读检查 Dataset 是否满足激活条件。
  rpc CheckDatasetActivation(CheckDatasetActivationReq) returns (CheckDatasetActivationRsp);
  // 使用 revision CAS 激活 Dataset。
  rpc ActivateDataset(ActivateDatasetReq) returns (ActivateDatasetRsp);
  // 列出 Dataset 覆盖的 Subject。
  rpc ListDatasetSubjects(ListDatasetSubjectsReq) returns (ListDatasetSubjectsRsp);

  // 创建普通字段。
  rpc CreateFieldGroup(CreateFieldGroupReq) returns (CreateFieldGroupRsp);
  // 更新字段组。
  rpc UpdateFieldGroup(UpdateFieldGroupReq) returns (UpdateFieldGroupRsp);
  // 按字段组 ID 获取字段组。
  rpc GetFieldGroup(GetFieldGroupReq) returns (GetFieldGroupRsp);
  // 列出字段组。
  rpc ListFieldGroups(ListFieldGroupsReq) returns (ListFieldGroupsRsp);

  // 创建普通字段。
  rpc CreateField(CreateFieldReq) returns (CreateFieldRsp);
  // 更新普通字段。
  rpc UpdateField(UpdateFieldReq) returns (UpdateFieldRsp);
  // 按字段 ID 获取字段。
  rpc GetField(GetFieldReq) returns (GetFieldRsp);
  // 列出普通字段。
  rpc ListFields(ListFieldsReq) returns (ListFieldsRsp);
  // 批量移动字段组或更新状态。
  rpc BatchUpdateFields(BatchUpdateFieldsReq) returns (BatchUpdateFieldsRsp);
  // 删除没有子组和字段引用的空字段组。
  rpc DeleteFieldGroup(DeleteFieldGroupReq) returns (DeleteFieldGroupRsp);

  // 创建或更新数据集列。
  rpc UpsertDatasetColumn(UpsertDatasetColumnReq) returns (UpsertDatasetColumnRsp);
  // 列出数据集列。
  rpc ListDatasetColumns(ListDatasetColumnsReq) returns (ListDatasetColumnsRsp);

  // 注册或刷新 DataNode。
  rpc RegisterDataNode(RegisterDataNodeReq) returns (RegisterDataNodeRsp);
  // 更新 DataNode 名称和状态。
  rpc UpdateDataNode(UpdateDataNodeReq) returns (UpdateDataNodeRsp);
  // 按 ID 获取 DataNode。
  rpc GetDataNode(GetDataNodeReq) returns (GetDataNodeRsp);
  // 分页列出 DataNode 及其 Dataset 摘要。
  rpc ListDataNodes(ListDataNodesReq) returns (ListDataNodesRsp);
  // 删除满足约束的 DataNode。
  rpc DeleteDataNode(DeleteDataNodeReq) returns (DeleteDataNodeRsp);

  // 创建设备。
  rpc CreateDevice(CreateDeviceReq) returns (CreateDeviceRsp);
  // 更新设备。
  rpc UpdateDevice(UpdateDeviceReq) returns (UpdateDeviceRsp);
  // 按 ID 获取设备。
  rpc GetDevice(GetDeviceReq) returns (GetDeviceRsp);
  // 列出设备。
  rpc ListDevices(ListDevicesReq) returns (ListDevicesRsp);

}
