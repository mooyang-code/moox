  VIEW_REBUILD_TRIGGER_ACTIVE_MISSING = 3;
  VIEW_REBUILD_TRIGGER_ACTIVE_INVALID = 4;
  VIEW_REBUILD_TRIGGER_COVERAGE_REPAIR = 5;
  VIEW_REBUILD_TRIGGER_SIZE_LIMIT = 6;
  VIEW_REBUILD_TRIGGER_MANUAL_REPAIR = 7;
