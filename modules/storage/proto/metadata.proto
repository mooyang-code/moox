  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // value_type 是可选字段类型过滤条件。
  FieldValueType value_type = 3;
  // page 是分页参数。
  common.Page page = 4;
  // group_id 是可选字段组过滤条件。
  string group_id = 5;
  // status 是可选字段状态过滤条件。
  string status = 6;
