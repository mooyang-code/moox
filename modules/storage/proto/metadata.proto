syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "dataset_markers.proto";

// Space 是业务命名空间，也是用户可见数据集的集合。
message Space {
  // space_id 是使用空间 ID；本文所有“全局”概念均限定在该空间内。
  string space_id = 1;
  // name 是空间名称，通常用于管理台展示。
  string name = 2;
  // description 是说明文本。
  string description = 3;
  // owner 是空间拥有者，可以是用户、团队或系统任务。
  string owner = 4;
  // status 取值 active 或 disabled。
  string status = 5;
  // created_at 是创建时刻，Unix 毫秒。
  int64 created_at = 6;
  // updated_at 是最后更新时刻，Unix 毫秒。
  int64 updated_at = 7;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 8;
  // market 是空间所属市场，取值见种子 config/setup/metadata.yaml：crypto、CN、HK、US。
  string market = 9;
  // timezone 是空间的展示时区（IANA 名称，如 Asia/Shanghai），管理台全站时间按它显示。
  string timezone = 10;
}

// DataSource 是 Space 内一个可引用的数据来源名字；业务含义放在 attributes，Storage 不解释。
message DataSource {
  // space_id 是 DataSource 所属 Space。
  string space_id = 1;
  // data_source_id 是 Space 内唯一的数据来源 ID。
  string data_source_id = 2;
  // name 是数据来源名称，通常用于管理台展示。
  string name = 3;
  // status 取值 active 或 disabled。
  string status = 4;
  // created_at 是创建时刻，Unix 毫秒。
  int64 created_at = 5;
  // updated_at 是最后更新时刻，Unix 毫秒。
  int64 updated_at = 6;
  // attributes 是写入方维护的扩展属性，Storage 原样保存。
  map<string, string> attributes = 7;
}

// Tag 是一组 Subject；业务含义（市场、同步配置等）放在 attributes，Storage 不解释。
message Tag {
  string space_id = 1;
  string tag_id = 2;
  string tag_name = 3;
  string description = 4;
  string mode = 5;
  bool builtin = 6;
  uint32 active_count = 7;
  uint32 inactive_count = 8;
  // Unix 毫秒。
  int64 created_at = 9;
  int64 updated_at = 10;
  // attributes 是写入方维护的扩展属性，Storage 原样保存；改动会递增标的修订号。
  map<string, string> attributes = 11;
}

// TagMember 是标签成员；tag_id 为空时 tag_ids 列出所属标签。
message TagMember {
  string space_id = 1;
  string tag_id = 2;
  string status = 3;
  // inactive_at 是成员失效时刻（Unix 毫秒），在册成员为 0。
  int64 inactive_at = 4;
  Subject subject = 5;
  repeated string tag_ids = 6;
  // trading_status 是成员在这个标签（即这个市场）上的交易状态：trading、suspended 或 delisted，由 Collector 的交易状态检测写入。
  // 按标签成员记录，因为 crypto 的现货、永续共用同一个 Subject，可能只有一边停牌。
  string trading_status = 7;
}

message TagSnapshotItem {
  string subject_id = 1;
  string name = 2;
  string timezone = 3;
  map<string, string> attributes = 4;
}

message SubjectAttributes {
  string subject_id = 1;
  string name = 2;
  map<string, string> attributes = 3;
}

message TagReference {
  string dataset_id = 1;
  string dataset_name = 2;
  string collector_task_id = 3;
}

// Subject 表示 Space 内的数据对象；类型、市场、币种等业务字段放在 attributes，Storage 不解释。
message Subject {
  // space_id 是 Subject 所属 Space。
  string space_id = 1;
  // subject_id 是 Space 内唯一的数据对象 ID。
  string subject_id = 2;
  // name 是对象名称，通常用于管理台展示。
  string name = 3;
  // timezone 是该对象默认时区。
  string timezone = 4;
  // status 取值 active 或 disabled；disabled 仅表示人工停用。
  string status = 5;
  // created_at 是创建时刻，Unix 毫秒。
  int64 created_at = 6;
  // updated_at 是最后更新时刻，Unix 毫秒。
  int64 updated_at = 7;
  // attributes 是写入方维护的扩展属性，Storage 原样保存；改动会递增标的修订号。
  map<string, string> attributes = 8;
}

// Dataset 是 Space 内可写的事实数据集，定义一类数据及其列契约。
// 每个数据集恰好有一个查询索引（View），随数据集建、随数据集删；时序用 DuckDB，记录用 Bleve。
message Dataset {
  // space_id 是 Dataset 所属 Space。
  string space_id = 1;
  // dataset_id 是 Space 内唯一的数据集 ID；必须为 lower_snake_case，最长 50 字符。
  string dataset_id = 2;
  // data_source_id 是该 Dataset 绑定的数据来源 ID；一个 Dataset 只绑定一个 DataSource。
  string data_source_id = 3;
  // name 是数据集中文展示名，创建和更新时必须包含中文且不超过 10 个字符。
  string name = 4;
  // description 是说明文本。
  string description = 5;
  // data_kind 是数据集的结构形态。
  DataKind data_kind = 6;
  // freq 是时序 Dataset 的唯一频率，必须是规范值（见 packages/frequency），创建后不可修改；
  // 记录型 Dataset 可以为空或使用描述性取值。
  string freq = 7;
  // status 取值 active 或 disabled。
  string status = 8;
  // created_at 是创建时刻，Unix 毫秒。
  int64 created_at = 9;
  // updated_at 是最后更新时刻，Unix 毫秒。
  int64 updated_at = 10;
  // attributes 是调用方自用的扩展属性，Storage 不解释。
  map<string, string> attributes = 11;
  // retention 是只读的生效保留期，由 Storage 策略文件按 (space_id, freq) 解析，取值为 "<n>h" 或
  // "forever"；记录型 Dataset 为 "forever"。写接口忽略该字段。
  string retention = 18;
  // revision 是 Dataset 元数据的单调递增修订号，用于并发控制。
  uint64 revision = 20;
  // subject_tags 是数据集标的范围，取值为 tag_id。
  repeated string subject_tags = 21;
  // retention_source 是 retention 的来源（只读）：default、space 或 record。
  string retention_source = 22;
  // alignment 是周期对齐方式：epoch_utc 按 epoch 边界切分；session 按各交易时段开盘切分（A 股等），快照生效点只要求整分钟。
  string alignment = 23;
  // allowed_lateness_seconds 是周期截止前允许迟到的秒数；0 表示使用 Storage 的默认值。
  uint32 allowed_lateness_seconds = 24;
  // maintenance_priority 是查询索引维护（建索引、加列、删最旧行）的先后：越小越先，0（默认）最先；更新时 0 表示沿用已有值。
  uint32 maintenance_priority = 25;
}

// DatasetSubject 表示 Dataset 覆盖的 Subject 集合。
message DatasetSubject {
  // space_id 是绑定关系所属 Space。
  string space_id = 1;
  // dataset_id 是数据集 ID。
  string dataset_id = 2;
  // subject_id 是业务对象 ID。
  string subject_id = 3;
  string status = 4;
  // suspended 表示没有“成员与标的都 active、而且可交易”的绑定，但至少有一个绑定只因 trading_status = suspended 才不活跃。
  // 策略靠它区分“停牌”与“停牌后又被移出标签”；delisted 不算。
  bool suspended = 5;
}

// DatasetColumn 表示 Dataset 下允许写入和读取的一列；列自描述：名称、类型、显示名、分组、状态都在列上。
message DatasetColumn {
  // space_id 是 DatasetColumn 所属 Space。
  string space_id = 1;
  // dataset_id 是数据集 ID。
  string dataset_id = 2;
  // column_name 是列的唯一身份，写入与读取都只认它。
  string column_name = 3;
  // value_type 是列值的逻辑类型，建列后不能修改。
  FieldValueType value_type = 4;
  // display_name 是界面显示名，必填；由建列的模块写入，Storage 只校验非空。
  string display_name = 5;
  // group 是界面上的分组名（中文，一级），可以为空。
  string group = 6;
  // required 表示导入数据时该列是否必须存在。
  bool required = 7;
  // aliases 是导入数据时可识别的列名别名。
  repeated string aliases = 8;
  // status 取值 active 或 disabled：disabled 的列不再写入，读取时隐藏，数据保留。
  string status = 9;
  // created_at 是创建时刻，Unix 毫秒。
  int64 created_at = 10;
  // updated_at 是最后更新时刻，Unix 毫秒。
  int64 updated_at = 11;
  // attributes 是写入方自用的扩展属性（fill、member_kind 等），Storage 不解释。
  map<string, string> attributes = 12;
}

// CreateSpaceReq 表示创建使用空间的请求。
message CreateSpaceReq {
  // space 是待创建的使用空间元数据。
  Space space = 2;
}

// CreateSpaceRsp 表示创建使用空间的响应。
message CreateSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是创建后的使用空间元数据。
  Space space = 2;
}

// UpdateSpaceReq 表示更新使用空间的请求。
message UpdateSpaceReq {
  // space 是更新后的使用空间元数据。
  Space space = 2;
}

// UpdateSpaceRsp 表示更新使用空间的响应。
message UpdateSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是更新后的使用空间元数据。
  Space space = 2;
}

// DeleteSpaceReq 表示删除一个使用空间：连同空间里的数据集、View 与全部行数据一起删除，不能恢复。
message DeleteSpaceReq {
  string space_id = 2;
}

// DeleteSpaceRsp 表示删除使用空间的结果。
message DeleteSpaceRsp {
  common.RetInfo ret_info = 1;
}

// GetSpaceReq 表示获取使用空间的请求。
message GetSpaceReq {
  // space_id 是使用空间 ID。
  string space_id = 2;
}

// GetSpaceRsp 表示获取使用空间的响应。
message GetSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是使用空间元数据。
  Space space = 2;
}

// ListSpacesReq 表示列出使用空间的请求。
message ListSpacesReq {
  // owner 是可选拥有者过滤条件。
  string owner = 2;
  // page 是分页参数。
  common.Page page = 3;
  // status 是可选状态过滤条件：active、disabled。
  string status = 4;
}

// ListSpacesRsp 表示列出使用空间的响应。
message ListSpacesRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // spaces 是使用空间列表。
  repeated Space spaces = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// CreateDataSourceReq 表示创建数据来源的请求。
message CreateDataSourceReq {
  // data_source 是待创建的数据来源元数据。
  DataSource data_source = 2;
}

// CreateDataSourceRsp 表示创建数据来源的响应。
message CreateDataSourceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // data_source 是创建后的数据来源元数据。
  DataSource data_source = 2;
}

// UpdateDataSourceReq 表示更新数据来源的请求。
message UpdateDataSourceReq {
  // data_source 是更新后的数据来源元数据。
  DataSource data_source = 2;
}

// UpdateDataSourceRsp 表示更新数据来源的响应。
message UpdateDataSourceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // data_source 是更新后的数据来源元数据。
  DataSource data_source = 2;
}

// DeleteDataSourceReq 表示删除一个没有数据集引用的数据来源。
message DeleteDataSourceReq {
  string space_id = 2;
  string data_source_id = 3;
}

// DeleteDataSourceRsp 表示删除数据来源的结果。
message DeleteDataSourceRsp {
  common.RetInfo ret_info = 1;
}

// GetDataSourceReq 表示获取数据来源的请求。
message GetDataSourceReq {
  // space_id 是使用空间 ID。
  string space_id = 2;
  // data_source_id 是数据来源 ID。
  string data_source_id = 3;
}

// GetDataSourceRsp 表示获取数据来源的响应。
message GetDataSourceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // data_source 是数据来源元数据。
  DataSource data_source = 2;
}

// ListDataSourcesReq 表示列出数据来源的请求。
message ListDataSourcesReq {
  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // page 是分页参数。
  common.Page page = 3;
  // keyword 是按来源 ID 或名称进行模糊搜索的关键词。
  string keyword = 4;
}

// ListDataSourcesRsp 表示列出数据来源的响应。
message ListDataSourcesRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // data_sources 是数据来源列表。
  repeated DataSource data_sources = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// UpsertSubjectReq 表示创建或更新数据对象的请求。
message UpsertSubjectReq {
  // subject 是待写入的数据对象元数据。
  Subject subject = 2;
}

// UpsertSubjectRsp 表示创建或更新数据对象的响应。
message UpsertSubjectRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // subject 是写入后的数据对象元数据。
  Subject subject = 2;
}

// GetSubjectReq 表示获取数据对象的请求。
message GetSubjectReq {
  // space_id 是使用空间 ID。
  string space_id = 2;
  // subject_id 是数据对象 ID。
  string subject_id = 3;
}

// GetSubjectRsp 表示获取数据对象的响应。
message GetSubjectRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // subject 是数据对象元数据。
  Subject subject = 2;
}

// ListSubjectsReq 表示列出数据对象的请求。
message ListSubjectsReq {
  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // subject_ids 是可选对象 ID 白名单。
  repeated string subject_ids = 3;
  // page 是分页参数。
  common.Page page = 4;
  // keyword 是按对象 ID 或名称进行模糊搜索的关键词。
  string keyword = 5;
}

// ListSubjectsRsp 表示列出数据对象的响应。
message ListSubjectsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // subjects 是数据对象列表。
  repeated Subject subjects = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

message UpsertTagReq {
  Tag tag = 2;
  bool create_only = 3;
  // seed 标记种子导入（setup init、metadata apply）：新建标签（含 create_only）时保留 tag.builtin。
  // 不带它新建的标签一律不是内置标签；已有标签的 builtin 无论带不带都不改。
  bool seed = 4;
}
message UpsertTagRsp { common.RetInfo ret_info = 1; Tag tag = 2; }
message GetTagReq { string space_id = 2; string tag_id = 3; }
message GetTagRsp { common.RetInfo ret_info = 1; Tag tag = 2; }
message ListTagsReq { string space_id = 2; common.Page page = 3; }
message ListTagsRsp { common.RetInfo ret_info = 1; repeated Tag tags = 2; common.PageResult page_result = 3; }
message DeleteTagReq { string space_id = 2; string tag_id = 3; }
message DeleteTagRsp { common.RetInfo ret_info = 1; repeated TagReference references = 2; }
message ListTagMembersReq {
  string space_id = 2;
  string tag_id = 3;
  string status = 4;
  string keyword = 5;
  common.Page page = 6;
}
message ListTagMembersRsp { common.RetInfo ret_info = 1; repeated TagMember members = 2; common.PageResult page_result = 3; }
message TagMembersReq { string space_id = 2; string tag_id = 3; repeated string subject_ids = 4; }
message TagMembersRsp { common.RetInfo ret_info = 1; uint32 affected = 2; }
message SetTagMemberStatusReq { string space_id = 2; string tag_id = 3; repeated string subject_ids = 4; string status = 5; }
message ApplyTagSnapshotReq { string space_id = 2; string tag_id = 3; repeated TagSnapshotItem items = 4; }
message ApplyTagSnapshotRsp { common.RetInfo ret_info = 1; uint32 added = 2; uint32 activated = 3; uint32 inactivated = 4; }
message UpdateSubjectAttributesReq { string space_id = 2; repeated SubjectAttributes items = 3; }
message UpdateSubjectAttributesRsp { common.RetInfo ret_info = 1; uint32 updated = 2; uint32 skipped = 3; }
// TagMemberTradingStatus 是一个成员的交易状态。
message TagMemberTradingStatus { string subject_id = 1; string trading_status = 2; }
// SetTagMemberTradingStatusReq 只改成员的 trading_status；值与已存的相同时不写库（不递增标的修订号）。
message SetTagMemberTradingStatusReq { string space_id = 2; string tag_id = 3; repeated TagMemberTradingStatus items = 4; }
// updated 是实际改动的成员数；skipped 是值没变、或不是这个标签成员的条数。
message SetTagMemberTradingStatusRsp { common.RetInfo ret_info = 1; uint32 updated = 2; uint32 skipped = 3; }
message ResolveSubjectsReq { string space_id = 2; repeated string tag_ids = 3; }
message ResolveSubjectsRsp { common.RetInfo ret_info = 1; repeated Subject subjects = 2; }

// CreateDatasetReq 表示创建数据集的请求。
message CreateDatasetReq {
  // dataset 是待创建的数据集元数据。
  Dataset dataset = 2;
  // columns 是随数据集一起创建的列定义，与数据集在同一事务内写入；数据集建好即可写入。
  repeated DatasetColumn columns = 3;
}

// CreateDatasetRsp 表示创建数据集的响应。
message CreateDatasetRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // dataset 是创建后的数据集元数据。
  Dataset dataset = 2;
}

// UpdateDatasetReq 表示更新数据集的请求。
message UpdateDatasetReq {
  // dataset 是更新后的数据集元数据。
  Dataset dataset = 2;
}

// UpdateDatasetRsp 表示更新数据集的响应。
message UpdateDatasetRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // dataset 是更新后的数据集元数据。
  Dataset dataset = 2;
}

// DeleteDatasetReq 表示删除一个临时数据集及其依赖行。
message DeleteDatasetReq {
  string space_id = 2;
  string dataset_id = 3;
}

// DeleteDatasetRsp 表示删除数据集的结果。
message DeleteDatasetRsp {
  common.RetInfo ret_info = 1;
}

// GetDatasetReq 表示获取数据集的请求。
message GetDatasetReq {
  // space_id 是使用空间 ID。
  string space_id = 2;
  // dataset_id 是数据集 ID。
  string dataset_id = 3;
}

// GetDatasetRsp 表示获取数据集的响应。
message GetDatasetRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // dataset 是数据集元数据。
  Dataset dataset = 2;
  // subjects_revision 是所属空间的标的修订号：标的、标签成员、标签市场类型或数据集标的范围变化时递增。
  uint64 subjects_revision = 3;
}

// ListDatasetsReq 表示列出数据集的请求。
message ListDatasetsReq {
  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // data_source_id 是可选数据来源 ID 过滤条件。
  string data_source_id = 3;
  // data_kind 是可选数据形态过滤条件。
  DataKind data_kind = 4;
  // freq 是可选频率过滤条件。
  string freq = 5;
  // page 是分页参数。
  common.Page page = 6;
  // status 是可选状态过滤条件：active 或 disabled。
  string status = 7;
}

// ListDatasetsRsp 表示列出数据集的响应。
message ListDatasetsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // datasets 是数据集列表。
  repeated Dataset datasets = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// ListDatasetSubjectsReq 表示列出 Dataset 覆盖对象的请求。
message ListDatasetSubjectsReq {
  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // dataset_id 是可选数据集 ID 过滤条件。
  string dataset_id = 3;
  // subject_id 是可选数据对象 ID 过滤条件。
  string subject_id = 4;
  // page 是分页参数。
  common.Page page = 5;
}

// ListDatasetSubjectsRsp 表示列出 Dataset 覆盖对象的响应。
message ListDatasetSubjectsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // dataset_subjects 是数据集与对象的绑定关系列表。
  repeated DatasetSubject dataset_subjects = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// UpsertDatasetColumnReq 表示创建或更新数据集列的请求。
message UpsertDatasetColumnReq {
  // column 是待写入的数据集列元数据。
  DatasetColumn column = 2;
}

// UpsertDatasetColumnRsp 表示创建或更新数据集列的响应。
message UpsertDatasetColumnRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // column 是写入后的数据集列元数据。
  DatasetColumn column = 2;
}

// ListDatasetColumnsReq 表示列出数据集列的请求。
message ListDatasetColumnsReq {
  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // dataset_id 是数据集 ID。
  string dataset_id = 3;
  // page 是分页参数。
  common.Page page = 4;
}

// ListDatasetColumnsRsp 表示列出数据集列的响应。
message ListDatasetColumnsRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // columns 是数据集列列表。
  repeated DatasetColumn columns = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// Metadata 管理量化存储系统的核心元数据。
service Metadata {
  // 创建使用空间。
  rpc CreateSpace(CreateSpaceReq) returns (CreateSpaceRsp);
  // 更新使用空间。
  rpc UpdateSpace(UpdateSpaceReq) returns (UpdateSpaceRsp);
  // 删除使用空间及其级联元数据。
  rpc DeleteSpace(DeleteSpaceReq) returns (DeleteSpaceRsp);
  // 按 ID 获取使用空间。
  rpc GetSpace(GetSpaceReq) returns (GetSpaceRsp);
  // 列出使用空间。
  rpc ListSpaces(ListSpacesReq) returns (ListSpacesRsp);

  // 创建数据来源。
  rpc CreateDataSource(CreateDataSourceReq) returns (CreateDataSourceRsp);
  // 更新数据来源。
  rpc UpdateDataSource(UpdateDataSourceReq) returns (UpdateDataSourceRsp);
  // 删除数据来源。
  rpc DeleteDataSource(DeleteDataSourceReq) returns (DeleteDataSourceRsp);
  // 按 ID 获取数据来源。
  rpc GetDataSource(GetDataSourceReq) returns (GetDataSourceRsp);
  // 列出数据来源。
  rpc ListDataSources(ListDataSourcesReq) returns (ListDataSourcesRsp);

  // 创建或更新数据对象。
  rpc UpsertSubject(UpsertSubjectReq) returns (UpsertSubjectRsp);
  // 按 ID 获取数据对象。
  rpc GetSubject(GetSubjectReq) returns (GetSubjectRsp);
  // 列出数据对象。
  rpc ListSubjects(ListSubjectsReq) returns (ListSubjectsRsp);
  rpc UpsertTag(UpsertTagReq) returns (UpsertTagRsp);
  rpc GetTag(GetTagReq) returns (GetTagRsp);
  rpc ListTags(ListTagsReq) returns (ListTagsRsp);
  rpc DeleteTag(DeleteTagReq) returns (DeleteTagRsp);
  rpc ListTagMembers(ListTagMembersReq) returns (ListTagMembersRsp);
  rpc AddTagMembers(TagMembersReq) returns (TagMembersRsp);
  rpc RemoveTagMembers(TagMembersReq) returns (TagMembersRsp);
  rpc SetTagMemberStatus(SetTagMemberStatusReq) returns (TagMembersRsp);
  rpc ApplyTagSnapshot(ApplyTagSnapshotReq) returns (ApplyTagSnapshotRsp);
  rpc UpdateSubjectAttributes(UpdateSubjectAttributesReq) returns (UpdateSubjectAttributesRsp);
  // 写标签成员的交易状态（只有 Collector 的交易状态检测调用）。
  rpc SetTagMemberTradingStatus(SetTagMemberTradingStatusReq) returns (SetTagMemberTradingStatusRsp);
  rpc ResolveSubjects(ResolveSubjectsReq) returns (ResolveSubjectsRsp);

  // 创建数据集。
  rpc CreateDataset(CreateDatasetReq) returns (CreateDatasetRsp);
  // 更新数据集。
  rpc UpdateDataset(UpdateDatasetReq) returns (UpdateDatasetRsp);
  // 删除数据集。
  rpc DeleteDataset(DeleteDatasetReq) returns (DeleteDatasetRsp);
  // 按 ID 获取数据集。
  rpc GetDataset(GetDatasetReq) returns (GetDatasetRsp);
  // 列出数据集。
  rpc ListDatasets(ListDatasetsReq) returns (ListDatasetsRsp);
  // 列出 Dataset 覆盖的 Subject。
  rpc ListDatasetSubjects(ListDatasetSubjectsReq) returns (ListDatasetSubjectsRsp);

  // 创建或更新数据集列。
  rpc UpsertDatasetColumn(UpsertDatasetColumnReq) returns (UpsertDatasetColumnRsp);
  // 列出数据集列。
  rpc ListDatasetColumns(ListDatasetColumnsReq) returns (ListDatasetColumnsRsp);
}
