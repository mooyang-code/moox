syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "dataset_markers.proto";

// Space 是业务命名空间，也是用户可见 View 的集合。
message Space {
  // space_id 是使用空间 ID；本文所有“全局”概念均限定在该空间内。
  string space_id = 1;
  // name 是空间名称，通常用于管理台展示。
  string name = 2;
  // description 是说明文本。
  string description = 3;
  // owner 是空间拥有者，可以是用户、团队或系统任务。
  string owner = 4;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 5;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 6;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 7;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 8;
}

// ViewIndexBuild 是一个 View 非活跃索引槽位的持久化构建状态。
message ViewIndexBuild {
  // State 表示双库切换构建所处的阶段。
  enum State {
    UNSPECIFIED = 0;
    PREPARING = 1;
    BUILDING = 2;
    CATCHING_UP = 3;
    READY = 4;
    FAILED = 5;
  }

  string space_id = 1;
  string view_id = 2;
  string build_id = 3;
  string index_id = 4;
  string engine = 5;
  uint64 target_view_version = 6;
  State state = 7;
  string owner_id = 8;
  string lease_expires_at = 9;
  string cursor_json = 10;
  string snapshot_end = 11;
  string coverage_start = 12;
  string coverage_end = 13;
  uint64 entries_written = 14;
  string schema_hash = 15;
  repeated ViewColumn columns = 16;
  string started_at = 17;
  string updated_at = 18;
  string finished_at = 19;
  string error = 20;
}

// View 是 Space 内的用户查询入口，也是可异步构建的近期派生索引定义。
message View {
  // space_id 是 View 所属 Space。
  string space_id = 1;
  // view_id 是 Space 内唯一的查询视图 ID；必须为 lower_snake_case，最长 30 字符。
  string view_id = 2;
  // name 是视图中文展示名，创建和更新时必须包含中文且不超过 10 个字符。
  string name = 3;
  // description 是说明文本。
  string description = 4;
  // primary_dataset_id 是视图的主数据集，用于默认读路径和主时间轴。
  string primary_dataset_id = 5;
  // dataset_ids 是该视图组合的事实数据集 ID 列表。
  repeated string dataset_ids = 6;
  // grain_keys 表示视图行粒度键，例如 subject_id、data_time 或 freq。
  repeated string grain_keys = 7;
  // filter_json 是构建视图物化结果时使用的固定过滤条件。
  string filter_json = 8;
  // engine 是视图查询执行引擎标识，由控制面配置。
  string engine = 9;
  // keep_duration 是 TimeSeries View 保留 RowKey 的时间窗口；0 表示永久保存。
  string keep_duration = 10;
  // active_index_id 是当前生效的 a/b 物理索引标识。
  string active_index_id = 11;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 12;
  // columns 是视图对用户暴露的查询列。
  repeated ViewColumn columns = 13;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 14;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 15;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 16;
  // desired_view_revision 是待构建的 View 定义修订号。
  uint64 desired_view_revision = 17;
  // active_view_revision 是当前线上读取的 View 修订号。
  uint64 active_view_revision = 18;
  // active_columns 是与 active_index_id 同时激活的不可变列快照。
  repeated ViewColumn active_columns = 19;
  // active_view_schema_hash 是当前线上索引的列形态哈希。
  string active_view_schema_hash = 20;
  // active_slot identifies the active A/B physical index slot.
  string active_slot = 21;
  // index_build 是当前持久化构建状态的只读投影。
  ViewIndexBuild index_build = 23;
  // indexed_from 是当前索引实际覆盖的最小业务时间或版本。
  string indexed_from = 24;
  // indexed_to 是当前索引实际覆盖的最大业务时间或版本。
  string indexed_to = 25;
}

// ViewColumn 定义 View 对用户暴露的一列。
message ViewColumn {
  // space_id 是 ViewColumn 所属 Space。
  string space_id = 1;
  // view_id 是查询视图 ID。
  string view_id = 2;
  // column_name 是视图内稳定技术列名；DatasetColumn 来源必须使用 dataset_id.column_name。
  string column_name = 3;
  // origin_type 表示列来源，可为 DatasetColumn、表达式或系统列。
  ColumnOriginType origin_type = 4;
  // origin_id 是来源 ID；DatasetColumn 必须使用 dataset_id.column_name，并与 column_name 保持一致。
  string origin_id = 5;
  // value_type 是列值的逻辑类型。
  FieldValueType value_type = 6;
  // online_time 是该列进入视图的上线时间，用于解释列可见性。
  string online_time = 7;
  // sort_order 是视图列展示和物化构建时的稳定排序。
  uint32 sort_order = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性；Factor 结果列的 display_name 必须等于 factor_output，其他业务列必须包含中文且不超过 10 个字符。
  map<string, string> attributes = 11;
}

// DataSource 表示 Space 内的数据来源，交易所、行情接口、文件导入和内部计算都可作为来源。
message DataSource {
  // space_id 是 DataSource 所属 Space。
  string space_id = 1;
  // data_source_id 是 Space 内唯一的数据来源 ID。
  string data_source_id = 2;
  // name 是数据来源名称，通常用于管理台展示。
  string name = 3;
  // kind 表示来源类型，例如 exchange、vendor_api、file_import、manual 或 internal。
  string kind = 4;
  // market 是可选市场标识，例如 US、HK、CN 或 crypto。
  string market = 5;
  // timezone 是该来源默认时区。
  string timezone = 6;
  // config_json 是来源连接和采集配置，服务端应按敏感配置处理。
  string config_json = 7;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 11;
}

// Subject 表示 Space 内的数据对象，交易标的只是其中一种。
message Subject {
  // space_id 是 Subject 所属 Space。
  string space_id = 1;
  // subject_id 是 Space 内唯一的数据对象 ID。
  string subject_id = 2;
  // subject_type 是对象类型，例如 stock、crypto_pair、ranking_board、news_source 或 custom。
  string subject_type = 3;
  // name 是对象名称，通常用于管理台展示。
  string name = 4;
  // market 是可选市场标识。
  string market = 5;
  // currency 是交易、报价或结算币种。
  string currency = 6;
  // timezone 是该对象默认时区。
  string timezone = 7;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 11;
}

// SubjectSymbol 表示 Subject 在某个 DataSource 下的外部代码映射。
message SubjectSymbol {
  // space_id 是 SubjectSymbol 所属 Space。
  string space_id = 1;
  // subject_id 是 Space 内的数据对象 ID。
  string subject_id = 2;
  // data_source_id 是外部代码所属的数据来源 ID。
  string data_source_id = 3;
  // external_symbol 是数据来源使用的原始对象代码。
  string external_symbol = 4;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 5;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 6;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 7;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 8;
}

// Dataset 是 Space 内可写的事实数据集，定义一类数据及其列契约。
message Dataset {
  // space_id 是 Dataset 所属 Space。
  string space_id = 1;
  // dataset_id 是 Space 内唯一的数据集 ID；必须为 lower_snake_case，最长 50 字符。
  string dataset_id = 2;
  // data_source_id 是该 Dataset 绑定的数据来源 ID；一个 Dataset 只绑定一个 DataSource。
  string data_source_id = 3;
  // name 是数据集中文展示名，创建和更新时必须包含中文且不超过 10 个字符。
  string name = 4;
  // description 是说明文本。
  string description = 5;
  // data_kind 是数据集的结构形态。
  DataKind data_kind = 6;
  // freqs 是该数据集支持的数据频率列表。
  repeated string freqs = 7;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 11;
  // data_node_id 是该 Dataset 的唯一 DataNode owner。
  string data_node_id = 17;
  // keep_duration 是 TimeSeries Pebble 数据的保留时长；0 表示永久保存。
  string keep_duration = 18;
  // binding_locked 表示 Dataset 首次激活后是否永久锁定 DataNode 绑定。
  bool binding_locked = 19;
  // revision 是 Dataset 元数据的单调递增修订号，用于并发控制。
  uint64 revision = 20;
}

// DatasetSubject 表示 Dataset 覆盖的 Subject 集合。
message DatasetSubject {
  // space_id 是绑定关系所属 Space。
  string space_id = 1;
  // dataset_id 是数据集 ID。
  string dataset_id = 2;
  // subject_id 是业务对象 ID。
  string subject_id = 3;
  // subject_role 是 Subject 在数据集中的角色，例如 normal、benchmark、index、universe_member 或 record。
  string subject_role = 4;
  // effective_start_time 是 Subject 在数据集中的生效开始时间。
  string effective_start_time = 5;
  // effective_end_time 是 Subject 在数据集中的生效结束时间；为空表示仍然生效。
  string effective_end_time = 6;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 7;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 8;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 9;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 10;
}

// FieldGroup 是 Space 内普通字段的两级分类目录。
message FieldGroup {
  // space_id 是 FieldGroup 所属 Space。
  string space_id = 1;
  // group_id 是 Space 内唯一的稳定英文 ID。
  string group_id = 2;
  // name 是字段组中文展示名。
  string name = 3;
  // description 是字段组说明。
  string description = 4;
  // parent_group_id 是可选父组 ID；系统最多允许两级。
  string parent_group_id = 5;
  // sort_order 是同级展示顺序。
  uint32 sort_order = 6;
  // status 表示启用或停用状态。
  string status = 7;
  // created_at 是创建时间。
  string created_at = 8;
  // updated_at 是最后更新时间。
  string updated_at = 9;
  // attributes 是扩展属性。
  map<string, string> attributes = 10;
}

// Field 是 Space 内普通字段字典，不直接归属某个 Dataset。
message Field {
  // space_id 是 Field 所属 Space。
  string space_id = 1;
  // field_id 是 Space 内唯一字段英文名，例如 open、close 或 volume。
  string field_id = 2;
  // name 是字段中文名或展示名。
  string name = 3;
  // description 是说明文本。
  string description = 4;
  // value_type 是字段值的逻辑类型。
  FieldValueType value_type = 5;
  // unit 是默认计量单位，例如 CNY、USD、share 或 percent。
  string unit = 6;
  // validation_rule_json 是字段写入校验规则。
  string validation_rule_json = 7;
  // write_example 是示例写入值，便于管理台展示和文档生成。
  string write_example = 8;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 9;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 10;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 11;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 12;
  // group_id 是字段所属 FieldGroup；字段必须归组。
  string group_id = 13;
  // sort_order 是字段在组内的展示顺序。
  uint32 sort_order = 14;
}

// Factor 是可跨 Space 复用的已参数化因子定义。
message Factor {
	// space_id 是创建或管理该 Factor 的 Space 上下文，不参与 Factor ID 命名。
	string space_id = 1;
	// factor_id 是与 Python 因子文件名主体一致的大小写组合，例如 Bias 或 QuoteVolumeMean。
	string factor_id = 2;
  // name 是因子中文名或展示名。
  string name = 3;
  // description 是说明文本。
  string description = 4;
  // algorithm 是因子算法或计算族标识，例如 MA 或 RSI。
  string algorithm = 5;
  // params_json 是已参数化后的因子参数，例如 {"window":20,"price":"close"}。
  string params_json = 6;
  // value_type 是因子值的逻辑类型。
  FieldValueType value_type = 7;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 11;
}

// DatasetColumn 表示 Dataset 下允许写入和读取的一列。
message DatasetColumn {
  // space_id 是 DatasetColumn 所属 Space。
  string space_id = 1;
  // dataset_id 是数据集 ID。
  string dataset_id = 2;
  // column_name 是数据集内稳定技术列名。
  string column_name = 3;
  // origin_type 表示列来源，可为字段、因子或系统列。
  DatasetColumnOriginType origin_type = 4;
  // origin_id 是字段 ID、因子 ID 或系统列名。
  string origin_id = 5;
  // value_type 是列值的逻辑类型。
  FieldValueType value_type = 6;
  // required 表示导入数据时该列是否必须存在。
  bool required = 7;
  // aliases 是导入数据时可识别的列名别名。
  repeated string aliases = 8;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 9;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 10;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 11;
  // attributes 是扩展属性；Factor 结果列的 display_name 必须等于 factor_output，其他业务列必须包含中文且不超过 10 个字符。
  map<string, string> attributes = 12;
}

// DataNode 表示一个可被 storage-primary 直接调用的数据存储节点。
message DataNode {
  // node_id 是部署生成的稳定节点标识。
  string node_id = 1;
  // name 是管理台展示名称。
  string name = 2;
  // service_target 是 DataNode 内部 tRPC 地址。
  string service_target = 3;
  // status 表示 active 或 disabled。
  string status = 4;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 5;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 6;
}

// DatasetSummary 是 DataNode 列表中携带的数据集摘要。
message DatasetSummary {
  string space_id = 1;
  string dataset_id = 2;
  string name = 3;
  DataKind data_kind = 4;
  string keep_duration = 5;
  string status = 6;
}

// DataNodeListItem 是 DataNode 及其全部 Dataset 摘要的组合视图。
message DataNodeListItem {
  DataNode node = 1;
  repeated DatasetSummary datasets = 2;
}

// DatasetActivationCheck 是一次 Dataset 激活自检的单项结果。
message DatasetActivationCheck {
  string check_id = 1;
  bool ready = 2;
  string summary = 3;
}

// Device 是底层具体存储组件，例如 Pebble、DuckDB、Bleve 或 Parquet 归档。
message Device {
  // device_id 是设备 ID。
  string device_id = 1;
  // name 是设备名称，通常用于管理台展示。
  string name = 2;
  // engine 是存储引擎，例如 pebble、duckdb、bleve 或 parquet。
  string engine = 3;
  // endpoint 是连接地址、文件路径或 URI。
  string endpoint = 4;
  // config_json 是设备专用配置。
  string config_json = 5;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 6;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 7;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 8;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 9;
}

// ArchiveFile 表示从 Pebble 主存归档出来的 Parquet 事实文件。
message ArchiveFile {
  // space_id 是归档所属 Space。
  string space_id = 1;
  // archive_file_id 是归档文件记录 ID。
  string archive_file_id = 2;
  // dataset_id 是归档所属数据集 ID。
  string dataset_id = 3;
  // device_id 是归档文件所在设备 ID。
  string device_id = 4;
  // partition_key 是归档分区键，例如 date=2026-06-15/source=binance。
  string partition_key = 5;
  // file_uri 是归档文件 URI。
  string file_uri = 6;
  // file_format 是文件格式，当前固定为 parquet。
  string file_format = 7;
  // min_time 是文件内最小数据时间。
  string min_time = 8;
  // max_time 是文件内最大数据时间。
  string max_time = 9;
  // row_count 是文件内事实行数。
  uint64 row_count = 10;
  // columns 是该文件包含的事实列名列表。
  repeated string columns = 12;
  // status 表示启用、停用、归档、删除或失败等状态。
  string status = 13;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 14;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 15;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 16;
}

// CreateSpaceReq 表示创建使用空间的请求。
message CreateSpaceReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space 是待创建的使用空间元数据。
  Space space = 2;
}

// CreateSpaceRsp 表示创建使用空间的响应。
message CreateSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是创建后的使用空间元数据。
  Space space = 2;
}

// UpdateSpaceReq 表示更新使用空间的请求。
message UpdateSpaceReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space 是更新后的使用空间元数据。
  Space space = 2;
}

// UpdateSpaceRsp 表示更新使用空间的响应。
message UpdateSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
