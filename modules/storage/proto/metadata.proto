syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "dataset_markers.proto";

// Space 是业务命名空间，也是用户可见 View 的集合。
message Space {
  // space_id 是使用空间 ID；本文所有“全局”概念均限定在该空间内。
  string space_id = 1;
  // name 是空间名称，通常用于管理台展示。
  string name = 2;
  // description 是说明文本。
  string description = 3;
  // owner 是空间拥有者，可以是用户、团队或系统任务。
  string owner = 4;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 5;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 6;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 7;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 8;
}

// View 是 Space 内的用户查询入口，也是可异步构建的近期派生索引定义。
message View {
  // space_id 是 View 所属 Space。
  string space_id = 1;
  // view_id 是 Space 内唯一的查询视图 ID；必须为 lower_snake_case，最长 128 字符。
  string view_id = 2;
  // name 是视图中文展示名，创建和更新时必须包含中文且不超过 10 个字符。
  string name = 3;
  // description 是说明文本。
  string description = 4;
  // dataset_id 是视图所属的唯一数据集；一个 View 只索引一个 Dataset。
  string dataset_id = 5;
  // grain_keys 表示视图行粒度键，例如 subject_id、data_time 或 freq。
  repeated string grain_keys = 7;
  // freq 是所属 Dataset 的频率，由 Storage 按 Dataset 填写，调用方不能指定；记录型 View 为空。
  string freq = 8;
  // engine 是视图查询执行引擎标识，由控制面配置。
  string engine = 9;
  // active_index_id 是 View 唯一的物理索引标识；为空表示首次建索引还没完成，View 暂不可读。
  string active_index_id = 11;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 12;
  // columns 是视图对用户暴露的查询列。
  repeated ViewColumn columns = 13;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 14;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 15;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 16;
  // view_revision 是当前索引的列修订号：建成时为 1，每原地加一次列加 1。
  uint64 view_revision = 18;
  // active_columns 是当前索引已经建好的列，只会追加。
  repeated ViewColumn active_columns = 19;
  // active_view_schema_hash 是当前索引的列形态哈希。
  string active_view_schema_hash = 20;
  // indexed_from 是当前索引实际覆盖的最小业务时间或版本。
  string indexed_from = 24;
  // indexed_to 是当前索引实际覆盖的最大业务时间或版本。
  string indexed_to = 25;
  // hidden_columns 是数据集里被禁用或所引用字段已停用、删除的列，由 Storage 计算：列和数据都保留，只在返回结果和列清单时隐藏。
  repeated string hidden_columns = 26;
}

// ViewColumn 定义 View 对用户暴露的一列。
message ViewColumn {
  // space_id 是 ViewColumn 所属 Space。
  string space_id = 1;
  // view_id 是查询视图 ID。
  string view_id = 2;
  // column_name 是视图内稳定技术列名；DatasetColumn 来源直接使用 Dataset 列名，不带数据集前缀。
  string column_name = 3;
  // origin_type 表示列来源，可为 DatasetColumn、表达式或系统列。
  ColumnOriginType origin_type = 4;
  // origin_id 是来源 ID；DatasetColumn 为 View 所属 Dataset 的列名，并与 column_name 保持一致。
  string origin_id = 5;
  // value_type 是列值的逻辑类型。
  FieldValueType value_type = 6;
  // online_time 是该列进入视图的上线时间，用于解释列可见性。
  string online_time = 7;
  // sort_order 是视图列展示和物化构建时的稳定排序。
  uint32 sort_order = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性；factor_result 的因子输出列（column_kind=output）display_name 必须等于列名，其他业务列（包括参数列 __params）必须包含中文且不超过 10 个字符。
  map<string, string> attributes = 11;
}

// DataSource 是 Space 内一个可引用的数据来源名字；业务含义放在 attributes，Storage 不解释。
message DataSource {
  // space_id 是 DataSource 所属 Space。
  string space_id = 1;
  // data_source_id 是 Space 内唯一的数据来源 ID。
  string data_source_id = 2;
  // name 是数据来源名称，通常用于管理台展示。
  string name = 3;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 4;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 5;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 6;
  // attributes 是写入方维护的扩展属性，Storage 原样保存。
  map<string, string> attributes = 7;
}

// Tag 是一组 Subject；业务含义（市场、同步配置等）放在 attributes，Storage 不解释。
message Tag {
  string space_id = 1;
  string tag_id = 2;
  string tag_name = 3;
  string description = 4;
  string mode = 5;
  bool builtin = 6;
  uint32 active_count = 7;
  uint32 inactive_count = 8;
  string created_at = 9;
  string updated_at = 10;
  // attributes 是写入方维护的扩展属性，Storage 原样保存；改动会递增标的修订号。
  map<string, string> attributes = 11;
}

// TagMember 是标签成员；tag_id 为空时 tag_ids 列出所属标签。
message TagMember {
  string space_id = 1;
  string tag_id = 2;
  string status = 3;
  string inactive_at = 4;
  Subject subject = 5;
  repeated string tag_ids = 6;
}

message TagSnapshotItem {
  string subject_id = 1;
  string name = 2;
  string timezone = 3;
  map<string, string> attributes = 4;
}

message SubjectAttributes {
  string subject_id = 1;
  string name = 2;
  map<string, string> attributes = 3;
}

message TagReference {
  string dataset_id = 1;
  string dataset_name = 2;
  string collector_task_id = 3;
}

// Subject 表示 Space 内的数据对象；类型、市场、币种等业务字段放在 attributes，Storage 不解释。
message Subject {
  // space_id 是 Subject 所属 Space。
  string space_id = 1;
  // subject_id 是 Space 内唯一的数据对象 ID。
  string subject_id = 2;
  // name 是对象名称，通常用于管理台展示。
  string name = 3;
  // timezone 是该对象默认时区。
  string timezone = 4;
  // status 取值 active 或 disabled；disabled 仅表示人工停用。
  string status = 5;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 6;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 7;
  // attributes 是写入方维护的扩展属性，Storage 原样保存；改动会递增标的修订号。
  map<string, string> attributes = 8;
}

// Dataset 是 Space 内可写的事实数据集，定义一类数据及其列契约。
message Dataset {
  // space_id 是 Dataset 所属 Space。
  string space_id = 1;
  // dataset_id 是 Space 内唯一的数据集 ID；必须为 lower_snake_case，最长 50 字符。
  string dataset_id = 2;
  // data_source_id 是该 Dataset 绑定的数据来源 ID；一个 Dataset 只绑定一个 DataSource。
  string data_source_id = 3;
  // name 是数据集中文展示名，创建和更新时必须包含中文且不超过 10 个字符。
  string name = 4;
  // description 是说明文本。
  string description = 5;
  // data_kind 是数据集的结构形态。
  DataKind data_kind = 6;
  // freq 是时序 Dataset 的唯一频率，必须是规范值（见 packages/frequency），创建后不可修改；
  // 记录型 Dataset 可以为空或使用描述性取值。
  string freq = 7;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 8;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 9;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 10;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 11;
  // data_node_id 是该 Dataset 的唯一 DataNode owner。
  string data_node_id = 17;
  // retention 是只读的生效保留期，由 Storage 策略文件按 (space_id, freq) 解析，取值为 "<n>h" 或
  // "forever"；记录型 Dataset 为 "forever"。写接口忽略该字段。
  string retention = 18;
  // binding_locked 表示 Dataset 首次激活后是否永久锁定 DataNode 绑定。
  bool binding_locked = 19;
  // revision 是 Dataset 元数据的单调递增修订号，用于并发控制。
  uint64 revision = 20;
  // subject_tags 是数据集标的范围，取值为 tag_id。
  repeated string subject_tags = 21;
  // retention_source 是 retention 的来源（只读）：default、space 或 record。
  string retention_source = 22;
}

// DatasetSubject 表示 Dataset 覆盖的 Subject 集合。
message DatasetSubject {
  // space_id 是绑定关系所属 Space。
  string space_id = 1;
  // dataset_id 是数据集 ID。
  string dataset_id = 2;
  // subject_id 是业务对象 ID。
  string subject_id = 3;
  string status = 4;
}

// FieldGroup 是 Space 内普通字段的两级分类目录。
message FieldGroup {
  // space_id 是 FieldGroup 所属 Space。
  string space_id = 1;
  // group_id 是 Space 内唯一的稳定英文 ID。
  string group_id = 2;
  // name 是字段组中文展示名。
  string name = 3;
  // description 是字段组说明。
  string description = 4;
  // parent_group_id 是可选父组 ID；系统最多允许两级。
  string parent_group_id = 5;
  // sort_order 是同级展示顺序。
  uint32 sort_order = 6;
  // status 表示启用或停用状态。
  string status = 7;
  // created_at 是创建时间。
  string created_at = 8;
  // updated_at 是最后更新时间。
  string updated_at = 9;
  // attributes 是扩展属性。
  map<string, string> attributes = 10;
}

// Field 是 Space 内普通字段字典，不直接归属某个 Dataset。
message Field {
  // space_id 是 Field 所属 Space。
  string space_id = 1;
  // field_id 是 Space 内唯一字段英文名，例如 open、close 或 volume。
  string field_id = 2;
  // name 是字段中文名或展示名。
  string name = 3;
  // description 是说明文本。
  string description = 4;
  // value_type 是字段值的逻辑类型。
  FieldValueType value_type = 5;
  // unit 是默认计量单位，例如 CNY、USD、share 或 percent。
  string unit = 6;
  // validation_rule_json 是字段写入校验规则。
  string validation_rule_json = 7;
  // write_example 是示例写入值，便于管理台展示和文档生成。
  string write_example = 8;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 9;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 10;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 11;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 12;
  // group_id 是字段所属 FieldGroup；字段必须归组。
  string group_id = 13;
  // sort_order 是字段在组内的展示顺序。
  uint32 sort_order = 14;
}

// DatasetColumn 表示 Dataset 下允许写入和读取的一列。
message DatasetColumn {
  // space_id 是 DatasetColumn 所属 Space。
  string space_id = 1;
  // dataset_id 是数据集 ID。
  string dataset_id = 2;
  // column_name 是数据集内稳定技术列名。
  string column_name = 3;
  // origin_type 表示列来源，可为字段、因子或系统列。
  DatasetColumnOriginType origin_type = 4;
  // origin_id 是字段 ID、因子 ID 或系统列名。
  string origin_id = 5;
  // value_type 是列值的逻辑类型。
  FieldValueType value_type = 6;
  // required 表示导入数据时该列是否必须存在。
  bool required = 7;
  // aliases 是导入数据时可识别的列名别名。
  repeated string aliases = 8;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 9;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 10;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 11;
  // attributes 是扩展属性；factor_result 的因子输出列（column_kind=output）display_name 必须等于列名，其他业务列（包括参数列 __params）必须包含中文且不超过 10 个字符。
  map<string, string> attributes = 12;
}

// DataNode 表示一个可被 storage-primary 直接调用的数据存储节点。
message DataNode {
  // node_id 是部署生成的稳定节点标识。
  string node_id = 1;
  // name 是管理台展示名称。
  string name = 2;
  // service_target 是 DataNode 内部 tRPC 地址。
  string service_target = 3;
  // status 表示 active 或 disabled。
  string status = 4;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 5;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 6;
}

// DatasetSummary 是 DataNode 列表中携带的数据集摘要。
message DatasetSummary {
  string space_id = 1;
  string dataset_id = 2;
  string name = 3;
  DataKind data_kind = 4;
  // retention 与 retention_source 同 Dataset 中的只读字段。
  string retention = 5;
  string status = 6;
  string retention_source = 7;
}

// DataNodeListItem 是 DataNode 及其全部 Dataset 摘要的组合视图。
message DataNodeListItem {
  DataNode node = 1;
  repeated DatasetSummary datasets = 2;
}

// DatasetActivationCheck 是一次 Dataset 激活自检的单项结果。
message DatasetActivationCheck {
  string check_id = 1;
  bool ready = 2;
  string summary = 3;
}

// Device 是底层具体存储组件，例如 Pebble、DuckDB、Bleve 或 Parquet 归档。
message Device {
  // device_id 是设备 ID。
  string device_id = 1;
  // name 是设备名称，通常用于管理台展示。
  string name = 2;
  // engine 是存储引擎，例如 pebble、duckdb、bleve 或 parquet。
  string engine = 3;
  // endpoint 是连接地址、文件路径或 URI。
  string endpoint = 4;
  // config_json 是设备专用配置。
  string config_json = 5;
  // status 表示启用、停用、构建中、归档或删除等状态。
  string status = 6;
  // created_at 是创建时间，使用项目统一时间字符串格式。
  string created_at = 7;
  // updated_at 是最后更新时间，使用项目统一时间字符串格式。
  string updated_at = 8;
  // attributes 是扩展属性，默认不作为索引字段使用。
  map<string, string> attributes = 9;
}

// CreateSpaceReq 表示创建使用空间的请求。
message CreateSpaceReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space 是待创建的使用空间元数据。
  Space space = 2;
}

// CreateSpaceRsp 表示创建使用空间的响应。
message CreateSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是创建后的使用空间元数据。
  Space space = 2;
}

// UpdateSpaceReq 表示更新使用空间的请求。
message UpdateSpaceReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space 是更新后的使用空间元数据。
  Space space = 2;
}

// UpdateSpaceRsp 表示更新使用空间的响应。
message UpdateSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是更新后的使用空间元数据。
  Space space = 2;
}

// DeleteSpaceReq 表示删除一个使用空间及其级联元数据。
message DeleteSpaceReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
}

// DeleteSpaceRsp 表示删除使用空间的结果。
message DeleteSpaceRsp {
  common.RetInfo ret_info = 1;
}

// GetSpaceReq 表示获取使用空间的请求。
message GetSpaceReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space_id 是使用空间 ID。
  string space_id = 2;
}

// GetSpaceRsp 表示获取使用空间的响应。
message GetSpaceRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // space 是使用空间元数据。
  Space space = 2;
}

// ListSpacesReq 表示列出使用空间的请求。
message ListSpacesReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // owner 是可选拥有者过滤条件。
  string owner = 2;
  // page 是分页参数。
  common.Page page = 3;
}

// ListSpacesRsp 表示列出使用空间的响应。
message ListSpacesRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // spaces 是使用空间列表。
  repeated Space spaces = 2;
  // page_result 是分页结果。
  common.PageResult page_result = 3;
}

// CreateViewReq 表示创建查询视图的请求。
message CreateViewReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // view 是待创建的查询视图元数据。
  View view = 2;
  // create_only 为 true 时要求 View ID 不存在，且由存储层原子保证。
  bool create_only = 3;
}

// CreateViewRsp 表示创建查询视图的响应。
message CreateViewRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // view 是创建后的查询视图元数据。
  View view = 2;
}

// DeleteViewReq 表示物理删除一个查询视图及其依赖行。
message DeleteViewReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
}

// DeleteViewRsp 表示删除查询视图的结果。
message DeleteViewRsp {
  common.RetInfo ret_info = 1;
}

// UpdateViewReq 表示更新查询视图的请求。
message UpdateViewReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // view 是更新后的查询视图元数据。
  View view = 2;
  // replace_columns 为 true 时，columns 表示完整的显式投影：已有列必须都在里面（列只能追加，不能删除或改名），
  // 不在已有列里的是新列，排在最后；为 false 时仅执行普通视图元数据更新。
  bool replace_columns = 3;
}

// UpdateViewRsp 表示更新查询视图的响应。
message UpdateViewRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // view 是更新后的查询视图元数据。
  View view = 2;
}

// GetViewReq 表示获取查询视图的请求。
message GetViewReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space_id 是使用空间 ID。
  string space_id = 2;
  // view_id 是查询视图 ID。
  string view_id = 3;
}

// GetViewRsp 表示获取查询视图的响应。
message GetViewRsp {
  // ret_info 是接口返回状态。
  common.RetInfo ret_info = 1;
  // view 是查询视图元数据。
  View view = 2;
}

// ListViewsReq 表示列出查询视图的请求。
message ListViewsReq {
  // auth_info 是调用方身份和链路追踪信息。
  common.AuthInfo auth_info = 1;
  // space_id 是可选使用空间 ID 过滤条件。
  string space_id = 2;
  // dataset_id 是可选数据集过滤条件。
  string dataset_id = 3;
  // status 是可选状态过滤条件。
