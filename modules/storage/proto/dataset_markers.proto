syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "google/protobuf/timestamp.proto";

// DatasetPeriodCollectedMarker is the Storage RPC form of a dataset-period
// completion decision. space_id is carried by the containing request.
message DatasetPeriodCollectedMarker {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4;
  repeated string subject_ids = 5;
  repeated string failed_subjects = 6;
  google.protobuf.Timestamp collected_at = 7;
}

message FactorBindingPeriodState {
  string binding_id = 1;
  string factor_id = 2;
  string status = 3;
  repeated string skipped_subjects = 4;
  repeated string failed_subjects = 5;
}

// FactorPeriodComputedMarker is appended after all result row writes commit.
message FactorPeriodComputedMarker {
  string source_view_id = 1;
  string result_dataset_id = 2;
  string frequency = 3;
  int64 period_time = 4;
  string status = 5;
  repeated FactorBindingPeriodState bindings = 6;
  google.protobuf.Timestamp computed_at = 7;
  string trigger_event_id = 8;
}

// DatasetSyncPointMarker orders an import/catchup request after its row writes.
message DatasetSyncPointMarker {
  string sync_point_id = 1;
  string request_id = 2;
  string dataset_id = 3;
  string source = 4;
}

// ViewPeriodDatasetState is the durable per-input state used to aggregate a
// multi-dataset Source View period.
message ViewPeriodDatasetState {
  string space_id = 1;
  string view_id = 2;
  string dataset_id = 3;
  string frequency = 4;
  int64 period_time = 5;
  string event_id = 6;
  string status = 7;
  repeated string subject_ids = 8;
  repeated string failed_subjects = 9;
  google.protobuf.Timestamp occurred_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ViewSyncPoint records that one View has applied all events preceding a
// dataset sync-point marker.
message ViewSyncPoint {
  string space_id = 1;
  string view_id = 2;
  string dataset_id = 3;
  string request_id = 4;
  string sync_point_id = 5;
  google.protobuf.Timestamp applied_at = 6;
}
