syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "google/protobuf/timestamp.proto";

message CommittedPosition {
  string node_id = 1;
  string store_id = 2;
  uint64 sequence = 3;
}

// DatasetPeriodCompletedMarker 是 producer 来源的周期完成报告（Storage RPC 形态），在结果行都已提交之后追加。
// space_id 由外层请求携带；detail 是写入方自定义的明细，Storage 原样保存并透传。
message DatasetPeriodCompletedMarker {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4; // complete | degraded
  repeated string universe_subject_ids = 5;
  repeated string failed_subjects = 6;
  string cause_event_id = 7;
  google.protobuf.Timestamp completed_at = 8;
  string detail_type = 9;
  bytes detail = 10;
}

// DatasetSyncPointMarker orders an import/catchup request after its row writes.
message DatasetSyncPointMarker {
  string sync_point_id = 1;
  string request_id = 2;
  string dataset_id = 3;
  string source = 4;
}

// ViewPeriodDatasetState is the durable per-input state used to confirm a
// View period after a completion marker is applied.
message ViewPeriodDatasetState {
  string space_id = 1;
  string view_id = 2;
  string dataset_id = 3;
  string frequency = 4;
  int64 period_time = 5;
  string event_id = 6;
  string status = 7;
  repeated string subject_ids = 8;
  repeated string failed_subjects = 9;
  google.protobuf.Timestamp occurred_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ViewSyncPoint records that one View has applied all events preceding a
// dataset sync-point marker.
message ViewSyncPoint {
  string space_id = 1;
  string view_id = 2;
  string dataset_id = 3;
  string request_id = 4;
  string sync_point_id = 5;
  google.protobuf.Timestamp applied_at = 6;
}
