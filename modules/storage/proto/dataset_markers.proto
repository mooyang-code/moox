syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "google/protobuf/timestamp.proto";

// SeriesRef 是一条时间序列的身份：标的加 series_tag，与行键一致。
message SeriesRef {
  string subject_id = 1;
  string series_tag = 2;
}

// DatasetPeriodCompletedMarker 是 producer 来源的周期完成报告（Storage RPC 形态），在结果行都已提交之后追加。
// space_id 由外层请求携带；detail 是写入方自定义的明细，Storage 原样保存并透传。
message DatasetPeriodCompletedMarker {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4; // complete | degraded
  repeated string universe_subject_ids = 5;
  repeated string failed_subjects = 6;
  string cause_event_id = 7;
  google.protobuf.Timestamp completed_at = 8;
  string detail_type = 9;
  bytes detail = 10;
  // universe_series、failed_series 是按序列的全集与失败名单：写入方的数据集含多个 series_tag 时才填，
  // Storage 原样保存并带进周期完成事件。
  repeated SeriesRef universe_series = 11;
  repeated SeriesRef failed_series = 12;
}
