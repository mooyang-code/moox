syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "rows.proto";
import "dataset_markers.proto";

message PrimaryUpsertFieldsReq {
  common.AuthInfo auth_info = 1;
  repeated RowFieldUpsert rows = 2;
  string source_event_id = 3;
  string write_source = 4;
}

message PrimaryUpsertFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
}

message PrimaryReadFieldsReq {
  common.AuthInfo auth_info = 1;
  repeated RowKey keys = 2;
  repeated string field_ids = 3;
  repeated string attribute_keys = 4;
}

message PrimaryReadFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowFieldValues rows = 2;
  repeated RowKey existing_keys = 3;
}

message ReportDatasetPeriodCollectedReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  DatasetPeriodCollectedMarker marker = 3;
}

message ReportDatasetPeriodCollectedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message ReportFactorPeriodComputedReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  FactorPeriodComputedMarker marker = 3;
}

message ReportFactorPeriodComputedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message AppendDatasetSyncPointReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  DatasetSyncPointMarker sync_point = 3;
}

message AppendDatasetSyncPointRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message GetFactorPeriodComputedReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string source_view_id = 3;
  string trigger_event_id = 4;
  int64 period_time = 5;
}

message GetFactorPeriodComputedRsp {
  common.RetInfo ret_info = 1;
  bool found = 2;
  string event_id = 3;
  FactorPeriodComputedMarker marker = 4;
}

message WaitViewSyncPointReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
  string request_id = 4;
  repeated string dataset_ids = 5;
  uint32 wait_timeout_ms = 6;
}

message WaitViewSyncPointRsp {
  common.RetInfo ret_info = 1;
  bool ready = 2;
  repeated string pending_dataset_ids = 3;
}

// PrimaryStore is the metadata-validating user boundary. It never exposes
// DataNode merge/scan terminology and routes one Dataset to its owner node.
service PrimaryStore {
  // UpsertFields applies partial updates; omitted fields and attributes are retained.
  rpc UpsertFields(PrimaryUpsertFieldsReq) returns (PrimaryUpsertFieldsRsp);
  rpc ReadFields(PrimaryReadFieldsReq) returns (PrimaryReadFieldsRsp);
  rpc ReadTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
  rpc ReadRecordRows(ReadRecordRowsReq) returns (ReadRecordRowsRsp);
  rpc ReportDatasetPeriodCollected(ReportDatasetPeriodCollectedReq) returns (ReportDatasetPeriodCollectedRsp);
  rpc ReportFactorPeriodComputed(ReportFactorPeriodComputedReq) returns (ReportFactorPeriodComputedRsp);
  rpc AppendDatasetSyncPoint(AppendDatasetSyncPointReq) returns (AppendDatasetSyncPointRsp);
  rpc GetFactorPeriodComputed(GetFactorPeriodComputedReq) returns (GetFactorPeriodComputedRsp);
  rpc WaitViewSyncPoint(WaitViewSyncPointReq) returns (WaitViewSyncPointRsp);
}
