syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "rows.proto";
import "dataset_markers.proto";

message DatasetPeriodExpectation {
  string space_id = 1;
  string dataset_id = 2;
  string frequency = 3;
  int64 period_time = 4;
  string series_hash = 5;
  uint32 expected_count = 6;
}

// SeriesSnapshotEntry 是快照中一条序列的身份（标的加 series_tag），Storage 用它重算 series_hash。
message SeriesSnapshotEntry {
  string subject_id = 1;
  string series_tag = 2;
}

message TimeSeriesBatchRow {
  uint32 series_index = 1;
  RowFieldUpsert row = 2;
}

// RowsCursor 是 ReadTimeSeriesRows 游标的内容，只在服务端编码与解码，不出现在公开请求中。
message RowsCursor {
  // 区间读取：最后一行的键。
  TimeSeriesRowKey last = 1;
  // 最近 N 根：当前序列（subject_id、freq、series_tag）、续读位置（该序列已返回的最早一根的 data_time）及该序列已返回的根数。
  string subject_id = 2;
  string freq = 3;
  string series_tag = 4;
  string resume_before = 5;
  uint32 returned = 6;
}


message PrimaryRegisterSeriesSnapshotReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string dataset_id = 3;
  string frequency = 4;
  repeated SeriesSnapshotEntry series = 5;
  int64 effective_from = 6;
}

message PrimaryRegisterSeriesSnapshotRsp {
  common.RetInfo ret_info = 1;
  string series_hash = 2;
  uint32 expected_count = 3;
  bool already_registered = 4;
}

message PrimaryCommitTimeSeriesBatchReq {
  common.AuthInfo auth_info = 1;
  DatasetPeriodExpectation expectation = 2;
  repeated TimeSeriesBatchRow items = 3;
}

message PrimaryCommitTimeSeriesBatchRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
  string period_status = 3;
  repeated uint32 accepted_series_indexes = 4;
}

// PrimaryUpsertFieldsReq 写入一个数据集的行：每行的数据集必须与 space_id、dataset_id 一致；一次写入只产生一条行变更事件。
message PrimaryUpsertFieldsReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string dataset_id = 3;
  repeated RowFieldUpsert rows = 4;
  // 可选。同一数据集内同一 commit_id 只生效一次：内容相同返回成功，内容不同返回 CONFLICT。
  string commit_id = 5;
}

message PrimaryUpsertFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
}

// PrimaryReadRowsReq 按精确键读取，是唯一的精确读取入口。keys 最多 1 万个。
message PrimaryReadRowsReq {
  common.AuthInfo auth_info = 1;
  repeated RowKey keys = 2;
  repeated string column_names = 3;
  repeated string attribute_keys = 4;
}

// PrimaryReadRowsRsp 只返回存在的行（有任意字段或属性）：存在但请求的列都没有值时返回只有键的行，
// 不存在的键不返回；顺序与请求一致，调用方按键匹配。
message PrimaryReadRowsRsp {
  common.RetInfo ret_info = 1;
  repeated RowFieldValues rows = 2;
}

message ReportDatasetPeriodCompletedReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  DatasetPeriodCompletedMarker marker = 3;
}
message ReportDatasetPeriodCompletedRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}
message AppendDatasetSyncPointReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  DatasetSyncPointMarker sync_point = 3;
}

message AppendDatasetSyncPointRsp {
  common.RetInfo ret_info = 1;
  string event_id = 2;
}

message GetDatasetPeriodCompletedReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string dataset_id = 3;
  string cause_event_id = 4;
  int64 period_time = 5;
}
message GetDatasetPeriodCompletedRsp {
  common.RetInfo ret_info = 1;
  bool found = 2;
  string event_id = 3;
  DatasetPeriodCompletedMarker marker = 4;
}
message WaitViewSyncPointReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string view_id = 3;
  string request_id = 4;
  repeated string dataset_ids = 5;
  uint32 wait_timeout_ms = 6;
}

message WaitViewSyncPointRsp {
  common.RetInfo ret_info = 1;
  bool ready = 2;
  repeated string pending_dataset_ids = 3;
}

// PrimaryStore 是带元数据校验的读写入口，直接读写同进程的 Pebble 存储。
service PrimaryStore {
  // UpsertFields applies partial updates; omitted fields and attributes are retained.
  rpc UpsertFields(PrimaryUpsertFieldsReq) returns (PrimaryUpsertFieldsRsp);
  rpc RegisterSeriesSnapshot(PrimaryRegisterSeriesSnapshotReq) returns (PrimaryRegisterSeriesSnapshotRsp);
  rpc CommitTimeSeriesBatch(PrimaryCommitTimeSeriesBatchReq) returns (PrimaryCommitTimeSeriesBatchRsp);
  rpc ReadRows(PrimaryReadRowsReq) returns (PrimaryReadRowsRsp);
  rpc ReadTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
  rpc CountTimeSeriesRows(CountTimeSeriesRowsReq) returns (CountTimeSeriesRowsRsp);
  // ReadDatasetChanges 按序读取持久化的行变更日志，因子机的本地副本据此同步修正。
  rpc ReadDatasetChanges(ReadDatasetChangesReq) returns (ReadDatasetChangesRsp);
  rpc ReportDatasetPeriodCompleted(ReportDatasetPeriodCompletedReq) returns (ReportDatasetPeriodCompletedRsp);
  rpc AppendDatasetSyncPoint(AppendDatasetSyncPointReq) returns (AppendDatasetSyncPointRsp);
  rpc GetDatasetPeriodCompleted(GetDatasetPeriodCompletedReq) returns (GetDatasetPeriodCompletedRsp);
  rpc WaitViewSyncPoint(WaitViewSyncPointReq) returns (WaitViewSyncPointRsp);
}
