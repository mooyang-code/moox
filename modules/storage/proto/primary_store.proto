syntax = "proto3";

package trpc.moox.storage;

option go_package = "github.com/mooyang-code/moox/modules/storage/proto/storagegen;storagepb";

import "moox_common.proto";
import "common.proto";
import "rows.proto";

message PrimaryWriteFieldsReq {
  common.AuthInfo auth_info = 1;
  repeated RowFieldUpsert rows = 2;
}

message PrimaryWriteFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
}

message PrimaryReadFieldsReq {
  common.AuthInfo auth_info = 1;
  repeated RowKey keys = 2;
  repeated string field_ids = 3;
  repeated string attribute_keys = 4;
}

message PrimaryReadFieldsRsp {
  common.RetInfo ret_info = 1;
  repeated RowFieldValues rows = 2;
  repeated RowKey existing_keys = 3;
}

// PrimaryStore is the metadata-validating user boundary. It never exposes
// DataNode merge/scan terminology and routes one Dataset to its owner node.
service PrimaryStore {
  rpc WriteFields(PrimaryWriteFieldsReq) returns (PrimaryWriteFieldsRsp);
  rpc ReadFields(PrimaryReadFieldsReq) returns (PrimaryReadFieldsRsp);
  rpc MergeTimeSeriesRows(MergeTimeSeriesRowsReq) returns (MergeTimeSeriesRowsRsp);
  rpc ReadTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
  rpc MergeRecordRows(MergeRecordRowsReq) returns (MergeRecordRowsRsp);
  rpc ReadRecordRows(ReadRecordRowsReq) returns (ReadRecordRowsRsp);
}

message GetShardHeadsReq {
  common.AuthInfo auth_info = 1;
  string space_id = 2;
  string dataset_id = 3;
  DataKind data_kind = 4;
}

message GetShardHeadsRsp {
  common.RetInfo ret_info = 1;
  repeated RowKey keys = 2;
}

service PrimaryStoreScan {
  rpc ScanTimeSeriesRows(ReadTimeSeriesRowsReq) returns (ReadTimeSeriesRowsRsp);
  rpc ScanRecordRows(ReadRecordRowsReq) returns (ReadRecordRowsRsp);
  rpc GetShardHeads(GetShardHeadsReq) returns (GetShardHeadsRsp);
}
