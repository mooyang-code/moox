global:
  namespace: Development
  env_name: dev

server:
  filter:
    - recovery
    - validation
    - prometheus
  timeout: 120000
  admin:
    ip: 127.0.0.1
    port: 11946
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.archive.ArchiveMgr
      ip: 127.0.0.1
      port: 11406
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 120000
    - name: trpc.moox.archive.ArchiveWorker
      ip: 127.0.0.1
      port: 11408
      network: tcp
      protocol: trpc
      transport: go-net
      timeout: 60000
    - name: trpc.moox.archive.Health
      ip: 127.0.0.1
      port: 11416
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.archive.mgr.trigger.timer
      port: 11407
      network: "* * * * * *"
      protocol: timer
      timeout: 900
    - name: trpc.moox.archive.mgr.maintain.timer
      port: 11409
      network: "13 * * * * *"
      protocol: timer
      timeout: 50000

plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12946
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          # 框架日志按大小轮转，单个文件 10MB、保留 5 份、最多 7 天；标准输出/错误主要是崩溃信息和数据库（GORM）日志，由 moox-runtime 启动前按大小轮转，持续报错时仍可能增长。
          log_path: ./logs
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
