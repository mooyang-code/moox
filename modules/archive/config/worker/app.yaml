# moox-archive-worker 配置。worker 只出站：经固定的 Access 访问 Storage 与 archive-mgr。
# key_file、storage_auth_file 相对本配置文件；root_dir 必须是绝对路径（不能放在 ~/Documents 下）。
gateway_client:
  access_address: access.example.test:11004
  access_id: access@storage
  caller: archive-worker
  key_id: ""                     # 由 Admin 分配（moox-admin-cli keys export --caller archive-worker）
  key_file: ../secrets/access-archive-worker.key

# 以 AppId archive 签名，只用于 Storage 识别调用方。
storage_auth_file: ../secrets/storage-primary-auth.secret

worker:
  worker_id: archive-worker@example-host   # 没配对象存储时，换机器要整体迁移目录并沿用同一个 worker_id
  root_dir: /data/moox-archive
  export_format: csv.gz             # csv.gz（默认）或 csv
  min_free_bytes: 5GB
  heartbeat_interval: 10s
  pull_interval: 5s

staging:
  cache_size: 256MB

# request_seconds 与 hour_quiet 只在还没收到 archive-mgr 下发的避让规则时使用（mgr 按采集频率推出，心跳回包下发）。
pacing:
  request_seconds: [25, 55]          # 每分钟内允许发起请求的秒区间
  minute_window: true                # 是否按秒窗口避让；false 则整分钟都可发请求（优先于 mgr 下发的规则，整点静默仍生效）
  hour_quiet: ["58:00", "04:00"]     # 每小时内不发起请求的区间
  request_interval: 200ms
  max_bytes_per_second: 512KB
  max_concurrent_runs: 4
  max_runs_per_data_node: 2
  page_rows: 500

health:
  addr: 127.0.0.1:11418

# 数据端口：分区副本下载与最新数据预览。固定监听 127.0.0.1:11428（服务目录登记的端口，不可配），不验签，控制台经 Admin（只出站主机上经 control 中转）进入。
data_api:
  max_bytes_per_second: 2MB          # 全部下载共享，与 pacing 的带宽分开计

maintenance:
  at: "04:17:43"                     # 每天维护时刻（本机时区）

# 对象存储副本（可选，整段省略表示不使用）：每次导出后把分区文件单次 PUT 到标准 S3 接口的对象存储，
# 读回已定稿分区时本地缺文件或校验不符就从这里取回。只用标准 S3 接口，后端可替换（COS、R2、自建）。
# object_store:
#   endpoint: cos.ap-nanjing.myqcloud.com   # 主机名[:端口]，不带 http://
#   region: ap-nanjing                       # 必填；R2 填 auto
#   bucket: moox-archive-1250000000          # COS 桶名带 APPID
#   prefix: moox-archive/                    # 默认；权限策略按它限定
#   url_style: virtual                       # 必填：virtual 或 path（COS 新建的桶只接受 virtual）
#   use_tls: true
#   storage_class: STANDARD_IA               # 可选，按 x-amz-storage-class 发送；留空用桶的默认
#   credentials_file: ../secrets/archive-object-store.env   # ACCESS_KEY_ID / SECRET_ACCESS_KEY，0600
