archive:
  root_dir: ../data/archive
  state_dir: ../data/archive-state
  device_id: parquet-local
  sources:
    stock_cn: {datasets: [equity_kline, etf_kline, index_kline]}
    stock_us: {datasets: [equity_kline, etf_kline, index_kline]}
    crypto_binance: {datasets: [spot_kline, swap_kline]}
    crypto_okx: {datasets: [spot_kline, swap_kline]}
  eventbus:
    urls: [nats://127.0.0.1:4222]
    credential_file: ~/.config/moox/eventbus/archive-eventbus.yaml
    stream: MOOX_STORAGE
    consumer: moox_archive_kline_v1
    fetch_batch: 128
    fetch_max_wait: 1s
    dedupe_retention: 168h
  materialize:
    pending_rows: 10000
    workers: 2
    row_group_rows: 65536
    shutdown_timeout: 2m
  storage_rpc:
    gateway_target: ip://127.0.0.1:11003
    gateway_node_id: ""
    key_id: archive
    hmac_key_file: ""
  cos:
    enabled: false
    region: ""
    bucket: ""
    prefix: moox/archive
    sync_open_partitions: false
    workers: 2
health:
  addr: 127.0.0.1:11416
