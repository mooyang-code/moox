archive:
  root_dir: ../data/archive
  state_dir: ../data/archive-state
  device_id: parquet-local
  sources:
    stockcn: {datasets: [dataset_stockcn_equity_kline, dataset_stockcn_index_kline, dataset_stockcn_bond_kline]}
    stockus: {datasets: [equity_kline, etf_kline, index_kline]}
    crypto: {datasets: [dataset_spot_kline_1h, dataset_perpetual_kline_1h]}
  eventbus:
    urls: [nats://127.0.0.1:4222]
    credential_file: ~/.config/moox/eventbus/archive-eventbus.yaml
    fetch_batch: 128
    fetch_max_wait: 1s
    dedupe_retention: 168h
  materialize:
    pending_rows: 10000
    workers: 2
    row_group_rows: 65536
    shutdown_timeout: 2m
  storage_rpc:
    gateway_target: ip://127.0.0.1:11003
    gateway_node_id: ""
    key_id: archive
    hmac_key_file: ""
  cos:
    enabled: false
    region: ""
    bucket: ""
    prefix: moox/archive
    sync_open_partitions: false
    workers: 2
health:
  addr: 127.0.0.1:11416
