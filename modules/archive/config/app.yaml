# 登记归档文件、回填时经本机主机网关访问 Storage
gateway_client:
  mode: local
  caller: archive
  key_file: ../secrets/caller-archive.key
  ca_file: ../certs/moox-ca.crt
  cache_dir: ../data/archive-gatewayclient
archive:
  root_dir: ../data/archive
  state_dir: ../data/archive-state
  device_id: parquet-local
  sources:
    stockcn: {datasets: [dataset_stockcn_equity_kline_1m, dataset_stockcn_index_kline_1d, dataset_stockcn_bond_kline_1m]}
  eventbus:
    urls: [nats://127.0.0.1:4222]
    credential_file: ~/.config/moox/eventbus/archive-eventbus.yaml
    fetch_batch: 128
    fetch_max_wait: 1s
    dedupe_retention: 168h
  materialize:
    pending_rows: 10000
    workers: 2
    row_group_rows: 65536
    shutdown_timeout: 2m
  cos:
    enabled: false
    region: ""
    bucket: ""
    prefix: moox/archive
    sync_open_partitions: false
    workers: 2
health:
  addr: 127.0.0.1:11416
