syntax = "proto3";

package trpc.moox.archive;

import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/archive/proto/archivegen;archivepb";

// 时间字段统一为 RFC3339（UTC）字符串；空串表示没有。

// ArchiveRun 是一次复核、手动、到点拉取或补拉区间的执行。
message ArchiveRun {
  string run_id = 1;
  string space_id = 2;
  string dataset_id = 3;
  // kind：scheduled（每小时或每天一次的复核，推进水位）、manual（立即运行，同复核）、
  // tick（到点拉取新收盘的几根，读下发区间、不推进水位）、range（补拉区间）。
  string kind = 4;
  string range_start = 5;
  string range_end = 6;
  // status：queued、running、succeeded、failed、canceled。
  string status = 7;
  string scheduled_at = 8;
  string started_at = 9;
  string finished_at = 10;
  string worker_id = 11;
  string lease_until = 12;
  uint64 subjects_total = 13;
  uint64 subjects_done = 14;
  uint64 request_count = 15;
  uint64 bytes_read = 16;
  uint64 rows_read = 17;
  uint64 rows_added = 18;
  uint64 rows_changed = 19;
  uint32 partitions_exported = 20;
  uint32 partitions_finalized = 21;
  repeated UnrecoverableRange unrecoverable = 22;
  string message = 23;
  // partitions_uploaded：本次运行上传到对象存储并校验通过的分区数。
  uint32 partitions_uploaded = 24;
}

// UnrecoverableRange 是超出线上保留期、无法补齐的区间（按序列合并）。
message UnrecoverableRange {
  string subject_id = 1;
  string series_tag = 2;
  string start_time = 3;
  string end_time = 4;
}

// ArchiveTask 是一个时序数据集的归档任务。
message ArchiveTask {
  string space_id = 1;
  string dataset_id = 2;
  string freq = 3;
  // partition_unit：day、month。
  string partition_unit = 4;
  string data_node_id = 5;
  string retention = 6;
  // 每收盘多少根 K 线拉取一次（N，1～1440）；1d 及以上每天一次，忽略 N。
  uint32 pull_every_bars = 7;
  // 复核间隔（秒）：低于 1d 为 3600，1d 及以上为 86400。
  uint32 interval_seconds = 8;
  string backfill_from = 9;
  // status：enabled、paused。
  string status = 10;
  // 最近一次已处理的拉取边界与复核边界；为空表示还没处理过（下一次检查立即复核）。
  string last_boundary = 11;
  string last_review = 12;
  // 下一次拉取的时刻（下一个拉取边界之后的第一次检查，避让区间内的顺延到 :04:25）；停用时为空。
  string next_pull_at = 13;
  uint32 consecutive_skips = 14;
  string last_success_at = 15;
  string final_until = 16;
  string creator = 17;
  string created_at = 18;
  string updated_at = 19;
  // health：ok、warning、error、paused。
  string health = 20;
  string health_reason = 21;
  // 汇总（来自分区登记）。
  uint32 partition_count = 22;
  uint32 file_count = 23;
  uint64 total_rows = 24;
  uint64 total_file_bytes = 25;
  string min_data_time = 26;
  string max_data_time = 27;
  ArchiveRun last_run = 28;
  // 按任务累积的无法补齐区间（超出线上保留期）。
  repeated UnrecoverableRange unrecoverable = 29;
  // 分区登记被拒的原因（上报的行数或标的数比已登记的少）；非空时任务为异常，下一次被接受的完成上报清空。
  string blocked_reason = 30;
  // remote_verified_count：有文件且远端是当前版本、已校验的分区数；remote_pending_count：有文件但不满足上一条的分区数（含失败的）。
  // 没有启用对象存储时两者都是 0。
  uint32 remote_verified_count = 31;
  uint32 remote_pending_count = 32;
}

// ArchivePartition 是一个任务的一个分区（本地日；1d 及以上为月）。
message ArchivePartition {
  string space_id = 1;
  string dataset_id = 2;
  string partition_key = 3;
  string range_start = 4;
  string range_end = 5;
  // status：open、exported、final。
  string status = 6;
  string worker_id = 7;
  uint64 row_count = 8;
  uint64 subject_count = 9;
  string min_data_time = 10;
  string max_data_time = 11;
  string file_path = 12;
  uint64 file_bytes = 13;
  string file_sha256 = 14;
  repeated string columns = 15;
  string preview = 16;
  uint32 export_count = 17;
  string last_changed_at = 18;
  string exported_at = 19;
  string finalized_at = 20;
  string last_run_id = 21;
  // 远端副本：remote_key 是相对对象存储 prefix 的键；remote_sha256 等于 file_sha256 且 remote_verified_at 非空时远端是当前版本。
  string remote_key = 22;
  string remote_sha256 = 23;
  string remote_etag = 24;
  string remote_uploaded_at = 25;
  string remote_verified_at = 26;
  string remote_error = 27;
  // remote_state（mgr 计算）：off 未启用对象存储、none 没有文件、verified 已校验、failed 失败、pending 待上传。
  string remote_state = 28;
}

// ArchiveWorkerInfo 是 worker 最近一次心跳的状态。
message ArchiveWorkerInfo {
  string worker_id = 1;
  string instance_id = 2;
  string version = 3;
  string root_dir = 4;
  uint64 disk_total_bytes = 5;
  uint64 disk_free_bytes = 6;
  uint64 staging_bytes = 7;
  bool maintaining = 8;
  string pacing_json = 9;
  repeated string running_run_ids = 10;
  string lease_until = 11;
  string last_heartbeat_at = 12;
  // active：租约未过期。
  bool active = 13;
  ObjectStoreInfo object_store = 14;
}

// ObjectStoreInfo 是 worker 使用的对象存储摘要，不含任何凭据；endpoint 为空表示没有配置对象存储。
message ObjectStoreInfo {
  string endpoint = 1;
  string bucket = 2;
  string prefix = 3;
  string storage_class = 4;
  string url_style = 5;
}

// TaskRef 是一个归档任务的身份。
message TaskRef {
  string space_id = 1;
  string dataset_id = 2;
  // 任务自增 ID（十进制串）：任务删除后重建会得到新值，worker 据此丢弃旧任务遗留的暂存状态。
  string task_id = 3;
}

// ---- ArchiveMgr ----

message GetArchiveOverviewReq {}
message GetArchiveOverviewRsp {
  common.RetInfo ret_info = 1;
  ArchiveWorkerInfo worker = 2;
  // 其他曾经心跳过但租约已过期的 worker。
  repeated ArchiveWorkerInfo stale_workers = 3;
  repeated ArchiveRun running_runs = 4;
  uint32 task_count = 5;
  uint32 enabled_task_count = 6;
  uint32 queued_run_count = 7;
  repeated string alerts = 8;
}

message ListArchiveTasksReq {
  common.Page page = 1;
  // 内部调用方（CLI）可以指定空间；经 Console 的调用以请求头里的空间为准。
  string space_id = 2;
}
message ListArchiveTasksRsp {
  common.RetInfo ret_info = 1;
  repeated ArchiveTask tasks = 2;
  common.PageResult page_result = 3;
}

message PrepareArchiveTaskReq {
  string space_id = 1;
  string dataset_id = 2;
}
message PrepareArchiveTaskRsp {
  common.RetInfo ret_info = 1;
  string freq = 2;
  string partition_unit = 3;
  string retention = 4;
  string earliest_backfill_from = 5;
  string data_node_id = 6;
  // 推荐的拉取间隔（根数 N）。
  uint32 recommended_pull_every_bars = 7;
  bool exists = 8;
}

message PreviewArchiveScheduleReq {
  string space_id = 1;
  string dataset_id = 2;
  // 每收盘多少根 K 线拉取一次；0 表示默认 1。
  uint32 pull_every_bars = 3;
}
message PreviewArchiveScheduleRsp {
  common.RetInfo ret_info = 1;
  // 接下来 5 个拉取时刻（避让区间内的顺延到 :04:25，去重）。
  repeated string next_runs = 2;
  // 复核间隔（秒）。
  uint32 interval_seconds = 3;
  // 每次复核读取区间的长度（秒）：复核间隔 + 最少回看 + 一根 K 线的最大跨度。
  uint32 read_span_seconds = 4;
  // 上一个与当前分区的预计导出时间（收盘 + 最少回看之后的第一次拉取或复核）。
  repeated string partition_export_estimates = 5;
  // 接下来 3 个复核时刻。
  repeated string next_reviews = 6;
}

message CreateArchiveTaskReq {
  string space_id = 1;
  string dataset_id = 2;
  // 每收盘多少根 K 线拉取一次；0 表示默认 1。
  uint32 pull_every_bars = 3;
  string backfill_from = 4;
  // 创建后是否启用；默认启用。
  bool paused = 5;
}
message CreateArchiveTaskRsp {
  common.RetInfo ret_info = 1;
  ArchiveTask task = 2;
}

message UpdateArchiveTaskReq {
  string space_id = 1;
  string dataset_id = 2;
  // 每收盘多少根 K 线拉取一次；0 表示不修改。
  uint32 pull_every_bars = 3;
  string backfill_from = 4;
  // status：enabled、paused；停用后重新启用时清空两个边界，下一次检查立即复核。
  string status = 5;
  // 清除任务累积的无法补齐区间（确认过、不再需要提示时）。
  bool clear_unrecoverable = 6;
}
message UpdateArchiveTaskRsp {
  common.RetInfo ret_info = 1;
  ArchiveTask task = 2;
}

message DeleteArchiveTaskReq {
  string space_id = 1;
  string dataset_id = 2;
}
message DeleteArchiveTaskRsp {
  common.RetInfo ret_info = 1;
}

message RunArchiveTaskNowReq {
  string space_id = 1;
  string dataset_id = 2;
}
message RunArchiveTaskNowRsp {
  common.RetInfo ret_info = 1;
  ArchiveRun run = 2;
}

message BackfillArchiveRangeReq {
  string space_id = 1;
  string dataset_id = 2;
  string range_start = 3;
  string range_end = 4;
}
message BackfillArchiveRangeRsp {
  common.RetInfo ret_info = 1;
  ArchiveRun run = 2;
}

message CancelArchiveRunReq {
  string run_id = 1;
}
message CancelArchiveRunRsp {
  common.RetInfo ret_info = 1;
  ArchiveRun run = 2;
}

message ListArchiveRunsReq {
  // 为空表示当前空间的全部任务。
  string dataset_id = 1;
  // 为空表示全部状态。
  string status = 2;
  common.Page page = 3;
  string space_id = 4;
  // 是否列出成功的到点拉取（tick）运行；默认不列（每分钟一条），排队、运行中、失败和取消的 tick 照常列出。
  bool include_ticks = 5;
}
message ListArchiveRunsRsp {
  common.RetInfo ret_info = 1;
  repeated ArchiveRun runs = 2;
  common.PageResult page_result = 3;
}

message GetArchiveRunReq {
  string run_id = 1;
}
message GetArchiveRunRsp {
  common.RetInfo ret_info = 1;
  ArchiveRun run = 2;
}

message ListArchivePartitionsReq {
  string dataset_id = 1;
  // 起止月份（YYYY-MM，含）；为空表示不限。
  string from_month = 2;
  string to_month = 3;
  common.Page page = 4;
  string space_id = 5;
}
message ListArchivePartitionsRsp {
  common.RetInfo ret_info = 1;
  repeated ArchivePartition partitions = 2;
  common.PageResult page_result = 3;
}

message GetArchivePartitionReq {
  string dataset_id = 1;
  string partition_key = 2;
  string space_id = 3;
}
message GetArchivePartitionRsp {
  common.RetInfo ret_info = 1;
  ArchivePartition partition = 2;
}

// RetireArchiveWorkerReq 删除一条不再使用的 worker 登记（例如换机后的旧记录）；仍持有活动租约的 worker 不能退役。
message RetireArchiveWorkerReq {
  string worker_id = 1;
}
message RetireArchiveWorkerRsp {
  common.RetInfo ret_info = 1;
  // retired：删除了登记；为 false 表示本来就没有这条登记。
  bool retired = 2;
}

service ArchiveMgr {
  rpc GetArchiveOverview(GetArchiveOverviewReq) returns (GetArchiveOverviewRsp);
  rpc ListArchiveTasks(ListArchiveTasksReq) returns (ListArchiveTasksRsp);
  rpc PrepareArchiveTask(PrepareArchiveTaskReq) returns (PrepareArchiveTaskRsp);
  rpc PreviewArchiveSchedule(PreviewArchiveScheduleReq) returns (PreviewArchiveScheduleRsp);
  rpc CreateArchiveTask(CreateArchiveTaskReq) returns (CreateArchiveTaskRsp);
  rpc UpdateArchiveTask(UpdateArchiveTaskReq) returns (UpdateArchiveTaskRsp);
  rpc DeleteArchiveTask(DeleteArchiveTaskReq) returns (DeleteArchiveTaskRsp);
  rpc RunArchiveTaskNow(RunArchiveTaskNowReq) returns (RunArchiveTaskNowRsp);
  rpc BackfillArchiveRange(BackfillArchiveRangeReq) returns (BackfillArchiveRangeRsp);
  rpc CancelArchiveRun(CancelArchiveRunReq) returns (CancelArchiveRunRsp);
  rpc ListArchiveRuns(ListArchiveRunsReq) returns (ListArchiveRunsRsp);
  rpc GetArchiveRun(GetArchiveRunReq) returns (GetArchiveRunRsp);
  rpc ListArchivePartitions(ListArchivePartitionsReq) returns (ListArchivePartitionsRsp);
  rpc GetArchivePartition(GetArchivePartitionReq) returns (GetArchivePartitionRsp);
  rpc RetireArchiveWorker(RetireArchiveWorkerReq) returns (RetireArchiveWorkerRsp);
}

// ---- ArchiveWorker：mgr 与 worker 之间的内部契约，只有外部身份 archive-worker 可以调用 ----

message ArchiveWorkerHeartbeatReq {
  string worker_id = 1;
  string instance_id = 2;
  string version = 3;
  string root_dir = 4;
  uint64 disk_total_bytes = 5;
  uint64 disk_free_bytes = 6;
  uint64 staging_bytes = 7;
  bool maintaining = 8;
  bool disk_low = 9;
  string pacing_json = 10;
  repeated string running_run_ids = 11;
  ObjectStoreInfo object_store = 12;
}
message ArchiveWorkerHeartbeatRsp {
  common.RetInfo ret_info = 1;
  // active：本实例持有活动租约。
  bool active = 2;
  uint32 lease_ttl_seconds = 3;
  // 需要取消的运行（用户取消，或租约已不属于本 worker）。
  repeated string cancel_run_ids = 4;
  // 当前全部任务（只在 active 为真时下发）：worker 维护时删掉不在列表里的数据集的暂存状态。
  repeated TaskRef tasks = 5;
}

// DataNodeLoad 是 worker 当前在某个 DataNode 上占用的运行数。
message DataNodeLoad {
  string data_node_id = 1;
  uint32 running = 2;
}

message PullArchiveRunReq {
  string worker_id = 1;
  string instance_id = 2;
  // 空闲的并发槽数，最多返回这么多个运行。
  uint32 free_slots = 3;
  // 每个 DataNode 允许同时运行的上限。
  uint32 max_runs_per_data_node = 4;
  repeated DataNodeLoad busy_data_nodes = 5;
}

// RunAssignment 是下发给 worker 的一次运行的全部参数。
message RunAssignment {
  string run_id = 1;
  string lease_token = 2;
  string kind = 3;
  string space_id = 4;
  string dataset_id = 5;
  string freq = 6;
  string partition_unit = 7;
  string data_node_id = 8;
  string retention = 9;
  // 复核间隔（秒）；首次复核没有水位与回补起点时从「开始 − 复核间隔 − L − S」读起。
  uint32 interval_seconds = 10;
  // 最少回看时长 L（秒）。
  uint32 min_lookback_seconds = 11;
  // 空间时区与本地收盘时刻（"15:00"；空串表示全天交易）。
  string space_tz = 12;
  string local_close = 13;
  // 暂存保留期（秒）。
  uint32 staging_retention_seconds = 14;
  string scheduled_at = 15;
  // 本次运行开始（读取区间的终点）。
  string started_at = 16;
  // 读取区间（kind=range 或 tick 时有值）。
  string range_start = 17;
  string range_end = 18;
  // 回补起点（任务设置，首次运行使用）。
  string backfill_from = 19;
  uint32 lease_ttl_seconds = 20;
  // 任务自增 ID（不复用）。任务删除后重建会得到新值，worker 据此丢弃旧任务遗留的水位和暂存数据。
  string task_id = 21;
  // 数据集元数据 JSON（名称、简介、数据来源、标的范围等），由 mgr 从 Storage 读取，worker 写进 <space>/<dataset_id>/dataset.json。
  string dataset_meta_json = 22;
  // 任务最近一次成功的复核或手动运行的开始时间（即读取水位）；worker 本地没有水位时用它。
  string last_success_at = 23;
  // 该任务在 mgr 的分区登记（只含结束时间晚于「本次开始 − 线上保留期」的，不带预览与列名）；worker 本地缺分区状态时据此补齐。
  repeated PartitionReport registered_partitions = 24;
}
message PullArchiveRunRsp {
  common.RetInfo ret_info = 1;
  repeated RunAssignment runs = 2;
}

message ReportArchiveRunProgressReq {
  string worker_id = 1;
  string run_id = 2;
  string lease_token = 3;
  uint64 subjects_total = 4;
  uint64 subjects_done = 5;
  uint64 request_count = 6;
  uint64 bytes_read = 7;
  uint64 rows_read = 8;
}
message ReportArchiveRunProgressRsp {
  common.RetInfo ret_info = 1;
  // canceled：运行已被取消或租约已丢失，worker 应停止。
  bool canceled = 2;
}

// PartitionReport 是本次运行涉及的一个分区的登记信息。
message PartitionReport {
  string partition_key = 1;
  string range_start = 2;
  string range_end = 3;
  // status：open、exported、final。
  string status = 4;
  uint64 row_count = 5;
  uint64 subject_count = 6;
  string min_data_time = 7;
  string max_data_time = 8;
  string file_path = 9;
  uint64 file_bytes = 10;
  string file_sha256 = 11;
  repeated string columns = 12;
  string preview = 13;
  uint32 export_count = 14;
  string last_changed_at = 15;
  string exported_at = 16;
  string finalized_at = 17;
  // 远端副本（worker 上报与 mgr 下发两个方向都用），含义同 ArchivePartition。
  string remote_key = 18;
  string remote_sha256 = 19;
  string remote_etag = 20;
  string remote_uploaded_at = 21;
  string remote_verified_at = 22;
  string remote_error = 23;
}

message CompleteArchiveRunReq {
  string worker_id = 1;
  string run_id = 2;
  string lease_token = 3;
  // status：succeeded、failed、canceled。
  string status = 4;
  string message = 5;
  uint64 subjects_total = 6;
  uint64 subjects_done = 7;
  uint64 request_count = 8;
  uint64 bytes_read = 9;
  uint64 rows_read = 10;
  uint64 rows_added = 11;
  uint64 rows_changed = 12;
  uint32 partitions_exported = 13;
  uint32 partitions_finalized = 14;
  repeated UnrecoverableRange unrecoverable = 15;
  repeated PartitionReport partitions = 16;
  // 定稿边界：此时间之前的分区均已定稿；空串表示不更新。
  string final_until = 17;
  uint32 partitions_uploaded = 18;
}
message CompleteArchiveRunRsp {
  common.RetInfo ret_info = 1;
}

service ArchiveWorker {
  rpc ArchiveWorkerHeartbeat(ArchiveWorkerHeartbeatReq) returns (ArchiveWorkerHeartbeatRsp);
  rpc PullArchiveRun(PullArchiveRunReq) returns (PullArchiveRunRsp);
  rpc ReportArchiveRunProgress(ReportArchiveRunProgressReq) returns (ReportArchiveRunProgressRsp);
  rpc CompleteArchiveRun(CompleteArchiveRunReq) returns (CompleteArchiveRunRsp);
}
