<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MooX 配置</title>
<style nonce="{{.Nonce}}">
:root {
  color-scheme: light dark;
  --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --ink-2: #44403c; --muted: #78716c; --faint: #a8a29e;
  --line: #e7e5e4; --line-2: #d6d3d1; --field: #ffffff; --hover: #f5f5f4;
  --brand: #1d4ed8; --brand-ink: #ffffff; --brand-tint: #eff4ff;
  --ok: #15803d; --ok-tint: #f0fdf4; --warn: #b45309; --warn-tint: #fffbeb; --err: #b91c1c; --err-tint: #fef2f2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --panel: #1a1a1a; --ink: #f5f5f4; --ink-2: #d6d3d1; --muted: #a8a29e; --faint: #78716c;
    --line: #2a2a2a; --line-2: #3a3a3a; --field: #141414; --hover: #222222;
    --brand: #6b8cff; --brand-ink: #0b0b0b; --brand-tint: #1b2238;
    --ok: #4ade80; --ok-tint: #12251a; --warn: #fbbf24; --warn-tint: #2a2210; --err: #f87171; --err-tint: #2a1515;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.topbar { height: 56px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; padding: 0 28px; gap: 12px; position: sticky; top: 0; z-index: 10; }
.brand { font-weight: 650; letter-spacing: .3px; font-size: 15px; }
.topbar .sep { color: var(--line-2); }
.topbar .title { color: var(--muted); }
.timer { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.timer b { color: var(--ink-2); font-weight: 600; }
.timer.warn, .timer.warn b { color: var(--warn); }
.timer.urgent, .timer.urgent b { color: var(--err); }

.layout { max-width: 1040px; margin: 0 auto; padding: 40px 28px 120px; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 56px; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; gap: 20px; padding: 24px 16px 120px; } .nav { display: flex; gap: 16px; position: static; } }
.nav { list-style: none; margin: 0; padding: 0; position: sticky; top: 96px; align-self: start; }
.nav li { padding: 6px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; margin-bottom: 4px; white-space: nowrap; }
.nav li:hover { background: var(--hover); }
.nav li.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--brand); }

h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.2px; }
.lede { color: var(--muted); margin: 0 0 24px; max-width: 640px; }
.alert { margin: 0 0 20px; padding: 10px 12px; border-radius: 6px; font-size: 13.5px; }
.alert.err { background: var(--err-tint); color: var(--err); }
.alert.ok { background: var(--ok-tint); color: var(--ok); }
.alert.warn { background: var(--warn-tint); color: var(--warn); }
.status { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 8px; margin-bottom: 28px; font-size: 13.5px; }
.status.ok { background: var(--ok-tint); color: var(--ink-2); }
.status.ok svg { color: var(--ok); }
.status.warn { background: var(--warn-tint); color: var(--ink-2); }
.status.warn svg { color: var(--warn); }
.status svg { flex: none; width: 18px; height: 18px; }
.status span { flex: 1; }

.block { border-top: 1px solid var(--line); padding: 24px 0; display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 24px; }
.block:first-of-type { border-top: none; padding-top: 0; }
@media (max-width: 900px) { .block { grid-template-columns: 1fr; gap: 10px; } }
.block h2 { font-size: 15px; font-weight: 600; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: 12.5px; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
table.kv th { width: 140px; color: var(--muted); font-size: 13.5px; border-bottom: 1px solid var(--line); padding: 10px 12px 10px 0; font-weight: 500; vertical-align: top; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.uses span { display: inline-block; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 6px; margin: 0 4px 2px 0; }
.secret { display: inline-flex; gap: 8px; align-items: center; }
.secret .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
.link { border: none; background: none; color: var(--brand); padding: 0; height: auto; font-size: 12.5px; cursor: pointer; }
.link:hover { text-decoration: underline; background: none; }

.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
.fields.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .fields, .fields.two { grid-template-columns: 1fr; } }
label.f { display: block; min-width: 0; }
label.f > span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
label.f > small { display: block; font-size: 12px; color: var(--faint); margin-top: 6px; }
input[type=text], input[type=password], input[type=number], select { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px;
  background: var(--field); color: var(--ink); font: inherit; font-size: 13.5px; }
input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
label.f > span.withbtn, .withbtn { display: flex; gap: 6px; margin: 0; font-weight: 400; }
.withbtn input { flex: 1; min-width: 0; }
.withbtn button { height: 34px; padding: 0 10px; font-size: 12.5px; }
.host { padding: 12px 0; border-top: 1px dashed var(--line); }
.host:first-child { border-top: none; padding-top: 0; }
.host-head { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.host-head b { color: var(--ink); font-weight: 600; margin-right: 8px; }
.desc { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
table.grid td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.grid th { white-space: nowrap; }
table.grid input { height: 30px; font-size: 12.5px; }
.scroll { overflow-x: auto; margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.row .hint { color: var(--faint); font-size: 12.5px; }

.footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 10; }
.footer-in { max-width: 1040px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
.privacy { display: flex; gap: 8px; align-items: flex-start; margin-right: auto; color: var(--muted); font-size: 12.5px; line-height: 1.5; max-width: 680px; }
.privacy svg { flex: none; width: 15px; height: 15px; margin-top: 1px; color: var(--ok); }
.privacy b { font-weight: 600; color: var(--ink-2); }
button { font: inherit; height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
button:hover { background: var(--hover); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; padding: 0 20px; }
button.primary:hover { filter: brightness(1.08); background: var(--brand); }
.finish { max-width: 520px; padding-top: 24px; }
.finish .mark { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ok); color: var(--ok); display: grid; place-items: center; margin-bottom: 18px; font-size: 20px; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">MooX</span><span class="sep">/</span><span class="title">配置</span>
  <span class="timer" id="timer"></span>
</div>

<div class="layout" id="layout">
  <ul class="nav" id="nav">
    <li data-page="overview" class="on">概览</li>
    <li data-page="edit">修改配置</li>
  </ul>
  <main>
    <div class="alert" id="alert" role="alert" hidden></div>

    <section id="page-overview">
      <h1>当前配置</h1>
      <p class="lede">这是 MooX 正在使用的配置。密码和密钥默认隐藏，点「显示」才会出现在这个页面上。</p>
      <div class="status" id="status"></div>
      <div class="block"><h2>服务器</h2>
        <table id="servers"><thead><tr><th>用途</th><th>IP 地址</th><th>地域</th><th>SSH 登录</th><th>SSH 密码</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="block"><h2>账号与通知</h2><table class="kv" id="accounts"></table></div>
    </section>

    <section id="page-edit" hidden>
      <h1>修改配置</h1>
      <p class="lede">修改常用设置。保存前会完整校验，有错误不会保存；保存后重新加密写回，并同步备份到你的管理后台。</p>
      <div id="form"></div>
      <div class="row">
        <button type="button" class="primary" id="save">保存修改</button>
        <button type="button" id="reset">放弃修改</button>
        <span class="hint">因子、云函数、出口代理等高级设置不在这里，保存时原样保留。</span>
      </div>
    </section>

    <section class="finish" id="page-done" hidden>
      <div class="mark">✓</div>
      <h1>已关闭</h1>
      <p class="lede">可以关闭这个页面，回到 Agent 继续。</p>
    </section>
  </main>
</div>

<div class="footer" id="footer">
  <div class="footer-in">
    <span class="privacy" id="privacy"></span>
    <button type="button" id="close">完成</button>
  </div>
</div>

<script type="application/json" id="boot">{{.Boot}}</script>
<script nonce="{{.Nonce}}">
(function () {
  'use strict';
  var boot = JSON.parse(document.getElementById('boot').textContent);
  var state = { overview: null, form: null, dirty: false, closed: false };
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === 'class') node.className = attrs[key];
      else if (key === 'text') node.textContent = attrs[key];
      else node.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) { if (child) node.append(typeof child === 'string' ? document.createTextNode(child) : child); });
    return node;
  }
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>';
  function icon(svg) { var t = document.createElement('template'); t.innerHTML = svg; return t.content.firstChild; }
  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (!response.ok || !data.ok) throw new Error(data.message || '请求失败（HTTP ' + response.status + '）');
          return data;
        });
      }, function () { throw new Error('连不上本机的配置服务：页面可能已超时关闭，请回到 Agent 重新打开。'); });
  }
  function showAlert(message, kind) { var box = $('alert'); box.textContent = message || ''; box.className = 'alert ' + (kind || 'err'); box.hidden = !message; if (message) window.scrollTo(0, 0); }

  // 本机保存成功后，再说明有没有同步到管理后台的备份。
  function showSaved(sync) {
    var failed = sync && sync.indexOf('暂时没能') >= 0;
    showAlert('已校验并加密保存在这台电脑上。' + (sync && !failed ? sync : ''), 'ok');
    if (failed) showAlert(sync, 'warn');
  }

  function secret(field, masked) {
    var value = el('span', { class: 'value', text: masked || '••••••••' });
    var button = el('button', { type: 'button', class: 'link', text: '显示' });
    var shown = false;
    button.addEventListener('click', function () {
      if (shown) { value.textContent = masked || '••••••••'; button.textContent = '显示'; shown = false; return; }
      post('config/reveal', { field: field }).then(function (data) { value.textContent = data.value || '（空）'; button.textContent = '隐藏'; shown = true; }, function (err) { showAlert(err.message); });
    });
    return el('span', { class: 'secret' }, [value, button]);
  }

  function renderOverview(view) {
    state.overview = view;
    var status = $('status');
    if (view.encrypted) {
      status.className = 'status ok';
      status.replaceChildren(icon(LOCK), el('span', { text: '已加密保存在这台电脑上，解密用的密钥存放在' + view.key_store + '。' }));
    } else {
      var encrypt = el('button', { type: 'button', text: '加密保存' });
      encrypt.addEventListener('click', function () {
        encrypt.disabled = true;
        post('config/encrypt').then(function (data) { renderOverview(data.overview); showSaved(data.sync); }, function (err) { showAlert(err.message); encrypt.disabled = false; });
      });
      status.className = 'status warn';
      status.replaceChildren(icon(WARN), el('span', { text: '这份配置目前是明文保存的。加密后，密钥会存放在' + view.key_store + '，文件被拷走也无法读取。' }), encrypt);
    }
    var body = $('servers').tBodies[0];
    body.replaceChildren();
    (view.servers || []).forEach(function (server) {
      var uses = el('span', { class: 'uses' }, (server.uses.length ? server.uses : ['未放置服务']).map(function (u) { return el('span', { text: u }); }));
      body.append(el('tr', {}, [
        el('td', {}, [uses]),
        el('td', { class: 'mono', text: server.address }),
        el('td', { class: server.region ? '' : 'muted', text: server.region || '—' }),
        el('td', { class: 'mono', text: server.ssh_user + (server.ssh_port && server.ssh_port !== 22 ? ' · 端口 ' + server.ssh_port : '') }),
        el('td', {}, [server.has_password ? secret('hosts.' + server.id + '.password') : el('span', { class: 'muted', text: '用密钥登录' })])
      ]));
    });
    var rows = [
      ['腾讯云 SecretId', secret('tencent.secret_id', view.secret_id)],
      ['腾讯云 SecretKey', secret('tencent.secret_key')],
      ['默认地域', el('span', { text: view.region || '—' })],
      ['管理员', el('span', { text: view.admin })],
      ['管理员密码', secret('admin.password')],
      ['告警', el('span', { text: view.channel || '—' })],
      ['告警 Webhook', view.has_webhook ? secret('notification.webhook_url') : el('span', { class: 'muted', text: '未填写' })],
      ['因子计算', el('span', { text: view.factor_engine || '未配置' })]
    ];
    $('accounts').replaceChildren.apply($('accounts'), rows.map(function (row) { return el('tr', {}, [el('th', { text: row[0] }), el('td', {}, [row[1]])]); }));
    var privacy = $('privacy');
    privacy.replaceChildren(icon(LOCK), el('span', {}, view.encrypted
      ? ['配置加密保存在这台电脑上，密钥存放在' + view.key_store + '，', el('b', { text: '不会发给 AI，也不会发给 MooX 开发者' }), '。保存时会用管理员密码加密备份到你自己的管理后台，换电脑时可以恢复。']
      : ['配置保存在这台电脑上，', el('b', { text: '不会发给 AI，也不会发给 MooX 开发者' }), '。建议加密保存。']));
  }

  function show(page) {
    ['overview', 'edit'].forEach(function (name) { $('page-' + name).hidden = name !== page; });
    Array.prototype.forEach.call($('nav').children, function (li) { li.className = li.getAttribute('data-page') === page ? 'on' : ''; });
    showAlert('');
    if (page === 'edit' && !state.form) loadForm();
  }
  Array.prototype.forEach.call($('nav').children, function (li) { li.addEventListener('click', function () { show(li.getAttribute('data-page')); }); });

  // ---------- 修改配置（表单） ----------
  function input(attrs, value) {
    var node = el('input', Object.assign({ type: 'text', autocomplete: 'off', spellcheck: 'false' }, attrs));
    node.value = value == null ? '' : String(value);
    node.addEventListener('input', function () { state.dirty = true; });
    return node;
  }
  function field(label, control, note) {
    return el('label', { class: 'f' }, [el('span', { text: label }), control, note ? el('small', { text: note }) : null]);
  }
  function secretInput(value) {
    var box = input({ type: 'password', autocomplete: 'new-password' }, value);
    var toggle = el('button', { type: 'button', text: '显示' });
    toggle.addEventListener('click', function () { var hidden = box.type === 'password'; box.type = hidden ? 'text' : 'password'; toggle.textContent = hidden ? '隐藏' : '显示'; });
    return { input: box, node: el('span', { class: 'withbtn' }, [box, toggle]) };
  }
  function block(title, desc, body) {
    return el('div', { class: 'block' }, [el('div', {}, [el('h2', { text: title }), desc ? el('p', { class: 'desc', text: desc }) : null]), body]);
  }
  var ctl = {};
  function renderForm(form) {
    state.form = form; state.dirty = false; ctl = { hosts: [], defaults: {}, spaces: [] };
    var root = $('form');
    root.replaceChildren();

    ctl.adminUser = input({}, form.admin.username);
    var adminPass = secretInput(form.admin.password); ctl.adminPass = adminPass.input;
    root.append(block('管理员', '登录管理台的账号。密码设定后不能修改，这里填的必须和管理台的登录密码一致（配置备份也用它加密）。',
      el('div', { class: 'fields two' }, [field('用户名', ctl.adminUser), field('密码', adminPass.node)])));

    ctl.secretId = input({}, form.tencent.secret_id);
    var secretKey = secretInput(form.tencent.secret_key); ctl.secretKey = secretKey.input;
    root.append(block('腾讯云', '访问密钥。更换后需要重新部署采集云函数才会生效。',
      el('div', { class: 'fields two' }, [field('SecretId', ctl.secretId), field('SecretKey', secretKey.node)])));

    ctl.channel = el('select', {}, [el('option', { value: 'wecom', text: '企业微信群机器人' }), el('option', { value: 'feishu', text: '飞书群机器人' })]);
    ctl.channel.value = form.notification.channel_type || 'wecom';
    ctl.channel.addEventListener('change', function () { state.dirty = true; });
    var webhook = secretInput(form.notification.webhook_url); ctl.webhook = webhook.input;
    root.append(block('告警通知', '行情中断、服务异常时推送的群机器人。',
      el('div', { class: 'fields two' }, [field('发送到', ctl.channel), field('机器人 Webhook 地址', webhook.node)])));

    var hosts = el('div');
    form.hosts.forEach(function (host) {
      var user = input({}, host.ssh_user), port = input({ type: 'number', min: '1', max: '65535' }, host.ssh_port || 22);
      var pass = secretInput(host.ssh_password);
      ctl.hosts.push({ id: host.id, user: user, port: port, pass: pass.input });
      var head = el('div', { class: 'host-head' }, [el('b', { text: (host.uses && host.uses.length ? host.uses.join('、') : '服务器') }), host.address + (host.region ? ' · ' + host.region : '')]);
      hosts.append(el('div', { class: 'host' }, [head, el('div', { class: 'fields' }, [field('SSH 用户名', user), field('端口', port), field('SSH 密码', pass.node, '用密钥登录时留空')])]));
    });
    root.append(block('服务器登录', 'IP 和用途不能在这里改（需要重新部署）；可以修改 SSH 登录方式。', hosts));

    var r = form.retention;
    ctl.viewBars = input({ type: 'number', min: '1' }, r.view_bars);
    var head = el('tr', {}, [el('th', { text: '频率' }), el('th', { text: '默认' })].concat(r.spaces.map(function (sp) { return el('th', { text: sp.name }); })));
    var rows = r.frequencies.map(function (freq) {
      var cells = [el('td', { class: 'mono', text: freq })];
      var def = input({ placeholder: '例如 7d' }, r.defaults[freq]);
      ctl.defaults[freq] = def;
      cells.push(el('td', {}, [def]));
      r.spaces.forEach(function (sp, i) {
        ctl.spaces[i] = ctl.spaces[i] || { id: sp.id, cells: {} };
        var cell = input({ placeholder: '跟随默认' }, sp.values[freq]);
        ctl.spaces[i].cells[freq] = cell;
        cells.push(el('td', {}, [cell]));
      });
      return el('tr', {}, cells);
    });
    var table = el('table', { class: 'grid' }, [el('thead', {}, [head]), el('tbody', {}, rows)]);
    root.append(block('数据保留', '原始数据按频率保留的时长：小时写 h、天写 d，例如 48h、7d，永久保留写 forever。市场一栏留空表示跟随默认。缩短保留期会删除数据。',
      el('div', {}, [el('div', { class: 'fields two' }, [field('每个序列保留的 K 线根数', ctl.viewBars, '给策略和管理台查询用的最近数据')]), el('div', { class: 'scroll' }, [table])])));

    ctl.logSize = input({ type: 'number', min: '1' }, form.logs.max_size_mb);
    ctl.logCount = input({ type: 'number', min: '0' }, form.logs.backup_count);
    root.append(block('本地日志', '各服务器上日志文件的大小上限，超过后保留尾部并截断。',
      el('div', { class: 'fields two' }, [field('单个日志上限（MB）', ctl.logSize), field('保留份数', ctl.logCount)])));
  }
  function loadForm() {
    post('config/form').then(function (data) { renderForm(data.form); }, function (err) { showAlert(err.message); });
  }
  function gatherForm() {
    var num = function (node) { return parseInt(node.value, 10) || 0; };
    var defaults = {};
    Object.keys(ctl.defaults).forEach(function (freq) { if (ctl.defaults[freq].value.trim() || state.form.retention.defaults[freq] != null) defaults[freq] = ctl.defaults[freq].value.trim(); });
    return {
      admin: { username: ctl.adminUser.value.trim(), password: ctl.adminPass.value },
      tencent: { secret_id: ctl.secretId.value.trim(), secret_key: ctl.secretKey.value },
      notification: { channel_type: ctl.channel.value, webhook_url: ctl.webhook.value.trim() },
      hosts: ctl.hosts.map(function (h) { return { id: h.id, ssh_user: h.user.value.trim(), ssh_port: num(h.port), ssh_password: h.pass.value }; }),
      retention: {
        view_bars: num(ctl.viewBars), defaults: defaults,
        spaces: ctl.spaces.map(function (sp) {
          var values = {};
          Object.keys(sp.cells).forEach(function (freq) { values[freq] = sp.cells[freq].value.trim(); });
          return { id: sp.id, values: values };
        })
      },
      logs: { max_size_mb: num(ctl.logSize), backup_count: num(ctl.logCount) }
    };
  }

  $('save').addEventListener('click', function () {
    if (!state.form) return;
    var button = $('save');
    button.disabled = true;
    post('config/update', gatherForm()).then(function (data) {
      renderOverview(data.overview);
      showSaved(data.sync);
      loadForm();
    }, function (err) { showAlert(err.message); }).finally(function () { button.disabled = false; });
  });
  $('reset').addEventListener('click', function () { if (state.form) renderForm(state.form); showAlert(''); });
  $('close').addEventListener('click', function () {
    if (state.dirty && !confirm('修改还没有保存，确定关闭吗？')) return;
    post('close').then(function () {
      state.closed = true;
      $('page-overview').hidden = true; $('page-edit').hidden = true; $('page-done').hidden = false;
      $('footer').hidden = true; $('nav').hidden = true; $('timer').hidden = true;
    }, function (err) { showAlert(err.message); });
  });

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function tick() {
    if (state.closed) return;
    var left = boot.deadline - Date.now(), timer = $('timer');
    if (left <= 0) { timer.className = 'timer urgent'; timer.textContent = '页面已过期，请回到 Agent 重新打开'; return; }
    var total = Math.ceil(left / 1000), h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60;
    timer.className = 'timer' + (left <= 2 * 60000 ? ' urgent' : left <= 10 * 60000 ? ' warn' : '');
    timer.replaceChildren('页面有效期还剩 ', el('b', { text: (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s) }));
  }
  tick();
  setInterval(tick, 1000);

  post('config/overview').then(function (data) { renderOverview(data.overview); }, function (err) { showAlert(err.message); });
})();
</script>
</body>
</html>
