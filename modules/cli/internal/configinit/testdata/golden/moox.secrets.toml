# moox.secrets.toml：秘密的初始值，和 moox.toml 放在同一目录，整份加密保存（config init 生成；解密密钥在系统钥匙串，
# 没有钥匙串的机器在 ~/.config/moox/config.key）。查看和修改用 moox-cli config get / set --file ./moox.secrets.toml 或 config edit，
# 不要直接打开文件，也不要把明文贴进对话、日志或文档。
#
# setup init 把 [admin]、[tencent_cloud]、[notification]、[[exchange_keys]] 写进管理台一次，只建不改，之后以管理台为准：
# 管理台里后来改的、新加的不会回到这个文件，这里再改也不会覆盖管理台。清空部署（setup wipe）之前，先在管理台导出改过的密钥。
# [logging.cls] 的写入密钥例外：它不进管理台，每次部署从这里读出来渲染进各组件的环境文件。

# 管理台的管理员账号。密码设定后不能修改，配置备份（config backup）也用它加密。
[admin]
username = "admin"
password = "Adm1n-P@ss"

# 腾讯云账号的管理密钥：管理台保存为 tencent-default，云函数账号与日志服务都引用它。默认地域取 moox.toml 里控制机的 region。
[tencent_cloud]
secret_id = "AKIDexample"
secret_key = "key-example"

# 告警渠道的初始值：Monitor 还没有任何渠道时由 setup init 写入一次，之后在管理台「资源与运维 › 监控告警」的“消息通知设置”里改。
# webhook_url 可以先留空，部署后在管理台添加；没有推送地址时监控只展示不通知。
# channel_type：wecom（企业微信）、feishu（飞书）、dingtalk（钉钉）、webhook（通用 Webhook，任意公网 HTTPS 地址）。
# secret 选填：飞书机器人启用“签名校验”、钉钉机器人启用“加签”时填它的密钥；通用 Webhook 填了就带签名请求头。企业微信留空。
[notification]
channel_type = "wecom"
webhook_url = "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=abc"
secret = ""

# 服务日志上报 CLS 的写入密钥（moox.toml 的 [logging.cls] 打开时必填）：只有那个日志主题上传权限的子账号密钥，
# 会下发到每台主机，不要填云账号的管理密钥。
[logging.cls]
writer_secret_id = ""
writer_secret_key = ""

# 交易所密钥（可选）：每把写成一段 [[exchange_keys]]。下面是注释掉的样例，只有取消注释才会生效；取消注释前先换成真实密钥。
#   name         只允许小写字母、数字和连字符，同一交易所、环境下不能重复；固定 ID 是 exchange-<交易所>-<环境>-<名称>。
#   exchange     binance 或 okx；environment 是 production 或 testnet。
#   api_key、secret_key（OKX 还要 passphrase）  config get 默认打码。
#   readonly     只读密钥设为 true：不能用来建交易账户。Collector 检测币安现货下架读的就是
#                name = "readonly" 的币安生产只读 Key（固定 ID exchange-binance-production-readonly）。
# 只建不改：密钥管理里已有这个 ID 时不覆盖（以管理台为准），已在管理台删除的不重建；删掉这里的条目也不会删除密钥管理里的密钥。
# 只有配了海外服务器（Trade 所在主机）才用得上。Trade 部署好之后检测：moox-cli trade inspect-credential，或在管理台「系统设置 › 密钥管理」点“测试连接”。
# [[exchange_keys]]
# name = "readonly"
# exchange = "binance"
# environment = "production"
# api_key = "填入币安只读 API Key"
# secret_key = "填入币安只读 Secret Key"
# readonly = true
#
# [[exchange_keys]]
# name = "main"
# exchange = "okx"
# environment = "production"
# api_key = "填入 OKX API Key"
# secret_key = "填入 OKX Secret Key"
# passphrase = "填入 OKX Passphrase"
