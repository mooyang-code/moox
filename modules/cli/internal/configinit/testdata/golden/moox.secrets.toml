# moox.secrets.toml：部署阶段需要的初始秘密，和 moox.toml 放在同一目录，整份加密保存（config init 生成；解密密钥在系统钥匙串，
# 没有钥匙串的机器在 ~/.config/moox/config.key）。查看和修改用 moox-cli config get / set --file ./moox.secrets.toml 或 config edit，
# 不要直接打开文件，也不要把明文贴进对话、日志或文档。
#
# setup init 只把 [tencent_cloud] 写入管理台（固定 ID tencent-default，只建不改，之后以管理台为准）；[admin] 在部署控制机时
# 建出管理员账号；[logging.cls] 的写入密钥不进管理台，每次部署从这里读出来渲染进各组件的环境文件。
# 交易所密钥与告警通知渠道不写在这个文件里：请在安装完成后到管理台页面录入（系统设置 › 密钥管理、资源与运维 › 监控告警），
# 换机或重装前用 moox-cli setup backup（或 setup wipe）备份成加密的 moox.backup。

# 管理台的管理员账号：部署控制机时按它建管理员。改密码在控制机上用 moox-admin-cli user set-password，改完把这里的 password 一起改掉（setup init 用它核对登录）。
[admin]
username = "admin"
password = "Adm1n-P@ss"

# 腾讯云账号的管理密钥：管理台保存为 tencent-default，云函数账号与日志服务都引用它。默认地域取 moox.toml 里控制机的 region。
[tencent_cloud]
secret_id = "AKIDexample"
secret_key = "key-example"

# 服务日志上报 CLS 的写入密钥（moox.toml 的 [logging.cls] 打开时必填）：只有那个日志主题上传权限的子账号密钥，
# 会下发到每台主机，不要填云账号的管理密钥。
[logging.cls]
writer_secret_id = ""
writer_secret_key = ""
