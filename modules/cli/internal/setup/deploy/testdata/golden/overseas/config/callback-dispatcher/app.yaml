# MooX 事件中心（callback-dispatcher）服务配置。
# 事件中心是全局服务：消费 EventBus 事件，按用户配置的规则向用户接口发通知或执行系统动作。

gateway_client:
  caller: callback-dispatcher
  key_id: key-callback-dispatcher
  key_file: /data/moox/secrets/caller-callback-dispatcher.key
  # 以下三项由部署渲染：本机主机 ID、本机网关地址与 MooX CA 根证书（相对本文件所在目录）。
  host_id: overseas
  local_address: 127.0.0.1:11002
  ca_file: /data/moox/secrets/moox-ca.crt
database:
  path: /data/moox/data/callback-dispatcher/moox_callback_dispatcher.db
# EventBus 连接；部署渲染时改写为实际地址和凭据路径。
eventbus:
  urls:
    - tls://203.0.113.11:4222
  credential_file: /data/moox/secrets/eventbus/callback-dispatcher-eventbus.yaml
# 通知投递：失败后按固定间隔重试，从第一次失败起超过 retry_window 就置为失败。
delivery:
  # 每轮最多同时处理的执行记录数。
  worker_batch: 8
  poll_interval: 1s
  connect_timeout: 3s
  request_timeout: 10s
  retry_window: 24h
# 执行记录与事件回执的保留时间。
retention:
  execution_days: 30
