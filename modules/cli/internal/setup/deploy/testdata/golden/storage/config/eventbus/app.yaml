# MooX EventBus 只负责单机 NATS JetStream 运行时；Stream 由 packages/events 的拓扑声明推出，不在这里配置。
broker:
  host: 0.0.0.0
  port: 4222
  client_advertise: 203.0.113.11:4222
  server_name: eventbus-storage
  store_dir: /data/moox/data/eventbus/jetstream
  startup_timeout: 10s
  max_payload_bytes: 8388608
  auth:
    enabled: true
    users_file: /data/moox/secrets/eventbus/users.yaml
  tls:
    ca_file: /data/moox/secrets/moox-ca.crt
    cert_file: /data/moox/secrets/host.crt
    enabled: true
    key_file: /data/moox/secrets/host.tls.key
internal_client:
  credential_file: /data/moox/secrets/eventbus/internal-admin.yaml
