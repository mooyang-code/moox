database:
  path: /data/moox/data/archive-mgr/archive.db
gateway_client:
  caller: archive-mgr
  # 本机的主机签名私钥，这台主机上的组件共用。
  key_file: /data/moox/secrets/host.key
  # 以下三项由部署渲染：本机主机 ID、本机网关地址与 MooX CA 根证书（相对本文件所在目录）。
  host_id: control
  local_address: 127.0.0.1:11002
  ca_file: /data/moox/secrets/moox-ca.crt
run:
  lease_ttl: 10m
schedule:
  # 复核从水位往前回看的最少时长；更早的晚到写入由 worker 按 Storage 的变更日志找出并重读。
  min_lookback: 15m
retention:
  scheduled_success: 720h
  other: 2160h
# worker 暂存区保留最近多久的数据，之后分区定稿。
staging_retention: 72h
spaces:
  crypto:
    tz: UTC
  stockcn:
    tz: Asia/Shanghai
    local_close: "15:00"
  stockhk:
    tz: Asia/Hong_Kong
    local_close: "16:10"
  stockus:
    tz: America/New_York
    local_close: "16:00"
