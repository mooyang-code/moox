database:
  path: /data/moox/data/archive-mgr/archive.db
gateway_client:
  caller: archive-mgr
  # 本机的主机签名私钥，这台主机上的组件共用。
  key_file: /data/moox/secrets/host.key
  # 以下三项由部署渲染：本机主机 ID、本机网关地址与 MooX CA 根证书（相对本文件所在目录）。
  host_id: control
  local_address: 127.0.0.1:11002
  ca_file: /data/moox/secrets/moox-ca.crt
run:
  lease_ttl: 10m
  # 运行记录（manual、range、import）的保留期；不小于 7 天。
  retention: 2160h
# 分区收盘后再等多久才导出（允许迟到的写入）；不小于 15 分钟。
allowed_lateness: 15m
# worker 暂存区保留最近多久的数据，之后分区定稿。
staging_retention: 72h
