global:
  namespace: Production
  env_name: access
server:
  filter:
    - recovery
  timeout: 30000
  # 停止时等待进行中的请求完成再断开连接（毫秒），小于运行脚本给组件的停止超时。
  max_close_wait_time: 10000
  admin:
    ip: 127.0.0.1
    port: 20004
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.access.Access
      ip: 0.0.0.0
      port: 11004
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.access.Health
      ip: 0.0.0.0
      port: 11014
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12964
      path: /metrics
      enablepush: false
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: /data/moox/compute-1/logs/access
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
