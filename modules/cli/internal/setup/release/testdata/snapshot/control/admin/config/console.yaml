# 缓存配置（认证服务使用BadgerDB）
cache:
  data_dir: /data/moox/prod/data/admin/badger # BadgerDB数据存储目录
# JWT配置（认证服务使用）
jwt:
  # JWT 密钥由 MOOX_ADMIN_JWT_SECRET_KEY 注入，至少 32 个字符。
  secret_key: ""
  access_expired: "24h" # 访问令牌过期时间
# 安全配置（认证服务使用）
security:
  salt_expired: "5m" # 登录盐值过期时间
  max_login_attempt: 5 # 最大登录尝试次数
  lock_duration: "15m" # 账户锁定时间
  session_ttl: "24h"
  request_clock_skew: "60s"
  nonce_ttl: "2m"
  raw_ticket_ttl: "60s"
# 控制台 API 配置
gateway:
  # 是否开启调试模式
  debug: true
  # 不需要鉴权的接口列表
  no_auth_methods:
    - "/api/admin/auth/GetLoginSalt"
    - "/api/admin/auth/Login"
  # 这里不维护服务地址：/api/admin/<console_name>/<方法> 按组件目录映射到 tRPC 服务，
  # 管理后台自己的服务在进程内调用，其他服务经主机网关转发。
# CORS 跨域配置（生产环境请配置具体前端域名，避免使用 *）
cors:
  allowed_origins:
    - "*"
# 限流配置
rate_limit:
  # 默认限流配置
  default_qps: 2000 # 默认QPS限制
  default_burst: 5000 # 默认突发流量
  # 按接口配置限流
  method_limits:
    "/api/admin/auth/Login":
      qps: 1
      burst: 2
    "/api/admin/auth/GetLoginSalt":
      qps: 2
      burst: 5
    "/api/admin/auth/GetUserInfo":
      qps: 2
      burst: 5
