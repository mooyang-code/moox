# MooX EventBus 只负责单机 NATS JetStream 运行时和基础拓扑。
broker:
  host: 0.0.0.0
  port: 4222
  client_advertise: ""
  server_name: eventbus-dev-1
  store_dir: /data/moox/prod/data/eventbus/jetstream
  startup_timeout: 10s
  max_payload_bytes: 8388608
  cluster:
    enabled: false
    name: MOOX_EVENTBUS
    host: 127.0.0.1
    port: 6222
    routes: []
  auth:
    enabled: true
    username: ""
    password: ""
    users_file: /data/moox/prod/secrets/eventbus/users.yaml
  tls:
    enabled: true
    cert_file: /data/moox/prod/secrets/eventbus/server.pem
    key_file: /data/moox/prod/secrets/eventbus/server-key.pem
    ca_file: /data/moox/prod/secrets/eventbus/ca.pem
internal_client:
  credential_file: /data/moox/prod/secrets/eventbus/internal-admin.yaml
  tls_ca_file: /data/moox/prod/secrets/eventbus/ca.pem
health:
  addr: 127.0.0.1:11419
streams:
  - name: MOOX_STORAGE
    subjects:
      - "moox.event.storage.dataset.rows.upserted.v2.>"
      - "moox.event.storage.collector.period.completed.v1.>"
      - "moox.event.storage.dataset.factor_period.computed.v1.>"
      - "moox.event.storage.view.data.ready.v1.>"
      - "moox.event.storage.dataset.sync_point.v1.>"
    retention: limits
    discard: old
    storage: file
    replicas: 1
    max_age: 72h
    duplicates: 2m
    # Storage events include high-cardinality view/metric deliveries. Keep an
    # 8 GiB cap so a rebuild backlog cannot stall publishers at the old 2 GiB
    # limit; the 72h age bound and disk-pressure monitoring still provide the
    # retention guardrail.
    max_bytes: 8589934592
  - name: MOOX_OBSERVABILITY
    subjects:
      - "moox.event.observability.>"
    retention: limits
    discard: old
    storage: file
    replicas: 1
    max_age: 24h
    duplicates: 2m
    max_bytes: 134217728
  - name: MOOX_MARKET_FETCH
    subjects: ["moox.event.market.fetch.batch.completed.v1.>"]
    # Collector and Monitor both observe the completion; work_queue would let
    # the first durable consumer steal the message from the other one.
    retention: limits
    discard: old
    storage: file
    replicas: 1
    max_age: 24h
    duplicates: 10m
    max_bytes: 134217728
  - name: MOOX_TRADE
    # Automatic execution consumes only the session-scoped weight contract.
    # Historical quantity messages are intentionally not routed into this
    # stream after the protocol cutover.
    subjects: ["moox.event.trade.target.weight_requested.v1.>"]
    retention: work_queue
    discard: old
    storage: file
    replicas: 1
    max_age: 168h
    duplicates: 2m
    max_bytes: 134217728
