database: /data/moox/prod/data/strategy/strategy.sqlite
# 调用 Trade 的逻辑账户归属方法经 gateway_client（strategy 身份）发送
trade:
  timeout: 3s
instance_id: strategy@control
eventbus:
  urls: ['tls://127.0.0.1:4222']
  credential_file: /data/moox/prod/secrets/eventbus/strategy-eventbus.yaml
  relay_interval: 1s
  relay_batch_size: 100
  reconnect_interval: 1s
  connect_timeout: 3s
  consumer_name: strategy_view_data_ready_v1
# 访问 Storage 与 FactorMgr 统一经本机主机网关
gateway_client:
  mode: local
  caller: strategy
  key_file: /data/moox/prod/secrets/caller-strategy.key
  ca_file: /data/moox/prod/certs/moox-ca.crt
  cache_dir: /data/moox/prod/data/strategy/gatewayclient
factor:
  app_id: strategy
  timeout: 5s
storage:
  app_id: strategy
  # AppKey/ViewAppKey are derived from the deployment's Storage auth secrets.
  app_key: ""
  view_app_key: ""
  timeout: 5s
