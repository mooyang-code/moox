global:
  namespace: Development
  env_name: dev
server:
  filter:
    - recovery
    - prometheus
  timeout: 30000
  service:
    - name: trpc.moox.strategy.StrategyMgr
      ip: 127.0.0.1
      port: 11430
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.strategy.Health
      ip: 127.0.0.1
      port: 11431
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    - name: trpc.moox.strategy.metrics.timer
      port: 11432
      network: "*/30 * * * * *?startAtOnce=1"
      protocol: timer
      timeout: 10000
plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12930
      path: /metrics
      enablepush: false
