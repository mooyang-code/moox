global:
  namespace: Development
  env_name: test
server:
  filter:
    - recovery
    - validation
    - opentelemetry
    - prometheus
  # History backfills may temporarily contend with PrimaryStore reads. Keep
  # the request alive long enough for a bounded Pebble batch to complete.
  timeout: 60000
  admin:
    ip: 127.0.0.1
    port: 20001
    read_timeout: 3000
    write_timeout: 60000
  service:
    - name: trpc.moox.storage.Health
      ip: 0.0.0.0
      port: 20211
      network: tcp
      protocol: http_no_protocol
      timeout: 30000
    - name: trpc.moox.storage.DataView.trpc
      ip: 127.0.0.1
      port: 20103
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.ViewIndex
      ip: 127.0.0.1
      port: 20104
      network: tcp
      protocol: trpc
      timeout: 30000
    - name: trpc.moox.storage.view.metrics.timer
      port: 20307
      network: "*/30 * * * * *"
      protocol: timer
      # Gathering bounded View metrics can read tens of thousands of series;
      # keep the 30-second cadence while allowing one report to complete.
      timeout: 60000
    - name: trpc.moox.storage.view.cleanup.timer
      port: 20308
      network: "*/30 * * * * *"
      protocol: timer
      timeout: 20000
# 访问 Metadata 与 PrimaryStore 经顶层的 gateway_client。
client:
  filter:
    - validation
    - opentelemetry
plugins:
  metrics:
    prometheus:
      ip: 127.0.0.1
      port: 12961
      path: /metrics
      enablepush: false
  auth:
    validation:
      enable_error_log: false
      server_validate_err_code: 100101
      client_validate_err_code: 100102
  log:
    default:
      - writer: file
        level: info
        writer_config:
          log_path: /data/moox/storage/logs/storage-view
          filename: trpc.log
          roll_type: size
          max_age: 7
          max_size: 10
          max_backups: 5
          compress: false
# storage-view 经本机主机网关访问 Metadata、PrimaryStore；相对路径按安装包根目录解析。
gateway_client:
  mode: local
  caller: storage-view
  key_file: /data/moox/storage/secrets/caller-storage-view.key
  ca_file: /data/moox/storage/certs/moox-ca.crt
  cache_dir: /data/moox/storage/data/storage-view/gatewayclient
storage:
  root: /data/moox/storage/data/storage
  # Dataset retention and View limits rendered by moox-cli from moox.toml.
  policy_file: /data/moox/storage/current/storage-view/config/storage-policy.json
  roles:
    - view
  metadata:
    path: /data/moox/storage/data/storage/metadata/storage_metadata.db
  devices:
    pebble_path: /data/moox/storage/data/storage/pebble
    view_index_root: /data/moox/storage/data/storage/view-indexes
  primary:
    service_name: trpc.moox.storage.DataNode
  eventbus:
    credential_file: /data/moox/storage/secrets/eventbus/storage-eventbus.yaml
    # Partition-specific ACK budgets live under view.consumer_partitions.
    # This field is retained for the primary/legacy config loader only.
    max_ack_pending: 256
  view:
    metadata_service_name: trpc.moox.storage.Metadata
    primary_store_service_name: trpc.moox.storage.PrimaryStore
    index_service_name: trpc.moox.storage.ViewIndex
    batch_size: 500
    batch_wait_ms: 200
    fetch_batch: 256
    max_workers: 8
    ordering: dataset
    consumer_partitions:
      - id: system_metrics
        durable: storage_view_metrics
        routes:
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_service_metrics]
        # System metrics are emitted every 30 seconds and can accumulate a
        # sizeable durable backlog after a Storage View restart. Keep the
        # dataset/subject ordering guarantee while allowing independent
        # service subjects to drain in parallel.
        fetch_batch: 16
        max_workers: 4
        max_ack_pending: 64
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: factor
        durable: storage_view_factor
        # Factor result Datasets are bound dynamically, one durable per result;
        # this partition has no static routes and only supplies the template.
        # Keep delivery serialized across process restarts so an unacked row
        # cannot be overtaken by its FactorPeriodComputed marker.
        fetch_batch: 1
        max_workers: 1
        max_ack_pending: 1
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
      - id: misc
        durable: storage_view_misc
        routes:
          - space_id: crypto
            dataset_ids: ["*"]
          - space_id: mooxsys
            dataset_ids: [dataset_mooxsys_host_disk, dataset_mooxsys_host_filesystem, dataset_mooxsys_host_network, dataset_mooxsys_host_resource]
          - space_id: stockcn
            dataset_ids: ["*"]
          - space_id: stockhk
            dataset_ids: ["*"]
          - space_id: stockus
            dataset_ids: ["*"]
        fetch_batch: 4
        max_workers: 2
        max_ack_pending: 16
        ack_wait_ms: 120000
        ordering: dataset
        deliver_policy: new
        max_retry_attempts: -1
    # Serialize Primary requests during large View rebuilds.
    backfill_page_size: 2000
    backfill_request_interval: 100ms
    rebuild_max_pending: 32
    rebuild_idle_checks: 3
  health:
    addr: ":20211"
