gateway_client:
  caller: collector
  key_file: ../../secrets/host.key
delist:
  auto_detect: false
egress_proxy:
  domains:
    - '*.binance.com'
scf_entry:
  caller: scf-collector
  entry_address: 2.2.2.2:11004
  entry_host: storage
  key_file: ../../secrets/scf-collector.key
scf_regions:
  ap-hongkong:
    subnet_id: subnet-hk
    vpc_id: vpc-hk
  ap-shanghai:
    network: public
scf_markets:
  crypto:
    spot:
      - ap-hongkong
    swap:
      - ap-hongkong
  stockcn:
    equity:
      - ap-hongkong
      - ap-shanghai
scf_plan:
  cloud_account_id: tencent-scf
  memory_mb: 128
  symbols_per_function: 50
  entry_routes:
    ap-hongkong:
      entry_address: 172.19.32.13:11004
      entry_host: overseas
    ap-shanghai:
      entry_address: 2.2.2.2:11004
      entry_host: storage
  spaces:
    crypto:
      namespace: moox-crypto-plan
      package_name: moox-collector-crypto-plan
    stockcn:
      namespace: moox-stockcn-plan
      package_name: moox-collector-stockcn-plan
collector_retention:
  maintenance_interval: 1m
  maintenance_offset: 35s
  maintenance_timeout: 20s
  max_rows_per_pass: 50000
