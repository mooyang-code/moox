syntax = "proto3";

package trpc.moox.hostagent;

import "host_metric.proto";
import "moox_common.proto";

option go_package = "github.com/mooyang-code/moox/modules/hostagent/proto/hostagentgen;hostagentpb";

message GetStatusReq {}
message GetStatusRsp {
  string host_id = 1;
  string version = 2;
  string hostname = 3;
  string boot_id = 4;
  // 最近一次采集完成的时刻（Unix 毫秒），没采集过为 0。
  int64 last_collect_at = 5;
  // 最近一次把快照成功报给 Monitor（随 SyncHostAgent 调用）的时刻（Unix 毫秒），没报过为 0。
  int64 last_report_at = 6;
  string last_error = 7;
  uint64 collected = 8;
  uint64 reported = 9;
  uint64 dropped = 10;
  uint64 skipped = 11;
  HostSnapshot latest = 12;
  common.RetInfo ret_info = 13;
}
message RunOnceReq {}
// RunOnce 立即采集一次，并随 SyncHostAgent 报给 Monitor。
message RunOnceRsp {
  string report_id = 1;
  bool reported = 2;
  string report_error = 3;
  HostSnapshot snapshot = 4;
  common.RetInfo ret_info = 5;
}

service HostAgentMgr {
  rpc GetStatus(GetStatusReq) returns (GetStatusRsp);
  rpc RunOnce(RunOnceReq) returns (RunOnceRsp);
}
