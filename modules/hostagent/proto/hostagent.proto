syntax = "proto3";

package trpc.moox.hostagent;

import "host_metric.proto";

option go_package = "github.com/mooyang-code/moox/modules/hostagent/proto/hostagentgen;hostagentpb";

message GetStatusReq {}
message GetStatusRsp {
  string agent_id = 1;
  string version = 2;
  string hostname = 3;
  string boot_id = 4;
  string last_collect_at = 5;
  string last_publish_at = 6;
  string last_error = 7;
  uint64 collected = 8;
  uint64 published = 9;
  uint64 dropped = 10;
  uint64 skipped = 11;
  bool eventbus_connected = 12;
  HostSnapshot latest = 13;
}
message GetSnapshotReq {}
message GetSnapshotRsp { HostSnapshot snapshot = 1; string collected_at = 2; }
message RunOnceReq {}
message RunOnceRsp { string message_id = 1; bool published = 2; string publish_error = 3; HostSnapshot snapshot = 4; }

service HostAgentMgr {
  rpc GetStatus(GetStatusReq) returns (GetStatusRsp);
  rpc GetSnapshot(GetSnapshotReq) returns (GetSnapshotRsp);
  rpc RunOnce(RunOnceReq) returns (RunOnceRsp);
}
