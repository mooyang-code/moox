# 路径相对本配置文件；诊断端口只听本机、不验签。
public:
  host: localhost
  bind: 0.0.0.0
  port: 9527
  http3: false
tls:
  storage_root: ../data/caddy/caddy
  ca_baseline: ../data/caddy/internal-ca.sha256
  ca_publish_dir: ../certs/caddy
upstreams:
  admin: 127.0.0.1:11000
  web: 127.0.0.1:9528
health:
  listen: 127.0.0.1:19528
lifecycle:
  drain_timeout: 30s
  engine_stop_timeout: 10s
  cleanup_margin: 5s
  startup_timeout: 3m
