<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title>MooX 部署架构</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .band { fill: #f8fafc; stroke: #cbd5e1; }
      .host { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .host-head { font-size: 16px; font-weight: 600; fill: #0f172a; }
      .host-sub { font-size: 12px; fill: #64748b; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; }
      .chip-text { font-size: 13px; fill: #1e293b; }
      .chip-note { font-size: 11px; fill: #64748b; }
      .infra { fill: #ffffff; stroke: #94a3b8; stroke-dasharray: 4 3; }
      .infra-text { font-size: 12px; fill: #475569; }
      .ext { fill: #fff7ed; stroke: #fdba74; }
      .local { fill: #eff6ff; stroke: #93c5fd; }
      .label { font-size: 12px; fill: #1d4ed8; }
      .section { font-size: 13px; font-weight: 600; fill: #475569; }
      .foot { font-size: 12px; fill: #475569; }
      .line { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- 第一层：你的电脑与外部服务 -->
  <rect class="local" x="30" y="20" width="560" height="96" rx="10"/>
  <text class="section" x="46" y="42">你的电脑</text>
  <rect class="chip" x="46" y="56" width="200" height="44" rx="6" fill="#ffffff"/>
  <text class="chip-text" x="146" y="75" text-anchor="middle">AI Agent + moox skill</text>
  <text class="chip-note" x="146" y="91" text-anchor="middle">部署、初始化、日常管理</text>
  <path class="line" d="M246,78 L292,78" marker-end="url(#arrow)"/>
  <rect class="chip" x="296" y="56" width="130" height="44" rx="6" fill="#ffffff"/>
  <text class="chip-text" x="361" y="75" text-anchor="middle">moox-cli</text>
  <text class="chip-note" x="361" y="91" text-anchor="middle">加密的 moox.toml</text>
  <rect class="chip" x="446" y="56" width="128" height="44" rx="6" fill="#ffffff"/>
  <text class="chip-text" x="510" y="75" text-anchor="middle">浏览器</text>
  <text class="chip-note" x="510" y="91" text-anchor="middle">Web 管理台</text>

  <rect class="ext" x="620" y="20" width="550" height="96" rx="10"/>
  <text class="section" x="636" y="42">外部服务</text>
  <rect class="chip" x="636" y="56" width="250" height="44" rx="6" fill="#ffffff"/>
  <text class="chip-text" x="761" y="75" text-anchor="middle">交易所</text>
  <text class="chip-note" x="761" y="91" text-anchor="middle">行情与下单：Binance、OKX</text>
  <rect class="chip" x="904" y="56" width="250" height="44" rx="6" fill="#ffffff"/>
  <text class="chip-text" x="1029" y="75" text-anchor="middle">云厂商 API（目前为腾讯云）</text>
  <text class="chip-note" x="1029" y="91" text-anchor="middle">SCF 采集云函数 · 防火墙 · 日志服务</text>

  <!-- 第一层到主机的连线（主机区整体下移 30） -->
  <path class="line" d="M1029,100 L1029,185 L500,185 L500,200" marker-end="url(#arrow)"/>
  <text class="label" x="868" y="179">SCF 拉取行情 · 写入存储</text>
  <path d="M761,104 L761,196" stroke="#ffffff" stroke-width="7"/>
  <path class="line" d="M761,100 L761,200" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="label" x="768" y="150">行情推送 · 下单</text>
  <path class="line" d="M361,100 L361,140 L200,140 L200,200" marker-end="url(#arrow)"/>
  <text class="label" x="208" y="134">SSH 隧道 · 签名调用</text>
  <path class="line" d="M510,100 L510,168 L260,168 L260,200" marker-end="url(#arrow)"/>
  <text class="label" x="268" y="186">HTTPS :9527</text>

  <g transform="translate(0,30)">
  <!-- 第二层：四台主机 -->
  <!-- 管理台机 -->
  <rect class="host" x="30" y="170" width="270" height="372" rx="10"/>
  <text class="host-head" x="46" y="196">管理台机</text>
  <text class="host-sub" x="46" y="214">控制面与业务服务</text>
  <rect class="chip" x="46" y="226" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="246">控制台代理 · Web 管理台</text>
  <rect class="chip" x="46" y="264" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="284">管理后台（认证、密钥、主机登记）</text>
  <rect class="chip" x="46" y="302" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="322">监控（健康、新鲜度、告警推送）</text>
  <rect class="chip" x="46" y="340" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="360">采集调度（计划、补采、重采样）</text>
  <rect class="chip" x="46" y="378" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="398">云函数管理</text>
  <rect class="chip" x="46" y="416" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="436">因子管理（定义、任务、补算）</text>
  <rect class="chip" x="46" y="454" width="238" height="30" rx="5"/><text class="chip-text" x="58" y="474">策略（DSL 求值、目标权重、回放）</text>
  <rect class="infra" x="46" y="498" width="238" height="30" rx="5"/><text class="infra-text" x="165" y="518" text-anchor="middle">主机网关 · 主机代理</text>

  <!-- 存储机 -->
  <rect class="host" x="320" y="170" width="270" height="372" rx="10"/>
  <text class="host-head" x="336" y="196">存储机</text>
  <text class="host-sub" x="336" y="214">数据与事件</text>
  <rect class="chip" x="336" y="226" width="238" height="30" rx="5"/><text class="chip-text" x="348" y="246">存储主服务（元数据目录）</text>
  <rect class="chip" x="336" y="264" width="238" height="30" rx="5"/><text class="chip-text" x="348" y="284">存储数据节点（字段级事实）</text>
  <rect class="chip" x="336" y="302" width="238" height="30" rx="5"/><text class="chip-text" x="348" y="322">存储视图（可重建的宽表 View）</text>
  <rect class="chip" x="336" y="340" width="238" height="30" rx="5"/><text class="chip-text" x="348" y="360">事件总线</text>
  <rect class="chip" x="336" y="378" width="238" height="30" rx="5"/><text class="chip-text" x="348" y="398">外部接入 Access</text>
  <rect class="infra" x="336" y="498" width="238" height="30" rx="5"/><text class="infra-text" x="455" y="518" text-anchor="middle">主机网关 · 主机代理</text>

  <!-- 海外机 -->
  <rect class="host" x="610" y="170" width="270" height="372" rx="10"/>
  <text class="host-head" x="626" y="196">海外机 <tspan class="host-sub">（可选）</tspan></text>
  <text class="host-sub" x="626" y="214">行情接入与交易执行</text>
  <rect class="chip" x="626" y="226" width="238" height="30" rx="5"/><text class="chip-text" x="638" y="246">行情推送采集（WebSocket）</text>
  <rect class="chip" x="626" y="264" width="238" height="30" rx="5"/><text class="chip-text" x="638" y="284">出口代理（受限 HTTPS 与 DNS）</text>
  <rect class="chip" x="626" y="302" width="238" height="30" rx="5"/><text class="chip-text" x="638" y="322">交易执行（目标收敛、模拟盘）</text>
  <rect class="chip" x="626" y="340" width="238" height="30" rx="5"/><text class="chip-text" x="638" y="360">外部接入 Access</text>
  <rect class="infra" x="626" y="498" width="238" height="30" rx="5"/><text class="infra-text" x="745" y="518" text-anchor="middle">主机网关 · 主机代理</text>

  <!-- 因子机 -->
  <rect class="host" x="900" y="170" width="270" height="372" rx="10"/>
  <text class="host-head" x="916" y="196">因子机 <tspan class="host-sub">（可选，局域网 Linux）</tspan></text>
  <text class="host-sub" x="916" y="214">只出站，经管理台机网关中转</text>
  <rect class="chip" x="916" y="226" width="238" height="44" rx="5"/><text class="chip-text" x="928" y="245">因子引擎</text><text class="chip-note" x="928" y="262">本地 K 线副本，每周期增量计算</text>
  <rect class="chip" x="916" y="278" width="238" height="44" rx="5"/><text class="chip-text" x="928" y="297">归档 Worker</text><text class="chip-note" x="928" y="314">按日 / 月导出 CSV</text>
  <rect class="infra" x="916" y="498" width="238" height="30" rx="5"/><text class="infra-text" x="1035" y="518" text-anchor="middle">主机网关 · 主机代理</text>

  <text class="foot" x="30" y="586">模块间仅通过两种方式交互：经主机网关的签名 RPC（按服务目录做方法级权限控制）与事件总线。</text>
  <text class="foot" x="30" y="608">监控覆盖全部组件、主机与数据链路；各模块可独立暂停、恢复与升级；主机与部署的变更统一由 moox-cli 执行，管理台只读展示。</text>
  <text class="foot" x="30" y="630">主机角色可合并部署：管理台可与存储机或海外机共用一台服务器。</text>
  </g>
</svg>
