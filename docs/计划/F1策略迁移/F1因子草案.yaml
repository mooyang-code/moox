# F1 策略迁移的因子草案（因子库格式，同 modules/factor/factors/xbx.yaml）：2 个选币因子、3 个过滤因子。
# 版本：这是 v1 严格窗口写法，已用 factorexpr check 编译通过。v2 把 f1_po、f1_mtmstd、f1_min_max 改用 partial 算子（设计第 2 节），在执行计划 T1.1 落地，不以本文件为最终版本。
# 来源：~/Downloads/strategy_share 的 factors/、filters/，语义按 alphalib-dev 核对，见《F1策略迁移设计.md》第 2、3 节。
# 全部用新 ID（f1_ 前缀），不改现有的 min_max，避免改动线上任务的 definition_hash 与回看。
# 默认值取参数下限，不与参数表里的任何取值重合：参数全为默认值的成员会省略参数段，取下限可避免出现不带参数的成员键。
- factor_id: f1_po
  name: Po 双均线距离比
  category_id: trend
  category_name: 趋势类
  # F1 写的是 ewm(com=n) 与 ewm(com=3n)，换成 span：short_span = 2n+1，long_span = 6n+1（表达式引擎的窗口参数不能写运算，所以拆成两个参数）。
  # 长线固定用 5 万根预热：n ≥ 824 时按 1e-9 容差推导的根数超过回看上限，截断后丢弃的起点权重最大 2.3e-4（n = 1992）。
  spec: |
    params:
      short_span: {type: int, min: 3, max: 4000, default: 3}
      long_span: {type: int, min: 7, max: 12000, default: 7}
    let:
      short: ema(close, short_span)
      long: ema(close, long_span, 50000)
    output: (short - long) / (short + long)

- factor_id: f1_mtmstd
  name: 动量均值乘动量波动
  category_id: momentum
  category_name: 动量类
  # F1 的 rolling 用 min_periods=1 / 2，这里是严格窗口：只有上市后前 2n 根不同（F1 出数，这里为空）。
  spec: |
    params: {n: {type: int, min: 2, max: 2000, default: 2}}
    let:
      r: pct_change(close, n)
    output: ts_mean(r, n) * ts_std(r, n)

- factor_id: f1_wick_max
  name: 上影线占比滚动最大（MaxHightDie）
  category_id: volatility
  category_name: 波动类
  # F1 文件名 MaxHightDie，docstring 写“回撤”，实际是近 n 根里 (high - close) / close 的最大值。
  spec: |
    params: {n: {type: int, min: 1, max: 2016, default: 1}}
    output: ts_max((high - close) / close, n)

- factor_id: f1_upper_shadow
  name: 距 n 根最高价的回落（UpperShadow）
  category_id: volatility
  category_name: 波动类
  spec: |
    params: {n: {type: int, min: 1, max: 2016, default: 1}}
    output: abs(ts_max(high, n) - close) / ts_mean(close, n)

- factor_id: f1_min_max
  name: 区间位置（MinMax，窗口放宽到 2016）
  category_id: momentum
  category_name: 动量类
  # 与现有 min_max 公式相同，只是窗口上限从 120 放宽到 2016；F1 用 min_periods=1，这里是严格窗口。
  spec: |
    params: {window: {type: int, min: 2, max: 2016, default: 2}}
    let:
      tp: (high + low + close) / 3
      lo: ts_min(tp, window)
    output: (tp - lo) / (ts_max(tp, window) - lo) - 0.5
