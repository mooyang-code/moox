<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易账户交互原型</title>
<style>
/* 版式：沿用管理台（Arco）的灰底白卡与左侧菜单；账户是唯一入口，详情是整页，持仓、订单都收进详情页签 */
:root {
  --bg: #f2f3f5;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --line: #e5e6eb;
  --text-1: #1d2129;
  --text-2: #4e5969;
  --text-3: #86909c;
  --accent: #165dff;
  --accent-soft: #e8f3ff;
  --ok: #00b42a;
  --ok-soft: #e8ffea;
  --warn: #ff7d00;
  --warn-soft: #fff7e8;
  --danger: #f53f3f;
  --danger-soft: #ffece8;
  --paper: #4e5969;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --surface: #232324; --surface-2: #2a2a2c; --line: #3a3a3d;
    --text-1: #f2f3f5; --text-2: #c9cdd4; --text-3: #8e939b;
    --accent: #3c7eff; --accent-soft: #1b2944;
    --ok: #27c346; --ok-soft: #17321f; --warn: #ff9626; --warn-soft: #3a2b16;
    --danger: #f76965; --danger-soft: #3b2220; --paper: #a9aeb8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171a; --surface: #232324; --surface-2: #2a2a2c; --line: #3a3a3d;
  --text-1: #f2f3f5; --text-2: #c9cdd4; --text-3: #8e939b;
  --accent: #3c7eff; --accent-soft: #1b2944;
  --ok: #27c346; --ok-soft: #17321f; --warn: #ff9626; --warn-soft: #3a2b16;
  --danger: #f76965; --danger-soft: #3b2220; --paper: #a9aeb8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text-1); font: 14px/1.5715 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num, td.r, th.r { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--text-3); }
.sub { color: var(--text-2); }
.pos { color: var(--ok); }
.neg { color: var(--danger); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* 外壳 */
.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { height: 56px; display: flex; align-items: center; padding: 0 20px; font-weight: 700; font-size: 16px; letter-spacing: .5px; border-bottom: 1px solid var(--line); }
.menu { list-style: none; margin: 0; padding: 8px 0; }
.menu .grp { padding: 10px 20px 4px; color: var(--text-3); font-size: 12px; }
.menu .it { padding: 8px 20px 8px 32px; color: var(--text-2); cursor: default; }
.menu .it.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; cursor: pointer; }
.menu .it.gone { color: var(--text-3); text-decoration: line-through; }
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.crumb { display: flex; gap: 8px; align-items: center; min-width: 0; color: var(--text-3); white-space: nowrap; overflow: hidden; }
.crumb b { color: var(--text-1); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.topbar .sp { flex: 1; }
.space-sel { border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; color: var(--text-2); white-space: nowrap; }
.proto-note { flex: none; padding: 6px 16px; background: var(--warn-soft); color: var(--text-2); font-size: 12px; border-bottom: 1px solid var(--line); }
.content { flex: 1; overflow-y: auto; padding: 16px 16px 72px; }
.page-tabs { display: flex; gap: 24px; flex-wrap: wrap; min-height: 32px; }
.page-tabs button { position: relative; padding: 0 0 8px; border: 0; background: transparent; color: var(--text-3); font-size: 20px; font-weight: 600; line-height: 28px; cursor: pointer; white-space: nowrap; }
.page-tabs button:hover { color: var(--accent); }
.page-tabs button.active { color: var(--text-1); }
.page-tabs button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.card + .card, .stack > * + * { margin-top: 12px; }
.pad { padding: 16px; }

/* 控件 */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 15px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--text-1); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.warn { color: var(--warn); border-color: var(--warn); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.text { border-color: transparent; background: transparent; color: var(--accent); padding: 0 6px; }
.btn.text:hover { background: var(--surface-2); }
.btn.text.danger { color: var(--danger); }
.btn[disabled], .btn[disabled]:hover { opacity: .45; cursor: not-allowed; color: var(--text-3); border-color: var(--line); background: var(--surface); filter: none; }
.btn.text[disabled] { background: transparent; border-color: transparent; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 4px 12px; cursor: pointer; color: var(--text-2); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button .c { color: var(--text-3); margin-left: 4px; font-weight: 400; }
.inp, .sel { height: 32px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 0 10px; min-width: 0; }
.inp:focus, .sel:focus { border-color: var(--accent); outline: none; }
textarea.inp { height: auto; padding: 6px 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.toolbar .sp { flex: 1; }
.lbl { color: var(--text-3); font-size: 12px; }

/* 标记：环境、状态（方块/圆点 + 文字，不用胶囊） */
.env { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.env::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: currentColor; }
.env.paper { color: var(--paper); }
.env.testnet { color: var(--warn); }
.env.prod { color: var(--danger); font-weight: 600; }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--text-1); }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
.st.ok::before { background: var(--ok); }
.st.warn::before { background: var(--warn); }
.st.bad::before { background: var(--danger); }
.st.run::before { background: var(--accent); }
.needapi { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 5px; border: 1px dashed var(--warn); color: var(--warn); border-radius: 2px; white-space: nowrap; font-weight: 400; vertical-align: 1px; }
.est { font-size: 12px; color: var(--text-3); }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; color: var(--text-2); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl th.sort { cursor: pointer; }
.tbl th.sort:hover { color: var(--accent); }
.tbl tr.child td { background: var(--surface-2); font-size: 12.5px; }
.tbl tr.child td:first-child { padding-left: 40px; }
.tbl .nowrap { white-space: nowrap; }
.tbl .caret { display: inline-block; width: 16px; color: var(--text-3); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 12px; color: var(--text-3); font-size: 12px; flex-wrap: wrap; }

/* 详情页 */
.dhead { padding: 16px; display: grid; gap: 12px; }
.dhead-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.dhead h1 { font-size: 20px; line-height: 28px; }
.dhead .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-2); font-size: 13px; margin-top: 4px; }
.dhead .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.strip { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); }
.strip > div { padding: 12px 16px; border-right: 1px solid var(--line); min-width: 140px; flex: 1 1 140px; }
.strip > div:last-child { border-right: 0; }
.strip .k { color: var(--text-3); font-size: 12px; }
.strip .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 26px; white-space: nowrap; }
.strip .v small { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 4px; }
.strip .d { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); }
.banner.bad { background: var(--danger-soft); }
.banner.info { background: var(--accent-soft); }
.banner .t { font-weight: 600; white-space: nowrap; }
.banner .x { flex: 1; min-width: 200px; color: var(--text-2); }
.tabs { display: flex; gap: 4px; border-top: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button .c { color: var(--text-3); font-weight: 400; margin-left: 4px; }

.grid-ov { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 12px; }
.sec-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sec-h h3 { font-size: 15px; }
.sec-h .sp { flex: 1; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; padding: 12px 16px; font-size: 13px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chart-box { position: relative; padding: 8px 8px 4px 0; }
.chart-box svg { display: block; width: 100%; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 10px rgb(0 0 0 / 8%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; }
.wf { padding: 12px 16px 16px; display: grid; gap: 8px; }
.wf-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 104px; gap: 10px; align-items: center; font-size: 13px; }
.wf-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 2px; }
.wf-bar { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.wf-bar.total { background: var(--text-3); }
.wf-bar.neg { background: var(--danger); }
.wf-bar.pos { background: var(--ok); }
.wf-row .amt { text-align: right; font-variant-numeric: tabular-nums; }
.note { padding: 10px 16px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); }
.member-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.member-line:last-child { border-bottom: 0; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.empty { padding: 40px 16px; text-align: center; color: var(--text-3); }
.danger-zone { border: 1px solid var(--danger); border-radius: 4px; }
.danger-zone .dz-row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.danger-zone .dz-row:last-child { border-bottom: 0; }
.danger-zone .dz-row .x { flex: 1; min-width: 220px; }
.settings-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 24px; padding: 12px 16px 16px; }
.field { display: grid; gap: 4px; }
.field label { color: var(--text-2); font-size: 13px; }
.field .help { color: var(--text-3); font-size: 12px; }

/* 弹窗与抽屉 */
.mask { position: fixed; inset: 0; background: rgb(0 0 0 / 45%); z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 64px 16px 16px; overflow-y: auto; }
.dlg { width: min(560px, 100%); background: var(--surface); border-radius: 4px; box-shadow: 0 8px 24px rgb(0 0 0 / 18%); }
.dlg.wide { width: min(720px, 100%); }
.dlg-h { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.dlg-h h3 { font-size: 16px; flex: 1; }
.dlg-b { padding: 16px 20px; display: grid; gap: 14px; }
.dlg-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dlg.prod .dlg-h { border-top: 3px solid var(--danger); }
.dlg.testnet .dlg-h { border-top: 3px solid var(--warn); }
.callout { padding: 10px 12px; border-radius: 4px; font-size: 13px; background: var(--surface-2); color: var(--text-2); }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--danger-soft); color: var(--text-1); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.facts dt { color: var(--text-3); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.choice { display: grid; gap: 8px; }
.choice label { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.choice label.on { border-color: var(--accent); background: var(--accent-soft); }
.choice label input { grid-row: span 2; margin-top: 3px; }
.choice label .d { color: var(--text-3); font-size: 12px; }
.steps { display: flex; gap: 8px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
.steps span.on { color: var(--accent); font-weight: 600; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; box-shadow: -6px 0 18px rgb(0 0 0 / 12%); display: flex; flex-direction: column; }
.drawer .dlg-b { overflow-y: auto; flex: 1; align-content: start; }
.toast { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 14px; border-radius: 4px; box-shadow: 0 6px 16px rgb(0 0 0 / 12%); font-size: 13px; max-width: calc(100% - 32px); }

/* 说明页 */
.doc { max-width: 980px; }
.doc h2 { font-size: 18px; margin: 4px 0 12px; }
.doc h3 { font-size: 15px; margin: 18px 0 8px; }
.doc p, .doc li { color: var(--text-2); max-width: 72ch; }
.doc ol, .doc ul { padding-left: 20px; margin: 6px 0; }
.doc li + li { margin-top: 6px; }
.doc code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 2px; }
.doc .tbl td { vertical-align: top; }

@media (max-width: 900px) {
  .grid-ov { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .dhead .acts { margin-left: 0; }
  .wf-row { grid-template-columns: 76px minmax(0, 1fr) 92px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="app-tpl">
<div class="shell">
  <aside class="side" aria-label="主菜单">
    <div class="brand">MooX</div>
    <ul class="menu">
      <li class="it">首页</li>
      <li class="grp">数据采集</li>
      <li class="grp">因子计算</li>
      <li class="grp">策略管理</li>
      <li class="grp">交易管理</li>
      <li class="it on" @click="go('accounts-' + envFilter)">交易账户</li>
      <li class="it gone" title="改版后并入账户详情的「持仓与目标」">持仓详情</li>
      <li class="it gone" title="改版后并入账户详情的「订单」「成交」">交易明细</li>
      <li class="grp">资源与运维</li>
      <li class="grp">系统设置</li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <nav class="crumb" aria-label="当前位置">
        <span>交易管理</span><span>/</span>
        <template v-if="view === 'accounts'"><b>交易账户</b></template>
        <template v-else-if="view === 'notes'"><a @click="go('accounts-' + envFilter)">交易账户</a><span>/</span><b>设计说明</b></template>
        <template v-else><a @click="go('accounts-' + combo.env)">交易账户</a><span>/</span><a @click="go('accounts-' + combo.env)">{{ envLabel(combo.env) }}</a><span>/</span><b>{{ combo.name }}</b></template>
      </nav>
      <span class="sp"></span>
      <a v-if="view !== 'notes'" @click="go('notes')">设计说明</a>
      <button class="btn sm" type="button" @click="resetDemo">重置示例数据</button>
      <span class="space-sel">加密货币市场</span>
    </header>
    <div class="proto-note">
      交互原型：「默认策略模拟组合」用的是线上模拟盘 {{ fmtTime(snapshotAt) }} 的真实快照，其余账户是虚构的，用来演示测试网、生产和自主下单。所有按钮都不会调用接口。
      标着 <span class="needapi">需新接口</span> 的内容现在的后端还给不出来。
    </div>

    <main class="content">
      <!-- ============ 账户列表 ============ -->
      <div v-if="view === 'accounts'" class="stack">
        <div class="page-tabs" role="tablist" aria-label="环境">
          <button v-for="e in envTabs" :key="e.key" type="button" role="tab" :aria-selected="envFilter === e.key" :class="{ active: envFilter === e.key }" @click="go('accounts-' + e.key)">{{ e.label }}</button>
        </div>
        <section class="card">
          <div class="sec-h">
            <span class="muted">{{ envFilter === 'paper' ? '用真实行情在本地撮合，不连交易所。' : envFilter === 'testnet' ? '连交易所测试环境，用测试币验证下单流程。' : '连交易所生产环境，用真实资金交易。' }}策略按组合账户下目标，组合里的执行账户负责下单。</span>
            <span class="sp"></span>
            <a v-if="unjoinedIn(envFilter).length" @click="openUnjoined">未加入组合的执行账户 {{ unjoinedIn(envFilter).length }} 个</a>
            <button class="btn" type="button" @click="toast('示例：重新读取账户列表')">刷新</button>
            <button class="btn primary" type="button" @click="openCreate">新建账户</button>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead>
                <tr>
                  <th>组合账户</th><th>交易所</th><th>关联策略</th><th>自动执行</th>
                  <th class="r">权益</th><th class="r">近 24 小时</th><th class="r">持仓</th><th>就绪</th>
                </tr>
              </thead>
              <tbody>
                <template v-for="c in listedCombos" :key="c.key">
                  <tr class="click" @click="openCombo(c.key)">
                    <td class="nowrap">
                      <span class="caret" role="button" :aria-label="expanded[c.key] ? '收起执行账户' : '展开执行账户'" @click.stop="expanded[c.key] = !expanded[c.key]">{{ expanded[c.key] ? '▾' : '▸' }}</span>
                      <strong>{{ c.name }}</strong>

<p>这一页是给评审用的：先列出现有页面的问题，再说明新结构、交互规则、要补的后端接口，最后对照每个功能改到了哪里。示例页面里能点的地方都可以试。</p>

<h3>一、现在的问题</h3>
<div class="tbl-wrap"><table class="tbl">
<thead><tr><th>问题</th><th>现在的样子</th><th>代码位置</th></tr></thead>
<tbody>
<tr><td>两种账户做成平级页签，看不出谁包含谁</td><td>「执行账户」「组合账户」并列。交易动作、策略绑定、目标、清仓都挂在组合下，执行账户只是组合里的下单通道</td><td><code>account-workbench/index.vue:24</code></td></tr>
<tr><td>最重要的信息都在抽屉里</td><td>执行账户详情抽屉塞了快照、关联组合、单账户平仓、流水、杠杆、实盘配置、关闭模拟盘；组合抽屉里是资金曲线、成员、目标、人工操作。刷新就丢</td><td><code>account-overview.vue:187</code>、<code>logical-accounts/index.vue:133</code></td></tr>
<tr><td>持仓、交易明细是单独菜单</td><td>进去要在下拉框里重新选账户；菜单叫「持仓详情」「交易明细」，页内标题却是「持仓」「交易记录」</td><td><code>position-detail.vue:6</code>、<code>trade-record.vue:6</code>、<code>zhCN.ts:44</code></td></tr>
<tr><td>同一个词指不同的东西</td><td>执行账户表的「账户类型」是模拟/真实；组合表的「账户类型」是现货/合约，另有「执行模式」是模拟/实盘</td><td><code>account-overview.vue:62</code>、<code>logical-accounts/index.vue:71</code></td></tr>
<tr><td>状态列重复</td><td>标签后面又跟了一个文字一样的灰字</td><td><code>account-overview.vue:84</code></td></tr>
<tr><td>清仓有两个入口、两种叫法</td><td>组合里叫「逐账户清仓」，执行账户抽屉里是另一个组件</td><td><code>logical-accounts/index.vue:161</code>、<code>account-flatten.vue</code></td></tr>
<tr><td>看不出钱是怎么亏的</td><td>线上模拟盘权益从 10 万降到 5.36 万，其中价格亏损约 1.82 万，手续费约 2.82 万（由余额反推，模拟盘余额只受这两项影响）。页面上没有地方能看出来，流水只能一条条翻</td><td>无</td></tr>
<tr><td>持仓表不区分零仓</td><td>这个模拟盘 522 行里 305 行是零仓</td><td><code>position-detail.vue:155</code></td></tr>
<tr><td>目标与实际持仓藏在组合抽屉最下面</td><td>267 个标的的对照表，是判断策略有没有执行到位的主要依据</td><td><code>logical-accounts/index.vue:281</code></td></tr>
<tr><td>订单、成交没有时间范围</td><td>35 万条只能从最新往后翻；接口其实支持 start_time、end_time</td><td><code>trade-record.vue:13</code></td></tr>
<tr><td>杠杆用 JSON 显示</td><td>显示成 <code>{"*":"1"}</code></td><td><code>account-overview.vue:255</code></td></tr>
<tr><td>组合页顶部四张等宽统计卡</td><td>四个数字占一整行，和下面的表格重复</td><td><code>logical-accounts/index.vue:17</code></td></tr>
</tbody></table></div>

<h3>二、新结构</h3>
<ul>
<li>菜单「交易管理」只留「交易账户」。「持仓详情」「交易明细」去掉，内容并入账户详情。</li>
<li>列表页顶部用页面标题页签分成「模拟盘」「测试网」「生产环境」，和采集任务、主机工作台等页面的写法一致。每个页签下只列组合账户，列为：组合账户、交易所、关联策略、自动执行、权益、近 24 小时、持仓、就绪。点三角展开执行账户，市场显示在执行账户这一层。</li>
<li>没加入组合的执行账户不进列表。列表右上角有一个「未加入组合的执行账户 N 个」的链接（没有就不显示），点开是弹窗，在里面改设置、启用或加入组合，加入组合的表单也在同一个弹窗里切换，做完回到列表；组合的「添加执行账户」弹窗里也能直接选它们。新建账户时必须新建或加入一个组合，不再留“暂不加入”。</li>
<li>账户详情改成整页，路由形如 <code>/trading/accounts/:logical_account_id?tab=positions</code>，刷新、返回、分享链接都不丢。页签：概览、持仓与目标、订单、成交、资金流水、执行账户与设置。</li>
<li>页头固定显示名称、环境、运行方式、一行关键数字、状态横幅（暂停原因、未就绪原因、清仓进度）和常用操作（暂停或恢复、同步、下单、清仓）。</li>
<li>执行账户自己的设置（密钥、杠杆、模拟参数）收进「执行账户与设置」页签的行内展开。危险操作集中放在这个页签底部。</li>
</ul>

<h3>三、交互规则</h3>
<ul>
<li>环境分三档，确认方式不同。模拟盘直接确认；测试网弹窗顶部是橙色条并标出测试网；生产弹窗是红色条，写明会用真实资金，并且要输入组合名称才能点确认。可以在「币安现货 手工」上试下单。</li>
<li>会顺带暂停自动执行的操作，弹窗里都写清楚：人工下单、撤单、清仓。后端就是这么做的（<code>operator/service.go:294</code>、<code>cancel.go:118</code>、<code>flatten.go:196</code>）。</li>
<li>组合清仓和单个执行账户平仓用同一个弹窗：先列出要撤几个单、平几个仓、价值多少，再填原因。进度显示在页头横幅，离开再回来按操作编号恢复。</li>
<li>暂时不能用的按钮保持可见但置灰，鼠标悬停说明原因，例如运行中不能编辑或移出执行账户。</li>
<li>订单、成交、流水都按时间范围分页读取，前端不对分页数据求合计。</li>
<li>新建账户改成四步：类型、交易所与市场、参数、组合。默认同时新建组合，也可以加入已有组合或暂不加入。生产账户要勾选确认密钥没有提现权限。</li>
<li>持仓行的「下单」会带上标的、方向和与目标的差额，省去手工抄数。</li>
</ul>

<h3>四、需要后端补的</h3>
<ol>
<li><strong>收益汇总</strong>：按时间段汇总已实现盈亏、手续费、资金费。模拟盘从本地成交算，实盘从成交和流水算。概览的「收益拆解」用。</li>
<li><strong>人工操作列表</strong>：按组合分页列出人工操作和结果。store 里已有 <code>ListRunningOperatorActions</code>，补一个按时间分页的 RPC 即可。概览的「人工操作记录」和清仓进度恢复都用它。</li>
<li><strong>ListOrders 加来源参数</strong>（owner_type），订单页按策略或人工筛选用。</li>
</ol>
<p>列表页「近 24 小时」用现有的 QueryEquityCurve 逐个组合计算，组合不多，先不加接口。</p>

<h3>六、评审记录</h3>
<ol>
<li>11-04 第 1 轮：菜单名改为四个字的「交易账户」；环境改成列表页的页面标题页签（详情页只属于一个环境，环境写在面包屑和页头里，不再做页签）；列表只展示组合账户，未加入组合的执行账户收进右上角链接打开的弹窗（第一版是抽屉，用户认为弹窗更合适：条目少、操作短，加入组合也是弹窗，不用抽屉上再叠弹窗）。</li>
<li>11-04 第 2 轮：列表「交易所 · 市场」改为「交易所」，市场放到执行账户这一层；「策略目标」改为「关联策略」，显示绑定的策略名，原来的「运行方式」拆成「关联策略」和「自动执行」两列；目标收敛情况只在详情页概览里看。</li>
</ol>

<h3>七、待讨论</h3>
<ul>
<li><strong>一个组合同时做现货和合约</strong>：列表的「交易所」列已经不再写市场。但后端现在要求组合内所有执行账户的市场、模拟或实盘、结算资产都一致（<code>store/logical_account.go:393</code>），策略实例也只对应一个市场，所以同一组合里混放现货和合约账户目前加不进去。要支持的话，需要放开这条检查，并让策略目标按标的区分现货和合约、执行时按市场把订单分给对应的执行账户。这是后端改动，单独设计。</li>
</ul>

<h3>八、这一版不做</h3>
<ul>
<li>跨账户的全局订单、成交页。单用户、账户不多，进账户看就够。</li>
<li>回撤、夏普之类的绩效指标。</li>
<li>批量撤单。清仓本来就会先撤单。</li>
</ul>
<p>实施时注意：详情页路由要在 <code>static-menu.ts</code> 里写 <code>reuseOnQuery</code>（见 <code>route-view-key.ts</code>），否则切页签会重建整个页面。</p>

      <div class="dlg-f"><button class="btn" type="button" @click="closeModal">取消</button><button class="btn primary" type="button" @click="modal.member.priority = form.priority; modal.member.enabled = form.enabled; closeModal()">保存</button></div>
    </template>

    <!-- 移出执行账户 -->
    <template v-else-if="modal.type === 'removeMember'">
      <div class="dlg-h"><h3>把「{{ modal.member.name }}」移出组合</h3></div>
      <div class="dlg-b">
        <div class="callout">移出后它的持仓留在交易所账户里不动，也不再算进这个组合。需要的话先平仓再移出。</div>
        <dl class="facts"><dt>当前持仓</dt><dd>{{ memberOpenCount(modal.member) }} 个</dd></dl>
      </div>
      <div class="dlg-f"><button class="btn" type="button" @click="closeModal">取消</button><button class="btn danger solid" type="button" @click="closeModal(); toast('示例：已移出')">移出</button></div>
    </template>

    <!-- 新建账户 -->
    <template v-else-if="modal.type === 'create'">
      <div class="dlg-h"><h3>新建账户</h3><span v-if="form.kind !== 'paper'" :class="['env', form.kind]">{{ envLabel(form.kind) }}</span></div>
      <div class="dlg-b">
        <div class="steps"><span v-for="(s, i) in createSteps" :key="s" :class="{ on: form.step === i }">{{ i + 1 }}. {{ s }}</span></div>
        <template v-if="form.step === 0">
          <div class="choice" role="radiogroup" aria-label="账户类型">
            <label v-for="k in kinds" :key="k.key" :class="{ on: form.kind === k.key }"><input type="radio" name="kind" :value="k.key" v-model="form.kind"><strong>{{ k.label }}</strong><span class="d">{{ k.desc }}</span></label>
          </div>
        </template>
        <template v-else-if="form.step === 1">
          <div class="field"><label>交易所</label><div class="seg"><button type="button" :class="{ on: form.exchange === '币安' }" @click="form.exchange = '币安'">币安</button><button type="button" :class="{ on: form.exchange === 'OKX' }" @click="form.exchange = 'OKX'">OKX</button></div></div>
          <div class="field"><label>市场</label><div class="seg"><button type="button" :class="{ on: form.market === 'swap' }" @click="form.market = 'swap'">U 本位永续</button><button type="button" :class="{ on: form.market === 'spot' }" @click="form.market = 'spot'">现货</button></div>
            <span class="help">永续固定全仓、USDT 结算</span></div>
          <div class="field"><label for="n-name">账户名称</label><input class="inp" id="n-name" v-model="form.name"></div>
        </template>
        <template v-else-if="form.step === 2">
          <template v-if="form.kind === 'paper'">
            <div class="toolbar">
              <div class="field" style="flex:1;min-width:140px"><label for="n-init">初始资金（USDT）</label><input class="inp" id="n-init" v-model="form.initial"></div>
              <div class="field" style="flex:1;min-width:100px"><label for="n-slip">滑点（基点）</label><input class="inp" id="n-slip" v-model="form.slip"></div>
            </div>
            <div class="toolbar">
              <div class="field" style="flex:1;min-width:120px"><label for="n-maker">挂单费率</label><input class="inp" id="n-maker" v-model="form.maker"></div>
              <div class="field" style="flex:1;min-width:120px"><label for="n-taker">吃单费率</label><input class="inp" id="n-taker" v-model="form.taker"></div>
            </div>
            <span class="help muted" style="font-size:12px">这些参数创建后不能改。默认值按{{ form.exchange }}普通用户费率。</span>
          </template>
          <template v-else>
            <div class="field"><label for="n-secret">交易所密钥</label>
              <select class="sel" id="n-secret" v-model="form.secret"><option v-for="s in secrets" :key="s" :value="s">{{ s }}</option></select>
              <span class="help">先在「系统设置 / 秘钥管理」里录入，这里只选名称。<a @click="toast('跳到秘钥管理')">去录入</a></span></div>
            <div v-if="form.kind === 'prod'" class="callout bad">生产账户创建后就有真实交易能力。请确认选的是生产密钥，并且这个密钥没有提现权限。</div>
            <label v-if="form.kind === 'prod'" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="n-ack" v-model="form.ack"> 我确认这是生产环境密钥，且没有提现权限</label>
          </template>
        </template>
        <template v-else>
          <div class="choice" role="radiogroup" aria-label="组合">
            <label :class="{ on: form.join === 'new' }"><input type="radio" name="join" value="new" v-model="form.join"><strong>新建一个组合账户</strong><span class="d">最常见：一份资金对应一个组合</span></label>
            <label :class="{ on: form.join === 'exist' }"><input type="radio" name="join" value="exist" v-model="form.join"><strong>加入已有组合</strong><span class="d">把多个交易所账户合成一份资金管理</span></label>
          </div>
          <template v-if="form.join === 'new'">
            <div class="field"><label for="n-cname">组合名称</label><input class="inp" id="n-cname" v-model="form.comboName" :placeholder="form.name"></div>
            <div class="field"><label>运行方式</label><div class="seg"><button type="button" :class="{ on: form.control === 'strategy' }" @click="form.control = 'strategy'">策略驱动</button><button type="button" :class="{ on: form.control === 'manual' }" @click="form.control = 'manual'">自主下单</button></div>
              <span class="help">{{ form.control === 'strategy' ? '之后在策略管理里把策略实例绑到这个组合' : '只按你的手工订单交易，没有策略目标' }}</span></div>
          </template>
          <div v-else-if="form.join === 'exist'" class="field"><label for="n-exist">选择组合</label>
            <select class="sel" id="n-exist" v-model="form.combo"><option v-for="c in combos.filter(c => c.market === form.market && (c.env === 'paper') === (form.kind === 'paper'))" :key="c.key" :value="c.key">{{ c.name }}</option></select></div>
        </template>
      </div>
      <div class="dlg-f">
        <button class="btn" type="button" @click="form.step ? form.step-- : closeModal()">{{ form.step ? '上一步' : '取消' }}</button>
        <button v-if="form.step < 3" class="btn primary" type="button" :disabled="form.step === 2 && form.kind === 'prod' && !form.ack" @click="form.step++">下一步</button>
        <button v-else :class="['btn', form.kind === 'prod' ? 'danger solid' : 'primary']" type="button" @click="closeModal(); toast('示例：账户不会真的创建')">{{ form.kind === 'prod' ? '创建生产账户' : '创建' }}</button>
      </div>
    </template>
  </div>
</div>

<!-- ============ 抽屉 ============ -->
<div v-if="drawer" class="mask" style="padding:0" @click.self="drawer = null"></div>
<aside v-if="drawer && drawer.type === 'order'" class="drawer" aria-label="订单详情">
  <div class="dlg-h"><h3>订单 {{ shortInst(drawer.order.instrument_id) }} {{ drawer.order.side === 1 ? '买入' : '卖出' }}</h3><button class="btn text" type="button" @click="drawer = null">关闭</button></div>
  <div class="dlg-b">
    <dl class="facts">
      <dt>状态</dt><dd><span :class="['st', orderStateCls(drawer.order.state)]">{{ orderStateLabel(drawer.order.state) }}</span></dd>
      <dt>类型</dt><dd>{{ drawer.order.order_type === 1 ? '市价' : '限价' }}{{ drawer.order.reduce_position_only ? '，只减仓' : '' }}</dd>
      <dt>数量</dt><dd>{{ fmtQty(drawer.order.quantity) }}，已成交 {{ fmtQty(drawer.order.filled_quantity) }}</dd>
      <dt>成交均价</dt><dd>{{ Number(drawer.order.average_price) ? fmtQty(drawer.order.average_price) : '—' }}</dd>
      <dt>参考价</dt><dd>{{ fmtQty(drawer.order.reference_price) }}</dd>
      <dt>来源</dt><dd>{{ drawer.order.owner_type === 'TARGET' ? '策略目标' : '人工' }}</dd>
      <dt>提交时间</dt><dd>{{ fmtClock(drawer.order.submitted_at, true) }}</dd>
      <dt>完成时间</dt><dd>{{ Number(drawer.order.finished_at) ? fmtClock(drawer.order.finished_at, true) : '—' }}</dd>
      <dt>订单号</dt><dd class="mono">{{ drawer.order.order_id }}</dd>
      <dt>交易所单号</dt><dd class="mono">{{ drawer.order.exchange_order_id }}</dd>
      <dt v-if="drawer.order.reject_reason">失败原因</dt><dd v-if="drawer.order.reject_reason">{{ drawer.order.reject_reason }}</dd>
    </dl>
    <div><strong>成交明细</strong></div>
    <table class="tbl">
      <thead><tr><th>时间</th><th class="r">价格</th><th class="r">数量</th><th class="r">手续费</th></tr></thead>
      <tbody>
        <tr v-for="f in combo.fills.filter(f => f.order_id === drawer.order.order_id)" :key="f.fill_id"><td class="muted">{{ fmtClock(f.traded_at, true) }}</td><td class="r">{{ fmtQty(f.price) }}</td><td class="r">{{ fmtQty(f.quantity) }}</td><td class="r">{{ fmtQty(f.fee) }}</td></tr>
        <tr v-if="!combo.fills.some(f => f.order_id === drawer.order.order_id)"><td colspan="4" class="muted">{{ Number(drawer.order.filled_quantity) ? '示例数据里没有这笔订单的成交' : '还没有成交' }}</td></tr>
      </tbody>
    </table>
    <div v-if="isOpenOrder(drawer.order.state)"><button class="btn danger" type="button" @click="openCancel(drawer.order)">撤单</button></div>
  </div>
</aside>

<div v-if="toastMsg" class="toast" role="status">{{ toastMsg }}</div>
</script>

function niceTicks(min, max, n) {
  const span = max - min || 1;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-6; v += step) out.push(+v.toFixed(10));
  return out;
}

      const yTicks = niceTicks(lo, hi, 4).filter(v => v >= lo && v <= hi).map(v => ({ v, y: Y(v), label: this.fmt(v, hi - lo < 50 ? 1 : 0) }));

    fmt(n, d = 2) {

    fmtSigned(n, d = 2) { if (isNaN(n)) return "—"; return (n > 0 ? "+" : n < 0 ? "−" : "") + this.fmt(Math.abs(n), d); },

    },

    targetStatus(c) {
      if (!c.target) return { label: "无", cls: "" };
      if (this.targetExpired(c)) return { label: "已过期", cls: "warn" };
      return ({ CONVERGING: { label: "收敛中", cls: "run" }, CONVERGED: { label: "已到位", cls: "ok" }, BLOCKED: { label: "被拦下", cls: "bad" } })[c.target.status] || { label: c.target.status, cls: "" };
    },

    orderStateLabel(s) { return STATE_LABELS[s] || s; },
    orderStateCls(s) { return s === "FILLED" ? "ok" : OPEN_STATES.includes(s) ? "run" : s === "REJECTED" ? "bad" : ""; },
    shortInst(id) { return id.replace("-USDT-SWAP", " 永续").replace("-USDT", "/USDT"); },

    sortBy(k) { this.posSort = this.posSort.key === k ? { key: k, dir: -this.posSort.dir } : { key: k, dir: k === "inst" ? 1 : -1 }; },
    sortMark(k) { return this.posSort.key === k ? (this.posSort.dir > 0 ? " ↑" : " ↓") : ""; },
    onChartMove(ev) {
      const svg = ev.currentTarget.ownerSVGElement;
      const rect = svg.getBoundingClientRect();
      const x = (ev.clientX - rect.left) * (this.chart.w / rect.width);
      const c = this.chart;
      const pts = c.pts;
      const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
      const m = t0 + (x - c.l) / (c.w - c.l - c.r) * (t1 - t0);
      let best = pts[0];
      let lo = 0, hi = pts.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (pts[mid][0] < m) lo = mid + 1; else hi = mid; }
      best = pts[lo];
      if (lo > 0 && Math.abs(pts[lo - 1][0] - m) < Math.abs(best[0] - m)) best = pts[lo - 1];
      const hx = c.X(best[0]);
      this.hover = { x: hx, y: c.Y(best[1]), p: best, tipX: hx > c.w - 190 ? hx - 180 : hx + 12 };
    },
    toast(msg) {
      this.toastMsg = msg;
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => { this.toastMsg = ""; }, 2600);
    },
    now() { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); },
    log(type, detail, reason, state) {
      const op = { id: "op-" + Math.random().toString(36).slice(2, 10), combo: this.combo.key, type, detail, reason, state: state || "完成", at: this.now() };
      this.opLog.unshift(op);
      return op;
    },
    openModal(type, extra) {
      this.modal = { type, ...(extra || {}) };
      this.form = { reason: "", confirm: "" };
    },
    closeModal() { this.modal = null; },
    pauseIfStrategy(reason) {
      if (this.combo.control === "strategy" && this.combo.automation === "ACTIVE") {
        this.combo.automation = "PAUSED";
        this.combo.pauseReason = reason;
      }
    },
    doPause() {
      this.pauseIfStrategy(this.form.reason);
      this.log("暂停自动执行", "组合暂停", this.form.reason);
      this.closeModal();
    },
    doResume() {
      this.combo.automation = "ACTIVE";
      this.combo.pauseReason = "";
      this.log("恢复自动执行", "组合恢复", "");
      this.closeModal();
    },
    openOrder(p) {
      const c = this.combo;
      this.modal = { type: "order" };
      let side = 1, qty = "";
      if (p) {
        if (p.target !== undefined && p.target !== null && c.control === "strategy") { side = p.diff > 0 ? 2 : 1; qty = String(+Math.abs(p.diff).toPrecision(6)); }
        else if (p.qty) { side = p.qty > 0 ? 2 : 1; qty = String(Math.abs(p.qty)); }
      }
      this.form = {
        member: c.members[0].id, inst: p ? p.inst : "", side, type: 1, tif: 1, qty, price: "", reduce: !!(p && p.qty && c.market === "swap"),
        reason: "", confirm: "", hint: c.market === "swap" ? "最小数量和步长在选好标的后显示（来自 ListTradableInstruments）" : "现货按币种数量下单"
      };
    },
    doOrder() {
      const f = this.form;
      this.pauseIfStrategy(f.reason);
      this.log("人工下单", this.shortInst(f.inst) + " " + (f.side === 1 ? "买入 " : "卖出 ") + f.qty + (f.type === 1 ? " 市价" : " 限价 " + f.price), f.reason);
      this.closeModal();
      this.toast("示例：订单不会真的提交" + (this.combo.control === "strategy" ? "；组合已暂停自动执行" : ""));
    },
    openCancel(o) { this.drawer = null; this.openModal("cancel", { order: o }); },
    doCancel() {
      const o = this.modal.order;
      o.state = "CANCELED";
      o.finished_at = String(SNAP);
      this.pauseIfStrategy(this.form.reason);
      this.log("撤单", this.shortInst(o.instrument_id) + " " + this.fmtQty(o.quantity), this.form.reason);
      this.closeModal();
    },
    openOrderById(id) {
      const o = this.combo.orders.find(x => x.order_id === id);
      if (o) this.drawer = { type: "order", order: o };
      else this.toast("示例数据里没有这笔成交所属的订单");
    },
    openFlatten(member) { this.openModal("flatten", { member }); },
    doFlatten() {
      const c = this.combo;
      const member = this.modal.member;
      const preview = this.flattenPreview;
      const reason = this.form.reason;
      const op = this.log(member ? "单账户平仓" : "清仓", member ? member.name : "整个组合", reason, "进行中");
      this.pauseIfStrategy("清仓：" + reason);
      this.flat = {
        comboKey: c.key, scope: member ? member.id : null, scopeLabel: member ? "执行账户「" + member.name + "」" : "整个组合",
        reason, actionId: op.id, phase: "cancel", canceled: 0, cancelTotal: preview.orders, closed: 0, closeTotal: preview.positions, dust: [], op
      };
      this.closeModal();
      clearInterval(this.flatTimer);
      this.flatTimer = setInterval(this.tickFlatten, 350);
    },
    tickFlatten() {
      const f = this.flat;
      if (!f) { clearInterval(this.flatTimer); return; }
      if (f.phase === "cancel") {
        f.canceled = Math.min(f.cancelTotal, f.canceled + Math.max(1, Math.ceil(f.cancelTotal / 4)));
        if (f.canceled >= f.cancelTotal) f.phase = "close";
        return;
      }
      if (f.phase === "close") {
        f.closed = Math.min(f.closeTotal, f.closed + Math.max(1, Math.ceil(f.closeTotal / 8)));
        if (f.closed < f.closeTotal) return;
        const c = this.combos.find(x => x.key === f.comboKey);
        c.orders.forEach(o => { if (this.isOpenOrder(o.state)) { o.state = "CANCELED"; o.finished_at = String(SNAP); } });
        const members = c.members.filter(m => !f.scope || m.id === f.scope);
        const dust = [];
        for (const m of members) {
          const open = m.positions.filter(r => r[2] !== 0).sort((a, b) => Math.abs(a[2] * a[4]) - Math.abs(b[2] * b[4]));
          open.forEach((r, i) => {
            if (i < 2) { r[2] = +(r[2] * 0.0004).toPrecision(2) || 0; r[5] = 0; dust.push(r[0].replace("-USDT-SWAP", "")); }
            else { r[2] = 0; r[5] = 0; r[7] = 0; }
          });
          m.margin = 0.01; m.upnl = 0; m.available = m.equity;
        }
        if (c.market === "spot") c.holdings = c.holdings.filter(h => h.asset === c.settle);
        f.dust = dust;
        f.phase = "done";
        f.op.state = "完成";
        f.op.detail += dust.length ? "；留下零头仓位 " + dust.join("、") : "";
        clearInterval(this.flatTimer);
      }
    },
    openAddMember() {
      this.modal = { type: "addMember" };
      const first = this.compatibleUnjoined[0];
      this.form = { account: first ? first.id : "", priority: String(this.combo.members.length + 1), takeover: false };
    },
    openUnjoined() {
      this.modal = { type: "unjoined", open: "", wide: true };
      this.form = {};
    },
    joinAccount() {
      const a = this.modal.account;
      if (a) this.unjoined = this.unjoined.filter(x => x.id !== a.id);
      const back = this.modal.back && this.unjoinedIn(this.envFilter).length;
      this.toast("示例：已加入组合");
      if (back) this.openUnjoined(); else this.closeModal();
    },
    openJoin(a) {
      this.modal = { type: "addMember", account: a, back: this.modal && this.modal.type === "unjoined" };
      const c = this.combos.find(x => x.market === a.market && (x.env === "paper") === (a.env === "paper"));
      this.form = { combo: c ? c.key : "", priority: "2", takeover: false };
    },
    openEditMember(m) {
      this.modal = { type: "editMember", member: m };
      this.form = { priority: m.priority, enabled: m.enabled };
    },
    openCreate() {
      this.modal = { type: "create" };
      this.drawer = null;
      this.form = { step: 0, kind: this.envFilter, exchange: "币安", market: "swap", name: "", initial: "100000", maker: "0.0002", taker: "0.0005", slip: "1", secret: SECRETS[2], ack: false, join: "new", comboName: "", control: "strategy", combo: "" };
    },
    setLeverage(m) {
      const inst = this.levForm.inst.trim().toUpperCase();
      const val = this.levForm.val.trim();
      if (!inst || !Number(val)) { this.toast("填写标的和倍数"); return; }
      m.leverage[inst] = val;
      this.levForm = { inst: "", val: "" };
      this.toast("示例：已设置 " + inst + " " + val + "×");
    },
    removeLev(m, k) { delete m.leverage[k]; },
    resetDemo() {
      clearInterval(this.flatTimer);
      this.combos = buildCombos();
      this.unjoined = buildUnjoined();
      this.flat = null; this.opLog = []; this.modal = null; this.drawer = null;
      this.toast("示例数据已重置");
    }
  }
}).mount("#app");
</script>
</body>
</html>
