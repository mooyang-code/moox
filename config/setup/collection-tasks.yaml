# Built-in Collector tasks. This file contains no cloud credentials or node data.
tasks:
- space_id: crypto
  task_id: dasftksvjhj2jom4vhd0
  task_name: Binance 现货 K 线 1m
  data_type: kline
  tag_ids: [binance_spot]
  enabled: false
  creator: moox-setup
  collect_params:
    output_fields: [open, high, low, close, volume, quote_volume, trade_num]
    frequency: 1m
- space_id: crypto
  task_id: dasftksvjhj2jom4vhdg
  task_name: Binance 合约 K 线 1m
  data_type: kline
  tag_ids: [binance_swap]
  enabled: false
  creator: moox-setup
  collect_params:
    output_fields: [open, high, low, close, volume, quote_volume, trade_num]
    frequency: 1m
- space_id: stockcn
  task_id: dasftksvjhj2jom4vhh0
  task_name: A 股 K 线 5m
  data_type: kline
  tag_ids: [cn_hs300]
  enabled: false
  creator: moox-setup
  collect_params:
    frequency: 5m
# 港股只支持 5m（东方财富）；不写 output_fields，与 A 股 5m 一样输出股票行的全部字段。
- space_id: stockhk
  task_id: dasftksvjhj2jom4vhk0
  task_name: 港股 K 线 5m
  data_type: kline
  tag_ids: [hk_hsi]
  enabled: false
  creator: moox-setup
  collect_params:
    frequency: 5m
# start: manual 的任务 setup start 不会启用，由用户用 moox-cli collector task update --enabled=true 显式启用。
- space_id: stockcn
  task_id: dasftksvjhj2jom4vhi0
  task_name: A 股 K 线 1d
  data_type: kline
  tag_ids: [cn_hs300]
  enabled: false
  start: manual
  creator: moox-setup
  collect_params:
    frequency: 1d
# 附加字段只能在建任务时选全，所以这个任务一次带齐复权、行业、财务、换手率、股本的全部字段；基础字段与 A 股默认输出一致。
# 任务 ID 在加入换手率与股本字段时换过（已有任务不能新增输出字段）：旧任务 dasftksvjhj2jom4vhhg 不再是内置任务。
- space_id: stockcn
  task_id: dasftksvjhj2jom4vhj0
  task_name: A 股日线（复权、行业、财务、换手率、股本）
  data_type: kline
  tag_ids: [cn_hs300]
  enabled: false
  start: manual
  creator: moox-setup
  collect_params:
    output_fields: [
      open, high, low, close, volume, amount,
      instrument_name, trade_date, close_time, volume_unit, amount_unit, provider_symbol, provider_timestamp, fetched_at,
      request_id, route_id, route_rank, source_provider, quality_status, amount_quality, provider_id, source_id,
      adj_factor, sw_l1, sw_l2, sw_l3,
      fin_report_period, fin_total_revenue, fin_revenue, fin_operating_profit, fin_net_profit, fin_net_profit_parent, fin_eps_basic, fin_total_assets, fin_total_liabilities, fin_equity_parent, fin_operating_cash_flow,
      fin_total_revenue_ttm, fin_revenue_ttm, fin_operating_profit_ttm, fin_net_profit_ttm, fin_net_profit_parent_ttm, fin_eps_basic_ttm, fin_operating_cash_flow_ttm,
      turnover_rate, total_shares, float_shares, dividend_per_share, is_st
    ]
    frequency: 1d
