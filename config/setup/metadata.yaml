tags:
- space_id: crypto
  tag_id: binance_spot
  tag_name: 币安现货
  description: 币安现货全部标的
  mode: auto
  builtin: true
  attributes:
    market_type: spot
    sync.source: binance
    sync.cron: "13 * * * *"
    sync.timezone: UTC
- space_id: crypto
  tag_id: binance_swap
  tag_name: 币安永续
  description: 币安 U 本位永续全部标的
  mode: auto
  builtin: true
  attributes:
    market_type: swap
    sync.source: binance
    sync.cron: "17 * * * *"
    sync.timezone: UTC
- space_id: stockcn
  tag_id: cn_a_share
  tag_name: A股全部股票
  description: 沪深北交易所全部股票
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.cron: "23 * * * *"
    sync.timezone: Asia/Shanghai
- space_id: stockcn
  tag_id: cn_hs300
  tag_name: 沪深300
  description: 沪深300指数成分股，每天开盘前按东方财富成分板块同步
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.index: "000300"
    sync.cron: "40 8 * * *"
    sync.timezone: Asia/Shanghai
# 港股恒指：行情源是东方财富（sync.source），成分名单来自腾讯（sync.index_source）。
- space_id: stockhk
  tag_id: hk_hsi
  tag_name: 恒生指数
  description: 恒生指数成分股，每天开盘前按腾讯的指数成分接口同步
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.index_source: tencent
    sync.index: HSI
    sync.cron: "40 8 * * *"
    sync.timezone: Asia/Hong_Kong

datasets:
- space_id: stockcn
  dataset_id: dataset_stockcn_financial_statement_metric
  data_source_id: quantclass_stock
  name: 财报指标明细
  data_kind: record
  freq: quarter
  attributes:
    source_directories: 邢不行财务数据
    storage_model: long_form
- space_id: stockcn
  dataset_id: dataset_stockcn_financial_summary
  data_source_id: quantclass_stock
  name: 财务摘要
  data_kind: record
  freq: quarter
  attributes:
    source_directories: 财务预处理数据
    storage_model: wide_common_metrics

- space_id: stockus
  dataset_id: dataset_stockus_equity_kline_1d
  data_source_id: market_data
  name: 美股行情
  data_kind: time_series
  freq: 1d
  attributes:
    market_id: stockus
    instrument_type: equity
    storage_model: wide_common_metrics
    owner_module: collector
    dataset_role: raw_collection

