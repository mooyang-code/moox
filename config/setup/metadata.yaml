  status: active
- space_id: stockcn
  data_source_id: sina
  name: 新浪财经
  status: active
- space_id: stockcn
  data_source_id: ths
  name: 同花顺
  status: active
- space_id: stockcn
  data_source_id: market_data
  name: MooX统一行情
  status: active
- space_id: stockhk
  data_source_id: eastmoney
  name: 东方财富
  status: active
- space_id: stockhk
  data_source_id: market_data
  name: MooX统一行情
  status: active
- space_id: stockus
  data_source_id: eastmoney
  name: 东方财富
  status: active
- space_id: stockus
  data_source_id: market_data
  name: MooX统一行情
  status: active
- space_id: crypto
  data_source_id: crypto
  name: 加密货币聚合行情
  status: active
- space_id: crypto
  data_source_id: binance
  name: 加密
  status: active
- space_id: crypto
  data_source_id: okx
  name: 欧易
  status: active

tags:
- space_id: crypto
  tag_id: binance_spot
  tag_name: 币安现货
  description: 币安现货全部标的
  mode: auto
  builtin: true
  attributes:
    market_type: spot
    sync.source: binance
    sync.cron: "13 * * * *"
    sync.timezone: UTC
- space_id: crypto
  tag_id: binance_swap
  tag_name: 币安永续
  description: 币安 U 本位永续全部标的
  mode: auto
  builtin: true
  attributes:
    market_type: swap
    sync.source: binance
    sync.cron: "17 * * * *"
    sync.timezone: UTC
- space_id: stockcn
  tag_id: cn_a_share
  tag_name: A股全部股票
  description: 沪深北交易所全部股票
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    # 东方财富重试后仍失败（断连、冷却）时改用新浪取一次，只加不减。
    sync.fallback_source: sina
    sync.cron: "23 * * * *"
    sync.timezone: Asia/Shanghai
- space_id: stockcn
  tag_id: cn_hs300
  tag_name: 沪深300
  description: 沪深300指数成分股，每天开盘前按东方财富成分板块同步
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.index: "000300"
    sync.cron: "40 8 * * *"
    sync.timezone: Asia/Shanghai
# 港股恒指：行情源是东方财富（sync.source），成分名单来自腾讯（sync.index_source）。
- space_id: stockhk
  tag_id: hk_hsi
  tag_name: 恒生指数
  description: 恒生指数成分股，每天开盘前按腾讯的指数成分接口同步
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.index_source: tencent
    sync.index: HSI
    sync.cron: "40 8 * * *"
    sync.timezone: Asia/Hong_Kong
# 美股标普 500 与纳斯达克 100：sync.source 是东方财富，只用它的美股列表给成分对交易所（K 线按路由取 CNBC，不看它），成分名单分别来自 datahub 的开源数据集与纳斯达克官网接口（sync.index_source）。
# 成分在纽约开盘前（08:00，周一到周五）同步；sync.cron 不写时是每小时一次（UTC），所以必须写 cron 和时区。
- space_id: stockus
  tag_id: us_spx
  tag_name: 标普500
  description: 标普 500 成分股，每个交易日开盘前按 datahub 的开源成分名单同步
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.index_source: datahub
    sync.index: SPX
    sync.cron: "0 8 * * 1-5"
    sync.timezone: America/New_York
- space_id: stockus
  tag_id: us_ndx
  tag_name: 纳斯达克100
  description: 纳斯达克 100 成分股，每个交易日开盘前按纳斯达克官网的成分接口同步
  mode: auto
  builtin: true
  attributes:
    market_type: equity
    sync.source: eastmoney
    sync.index_source: nasdaq
    sync.index: NDX
    sync.cron: "0 8 * * 1-5"
    sync.timezone: America/New_York

