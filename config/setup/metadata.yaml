# Default MooX metadata for A-share, crypto, and internal monitoring.
# Import with: moox-cli setup init --config-dir config/setup

spaces:
- space_id: stockcn
  name: A股市场
  description: A股、ETF、可转债、指数及基本面数据
  owner: quant
  status: active
  market: CN
  timezone: Asia/Shanghai
- space_id: stockhk
  name: 港股市场
  description: 港股股票行情数据
  owner: quant
  status: active
  market: HK
  timezone: Asia/Hong_Kong
- space_id: stockus
  name: 美股市场
  description: 美股股票行情数据
  owner: quant
  status: active
  market: US
  timezone: America/New_York
- space_id: crypto
  name: 加密货币市场
  description: 加密货币现货与永续合约行情数据
  owner: quant
  status: active
  market: crypto
  timezone: UTC

