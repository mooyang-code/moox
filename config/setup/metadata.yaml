# Default MooX metadata for A-share, crypto, and internal monitoring.
# Import with: moox-cli setup init --config-dir config/setup

spaces:
- space_id: stockcn
  name: A股市场
  description: A股、ETF、可转债、指数及基本面数据
  owner: quant
  status: active
  market: CN
  timezone: Asia/Shanghai
- space_id: stockhk
  name: 港股市场
  description: 港股股票行情数据
