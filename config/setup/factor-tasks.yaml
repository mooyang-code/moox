# 默认因子任务：setup start --space-id <空间> 导入这个空间的任务（定义是全局的，一起导入），只建不改。
# 自己的任务写成同样格式的文件，用 moox-cli factor task apply --file <文件> 导入；线上已有同 ID 且内容不同时逐项列出差异、不写入。
#
# 定义（definitions）引用 source_dir 下 YAML 因子库文件里的一个因子（factor_id + file）；source_dir 相对这个文件所在的目录。
# 展示名与表达式都来自库文件，类型、输入列、输出列与回看由 FactorMgr 编译得到；定义是全局的，不含数据集、频率和状态。
# 因子任务（tasks）读一个源数据集的一个频率，一个源数据集可以有多个任务：
#   id           任务 ID，ftask_ 加小写字母、数字、下划线组成的后缀；
#   name         展示名，直接用作结果数据集的名称（含汉字、不超过 10 个字、空间内唯一）；
#   members      任务的成员：factor 引用定义；params 是固定成员的固定参数，没给的参数取定义的默认值；
#                var: true 是可变成员，参数由关联的策略实例逐期提交，params 是它的默认参数；status 缺省为 enabled。
# 成员键由参数推导，不在这里写：参数全为默认值时就是因子 ID，否则是 因子ID__值1_值2…，可变成员是 因子ID__var。
# 结果列名是成员键，多输出因子再加 __输出名；导入时逐项打印已存在 / 新建 / 与线上不同，以及每个成员的成员键和列名。
# 同一个因子可以用不同的固定参数多次加入同一个任务，固定参数加成员之后不再改，要换参数请另加一个成员。
# 默认因子：xbx.yaml 里的 bias、cci、min_max、quote_volume_mean，以及 common.yaml 里的常用技术指标
# （MA、EMA、MACD、RSI、ROC、BOLL、ATR、收益率波动、VWAP）。
# 保留期必须装得下因子的最大回看根数：导入前按 moox.toml 的 [storage_retention] 核对。
source_dir: ../../modules/factor/factors

# 每个采集任务独占一个结果数据集，ID 由任务 ID 派生为 dataset_<task_id>（见同目录的 collection-tasks.yaml）：
# 下面的任务分别读币安现货、合约 1m 任务与 A 股 5m、港股 5m 任务的结果。
# 固定参数、可变成员的写法示例（加进任务的 members 里即可，不要和任务里已有的同一成员重复）：
#   - {factor: ema, params: {span: 20, warmup: 50000}}   # 成员键 ema__20_50000
#   - {factor: ma, var: true}                            # 成员键 ma__var，参数由关联的策略实例逐期提交
tasks:
  - id: ftask_spot_1m
    name: 现货一分钟
    space_id: crypto
    source_dataset_id: dataset_dasftksvjhj2jom4vhd0
    frequency: 1m
    members:
      - {factor: bias}
      - {factor: cci}
      - {factor: min_max}
      - {factor: quote_volume_mean}
      - {factor: ma}
      - {factor: ema}
      - {factor: macd}
      - {factor: rsi}
      - {factor: roc}
      - {factor: boll}
      - {factor: atr}
      - {factor: atr_pct}
      - {factor: return_std}
      - {factor: vwap}

  - id: ftask_swap_1m
    name: 合约一分钟
    space_id: crypto
    source_dataset_id: dataset_dasftksvjhj2jom4vhdg
    frequency: 1m
    members:
      - {factor: bias}
      - {factor: cci}
      - {factor: min_max}
      - {factor: quote_volume_mean}
      - {factor: ma}
      # 成员键 ma__5、ma__10：默认展示策略 dual_ma_swap_1m 的快线与慢线
      - {factor: ma, params: {window: 5}}
      - {factor: ma, params: {window: 10}}
      - {factor: ema}
      - {factor: macd}
      - {factor: rsi}
      - {factor: roc}
      - {factor: boll}
      - {factor: atr}
      - {factor: atr_pct}
      - {factor: return_std}
      - {factor: vwap}

  # A 股 5m 任务：读 collection-tasks.yaml 里“A 股 K 线 5m”任务的结果（沪深 300 成分股）。
  # 只放双均线示例（examples/strategies/dual_ma_cn_5m.yaml）用到的两个成员，最长只回看 10 根，上线当天就能出结果；
  # EMA 等长回看因子在 A 股 5m 上要几年的历史（默认 EMA 最大回看 49995 根，每个交易日只有 48 根），需要时再加，并同步调大保留期。
  - id: ftask_cn_5m
    name: A股五分钟
    space_id: stockcn
    source_dataset_id: dataset_dasftksvjhj2jom4vhh0
    frequency: 5m
    members:
      - {factor: ma, params: {window: 5}}
      - {factor: ma, params: {window: 10}}

  # 港股 5m 任务：读 collection-tasks.yaml 里“港股 K 线 5m”任务的结果（恒生指数成分股）。
  # 与 A 股一样只放双均线示例（examples/strategies/dual_ma_hk_5m.yaml）用到的两个成员，最长只回看 10 根，上线当天就能出结果；
  # 港股每个交易日 66 根 5m（半日市 30 根），长回看因子同样要先补历史并调大保留期。
  - id: ftask_hk_5m
    name: 港股五分钟
    space_id: stockhk
    source_dataset_id: dataset_dasftksvjhj2jom4vhk0
    frequency: 5m
    members:
      - {factor: ma, params: {window: 5}}
      - {factor: ma, params: {window: 10}}

definitions:
  - {factor_id: bias, file: xbx.yaml}
  - {factor_id: cci, file: xbx.yaml}
  - {factor_id: min_max, file: xbx.yaml}
  - {factor_id: quote_volume_mean, file: xbx.yaml}
  - {factor_id: ma, file: common.yaml}
  - {factor_id: ema, file: common.yaml}
  - {factor_id: macd, file: common.yaml}
  - {factor_id: rsi, file: common.yaml}
  - {factor_id: roc, file: common.yaml}
  - {factor_id: boll, file: common.yaml}
  - {factor_id: atr, file: common.yaml}
  - {factor_id: atr_pct, file: common.yaml}
  - {factor_id: return_std, file: common.yaml}
  - {factor_id: vwap, file: common.yaml}
