$:
  pull_request:
    - stages:
        - name: Scan pull request changes for secrets
          image: ghcr.io/gitleaks/gitleaks:v8.30.1
          args:
            - git
            - --redact
            - --exit-code
            - "1"
            - --log-opts=$CNB_PULL_REQUEST_TARGET_SHA..$CNB_PULL_REQUEST_SHA
            - .
        - name: Validate security scan configuration
          image: cnbcool/code-security-config
          args:
            - validate
  tag_push:
    - docker:
        image: golang:1.24-bookworm
      stages:
        - name: Install build tools
          script: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make nodejs npm python3 ca-certificates
            npm install --global pnpm@10.28.2
        - name: Verify release contract
          script: bash scripts/test/contract/test-release-contract.sh
        - name: Build release matrix
          script: |
            VERSION="$CNB_BRANCH" \
            RELEASE_PLATFORMS="linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64" \
              ./scripts/release/release-matrix.sh
        - name: Create CNB Release
          type: git:release
          options:
            title: MooX $CNB_BRANCH
            description: Cross-platform MooX binary release
            latest: true
        - name: Upload release archives
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - release/*.tar.gz
              - release/*.sha256
