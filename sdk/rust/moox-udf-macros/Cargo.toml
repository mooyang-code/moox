[package]
name = "moox-udf-macros"
version = "0.1.0"
edition = "2021"
description = "moox 因子自定义算子（wasm UDF）的过程宏"
license = "UNLICENSED"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
moox-udf = { path = "../moox-udf" }
