name: Release and deploy MooX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to package and deploy
        required: true
        type: string
      deploy_production:
        description: Deploy the package to 106.53.107.122
        required: true
        default: true
        type: boolean
      publish_release:
        description: Create or update the GitHub Release asset
        required: true
        default: true
        type: boolean
      use_local_source_cache:
        description: Load the tagged source archive preloaded on the self-hosted runner
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: moox-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: moox-ci
    environment: production
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_PLATFORMS: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64
      GOPROXY: https://mirrors.tencent.com/go,direct
      GOPRIVATE: ""
      GONOSUMDB: ""
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || !inputs.use_local_source_cache
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Load tagged source from runner cache
        if: github.event_name == 'workflow_dispatch' && inputs.use_local_source_cache
        run: |
          archive="/home/ubuntu/ci-cache/moox-${RELEASE_TAG}-src.tar.gz"
          test -s "$archive"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
      - name: Add preinstalled tools to PATH
        run: |
          echo /home/ubuntu/go-sdk/bin >> "$GITHUB_PATH"
          echo /home/ubuntu/.venvs/moox/bin >> "$GITHUB_PATH"
      - name: Check self-hosted runner
        run: bash scripts/ci/check-runner.sh
      - name: Verify before packaging
        run: make verify
      - name: Build release package
        run: VERSION="$RELEASE_TAG" RELEASE_PLATFORMS="$RELEASE_PLATFORMS" ./scripts/release/release-matrix.sh
      - name: Create or update GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "MooX ${RELEASE_TAG}"
          fi
          gh release upload "$RELEASE_TAG" \
            release/moox-${RELEASE_TAG}-*.tar.gz \
            release/moox-${RELEASE_TAG}-*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Reclaim runner workspace before deployment
        if: github.event_name == 'push' || inputs.deploy_production
        run: |
          find release -mindepth 1 -maxdepth 1 -type d \
            -name "moox-${RELEASE_TAG}-*" -exec rm -rf -- {} +
          rm -rf web/node_modules web/dist
          rm -rf /home/ubuntu/.cache/go-build
          if [[ "${PUBLISH_RELEASE}" != "true" ]]; then
            rm -f "release/moox-${RELEASE_TAG}-"*.tar.gz "release/moox-${RELEASE_TAG}-"*.sha256
          fi
          df -h .
      - name: Deploy to 106.53.107.122
        if: github.event_name == 'push' || inputs.deploy_production
        run: |
          ./scripts/deploy/deploy-moox.sh \
            --target localhost \
            --dir /home/ubuntu/moox/prod \
            --goos linux \
            --goarch amd64 \
            --skip-build \
            --local-ca skip \
            --target-ca skip
      - name: Verify deployed services
        if: github.event_name == 'push' || inputs.deploy_production
        run: |
          set -a
          source /home/ubuntu/moox/prod/secrets/health-auth.env
          set +a
          /home/ubuntu/moox/prod/healthcheck.sh
          curl --fail --silent --show-error \
            --cacert /home/ubuntu/moox/prod/certs/caddy/root.crt \
            --resolve 106.53.107.122:9527:127.0.0.1 \
            https://106.53.107.122:9527/ >/dev/null
