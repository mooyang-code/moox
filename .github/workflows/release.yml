name: Release and deploy MooX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to package and deploy
        required: true
        type: string
      deploy_production:
        description: Deploy the package to 106.53.107.122
        required: true
        default: true
        type: boolean
      publish_release:
        description: Create or update the GitHub Release asset
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: moox-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: moox-ci
    environment: production
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      TARGET_GOOS: linux
      TARGET_GOARCH: amd64
      GOPROXY: https://mirrors.tencent.com/go,direct
      GOPRIVATE: ""
      GONOSUMDB: ""
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Add preinstalled tools to PATH
        run: |
          echo /home/ubuntu/go-sdk/bin >> "$GITHUB_PATH"
          echo /home/ubuntu/.venvs/moox/bin >> "$GITHUB_PATH"
      - name: Check self-hosted runner
        run: bash scripts/ci/check-runner.sh
      - name: Verify before packaging
        run: make verify
      - name: Build release package
        run: VERSION="$RELEASE_TAG" TARGET_GOOS="$TARGET_GOOS" TARGET_GOARCH="$TARGET_GOARCH" make release
      - name: Create or update GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="release/moox-${RELEASE_TAG}-linux-amd64.tar.gz"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "MooX ${RELEASE_TAG}"
          fi
      - name: Reclaim runner workspace before deployment
        if: github.event_name == 'push' || inputs.deploy_production
        run: |
          rm -rf "release/moox-${RELEASE_TAG}-linux-amd64"
          rm -rf web/node_modules web/dist
          rm -rf /home/ubuntu/.cache/go-build
          if [[ "${PUBLISH_RELEASE}" != "true" ]]; then
            rm -f "release/moox-${RELEASE_TAG}-linux-amd64.tar.gz"
          fi
          df -h .
      - name: Deploy to 106.53.107.122
        if: github.event_name == 'push' || inputs.deploy_production
        run: |
          ./scripts/deploy-moox.sh \
            --target localhost \
            --dir /home/ubuntu/moox/prod \
            --goos "$TARGET_GOOS" \
            --goarch "$TARGET_GOARCH" \
            --skip-build \
            --local-ca skip \
            --target-ca skip
      - name: Verify deployed services
        if: github.event_name == 'push' || inputs.deploy_production
        run: |
          set -a
          source /home/ubuntu/moox/prod/secrets/health-auth.env
          set +a
          /home/ubuntu/moox/prod/healthcheck.sh
          curl --fail --silent --show-error \
            --cacert /home/ubuntu/moox/prod/certs/caddy/root.crt \
            --resolve 106.53.107.122:9527:127.0.0.1 \
            https://106.53.107.122:9527/ >/dev/null
