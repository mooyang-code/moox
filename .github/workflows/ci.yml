name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: make verify

  verify-trusted:
    if: github.event_name != 'pull_request'
    runs-on: moox-ci
    timeout-minutes: 45
    env:
      GOPROXY: https://mirrors.tencent.com/go,direct
      GOPRIVATE: ""
      GONOSUMDB: ""
      # The small deployment host cannot retain the full Go build cache while
      # running the complete multi-module verification suite.
      GOCACHE: off
    steps:
      - uses: actions/checkout@v4
      - name: Add preinstalled tools to PATH
        run: |
          echo /home/ubuntu/go-sdk/bin >> "$GITHUB_PATH"
          echo /home/ubuntu/.venvs/moox/bin >> "$GITHUB_PATH"
      - name: Check self-hosted runner
        run: bash scripts/ci/check-runner.sh
      - run: make verify
