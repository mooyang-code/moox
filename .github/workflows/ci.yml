name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan pull request changes for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --exit-code 1 --log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} .

  # 判断这个 PR 是否只改了 docs/：只改文档时 verify-pr 只跑文档检查，verify-go 整个跳过。
  # 取不到文件列表、列表为空或任何一个文件在 docs/ 之外，都按“不是纯文档”处理，跑完整检查。
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          if files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')" \
            && [[ -n "${files}" ]] && ! grep -qv '^docs/' <<<"${files}"; then
            docs_only=true
          fi
          echo "docs_only=${docs_only}" | tee -a "${GITHUB_OUTPUT}"

  # 综合检查拆成 verify-pr 与 verify-go 两个作业并行：Go 工作区测试最慢（约 5 分钟），单独放一个作业，总时间约减半。
  verify-pr:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install verification tools
        run: |
          sudo apt-get update && sudo apt-get install --yes ripgrep
          # SCF 打包契约测试（scripts/build/build-collector-scf-package.sh）需要 PyYAML。
          python3 -m pip install --quiet pyyaml
      - name: Check pinned Go toolchain
        run: bash scripts/ci/check-go-version.sh
      # 托管运行器没有 proto 代码生成工具，跳过 proto-check；自托管运行器的 verify-trusted 仍执行完整检查。
      # Go 工作区测试由并行的 verify-go 作业执行，这里用 SKIP_GO_TEST=1 跳过，其余检查与 make verify 一致。
      - name: Run make verify
        if: needs.changes.outputs.docs_only != 'true'
        run: make verify SKIP_PROTO_CHECK=1 SKIP_GO_TEST=1
      # 只改了 docs/：跑文档架构契约与文档站点构建，跳过 Go、前端和脚本的检查。
      - name: Run docs checks
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          make test-docs-architecture
          CI=true pnpm install --frozen-lockfile
          pnpm docs:build

  verify-go:
    name: verify-go
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Check pinned Go toolchain
        run: bash scripts/ci/check-go-version.sh
      - name: Go workspace tests
        run: make test-go

  # 运维机外部程序（因子引擎、归档 worker）在 Windows 上的代码路径：私密文件 ACL、集合锁、服务子命令、
  # 磁盘余量、目录同步与导出，以及 PowerShell 安装脚本的语法。实机安装与开机自启仍需在 Windows 机器上验证。
  windows-external:
    name: Windows external programs
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Test Windows code paths
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/security && go test ./...)
          (cd packages/servicehost && go test ./...)
          (cd packages/jetstream && go vet ./...)
          (cd modules/factor && go test ./internal/setlock/ ./cmd/engine/)
          (cd modules/archive && go test ./internal/worker/... ./cmd/worker/)
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in 'scripts/deploy/deploy-factor-engine.ps1', 'scripts/deploy/deploy-archive-worker.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }

  verify-trusted:
    if: github.event_name != 'pull_request'
    runs-on: moox-ci
    timeout-minutes: 45
    env:
      GOPROXY: https://mirrors.tencent.com/go,direct
      GOPRIVATE: ""
      GONOSUMDB: ""
    steps:
      - name: Checkout verified commit
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sources=(
            "https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}.git"
            "https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}.git"
            "https://ghproxy.net/https://github.com/${GITHUB_REPOSITORY}.git"
          )
          # macOS 没有 timeout 命令，优先用 coreutils 的 gtimeout，都没有就不限时。
          limit="$(command -v timeout || command -v gtimeout || true)"
          for source in "${sources[@]}"; do
            rm -rf "${GITHUB_WORKSPACE}/.git"
            git -C "${GITHUB_WORKSPACE}" init --quiet
            git -C "${GITHUB_WORKSPACE}" remote add source "${source}"
            if ${limit:+"${limit}" 120} git -C "${GITHUB_WORKSPACE}" fetch --no-tags --depth=1 source "${GITHUB_SHA}"; then
              git -C "${GITHUB_WORKSPACE}" fsck --strict
              git -C "${GITHUB_WORKSPACE}" checkout --detach FETCH_HEAD
              [[ "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" == "${GITHUB_SHA}" ]]
              exit 0
            fi
          done
          echo 'Unable to fetch the requested commit through any configured source mirror' >&2
          exit 1
      - name: Add preinstalled tools to PATH
        run: |
          # 固定版本的 Go 若装在运行用户目录下（自托管运行器），加入 PATH；其余工具沿用运行器注册时的 PATH。
          go_bin="${HOME}/.local/go$(cat .go-version)/bin"
          if [[ -d "${go_bin}" ]]; then
            echo "${go_bin}" >> "${GITHUB_PATH}"
          fi
      - name: Check self-hosted runner
        run: bash scripts/ci/check-runner.sh
      - run: make verify
