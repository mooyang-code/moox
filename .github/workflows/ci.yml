name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan pull request changes for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --exit-code 1 --log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} .

  # 判断这个 PR 是否只改了 docs/：只改文档时只跑 verify-docs，其余验证作业整个跳过。
  # 取不到文件列表、列表为空或任何一个文件在 docs/ 之外，都按“不是纯文档”处理，跑完整检查。
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          if files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')" \
            && [[ -n "${files}" ]] && ! grep -qv '^docs/' <<<"${files}"; then
            docs_only=true
          fi
          echo "docs_only=${docs_only}" | tee -a "${GITHUB_OUTPUT}"

  # PR 的综合检查按耗时拆成并行的作业，最后由 verify-pr 汇总：
  #   verify (core / contracts / storage / web)：make verify 的四组检查，定义见 Makefile 的 verify-ci-*；
  #   verify-go (1/3 ~ 3/3)：Go 工作区测试最慢，按模块切成三片；
  #   verify-docs：只改了 docs/ 时代替以上两类，只跑文档检查；
  #   verify-pr：汇总，所有该跑的作业都成功才算通过。
  verify:
    name: verify (${{ matrix.group }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, contracts, storage, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # 只有 web 组会安装前端依赖；其他组没有 pnpm 存储目录，开缓存会让收尾步骤报 Path Validation Error 而失败。
          cache: ${{ matrix.group == 'web' && 'pnpm' || '' }}
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install verification tools
        run: |
          sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check pinned Go toolchain
        run: bash scripts/ci/check-go-version.sh
      # 托管运行器没有 proto 代码生成工具，跳过 proto-check；自托管运行器的 verify-trusted 仍执行完整检查。
      - name: Run make verify-ci-${{ matrix.group }}
        run: make verify-ci-${{ matrix.group }} SKIP_PROTO_CHECK=1

  verify-go:
    name: verify-go (${{ matrix.shard }}/3)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Check pinned Go toolchain
        run: bash scripts/ci/check-go-version.sh
      - name: Go workspace tests
        env:
          MOOX_GO_SHARD: ${{ matrix.shard }}/3
        run: make test-go

  # Rust SDK、示例与测试样本：工具链版本锁在 sdk/rust/rust-toolchain.toml，所有非纯文档变更都运行。
  verify-rust:
    name: verify-rust
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Install pinned Rust toolchain
        working-directory: sdk/rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('sdk/rust/Cargo.lock', 'sdk/rust/rust-toolchain.toml') }}
      - name: Run make test-rust
        run: make test-rust
      - name: UDF host package tests (including the cross-architecture digest check)
        run: cd packages/factorudf && go test -count=1 ./...

  verify-docs:
    name: verify-docs
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Run docs checks
        run: |
          make test-docs-architecture
          CI=true pnpm install --frozen-lockfile
          pnpm docs:build

  verify-pr:
    name: verify-pr
    needs: [changes, verify, verify-go, verify-rust, verify-docs]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every expected job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERIFY: ${{ needs.verify.result }}
          VERIFY_GO: ${{ needs.verify-go.result }}
          VERIFY_RUST: ${{ needs.verify-rust.result }}
          VERIFY_DOCS: ${{ needs.verify-docs.result }}
        run: |
          echo "changes=${CHANGES} docs_only=${DOCS_ONLY} verify=${VERIFY} verify-go=${VERIFY_GO} verify-rust=${VERIFY_RUST} verify-docs=${VERIFY_DOCS}"
          # changes 没成功就无法确定该跑哪些作业，不能把“全部跳过”当成通过。
          [[ "${CHANGES}" == success ]] || { echo '改动判断作业没有成功' >&2; exit 1; }
          if [[ "${DOCS_ONLY}" == true ]]; then
            [[ "${VERIFY_DOCS}" == success ]] || { echo '文档检查没有通过' >&2; exit 1; }
          else
            [[ "${VERIFY}" == success && "${VERIFY_GO}" == success && "${VERIFY_RUST}" == success ]] || { echo '验证作业没有全部通过' >&2; exit 1; }
          fi

  # 外部程序只支持 Linux；这里只保留 packages/security 的 Windows 私密文件 ACL 测试（Windows 运维机上的 moox-cli 仍会用到）。
  windows-external:
    name: Windows security
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: '**/go.sum'
      - name: Test Windows code paths
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/security && go test ./...)

  verify-trusted:
    if: github.event_name != 'pull_request'
    runs-on: moox-ci
    timeout-minutes: 45
    env:
      GOPROXY: https://mirrors.tencent.com/go,direct
      GOPRIVATE: ""
      GONOSUMDB: ""
    steps:
      - name: Checkout verified commit
        shell: bash
        run: |
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sources=(
            "https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}.git"
            "https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}.git"
            "https://ghproxy.net/https://github.com/${GITHUB_REPOSITORY}.git"
          )
          # macOS 没有 timeout 命令，优先用 coreutils 的 gtimeout，都没有就不限时。
          limit="$(command -v timeout || command -v gtimeout || true)"
          for source in "${sources[@]}"; do
            rm -rf "${GITHUB_WORKSPACE}/.git"
            git -C "${GITHUB_WORKSPACE}" init --quiet
            git -C "${GITHUB_WORKSPACE}" remote add source "${source}"
            if ${limit:+"${limit}" 120} git -C "${GITHUB_WORKSPACE}" fetch --no-tags --depth=1 source "${GITHUB_SHA}"; then
              git -C "${GITHUB_WORKSPACE}" fsck --strict
              git -C "${GITHUB_WORKSPACE}" checkout --detach FETCH_HEAD
              [[ "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" == "${GITHUB_SHA}" ]]
              exit 0
            fi
          done
          echo 'Unable to fetch the requested commit through any configured source mirror' >&2
          exit 1
      - name: Add preinstalled tools to PATH
        run: |
          # 固定版本的 Go 若装在运行用户目录下（自托管运行器），加入 PATH；其余工具沿用运行器注册时的 PATH。
          go_bin="${HOME}/.local/go$(cat .go-version)/bin"
          if [[ -d "${go_bin}" ]]; then
            echo "${go_bin}" >> "${GITHUB_PATH}"
          fi
      - name: Check self-hosted runner
        run: bash scripts/ci/check-runner.sh
      - run: make verify
