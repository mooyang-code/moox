name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: '**/go.sum'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: make verify

  verify-trusted:
    if: github.event_name != 'pull_request'
    runs-on: moox-ci
    timeout-minutes: 45
    env:
      GOPROXY: https://mirrors.tencent.com/go,direct
      GOPRIVATE: ""
      GONOSUMDB: ""
    steps:
      - name: Select a reachable GitHub route
        shell: bash
        run: |
          if curl -fsSI --connect-timeout 3 --max-time 5 https://github.com/ >/dev/null; then
            exit 0
          fi
          for ip in 140.82.112.3 140.82.113.3 140.82.114.3 140.82.116.3 20.201.28.151; do
            if curl -fsSI --connect-timeout 3 --max-time 6 \
              --resolve "github.com:443:${ip}" https://github.com/ >/dev/null; then
              {
                echo 'GIT_CONFIG_COUNT=1'
                echo 'GIT_CONFIG_KEY_0=http.curloptResolve'
                echo "GIT_CONFIG_VALUE_0=github.com:443:${ip}"
              } >>"${GITHUB_ENV}"
              exit 0
            fi
          done
          echo 'No reachable official GitHub web endpoint found' >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Add preinstalled tools to PATH
        run: |
          echo /home/ubuntu/go-sdk/bin >> "$GITHUB_PATH"
          echo /home/ubuntu/.venvs/moox/bin >> "$GITHUB_PATH"
      - name: Check self-hosted runner
        run: bash scripts/ci/check-runner.sh
      - run: make verify
