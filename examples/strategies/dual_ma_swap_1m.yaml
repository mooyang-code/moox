# 默认展示策略：合约双均线（5/10），读取币安合约 1m 因子任务（ftask_swap_1m）的全部合约。
#
# 使用方法：合约 1m 因子任务里要有两个固定成员（moox.toml.example 的默认合约任务已包含）：
#   { factor = "ma", params = { window = 5 } }   # → 列 ma__5，窗口 5，作快线
#   { factor = "ma", params = { window = 10 } }  # → 列 ma__10，窗口 10，作慢线
# 创建实例时选这个因子任务，不挂账户（观察实例）：只计算目标权重、不投递，适合作为系统的默认展示。
#
# 规则：不限定标的，任务里的全部合约每期各自判断——快线在慢线之上（多头排列）的都持有，
# 一旦快线落到慢线之下（死叉）下一期就被剔除；持有的合约等权分配，单个合约最多占 5%，
# 满足条件的合约较少时剩余部分留现金。select.top 只是个足够大的上限（大于合约数），等于全选。
name: dual_ma_swap_1m
bar: 1m

universe:
  min_age_bars: 15

rules:
  - id: ma_above
    name: 5 周期均线在 10 周期均线之上
    type: rank
    filter: "ma__5 > ma__10"
    score: "rank(ma__5 / ma__10 - 1)"
    select: {top: 10000}
    weight: {total: 1, method: equal, cap: 0.05}

portfolio:
  leverage: 1
