# 全链路耗时观察策略：从 K 线收盘到策略求值完成。声明 EMA20（5 万根预热）和几个基础因子，启用实例时自动建立私有因子集，
# 每期先算因子再求值；绑定 5m 合约 K 线 View，不挂账户（观察实例）。
#
# ema20w 是 Ema 因子的一个成员，参数由本策略逐期提交：span=20、warmup=50000。第一期没有提交过，用定义的默认值（warmup=0），
# 从第二期起按 5 万根预热计算；观察耗时请从第二期看起。
name: chain_ema20w_5m
bar: 5m

# 别名与定义 ID 相同时，规则里直接用输出名（rsi、boll_mid……）；别名不同的成员列名是 <别名>_<输出名>（ema20w_ema）。
factors:
  ema20w: {factor: Ema}
  Ma: {factor: Ma}
  Rsi: {factor: Rsi}
  Boll: {factor: Boll}
  Atr: {factor: Atr}

factor_params:
  ema20w:
    span: {default: "20"}
    warmup: {default: "50000"}

universe:
  min_age_bars: 100

rules:
  - id: above_ema20w
    name: 站上 EMA20（5 万根预热）、未超买、偏离最大
    type: rank
    filter: "ema20w_ema > 0 && close > ema20w_ema && rsi < 70 && close > boll_mid"
    score: "rank(close / ema20w_ema - 1)"
    select: {top: 10}
    weight: {total: 1, method: equal, cap: 0.2}

portfolio:
  leverage: 1
  min_universe: 5
  max_missing: 0.2
