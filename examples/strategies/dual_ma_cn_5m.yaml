# A 股默认展示策略：沪深 300 双均线（5/10），读取 A 股 5m 因子任务（ftask_cn_5m）的全部成分股。
#
# 使用方法：A 股 5m 因子任务里只有两个固定成员（moox.toml.example 的默认 A 股任务已包含）：
#   { factor = "ma", params = { window = 5 } }   # → 列 ma__5，窗口 5，作快线
#   { factor = "ma", params = { window = 10 } }  # → 列 ma__10，窗口 10，作慢线
# 均线只回看 10 根 5m K 线（50 分钟交易时间），上线当天就能出结果，不需要导入历史。
# 创建实例时选这个因子任务；可挂 A 股模拟账户（场所“A 股”，市场“股票”）投递目标，不挂账户就是观察实例，只计算目标权重。
#
# 规则：成分股每期各自判断——快线在慢线之上的都持有，快线落到慢线之下下一期就被剔除；
# 持有的股票等权分配，单只最多占 5%，满足条件的较少时剩余部分留现金。A 股按现货处理：不做空、不加杠杆。
# 周期按交易时段推进：11:25 那根之后是 13:00 那根，午休、隔夜、周末不计根数。
name: dual_ma_cn_5m
bar: 5m


rules:
  - id: ma_above
    name: 5 周期均线在 10 周期均线之上
    type: rank
    filter: "ma__5 > ma__10"
    score: "rank(ma__5 / ma__10 - 1)"
    select: {top: 10000}
    weight: {total: 1, method: equal, cap: 0.05}

portfolio:
  leverage: 1
