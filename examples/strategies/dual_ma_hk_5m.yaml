# 港股默认展示策略：恒生指数成分双均线（5/10），读取港股 5m 因子任务（ftask_hk_5m）的全部成分股。
#
# 使用方法：港股 5m 因子任务里只有两个固定成员（config/setup/factor-tasks.yaml 的默认港股任务已包含）：
#   { factor = "ma", params = { window = 5 } }   # → 列 ma__5，窗口 5，作快线
#   { factor = "ma", params = { window = 10 } }  # → 列 ma__10，窗口 10，作慢线
# 均线只回看 10 根 5m K 线（50 分钟交易时间），上线当天就能出结果，不需要导入历史。
# 创建实例时选这个因子任务；可以直接挂港股模拟账户（场所“港股”，市场“股票”，按港元结算）投递目标，
# 不挂账户就是观察实例，只计算目标权重。
#
# 规则：快线在慢线之上的成分股按“快线高出慢线的幅度”排名，取前 20 名。为了挂上账户后不频繁调仓：
#   - 分两批、每批每 66 根（一个完整交易日）重选一次，两批错开 33 根：每半天只有一批换股，换下来的才卖、换上去的才买，
#     其余持仓不动（每根都重选、全体等权的写法在标的数变化时会让所有持仓一起调仓，挂上模拟盘一天会下几万单）；
#     5m 上的排名变化快，重选一次要换掉三到五成持仓，港股印花税双边各 0.1%：每小时重选一次的话一天的费用约占净值 1%，
#     所以默认一天一换；想看更频繁的成交可以把 bars 调小；
#   - 每批 20 只、每只占 2.45%，两批都选中的占 4.9%，单只不超过 5%；权重不随选中个数变化；
#   - 预算 0.98：留 2% 现金付佣金、印花税和滑点，不会因为满仓下单时“没有可用资金”被拒。
# 港股按现货处理：不做空、不加杠杆；整手买卖（每手股数逐只不同），不足一手的差额视为已满足。
# 周期按交易时段推进：11:55 那根之后是 13:00 那根，午休、隔夜、周末不计根数；半日市只有上午 30 根。
name: dual_ma_hk_5m
bar: 5m


rules:
  - id: ma_above
    name: 5 周期均线在 10 周期均线之上
    type: rank
    filter: "ma__5 > ma__10"
    score: "rank(ma__5 / ma__10 - 1)"
    select: {top: 20}
    holding: {bars: 66, offsets: [0, 33]}
    weight: {total: 0.98, method: equal, cap: 0.05}

portfolio:
  leverage: 1
