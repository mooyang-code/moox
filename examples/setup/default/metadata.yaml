# Default MooX metadata for A-share, crypto, and internal monitoring.
# Import with: moox-cli setup init --config-dir examples/setup/default

spaces:
- space_id: stock_cn
  name: A股市场
  description: A股、ETF、可转债、指数及基本面数据
  owner: quant
  status: active
  market: CN
  timezone: Asia/Shanghai
- space_id: crypto
  name: 加密货币市场
  description: 加密货币现货与永续合约行情数据
