    symbol_dataset_id: binance_swap_symbols
    target_dataset_id: perpetual_kline_1h
    frequency: 1H
# Stock rules are seeded disabled until the corresponding instrument universe
# is imported into the named symbol Dataset. They document the canonical
# Market/Instrument/Dataset matrix without causing a fresh project to invoke
# a provider with an empty symbol catalogue.
- space_id: stock_cn
  rule_id: builtin-eastmoney-stock-cn-equity-kline-1m
  data_type: kline
  provider: eastmoney
  market_type: equity
  enabled: false
  creator: moox-setup
  collect_params:
    provider: eastmoney
    market_id: stock_cn
    instrument_type: equity
    market_type: equity
    symbol_source: dataset
    symbol_dataset_id: stock_cn_equity_symbols
    target_dataset_id: stock_cn_kline
    frequency: 1m
