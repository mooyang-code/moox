# Built-in Collector rules. This file contains no cloud credentials or node data.
rules:
- space_id: crypto
  rule_id: builtin-binance-spot-symbols-1h
  data_type: symbol
  provider: binance
  market_type: spot
  enabled: true
  creator: moox-setup
  collect_params:
    provider: binance
    market_type: spot
    symbol_source: exchange
    target_dataset_id: binance_spot_symbols
    frequency: 1H
- space_id: crypto
  rule_id: builtin-binance-swap-symbols-1h
  data_type: symbol
  provider: binance
  market_type: swap
  enabled: true
  creator: moox-setup
  collect_params:
    provider: binance
    market_type: swap
    symbol_source: exchange
    target_dataset_id: binance_swap_symbols
    frequency: 1H
- space_id: crypto
  rule_id: builtin-binance-spot-kline-1m
  data_type: kline
  provider: binance
  market_type: spot
  enabled: true
  creator: moox-setup
  collect_params:
    provider: binance
    market_type: spot
    symbol_source: dataset
    symbol_dataset_id: binance_spot_symbols
    target_dataset_id: binance_spot_kline_1m
    frequency: 1m
- space_id: crypto
