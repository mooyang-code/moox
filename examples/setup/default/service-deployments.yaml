# MooX default service deployment seed. Hosts are loopback defaults for a single-node install.
# Replace public_address and the public service hosts before importing a multi-host setup.
version: 1
node:
  id: control
  name: control
  public_address: https://127.0.0.1
  status: enabled

services:
  # Independently deployed processes and their public/internal endpoints.
  - name: admin_gateway
    kind: gateway
    deployment_mode: process
    protocol: https
    host: 127.0.0.1
    port: 9527
    gateway_path: /api/admin
    gateway_enabled: false
    scope: public
    status: active
    description: Caddy 管理台 HTTPS 入口，浏览器同源访问 /api/admin/*
    extra_config:
      health_url: http://127.0.0.1:11010/readyz
      health_kind: readiness
      monitor_enabled: true
  - name: web_host
    kind: frontend
    deployment_mode: process
    protocol: https
    host: 127.0.0.1
    port: 9527
    gateway_enabled: false
    scope: public
    status: active
    description: Caddy 管理台 HTTPS 页面入口；web-host 上游仅绑定 loopback
    extra_config:
      health_url: http://127.0.0.1:19527/readyz
      health_kind: readiness
      monitor_enabled: true
  - name: service_gateway
    kind: gateway
    deployment_mode: endpoint
    protocol: https
    host: 127.0.0.1
    port: 11001
    gateway_path: /api/service
    gateway_enabled: false
    scope: public
    status: active
    description: 后台和 SCF HTTPS 服务入口，使用 HMAC 鉴权访问 /api/service/*
    extra_config: {}
  - name: service_gateway_native
    kind: gateway
    deployment_mode: endpoint
    protocol: trpc
    host: 127.0.0.1
    port: 11003
    gateway_enabled: false
    scope: public
    status: active
    description: 公网原生服务网关，供 SCF 访问 Storage
    extra_config: {}
  - name: storage-primary
    kind: storage
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 20200
    gateway_path: trpc.moox.storage.Metadata
    gateway_service_id: storage-primary
    gateway_enabled: true
    scope: public
    status: active
    description: moox-storage PrimaryStore + Metadata 服务
    extra_config:
      health_url: http://127.0.0.1:20210/readyz
      health_kind: readiness
      monitor_enabled: true
      max_body_bytes: 33554432
      gateway_methods: [CreateSpace, UpdateSpace, GetSpace, ListSpaces, CreateView, UpdateView, RequestViewRebuild, GetView, ListViews, UpsertViewColumn, ListViewColumns, ListViewRebuildLogs, CreateDataSource, UpdateDataSource, GetDataSource, ListDataSources, UpsertSubject, UpsertSubjectSymbol, RegisterDataSubject, GetSubject, ListSubjects, ListSubjectSymbols, CreateDataset, UpdateDataset, GetDataset, ListDatasets, BindDatasetSubject, StageDatasetSubjectSet, ActivateDatasetSubjectSet, ListDatasetSubjects, CreateFieldGroup, UpdateFieldGroup, GetFieldGroup, ListFieldGroups, CreateField, UpdateField, GetField, ListFields, BatchUpdateFields, DeleteFieldGroup, CreateFactor, UpdateFactor, GetFactor, ListFactors, UpsertDatasetColumn, ListDatasetColumns, GetDataNode, ListDataNodes, UpdateDataNode, DeleteDataNode, CheckDatasetActivation, ActivateDataset, RebindDatasetDataNode, RegisterArchiveFile, ListArchiveFiles]
      gateway_callers: [admin-gateway, collector, factor, monitor, archive, moox-cli, storage-view]
      gateway_routes:
        - service_path: trpc.moox.storage.Metadata
          port: 20100
          max_body_bytes: 33554432
          gateway_methods: [DeleteSpace]
          gateway_callers: [admin-gateway, moox-cli]
        - service_path: trpc.moox.storage.Metadata
          port: 20100
          max_body_bytes: 33554432
          gateway_methods: [ClaimViewIndexBuild, UpdateViewIndexBuild, ActivateViewIndex, FailViewIndexBuild, CreateViewRebuildLog, UpdateViewRebuildLog, UpsertSkippedViewRebuildLog]
          gateway_callers: [storage-view]
        - service_path: trpc.moox.storage.Metadata
          port: 20100
          gateway_methods: [GetView, ListViews, ListViewColumns, GetDataset, ListDatasets, ListDatasetSubjects, ListSubjects, GetSubject]
          gateway_callers: [admin-gateway, collector, factor, monitor, archive, moox-cli, storage-view, strategy]
        - service_path: trpc.moox.storage.PrimaryStore
          port: 20102
          gateway_methods: [UpsertFields, ReadFields, ReadRecordRows, ReportDatasetPeriodCollected, AppendDatasetSyncPoint, WaitViewSyncPoint, ReportFactorPeriodComputed, GetFactorPeriodComputed]
          gateway_callers: [admin-gateway, collector, factor, monitor, archive, storage-view]
        - service_path: trpc.moox.storage.PrimaryStore
          port: 20102
          gateway_methods: [ReadTimeSeriesRows]
          gateway_callers: [admin-gateway, collector, factor, monitor, archive, storage-view, moox-skill]
  - name: storage-view
    kind: storage
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 20202
    gateway_path: trpc.moox.storage.DataView
    gateway_service_id: storage-view
    gateway_enabled: true
    scope: public
    status: active
    description: moox-storage DataView + ViewBuilder 服务
    extra_config:
      health_url: http://127.0.0.1:20211/readyz
      health_kind: readiness
      monitor_enabled: true
      gateway_methods: [QueryTimeSeriesRows, SearchRecordRows]
      gateway_callers: [admin-gateway, collector, factor, monitor]
  - name: eventbus
    kind: eventbus
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11420
    gateway_path: trpc.moox.eventbus.EventBusMgr
    gateway_enabled: false
    scope: internal
    status: active
    description: MooX 统一 NATS JetStream EventBus 服务
    extra_config:
      nats_url: tls://127.0.0.1:4222
      health_url: http://127.0.0.1:11419/readyz
      health_kind: readiness
      monitor_enabled: true
  - name: moox_gateway
    kind: gateway
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11002
    gateway_enabled: false
    scope: internal
    status: active
    description: 节点服务网关，承载服务路由与路由表刷新
    extra_config:
      health_url: http://127.0.0.1:11012/readyz
      health_kind: readiness
      health_body_contains: ready
      monitor_enabled: true
  - name: moox_monitor
    kind: monitor
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11410
    gateway_path: trpc.moox.monitor.MonitorMgr
    gateway_service_id: monitor
    gateway_enabled: true
    scope: internal
    status: active
    description: 独立服务监控模块，承载 HTTP/TCP 探测和告警
    extra_config:
      health_url: http://127.0.0.1:11409/readyz
      health_kind: readiness
      monitor_enabled: true
      gateway_methods: ["*"]
      gateway_callers: ["*"]
  - name: moox_collector
    kind: collector
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11402
    gateway_path: trpc.moox.collector.CollectMgr
    gateway_service_id: collectmgr
    gateway_enabled: true
    scope: internal
    status: active
    description: 独立采集管理服务，承载采集规则、任务实例和 planner
    extra_config:
      health_url: http://127.0.0.1:11412/readyz
      health_kind: readiness
      monitor_enabled: true
      gateway_methods: ["*"]
      gateway_callers: ["*"]
  - name: moox_cloudnode
    kind: cloudnode
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11401
    gateway_path: trpc.moox.cloudnode.CloudNodeMgr
    gateway_service_id: cloudnode
    gateway_enabled: true
    scope: internal
    status: active
    description: 独立云节点执行平台，承载云节点、代码包、异步 JobItem 队列和同步调用
    extra_config:
      health_url: http://127.0.0.1:11411/readyz
      health_kind: readiness
      monitor_enabled: true
      timeout_ms: 330000
      max_body_bytes: 33554432
      gateway_methods: ["*"]
      gateway_callers: ["*"]
  - name: moox_factor
    kind: factor
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11404
    gateway_path: trpc.moox.factor.FactorMgr
    gateway_service_id: factormgr
    gateway_enabled: true
    scope: internal
    status: active
    description: 因子计算服务，承载因子定义、绑定、补算与结果写回
    extra_config:
      health_url: http://127.0.0.1:11414/readyz
      health_kind: readiness
      monitor_enabled: true
      timeout_ms: 120000
      gateway_methods: [CreateFactor, UpdateFactor, GetFactor, ListFactors, SetFactorStatus, DeleteFactor, UpsertBinding, ListBindings, DeleteBinding, RecalcFactor, GetEngineStatus]
      gateway_callers: [admin-gateway, moox-cli]
  - name: moox_strategy
    kind: strategy
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11430
    gateway_path: trpc.moox.strategy.StrategyMgr
    gateway_service_id: strategymgr
    gateway_enabled: true
    scope: internal
    status: active
    description: 交易策略运行、目标和绩效查询服务
    extra_config:
      health_url: http://127.0.0.1:11431/readyz
      health_kind: readiness
      monitor_enabled: true
      gateway_methods: ["*"]
      gateway_callers: ["*"]
  - name: moox_archive
    kind: archive
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11416
    gateway_enabled: false
    scope: internal
    status: active
    description: 事件归档和物化服务
    extra_config:
      health_url: http://127.0.0.1:11416/readyz
      health_kind: readiness
      monitor_enabled: true
  - name: moox_hostagent
    kind: hostagent
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11426
    gateway_path: trpc.moox.hostagent.HostAgentMgr
    gateway_service_id: hostagent
    gateway_enabled: true
    scope: internal
    status: disabled
    description: 主机指标采集代理
    extra_config:
      health_url: http://127.0.0.1:11425/readyz
      health_kind: readiness
      monitor_enabled: true
      gateway_methods: ["*"]
      gateway_callers: ["*"]
  - name: moox_trade
    kind: trade
    deployment_mode: process
    protocol: http
    host: 127.0.0.1
    port: 11210
    gateway_enabled: false
    scope: internal
    status: active
    description: 量化交易执行服务
    extra_config:
      health_url: http://127.0.0.1:11210/readyz
      health_kind: readiness
      monitor_enabled: true

  # Logical RPC endpoints hosted by the Admin or Storage/Trade process.
  - name: admin_auth
    kind: admin_rpc
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11100
    gateway_path: trpc.moox.infra.Auth
    gateway_enabled: false
    scope: internal
    status: active
    description: 认证 RPC 服务
    extra_config: {}
  - name: dnsproxy
    kind: admin_rpc
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11101
    gateway_path: trpc.moox.infra.Dns
    gateway_enabled: false
    scope: internal
    status: active
    description: DNS 代理 RPC 服务
    extra_config: {}
  - name: ssh
    kind: admin_rpc
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11106
    gateway_path: trpc.moox.ops.Ssh
    gateway_enabled: false
    scope: internal
    status: active
    description: SSH 管理 RPC 服务
    extra_config: {}
  - name: space
    kind: admin_rpc
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11107
    gateway_path: trpc.moox.admin.SpaceMgr
    gateway_enabled: false
    scope: internal
    status: active
    description: 空间管理 RPC 服务
    extra_config: {}
  - name: secret
    kind: admin_rpc
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11108
    gateway_path: trpc.moox.ops.SecretMgr
    gateway_enabled: true
    gateway_service_id: secret
    scope: internal
    status: active
    description: 秘钥管理 RPC 服务
    extra_config:
      gateway_methods:
        - ListSecrets
        - GetSecretValue
      gateway_callers: [admin-gateway, cloudnode, moox-cli, trade]
  - name: sysdeploy
    kind: admin_rpc
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11109
    gateway_path: trpc.moox.ops.SysDeploy
    gateway_enabled: true
    gateway_service_id: sysdeploy
    scope: internal
    status: active
    description: 系统服务部署信息 RPC 服务
    extra_config:
      gateway_methods:
        - ListActiveServiceDeployments
        - ListServiceDeployments
      gateway_callers: [admin-gateway, collector, monitor, moox-cli]
  - name: trade_console
    kind: trade
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11200
    gateway_path: trpc.moox.trade.TradeConsoleService
    gateway_enabled: false
    scope: internal
    status: active
    description: 统一交易控制台与执行服务
    extra_config: {}
  - name: trade_dns_resolver
    kind: trade
    deployment_mode: endpoint
    protocol: http
    host: 127.0.0.1
    port: 11203
    gateway_path: trpc.moox.trade.TradeDNSResolverService
    gateway_enabled: true
    gateway_service_id: trade_dns_resolver
    scope: internal
    status: active
    description: 交易节点 DNS 解析与连通性探测服务
    extra_config:
      gateway_methods: [ResolveDomains]
      gateway_callers: [collector]
