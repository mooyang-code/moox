version: 2
realtime_timeseries:
  defaults:
    run_missed_intervals: 2
    success_missed_intervals: 3
    watermark_periods: 3
    minimum_watermark_lag: 10m
  overrides:
    - space_id: crypto
      dataset_id: market_kline
      freq: 1m
      canary_subject_id: BTC-USDT
      watermark_lag: 5m
      market_price_change_ratio: 0.05
      market_volume_ratio: 5
