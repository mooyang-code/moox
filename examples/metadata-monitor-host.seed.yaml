# Logical metadata for the global host-resource history written by Monitor.
# This file is non-sensitive and is safe to ship in release archives.
spaces:
  - space_id: moox_system
    name: MooX System
    description: MooX internal platform data
    owner: moox
    status: active
    attributes:
      scope: internal
      owner_module: monitor
      managed_by: moox-cli

data_sources:
  - space_id: moox_system
    data_source_id: moox_host_agent
    name: MooX Host Agent
    kind: internal
    timezone: UTC
    status: active

datasets:
  - {space_id: moox_system, dataset_id: host_resource_v1, data_source_id: moox_host_agent, name: Host CPU and memory, description: Per-minute host CPU and memory snapshots, data_kind: time_series, freqs: ["1m"], status: active}
  - {space_id: moox_system, dataset_id: host_fs_v1, data_source_id: moox_host_agent, name: Host filesystems, description: Per-minute filesystem snapshots, data_kind: time_series, freqs: ["1m"], status: active}
  - {space_id: moox_system, dataset_id: host_disk_v1, data_source_id: moox_host_agent, name: Host disks, description: Per-minute disk counters and rates, data_kind: time_series, freqs: ["1m"], status: active}
  - {space_id: moox_system, dataset_id: host_net_v1, data_source_id: moox_host_agent, name: Host networks, description: Per-minute network counters and rates, data_kind: time_series, freqs: ["1m"], status: active}

fields:
  - {space_id: moox_system, field_id: host_agent_id, name: Host agent ID, value_type: string, status: active}
  - {space_id: moox_system, field_id: host_logical_cores, name: Logical CPU cores, value_type: int, status: active}
  - {space_id: moox_system, field_id: host_cpu_usage_percent, name: CPU usage percent, value_type: double, status: active}
