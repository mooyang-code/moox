  - {space_id: moox_system, field_id: host_memory_available_bytes, name: Memory available bytes, value_type: int, status: active}
  - {space_id: moox_system, field_id: host_memory_usage_percent, name: Memory usage percent, value_type: double, status: active}
  - {space_id: moox_system, field_id: host_device, name: Device, value_type: string, status: active}
  - {space_id: moox_system, field_id: host_mountpoint, name: Mountpoint, value_type: string, status: active}
