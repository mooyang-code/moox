# 时序因子示例（表达式写法，语法见 docs/模块/因子.md）。一个文件可以包含多个因子：
# factor_id 是全局唯一的标识（小写，词与词之间用单个下划线），name 是展示名，category_id/category_name 是分类（可选），spec 是定义。
# params 声明可调参数：取值类型、范围与默认值。策略每期可以在范围内调整参数（因子动态调参），
# 回看按范围的最坏情况推导。
# 只有一个输出的因子写 output（没有输出名，结果列就是成员键）；有多个输出的因子写 outputs，输出名不带因子前缀。
- factor_id: bias
  name: Bias
  category_id: momentum
  category_name: 动量类
  spec: |
    params:
      window: {type: int, min: 2, max: 120, default: 20}
    output: close / ts_mean(close, window) - 1

- factor_id: cci
  name: CCI
  category_id: momentum
  category_name: 动量类
  spec: |
    params:
      window: {type: int, min: 2, max: 120, default: 20}
    let:
      tp: (high + low + close) / 3
      m: ts_mean(tp, window)
    output: (tp - m) / (0.015 * ts_mean(abs(tp - m), window))

# 需要两条各自调参的均线（快线、慢线）时，注册两个因子，各自在策略里作为可变成员。
- factor_id: ma_fast
  name: 快速均线
  category_id: trend
  category_name: 趋势类
  spec: |
    params:
      window: {type: int, min: 2, max: 60, default: 5}
    output: ts_mean(close, window)

- factor_id: ma_slow
  name: 慢速均线
  category_id: trend
  category_name: 趋势类
  spec: |
    params:
      window: {type: int, min: 10, max: 240, default: 30}
    output: ts_mean(close, window)

# 多输出因子：几个输出共用同一组参数和同一份中间计算。
- factor_id: channel
  name: 价格通道
  category_id: volatility
  category_name: 波动类
  spec: |
    params:
      window: {type: int, min: 2, max: 120, default: 20}
    outputs:
      high: ts_max(high, window)
      low: ts_min(low, window)
