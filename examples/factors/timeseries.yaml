# 时序因子示例（表达式写法，语法见 docs/模块/因子.md）。一个文件可以包含多个因子：
# factor_id 是全局唯一的标识，name 是展示名，category_id/category_name 是分类（可选），spec 是定义。
# params 声明可调参数：取值类型、范围与默认值。策略每期可以在范围内调整参数（因子动态调参），
# 回看按范围的最坏情况推导；输出列名固定，不随参数变化。
- factor_id: Bias
  name: Bias
  category_id: momentum
  category_name: 动量类
  spec: |
    params:
      window: {type: int, min: 2, max: 120, default: 20}
    outputs:
      bias: close / ts_mean(close, window) - 1

- factor_id: Cci
  name: CCI
  category_id: momentum
  category_name: 动量类
  spec: |
    params:
      window: {type: int, min: 2, max: 120, default: 20}
    let:
      tp: (high + low + close) / 3
      m: ts_mean(tp, window)
    outputs:
      cci: (tp - m) / (0.015 * ts_mean(abs(tp - m), window))

# 同一个定义可以用不同的成员别名加入因子集多次（例如 ma_fast、ma_slow），各自调参，结果列为“别名_输出名”。
- factor_id: ma
  name: 移动平均
  category_id: trend
  category_name: 趋势类
  spec: |
    params:
      window: {type: int, min: 2, max: 120, default: 20}
    outputs:
      ma: ts_mean(close, window)

# 递推平滑移动平均 SMA(close, n, m)：alpha = m / n。递推算子按收敛精度截断回看，SMA(20, 1) 回看 405 期。
- factor_id: sma
  name: SMA
  category_id: trend
  category_name: 趋势类
  spec: |
    params:
      n: {type: int, min: 5, max: 20, default: 20}
    outputs:
      sma: sma(close, n, 1)

# 显式截断的长周期 EMA：ema(x, n, k) 只用最近 k 根（k = n = 50000 时起点权重约 13%，是近似值），
# 回看恰为 50000 根，用来观察单期 5 万根计算的耗时；需要数据源的回看数量 N ≥ 50000（引擎 window.lookback）。
- factor_id: Ema50000
  name: EMA(50000)
  category_id: trend
  category_name: 趋势类
  spec: |
    outputs:
      ema50000: ema(close, 50000, 50000)

# EMA20 用 5 万根预热：ema(x, n, k) 的 k 是预热总根数（含起点），窗口里最老的一根收盘价作为递推初值，
# 结果与「从 5 万根之前开始、按 α=2/21 逐根递推」一致。共享因子集的成员只用默认参数，所以把预热根数写死在表达式里；
# 需要数据源的回看数量 N ≥ 50000（引擎 window.lookback）。
- factor_id: Ema20Warmup50000
  name: EMA20（5 万根预热）
  category_id: trend
  category_name: 趋势类
  spec: |
    outputs:
      ema20_warmup50000: ema(close, 20, 50000)
