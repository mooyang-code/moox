              - RemoveLogicalAccountMember
              - PauseLogicalAccount
              - ResumeLogicalAccount
              - FlattenLogicalAccount
              - PlaceManualOrder
              - SubmitOrder
              - CancelOrder
              - GetOperatorAction
              - GetLogicalAccountTarget
              - GetOrder
              - ListOrders
              - ListFills
              - ListPositions
              - CreatePaperSimulation
              - ClosePaperSimulation
              - GetExecutionCapabilities
              - ListTradableInstruments
              - QueryEquityCurve
              - ListHoldings
              - ListAccountLedger
              - FlattenTradingAccount
              - SummarizeAccountPnl
              - ListOperatorActions
            callers:
              - console
              - moox-cli
          - methods:
              - ListBlockedInstruments
              - ListInstrumentHolders
            callers:
              - console
              - moox-cli
              - callback-dispatcher
          - methods:
              - UnblockInstrument
            callers:
              - console
          - methods:
              - BlockInstrument
              - UnblockInstrument
              - FlattenInstrument
              - GetOperatorAction
            callers:
              - callback-dispatcher
          - methods:
              - ClaimLogicalAccountOwner
              - ReleaseLogicalAccountOwner
            callers:
              - moox-cli
          - methods:
              - GetLogicalAccount
              - ClaimLogicalAccountOwner
              - ReleaseLogicalAccountOwner
            callers:
              - strategy
    doctor:
      role: trade
      description: Trade execution and reconciliation service
      duties:
        - execute orders and reconcile state
      inputs:
        - target positions
      outputs:
        - orders and reconciliations
      dependencies:
        - eventbus
        - admin
      transport: reporter
      functional_observability: active
      config_paths:
        - trade/config/app.yaml
        - trade/config/trpc_go.yaml
      writable_paths:
        - data/trade
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  # 事件中心：接收 EventBus 事件，按用户配置的规则向用户接口发通知或执行系统动作。全局服务，不分空间。
  - id: callback-dispatcher
    name: 事件中心
    binary: moox-callback-dispatcher
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11461
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.callbackdispatcher.CallbackDispatcherService
        port: 11460
        console_name: callback-dispatcher
        # 测试发送要等对方最多 10 秒。
        timeout_ms: 15000
        max_body_bytes: 1048576
        methods:
          - ListSubscribableEvents
          - ListEventRules
          - GetEventRule
          - CreateEventRule
          - UpdateEventRule
          - DeleteEventRule
          - TestEventRule
          - ListEventExecutions
          - GetEventExecution
          - RetryEventExecution
          - CancelEventExecution
          - AcknowledgeEventExecution
        read_only_methods:
          - ListSubscribableEvents
          - ListEventRules
          - GetEventRule
          - ListEventExecutions
          - GetEventExecution
        acl:
          # CreateEventRule 的返回里有验证密钥明文：只放行 console，moox-cli 与 gateway call 都不能调用。
          - methods:
              - CreateEventRule
            callers:
              - console
          - methods:
              - ListSubscribableEvents
              - ListEventRules
              - GetEventRule
              - UpdateEventRule
              - DeleteEventRule
              - TestEventRule
              - ListEventExecutions
              - GetEventExecution
              - RetryEventExecution
              - CancelEventExecution
              - AcknowledgeEventExecution
            callers:
              - console
              - moox-cli
    doctor:
      role: callback-dispatcher
      description: 事件中心：按规则把 EventBus 事件通知到用户接口或执行系统动作
      duties:
        - 消费可订阅事件并按规则匹配
        - 投递通知并重试，记录每次执行
      inputs:
        - EventBus 事件
        - 用户配置的事件规则
      outputs:
        - 通知请求与执行记录
        - 事件中心关注项
      dependencies:
        - eventbus
      transport: reporter
      functional_observability: active
      config_paths:
        - callback-dispatcher/config/app.yaml
        - callback-dispatcher/config/trpc_go.yaml
      writable_paths:
        - data/callback-dispatcher
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  # 外部程序：运行在登记主机上（通常是只能出站的因子机），以同名外部身份经 Access 访问系统，不经主机网关路由；
  # 由 systemd 用户服务托管，部署健康由 Monitor 经中转探测本机健康端口。
  - id: factor-engine
    name: 因子引擎
    binary: moox-factor-engine
    scope: any
    replicas: single
    protected: false
    external_program: true
    health:
      kind: readyz
      port: 11417
      ready_body: '"ready":true'
    doctor:
      role: factor-engine
      description: Factor compute engine that consumes period events and writes factor results through Access
      duties:
        - compute factor periods and recalculation jobs
      inputs:
        - period completion events and source windows
      outputs:
        - factor result rows and period markers
      dependencies:
        - factor-mgr
        - access
      transport: health_only
      functional_observability: deferred
      config_paths:
        - factor-engine/config/engine.yaml
      writable_paths:
        - factor-engine/data
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
      supervisor: systemd_user
      unit: moox-factor-engine
  - id: archive-worker
    name: 数据归档执行器
    binary: moox-archive-worker
    scope: any
    replicas: single
    protected: false
    external_program: true
    health:
      kind: readyz
      port: 11418
      ready_body: '"ready":true'
    # 数据端口只听 127.0.0.1：分区副本下载与最新数据预览，只给控制台经 Admin 使用（只出站主机上经 control 中转）。
    relay_http:
      port: 11428
      callers:
        - console
    doctor:
      role: archive-worker
      description: Archive worker that pulls archive runs and exports partitions
      duties:
        - export archive partitions
      inputs:
        - archive runs from archive-mgr
      outputs:
        - archive partitions
      dependencies:
        - archive-mgr
        - access
      transport: health_only
      functional_observability: deferred
      config_paths:
        - archive-worker/config/app.yaml
      writable_paths:
        - archive-worker/data
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
      supervisor: systemd_user
      unit: moox-archive-worker
principals:
  - id: scf-collector
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - CommitTimeSeriesBatch
          - UpsertFields
  - id: factor-engine
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - ReadTimeSeriesRows
          - ReadDatasetChanges
          - UpsertFields
          - ReportDatasetPeriodCompleted
          - GetDatasetPeriodCompleted
      - service: trpc.moox.storage.Metadata
        methods:
          - GetDataset
          - ListDatasetColumns
          - ListDatasetSubjects
      - service: trpc.moox.factor.FactorEngine
        methods:
          - SyncEngineCatalog
          - EngineHeartbeat
          - PullRecalcJob
          - ReportRecalcProgress
          - GetTaskParams
          - GetUdfModule
  - id: archive-worker
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - ReadTimeSeriesRows
      - service: trpc.moox.storage.Metadata
        methods:
          - GetDataset
          - ListDatasetColumns
      - service: trpc.moox.archive.ArchiveWorker
        methods:
          - ArchiveWorkerHeartbeat
          - PullArchiveRun
          - ReportArchiveRunProgress
          - CompleteArchiveRun
  # 采集名单干预的旁路程序（不在部署拓扑里）：只放行排除名单三个方法与 SyncSubjects。
  - id: collector-operator
    allow:
      - service: trpc.moox.collector.CollectMgr
        methods:
          - SetSubjectExclusions
          - ClearSubjectExclusions
          - ListSubjectExclusions
          - SyncSubjects
  - id: moox-skill
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - ReadTimeSeriesRows
