# 组件、公开 RPC、ACL 与 Doctor 的共同事实源；不包含地址或凭据。
version: 1
components:
  - id: host-gateway
    name: 主机网关
    binary: moox-host-gateway
    scope: host
    replicas: single
    protected: true
    ports:
      - 11002
      - 11003
    health:
      kind: readyz
      port: 11012
      ready_body: '"ready":true'
    doctor:
      role: host-gateway
      description: 按主机提供签名校验与本机 tRPC 转发
      duties:
        - 同步路由、服务目录与校验密钥
        - 校验签名和 ACL 并仅转发本机服务
      inputs:
        - 签名 tRPC 请求
        - GatewayControl 快照
      outputs:
        - 本机服务响应
        - 服务目录与同步状态
      dependencies: []
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - host-gateway/config/app.yaml
        - host-gateway/config/trpc_go.yaml
      writable_paths:
        - data/host-gateway
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: host-agent
    name: 主机采集器
    binary: moox-host-agent
    scope: host
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11425
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.hostagent.HostAgentMgr
        port: 11426
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - GetStatus
          - GetSnapshot
          - RunOnce
        read_only_methods:
          - GetStatus
          - GetSnapshot
        acl:
          - methods:
              - GetStatus
              - GetSnapshot
              - RunOnce
            callers:
              - monitor
              - moox-cli
    doctor:
      role: host-agent
      description: Host resource snapshot agent
      duties:
        - collect bounded host resource snapshots
      inputs:
        - host operating system facts
      outputs:
        - host snapshots
      dependencies:
        - eventbus
      transport: host_snapshot
      functional_observability: not_applicable
      config_paths:
        - host-agent/config/trpc_go.yaml
      writable_paths:
        - data/hostagent
      recovery_action_ids:
        - free_disk_space
        - restart_service_manually
      required_in_default_profile: false
  - id: console-proxy
    name: 控制台代理
    binary: moox-console-proxy
    scope: control
    replicas: single
    protected: true
    ports:
      - 9527
    health:
      kind: readyz
      port: 19528
      loopback: true
      ready_body: '"ready":true'
    doctor:
      role: console-proxy
      description: 内嵌 Caddy 的控制台 HTTPS 代理
      duties:
        - 终止浏览器 TLS 并转发控制台与静态资源请求
        - 保留 CA 与续期状态并排空完整流式请求
      inputs:
        - HTTPS 浏览器请求
        - Caddy 证书与 ACME 状态
      outputs:
        - Admin 与 web-host 响应
        - 内部鉴权诊断
      dependencies:
        - admin
        - web-host
      transport: health_only
      functional_observability: not_applicable
      config_paths:
        - console-proxy/config/app.yaml
      writable_paths:
        - data/caddy
        - certs/caddy
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: web-host
    name: 控制台前端
    binary: moox-web-host
    scope: control
    replicas: single
    protected: true
    ports:
      - 9528
    health:
      kind: readyz
      port: 19527
      loopback: true
      ready_body: '"ready":true'
    doctor:
      role: web-host
      description: Embedded MooX administration web host
      duties:
        - serve static administration assets
      inputs:
        - HTTP requests
      outputs:
        - web assets
      dependencies: []
      transport: health_only
      functional_observability: not_applicable
      config_paths: []
      writable_paths:
        - data/web-host
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: admin
    name: 管理后台
    binary: moox-admin
    scope: control
    replicas: single
    protected: true
    ports:
      - 11000
    health:
      kind: readyz
      port: 11010
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.infra.Auth
        port: 11100
        console_name: auth
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - GetLoginSalt
          - Login
          - Logout
          - IssueRawSessionTicket
          - GetUserInfo
          - UpdateUserInfo
        read_only_methods:
          - GetLoginSalt
          - GetUserInfo
        acl:
          - methods:
              - GetLoginSalt
              - Login
              - Logout
              - IssueRawSessionTicket
              - GetUserInfo
              - UpdateUserInfo
            callers:
              - console
      - path: trpc.moox.ops.Ssh
        port: 11106
        console_name: ssh
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - ListHosts
          - CreateHost
          - UpdateHost
          - DeleteHost
          - GetHost
          - CreateSession
          - DisconnectSession
          - ResizeWindow
          - SftpList
          - SftpMkdir
          - SftpDelete
        read_only_methods:
          - ListHosts
          - GetHost
        acl:
          - methods:
              - ListHosts
              - CreateHost
              - UpdateHost
              - DeleteHost
              - GetHost
              - CreateSession
              - DisconnectSession
              - ResizeWindow
              - SftpList
              - SftpMkdir
              - SftpDelete
            callers:
              - console
              - moox-cli
      - path: trpc.moox.admin.SpaceMgr
        port: 11107
        console_name: space
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - CreateSpace
          - UpdateSpace
          - DeleteSpace
          - ListSpaces
          - ListSpaceMembers
        read_only_methods:
          - ListSpaces
          - ListSpaceMembers
        acl:
          - methods:
              - CreateSpace
              - UpdateSpace
              - DeleteSpace
              - ListSpaces
              - ListSpaceMembers
            callers:
              - console
              - moox-cli
          - methods:
              - ListSpaces
            callers:
              - collector
      - path: trpc.moox.ops.SecretMgr
        port: 11108
        console_name: secret
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - ListSecrets
          - GetSecret
          - GetSecretValue
          - CreateSecret
          - UpdateSecret
          - DeleteSecret
          - ToggleSecretStatus
          - ExportSecrets
          - ImportSecrets
        read_only_methods:
          - ListSecrets
          - GetSecret
          - GetSecretValue
        acl:
          - methods:
              - ListSecrets
              - GetSecret
              - CreateSecret
              - UpdateSecret
              - DeleteSecret
              - ToggleSecretStatus
            callers:
              - console
              - moox-cli
          - methods:
              - ExportSecrets
              - ImportSecrets
            callers:
              - console
          - methods:
              - ListSecrets
              - GetSecretValue
            callers:
              - cloudfunction
              - trade
              - moox-cli
      - path: trpc.moox.ops.SysDeploy
        port: 11109
        console_name: sysdeploy
        timeout_ms: 5000
        # EventBus 维护由 Admin 代为连接 EventBus：连接最多等 15 秒，繁忙的流上清除、删除消费者单次最多 2 分钟，
        # 服务端（Admin 的 trpc_go.yaml）的超时要不小于这里。
        method_timeouts_ms:
          InspectEventBus: 60000
          DeleteEventBusConsumers: 180000
          PurgeEventBusSubjects: 300000
        max_body_bytes: 4194304
        methods:
          - GetCatalog
          - ListHosts
          - ListDeployments
          - GetHostRoutes
          - GetDirectory
          - SetHostStatus
          - SetDeploymentStatus
          - SyncHostDeployments
          - DeleteHost
          - InspectEventBus
          - DeleteEventBusConsumers
          - PurgeEventBusSubjects
        read_only_methods:
          - GetCatalog
          - ListHosts
          - ListDeployments
          - GetHostRoutes
          - GetDirectory
          - InspectEventBus
        acl:
          - methods:
              - GetCatalog
              - ListHosts
              - ListDeployments
              - GetHostRoutes
              - GetDirectory
            callers:
              - console
              - moox-cli
          - methods:
              - SetHostStatus
              - SetDeploymentStatus
              - SyncHostDeployments
              - DeleteHost
            callers:
              - moox-cli
          - methods:
              - GetCatalog
              - ListHosts
              - ListDeployments
              - GetHostRoutes
            callers:
              - monitor
          - methods:
              - InspectEventBus
              - DeleteEventBusConsumers
              - PurgeEventBusSubjects
            callers:
              - storage-view
      - path: trpc.moox.admin.Setup
        port: 11110
        console_name: setup
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - ApplySetup
          - GetSetupStatus
          - PutConfigBackup
          - GetConfigBackup
        read_only_methods:
          - GetSetupStatus
          - GetConfigBackup
        acl:
          - methods:
              - ApplySetup
              - GetSetupStatus
            callers:
              - console
              - moox-cli
          - methods:
              - PutConfigBackup
              - GetConfigBackup
            callers:
              - console
      - path: trpc.moox.admin.CollectorPublishLease
        port: 11111
        console_name: publishlease
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - AcquireCollectorPublishLease
          - RenewCollectorPublishLease
          - ReleaseCollectorPublishLease
          - ValidateCollectorPublishLease
          - BeginCollectorPublishOperation
          - RenewCollectorPublishOperation
          - EndCollectorPublishOperation
        acl:
          - methods:
              - AcquireCollectorPublishLease
              - RenewCollectorPublishLease
              - ReleaseCollectorPublishLease
            callers:
              - console
              - moox-cli
              - collector
              - cloudfunction
          - methods:
              - ValidateCollectorPublishLease
              - BeginCollectorPublishOperation
              - RenewCollectorPublishOperation
              - EndCollectorPublishOperation
            callers:
              - admin
              - cloudfunction
      - path: trpc.moox.admin.ActivityLog
        port: 11113
        console_name: activity
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - AppendActivityLogs
          - ListActivityLogs
        read_only_methods:
          - ListActivityLogs
        acl:
          - methods:
              - AppendActivityLogs
            callers:
              - collector
          - methods:
              - ListActivityLogs
            callers:
              - console
              - moox-cli
      - path: trpc.moox.admin.GatewayControl
        port: 11112
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - PullSnapshot
          - ReportStatus
        acl:
          - methods:
              - PullSnapshot
              - ReportStatus
            callers:
              - host-gateway@*
    doctor:
      role: admin
      description: 认证、空间、密钥、部署与网关控制面
      duties:
        - 提供浏览器控制台与 Admin RPC
        - 管理主机、部署、调用方密钥与路由快照
      inputs:
        - 用户会话与控制台请求
        - CLI 部署登记与网关心跳
      outputs:
        - 管理数据
        - 按主机编译的路由、目录与校验密钥
      dependencies:
        - eventbus
      transport: reporter
      functional_observability: active
      config_paths:
        - admin/config/app.yaml
        - admin/config/trpc_go.yaml
      writable_paths:
        - data/admin
        - secrets/pki
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: eventbus
    name: 消息总线
    binary: moox-eventbus
    scope: any
    replicas: single
    protected: false
    ports:
      - 4222
    health:
      kind: readyz
      port: 11419
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.eventbus.EventBusMgr
        port: 11420
        console_name: eventbus
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - GetOverview
          - ListEvents
          - ListStreams
          - ListConsumers
          - GetConsumer
        read_only_methods:
          - GetOverview
          - ListEvents
          - ListStreams
          - ListConsumers
          - GetConsumer
        acl:
          - methods:
              - GetOverview
              - ListEvents
              - ListStreams
              - ListConsumers
              - GetConsumer
            callers:
              - console
              - moox-cli
    doctor:
      role: eventbus
      description: NATS JetStream event transport
      duties:
        - transport metrics and business events
      inputs:
        - published events
      outputs:
        - durable subscriptions
      dependencies: []
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - eventbus/config/app.yaml
        - eventbus/config/trpc_go.yaml
      writable_paths:
        - data/eventbus
      recovery_action_ids:
        - verify_eventbus_credentials
        - restart_service_manually
      required_in_default_profile: true
  - id: monitor
    name: 监控服务
    binary: moox-monitor
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11409
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.monitor.MonitorMgr
        port: 11410
        console_name: monitor
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - GetHealthOverview
          - ListNotificationChannels
          - AddNotificationChannel
          - DeleteNotificationChannel
          - ListHostAgents
          - QueryHostMetricHistory
          - QueryPipelineArrivalHistory
          - GetDoctorContext
          - GetHostPolicy
        read_only_methods:
          - GetHealthOverview
          - ListNotificationChannels
          - ListHostAgents
          - QueryHostMetricHistory
          - QueryPipelineArrivalHistory
          - GetDoctorContext
          - GetHostPolicy
        acl:
          - methods:
              - GetHealthOverview
              - ListNotificationChannels
              - AddNotificationChannel
              - DeleteNotificationChannel
              - ListHostAgents
              - QueryHostMetricHistory
              - QueryPipelineArrivalHistory
              - GetDoctorContext
            callers:
              - console
              - moox-cli
          - methods:
              - GetHostPolicy
            callers:
              - host-agent
    doctor:
      role: monitor
      description: Single-instance monitoring fact store and alert evaluator
      duties:
        - ingest monitoring facts
        - evaluate alerts
        - serve bounded context
      inputs:
        - metrics and host snapshots
      outputs:
        - monitoring observations
      dependencies:
        - eventbus
      transport: reporter
      functional_observability: active
      config_paths:
        - monitor/config/app.yaml
        - monitor/config/trpc_go.yaml
      writable_paths:
        - data/monitor
      recovery_action_ids:
        - verify_eventbus_credentials
        - restart_service_manually
      required_in_default_profile: true
  - id: collector
    name: 行情采集服务
    binary: moox-collector
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11412
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.collector.CollectMgr
        port: 11402
        console_name: collector
        timeout_ms: 5000
        # SyncSubjects 在服务端最多等 170 秒（交易所标的清单约 17MB），路由预算要大于它。
        method_timeouts_ms:
          SyncSubjects: 180000
          CheckKline: 310000
          SubmitKlineBackfill: 310000
        max_body_bytes: 4194304
        methods:
          - GetTaskList
          - GetTaskDetail
          - GetTaskResultInventory
          - CreateTask
          - UpdateTask
          - DisableTask
          - DeleteTask
          - GetDataTypeConfigs
          - GetDataTypeConfigWithFields
          - SubmitKlineResampleJob
          - GetKlineResampleJob
          - ListKlineResampleJobs
          - CancelKlineResampleJob
          - PreviewKlineResampleSource
          - SyncSubjects
          - CheckKline
          - SubmitKlineBackfill
          - GetKlineBackfill
          - ListKlineBackfills
          - CancelKlineBackfill
          - RetryKlineBackfill
          - ConfirmHistoryGaps
          - ClearSourceAbsences
          - GetCollectorStatus
          - ReregisterFetchPlan
          - SetFetchPlanPaused
          - GetIngestMode
          - SetIngestMode
          - SetSubjectExclusions
          - ClearSubjectExclusions
          - ListSubjectExclusions
        read_only_methods:
          - GetTaskList
          - GetTaskDetail
          - GetTaskResultInventory
          - GetDataTypeConfigs
          - GetDataTypeConfigWithFields
          - GetKlineResampleJob
          - ListKlineResampleJobs
          - PreviewKlineResampleSource
          - CheckKline
          - GetKlineBackfill
          - ListKlineBackfills
          - GetCollectorStatus
          - GetIngestMode
          - ListSubjectExclusions
        acl:
          - methods:
              - GetTaskList
              - GetTaskDetail
              - GetTaskResultInventory
              - CreateTask
              - UpdateTask
              - DisableTask
              - DeleteTask
              - GetDataTypeConfigs
              - GetDataTypeConfigWithFields
              - SubmitKlineResampleJob
              - GetKlineResampleJob
              - ListKlineResampleJobs
              - CancelKlineResampleJob
              - PreviewKlineResampleSource
              - CheckKline
              - SubmitKlineBackfill
              - GetKlineBackfill
              - ListKlineBackfills
              - CancelKlineBackfill
              - RetryKlineBackfill
              - ConfirmHistoryGaps
              - ClearSourceAbsences
              - GetCollectorStatus
              - GetIngestMode
            callers:
              - console
              - moox-cli
          - methods:
              - SyncSubjects
              - ReregisterFetchPlan
              - SetFetchPlanPaused
              - SetIngestMode
            callers:
              - moox-cli
          # 采集名单干预：控制台、moox-cli；旁路程序经 Access 用外部身份 collector-operator 调用（见 principals）。
          - methods:
              - SetSubjectExclusions
              - ClearSubjectExclusions
              - ListSubjectExclusions
            callers:
              - console
              - moox-cli
          - methods:
              - GetTaskResultInventory
            callers:
              - monitor
      # collector-stream 的心跳、拉计划与周期统计上报；不设租约，计划里的份就是唯一的授权。
      - path: trpc.moox.collector.StreamCollector
        port: 11422
        timeout_ms: 10000
        max_body_bytes: 4194304
        methods:
          - StreamHeartbeat
          - PullStreamPlan
          - ReportStreamPeriods
        read_only_methods:
          - PullStreamPlan
        acl:
          - methods:
              - StreamHeartbeat
              - PullStreamPlan
              - ReportStreamPeriods
            callers:
              - collector-stream
    doctor:
      role: collector
      description: Market data collection planner and executor
      duties:
        - plan and execute collection tasks
        - 同步标的标签与属性
      inputs:
        - collector rules and market windows
      outputs:
        - committed collection tasks
      dependencies:
        - eventbus
        - storage-primary
        - cloudfunction
      transport: reporter
      functional_observability: active
      config_paths:
        - collector/config/app.yaml
        - collector/config/trpc_go.yaml
      writable_paths:
        - data/collector
      recovery_action_ids:
        - inspect_health_check_input
        - restart_service_manually
      required_in_default_profile: true
  - id: collector-stream
    name: 行情推送采集
    binary: moox-collector-stream
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11451
      ready_body: '"ready":true'
    services:
      # 拉取与补采的本地执行端，处理代码与 SCF 函数相同；补采分块单次调用最长 90 秒。
      - path: trpc.moox.collector.MarketFetchExecutor
        port: 11450
        timeout_ms: 95000
        max_body_bytes: 4194304
        methods:
          - Invoke
        acl:
          - methods:
              - Invoke
            callers:
              - collector
    doctor:
      role: collector-stream
      description: 常驻接收交易所 WebSocket 收盘 K 线并按周期提交 Storage，同进程提供本地执行端
      duties:
        - 按采集计划订阅推送并在截止前提交周期
        - 执行补采与本地定时拉取
      inputs:
        - 交易所 WebSocket 收盘推送
        - Collector 下发的推送与本地执行端计划
      outputs:
        - Storage 周期提交与补采写入
        - 心跳与周期统计
      dependencies:
        - collector
        - storage-primary
      transport: reporter
      functional_observability: active
      config_paths:
        - collector-stream/config/app.yaml
        - collector-stream/config/trpc_go.yaml
      writable_paths:
        - data/collector-stream
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  - id: cloudfunction
    name: 云函数管理服务
    binary: moox-cloudfunction
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11411
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.cloudfunction.CloudFunctionMgr
        port: 11401
        console_name: cloudfunction
        timeout_ms: 960000
        max_body_bytes: 33554432
        methods:
          - ListFunctionInstances
          - InvokeFunction
          - SubmitCreateFunctionInstances
          - SubmitDeployFunctionInstances
          - SubmitDeleteFunctionInstances
          - GetFunctionJob
          - SubmitUpdateFunctionInstanceRuntimeConfigs
          - ListCloudAccounts
          - CreateCloudAccount
          - UpdateCloudAccount
          - DeleteCloudAccount
          - ListCloudRegions
          - PreviewSCFFunctions
          - ImportSCFFunctions
          - GetPackageList
          - GetPackageDetail
          - DeletePackage
          - GetPackageDownloadURL
          - InitPackageUpload
          - CompletePackageUpload
          - CollectGarbage
        read_only_methods:
          - ListFunctionInstances
          - GetFunctionJob
          - ListCloudAccounts
          - ListCloudRegions
          - PreviewSCFFunctions
          - GetPackageList
          - GetPackageDetail
          - GetPackageDownloadURL
        acl:
          - methods:
              - ListFunctionInstances
              - InvokeFunction
              - SubmitCreateFunctionInstances
              - SubmitDeployFunctionInstances
              - SubmitDeleteFunctionInstances
              - GetFunctionJob
              - SubmitUpdateFunctionInstanceRuntimeConfigs
              - ListCloudAccounts
              - CreateCloudAccount
              - UpdateCloudAccount
              - DeleteCloudAccount
              - ListCloudRegions
              - PreviewSCFFunctions
              - ImportSCFFunctions
              - GetPackageList
              - GetPackageDetail
              - DeletePackage
              - GetPackageDownloadURL
              - InitPackageUpload
              - CompletePackageUpload
            callers:
              - console
              - moox-cli
          - methods:
              - ListFunctionInstances
              - InvokeFunction
              - SubmitCreateFunctionInstances
              - SubmitDeployFunctionInstances
              - SubmitDeleteFunctionInstances
              - GetFunctionJob
              - SubmitUpdateFunctionInstanceRuntimeConfigs
              - GetPackageList
            callers:
              - collector
          - methods:
              - CollectGarbage
            callers:
              - admin
    doctor:
      role: cloudfunction
      description: Cloud job dispatch and execution coordinator
      duties:
        - dispatch and track cloud jobs
      inputs:
        - job items
      outputs:
        - job results
      dependencies:
        - eventbus
        - admin
      transport: reporter
      functional_observability: active
      config_paths:
        - cloudfunction/config/app.yaml
        - cloudfunction/config/trpc_go.yaml
      writable_paths:
        - data/cloudfunction
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: factor-mgr
    name: 因子管理服务
    binary: moox-factor-mgr
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11414
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.factor.FactorMgr
        port: 11403
        console_name: factor-mgr
        timeout_ms: 120000
        max_body_bytes: 4194304
        methods:
          - CreateFactorSet
          - UpdateFactorSet
          - SetFactorSetStatus
          - DeleteFactorSet
