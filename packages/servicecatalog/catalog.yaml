# 组件、公开 RPC 与调用权限、Doctor 的共同事实源；不包含地址或凭据。
# 每个方法只写一遍：callers 是能调它的机器身份（组件 ID、identities 里的外部身份；host-gateway 指每台主机的网关），
# 省略表示没有机器能调；operators 收窄人操作的 console 与 moox-cli，省略表示两者都能调，写 [] 表示都不能调。
version: 2
identities:
  - id: scf-collector
    external: true
components:
  - id: host-gateway
    name: 主机网关
    binary: moox-host-gateway
    scope: host
    replicas: single
    protected: true
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    tools: [moox-host-gateway-cli]
    config_files:
      - from: modules/hostgateway/config/trpc_go.yaml
    after: [admin]
    ports:
      - 11002
      - 11003
      - 11004
    health:
      port: 11012
    doctor:
      transport: reporter
      functional_observability: not_applicable
  - id: host-agent
    name: 主机采集器
    binary: moox-host-agent
    scope: host
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/hostagent/config/app.yaml
      - from: modules/hostagent/config/trpc_go.yaml
    after: [host-gateway]
    health:
      port: 11425
    services:
      - path: trpc.moox.hostagent.HostAgentMgr
        port: 11426
        timeout_ms: 30000
        max_body_bytes: 4194304
        methods:
          - name: GetStatus
            read_only: true
            operators: [moox-cli]
          - name: RunOnce
            operators: [moox-cli]
    doctor:
      transport: host_snapshot
      functional_observability: not_applicable
  - id: admin
    name: 管理后台
    binary: moox-admin
    scope: control
    replicas: single
    protected: true
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    tools: [moox-admin-cli]
    config_files:
      - from: modules/admin/config/app.yaml
      - from: modules/admin/config/trpc_go.yaml
    after: [eventbus]
    credentials: [cls]
    # 9527 是浏览器入口（HTTPS、静态页面与根证书下载），由 Admin 自己监听。
    ports:
      - 9527
    health:
      port: 11010
    services:
      - path: trpc.moox.infra.Auth
        port: 0
        console_name: auth
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: Login
            operators: [console]
          - name: Logout
            operators: [console]
          - name: GetUserInfo
            read_only: true
            operators: [console]
      - path: trpc.moox.ops.Ssh
        port: 0
        console_name: ssh
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: CreateSession
            operators: [console]
          - name: DisconnectSession
            operators: [console]
          - name: ResizeWindow
            operators: [console]
          - name: SftpList
            operators: [console]
          - name: SftpMkdir
            operators: [console]
          - name: SftpDelete
            operators: [console]
      - path: trpc.moox.ops.SecretMgr
        port: 11108
        console_name: secret
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: ListSecrets
            read_only: true
          - name: GetSecret
            read_only: true
          # 组件里只有 trade 能调，并且只拿得到交易所密钥：网关把验过签的调用方名字写给 SecretMgr，
          # 服务端对组件调用方只返回类别为 exchange 的秘钥（控制台与 moox-cli 不受这条限制）。
          - name: GetSecretValue
            read_only: true
            callers: [trade]
            operators: [moox-cli]
          - name: CreateSecret
          - name: UpdateSecret
          - name: DeleteSecret
          - name: ToggleSecretStatus
          - name: ExportSecrets
          - name: ImportSecrets
          # Collector 按属性（类别 exchange、提供方相符、状态 active、extra_config 标记 readonly 且生产环境）读只读 Key 的公开标识：
          # 用专用方法授权，Collector 拿不到 Trade 的交易密钥。
          - name: GetReadonlyExchangeKey
            read_only: true
            callers: [collector]
            operators: []
          # Collector 调腾讯云只能读云账号密钥：SecretMgr 在服务端校验类别 cloud、厂商 tencent、状态 active，
          # 不满足就拒绝，Collector 因此拿不到交易所等其他类别的密钥。
          - name: GetCloudCredential
            read_only: true
            callers: [collector]
            operators: []
          # 按固定 secret_id 只建不改地写入初始密钥（仅供 moox-cli setup init 写入默认云账号密钥）。
          - name: EnsureInitialSecret
            operators: [moox-cli]
      - path: trpc.moox.ops.SysDeploy
        port: 11109
        console_name: sysdeploy
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetCatalog
            read_only: true
            callers: [monitor]
          - name: ListHosts
            read_only: true
            callers: [monitor]
          - name: ListDeployments
            read_only: true
            callers: [monitor]
          - name: GetHostRoutes
            read_only: true
          # 按 moox.toml 整份覆盖主机与部署的登记（setup deploy、setup install 部署每台主机前调用）。
          - name: SyncTopology
            operators: [moox-cli]
      - path: trpc.moox.admin.ActivityLog
        port: 11113
        console_name: activity
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: AppendActivityLogs
            callers: [collector]
            operators: []
          - name: ListActivityLogs
            read_only: true
      - path: trpc.moox.admin.GatewayControl
        port: 11112
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: PullSnapshot
            callers: [host-gateway]
            operators: []
    doctor:
      transport: reporter
      functional_observability: active
  - id: eventbus
    name: 消息总线
    binary: moox-eventbus
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/eventbus/config/app.yaml
      - from: modules/eventbus/config/trpc_go.yaml
    credentials: ["eventbus:internal-admin", cls]
    ports:
      - 4222
    health:
      port: 11419
    services:
      - path: trpc.moox.eventbus.EventBusMgr
        port: 11420
        console_name: eventbus
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetOverview
            read_only: true
          - name: ListEvents
            read_only: true
          - name: ListStreams
            read_only: true
          - name: ListConsumers
            read_only: true
          - name: GetConsumer
            read_only: true
    doctor:
      transport: reporter
      functional_observability: not_applicable
  - id: monitor
    name: 监控服务
    binary: moox-monitor
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/monitor/config/app.yaml
      - from: modules/monitor/config/trpc_go.yaml
    after: [host-gateway, eventbus]
    credentials: ["eventbus:monitor-observability", cls]
    health:
      port: 11409
    services:
      - path: trpc.moox.monitor.MonitorMgr
        port: 11410
        console_name: monitor
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetHealthOverview
            read_only: true
          - name: ListNotificationChannels
            read_only: true
          # 卸载前备份导出告警渠道（含完整 Webhook URL 与签名密钥），只给 moox-cli。
          - name: ExportNotificationChannels
            read_only: true
            operators: [moox-cli]
          # 重装后按 webhook_url 幂等覆盖导入告警渠道（含完整 Webhook URL 与签名密钥），只给 moox-cli。
          - name: ImportNotificationChannels
            idempotent: true
            operators: [moox-cli]
          - name: AddNotificationChannel
          - name: DeleteNotificationChannel
          - name: ListHostAgents
            read_only: true
          - name: QueryHostMetricHistory
            read_only: true
          - name: QueryPipelineArrivalHistory
            read_only: true
          - name: QueryLogRecords
            read_only: true
          - name: SyncHostAgent
            # 带着主机快照写入 Monitor 并拉回告警渠道；按上报 ID 去重，重发安全。
            idempotent: true
            callers: [host-agent]
            operators: []
          - name: MuteAlerts
            operators: [moox-cli]
          - name: UnmuteAlerts
            operators: [moox-cli]
          - name: GetAlertMute
            read_only: true
    doctor:
      transport: reporter
      functional_observability: active
  - id: collector
    name: 行情采集服务
    binary: moox-collector
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    tools: [moox-collector-cli]
    config_files:
      - from: modules/collector/config/app.yaml
      - from: modules/collector/config/trpc_go.yaml
      - from: config/setup/collection-tasks.yaml
    after: [host-gateway, admin, eventbus, storage-primary]
    credentials: ["eventbus:collector-eventbus", cls]
    health:
      port: 11412
    services:
      - path: trpc.moox.collector.CollectMgr
        port: 11402
        console_name: collector
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetTaskList
            read_only: true
          - name: GetTaskDetail
            read_only: true
          - name: GetTaskResultInventory
            read_only: true
            callers: [monitor]
          - name: CreateTask
          - name: UpdateTask
          - name: DisableTask
          - name: DeleteTask
          - name: GetDataTypeConfigs
            read_only: true
          - name: GetDataTypeConfigWithFields
            read_only: true
          - name: SubmitKlineResampleJob
          - name: GetKlineResampleJob
            read_only: true
          - name: ListKlineResampleJobs
            read_only: true
          - name: CancelKlineResampleJob
          - name: PreviewKlineResampleSource
            read_only: true
          # SyncSubjects 在服务端最多等 170 秒（交易所标的清单约 17MB），路由预算要大于它。
          - name: SyncSubjects
            operators: [moox-cli]
            timeout_ms: 180000
          # 标签同步的运行状态：Monitor 的标签检查读；可选的（来源，市场类型）组合给管理台新建自动标签用。
          - name: ListTagSyncStatus
            read_only: true
            callers: [monitor]
          - name: ListSubjectListers
            read_only: true
          - name: CheckKline
            read_only: true
            timeout_ms: 310000
          - name: SubmitKlineBackfill
            timeout_ms: 310000
          - name: GetKlineBackfill
            read_only: true
          - name: ListKlineBackfills
            read_only: true
          - name: CancelKlineBackfill
          - name: RetryKlineBackfill
          - name: ClearSourceAbsences
          - name: GetCollectorStatus
            read_only: true
          # 历史补齐：factor-mgr 与 strategy 据此判断数据集是否在补齐中（补齐期间不计算、不求值）。
          - name: ListHistorySeeds
            read_only: true
            callers: [factor-mgr, strategy]
          - name: SkipHistorySeed
            operators: [moox-cli]
          - name: ReregisterFetchPlan
            operators: [moox-cli]
          - name: TriggerFetchPlan
            operators: [moox-cli]
          - name: SetFetchPlanPaused
            operators: [moox-cli]
          - name: GetIngestMode
            read_only: true
          - name: SetIngestMode
            operators: [moox-cli]
          # 采集名单干预：控制台、moox-cli。
          - name: SetSubjectExclusions
          - name: ClearSubjectExclusions
          - name: ListSubjectExclusions
            read_only: true
          # 手工登记标的下架（补漏报和演练）：交易的下架名单页（经控制台）和 moox-cli。
          - name: RegisterDelistNotice
          # 云账号与代码包（管理台运行状态页“函数”区的两个对话框、moox-cli）；列出云函数的期望与读回。
          - name: ListCloudAccounts
            read_only: true
          - name: CreateCloudAccount
          - name: UpdateCloudAccount
          # 删云账号前要确认它在配置的各地域里没有建过的函数（取凭证、列命名空间、逐个命名空间列函数）；小于管理台的 30 秒请求超时。
          - name: DeleteCloudAccount
            timeout_ms: 25000
          - name: ListCloudRegions
            read_only: true
          - name: InitPackageUpload
          - name: CompletePackageUpload
          - name: ListFunctionPackages
            read_only: true
          - name: DeleteFunctionPackage
          # 读回、删除、探测云函数要逐个调腾讯云（限频 20 次/秒），几十个函数要几十秒。
          - name: ListCloudFunctions
            read_only: true
            timeout_ms: 120000
          # 删云函数、探测出口 IP 只给命令行。
          - name: DeleteCloudFunctions
            operators: [moox-cli]
            timeout_ms: 120000
          - name: ProbeFunctionEgress
            operators: [moox-cli]
            timeout_ms: 120000
          # 模块生命周期：管理台与命令行都能读；暂停、恢复、放行只给命令行（moox-cli lifecycle、system）。
          # 读追赶进度（system resume 每次轮询都带 refresh_catchup）要对每个空间把整个暂停区间跑一遍 K 线核对，
          # 与 CheckKline、SubmitKlineBackfill 同一量级，给 330 秒；暂停要等 SCF 定时器停用确认与在途补采分块结束（最长 5 分钟）。
          - name: GetLifecycle
            read_only: true
            timeout_ms: 330000
          - name: ControlLifecycle
            operators: [moox-cli]
            timeout_ms: 330000
      # collector-stream 的心跳、拉计划与周期统计上报；不设租约，计划里的份就是唯一的授权。
      - path: trpc.moox.collector.StreamCollector
        port: 11422
        timeout_ms: 10000
        max_body_bytes: 4194304
        methods:
          - name: StreamHeartbeat
            callers: [collector-stream]
            operators: []
          - name: PullStreamPlan
            read_only: true
            callers: [collector-stream]
            operators: []
          - name: ReportStreamPeriods
            callers: [collector-stream]
            operators: []
    doctor:
      transport: reporter
      functional_observability: active
  - id: collector-stream
    name: 行情推送采集
    binary: moox-collector-stream
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/collector/config/stream/app.yaml
      - from: modules/collector/config/stream/trpc_go.yaml
    after: [host-gateway, collector, storage-primary]
    credentials: [cls]
    health:
      port: 11451
    services:
      # 拉取与补采的本地执行端，处理代码与 SCF 函数相同；补采分块单次调用最长 90 秒。
      - path: trpc.moox.collector.MarketFetchExecutor
        port: 11450
        timeout_ms: 95000
        max_body_bytes: 4194304
        methods:
          - name: Invoke
            callers: [collector]
            operators: []
    doctor:
      transport: reporter
      functional_observability: active
  - id: factor-mgr
    name: 因子管理服务
    binary: moox-factor-mgr
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/factor/config/app.yaml
      - from: modules/factor/config/trpc_go.yaml
    after: [host-gateway, storage-primary]
    credentials: [cls]
    health:
      port: 11414
    services:
      - path: trpc.moox.factor.FactorMgr
        port: 11403
        console_name: factor-mgr
        timeout_ms: 120000
        max_body_bytes: 4194304
        methods:
          - name: CreateFactorTask
          - name: SetFactorTaskStatus
          - name: DeleteFactorTask
          # 策略实例与因子任务的关联、参数提交（因子动态调参）和随实例删除任务：只有策略服务是参数写入方。
          - name: GetFactorTask
            read_only: true
            callers: [strategy]
          - name: ListFactorTasks
            read_only: true
            callers: [strategy]
          - name: CreateFactor
          # 整批导入因子库与清孤立结果数据集只给命令行（管理台没有对应页面）。
          - name: ImportFactorCatalog
            operators: [moox-cli]
          - name: PurgeResultDataset
            operators: [moox-cli]
          - name: UpdateFactor
          - name: DeleteFactor
          - name: GetFactor
            read_only: true
            callers: [strategy]
          - name: AddTaskMember
          - name: RemoveTaskMember
          - name: SetTaskMemberStatus
          - name: ListFactors
            read_only: true
          - name: RecalcFactors
          - name: ListRecalcJobs
            read_only: true
          - name: GetRecalcJob
            read_only: true
          - name: CancelRecalcJob
          - name: GetStatus
            read_only: true
          - name: ValidateFactorSpec
            read_only: true
          - name: PreviewFactor
            read_only: true
          - name: ListFactorFunctions
            read_only: true
          - name: ListFactorCategories
            read_only: true
          - name: UpsertFactorCategory
          - name: DeleteFactorCategory
          - name: SetFactorCategory
          - name: BindFactorTask
            callers: [strategy]
            operators: []
          - name: DeleteBoundTask
            callers: [strategy]
            operators: []
          - name: SubmitFactorParams
            callers: [strategy]
            operators: []
          - name: GetFactorParams
            read_only: true
          - name: PublishUdf
          - name: ListUdfs
            read_only: true
          - name: GetUdf
            read_only: true
          - name: ActivateUdf
          # 模块生命周期：不参与系统暂停；管理台与命令行都能读，暂停、恢复只给命令行（moox-cli lifecycle --module factor-mgr）。
          - name: GetLifecycle
            read_only: true
          - name: ControlLifecycle
            operators: [moox-cli]
      - path: trpc.moox.factor.FactorEngine
        port: 11405
        timeout_ms: 120000
        max_body_bytes: 4194304
        methods:
          - name: SyncEngineCatalog
            callers: [factor-engine]
            operators: []
          - name: EngineHeartbeat
            callers: [factor-engine]
            operators: []
          - name: PullRecalcJob
            callers: [factor-engine]
            operators: []
          - name: ReportRecalcProgress
            callers: [factor-engine]
            operators: []
          - name: GetTaskParams
            callers: [factor-engine]
            operators: []
          - name: GetUdfModule
            callers: [factor-engine]
            operators: []
    doctor:
      transport: reporter
      functional_observability: active
  - id: archive-mgr
    name: 数据归档管理服务
    binary: moox-archive-mgr
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/archive/config/app.yaml
      - from: modules/archive/config/trpc_go.yaml
    after: [host-gateway, storage-primary, collector]
    credentials: [cls]
    health:
      port: 11416
    services:
      - path: trpc.moox.archive.ArchiveMgr
        port: 11406
        console_name: archive
        timeout_ms: 30000
        max_body_bytes: 4194304
        methods:
          - name: GetArchiveOverview
            read_only: true
          - name: ListArchiveTasks
            read_only: true
          - name: PrepareArchiveTask
            read_only: true
          - name: CreateArchiveTask
          - name: UpdateArchiveTask
          - name: DeleteArchiveTask
          - name: RunArchiveTaskNow
          - name: BackfillArchiveRange
          - name: CancelArchiveRun
          - name: ListArchiveRuns
            read_only: true
          - name: GetArchiveRun
            read_only: true
          - name: ListArchivePartitions
            read_only: true
          - name: GetArchivePartition
            read_only: true
          # moox-cli import 的归档目标建导入运行（行经 worker 数据端口写入），以及清除无法补齐区间：只给 moox-cli。
          - name: StartArchiveImport
            operators: [moox-cli]
          - name: ClearArchiveUnrecoverable
            operators: [moox-cli]
          # 模块生命周期：不参与系统暂停；管理台与命令行都能读，暂停、恢复只给命令行（moox-cli lifecycle --module archive-mgr）。
          - name: GetLifecycle
            read_only: true
          - name: ControlLifecycle
            operators: [moox-cli]
      - path: trpc.moox.archive.ArchiveWorker
        port: 11408
        timeout_ms: 60000
        max_body_bytes: 4194304
        methods:
          - name: ArchiveWorkerHeartbeat
            callers: [archive-worker]
            operators: []
          - name: PullArchiveRun
            callers: [archive-worker]
            operators: []
          - name: ReportArchiveRunProgress
            callers: [archive-worker]
            operators: []
          - name: CompleteArchiveRun
            callers: [archive-worker]
            operators: []
    doctor:
      transport: reporter
      functional_observability: active
  - id: strategy
    name: 策略服务
    binary: moox-strategy
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    tools: [moox-strategy-cli]
    config_files:
      - from: modules/strategy/config/app.yaml
      - from: modules/strategy/config/trpc_go.yaml
    after: [host-gateway, factor-mgr, storage-view, eventbus]
    credentials: ["eventbus:strategy-eventbus", cls]
    health:
      port: 11431
    services:
      - path: trpc.moox.strategy.StrategyMgr
        port: 11430
        console_name: strategy
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: CreateStrategy
          - name: UpdateStrategy
          - name: GetStrategy
            read_only: true
          - name: ListStrategies
            read_only: true
          - name: DeleteStrategy
          - name: ValidateStrategy
            read_only: true
          - name: CreateStrategyInstance
          - name: UpdateStrategyInstance
          - name: GetStrategyInstance
            read_only: true
          - name: ListStrategyInstances
            read_only: true
          - name: SetStrategyInstanceEnabled
          - name: ConfirmStrategyInstance
          # 删除实例要删因子任务和结果数据集，与策略服务端的超时（trpc_go.yaml 30 秒）一致。
          - name: DeleteStrategyInstance
            timeout_ms: 30000
          - name: ListStrategyResults
            read_only: true
          - name: GetStrategyResult
            read_only: true
          - name: ListStrategyTargets
            read_only: true
          - name: StartReplay
          - name: GetReplay
            read_only: true
          - name: ListReplays
            read_only: true
          - name: ListReplayBars
            read_only: true
          - name: CancelReplay
          - name: GetStrategyDisplaySettings
            read_only: true
          - name: SetStrategyDisplaySettings
          # 模块生命周期：管理台与命令行都能读；暂停、恢复、放行只给命令行。暂停要等在途求值结束、目标发布完（最长 30 秒）。
          - name: GetLifecycle
            read_only: true
            timeout_ms: 60000
          - name: ControlLifecycle
            operators: [moox-cli]
            timeout_ms: 60000
    doctor:
      transport: reporter
      functional_observability: active
  - id: storage-primary
    name: 存储主服务
    binary: moox-storage-primary
    scope: any
    replicas: single
    protected: false
    args: ["-conf={config}/trpc_go.yaml"]
    tools: [moox-storage-cli]
    config_files:
      - {from: modules/storage/config/trpc_go.primary.yaml, to: trpc_go.yaml}
      - {from: modules/storage/config/storage.primary.yaml, to: storage.yaml}
    after: [host-gateway, eventbus]
    credentials: ["eventbus:storage-eventbus", cls]
    health:
      port: 20210
    services:
      - path: trpc.moox.storage.Metadata
        port: 20100
        console_name: storage
        timeout_ms: 5000
        max_body_bytes: 33554432
        # 写方法的机器调用方按各模块实际的调用点放行：Collector 建改删数据集与列；factor-mgr 建删结果数据集与列（每个数据集的查询索引由 storage-view 随数据集自动建删）。
        methods:
          - name: CreateSpace
          - name: UpdateSpace
          - name: DeleteSpace
          - name: GetSpace
            read_only: true
            callers: [archive-mgr, collector, factor-mgr, monitor, strategy]
          - name: ListSpaces
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CreateDataSource
          - name: UpdateDataSource
          - name: DeleteDataSource
          - name: GetDataSource
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListDataSources
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: UpsertSubject
          - name: GetSubject
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListSubjects
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: UpsertTag
          - name: GetTag
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListTags
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: DeleteTag
          - name: ListTagMembers
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: AddTagMembers
          - name: RemoveTagMembers
          - name: SetTagMemberStatus
          - name: ApplyTagSnapshot
            callers: [collector]
            operators: []
          - name: UpdateSubjectAttributes
            callers: [collector]
            operators: []
          - name: SetTagMemberTradingStatus
            callers: [collector]
            operators: []
          - name: ResolveSubjects
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CreateDataset
            callers: [collector, factor-mgr]
          - name: UpdateDataset
            callers: [collector, factor-mgr]
          - name: DeleteDataset
            callers: [collector, factor-mgr]
          - name: GetDataset
            read_only: true
            callers: [archive-mgr, archive-worker, collector, factor-engine, factor-mgr, monitor, strategy]
          - name: ListDatasets
            read_only: true
            callers: [archive-mgr, collector, factor-mgr, monitor, strategy]
          - name: ListDatasetSubjects
            read_only: true
            callers: [collector, factor-engine, factor-mgr, monitor, strategy]
          - name: UpsertDatasetColumn
            callers: [collector, factor-mgr]
          - name: ListDatasetColumns
            read_only: true
            callers: [archive-worker, collector, factor-engine, factor-mgr, monitor, strategy]
      - path: trpc.moox.storage.PrimaryStore
        port: 20102
        console_name: storage
        timeout_ms: 5000
        # max_body_bytes 是网关侧逐方法的请求/响应上限（32 MiB）；Storage 与 HostGateway 的 tRPC 帧上限
        # 已统一提升至 64 MiB（nativewire.DefaultMaxFrameSize）以覆盖 32 MiB 业务体与协议帧开销。
        # 读取接口仍按合理分片返回（例如变更日志单页约 4 MiB），避免单次响应占用过多内存。
        max_body_bytes: 33554432
        methods:
          - name: UpsertFields
            callers: [collector, collector-stream, factor-engine, factor-mgr, scf-collector]
          - name: RegisterSeriesSnapshot
            callers: [collector]
            operators: []
          # 周期提交按（数据集，周期，序列）覆盖行并幂等置位完成位图，周期封口后返回回执而不再写入，重复提交安全。
          - name: CommitTimeSeriesBatch
            idempotent: true
            callers: [collector, collector-stream, scf-collector]
            operators: [moox-cli]
          - name: ReadRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
            operators: [moox-cli]
          - name: ReadTimeSeriesRows
            read_only: true
            callers: [archive-worker, collector, factor-engine, factor-mgr, monitor, strategy]
            operators: [moox-cli]
          - name: CountTimeSeriesRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
            operators: [moox-cli]
          - name: ReadDatasetChanges
            read_only: true
            callers: [archive-worker, factor-engine]
            operators: [moox-cli]
          - name: ReportDatasetPeriodCompleted
            callers: [factor-engine, factor-mgr]
            operators: [moox-cli]
          - name: GetDatasetPeriodCompleted
            read_only: true
            callers: [collector, factor-engine, factor-mgr, monitor, strategy]
            operators: [moox-cli]
    doctor:
      transport: reporter
      functional_observability: active
  - id: storage-view
    name: 存储视图服务
    binary: moox-storage-view
    scope: any
    replicas: single
    protected: false
    args: ["-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/storage/config/storage_view/trpc_go.yaml
      - from: modules/storage/config/storage.yaml
    after: [host-gateway, eventbus, storage-primary]
    credentials: ["eventbus:storage-eventbus", cls]
    health:
      port: 20211
    services:
      - path: trpc.moox.storage.DataView
        port: 20103
        console_name: storage
        timeout_ms: 25000
        max_body_bytes: 33554432
        methods:
          - name: QueryTimeSeriesRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CountTimeSeriesRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: SearchRecordRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: GetViewState
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          # WaitViewApplied 服务端最多等待 30 秒，路由预算要大于它并留出传输余量。
          - name: WaitViewApplied
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
            timeout_ms: 35000
    doctor:
      transport: reporter
      functional_observability: active
  - id: egress-proxy
    name: 出口代理
    binary: moox-egress-proxy
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/egressproxy/config/app.yaml
      - from: modules/egressproxy/config/trpc_go.yaml
    after: [host-gateway]
    health:
      port: 11441
    services:
      - path: trpc.moox.egress.Proxy
        port: 11440
        timeout_ms: 120000
        # 32 MiB decoded HTTP body plus PB/JSON framing and bounded headers.
        max_body_bytes: 50331648
        methods:
          - name: Do
            callers: [collector]
            operators: []
    doctor:
      transport: reporter
      functional_observability: not_applicable
  - id: trade
    name: 交易服务
    binary: moox-trade
    scope: any
