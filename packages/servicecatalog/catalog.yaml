# 组件、公开 RPC 与调用权限、Doctor 的共同事实源；不包含地址或凭据。
# 每个方法只写一遍：callers 是能调它的机器身份（组件 ID、identities 里的外部身份；host-gateway 指每台主机的网关），
# 省略表示没有机器能调；operators 收窄人操作的 console 与 moox-cli，省略表示两者都能调，写 [] 表示都不能调。
version: 2
identities:
  - id: scf-collector
    external: true
  - id: factor-engine
    external: true
  - id: archive-worker
    external: true
  # 采集名单干预的旁路程序（不在部署拓扑里）：只放行排除名单三个方法与 SyncSubjects。
  - id: collector-operator
    external: true
  - id: moox-skill
    external: true
components:
  - id: host-gateway
    name: 主机网关
    binary: moox-host-gateway
    scope: host
    replicas: single
    protected: true
    ports:
      - 11002
      - 11003
    health:
      kind: readyz
      port: 11012
      ready_body: '"ready":true'
    doctor:
      role: host-gateway
      description: 按主机提供签名校验与本机 tRPC 转发
      duties:
        - 同步路由、服务目录与校验密钥
        - 校验签名和 ACL 并仅转发本机服务
      inputs:
        - 签名 tRPC 请求
        - GatewayControl 快照
      outputs:
        - 本机服务响应
        - 服务目录与同步状态
      dependencies: []
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - host-gateway/config/app.yaml
        - host-gateway/config/trpc_go.yaml
      writable_paths:
        - data/host-gateway
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: host-agent
    name: 主机采集器
    binary: moox-host-agent
    scope: host
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11425
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.hostagent.HostAgentMgr
        port: 11426
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetStatus
            read_only: true
            callers: [monitor]
            operators: [moox-cli]
          - name: GetSnapshot
            read_only: true
            callers: [monitor]
            operators: [moox-cli]
          - name: RunOnce
            callers: [monitor]
            operators: [moox-cli]
    doctor:
      role: host-agent
      description: Host resource snapshot agent
      duties:
        - collect bounded host resource snapshots
      inputs:
        - host operating system facts
      outputs:
        - host snapshots
      dependencies:
        - eventbus
      transport: host_snapshot
      functional_observability: not_applicable
      config_paths:
        - host-agent/config/trpc_go.yaml
      writable_paths:
        - data/hostagent
      recovery_action_ids:
        - free_disk_space
        - restart_service_manually
      required_in_default_profile: false
  - id: console-proxy
    name: 控制台代理
    binary: moox-console-proxy
    scope: control
    replicas: single
    protected: true
    ports:
      - 9527
    health:
      kind: readyz
      port: 19528
      loopback: true
      ready_body: '"ready":true'
    doctor:
      role: console-proxy
      description: 内嵌 Caddy 的控制台 HTTPS 代理
      duties:
        - 终止浏览器 TLS 并转发控制台与静态资源请求
        - 保留 CA 与续期状态并排空完整流式请求
      inputs:
        - HTTPS 浏览器请求
        - Caddy 证书状态
      outputs:
        - Admin 与 web-host 响应
        - 内部鉴权诊断
      dependencies:
        - admin
        - web-host
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - console-proxy/config/app.yaml
      writable_paths:
        - data/caddy
        - certs/caddy
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: web-host
    name: 控制台前端
    binary: moox-web-host
    scope: control
    replicas: single
    protected: true
    ports:
      - 9528
    health:
      kind: readyz
      port: 19527
      loopback: true
      ready_body: '"ready":true'
    doctor:
      role: web-host
      description: Embedded MooX administration web host
      duties:
        - serve static administration assets
      inputs:
        - HTTP requests
      outputs:
        - web assets
      dependencies: []
      transport: reporter
      functional_observability: not_applicable
      config_paths: []
      writable_paths:
        - data/web-host
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: admin
    name: 管理后台
    binary: moox-admin
    scope: control
    replicas: single
    protected: true
    ports:
      - 11000
    health:
      kind: readyz
      port: 11010
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.infra.Auth
        port: 11100
        console_name: auth
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetLoginSalt
            read_only: true
            operators: [console]
          - name: Login
            operators: [console]
          - name: Logout
            operators: [console]
          - name: IssueRawSessionTicket
            operators: [console]
          - name: GetUserInfo
            read_only: true
            operators: [console]
      - path: trpc.moox.ops.Ssh
        port: 11106
        console_name: ssh
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: CreateSession
            operators: [console]
          - name: DisconnectSession
            operators: [console]
          - name: ResizeWindow
            operators: [console]
          - name: SftpList
            operators: [console]
          - name: SftpMkdir
            operators: [console]
          - name: SftpDelete
            operators: [console]
      - path: trpc.moox.admin.SpaceMgr
        port: 11107
        console_name: space
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: CreateSpace
          - name: UpdateSpace
          - name: DeleteSpace
          - name: ListSpaces
            read_only: true
            callers: [collector]
      - path: trpc.moox.ops.SecretMgr
        port: 11108
        console_name: secret
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: ListSecrets
            read_only: true
            callers: [trade]
          - name: GetSecret
            read_only: true
          - name: GetSecretValue
            read_only: true
            callers: [trade]
            operators: [moox-cli]
          - name: CreateSecret
          - name: UpdateSecret
          - name: DeleteSecret
          - name: ToggleSecretStatus
          - name: ExportSecrets
            operators: [console]
          - name: ImportSecrets
            operators: [console]
          # Collector 只能读固定 ID 只读 Key 的公开标识；网关转发会丢掉调用方元数据，
          # GetSecretValue 没法按调用方限定，所以用专用方法授权，Collector 拿不到 Trade 的交易密钥。
          - name: GetReadonlyExchangeKey
            read_only: true
            callers: [collector]
            operators: []
          # Collector 调腾讯云只能读云账号密钥：SecretMgr 在服务端校验类别 cloud、厂商 tencent、状态 active，
          # 不满足就拒绝，Collector 因此拿不到交易所等其他类别的密钥。
          - name: GetCloudCredential
            read_only: true
            callers: [collector]
            operators: []
      - path: trpc.moox.ops.SysDeploy
        port: 11109
        console_name: sysdeploy
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetCatalog
            read_only: true
            callers: [monitor]
          - name: ListHosts
            read_only: true
            callers: [monitor]
          - name: ListDeployments
            read_only: true
            callers: [monitor]
          - name: GetHostRoutes
            read_only: true
            callers: [monitor]
          - name: GetDirectory
            read_only: true
          - name: SetHostStatus
            operators: [moox-cli]
          - name: SetDeploymentStatus
            operators: [moox-cli]
          - name: SyncHostDeployments
            operators: [moox-cli]
          - name: DeleteHost
            operators: [moox-cli]
      - path: trpc.moox.admin.Setup
        port: 11110
        console_name: setup
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: ApplySetup
          - name: GetSetupStatus
            read_only: true
          - name: PutConfigBackup
            operators: [console]
          - name: GetConfigBackup
            read_only: true
            operators: [console]
      - path: trpc.moox.admin.ActivityLog
        port: 11113
        console_name: activity
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: AppendActivityLogs
            callers: [collector]
            operators: []
          - name: ListActivityLogs
            read_only: true
      - path: trpc.moox.admin.GatewayControl
        port: 11112
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: PullSnapshot
            callers: [host-gateway]
            operators: []
          - name: ReportStatus
            callers: [host-gateway]
            operators: []
    doctor:
      role: admin
      description: 认证、空间、密钥、部署与网关控制面
      duties:
        - 提供浏览器控制台与 Admin RPC
        - 管理主机、部署、调用方密钥与路由快照
      inputs:
        - 用户会话与控制台请求
        - CLI 部署登记与网关心跳
      outputs:
        - 管理数据
        - 按主机编译的路由、目录与校验密钥
      dependencies:
        - eventbus
      transport: reporter
      functional_observability: active
      config_paths:
        - admin/config/app.yaml
        - admin/config/trpc_go.yaml
      writable_paths:
        - data/admin
        - secrets/pki
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: eventbus
    name: 消息总线
    binary: moox-eventbus
    scope: any
    replicas: single
    protected: false
    ports:
      - 4222
    health:
      kind: readyz
      port: 11419
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.eventbus.EventBusMgr
        port: 11420
        console_name: eventbus
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetOverview
            read_only: true
          - name: ListEvents
            read_only: true
          - name: ListStreams
            read_only: true
          - name: ListConsumers
            read_only: true
          - name: GetConsumer
            read_only: true
    doctor:
      role: eventbus
      description: NATS JetStream event transport
      duties:
        - transport metrics and business events
      inputs:
        - published events
      outputs:
        - durable subscriptions
      dependencies: []
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - eventbus/config/app.yaml
        - eventbus/config/trpc_go.yaml
      writable_paths:
        - data/eventbus
      recovery_action_ids:
        - verify_eventbus_credentials
        - restart_service_manually
      required_in_default_profile: true
  - id: monitor
    name: 监控服务
    binary: moox-monitor
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11409
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.monitor.MonitorMgr
        port: 11410
        console_name: monitor
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetHealthOverview
            read_only: true
          - name: ListNotificationChannels
            read_only: true
          - name: AddNotificationChannel
          - name: DeleteNotificationChannel
          - name: ListHostAgents
            read_only: true
          - name: QueryHostMetricHistory
            read_only: true
          - name: QueryPipelineArrivalHistory
            read_only: true
          - name: QueryLogRecords
            read_only: true
          - name: GetDoctorContext
            read_only: true
          - name: GetHostPolicy
            read_only: true
            callers: [host-agent]
            operators: []
          - name: MuteAlerts
            operators: [moox-cli]
          - name: UnmuteAlerts
            operators: [moox-cli]
          - name: GetAlertMute
            read_only: true
    doctor:
      role: monitor
      description: Single-instance monitoring fact store and alert evaluator
      duties:
        - ingest monitoring facts
        - evaluate alerts
        - serve bounded context
      inputs:
        - metrics and host snapshots
      outputs:
        - monitoring observations
      dependencies:
        - eventbus
      transport: reporter
      functional_observability: active
      config_paths:
        - monitor/config/app.yaml
        - monitor/config/trpc_go.yaml
      writable_paths:
        - data/monitor
      recovery_action_ids:
        - verify_eventbus_credentials
        - restart_service_manually
      required_in_default_profile: true
  - id: collector
    name: 行情采集服务
    binary: moox-collector
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11412
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.collector.CollectMgr
        port: 11402
        console_name: collector
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: GetTaskList
            read_only: true
          - name: GetTaskDetail
            read_only: true
          - name: GetTaskResultInventory
            read_only: true
            callers: [monitor]
          - name: CreateTask
          - name: UpdateTask
          - name: DisableTask
          - name: DeleteTask
          - name: GetDataTypeConfigs
            read_only: true
          - name: GetDataTypeConfigWithFields
            read_only: true
          - name: SubmitKlineResampleJob
          - name: GetKlineResampleJob
            read_only: true
          - name: ListKlineResampleJobs
            read_only: true
          - name: CancelKlineResampleJob
          - name: PreviewKlineResampleSource
            read_only: true
          # SyncSubjects 在服务端最多等 170 秒（交易所标的清单约 17MB），路由预算要大于它。
          - name: SyncSubjects
            callers: [collector-operator]
            operators: [moox-cli]
            timeout_ms: 180000
          # 标签同步的运行状态：Monitor 的标签检查读；可选的（来源，市场类型）组合给管理台新建自动标签用。
          - name: ListTagSyncStatus
            read_only: true
            callers: [monitor]
          - name: ListSubjectListers
            read_only: true
          - name: CheckKline
            read_only: true
            timeout_ms: 310000
          - name: SubmitKlineBackfill
            timeout_ms: 310000
          - name: GetKlineBackfill
            read_only: true
          - name: ListKlineBackfills
            read_only: true
          - name: CancelKlineBackfill
          - name: RetryKlineBackfill
          - name: ConfirmHistoryGaps
          - name: ClearSourceAbsences
          # 归档避让：archive-mgr 只读各空间生效中的采集函数（服务的数据集与频率），据此推出避让时段。
          - name: GetCollectorStatus
            read_only: true
            callers: [archive-mgr]
          - name: ReregisterFetchPlan
            operators: [moox-cli]
          - name: TriggerFetchPlan
            operators: [moox-cli]
          - name: SetFetchPlanPaused
            operators: [moox-cli]
          - name: GetIngestMode
            read_only: true
          - name: SetIngestMode
            operators: [moox-cli]
          # 采集名单干预：控制台、moox-cli；旁路程序用外部身份 collector-operator 经 Access 调用。
          - name: SetSubjectExclusions
            callers: [collector-operator]
          - name: ClearSubjectExclusions
            callers: [collector-operator]
          - name: ListSubjectExclusions
            read_only: true
            callers: [collector-operator]
          # 手工登记标的下架（补漏报和演练）：事件中心页面（经控制台）和 moox-cli。
          - name: RegisterDelistNotice
          # 云账号与代码包（管理台运行状态页“函数”区的两个对话框、moox-cli）；列出云函数的期望与读回。
          - name: ListCloudAccounts
            read_only: true
          - name: CreateCloudAccount
          - name: UpdateCloudAccount
          # 删云账号前要确认它在配置的各地域里没有建过的函数（取凭证、列命名空间、逐个命名空间列函数）；小于管理台的 30 秒请求超时。
          - name: DeleteCloudAccount
            timeout_ms: 25000
          - name: ListCloudRegions
            read_only: true
          - name: InitPackageUpload
          - name: CompletePackageUpload
          - name: ListFunctionPackages
            read_only: true
          - name: DeleteFunctionPackage
          # 读回、删除、探测云函数要逐个调腾讯云（限频 20 次/秒），几十个函数要几十秒。
          - name: ListCloudFunctions
            read_only: true
            timeout_ms: 120000
          # 删云函数、探测出口 IP 只给命令行。
          - name: DeleteCloudFunctions
            operators: [moox-cli]
            timeout_ms: 120000
          - name: ProbeFunctionEgress
            operators: [moox-cli]
            timeout_ms: 120000
          # 模块生命周期（设计 3.7）：管理台与命令行都能读；暂停、恢复、放行只给命令行（moox-cli lifecycle、system）。
          # 读追赶进度（system resume 每次轮询都带 refresh_catchup）要对每个空间把整个暂停区间跑一遍 K 线核对，
          # 与 CheckKline、SubmitKlineBackfill 同一量级，给 330 秒；暂停要等 SCF 定时器停用确认与在途补采分块结束（最长 5 分钟）。
          - name: GetLifecycle
            read_only: true
            timeout_ms: 330000
          - name: ControlLifecycle
            operators: [moox-cli]
            timeout_ms: 330000
      # collector-stream 的心跳、拉计划与周期统计上报；不设租约，计划里的份就是唯一的授权。
      - path: trpc.moox.collector.StreamCollector
        port: 11422
        timeout_ms: 10000
        max_body_bytes: 4194304
        methods:
          - name: StreamHeartbeat
            callers: [collector-stream]
            operators: []
          - name: PullStreamPlan
            read_only: true
            callers: [collector-stream]
            operators: []
          - name: ReportStreamPeriods
            callers: [collector-stream]
            operators: []
    doctor:
      role: collector
      description: Market data collection planner and executor
      duties:
        - plan and execute collection tasks
        - 同步标的标签与属性
      inputs:
        - collector rules and market windows
      outputs:
        - committed collection tasks
      dependencies:
        - eventbus
        - storage-primary
        - admin
      transport: reporter
      functional_observability: active
      config_paths:
        - collector/config/app.yaml
        - collector/config/trpc_go.yaml
      writable_paths:
        - data/collector
      recovery_action_ids:
        - inspect_health_check_input
        - restart_service_manually
      required_in_default_profile: true
  - id: collector-stream
    name: 行情推送采集
    binary: moox-collector-stream
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11451
      ready_body: '"ready":true'
    services:
      # 拉取与补采的本地执行端，处理代码与 SCF 函数相同；补采分块单次调用最长 90 秒。
      - path: trpc.moox.collector.MarketFetchExecutor
        port: 11450
        timeout_ms: 95000
        max_body_bytes: 4194304
        methods:
          - name: Invoke
            callers: [collector]
            operators: []
    doctor:
      role: collector-stream
      description: 常驻接收交易所 WebSocket 收盘 K 线并按周期提交 Storage，同进程提供本地执行端
      duties:
        - 按采集计划订阅推送并在截止前提交周期
        - 执行补采与本地定时拉取
      inputs:
        - 交易所 WebSocket 收盘推送
        - Collector 下发的推送与本地执行端计划
      outputs:
        - Storage 周期提交与补采写入
        - 心跳与周期统计
      dependencies:
        - collector
        - storage-primary
      transport: reporter
      functional_observability: active
      config_paths:
        - collector-stream/config/app.yaml
        - collector-stream/config/trpc_go.yaml
      writable_paths:
        - data/collector-stream
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  - id: factor-mgr
    name: 因子管理服务
    binary: moox-factor-mgr
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11414
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.factor.FactorMgr
        port: 11403
        console_name: factor-mgr
        timeout_ms: 120000
        max_body_bytes: 4194304
        methods:
          - name: CreateFactorTask
          - name: SetFactorTaskStatus
          - name: DeleteFactorTask
          # 策略实例与因子任务的关联、参数提交（因子动态调参）和随实例删除任务：只有策略服务是参数写入方。
          - name: GetFactorTask
            read_only: true
            callers: [strategy]
          - name: ListFactorTasks
            read_only: true
            callers: [strategy]
          - name: CreateFactor
          - name: UpdateFactor
          - name: DeleteFactor
          - name: GetFactor
            read_only: true
            callers: [strategy]
          - name: AddTaskMember
          - name: RemoveTaskMember
          - name: SetTaskMemberStatus
          - name: ListFactors
            read_only: true
            callers: [strategy]
          - name: RecalcFactors
          - name: ListRecalcJobs
            read_only: true
            callers: [strategy]
          - name: GetRecalcJob
            read_only: true
          - name: CancelRecalcJob
          - name: GetStatus
            read_only: true
            callers: [strategy]
          - name: ValidateFactorSpec
            read_only: true
          - name: PreviewFactor
            read_only: true
          - name: ListFactorFunctions
            read_only: true
          - name: ListFactorCategories
            read_only: true
            callers: [strategy]
          - name: UpsertFactorCategory
          - name: DeleteFactorCategory
          - name: SetFactorCategory
          - name: BindFactorTask
            callers: [strategy]
            operators: []
          - name: DeleteBoundTask
            callers: [strategy]
            operators: []
          - name: SubmitFactorParams
            callers: [strategy]
            operators: []
          - name: GetFactorParams
            read_only: true
            callers: [strategy]
          - name: PublishUdf
          - name: ListUdfs
            read_only: true
          - name: GetUdf
            read_only: true
          - name: ActivateUdf
