              - GetLogicalAccountTarget
              - GetOrder
              - ListOrders
              - ListFills
              - ListPositions
              - CreatePaperSimulation
              - ClosePaperSimulation
              - GetExecutionCapabilities
              - QueryEquityCurve
              - ListHoldings
            callers:
              - console
              - moox-cli
          - methods:
              - ClaimLogicalAccountOwner
              - ReleaseLogicalAccountOwner
              - RebindLogicalAccountOwner
            callers:
              - moox-cli
          - methods:
              - GetLogicalAccount
              - ClaimLogicalAccountOwner
              - ReleaseLogicalAccountOwner
              - RebindLogicalAccountOwner
            callers:
              - strategy
    doctor:
      role: trade
      description: Trade execution and reconciliation service
      duties:
        - execute orders and reconcile state
      inputs:
        - target positions
      outputs:
        - orders and reconciliations
      dependencies:
        - eventbus
        - admin
      transport: reporter
      functional_observability: active
      config_paths:
        - trade/config/app.yaml
        - trade/config/trpc_go.yaml
      writable_paths:
        - data/trade
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  # 外部程序：运行在登记主机上（通常是只能出站的因子机），以同名外部身份经 Access 访问系统，不经主机网关路由；
  # 由 systemd 用户服务托管，部署健康由 Monitor 经中转探测本机健康端口。
  - id: factor-engine
    name: 因子引擎
    binary: moox-factor-engine
    scope: any
    replicas: single
    protected: false
    external_program: true
    health:
      kind: readyz
      port: 11417
      ready_body: '"ready":true'
    doctor:
      role: factor-engine
      description: Factor compute engine that consumes period events and writes factor results through Access
      duties:
        - compute factor periods and recalculation jobs
      inputs:
        - period completion events and source windows
      outputs:
        - factor result rows and period markers
      dependencies:
        - factor-mgr
        - access
      transport: health_only
      functional_observability: deferred
      config_paths:
        - factor-engine/config/engine.yaml
      writable_paths:
        - factor-engine/data
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
      supervisor: systemd_user
      unit: moox-factor-engine
  - id: archive-worker
    name: 数据归档执行器
    binary: moox-archive-worker
    scope: any
    replicas: single
    protected: false
    external_program: true
    health:
      kind: readyz
      port: 11418
      ready_body: '"ready":true'
    doctor:
      role: archive-worker
      description: Archive worker that pulls archive runs and exports partitions
      duties:
        - export archive partitions
      inputs:
        - archive runs from archive-mgr
      outputs:
        - archive partitions
      dependencies:
        - archive-mgr
        - access
      transport: health_only
      functional_observability: deferred
      config_paths:
        - archive-worker/config/app.yaml
      writable_paths:
        - archive-worker/data
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
      supervisor: systemd_user
      unit: moox-archive-worker
principals:
  - id: scf-collector
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - CommitTimeSeriesBatch
          - UpsertFields
  - id: factor-engine
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - ReadTimeSeriesRows
          - ReadDatasetChanges
          - WriteFactorRows
          - ReportFactorPeriodComputed
          - GetFactorPeriodComputed
      - service: trpc.moox.storage.Metadata
        methods:
          - GetDataset
          - ListDatasetColumns
          - ListDatasetSubjects
      - service: trpc.moox.factor.FactorEngine
        methods:
          - SyncEngineCatalog
          - EngineHeartbeat
          - PullRecalcJob
          - ReportRecalcProgress
          - FreezeFactorParams
          - ReportOfflineFreezes
          - ListParamIntervals
  - id: archive-worker
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - ReadTimeSeriesRows
      - service: trpc.moox.storage.Metadata
        methods:
          - GetDataset
          - ListDatasetColumns
      - service: trpc.moox.archive.ArchiveWorker
        methods:
          - ArchiveWorkerHeartbeat
          - PullArchiveRun
          - ReportArchiveRunProgress
          - CompleteArchiveRun
  # 采集名单干预的旁路程序（不在部署拓扑里）：只放行排除名单三个方法与 SyncSubjects。
  - id: collector-operator
    allow:
      - service: trpc.moox.collector.CollectMgr
        methods:
          - SetSubjectExclusions
          - ClearSubjectExclusions
          - ListSubjectExclusions
          - SyncSubjects
  - id: moox-skill
    allow:
      - service: trpc.moox.storage.PrimaryStore
        methods:
          - ReadTimeSeriesRows
