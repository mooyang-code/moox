    health:
      port: 11210
    services:
      - path: trpc.moox.trade.TradeConsoleService
        port: 11200
        console_name: trade
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - name: CreateTradingAccount
          - name: UpdateTradingAccount
          - name: GetTradingAccount
            read_only: true
          - name: ListTradingAccounts
            read_only: true
          - name: SetLeverage
          - name: SyncTradingAccount
          - name: InspectExchangeCredential
            read_only: true
            timeout_ms: 15000
          - name: ReinspectTradingAccount
            timeout_ms: 15000
          - name: ResolveWalletTransfer
          - name: CreateLogicalAccount
          - name: GetLogicalAccount
            read_only: true
            callers: [strategy]
          - name: ListLogicalAccounts
            read_only: true
          - name: UpdateLogicalAccount
          - name: UpdateLogicalAccountOrderSettings
          - name: UpdateLogicalAccountFundSettings
          - name: AddLogicalAccountMember
          - name: RemoveLogicalAccountMember
          - name: CloseTargetSession
            callers: [strategy]
            operators: []
          - name: PauseLogicalAccount
          - name: ResumeLogicalAccount
          - name: FlattenLogicalAccount
            timeout_ms: 12000
          - name: SubmitOrder
          - name: CancelOrder
          - name: GetOperatorAction
            read_only: true
          - name: GetLogicalAccountTarget
            read_only: true
          - name: ListShadowTargets
            read_only: true
          - name: GetOrder
            read_only: true
          - name: ListOrders
            read_only: true
          - name: ListFills
            read_only: true
          - name: ListPositions
            read_only: true
          - name: GetExecutionCapabilities
            read_only: true
          - name: ListTradableInstruments
            read_only: true
          - name: QueryEquityCurve
            read_only: true
          - name: ListHoldings
            read_only: true
          - name: ListAccountLedger
            read_only: true
            timeout_ms: 15000
          - name: FlattenTradingAccount
