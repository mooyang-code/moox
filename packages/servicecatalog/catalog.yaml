  - id: storage-primary
    name: 存储主服务
    binary: moox-storage-primary
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 20210
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.storage.Metadata
        port: 20100
        console_name: storage
        timeout_ms: 5000
        max_body_bytes: 33554432
        # 写方法的机器调用方按各模块实际的调用点放行：Collector 建改删数据集、建删浏览 View；factor-mgr 建删结果数据集、列与默认 View。
        methods:
          - name: CreateSpace
          - name: UpdateSpace
          - name: DeleteSpace
          - name: GetSpace
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListSpaces
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CreateView
            callers: [collector, factor-mgr]
          - name: UpdateView
          - name: DeleteView
            callers: [collector, factor-mgr]
          - name: GetView
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListViews
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListViewColumns
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CreateDataSource
          - name: UpdateDataSource
          - name: DeleteDataSource
          - name: GetDataSource
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListDataSources
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: UpsertSubject
          - name: GetSubject
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListSubjects
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: UpsertTag
          - name: GetTag
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListTags
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: DeleteTag
          - name: ListTagMembers
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: AddTagMembers
          - name: RemoveTagMembers
          - name: SetTagMemberStatus
          - name: ApplyTagSnapshot
            callers: [collector]
            operators: []
          - name: UpdateSubjectAttributes
            callers: [collector]
            operators: []
          - name: ResolveSubjects
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CreateDataset
            callers: [collector, factor-mgr]
          - name: UpdateDataset
            callers: [collector, factor-mgr]
          - name: DeleteDataset
            callers: [collector, factor-mgr]
          - name: GetDataset
            read_only: true
            callers: [archive-mgr, archive-worker, collector, factor-engine, factor-mgr, monitor, strategy]
          - name: ListDatasets
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListDatasetSubjects
            read_only: true
            callers: [collector, factor-engine, factor-mgr, monitor, strategy]
          - name: CreateFieldGroup
          - name: UpdateFieldGroup
          - name: GetFieldGroup
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListFieldGroups
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: CreateField
          - name: UpdateField
          - name: GetField
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: ListFields
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
          - name: BatchUpdateFields
          - name: DeleteFieldGroup
          - name: UpsertDatasetColumn
            callers: [collector, factor-mgr]
          - name: ListDatasetColumns
            read_only: true
            callers: [archive-worker, collector, factor-engine, factor-mgr, monitor, strategy]
      - path: trpc.moox.storage.PrimaryStore
        port: 20102
        console_name: storage
        timeout_ms: 5000
        # max_body_bytes 只是网关侧逐方法的请求/响应上限。Storage 进程没有调大 tRPC 帧上限（默认 10 MiB）：
        # 发给 Storage 的请求帧和 Storage 自己编码的响应帧都受 10 MiB 限制，网关放行到 32 MiB 也过不去。
        # 所以 Storage 的读取接口要自己把单页控制在 10 MiB 以内（例如变更日志单页约 4 MiB）。
        max_body_bytes: 33554432
        methods:
          - name: UpsertFields
            callers: [collector, collector-stream, factor-engine, factor-mgr, scf-collector]
          - name: RegisterSeriesSnapshot
            callers: [collector]
            operators: []
          # 周期提交按（数据集，周期，序列）覆盖行并幂等置位完成位图，周期封口后返回回执而不再写入，重复提交安全。
          - name: CommitTimeSeriesBatch
            idempotent: true
            callers: [collector, collector-stream, scf-collector]
            operators: [moox-cli]
          - name: ReadRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
            operators: [moox-cli]
          - name: ReadTimeSeriesRows
            read_only: true
            callers: [archive-worker, collector, factor-engine, factor-mgr, monitor, moox-skill, strategy]
            operators: [moox-cli]
          - name: CountTimeSeriesRows
            read_only: true
            callers: [collector, factor-mgr, monitor, strategy]
            operators: [moox-cli]
          - name: ReadDatasetChanges
            read_only: true
            callers: [archive-worker, factor-engine]
            operators: [moox-cli]
          - name: ReportDatasetPeriodCompleted
            callers: [factor-engine, factor-mgr]
            operators: [moox-cli]
          - name: GetDatasetPeriodCompleted
            read_only: true
            callers: [collector, factor-engine, factor-mgr, monitor, strategy]
            operators: [moox-cli]
    doctor:
      role: storage-primary
      description: Storage 元数据与事实数据主服务
      duties:
        - 管理空间、数据集、字段与视图
        - 持久化数据集字段与周期完成状态，跟随变更日志转发完成事件
        - 向 EventBus 发布周期完成等跨机事件
