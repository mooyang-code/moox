            timeout_ms: 60000
          - name: ControlLifecycle
            operators: [moox-cli]
            timeout_ms: 60000
    doctor:
      transport: reporter
      functional_observability: active
  # 外部程序：运行在登记主机上（通常是只能出站的因子机），和别的组件一样用所在主机的密钥、以自己的组件 ID 签名，直连存储机与控制机的主机网关；
  # 由 systemd 用户服务托管；健康由管理端按心跳代报给 Monitor（doctor.transport: delegated），Monitor 不探测健康端口。
  # 外部程序可以声明只监听本机的服务，由所在主机的网关路由（出站主机经 control 中转）。
  - id: factor-engine
    name: 因子引擎
    binary: moox-factor-engine
    scope: any
    replicas: single
    protected: false
    args: ["serve", "-config={config}/engine.yaml", "-conf={config}/trpc_go.yaml"]
    config_files:
      - from: modules/factor/config/engine.yaml
      - {from: modules/factor/config/trpc_go.engine.yaml, to: trpc_go.yaml}
    after: [host-gateway, factor-mgr]
    credentials: ["eventbus:factor-eventbus"]
    external_program: true
    health:
      port: 11417
    services:
      # 回放“因子现算”：策略服务逐步调用，引擎按因子机本地快照现算。单步响应由引擎控制在 3 MiB 以内，包体上限用默认值。
      # 本地写入（导入）的一批默认一万行，40 个数值列按 protobuf 编码实测约 3.67 MB，离默认上限 4 MiB（4.19 MB）不远；
      # 列更多时超出，由导入命令提示减小 --batch-rows。
      # 生命周期、任务检查与本地写入只给命令行，管理台不能调（这个服务没有 console_name）。
      - path: trpc.moox.factor.EngineControl
        port: 11423
        timeout_ms: 120000
        methods:
          # OpenReplay 要读整段本地快照、预留内存，与引擎侧的建会话超时（10 分钟）一致。
          - name: OpenReplay
            callers: [strategy]
            operators: []
            timeout_ms: 600000
          - name: StepReplay
            callers: [strategy]
            operators: []
          - name: CloseReplay
            callers: [strategy]
            operators: []
          - name: GetLifecycle
            read_only: true
            operators: [moox-cli]
          - name: ControlLifecycle
            operators: [moox-cli]
          - name: CheckTask
            read_only: true
            operators: [moox-cli]
          - name: WriteSeries
            operators: [moox-cli]
          - name: GetSeriesFields
            read_only: true
            operators: [moox-cli]
          - name: CheckSeriesSubject
            read_only: true
            operators: [moox-cli]
          - name: GetSeriesBounds
            read_only: true
            operators: [moox-cli]
    doctor:
      transport: delegated
      functional_observability: not_applicable
  - id: archive-worker
    name: 数据归档执行器
    binary: moox-archive-worker
    scope: any
    replicas: single
    protected: false
    args: ["-config={config}/app.yaml"]
    config_files:
      - from: modules/archive/config/worker/app.yaml
    after: [host-gateway, archive-mgr]
    external_program: true
    health:
      port: 11418
    # 数据端口只听 127.0.0.1（只出站主机上经 control 中转）：分区下载与最新数据预览给控制台（经 Admin），导入写入给 moox-cli。
    relay_http:
      port: 11428
      callers:
        - console
        - moox-cli
    doctor:
      transport: delegated
      functional_observability: not_applicable
