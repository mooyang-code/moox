      writable_paths:
        - data/callback-dispatcher
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  # 外部程序：运行在登记主机上（通常是只能出站的因子机），以同名外部身份经 Access 访问系统；
  # 由 systemd 用户服务托管；健康由管理端按心跳代报给 Monitor（doctor.transport: delegated），Monitor 不探测健康端口。
  # 外部程序可以声明只监听本机的服务，由所在主机的网关路由（出站主机经 control 中转）。
  - id: factor-engine
    name: 因子引擎
    binary: moox-factor-engine
    scope: any
    replicas: single
    protected: false
    external_program: true
    health:
      kind: readyz
      port: 11417
      ready_body: '"ready":true'
    services:
      # 回放“因子现算”：策略服务逐步调用，引擎按因子机本地快照现算。单步响应由引擎控制在 3 MiB 以内，包体上限用默认值。
      # 本地写入（导入）的一批默认一万行，40 个数值列按 protobuf 编码实测约 3.67 MB，离默认上限 4 MiB（4.19 MB）不远；
      # 列更多时超出，由导入命令提示减小 --batch-rows。
      # 生命周期、任务检查与本地写入只给命令行，管理台不能调（这个服务没有 console_name）。
      - path: trpc.moox.factor.EngineControl
        port: 11423
        timeout_ms: 120000
        methods:
          # OpenReplay 要读整段本地快照、预留内存，与引擎侧的建会话超时（10 分钟）一致。
          - name: OpenReplay
            callers: [strategy]
            operators: []
            timeout_ms: 600000
          - name: StepReplay
            callers: [strategy]
            operators: []
          - name: CloseReplay
            callers: [strategy]
            operators: []
          - name: GetLifecycle
            read_only: true
            operators: [moox-cli]
          - name: ControlLifecycle
            operators: [moox-cli]
          - name: CheckTask
            read_only: true
            operators: [moox-cli]
          - name: WriteSeries
            operators: [moox-cli]
          - name: GetSeriesFields
            read_only: true
            operators: [moox-cli]
          - name: CheckSeriesSubject
            read_only: true
            operators: [moox-cli]
          - name: GetSeriesBounds
            read_only: true
            operators: [moox-cli]
    doctor:
      role: factor-engine
      description: Factor compute engine that consumes period events and writes factor results through Access
      duties:
        - compute factor periods and recalculation jobs
        - serve replay compute sessions to strategy through the host gateway
      inputs:
        - period completion events and source windows
      outputs:
        - factor result rows and period markers
      dependencies:
        - factor-mgr
        - access
      transport: delegated
      functional_observability: deferred
      config_paths:
        - factor-engine/config/engine.yaml
      writable_paths:
        - factor-engine/data
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
      supervisor: systemd_user
      unit: moox-factor-engine
  - id: archive-worker
    name: 数据归档执行器
    binary: moox-archive-worker
    scope: any
    replicas: single
    protected: false
    external_program: true
    health:
      kind: readyz
      port: 11418
      ready_body: '"ready":true'
    # 数据端口只听 127.0.0.1：分区副本下载与最新数据预览，只给控制台经 Admin 使用（只出站主机上经 control 中转）。
    relay_http:
      port: 11428
      callers:
        - console
    doctor:
      role: archive-worker
      description: Archive worker that pulls archive runs and exports partitions
      duties:
        - export archive partitions
      inputs:
        - archive runs from archive-mgr
      outputs:
        - archive partitions
      dependencies:
        - archive-mgr
        - access
      transport: delegated
      functional_observability: deferred
      config_paths:
        - archive-worker/config/app.yaml
      writable_paths:
        - archive-worker/data
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
      supervisor: systemd_user
      unit: moox-archive-worker
