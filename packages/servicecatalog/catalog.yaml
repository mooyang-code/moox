    doctor:
      role: storage-primary
      description: Storage 元数据与写入路由主服务
      duties:
        - 管理空间、数据集、字段、视图与数据节点
        - 将数据读写路由到对应的数据节点
      inputs:
        - 元数据管理与数据读写请求
      outputs:
        - 元数据与主存储响应
      dependencies:
        - eventbus
      transport: reporter
      functional_observability: deferred
      config_paths:
        - storage-primary/config/app.yaml
        - storage-primary/config/trpc_go.yaml
      writable_paths:
        - data/storage-primary
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: storage-node
    name: 存储数据节点
    binary: moox-storage-node
    scope: any
    replicas: single
    protected: false
    ports:
      - 20107
    health:
      kind: readyz
      port: 20212
      ready_body: '"ready":true'
    doctor:
      role: storage-node
      description: Storage 事实数据与事务发件箱节点
      duties:
        - 持久化数据集字段、周期完成状态与发件箱
        - 向派生视图发布数据变更
      inputs:
        - 主服务转发的数据读写请求
      outputs:
        - 事实数据与数据变更事件
      dependencies:
        - eventbus
        - storage-primary
      transport: reporter
      functional_observability: deferred
      config_paths:
        - storage-node/config/app.yaml
        - storage-node/config/trpc_go.yaml
      writable_paths:
        - data/storage-node
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: storage-view
    name: 存储视图服务
    binary: moox-storage-view
    scope: any
    replicas: single
    protected: false
    ports:
      - 20104
    health:
      kind: readyz
      port: 20211
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.storage.DataView
        port: 20103
        console_name: storage
        timeout_ms: 25000
        max_body_bytes: 33554432
        methods:
          - QueryTimeSeriesRows
          - SearchRecordRows
        read_only_methods:
          - QueryTimeSeriesRows
          - SearchRecordRows
        acl:
          - methods:
              - QueryTimeSeriesRows
              - SearchRecordRows
            callers:
              - console
              - moox-cli
              - collector
              - factor-mgr
              - monitor
              - strategy
    doctor:
      role: storage-view
      description: Storage 可重建查询视图服务
      duties:
        - 构建数据集查询视图与索引
        - 执行时间序列与记录查询
      inputs:
        - 主存储数据变更与视图查询
      outputs:
        - 视图查询结果与构建状态
      dependencies:
        - eventbus
        - storage-primary
      transport: reporter
      functional_observability: deferred
      config_paths:
        - storage-view/config/app.yaml
        - storage-view/config/trpc_go.yaml
      writable_paths:
        - data/storage-view
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: access
    name: 外部接入
    binary: moox-access
    scope: any
    replicas: multi
    protected: false
    ports:
      - 11004
    health:
      kind: readyz
      port: 11014
      ready_body: '"ready":true'
    doctor:
      role: access
      description: 外部签名 tRPC 接入与重新签名转发
      duties:
        - 校验外部调用方签名、防重放与逐方法白名单
        - 以 access 身份转发原始请求字节
      inputs:
        - 外部调用方的签名 tRPC 请求
      outputs:
        - 主机网关返回的原始响应
      dependencies:
        - host-gateway
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - access/config/app.yaml
        - access/config/trpc_go.yaml
      writable_paths:
        - data/access
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
  - id: egress-proxy
    name: 出口代理
    binary: moox-egress-proxy
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11441
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.egress.Proxy
        port: 11440
        timeout_ms: 120000
        max_body_bytes: 33554432
        methods:
          - Do
          - ResolveDomains
        read_only_methods:
          - ResolveDomains
        acl:
          - methods:
              - Do
              - ResolveDomains
            callers:
              - collector
    doctor:
      role: egress-proxy
      description: 受限网络出口与 DNS 解析服务
      duties:
        - 按域名白名单代理 Collector 请求
        - 解析域名并返回连通性结果
      inputs:
        - Collector 的出口请求与域名解析请求
      outputs:
        - 上游响应与域名地址
      dependencies: []
      transport: reporter
      functional_observability: not_applicable
      config_paths:
        - egress-proxy/config/app.yaml
        - egress-proxy/config/trpc_go.yaml
      writable_paths:
        - data/egress-proxy
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: false
