      - path: trpc.moox.collector.MarketFetchRuntime
        port: 11422
        timeout_ms: 5000
        max_body_bytes: 4194304
        methods:
          - ClaimTimerBatch
        acl: []
    doctor:
      role: collector
      description: Market data collection planner and executor
      duties:
        - plan and execute collection tasks
        - 同步标的标签与属性
      inputs:
        - collector rules and market windows
      outputs:
        - committed collection tasks
      dependencies:
        - eventbus
        - storage-primary
        - cloudnode
      transport: reporter
      functional_observability: active
      config_paths:
        - collector/config/app.yaml
        - collector/config/trpc_go.yaml
      writable_paths:
        - data/collector
      recovery_action_ids:
        - inspect_health_check_input
        - restart_service_manually
      required_in_default_profile: true
  - id: cloudnode
    name: 云节点服务
    binary: moox-cloudnode
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11411
      ready_body: '"ready":true'
    services:
      - path: trpc.moox.cloudnode.CloudNodeMgr
        port: 11401
        console_name: cloudnode
        timeout_ms: 960000
        max_body_bytes: 33554432
        methods:
