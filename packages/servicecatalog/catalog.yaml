          # 下架名单与下架记录（全局，不分空间）：解除名单只给管理台（会一并取消进行中的下架处理）。
          - name: UnblockInstrument
            operators: [console]
          - name: ListBlockedInstruments
            read_only: true
          - name: ListInstrumentHolders
            read_only: true
          - name: ListDelists
