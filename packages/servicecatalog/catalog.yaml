              - SubmitDeployNodes
              - SubmitDeleteNodes
              - GetNodeBatchChange
              - BatchDeleteNodes
              - SubmitUpdateNodeRuntimeConfigs
              - ListCloudAccounts
              - CreateCloudAccount
              - UpdateCloudAccount
              - DeleteCloudAccount
              - ListCloudRegions
              - PreviewSCFFunctions
              - ImportSCFFunctions
              - GetPackageList
              - GetPackageDetail
              - DeletePackage
              - GetPackageDownloadURL
              - InitPackageUpload
              - CompletePackageUpload
            callers:
              - console
              - moox-cli
          - methods:
              - GetNodeList
              - InvokeFunction
              - GetNodeBatchChange
              - SubmitUpdateNodeRuntimeConfigs
            callers:
              - collector
          - methods:
              - CollectGarbage
            callers:
              - admin
    doctor:
      role: cloudnode
      description: Cloud job dispatch and execution coordinator
      duties:
        - dispatch and track cloud jobs
      inputs:
        - job items
      outputs:
        - job results
      dependencies:
        - eventbus
        - admin
      transport: reporter
      functional_observability: active
      config_paths:
        - cloudnode/config/app.yaml
        - cloudnode/config/trpc_go.yaml
      writable_paths:
        - data/cloudnode
      recovery_action_ids:
        - restart_service_manually
      required_in_default_profile: true
  - id: factor-mgr
    name: 因子管理服务
