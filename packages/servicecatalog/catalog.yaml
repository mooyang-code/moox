  - id: archive
    name: 归档服务
    binary: moox-archive
    scope: any
    replicas: single
    protected: false
    health:
      kind: readyz
      port: 11416
      ready_body: '"ready":true'
    doctor:
      role: archive
      description: Journal archive and materialization service
      duties:
        - archive journals and complete materialization
      inputs:
        - accepted journals
      outputs:
        - archive completions
      dependencies:
        - eventbus
