syntax = "proto3";

package trpc.moox.metrics;

option go_package = "github.com/mooyang-code/moox/packages/metricspb;metricspb";

enum ExpositionFormat {
  EXPOSITION_FORMAT_UNSPECIFIED = 0;
  EXPOSITION_FORMAT_PROMETHEUS_TEXT = 1;
}

message MetricSnapshot {
  uint32 schema_version = 1;
  uint32 collection_interval_seconds = 2;
  ExpositionFormat format = 3;
  // data 是 Prometheus 文本原文；传输压缩由事件信封层统一完成。
  bytes data = 4;
  uint32 metric_family_count = 5;
  uint32 sample_count = 6;
  bytes data_sha256 = 7;
}

message MetricReport {
  string service_name = 1;
  string instance_id = 2;
  string node_id = 3;
  string boot_id = 4;
  string service_version = 5;
  uint64 sequence = 6;
  MetricSnapshot snapshot = 7;
  // ready 是进程此刻的就绪判断，与它自己的 /readyz 用同一个判断函数；没有登记就绪判断的上报方（云函数）不带这个字段。
  optional bool ready = 8;
  // not_ready_reason 是未就绪的原因，就绪时为空。
  string not_ready_reason = 9;
  // lifecycle 是模块级生命周期（运行、暂停、恢复追赶）；没有生命周期的组件不带。
  ModuleLifecycle lifecycle = 10;
  // delegated 是管理端代为上报的外部程序（因子引擎由 factor-mgr、归档 worker 由 archive-mgr）：它们只给管理端发心跳。
  repeated DelegatedReport delegated = 11;
}

// ModuleLifecycle 是模块级生命周期状态（设计 3.8）。时间都是 RFC3339。
message ModuleLifecycle {
  // stage 是 running、paused、resuming。
  string stage = 1;
  string reason = 2;
  // 暂停详情（暂停与恢复追赶时存在）：类型 manual、system，原因、操作者与开始时间。
  string pause_kind = 3;
  string pause_reason = 4;
  string paused_by = 5;
  string paused_since = 6;
  // catchup 是恢复追赶的进度（恢复追赶中）。
  CatchupProgress catchup = 7;
}

// CatchupProgress 是恢复追赶的进度：从哪里开始、追到哪里、是否追平、被什么挡住。
message CatchupProgress {
  string since = 1;
  // target 是追赶目标（最新已完成周期），落后多少看它与已处理到的位置。
  string target = 2;
  int64 done = 3;
  int64 total = 4;
  bool caught_up = 5;
  string blocked_by = 6;
  // unfillable 是暂停区间里确认无法补采的周期数。
  int32 unfillable = 7;
  string message = 8;
}

// DelegatedReport 是管理端按最近一次心跳代为上报的一个外部程序。
message DelegatedReport {
  // service_name 是目录里的组件 ID（factor-engine、archive-worker）；Monitor 按组件名把它对到这个组件唯一的部署上。
  string service_name = 1;
  string instance_id = 2;
  string boot_id = 3;
  string service_version = 4;
  // last_heartbeat_at 是管理端最近一次接受它心跳的时刻（Unix 毫秒）；Monitor 按它判断是否停止上报。
  int64 last_heartbeat_at = 5;
  optional bool ready = 6;
  string not_ready_reason = 7;
  ModuleLifecycle lifecycle = 8;
}

// LogRecord 是一条重要日志：Error 及以上级别，或代码里显式标出的关键事件。
message LogRecord {
  // sequence 在一次进程启动内递增，和 LogReport 的 boot_id 一起唯一确定一条记录（重复投递靠它去重）。
  uint64 sequence = 1;
  int64 time_unix_nano = 2;
  // level：debug、info、warn、error、fatal。
  string level = 3;
  // event 是关键事件的名称；普通的错误日志为空。
  string event = 4;
  string message = 5;
  // caller 是打日志的代码位置（包/文件:行号）。
  string caller = 6;
  // fields 是日志带的结构化字段，值一律转成字符串。
  map<string, string> fields = 7;
  // merged_count 大于 0 表示在这条之前，同一代码位置另有这么多条日志因为太密被合并掉了。
  uint32 merged_count = 8;
}

// LogReport 是一个进程上报的一批重要日志。
message LogReport {
  string service_name = 1;
  string instance_id = 2;
  string node_id = 3;
  string boot_id = 4;
  repeated LogRecord records = 5;
}
