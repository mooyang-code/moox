syntax = "proto3";

package trpc.moox.trade.event;

option go_package = "github.com/mooyang-code/moox/packages/tradeeventpb;tradeeventpb";

message InstrumentWeightTarget {
  string instrument_id = 1;
  string target_weight = 2;
  // hold 为 true 表示保持该标的当前持仓数量不动（标的所在市场本期不可用或只缺上一根，策略暂时无法决策）；
  // target_weight 是预留的预算占用，不用于换算数量。
  bool hold = 3;
  // market_type 是该标的所属市场，必填：SPOT、SWAP 或 STOCK。同一个 instrument_id 可以按 SPOT、SWAP 各出现一次。
  string market_type = 4;
}

message LogicalAccountTargetWeightRequested {
  string target_id = 1;
  string instance_id = 2;
  string logical_account_id = 3;
  repeated InstrumentWeightTarget targets = 5;
  string session_id = 8;
  string strategy_id = 9;
  // bar_end_time 是这次目标所依据的 K 线收线时刻，valid_until 是目标的失效时刻（都是 Unix 毫秒，valid_until 晚于 bar_end_time）。
  int64 bar_end_time = 10;
  int64 valid_until = 12;
  // shadow 为真表示预热中的策略实例发出的影子目标：Trade 只完成换算并记录，不预留资金、不下单。
  bool shadow = 14;
  // session_started_at 是会话的开始时刻（毫秒，必填，Strategy 全库严格递增）：Trade 用它比较会话先后，
  // 开始时刻更晚的会话的目标覆盖较早会话的，不大于组合“关闭到”时刻的会话的目标不再接受。
  int64 session_started_at = 15;
}
