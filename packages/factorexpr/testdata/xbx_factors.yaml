# 生产因子库的 11 个因子（表达式写法）及其编译元数据。
# 测试断言推导出的输入列、输出列与回看（窗口参数按声明上限 120 取最坏情况）与生产一致。
- factor_id: bias
  inputs: [close]
  outputs: [bias]
  lookback: 120
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: close / ts_mean(close, window)

- factor_id: bias_q
  inputs: [close]
  outputs: [bias_q]
  lookback: 239
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_rank(close / ts_mean(close, window) - 1, window)

- factor_id: cci
  inputs: [close, high, low]
  outputs: [cci]
  lookback: 239
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      tp: (high + low + close) / 3
      m: ts_mean(tp, window)
    output: (tp - m) / (0.015 * ts_mean(abs(tp - m), window))

- factor_id: min_max
  inputs: [close, high, low]
  outputs: [min_max]
  lookback: 120
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      tp: (high + low + close) / 3
      lo: ts_min(tp, window)
    output: (tp - lo) / (ts_max(tp, window) - lo) - 0.5

- factor_id: quote_volume_mean
  inputs: [quote_volume]
  outputs: [quote_volume_mean]
  lookback: 120
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_mean(quote_volume, window)

- factor_id: quote_volume_mean_q
  inputs: [quote_volume]
  outputs: [quote_volume_mean_q]
  lookback: 239
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_rank(ts_mean(quote_volume, window), window)

- factor_id: volume_mean_q
  inputs: [volume]
  outputs: [volume_mean_q]
  lookback: 239
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    output: ts_rank(ts_mean(volume, window), window)

- factor_id: zf_abs_mean
  inputs: [close, high, low, open]
  outputs: [zf_abs_mean]
  lookback: 240
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      tp: (close + high + low) / 3
      amp: (high - low) / open
    output: ts_rank(ts_mean(where(pct_change(tp) > 0, amp, 0), window), window)

- factor_id: zf_mean_q
  inputs: [high, low, open]
  outputs: [zf_mean_q]
  lookback: 239
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      amp: (high - low) / open
    output: ts_rank(ts_mean(amp, window), window)

- factor_id: zf_std
  inputs: [close, high, low, open]
  outputs: [zf_std]
  lookback: 121
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      amp: (high - low) / open
    output: ts_std(where(pct_change(close) > 0, amp, -amp), window)

- factor_id: zscore_abs_mean_q
  inputs: [close]
  outputs: [zscore_abs_mean_q]
  lookback: 358
  spec: |
    params: {window: {type: int, min: 2, max: 120, default: 20}}
    let:
      m: ts_mean(close, window)
      s: ts_std(close, window)
    output: ts_rank(ts_mean(abs((close - m) / s), window), window)
