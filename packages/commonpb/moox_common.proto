syntax = "proto3";

package trpc.moox.common;

option go_package = "github.com/mooyang-code/moox/packages/commonpb;commonpb";

// RetInfo 表示通用接口返回状态。
message RetInfo {
  // code 是机器可读的返回码。
  ErrorCode code = 1;
  // msg 是面向人的返回说明。
  string msg = 2;
}

// TotalMode 控制接口是否计算精确总数。
enum TotalMode {
  // AUTO 表示由服务端按查询形态决定是否计算精确总数。
  AUTO = 0;
  // NONE 表示跳过精确总数计算。
  NONE = 1;
  // FORCE_EXACT 表示调用方要求计算精确总数。
  FORCE_EXACT = 2;
}

// TotalState 表示 PageResult.total 的可信状态。
enum TotalState {
  // UNKNOWN 表示未设置 total 状态。
  UNKNOWN = 0;
  // EXACT 表示 total 是精确总数。
  EXACT = 1;
  // SKIPPED 表示服务端有意跳过了精确总数计算。
  SKIPPED = 2;
}

// Page 表示分页请求参数。
message Page {
  // page 是页号，从 1 开始；为 0 时由服务端使用默认值。
  uint32 page = 1;
  // size 是每页条数；为 0 时由服务端使用默认值。
  uint32 size = 2;
  // cursor 是游标分页使用的上一页返回游标；普通分页可为空。
  string cursor = 3;
}

// PageResult 表示分页返回结果。
message PageResult {
  // page 是本次返回对应的页号。
  uint32 page = 1;
  // size 是本次返回采用的每页条数。
  uint32 size = 2;
  // total 是结果总数；无法低成本计算时可为 0。使用 uint32 以保证 JSON 输出为数字。
  uint32 total = 3;
  // has_more 表示是否还有更多结果。
  bool has_more = 4;
  // next_cursor 是下一页游标；普通分页可为空。
  string next_cursor = 5;
  // total_state 表示 total 是否为精确总数。
  TotalState total_state = 6;
}

// ErrorCode 表示跨模块通用错误码。
enum ErrorCode {
  option allow_alias = true;

  // SUCCESS 表示请求成功。
  SUCCESS = 0;
  // INVALID_PARAM 表示请求参数错误。
  INVALID_PARAM = 1;
  // NO_AUTH 表示未认证或认证失败。
  NO_AUTH = 2;
  // NO_PERMISSION 表示没有操作权限。
  NO_PERMISSION = 3;
  // INNER_ERR 表示服务内部错误。
  INNER_ERR = 4;
  // NOT_FOUND 表示通用资源不存在。
  NOT_FOUND = 5;
  // SPACE_NOT_FOUND 表示使用空间不存在。
  SPACE_NOT_FOUND = 5;
  // DATASET_NOT_FOUND 表示数据集不存在。
  DATASET_NOT_FOUND = 6;
  // SUBJECT_NOT_FOUND 表示数据对象不存在。
  SUBJECT_NOT_FOUND = 7;
  // FIELD_NOT_FOUND 表示字段不存在。
  FIELD_NOT_FOUND = 8;
  // FACTOR_NOT_FOUND 表示因子不存在。
  FACTOR_NOT_FOUND = 9;
  // VIEW_NOT_FOUND 表示查询视图不存在。
  VIEW_NOT_FOUND = 10;
  // VIEW_NOT_READY 表示查询视图尚未就绪。
  VIEW_NOT_READY = 11;
  // VIEW_COLUMN_NOT_FOUND 表示查询视图列不存在或无法解析。
  VIEW_COLUMN_NOT_FOUND = 12;
  // QUERY_SHAPE_UNSUPPORTED 表示不支持当前查询形态。
  QUERY_SHAPE_UNSUPPORTED = 13;
  // CONFLICT 表示资源状态或版本已发生并发冲突。
  CONFLICT = 14;
  // ENGINE_CAPABILITY_UNSUPPORTED 表示所选存储引擎不支持该能力。
  ENGINE_CAPABILITY_UNSUPPORTED = 16;
  // DIMENSION_VALUE_INVALID 表示业务维度取值不合法。
  DIMENSION_VALUE_INVALID = 17;
  // SUBJECT_NOT_IN_DATASET 表示数据对象未登记到目标数据集。
  SUBJECT_NOT_IN_DATASET = 18;
  // TRADE_SESSION_NOT_READY 表示交易账户的交易所会话还没有启动（新建账户要等运行时的周期检查），稍后重试即可；请求没有发到交易所。
  TRADE_SESSION_NOT_READY = 19;
  // TRADE_ADOPTION_REQUIRED 表示执行账户上已有持仓或挂单，加入组合需要确认接管这些已有仓位。
  TRADE_ADOPTION_REQUIRED = 20;
}

// ---- 模块级生命周期（批 4 设计 3.7）
//
// 采集、因子引擎、策略、Trade、因子管理、归档管理的服务各有 GetLifecycle、ControlLifecycle 两个方法，请求与响应都用下面这组消息，
// 服务端由 packages/lifecycle 的控制器实现，调用方（moox-cli lifecycle、system）经网关调用。前四个参与系统暂停，后两个不参与。
// 时刻都是 Unix 毫秒，0 表示没有。

// LifecyclePause 是暂停详情。
message LifecyclePause {
  // kind 是暂停类型：manual 手动暂停，只有用户 resume 才恢复；system 系统暂停，由 moox-cli system 带下来。
  string kind = 1;
  string reason = 2;
  // by 是操作者（cli:主机名、monitor:mute……）。
  string by = 3;
  int64 since = 4;
  // expires_at 非零表示到点自动恢复（只用于手动暂停）。
  int64 expires_at = 5;
}

// CatchupProgress 是恢复追赶的进度。
message CatchupProgress {
  // since 是暂停起点（最早的那次暂停），追赶从这里开始核对。
  int64 since = 1;
  // target 是追赶目标（最新已完成周期，按 data_time 的 RFC3339 文本，属数据坐标）；追赶期间会前移。
  string target = 2;
  int64 done = 3;
  int64 total = 4;
  bool caught_up = 5;
  // blocked_by 是被阻塞的原因（某个任务还没追平、上游模块尚未追平……）。
  string blocked_by = 6;
  // unfillable 是暂停区间里确认无法补采的周期数（源头确实没有）。
  int32 unfillable = 7;
  string message = 8;
}

// LifecycleSnapshot 是模块级生命周期的状态。
message LifecycleSnapshot {
  string module = 1;
  // stage 只有三种：running 运行、paused 暂停、resuming 恢复追赶。
  string stage = 2;
  string reason = 3;
  // since 是进入当前状态的时刻。
  int64 since = 4;
  // pause 在暂停与恢复追赶时存在；paused_since 是最早一次暂停的时间，恢复追赶据此核对缺失区间。
  LifecyclePause pause = 5;
  int64 paused_since = 6;
  // quiesced_at 是本次暂停收敛（在途操作结束）的时间，不早于 pause.since 才算本次暂停已收敛。
  int64 quiesced_at = 7;
  // released_at 是最近一次放行的时间。
  int64 released_at = 8;
  // catchup 是恢复追赶的进度（恢复追赶中才有）。
  CatchupProgress catchup = 9;
}

// GetLifecycleReq 读模块的生命周期状态。
message GetLifecycleReq {
  // refresh_catchup 为真时先推进一次恢复追赶（重读追赶进度，追平且设为自动放行的模块就此放行），返回的进度是最新的；
  // 为假时只读当前状态，不推进（追赶进度是最近一次推进的结果）。系统级恢复的栅栏读进度时为真。
  bool refresh_catchup = 1;
}

message GetLifecycleRsp {
  RetInfo ret_info = 1;
  LifecycleSnapshot lifecycle = 2;
}

// ControlLifecycleReq 是生命周期命令。
message ControlLifecycleReq {
  // command：pause 暂停、resume 恢复（先恢复追赶，追平后放行）、release 放行（恢复追赶已追平的模块回到运行）。
  string command = 1;
  // pause_kind：pause 时是暂停类型（默认 manual）；resume 时只恢复这一类暂停（为空不过滤，系统恢复传 system）。
  string pause_kind = 2;
  string reason = 3;
  string by = 4;
  // manual_release 用于 resume：追平后不自动放行，停在待放行等 release（系统级恢复用）。
  bool manual_release = 5;
  // expires_at 用于手动 pause：到点自动恢复（Unix 毫秒）。
  int64 expires_at = 6;
}

// ControlLifecycleRsp 是命令执行后的状态。命令在当前状态不允许时 ret_info 是 CONFLICT；暂停已生效、
// 但在途操作没有在时限内结束时 ret_info 是 INNER_ERR，说明以“已暂停，但在途操作没有结束”开头。
// 两种情况下 lifecycle 都是模块当前的状态。
message ControlLifecycleRsp {
  RetInfo ret_info = 1;
  LifecycleSnapshot lifecycle = 2;
}
