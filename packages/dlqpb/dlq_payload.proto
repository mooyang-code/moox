syntax = "proto3";

package trpc.moox.dlq;

option go_package = "github.com/mooyang-code/moox/packages/dlqpb;dlqpb";

// RejectedMessage is the typed payload carried by the operational DLQ topic.
// It stores the original bytes without interpreting the rejected business
// message, so the quarantine contract remains independent of business events.
message RejectedMessage {
  string rejected_by = 1;
  string original_message_id = 2;
  string original_subject = 3;
  string original_content_type = 4;
  bytes original_data = 5;
  string reason = 6;
  uint64 delivery_count = 7;
}
