syntax = "proto3";

package trpc.moox.storage.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mooyang-code/moox/packages/storagepb;storagepb";

// DatasetRowsUpserted is the public delta event for a Dataset. rows contains
// changed rows and changed fields, not a complete Dataset snapshot.
message DatasetRowsUpserted {
  string space_id = 1;
  string dataset_id = 2;
  repeated RowUpsert rows = 3;
  string write_source = 4;
  // Position assigned in the same durable DataNode outbox batch as the rows.
  // Sequence is comparable only within (source_node_id, source_store_id).
  string source_node_id = 5;
  uint64 source_sequence = 6;
  // Changes when the underlying DataNode store is recreated.
  string source_store_id = 7;
}

// CommittedPosition identifies one ordered write domain. Sequence is comparable
// only within (node_id, store_id).
message CommittedPosition {
  string node_id = 1;
  string store_id = 2;
  uint64 sequence = 3;
}

// CollectorPeriodCompleted marks a frozen collection set as terminal.
// complete means every expected subject succeeded; degraded keeps the full
// expected list and records failures.
message CollectorPeriodCompleted {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4;
  string batch_id = 5;
  string config_snapshot_id = 6;
  string expected_scope_ref = 7;
  repeated string expected_subject_ids = 8;
  repeated string failed_subjects = 9;
  repeated CommittedPosition committed_positions = 10;
  google.protobuf.Timestamp collected_at = 11;
}

// MergePeriodCompleted marks that every expected mdataset object reached a
// construction terminal state. Successful input commits precede this event.
message MergePeriodCompleted {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4;
  string batch_id = 5;
  string config_snapshot_id = 6;
  string expected_scope_ref = 7;
  repeated string expected_subject_ids = 8;
  repeated string failed_subjects = 9;
  repeated CommittedPosition committed_positions = 10;
  google.protobuf.Timestamp completed_at = 11;
}

message FactorBindingPeriodState {
  string binding_id = 1;
  string factor_id = 2;
  string status = 3;
  repeated string skipped_subjects = 4;
  repeated string failed_subjects = 5;
  string source_hash = 6;
}

// FactorPeriodComputed marks all frozen bindings for one Dataset period as
// terminal. Successful result patches precede this event in the same outbox.
message FactorPeriodComputed {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4;
  string batch_id = 5;
  string config_snapshot_id = 6;
  string expected_scope_ref = 7;
  repeated string expected_subject_ids = 8;
  repeated FactorBindingPeriodState bindings = 9;
  repeated CommittedPosition committed_positions = 10;
  google.protobuf.Timestamp computed_at = 11;
  string trigger_event_id = 12;
}

// ViewDataReady is published by View after a completion marker's required
// writes are readable in the named View's visible scope.
message ViewDataReady {
  string view_id = 1;
  string view_config_id = 2;
  string completion_event_id = 3;
  string dataset_id = 4;
  string status = 5;
  string visible_scope = 6;
  string frequency = 7;
  int64 period_time = 8;
  string failed_scope_ref = 9;
  repeated CommittedPosition committed_positions = 10;
  google.protobuf.Timestamp ready_at = 11;
}

// DatasetSyncPoint is an ordered import/catchup fence in a Dataset outbox.
message DatasetSyncPoint {
  string sync_point_id = 1;
  string request_id = 2;
  string dataset_id = 3;
  string source = 4;
}

message RowUpsert {
  RowKey key = 1;
  repeated FieldValue fields = 2;
  map<string, TypedValue> attributes = 3;
}

message RowKey {
  string space_id = 1;
  string dataset_id = 2;
  oneof kind {
    TimeSeriesRowKey time_series = 3;
    RecordRowKey record = 4;
  }
}

message TimeSeriesRowKey {
  string subject_id = 1;
  string freq = 2;
  string data_time = 3;
  string series_tag = 4;
}

message RecordRowKey {
  string record_id = 1;
  string version = 2;
}

message FieldValue {
  string field_id = 1;
  TypedValue value = 2;
}

message TypedValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    string time_value = 5;
    string json_value = 6;
    bytes bytes_value = 7;
    ValueList list_value = 8;
    NullValue null_value = 9;
  }
}

message ValueList {
  repeated TypedValue values = 1;
}

enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
  NULL_VALUE_NULL = 1;
}
