syntax = "proto3";

package trpc.moox.storage.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mooyang-code/moox/packages/storagepb;storagepb";

// DatasetRowsUpserted is the public delta event for a Dataset. rows contains
// changed rows and changed fields, not a complete Dataset snapshot.
message DatasetRowsUpserted {
  string space_id = 1;
  string dataset_id = 2;
  repeated RowUpsert rows = 3;
  string write_source = 4;
}

// DatasetPeriodCollected marks a terminal collection outcome for every
// expected subject in one Dataset period.
message DatasetPeriodCollected {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4;
  repeated string subject_ids = 5;
  repeated string failed_subjects = 6;
  google.protobuf.Timestamp collected_at = 7;
}

message ViewPeriodDatasetState {
  string dataset_id = 1;
  string status = 2;
  repeated string failed_subjects = 3;
}

// ViewSourcePeriodReady marks a source View period as readable by Factor.
message ViewSourcePeriodReady {
  string source_view_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4;
  repeated ViewPeriodDatasetState datasets = 5;
  repeated string primary_subjects = 6;
  google.protobuf.Timestamp ready_at = 7;
  // active_index_id identifies the source View generation that produced this
  // readiness decision. Consumers may pin reads to this generation.
  string active_index_id = 8;
  // active_index_revision identifies the in-place write revision used for the
  // readiness decision.
  uint64 active_index_revision = 9;
}

message FactorBindingPeriodState {
  string binding_id = 1;
  string factor_id = 2;
  string status = 3;
  repeated string skipped_subjects = 4;
  repeated string failed_subjects = 5;
  string source_hash = 6;
}

// FactorPeriodComputed marks all bindings for a result Dataset period as
// terminal. The result rows precede this event in the same DataNode outbox.
message FactorPeriodComputed {
  string source_view_id = 1;
  string result_dataset_id = 2;
  string frequency = 3;
  int64 period_time = 4;
  string status = 5;
  repeated FactorBindingPeriodState bindings = 6;
  google.protobuf.Timestamp computed_at = 7;
  string trigger_event_id = 8;
  // source_index_id is the source View generation used by Factor.
  string source_index_id = 9;
  // source_index_revision is the in-place source View revision used by Factor.
  uint64 source_index_revision = 10;
}

// ViewFactorPeriodReady marks the factor result View period as readable.
message ViewFactorPeriodReady {
  string source_view_id = 1;
  string result_view_id = 2;
  string frequency = 3;
  int64 period_time = 4;
  string status = 5;
  repeated FactorBindingPeriodState bindings = 6;
  google.protobuf.Timestamp ready_at = 7;
  // source_index_id is carried through Factor computation for causality.
  string source_index_id = 8;
  // result_index_id identifies the result View generation containing rows.
  string result_index_id = 9;
  // source_index_revision is carried through Factor computation for causality.
  uint64 source_index_revision = 10;
  // result_index_revision identifies the result View write revision containing rows.
  uint64 result_index_revision = 11;
}

// DatasetSyncPoint is an ordered import/catchup fence in a Dataset outbox.
message DatasetSyncPoint {
  string sync_point_id = 1;
  string request_id = 2;
  string dataset_id = 3;
  string source = 4;
}

message RowUpsert {
  RowKey key = 1;
  repeated FieldValue fields = 2;
  map<string, TypedValue> attributes = 3;
}

message RowKey {
  string space_id = 1;
  string dataset_id = 2;
  oneof kind {
    TimeSeriesRowKey time_series = 3;
    RecordRowKey record = 4;
  }
}

message TimeSeriesRowKey {
  string subject_id = 1;
  string freq = 2;
  string data_time = 3;
  string series_tag = 4;
}

message RecordRowKey {
  string record_id = 1;
  string version = 2;
}

message FieldValue {
  string field_id = 1;
  TypedValue value = 2;
}

message TypedValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    string time_value = 5;
    string json_value = 6;
    bytes bytes_value = 7;
    ValueList list_value = 8;
    NullValue null_value = 9;
  }
}

message ValueList {
  repeated TypedValue values = 1;
}

enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
  NULL_VALUE_NULL = 1;
}
