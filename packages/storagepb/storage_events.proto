syntax = "proto3";

package trpc.moox.storage.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mooyang-code/moox/packages/storagepb;storagepb";

// DatasetRowsUpserted is the public delta event for a Dataset. rows contains
// changed rows and changed fields, not a complete Dataset snapshot.
message DatasetRowsUpserted {
  string space_id = 1;
  string dataset_id = 2;
  repeated RowUpsert rows = 3;
  // Position assigned in the same durable DataNode outbox batch as the rows.
  // Sequence is comparable only within (node_id, store_id).
  string node_id = 5;
  uint64 sequence = 6;
  // Changes when the underlying DataNode store is recreated.
  string store_id = 7;
}

// CommittedPosition identifies one ordered write domain. Sequence is comparable
// only within (node_id, store_id).
message CommittedPosition {
  string node_id = 1;
  string store_id = 2;
  uint64 sequence = 3;
}

// DatasetPeriodCompleted 表示数据集的某一期已经完成。source 只描述“这一期是怎么判定完成的”，不是业务分类：
//   - ledger：DataNode 按登记的序列快照与截止时间判定（采集、重采样走序列账本）；
//   - producer：写入方自己报告（例如因子）。
// complete 表示每个标的都成功；degraded 保留完整标的清单并记录失败。
message DatasetPeriodCompleted {
  string dataset_id = 1;
  string frequency = 2;
  int64 period_time = 3;
  string status = 4; // complete | degraded
  string source = 5; // ledger | producer
  repeated string universe_subject_ids = 6;
  repeated string failed_subjects = 7;
  // committed_positions 是本期写入在 outbox 中的位置，View 用来确认数据已进入索引。
  repeated CommittedPosition committed_positions = 8;
  // snapshot_ref：ledger 来源时是序列快照引用。
  string snapshot_ref = 9;
  // cause_event_id：producer 来源时是触发本次计算的事件 ID，用于幂等查询。
  string cause_event_id = 10;
  google.protobuf.Timestamp completed_at = 11;
  // detail_type、detail 是写入方自定义的明细（不透明字节），Storage 原样保存并透传，不解析。
  string detail_type = 12;
  bytes detail = 13;
}

message ViewDataReady {
  string view_id = 1;
  string view_config_id = 2;
  string completion_event_id = 3;
  string dataset_id = 4;
  string status = 5;
  string visible_scope = 6;
  string frequency = 7;
  int64 period_time = 8;
  string failed_scope_ref = 9;
  repeated CommittedPosition committed_positions = 10;
  google.protobuf.Timestamp ready_at = 11;
  // 周期完成时复制冻结的标的全集，消费方不用再订阅一次完成事件就能锁定同一批成员。
  repeated string universe_subject_ids = 12;
  // detail_type、detail 原样透传周期完成事件里写入方自定义的明细（不透明字节）。
  string detail_type = 13;
  bytes detail = 14;
}

// CollectorKlineBackfilled announces, without row data, that K-line rows of a
// Dataset were written after their period had already ended: a backfill chunk
// was verified (origin auto, manual or force), or a resample wrote rows outside
// period tracking (origin resample). Consumers re-derive what depends on
// [start, end) for subject_ids. Consumers that read a View wait for
// sync_request_id first, because the View indexes rows asynchronously.
message CollectorKlineBackfilled {
  string dataset_id = 1;
  string frequency = 2;
  repeated string subject_ids = 3;
  // start is inclusive and end is exclusive.
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
  string origin = 6;
  string job_id = 7;
  // sync_request_id names the Dataset sync point appended before this event.
  string sync_request_id = 8;
  google.protobuf.Timestamp confirmed_at = 9;
}

// DatasetSyncPoint is an ordered import/catchup fence in a Dataset outbox.
message DatasetSyncPoint {
  string sync_point_id = 1;
  string request_id = 2;
  string dataset_id = 3;
  string source = 4;
}

message RowUpsert {
  RowKey key = 1;
  repeated FieldValue fields = 2;
  map<string, TypedValue> attributes = 3;
}

message RowKey {
  string space_id = 1;
  string dataset_id = 2;
  oneof kind {
    TimeSeriesRowKey time_series = 3;
    RecordRowKey record = 4;
  }
}

message TimeSeriesRowKey {
  string subject_id = 1;
  string freq = 2;
  string data_time = 3;
  string series_tag = 4;
}

message RecordRowKey {
  string record_id = 1;
  string version = 2;
}

message FieldValue {
  string field_id = 1;
  TypedValue value = 2;
}

message TypedValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    string time_value = 5;
    string json_value = 6;
    bytes bytes_value = 7;
    ValueList list_value = 8;
    NullValue null_value = 9;
  }
}

message ValueList {
  repeated TypedValue values = 1;
}

enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
  NULL_VALUE_NULL = 1;
}
