syntax = "proto3";

package trpc.moox.cloudjob;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mooyang-code/moox/packages/cloudjobpb;cloudjobpb";

message JobExecutionRequested {
  string job_id = 1;
  string job_item_id = 2;
  string job_type = 3;
  google.protobuf.Struct params = 4;
  int32 priority = 5;
  google.protobuf.Timestamp execute_at = 6;
}
