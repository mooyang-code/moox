syntax = "proto3";

package trpc.moox.hostgateway;

option go_package = "github.com/mooyang-code/moox/packages/gatewayroute/proto/gatewayroutegen;gatewayroutepb";

message DirectoryHost {
  string address = 1;
  string private_address = 2;
  string region = 3;
}

message ServiceHosts {
  repeated string host_ids = 1;
}

message ServiceDirectory {
  string version = 1;
  map<string, ServiceHosts> services = 2;
  map<string, DirectoryHost> hosts = 3;
}

message GetDirectoryReq {
  string current_version = 1;
}

message GetDirectoryRsp {
  bool changed = 1;
  string version = 2;
  map<string, ServiceHosts> services = 3;
  map<string, DirectoryHost> hosts = 4;
}

// Local bootstrap discovery; this service is registered on loopback only.
service Directory {
  rpc GetDirectory(GetDirectoryReq) returns (GetDirectoryRsp);
}
