syntax = "proto3";

package trpc.moox.marketfetch.event;

option go_package = "github.com/mooyang-code/moox/packages/marketfetchpb;marketfetchpb";

import "google/protobuf/timestamp.proto";

// MarketFetchBatchCompleted is the only event emitted by a short-lived
// market-fetch invocation. It contains storage-acknowledged item outcomes.
message MarketFetchBatchCompleted {
  string batch_id = 1;
  string schedule_id = 2;
  string batch_kind = 3;
  string dataset_id = 4;
  string frequency = 5;
  string region = 6;
  string node_id = 7;
  string request_id = 8;
  int32 planned_count = 9;
  int32 success_count = 10;
  int32 retry_count = 11;
  int32 permanent_failed_count = 12;
  string status = 13;
  string error_summary = 14;
  int64 duration_ms = 15;
  google.protobuf.Timestamp completed_at = 16;
  repeated MarketFetchItemResult items = 17;
}

message MarketFetchItemResult {
  string subject_id = 1;
  string symbol = 2;
  string target_data_time = 3;
  string outcome = 4;
  string error_type = 5;
  string error_summary = 6;
  string source_event_id = 7;
  string task_id = 8;
}
